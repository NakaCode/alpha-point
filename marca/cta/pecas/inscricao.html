<!doctype html>
<html lang="en-US" data-render="4k-native">
<head>
<meta charset="utf-8">
<title>Alpha Point · chamada de inscrição · a faixa mínima</title>
<!--
  A FAIXA MÍNIMA · a inscrição no meio do vídeo (4,5 s, só tela, sem som). É a peça do CANAL, do vídeo 2 em diante: o
  Lucas aprovou a faixa mínima refinada em 01/10/2026, 20:3x de Brasília ("Aprovo (Recomendado)"; marca/cta.md §3),
  com o giro da agulha que estava nas prévias. A regra de uso (o momento, quantas vezes, os comandos) está em
  marca/cta.md §4 a §8.
  O que mudou da versão 3 da proposta (marca/cta/propostas/c-faixa-minima/, fora do git): só os caminhos relativos
  das fontes e do símbolo, de ../../../ para ../../, porque a pasta subiu um nível (marca/cta/pecas/). O desenho, o
  tempo e o lugar são os que o Lucas aprovou, e o __info() ganhou o ponteiro para a regra.

  O desenho: uma faixa de 256 px de altura em duas peças, presas por um vão de 18 px inclinado a 12°, o corte da agulha.
    - A peça escura, em --painel (o cartão sobre --fundo, identidade §2), com um aro de --tinta a 18 %. É um
      paralelogramo: a ponta esquerda também é cortada a 12°, o que o rótulo de lugar (pílula --rotulo de cantos
      redondos) não tem. Dentro dela, à esquerda, a CÉLULA da agulha (--fundo), fechada à direita por um fio de --tinta
      a 18 % no mesmo corte de 12° (o tom do aro), com o símbolo em uma cor carregado de
      marca/logo/agulha/simbolo-tinta.svg (204 px de altura), e depois ALPHA POINT em Barlow Condensed 800, 112 px.
    - A peça clara, o botão "Subscribe" em Inter 700, 128 px (o alvo do rótulo, §4.1), que entra em contorno de
      --tinta e se enche de --tinta em 500 ms (§4.4), com a frente do preenchimento também a 12°. Um contorno de
      --tinta-escura a 60 %, 5 px por fora, separa o botão creme de fundo claro (o --papel do dado, foto clara).
    - Sem laranja: o símbolo vai em uma cor, como a marca d'água (§8). Sem vermelho, sino ou polegar.
  O lugar (§4.2): presa embaixo à direita, borda direita em x = 3622 (com o contorno, 3627) e base em y = 1718 (com a
  subida de 24 px e o contorno, 1747): 12 px de folga até a margem de 200 px (x 3640) e até o canto do YouTube
  (x ≥ 3440 e y ≥ 1760), longe da faixa do crédito (y ≥ 1880).
  ?lugar=cima: a mesma peça presa em cima à direita, com o topo em y = 200.
  O movimento (§4.4, com a saída espelhada):
    0,00  a peça escura entra: 24 px de subida em ease-out e a opacidade em curva suave (360 ms), que começa e
          termina perto de 0, sem estalo; a agulha assenta no norte num giro amortecido curto (0,05–0,95 s).
    0,12  o botão entra em contorno, do mesmo jeito; 0,90–1,40 se enche.
    fim−0,70 / fim−0,58  o botão sai, e depois a faixa: 400 ms, opacidade em curva suave e 24 px de descida.
    O primeiro e o último quadro do clipe ficam vazios; no 1º e no último quadro visível, a opacidade fica abaixo de 5 %.
  A página expõe window.render(t) (t em segundos; o mesmo t dá o mesmo quadro, em qualquer ordem), window.__pronto
  (a promessa de fontes e símbolo) e window.__info(). Parâmetros: ?lugar=cima, ?gira=0 (sem o giro), ?dur=<s> (a saída
  se ancora no fim; o padrão é 4,5), ?t=<s> (o instante mostrado ao abrir a página).
  Se uma fonte ou o símbolo não carregarem (a página copiada para outra pasta), __pronto rejeita e render() lança erro.
  Fontes de marca/fontes/ (SIL OFL 1.1).
-->
<style>
@font-face{font-family:"MarcaSec";src:url("../../fontes/barlowcondensed/BarlowCondensed-ExtraBold.ttf") format("truetype");font-weight:800;font-style:normal;font-display:block}
@font-face{font-family:"Marca";src:url("../../fontes/inter/Inter-VF.ttf") format("truetype");font-weight:100 900;font-style:normal;font-display:block}
html,body{margin:0;width:3840px;height:2160px;overflow:hidden;background:transparent}
svg{display:block}
.nome{font-family:"MarcaSec";font-weight:800;letter-spacing:0}
.acao{font-family:"Marca";font-weight:700;letter-spacing:0}
</style>
</head>
<body>
<svg id="palco" xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160"></svg>
<script>
(() => {
  // ---- a marca (identidade §2, §3, §4, §8) ----
  const COR = { painel: "#172338", fundo: "#0E1726", tinta: "#F4F1EA", escura: "#14181F" };
  const SIMBOLO = "../../logo/agulha/simbolo-tinta.svg";
  // a caixa do simbolo-tinta.svg: viewBox -254 -614 508 1008; a agulha ocupa 400 × 900 dela, com o centro em (0, -110)
  const SVG_W = 508, SVG_H = 1008, AG_ALT = 900, AG_LARG = 400;

  const P = new URLSearchParams(location.search);
  const LUGAR = P.get("lugar") === "cima" ? "cima" : "baixo";
  const GIRA = P.get("gira") !== "0";
  const DUR = Number(P.get("dur")) > 0 ? Number(P.get("dur")) : 4.5;

  // ---- a geometria (px do palco) ----
  const R = 3622;                    // borda direita do botão; o contorno escuro fecha em 3627 (12 px de folga até a margem de 200 px, x 3640)
  const H = 256;                     // altura da faixa (a agulha de 204 px com 26 px de respiro)
  const BASE = 1718, TOPO = 200;     // baixo: a base (com a subida e o contorno, 1747: 12 px de folga até o canto do YouTube); cima: o topo
  const yTop = LUGAR === "cima" ? TOPO : BASE - H, B = yTop + H;
  const TAN = Math.tan(12 * Math.PI / 180), SL = H * TAN;   // o corte de 12° da agulha, em pé
  const VAO = 18;                    // o vão entre as peças
  const NOME_PX = 112, ACAO_PX = 128;
  const AG_H = 204, AG_W = AG_H * AG_LARG / AG_ALT;
  const CEL = 168;                   // a largura da célula da agulha, na meia altura
  const PAD_NE = 52, PAD_ND = 60, PAD_A = 64;
  const ARO = 3, ARO_OP = 0.18, TRACO = 6, CONTORNO = 5, CONTORNO_OP = 0.6;

  // ---- o tempo (s) ----
  const SUB = 24, ENT = 0.36, SAI = 0.40;
  const T = { faixa: 0.00, acao: 0.12, giro: 0.05, giroDur: 0.90, enche: 0.90, encheDur: 0.50,
              saiAcao: DUR - 0.70, saiFaixa: DUR - 0.58 };

  const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("palco");
  const el = (tag, at, pai) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); (pai || svg).appendChild(e); return e; };
  const pts = (a) => a.map(([x, y]) => x.toFixed(2) + "," + y.toFixed(2)).join(" ");
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const fase = (t, t0, d) => clamp((t - t0) / d);
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  const easeInOut = (p) => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const suave = (p) => p * p * (3 - 2 * p);

  function falhar(msg) { window.__erro = msg; document.title = "ERRO: " + msg; throw new Error(msg); }
  function conferirFontes() {
    for (const [fam, spec, txt] of [["MarcaSec", `800 ${NOME_PX}px "MarcaSec"`, "ALPHA POINT"], ["Marca", `700 ${ACAO_PX}px "Marca"`, "Subscribe"]]) {
      const faces = [...document.fonts].filter((f) => f.family.replace(/["']/g, "") === fam);
      if (!faces.length || faces.some((f) => f.status !== "loaded") || !document.fonts.check(spec, txt))
        falhar(`a fonte ${fam} não carregou: os caminhos são relativos (../../fontes/), a página saiu da pasta dela?`);
    }
  }
  function carregarSimbolo() {
    return new Promise((ok, erro) => {
      const im = new Image();
      im.onload = () => (im.naturalWidth === SVG_W && im.naturalHeight === SVG_H) ? ok()
        : erro(new Error(`o símbolo mudou de caixa (${im.naturalWidth} × ${im.naturalHeight}; esperado ${SVG_W} × ${SVG_H}): confira marca/logo/agulha/simbolo-tinta.svg`));
      im.onerror = () => erro(new Error(`o símbolo não carregou (${SIMBOLO}): a página saiu da pasta dela?`));
      im.src = SIMBOLO;
    });
  }

  let L = null, N = {}, imgPronta = null;
  function montar() {
    const cv = document.createElement("canvas").getContext("2d");
    cv.font = `800 ${NOME_PX}px "MarcaSec"`; const nomeW = cv.measureText("ALPHA POINT").width, capN = cv.measureText("H").actualBoundingBoxAscent;
    cv.font = `700 ${ACAO_PX}px "Marca"`;    const acaoW = cv.measureText("Subscribe").width,   capA = cv.measureText("H").actualBoundingBoxAscent;
    const yMid = yTop + H / 2;
    // da direita para a esquerda: o botão, o vão, o nome, o fio da célula, a célula, a ponta
    const aMid = R - PAD_A - acaoW - PAD_A, aBot = aMid - SL / 2, aTop = aMid + SL / 2;
    const nMid = aMid - VAO, nBot = nMid - SL / 2, nTop = nMid + SL / 2;
    const nomeX = nMid - PAD_ND - nomeW;
    const dMid = nomeX - PAD_NE;
    const lMid = dMid - CEL;
    const agCx = lMid + CEL / 2, agCy = yMid;
    L = { yMid, aBot, aTop, agCx, agCy, x0: lMid - SL / 2 };

    const defs = el("defs", {});
    const placa = [[lMid + SL / 2, yTop], [nTop, yTop], [nBot, B], [lMid - SL / 2, B]];
    const botao = [[aTop, yTop], [R, yTop], [R, B], [aBot, B]];
    el("polygon", { points: pts(placa) }, el("clipPath", { id: "cPlaca" }, defs));
    el("polygon", { points: pts(botao) }, el("clipPath", { id: "cBotao" }, defs));
    N.encheP = el("polygon", { points: pts(botao) }, el("clipPath", { id: "cEnche" }, defs));

    // a peça escura: o paralelogramo, a célula da agulha, o aro, a agulha, o nome
    N.gFaixa = el("g", {});
    el("polygon", { points: pts(placa), fill: COR.painel }, N.gFaixa);
    el("polygon", { points: pts([[lMid + SL / 2, yTop], [dMid + SL / 2, yTop], [dMid - SL / 2, B], [lMid - SL / 2, B]]), fill: COR.fundo }, N.gFaixa);
    // o fio que fecha a célula, no mesmo corte de 12° e no mesmo tom do aro: sem ele, --fundo e --painel quase se fundem
    el("line", { x1: (dMid + SL / 2).toFixed(2), y1: yTop, x2: (dMid - SL / 2).toFixed(2), y2: B, stroke: COR.tinta, "stroke-opacity": ARO_OP, "stroke-width": ARO, "clip-path": "url(#cPlaca)" }, N.gFaixa);
    el("polygon", { points: pts(placa), fill: "none", stroke: COR.tinta, "stroke-opacity": ARO_OP, "stroke-width": 2 * ARO, "stroke-linejoin": "miter", "clip-path": "url(#cPlaca)" }, N.gFaixa);
    N.gAg = el("g", {}, N.gFaixa);
    const s = AG_H / AG_ALT;
    const img = el("image", { href: SIMBOLO, x: (agCx - SVG_W * s / 2).toFixed(2), y: (agCy - SVG_H * s / 2).toFixed(2), width: (SVG_W * s).toFixed(2), height: (SVG_H * s).toFixed(2) }, N.gAg);
    imgPronta = new Promise((ok, erro) => { img.addEventListener("load", ok); img.addEventListener("error", () => erro(new Error(`o símbolo não entrou no palco (${SIMBOLO})`))); });
    el("text", { x: nomeX.toFixed(2), y: (yMid + capN / 2).toFixed(2), class: "nome", "font-size": NOME_PX, fill: COR.tinta }, N.gFaixa).textContent = "ALPHA POINT";

    // a peça clara: o botão. O contorno escuro vai por baixo (só a metade de fora aparece).
    N.gAcao = el("g", {});
    el("polygon", { points: pts(botao), fill: "none", stroke: COR.escura, "stroke-opacity": CONTORNO_OP, "stroke-width": 2 * CONTORNO, "stroke-linejoin": "miter" }, N.gAcao);
    el("polygon", { points: pts(botao), fill: COR.painel }, N.gAcao);
    el("polygon", { points: pts(botao), fill: "none", stroke: COR.tinta, "stroke-width": 2 * TRACO, "stroke-linejoin": "miter", "clip-path": "url(#cBotao)" }, N.gAcao);
    const yA = yMid + capA / 2, xA = aMid + PAD_A;
    el("text", { x: xA.toFixed(2), y: yA.toFixed(2), class: "acao", "font-size": ACAO_PX, fill: COR.tinta }, N.gAcao).textContent = "Subscribe";
    const gCheio = el("g", { "clip-path": "url(#cEnche)" }, N.gAcao);
    el("polygon", { points: pts(botao), fill: COR.tinta }, gCheio);
    el("text", { x: xA.toFixed(2), y: yA.toFixed(2), class: "acao", "font-size": ACAO_PX, fill: COR.escura }, gCheio).textContent = "Subscribe";

    window.__info = () => ({ peca: "inscricao", regra: "marca/cta.md §4 a §8", duracao: DUR, lugar: LUGAR, gira: GIRA,
      caixa: { x0: +(lMid - SL / 2).toFixed(1), y0: yTop, x1: R, y1: B, contorno_ate: R + CONTORNO },
      agulha_px: AG_H, nome_px: NOME_PX, acao_px: ACAO_PX, nome_w: +nomeW.toFixed(1), acao_w: +acaoW.toFixed(1),
      mensagem_inteira_s: [+(T.acao + ENT).toFixed(2), +T.saiAcao.toFixed(2)],
      aviso: T.saiAcao < T.enche + T.encheDur + 1.5 ? "duração curta: o botão cheio fica menos de 1,5 s" : null });
  }

  // entra: 24 px de subida em ease-out, opacidade em curva suave (começa e termina perto de 0); sai espelhado, descendo
  function presenca(t, tIn, tOut) {
    const pi = fase(t, tIn, ENT), po = fase(t, tOut, SAI);
    return { op: suave(pi) * (1 - suave(po)), dy: SUB * (1 - easeOut(pi)) + SUB * easeInOut(po) };
  }

  window.render = function (t) {
    if (window.__erro) throw new Error(window.__erro);
    if (!L) throw new Error("a peça ainda não carregou: espere window.__pronto");
    if (!Number.isFinite(t)) throw new Error(`render(t): t precisa ser um número de segundos (veio ${t})`);
    const f = presenca(t, T.faixa, T.saiFaixa), a = presenca(t, T.acao, T.saiAcao);
    N.gFaixa.setAttribute("opacity", f.op.toFixed(4)); N.gFaixa.setAttribute("transform", `translate(0 ${f.dy.toFixed(2)})`);
    N.gAcao.setAttribute("opacity", a.op.toFixed(4)); N.gAcao.setAttribute("transform", `translate(0 ${a.dy.toFixed(2)})`);
    // a agulha assenta no norte: um giro curto e amortecido, uma vez, e para em 0° exato
    let ang = 0;
    if (GIRA) { const p = fase(t, T.giro, T.giroDur); ang = -12 * Math.exp(-3.5 * p) * Math.cos(2.3 * Math.PI * p) * (1 - Math.pow(p, 4)); }
    N.gAg.setAttribute("transform", `rotate(${ang.toFixed(3)} ${L.agCx.toFixed(2)} ${L.agCy.toFixed(2)})`);
    // o botão se enche da esquerda para a direita, com a frente inclinada como o corte
    const e = easeInOut(fase(t, T.enche, T.encheDur));
    const x0 = L.aBot - SL - 8, xb = L.aBot - 8 + e * (R + 8 - (L.aBot - 8) + SL);
    N.encheP.setAttribute("points", pts([[x0, yTop - 10], [xb + SL, yTop - 10], [xb, B + 10], [x0, B + 10]]));
  };

  window.__pronto = (async () => {
    try {
      await Promise.all([document.fonts.load(`800 ${NOME_PX}px "MarcaSec"`, "ALPHA POINT"), document.fonts.load(`700 ${ACAO_PX}px "Marca"`, "Subscribe")]);
    } catch (e) { /* a falha da fonte se diz abaixo, com a mensagem do canal */ }
    try {
      conferirFontes();
      await carregarSimbolo();
      montar();
      await imgPronta;
      window.render(Number(P.get("t")) >= 0 && P.get("t") !== null ? Number(P.get("t")) : 2.5);
    } catch (e) { if (!window.__erro) { window.__erro = e.message; document.title = "ERRO: " + e.message; } throw e; }
  })();
})();
</script>
</body>
</html>
