<!doctype html><html lang="en-US"><head><meta charset="utf-8"><title>Alpha Point · banner</title>
<!-- O banner do canal desde 19/11/2026: a proposta F, escolhida pelo Lucas ("F", ~00:5x). Ela veio do pedido dele ("O banner ainda está sem graça, quero algo mais moderno"): o mundo inteiro em
     pontos, de ponta a ponta, com o Pacífico no meio (é sobre ele que fica o nome) e as Américas, onde estão os lugares dos vídeos
     publicados, à direita. A terra é o Natural Earth 1:110m (domínio público), numa grade de 1,6875° (12 px;
     banner-pontos/terra-pontos.mjs). A agulha e as letras são as do banner de hoje, desenhadas; o laranja fica só na agulha
     (identidade §8). -->
<style>
@font-face{font-family:"MarcaSec";src:url("../../fontes/barlowcondensed/BarlowCondensed-ExtraBold.ttf") format("truetype");font-weight:800;font-style:normal;font-display:block}
@font-face{font-family:"Marca";src:url("../../fontes/inter/Inter-VF.ttf") format("truetype");font-weight:100 900;font-style:normal;font-display:block}
html,body{margin:0;width:2560px;height:1440px;overflow:hidden;background:#0E1726}
canvas,svg{position:absolute;left:0;top:0;display:block}
</style></head><body>
<canvas id="c" width="2560" height="1440"></canvas>
<svg id="marca" xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs><filter id="sombra" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#030712" flood-opacity="0.5"/></filter></defs>
</svg>
<script src="banner-pontos/terra-plano.js"></script>
<script src="banner-pontos/comum.js"></script>
<script>
const W = 2560, H = 1440, ctx = document.getElementById("c").getContext("2d");
const K = W / 360, LON0 = -160, LAT0 = 10;
const px = (lon) => 1280 + (lon - LON0) * K, py = (lat) => 720 - (lat - LAT0) * K;

// o fundo: marinho, com duas luzes largas (o verde-azulado à esquerda, a água à direita)
ctx.fillStyle = "#0A1221"; ctx.fillRect(0, 0, W, H);
for (const [x, y, rr, cor, a] of [[620, 560, 1150, "46,196,182", 0.2], [2020, 860, 1000, "120,180,235", 0.16], [1280, 720, 900, "20,40,66", 0.55]]) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, rr);
  g.addColorStop(0, `rgba(${cor},${a})`); g.addColorStop(1, `rgba(${cor},0)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// a terra em pontos; atrás do nome, ela se apaga
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
for (const [lon, lat] of TERRA_PLANO) {
  const X = px(lon), Y = py(lat);
  if (X < -8 || X > W + 8 || Y < -8 || Y > H + 8) continue;
  const d = ((X - 1280) / 760) ** 2 + ((Y - 730) / 200) ** 2;
  const a = 0.62 * (0.1 + 0.9 * sstep(0.55, 1.5, d));
  ctx.fillStyle = `rgba(175,216,246,${a.toFixed(3)})`;
  ctx.beginPath(); ctx.arc(X, Y, 2.5, 0, 2 * Math.PI); ctx.fill();
}

// os lugares dos vídeos
for (const l of BANNER.LUGARES) BANNER.lugar(ctx, px(l.lon), py(l.lat), 0.9);

// as bordas de cima e de baixo (só a TV as mostra) mais escuras
const ab = ctx.createLinearGradient(0, 0, 0, H);
ab.addColorStop(0, "rgba(6,11,21,0.75)"); ab.addColorStop(0.3, "rgba(6,11,21,0)");
ab.addColorStop(0.7, "rgba(6,11,21,0)"); ab.addColorStop(1, "rgba(6,11,21,0.75)");
ctx.fillStyle = ab; ctx.fillRect(0, 0, W, H);

BANNER.grao(ctx, W, H, 0.03);

BANNER.marca({ x: 1280, y: 730, nome: 176, frase: 48 });
</script>
</body></html>
