<!doctype html><html lang="en-US"><head><meta charset="utf-8"><title>Alpha Point · banner</title>
<style>
@font-face{font-family:"MarcaSec";src:url("../../fontes/barlowcondensed/BarlowCondensed-ExtraBold.ttf") format("truetype");font-weight:800;font-style:normal;font-display:block}
@font-face{font-family:"Marca";src:url("../../fontes/inter/Inter-VF.ttf") format("truetype");font-weight:100 900;font-style:normal;font-display:block}
html,body{margin:0;width:2560px;height:1440px;overflow:hidden;background:#0E1726}
svg{display:block}
#nome{font-family:"MarcaSec";font-weight:800;font-size:236px;letter-spacing:-0.01em}
#frase{font-family:"Marca";font-weight:500;font-size:62px;letter-spacing:0}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <rect width="2560" height="1440" fill="#0E1726"/>
  <!-- o fundo: relevo topográfico gerado pelo Lucas numa IA de imagem (09/10/2026), 2000×1116, cobrindo o quadro (corta ~10 px de cada lado) -->
  <image href="banner-fundo-topografico.jpg" x="0" y="0" width="2560" height="1440" preserveAspectRatio="xMidYMid slice"/>
  <g id="lockup" visibility="hidden">
    <g id="agulha"></g>
    <text id="nome" fill="#F4F1EA">ALPHA POINT</text>
    <text id="frase" fill="#F4F1EA" fill-opacity="0.8">Geography and geopolitics, on the map.</text>
  </g>
</svg>
<script>
const NORTE = "0,-560 171.78,-79.02 80.98,-59.72 0,-286.46 -94.28,-22.47 -200,0", SUL = "200,0 0,340 -155.55,75.57", H = 900, CY = -110, RAZAO = 0.4444444444444444;
document.fonts.ready.then(() => {
  const cv = document.createElement("canvas").getContext("2d");
  cv.font = '800 236px "MarcaSec"'; const capN = cv.measureText("H").actualBoundingBoxAscent;
  cv.font = '500 62px "Marca"'; const capF = cv.measureText("H").actualBoundingBoxAscent;
  const entre = 0.42 * capN;                        // da linha de base do nome à caixa alta da frase
  const bloco = capN + entre + capF;                // do topo da caixa alta do nome à linha de base da frase
  const yTopo = 719.5 - bloco / 2;                  // bloco centrado na área segura
  const ybN = yTopo + capN, ybF = ybN + entre + capF;
  const altAg = 1.3 * bloco, largAg = altAg * RAZAO, vao = 0.75 * capN;
  const nome = document.getElementById("nome"), frase = document.getElementById("frase");
  nome.setAttribute("x", largAg + vao); nome.setAttribute("y", ybN);
  frase.setAttribute("x", largAg + vao); frase.setAttribute("y", ybF);
  const s = altAg / H;
  document.getElementById("agulha").innerHTML = '<g transform="translate(' + (largAg / 2) + ' 719.5) scale(' + s + ') translate(0 ' + (-CY) + ')"><polygon points="' + NORTE + '" fill="#F5A524"/><polygon points="' + SUL + '" fill="#F4F1EA"/></g>';
  const n = nome.getComputedTextLength(), f = frase.getComputedTextLength();
  const total = largAg + vao + Math.max(n, f);
  const g = document.getElementById("lockup");
  g.setAttribute("transform", "translate(" + (1280 - total / 2).toFixed(2) + " 0)");
  g.setAttribute("visibility", "visible");
  document.title = JSON.stringify({ capN: +capN.toFixed(1), capF: +capF.toFixed(1), nome: +n.toFixed(1), frase: +f.toFixed(1), agulha: [+largAg.toFixed(1), +altAg.toFixed(1)], vao: +vao.toFixed(1), total: +total.toFixed(1), x0: +(1280 - total / 2).toFixed(1), topoAg: +(719.5 - altAg / 2).toFixed(1), baseAg: +(719.5 + altAg / 2).toFixed(1) });
});
</script>
</body></html>
