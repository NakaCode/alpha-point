    var a = map.project(AGU), b = map.project(ANEL);
    // a linha para na borda do anel (o raio + o halo), da costa até ele
    var dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy), fim = Math.max(0, len - 44) * u;
    var ex = a.x + dx / len * fim, ey = a.y + dy / len * fim;
    var d = "M" + a.x.toFixed(2) + " " + a.y.toFixed(2) + "L" + ex.toFixed(2) + " " + ey.toFixed(2);
    E("linha83Sob").setAttribute("d", d); E("linha83Sobre").setAttribute("d", d);
    E("linha83Ponto").setAttribute("cx", a.x.toFixed(2)); E("linha83Ponto").setAttribute("cy", a.y.toFixed(2));
    g.setAttribute("opacity", Math.min(1, u * 6).toFixed(3));
    return { a: a, b: b };
  }
  function aplicarRot83(t, L) {
    var el = E("rot83"); if (!el) return;
    var vin = eo(seg(t, CENA.rot83.entra, 0.3));
    if (vin <= 0 || !L) { mostrar(el, 0, 0, 0); return; }
    var mxp = (L.a.x + L.b.x) / 2, myp = (L.a.y + L.b.y) / 2;
    var w = el.offsetWidth, h = el.offsetHeight;
    var l = mxp + 80, tp = myp - h / 2 + (1 - vin) * 24;
    mostrar(el, vin * cl(naArea(l, tp, w, h) / 60, 0, 1), l, tp);
  }

  // ═══ O NÚMERO QUE DESCE (b1) ════════════════════════════════════════════════════════════════════════
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function aplicarFundo(t, pa) {
    var el = E("rotFundo"), F = CENA.fundo; if (!el) return;
    var vin = eo(seg(t, F.nasce, 0.15));
    if (vin <= 0 || !pa) { mostrar(el, 0, 0, 0); return; }
    var u = eo(seg(t, F.nasce, F.pousa - F.nasce));
    var num = t >= F.pousa ? 27487 : Math.round(27487 * u);
    E("rotFundoNum").textContent = fmt(num) + " FT";
    var l2 = E("rotFundoL2"), l2t = E("rotFundoL2t"), v2 = eo(seg(t, F.l2, 0.3));
    l2.style.height = (v2 * l2t.offsetHeight).toFixed(2) + "px";
    // a largura também cresce com a 2ª linha: antes dela, a pílula tem a largura do número (sem caixa vazia à direita do 27,487 FT);
    // o texto da 2ª linha só aparece depois de a largura chegar à dele
    var wNum = E("rotFundoNum").offsetWidth, wL2 = l2t.scrollWidth;
    l2.style.width = (wNum + Math.max(0, wL2 - wNum) * Math.min(1, v2 / 0.6)).toFixed(2) + "px";
    l2t.style.opacity = (v2 >= 1 ? 1 : Math.max(0, (v2 - 0.6) / 0.4)).toFixed(3);
    E("rotFundoL2t").style.transform = "translateY(" + ((1 - v2) * 24).toFixed(2) + "px)";
    // arte-4 (MA): presa pela borda DIREITA (a F.dx do anel), com o texto à direita: o número não anda para o lado quando a pílula
    // cresce, e cresce para a esquerda (a 2ª linha, MORE THAN 5 MI DEEP, mede ~1.390 px; a margem de 200 pede o anel a x ≥ 1.760)
    var l = pa.x + F.dx - el.offsetWidth, tp = pa.y + F.dy + F.desce * u;
    mostrar(el, vin, l, tp);
  }

  // ═══ OS CRÉDITOS (fora da câmera: o de mapa inteiro do 1º ao último quadro) ═══════════════════════════
  function aplicarCreditos(t) {
    // o crédito de mapa já está INTEIRO no 1º quadro em que o mapa aparece (identidade §4.2): o quadro 9 (0,3 s); antes, a foto de
    // s01 cobre o quadro inteiro e a faixa fica vazia (textos-tela, conserto 4 · item 9b)
    var vm = t >= CENA.credMapa - 0.015 ? 1 : 0, pm = E("credMapaPilula");
    if (pm) { pm.style.opacity = String(vm); pm.style.visibility = vm ? "visible" : "hidden"; }
    var v = eo(seg(t, CENA.credFonte, 0.3));
    E("credFonte").style.opacity = v.toFixed(3); E("credFonte").style.visibility = v > 0 ? "visible" : "hidden";
  }

  var opAntes = {};
  function opac(id, prop, v) { v = +(+v).toFixed(3); var k = id + "|" + prop; if (opAntes[k] === v) return; map.setPaintProperty(id, prop, v); opAntes[k] = v; }

  function aplicar(t) {
    if (!mapaCarregado) return;
    var cam = cameraAt(t);
    map.jumpTo(cam);
    var T = CENA.trecho, vt = eo(seg(t, T.entra, T.dura));
    opac("trecho-fill", "fill-opacity", vt * T.preench);
    opac("trecho-linha", "line-opacity", vt * 0.9);
    aplicarFoto(t);
    var L = aplicarLinha(t);
    var pa = aplicarAnel("anel", ANEL, t, CENA.anel.entra, null, CENA.anel.pulsos);
    aplicarRot83(t, L);
    aplicarFundo(t, pa);
    aplicarCreditos(t);
  }

  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }
  };

  // ═══ BLOCO COMUM M1 — a espera: os tiles do satélite, o fundo e as fontes de dados, e um quadro pintado ═══
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou. O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  var FONTES = ["base", "trecho", "entorno", "gebco"];
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!mapaCarregado || !map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) if (!map.getSource(FONTES[i]) || !map.isSourceLoaded(FONTES[i])) return false;
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = mapaCarregado && map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
</body>
