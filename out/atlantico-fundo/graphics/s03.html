  if (E("cred1")) E("cred1").innerHTML = TEXTOS.cred1;

  var T = { pousa: 1.42, rot: 0.467, cred: 0.467, agua: 1.837, aguaDur: 0.5, nivel: 2.10, cota: 2.4, abre: 2.412, abreDur: 0.35,
            setas: 2.66, luz: 1.96, repouso: DUR - 0.25 };

  // ── a geometria (px do palco) ──
  var YF = 1740;                          // o chão (o fundo da fossa)
  var H = 1420;                           // a altura desenhada do Everest (29,032 ft)
  var FR = 27487 / 29032;                 // a água cobre 94,678 % da altura (TA250)
  var YW = YF - H * FR;                   // a linha d'água: 395,57
  var YS = YF - H;                        // o cume: 320
  var X0 = 1500, W2 = 900;                // o cume em x 1500; o pé de 600 a 2400 (largura esquemática)
  var XL = 320, XR = 3420;                // as paredes do copo (o recorte do oceano)
  var D0 = -900;                          // a montanha começa 900 px acima do pouso (a metade de baixo à vista)

  // o perfil (u: −1 a 1 na largura; v: 0 no pé, 1 no cume), em contorno fechado pelo pé
  var PERFIL = [[-1,0],[-0.86,0.10],[-0.74,0.17],[-0.66,0.26],[-0.55,0.31],[-0.46,0.42],[-0.38,0.47],[-0.30,0.60],
    [-0.22,0.66],[-0.15,0.78],[-0.08,0.86],[-0.03,0.95],[0,1],[0.05,0.955],[0.11,0.90],[0.18,0.86],[0.26,0.79],[0.34,0.71],
    [0.44,0.60],[0.52,0.53],[0.60,0.42],[0.70,0.33],[0.80,0.22],[0.90,0.11],[1,0]];
  var CRISTAS = [[[0,1],[0.08,0.74],[0.15,0.55],[0.19,0.38]], [[-0.15,0.78],[-0.10,0.56],[-0.05,0.40]],
    [[-0.46,0.42],[-0.40,0.25],[-0.36,0.12]]];
  function px(p) { return [X0 + p[0] * W2, YF - p[1] * H]; }
  var contorno = PERFIL.map(function (p, i) { var q = px(p); return (i ? "L" : "M") + f2(q[0]) + "," + f2(q[1]); }).join(" ") + " Z";
  var cristas = CRISTAS.map(function (c) { return c.map(function (p, i) { var q = px(p); return (i ? "L" : "M") + f2(q[0]) + "," + f2(q[1]); }).join(" "); }).join(" ");
  ["monte", "somMonte", "mPoly"].forEach(function (k) { if (E(k)) E(k).setAttribute("d", contorno); });
  if (E("cristas")) E("cristas").setAttribute("d", cristas);

  // o copo: as paredes (do nível ao chão), o chão com a hachura do desenho técnico, a linha d'água, o ∇ e a hachura da água
  if (E("paredes")) E("paredes").setAttribute("d", "M" + XL + "," + f2(YW) + " L" + XL + "," + YF + " M" + XR + "," + f2(YW) + " L" + XR + "," + YF);
  if (E("chao")) E("chao").setAttribute("d", "M" + XL + "," + YF + " L" + XR + "," + YF);
  (function () {
    var d = ""; for (var x = XL + 24; x <= XR; x += 48) d += "M" + x + "," + (YF + 8) + " L" + (x - 26) + "," + (YF + 40) + " ";
    if (E("hachura")) E("hachura").setAttribute("d", d);
    var s = "", AG = [[560, 760], [760, 1400], [1150, 560], [2850, 920], [2620, 1540]];   // longe dos textos e do pé
    AG.forEach(function (c) { s += "M" + (c[0] - 36) + "," + c[1] + " L" + (c[0] + 36) + "," + c[1] + " M" + (c[0] - 24) + "," + (c[1] + 16) +
      " L" + (c[0] + 24) + "," + (c[1] + 16) + " M" + (c[0] - 12) + "," + (c[1] + 32) + " L" + (c[0] + 12) + "," + (c[1] + 32) + " "; });
    if (E("simbAgua")) E("simbAgua").setAttribute("d", s);
    if (E("linhaAgua")) E("linhaAgua").setAttribute("d", "M" + XL + "," + f2(YW) + " L" + XR + "," + f2(YW));
    var xn = 3100;   // o símbolo de nível (∇ sobre a linha e dois traços abaixo), a convenção do desenho técnico
    if (E("nivel")) E("nivel").setAttribute("d", "M" + (xn - 32) + "," + f2(YW - 52) + " L" + (xn + 32) + "," + f2(YW - 52) + " L" + xn + "," + f2(YW - 5) + " Z" +
      " M" + (xn - 26) + "," + f2(YW + 22) + " L" + (xn + 26) + "," + f2(YW + 22) + " M" + (xn - 12) + "," + f2(YW + 40) + " L" + (xn + 12) + "," + f2(YW + 40));
  })();
  // a cota: a linha de chamada do cume, a linha de cota (x 1640, entre a linha d'água e a do cume) e as setas abertas
  var XC = 1640, XE0 = X0 + 16, XE1 = 1696;
  if (E("cotaExt")) E("cotaExt").setAttribute("d", "M" + XE0 + "," + YS + " L" + XE1 + "," + YS);
  if (E("cotaSetas")) E("cotaSetas").setAttribute("d", "M" + (XC - 9) + "," + (YS + 18) + " L" + XC + "," + (YS + 2) + " L" + (XC + 9) + "," + (YS + 18) +
    " M" + (XC - 9) + "," + f2(YW - 18) + " L" + XC + "," + f2(YW - 2) + " L" + (XC + 9) + "," + f2(YW - 18));
  var LEN_AGUA = XR - XL, LEN_EXT = XE1 - XE0;

  // a MONTANHA: um controlador só, vertical. Desaceleração uniforme (força constante) de v0 = 2·|D0|/T até 0 no contato.
  function D(t) { var p = seg(t, 0, T.pousa); return D0 * (1 - p) * (1 - p); }

  // o TEXTO: entra em 300 ms (opacidade + 24 px de subida, ease-out) e fica PARADO; (x, y) = canto de cima à esquerda
  function texto(id, t, tin, x, y) {
    var e = E(id); if (!e) return;
    var pi = eo(seg(t, tin, 0.3));
    e.style.opacity = pi.toFixed(3);
    e.style.transform = "translate(" + f2(x) + "px," + f2(y + 24 * (1 - pi)) + "px)";
  }
  function credito(id, t, tin) { var e = E(id); if (e) e.style.opacity = eo(seg(t, tin, 0.3)).toFixed(3); }
  // a CÂMERA: push-in contínuo (0,0024/s, base 1,0) que PARA 250 ms antes do corte; a deriva do RIG segue; o still a 0,6
  function camera(t) {
    var c = E("cam"), s = 1 + 0.0024 * Math.min(t, T.repouso), dx = 6 * Math.sin(t * 0.23), dy = 4.8 * Math.sin(t * 0.17);
    if (c) c.style.transform = "scale(" + s.toFixed(5) + ") translate(" + f2(dx) + "px," + f2(dy) + "px)";
    var st = E("still"); if (st) st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ") translate(" + f2(dx * 0.6) + "px," + f2(dy * 0.6) + "px)";
  }
  function corre(id, len, p) { var e = E(id); if (!e) return; e.style.strokeDasharray = len.toFixed(1); e.style.strokeDashoffset = (len * (1 - p)).toFixed(1); }

  function cena(t) {
    t = t + 0.0005;
    camera(t);
    // a montanha pousa; a máscara anda com ela (um transform só para os dois)
    var d = D(t), tr = "translate(0," + f2(d) + ")";
    var g = E("gMonte"); if (g) g.setAttribute("transform", tr);
    var m = E("mPoly"); if (m) m.setAttribute("transform", tr);
    // a luz: atrás do meio da montanha, 120 ms atrás dela; depois sobe ao cume (a ponta que sobra)
    var yMeio = YF - 0.45 * H + D(Math.max(0, t - 0.12));
    var ly = lerp(yMeio, YS + 40, eb(seg(t, T.luz, 0.8)));
    var lz = E("luz"); if (lz) { lz.style.setProperty("--luz-x", (X0 + 140) + "px"); lz.style.setProperty("--luz-y", f2(ly + 140) + "px"); }
    // a linha d'água se desenha de lado a lado em "and its top"; o ∇ quando ela passa por ele
    corre("linhaAgua", LEN_AGUA, eo(seg(t, T.agua, T.aguaDur)));
    var la = E("linhaAgua"); if (la) la.style.opacity = t >= T.agua ? "1" : "0";
    var nv = E("nivel"); if (nv) nv.style.opacity = (0.5 * eo(seg(t, T.nivel, 0.25))).toFixed(3);
    // a cota abre como um compasso em "one": a linha de cota sobe da água ao cume; as setas fecham; a chamada corre ao número
    var pa = eo(seg(t, T.abre, T.abreDur));
    var cd = E("cotaDim"); if (cd) { cd.setAttribute("d", "M" + XC + "," + f2(YW) + " L" + XC + "," + f2(YW - (YW - YS) * pa)); cd.style.opacity = t >= T.abre ? "1" : "0"; }
    corre("cotaExt", LEN_EXT, eo(seg(t, T.abre, 0.3)));
    var ce = E("cotaExt"); if (ce) ce.style.opacity = t >= T.abre ? "1" : "0";
    var cs = E("cotaSetas"); if (cs) cs.style.opacity = eo(seg(t, T.setas, 0.1)).toFixed(3);
    // os textos
    texto("rotMonte", t, T.rot, 2300, 1116);
    texto("rotCota", t, T.cota, 1712, 184);
    credito("cred1", t, T.cred);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  // O GANCHO DE MEDIDA (só leitura, do DOM): o pé da montanha contra o chão, e a fração de fora na tela
  window.__s03peca = function (t) {
    t = clamp(+t || 0, 0, DUR); window.__renderAt(t);
    // a geometria (getBBox, sem o traço) levada à tela pela matriz de cada elemento (getScreenCTM: a câmera e o pouso juntos)
    function tela(id, x, y) { var el = E(id), m = el.getScreenCTM(), p = el.ownerSVGElement.createSVGPoint(); p.x = x; p.y = y; return p.matrixTransform(m); }
    var bm = E("monte").getBBox(), bc = E("chao").getBBox(), ba = E("linhaAgua").getBBox();
    var pe = tela("monte", X0, bm.y + bm.height).y, cume = tela("monte", X0, bm.y).y;
    var chao = tela("chao", X0, bc.y).y, agua = tela("linhaAgua", X0, ba.y).y;
    return { t: t, D: D(t), pe_menos_chao_px: +(pe - chao).toFixed(3), fracao_coberta: +((pe - agua) / (pe - cume)).toFixed(5),
             fora_px: +(agua - cume).toFixed(2) };
  };
  window.__renderAt(0);
})();
</script>
</body>
</html>
