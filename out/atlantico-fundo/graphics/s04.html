CANAL ALPHA POINT — O ATLÂNTICO (vídeo 4, atlantico-fundo), CENA s04 (14,367 → 21,9 s do master; 7,533 s). Gancho, o "But".
  "When you think "deepest ocean," you think Mariana. But that's the Pacific, about nine thousand five hundred miles away."
  ARTE-4 (mapista, lote MA, tarefa atlantico-fundo-arte-4, 29/10/2026; o lote de consertos; textos-tela bfa9e5d1). VALE SOBRE O QUE
    ESTÁ ABAIXO: · os créditos de mapa numa pílula só, MapTiler em cima e GEBCO embaixo (a ordem do textos-tela; Sala, qualidade-1,
    pergunta 13); a linha da MapTiler some e volta com o satélite (_condicao), fechando e abrindo a altura dela em 300 ms; · a fonte do
    '≈ 9,500 MI', 'Source: Bongiovanni et al., 2021' (conserto 4 · item 8 e 4b), entra em 300 ms em 5,266 e fica até o fim, na pílula
    dela, 8 px acima da dos mapas (na P0 do fim a faixa chega a 3 linhas, como o textos-tela prevê); · o 'PACIFIC' esmaece em 300 ms,
    de 6,2 a 6,5 s, antes de o voo de volta o levar à margem (antes sumia em menos de 0,1 s). A câmera e a P0 do último quadro não
    mudaram: window.__cameraAt(7.5) = { center: [-65.8, 19.4], zoom: 7.5507, bearing: 0, pitch: 0 }.

  na grafia; regencia.json 304ad420 (s04 › beats[0] e [1]) no TEMPO e no exige; o conceito beff3d33 na direção e no fluxo (a POSE
  P0 do último quadro). Plana, em Mercator, sem globo (Sala, decisões 2 e 4).

  A BASE (o bloco comum do M1, igual na s02 e na s07, mais a vista do mundo):
    · o satélite da MapTiler (perfil maptiler), no tratamento C da identidade §6 (brilho 0,92, saturação 0, contraste +0,25);
    · o fundo do Caribe pela GEBCO 2026 (_media/base/gebco-caribe.png), num <canvas> com as bordas esmaecidas (72 px da imagem a
      leste e a oeste, 60 ao norte e ao sul), por cima do satélite: a terra fica no satélite;
    · a VISTA DO MUNDO pela GEBCO 2026 (_media/base/gebco-mundo-relevo.jpg, o WMS GEBCO_LATEST, terra e mar), escurecida ao
      escurecida ao tratamento do canal na pintura da camada (brilho máx. 0,42, saturação −0,45), em 16 peças (90° × ¼ da altura,
      1023 px cada, fora da potência de 2: em potência de 2 a textura sai preta), por cima das duas; ela entra com o recuo
      (na ida, opacidade 0 do zoom 7,65 para cima e 1 do 7,15 para baixo, para cobrir logo a borda do recorte do Caribe que o recuo
      traz ao quadro; na volta, 0 de 7,5 para cima e 1 de 6,7 para baixo: na P0, a 7,5507, ela já saiu) e sai na volta. Com ela inteira, o satélite fica DESLIGADO
      (visibility none: nenhum tile da MapTiler no quadro nem pedido), e a linha '© MapTiler © OpenStreetMap contributors' sai
      (textos-tela, _regras_de_serie: "numa vista do mundo só com a grade GEBCO, a linha da MapTiler só se houver tile dela no
      quadro"). Ela está inteira em todo quadro em que algum pixel do satélite se vê: sai 0,3 s DEPOIS de o satélite apagar e
      volta 0,3 s ANTES de ele acender.
    · o ENTORNO: fora do recorte do Caribe (a P0 vai de 73,0 a 58,6°W, e ele de 72,5 a 59,0°W), o mar da GEBCO pela
      _media/base/gebco-atlantico-relevo.jpg (o WMS GEBCO_LATEST, 21 px/grau), recortado de 80°W a 50°W e de 10°N a 29°N, só onde a
      cor é de mar (azul acima do vermelho e do verde) e um pixel (~5 km) para dentro dele, para a grade grossa nunca pintar sobre
      a costa do satélite, sem o miolo do recorte do Caribe, com a borda esmaecida e escurecido para casar com a rampa
      do recorte (brilho máx. 0,34: o mar fundo cru (50,89,135) sai (17,30,46), e o do recorte é (18,29,46); _tmp/arte-1/M1/
      amostra-wms.py), entre o satélite e o recorte: onde o
      recorte esmaece, o fundo continua (mais grosso) em vez de virar faixa preta. Proposta à Sala: o recorte gebco-caribe refeito
      de 75°W a 58°W (a cesta da GEBCO já tem a grade), e a P0 sai inteira na grade fina.
  O ARCO: o grande círculo entre o Challenger Deep (challenger-deep, 11,369°N 142,587°E; S01 Tabela 1) e o anel do ponto mais fundo
    do Atlântico (ponto-mais-fundo-atlantico, 19,712°N 67,311°W), calculado NA CENA pela interpolação esférica dos dois pontos reais
    (a geodésica no WGS84, gravada no challenger-deep.js, dá 15.269,55 km = 9.488 mi; a voz diz "about 9,500"): não é feição desenhada,
    é a distância entre dois pontos lidos. Ele vai pelo leste, pelo Pacífico (Δλ 150°), como o caminho mais curto.

  O QUE A CENA FAZ (a câmera nunca para; norte para cima, sem inclinar):
    b0 (0–3,533; "When you think "deepest ocean," you think Mariana."):
      · 0–2,45: a câmera sai do Atlântico (o anel de Porto Rico, z 7,65) e recua até o mundo quase inteiro caber (z 3,15, centro
        125°W 15°N: das Marianas, à esquerda, à África, à direita), van Wijk com cúbica de entrada e saída; depois deriva devagar;
      · 2,528 ('Mariana.'): a Fossa das Marianas (fossa-marianas, a isóbata de 7.000 m da GEBCO, 4 partes) acende em --neutro como
        região (500 ms; o traço de 12 px sobre o contorno escuro de 24, porque na escala do mundo ela tem poucos px); 2,5: a pílula 'Mariana Trench' (caixa normal: fossa) embaixo da ponta sul dela, até 5,933.
    b1 (3,533–7,533; "But that's the Pacific, about nine thousand five hundred miles away."):
      · 3,553 ('But'): OUTRA VISTA, recuo + deslocamento (z 3,15 → 2,95, centro → 142°W 22°N, sobre o Pacífico, os dois pontos no

      · 4,133 ('Pacific,'): a pílula 'PACIFIC' (caixa alta) no Pacífico aberto (130°W 0°), ao sul do arco;
      · 5,266 ('nine'): '≈ 9,500 MI' entra e conta até pousar em 'miles' (6,49), presa à TELA à direita do fim do arco (Porto Rico) na

        com a câmera (esmaece antes de cruzar a margem). O ÚLTIMO QUADRO (t = 7,5) é a P0 exata: só a base (satélite + GEBCO), o anel

            "raster-brightness-max": 0.42, "raster-saturation": -0.45, "raster-opacity": 0, "raster-opacity-transition": { duration: 0, delay: 0 } } }, "fossa-sob");
        });
      } catch (e) { return falhar("não consegui montar o fundo da GEBCO: " + e.message); }
      mapaCarregado = true;
      window.__renderAt(0);
      map.once("idle", function () { if (!window.__erroCena) resolverPronto(true); });
    }, function (e) { falhar(e.message); });
  });

  // ═══ BLOCO COMUM M1 — o anel ════════════════════════════════════════════════════════════════════════
  var SVGNS = "http://www.w3.org/2000/svg";
  function svgEl(tag, at, pai) { var el = document.createElementNS(SVGNS, tag); for (var k in at) el.setAttribute(k, at[k]); if (pai) pai.appendChild(el); return el; }
  function criarAnel(id) {
    var g = svgEl("g", { id: id, "class": "anel", opacity: "0" }, E("ov"));
    svgEl("circle", { "class": "halo", cx: 0, cy: 0, r: 28, "stroke-width": 30 }, g);
    svgEl("circle", { cx: 0, cy: 0, r: 28, "stroke-width": 10 }, g);
    return g;
  }
  function aplicarAnel(id, ll, v) {
    var g = E(id); if (!g) return null;
    var pa = map.project(ll);
    g.setAttribute("transform", "translate(" + pa.x.toFixed(2) + " " + pa.y.toFixed(2) + ")");
    g.setAttribute("opacity", v.toFixed(3));
    return pa;
  }
  criarAnel("anel");

  function naArea(l, tp, w, h) {
    var r = l + w, b = tp + h;
    return Math.min(l - 200, 3640 - r, tp - 160, 1880 - b, Math.max(3440 - r, 1760 - b));
  }
  function mostrar(el, v, l, tp) {
    el.style.opacity = v.toFixed(3);
    el.style.visibility = v > 0.001 ? "visible" : "hidden";
    el.style.transform = "translate(" + l.toFixed(2) + "px," + tp.toFixed(2) + "px)";
  }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  function aplicarArco(t) {
    var A = CENA.arco, u = eio(seg(t, A.t0, A.t1 - A.t0)), g = E("arco");
    var v = (u > 0 ? 1 : 0) * (1 - eio(seg(t, A.sai, DUR - A.sai)));
    if (u <= 0 || v <= 0.001) { g.setAttribute("opacity", "0"); return; }
    var n = ARCO.pts.length - 1, ate = u * n, d = "";
    for (var i = 0; i <= Math.floor(ate); i++) { var p = map.project(ARCO.pts[i]); d += (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1); }
    if (ate < n) {
      var i0 = Math.floor(ate), f = ate - i0, a = ARCO.pts[i0], b = ARCO.pts[i0 + 1];
      var q = map.project([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]); d += "L" + q.x.toFixed(1) + " " + q.y.toFixed(1);
    }
    E("arcoSob").setAttribute("d", d); E("arcoSobre").setAttribute("d", d);
    g.setAttribute("opacity", v.toFixed(3));
  }
  function aplicarRotulos(t) {
    // 'Mariana Trench': embaixo da ponta sul da fossa, centrada nela (o mapa a leva; esmaece antes da margem)
    var R = CENA.rotMariana, el = E("rotMariana");
    var vin = eo(seg(t, R.entra, 0.3)), vout = 1 - eio(seg(t, R.sai, 0.3)), v = vin * vout;
    if (v > 0.001) {
      var p = map.project([(FOSSA_BB.x0 + FOSSA_BB.x1) / 2, FOSSA_BB.y0]), w = el.offsetWidth, h = el.offsetHeight;
      var l = p.x - w / 2, tp = p.y + 70 + (1 - vin) * 24;
      mostrar(el, v * cl(naArea(l, tp, w, h) / 60, 0, 1), l, tp);
    } else mostrar(el, 0, 0, 0);
    // 'PACIFIC': sobre o Pacífico, ao sul do arco
    // arte-4 (MA): esmaece em 300 ms (6,2–6,5) antes de o voo de volta o levar à margem: antes sumia em < 0,1 s (qualidade-1, motion)
    var RP = CENA.rotPacifico, ep = E("rotPacifico"), vp = eo(seg(t, RP.entra, 0.3)) * (1 - eio(seg(t, RP.sai, 0.3)));
    if (vp > 0.001) {
      var pp = map.project(RP.ll), wp = ep.offsetWidth, hp = ep.offsetHeight;
      var lp = pp.x - wp / 2, tpp = pp.y - hp / 2 + (1 - vp) * 24;
      mostrar(ep, vp * cl(naArea(lp, tpp, wp, hp) / 60, 0, 1), lp, tpp);
    } else mostrar(ep, 0, 0, 0);
    // '≈ 9,500 MI': presa à TELA, abaixo do alto do arco na pose C; conta de 'nine' a 'miles'
    var RD = CENA.rotDist, ed = E("rotDist");
    var vd = eo(seg(t, RD.entra, 0.3)) * (1 - eio(seg(t, RD.sai, DUR - RD.sai)));
    if (vd > 0.001) {
      var uc = eo(seg(t, RD.entra, RD.pousa - RD.entra));
      ed.textContent = "≈ " + fmt(t >= RD.pousa ? 9500 : Math.round(9500 * uc / 100) * 100) + " MI";
      var wd = ed.offsetWidth, hd = ed.offsetHeight;
      mostrar(ed, vd, DIST_TELA.x + RD.dx, DIST_TELA.y + RD.dy - hd / 2 + (1 - eo(seg(t, RD.entra, 0.3))) * 24);
    } else mostrar(ed, 0, 0, 0);
  }
  function aplicarCreditos(t) {
    E("credGebco").style.opacity = "1"; E("credGebco").style.visibility = "visible";
    // a da MapTiler: inteira enquanto o satélite se vê; sai 0,3 s depois de ele apagar e volta 0,3 s antes de ele acender
    var v = 1;
    if (SAT.apaga != null) {
      var fimSaida = SAT.apaga + 0.3, iniVolta = SAT.volta != null ? SAT.volta - 0.3 : Infinity;
      if (t >= SAT.apaga && t < iniVolta) v = 1 - eio(seg(t, SAT.apaga, 0.3));
      if (SAT.volta != null && t >= iniVolta) v = eio(seg(t, iniVolta, 0.3));
      if (t >= fimSaida && t < iniVolta) v = 0;
    }
    var cm = E("credMapa");
    if (!LINHA_CRED && E("credGebco")) LINHA_CRED = E("credGebco").offsetHeight;   // uma linha a 60 px: 69 px
    if (cm) {
      cm.style.opacity = v.toFixed(3); cm.style.visibility = v > 0.001 ? "visible" : "hidden";
      // a altura da linha fecha e abre com ela (a pílula não fica com uma linha vazia em cima)
      cm.style.height = v >= 0.999 ? "" : (v * LINHA_CRED).toFixed(2) + "px";
    }
    // a fonte do ≈ 9,500 MI: entra em 300 ms com o número e fica até o fim, na pílula dela, 8 px acima da dos mapas
    var cf = E("credFonte"), pm = E("credMapaPilula");
    if (cf && pm) {
      var vf = eo(seg(t, CENA.credFonte.entra, 0.3));
      cf.style.opacity = vf.toFixed(3); cf.style.visibility = vf > 0.001 ? "visible" : "hidden";
      cf.style.bottom = (24 + pm.offsetHeight + 8).toFixed(2) + "px";
    }
  }
  var LINHA_CRED = 0;

  var opAntes = {}, visAntes = null;
  function opac(id, prop, v) { v = +(+v).toFixed(3); var k = id + "|" + prop; if (opAntes[k] === v) return; map.setPaintProperty(id, prop, v); opAntes[k] = v; }

  function aplicar(t) {
    if (!mapaCarregado) return;
    var cam = cameraAt(t);
    map.jumpTo(cam);
    var mo = mundoOp(cam.zoom, t);
    MUNDO_PECAS.forEach(function (pc) { opac(pc.id, "raster-opacity", mo); });
    var satVis = mo < 0.999 ? "visible" : "none";
    if (satVis !== visAntes) { map.setLayoutProperty("base", "visibility", satVis); map.setLayoutProperty("gebco", "visibility", satVis); map.setLayoutProperty("entorno", "visibility", satVis); visAntes = satVis; }
    var vf = eo(seg(t, CENA.fossa.entra, CENA.fossa.dura));
    opac("fossa-fill", "fill-opacity", vf * 0.9);
    opac("fossa-linha", "line-opacity", vf);
    opac("fossa-sob", "line-opacity", vf);
    aplicarAnel("anel", ANEL, 1);
    aplicarArco(t);
    aplicarRotulos(t);
    aplicarCreditos(t);
  }

  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }
  };

  // ═══ BLOCO COMUM M1 — a espera ══════════════════════════════════════════════════════════════════════
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou. O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  var FONTES = ["base", "fossa", "entorno", "gebco"].concat(MUNDO_PECAS.map(function (pc) { return pc.id; }));
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!mapaCarregado || !map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) {
            if (!map.getSource(FONTES[i])) return false;
            if ((FONTES[i] === "base" || FONTES[i] === "entorno") && map.getLayoutProperty(FONTES[i], "visibility") === "none") continue;   // desligado: nada a esperar
            if (!map.isSourceLoaded(FONTES[i])) return false;
          }
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = mapaCarregado && map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
</body>
</html>
