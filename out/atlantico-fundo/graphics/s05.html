CANAL ALPHA POINT — O ATLÂNTICO (vídeo 4, atlantico-fundo), CENA s05 (21,9 → 29,933 s do master; 8,033 s). Gancho, S6.
  "In nineteen sixty-four, a crew in a French deep-diving craft descended into the Puerto Rico Trench and reported a crowd of fish."
  Mapista, lote M1 (tarefa atlantico-fundo-arte-2), 29/10/2026: cena NOVA. O que manda: textos-tela.json b034414f (s05) no QUE e na
  grafia, e as _instrucoes_para_a_arte TA253 e TA254; regencia.json (s05 › beats[0..2]) no TEMPO e no exige; o conceito (s05) na
  direção. Plana, norte para cima, sem inclinar e sem órbita (Sala: os mapas planos deste vídeo). Sem relevo.
  Word-lock (words.json, −21,9 s): 'In' 0,010 · 'nineteen' 0,165 · 'sixty-four,' 0,485–1,340 · 'crew' 1,705 · 'French' 2,215 ·
  'deep-diving' 2,565 · 'craft' 3,235–3,605 · 'descended' 3,685 · 'into' 4,245 · 'Puerto' 4,565 · 'Rico' 4,845 · 'Trench' 5,115–5,605 ·
  'and' 5,765 · 'reported' 5,985 · 'crowd' 6,565 · 'of' 6,885 · 'fish.' 7,045–7,400.

  A BASE: a MESMA pilha de camadas do mar da s04 (graphics/s04.html, lote M1 da arte-1; lida, não editada), para o corte s04 → s05
    não se ver no mar:
    · o satélite da MapTiler (perfil maptiler), no tratamento C da identidade §6 (brilho 0,92, saturação 0, contraste +0,25);
    · o ENTORNO: o mar da GEBCO pela _media/base/gebco-atlantico-relevo.jpg (o WMS GEBCO_LATEST, 21 px/grau), recortado de 80°W a
      50°W e de 10°N a 29°N, só onde a cor é de mar e um pixel para dentro dele, sem o miolo do recorte do Caribe, com a borda
      esmaecida (1,5°) e o brilho máx. 0,34: é ele que tapa as bordas da P0 (73,0–58,6°W) que o recorte gebco-caribe (72,5–59,0°W)
      não alcança;
    · o fundo do Caribe pela GEBCO 2026 (_media/base/gebco-caribe.png), num <canvas> com as bordas esmaecidas (72 px da imagem a
      leste e a oeste, 60 ao norte e ao sul), por cima do satélite e do entorno;
    · nenhum lado do canvas em potência de 2 (no MapLibre 4.7.1 a textura assim sai preta: achado da s04).
  O PRIMEIRO QUADRO é a POSE P0, o último da s04: window.__cameraAt(0) = { center: [-65.8, 19.4], zoom: 7.5507 (= log2(187,5)),
    bearing: 0, pitch: 0 }, a mesma base, o anel sem pulso (opacidade 1) e os dois créditos de mapa no mesmo lugar (GEBCO em
    bottom 121, MapTiler em bottom 24, pílula --rotulo). A câmera parte da P0 com velocidade zero (a s04 chega nela freando).

  A SILHUETA DO BATISCAFO (1964, sem nome; TA253): um batiscafo GENÉRICO no traço de engenheiro (só linha --tinta 6 px, sem
    preenchimento, a aresta escondida tracejada 16/14): o flutuador alongado, a torre, o leme, a esfera de pressão pendurada embaixo,
    os dois silos de lastro e, tracejado, o poço de acesso da torre à esfera. Não é o Archimède desenhado (a foto real vem na s24): é
    o tipo de embarcação. Ela fica PRESA A UM PONTO DO INTERIOR da fossa (fossa-porto-rico; −65,55°, 19,928°), escolhido só porque a
    caixa da silhueta cabe ali dentro da isóbata na pose F, com ~35 px de folga até o contorno (_tmp/arte-2/M1/polo2.mjs). O centróide de
    área (−65,64°, 19,64°) cai FORA do polígono, numa enseada da isóbata (a 1ª versão o usou, e a silhueta saía meio fora da fossa
    acesa). Não é sítio: sem alfinete, sem anel, sem linha, sem rótulo de lugar, em escala de ilustração (472 px de comprimento na
    superfície, uns 180 km na P0), a ~185 km do anel, que ela nunca toca (na P0, a 192 px dele; na pose F, a 590 px). Nenhuma fonte dá
    o sítio de 1964 (PA006), e a cena não o sugere nem o relaciona com o trecho mais fundo, que não está aceso aqui (TA253).
    O MERGULHO (ilustrador, com a física; o mapa é visto de cima, e descer é afastar-se da câmera): a silhueta ENCOLHE no lugar, sem
    andar no mapa, de 2,0 para 1,15 da medida local (a escala da distância à câmera). Um controlador só, a profundidade d(t):
    larga da superfície em 'descended' (3,685) com arrasto linear até a velocidade terminal (τ 0,30 s), solta o lastro em 4,50 s e
    fica quase neutra, e o arrasto dissipa a velocidade (τ 0,20 s, decaimento exponencial, sem energia nova, sem oscilar); PARADA
    (abaixo de 0,5 px) em 5,432 s, antes do corte. A escala de tempo é a da fala (remapeamento editorial declarado: ninguém desce 7 km
    em 2 s; movimento-fisica.md, "Tempo físico e tempo editorial").

  O QUE A CENA FAZ (o mapa nunca para; o tempo local = master − 21,9):
    b0 0–3,667 ("In 1964, a crew in a French deep-diving craft"): a P0; a câmera aproxima devagar EM TORNO da silhueta (zoom 7,5507
      → 7,606, a silhueta parada na tela em (1987, 931)), com rampa de 0,5 s a partir da velocidade zero. 0,133 ('nineteen'): a
      silhueta POUSA na superfície (300 ms, 1,03 → 1,00, a mão que arruma) e "1964" (cota, pílula de 128 px) entra acima dela; "1964"
      sai em 300 ms terminando em 3,667 (o t1 do redator: "sai quando a câmera desce à fossa").
    b1 3,667–5,733 ("descended into the Puerto Rico Trench"): 3,685 ('descended'): OUTRA VISTA. A câmera empurra da P0 para a fossa
      inteira em 1,5 s (cúbica de entrada e saída, até 5,185; zoom → 8,26, a fossa de 277 a 3566 px de borda a borda, a ilha embaixo):
      a imagem inteira muda. No mesmo instante a fossa inteira (fossa-porto-rico, a isóbata de 7.000 m LIDA da GEBCO 2026 e declarada
      pela pesquisa-geo; pauta-geo) acende em 500 ms: --destaque a 85 % (ela é o assunto) e o contorno --tinta de 6 px, a região
      falada demarcada enquanto é dita (identidade §5). A silhueta desce (acima). 4,533: a pílula "Puerto Rico Trench" (rótulo,
      128 px, caixa normal: fossa) entra PRESA À TELA em (1100, 612), no mar aberto ao norte da metade oeste da fossa, sem tocar o
      contorno (a câmera ainda empurra até 5,185, e a pílula não anda enquanto se lê). Depois de 5,185, a aproximação lenta continua
      (zoom +0,016/s) em torno da silhueta, parada em (1574, 871).
    b2 5,733–8,033 ("and reported a crowd of fish."): CORTE DE REGIME DENTRO DO ARQUIVO (identidade §4.4: corte seco na troca de
      regime), casado: o mapa sai, e no mesmo quadro entra a MESA (o still mesa-porto-rico.png sob a luz, o feltro; identidade §5),
      com o batiscafo e a pílula "Puerto Rico Trench" no MESMO lugar da tela (o nome da fossa vira o nome do corte). O CORTE LATERAL
      se traça da esquerda para a direita em 0,35 s: a ENCOSTA EM DECLIVE da fossa (a linha de 6 px com a hachura do desenho técnico,
      o mesmo traço da s06), SEM o fundo da fossa desenhado abaixo dela (TA254: nenhuma fonte dá o fundo sob o sítio; a encosta segue
      para fora do quadro). 5,967 ('reported'): "1964 · REPORTED" (cota, 128 px, solta sobre a mesa, como o "2019" da s06) à direita
      do batiscafo. 6,565 ('crowd'): os ~200 riscos de "peixe" aparecem SOBRE a encosta, numa linha, da esquerda para a direita (24
      lotes em 0,8 s); a luz da mesa fica atrás da linha dos peixes. Sem número (N28): a linha fica na altura do relato só como
      posição no desenho (~24,000 ft, o espelho), sem cota. A câmera do RIG (push-in 0,0024/s e a deriva de 6/4,8 px) em torno de
      (1574, 1035); os últimos 250 ms são repouso (só a deriva).
    A RIMA COM A s06: o corte é o MESMO desenho da s06 (graphics/s06.html, lote EO1 da arte-1; lido, não editado): a mesma encosta
      (y = 760 + (x + 200)·0,2075 nas coordenadas da s06), a mesma hachura e os mesmos ~200 riscos (semente 1964, quatro fileiras,
      x 1250–2950), vistos de mais longe: tela = (1574, 871) + (p − (2100, 1000))·0,82. O batiscafo fica no ponto aonde o
      submersível da s06 chega ("the exact same spot"). A s06 abre mais perto (escala 1), e o corte s05 → s06 é seco.
  ELEMENTOS (teto 6): b0 = anel, silhueta, "1964" (3); b1 = anel, fossa acesa, silhueta, pílula (4); b2 = o corte (a encosta com a
    hachura), a linha dos peixes, o batiscafo, a pílula, "1964 · REPORTED" (5).

        if (!passageira || ++tentativa >= ESPERAS.length) throw e;
        window.__retentativasMapa++;
        window.__retentativasMapaPorFalha[e.falha] = (window.__retentativasMapaPorFalha[e.falha] || 0) + 1;
        return new Promise(function (res) { setTimeout(res, ESPERAS[tentativa]); }).then(uma);
      });
    }
    return uma();
  }
  maplibregl.addProtocol("regie+https", buscarComRetentativa);
  maplibregl.addProtocol("regie+http", buscarComRetentativa);
  var pelaRegie = function (url) { return /^https?:\/\//.test(url) ? { url: "regie+" + url } : undefined; };

  var c0 = cameraAt(0);
  var map;
  try {
    map = new maplibregl.Map({
      container: "map", interactive: false, preserveDrawingBuffer: true, fadeDuration: 0,
      maxTileCacheSize: 4096, attributionControl: false, maxPitch: 85, transformRequest: pelaRegie, renderWorldCopies: true,
      style: estilo(), center: c0.center, zoom: c0.zoom, bearing: 0, pitch: 0

  }
  window.map = map;
  (function () {
    var pt = map.painter, pintar = pt && pt.render;

    pt.render = function (estiloMapa, opcoes) { return pintar.call(this, estiloMapa, Object.assign({}, opcoes, { moving: true })); };
  })();

  window.__errosMapa = 0;
  function motivoRede(err, msg) {
    var st = err.status, n = err.tentativas > 1 ? " (" + err.tentativas + " tentativas)" : "";
    if (err.falha === "corrompido" || /could not be decoded|could not load image|tile corrompido/i.test(msg))
      return "mandou tile CORROMPIDO" + n + " (" + String(msg).replace(/^tile corrompido: /, "") + "). Renderize de novo.";
    if (err.falha === "tempo") return "não respondeu em " + PRAZO_TENTATIVA / 1000 + " s" + n + ". Renderize de novo.";
    if (st === 401 || st === 403) return "recusou o acesso (HTTP " + st + "). Confira a chave " + (P.credencial || "") + " e o plano do dono.";
    if (st === 429) return "limitou as requisições (HTTP 429)" + n + ". Espere e renderize de novo.";
    if (st >= 500) return "está com erro no servidor (HTTP " + st + ")" + n + ". Tente de novo mais tarde.";
    if (st) return "respondeu HTTP " + st + ".";

  }
  var mapaCarregado = false;
  map.on("error", function (ev) {
    window.__errosMapa++;

    var msg = String(err.message || "");
    var deRede = err.status || err.url || (ev && ev.tile) || /fetch|network|failed to load|load failed|cors/i.test(msg);
    if (!deRede) return falhar("o MapLibre acusou erro na cena: " + (msg || "sem descrição") + ".");
    var fonte = ev && ev.sourceId ? " (fonte '" + ev.sourceId + "')" : (mapaCarregado ? "" : " (o estilo do mapa)");
    falhar("a base '" + P.nome + "'" + fonte + " " + motivoRede(err, msg) + (err.url ? " URL: " + String(err.url).split("?")[0] : ""));
  });
  map.on("load", function () {
    imgsProntas.then(function (ims) {
      try {
        // a pilha da s04: base · entorno (0,34) · o recorte do Caribe esmaecido · (a fossa por cima)
        var ent = canvasEntorno(ims[1], ATL, GEB, [-80, 10, -50, 29], 1.5);
        map.addSource("entorno", { type: "canvas", canvas: ent.canvas, coordinates: ent.coordinates, animate: false });

          "raster-brightness-max": 0.34 } }, "fossa-fill");

      } catch (e) { return falhar("não consegui montar o fundo da GEBCO: " + e.message); }

      window.__renderAt(0);

    }, function (e) { falhar(e.message); });
  });

  // ═══ BLOCO COMUM M1 — o anel ════════════════════════════════════════════════════════════════════════
  var SVGNS = "http://www.w3.org/2000/svg";
  function svgEl(tag, at, pai) { var el = document.createElementNS(SVGNS, tag); for (var k in at) el.setAttribute(k, at[k]); if (pai) pai.appendChild(el); return el; }
  (function () {

    E("ov").insertBefore(g, E("gBatMapa"));
    svgEl("circle", { "class": "halo", cx: 0, cy: 0, r: 28, "stroke-width": 30 }, g);
    svgEl("circle", { cx: 0, cy: 0, r: 28, "stroke-width": 10 }, g);
  })();
  function aplicarAnel(v) {
    var g = E("anel"); if (!g) return null;
    var pa = map.project(ANEL);
    g.setAttribute("transform", "translate(" + pa.x.toFixed(2) + " " + pa.y.toFixed(2) + ")");
    g.setAttribute("opacity", v.toFixed(3));
    return pa;
  }

  function mostrar(el, v, l, tp) {
    if (!el) return;
    el.style.opacity = v.toFixed(3);
    el.style.visibility = v > 0.001 ? "visible" : "hidden";
    el.style.transform = "translate(" + l.toFixed(2) + "px," + tp.toFixed(2) + "px)";
  }

  // o batiscafo sobre o mapa: preso à âncora projetada; pousa (1,03 → 1,00) e depois encolhe com o mergulho
  function aplicarBatMapa(t) {
    var g = E("gBatMapa"); if (!g) return null;
    var v = eo(seg(t, BT.entra, 0.3));
    if (v <= 0) { g.setAttribute("opacity", "0"); return null; }
    var pa = map.project(CENA.ancora), k = batK(t) * (1 + 0.03 * (1 - eo(seg(t, BT.entra + 0.08, 0.22))));
    var d = batD(k, pa.x, pa.y);
    E("batMapa").setAttribute("d", d.linha); E("batMapaSob").setAttribute("d", d.linha + " " + d.oculto); E("batMapaOculto").setAttribute("d", d.oculto);
    g.setAttribute("opacity", v.toFixed(3));
    return { x: pa.x, y: pa.y, k: k };
  }
  function aplicarRotulosMapa(t, bat) {
    // "1964": acima da silhueta, preso a ela; sai em 300 ms terminando em 3,667
    var R = CENA.rot1964, el = E("rot1964");
    var vin = eo(seg(t, R.entra, 0.3)), vout = 1 - eio(seg(t, R.sai - 0.3, 0.3)), v = Math.min(vin, vout);
    if (v > 0.001 && bat) {
      var w = el.offsetWidth, h = el.offsetHeight;
      mostrar(el, v, bat.x - w / 2, bat.y - 46 * bat.k + R.dy - h + (1 - vin) * 24 + (1 - vout) * 24);
    } else mostrar(el, 0, 0, 0);
    // "Puerto Rico Trench": presa à tela, ao norte da metade oeste da fossa; fica no b2 (o nome do corte)
    var F = CENA.rotFossa, ef = E("rotFossa"), vf = eo(seg(t, F.entra, 0.3));
    if (vf > 0.001) mostrar(ef, vf, F.cx - ef.offsetWidth / 2, F.cy - ef.offsetHeight / 2 + (1 - vf) * 24);
    else mostrar(ef, 0, 0, 0);
  }

  var opAntes = {};
  function opac(id, prop, v) { v = +(+v).toFixed(3); var k = id + "|" + prop; if (opAntes[k] === v) return; map.setPaintProperty(id, prop, v); opAntes[k] = v; }
  var regimeAntes = null;
  function regime(mesa) {
    if (regimeAntes === mesa) return;
    E("map").style.visibility = mesa ? "hidden" : "visible";
    E("mesaWrap").style.visibility = mesa ? "visible" : "hidden";
    E("gBatMapa").style.visibility = mesa ? "hidden" : "visible";
    E("anel").style.visibility = mesa ? "hidden" : "visible";
    ["credGebco", "credMapa"].forEach(function (id) { E(id).style.visibility = mesa ? "hidden" : "visible"; E(id).style.opacity = mesa ? "0" : "1"; });
    regimeAntes = mesa;
  }

  // ═══ o b2: a mesa e o corte desenhado ═══
  var PC = [1574, 1035];
  function escalaMesa(tb) { return 1 + 0.0024 * Math.min(tb, DUR - 0.25 - CENA.corte); }
  function derivaMesa(tb) { return [6 * Math.sin(tb * 0.23), 4.8 * Math.sin(tb * 0.17)]; }
  function aplicarMesa(t) {
    var tb = Math.max(0, t - CENA.corte), s = escalaMesa(tb), dv = derivaMesa(tb);
    var c = E("cam"); if (c) c.style.transform = "scale(" + s.toFixed(5) + ") translate(" + f2(dv[0]) + "px," + f2(dv[1]) + "px)";
    var st = E("still"); if (st) st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ") translate(" + f2(dv[0] * 0.6) + "px," + f2(dv[1] * 0.6) + "px)";
    // o corte se traça da esquerda para a direita em 0,35 s
    var r = E("corteTracoRet"); if (r) r.setAttribute("width", (W * eio(seg(t, CENA.corte, CENA.traco.dur))).toFixed(1));
    // o batiscafo da mesa: inteiro desde o corte, no mesmo lugar e na mesma medida em que o mergulho o deixou
    E("gBatMesa").setAttribute("opacity", "1");
    // os riscos aparecem um a um em "crowd", da esquerda para a direita (24 lotes em 0,8 s)
    for (var k = 0; k < pLotes.length; k++) {
      var t0 = CENA.peixes.entra + (k / (LOTES - 1)) * (CENA.peixes.dur - 0.25);
      pLotes[k].style.opacity = (0.9 * eo(seg(t, t0, 0.25))).toFixed(3);
    }
    // a luz: atrás da linha dos peixes (o meio dela), nas coordenadas do #luz (deslocado de −140)
    var lz = E("luz"); if (lz) { lz.style.setProperty("--luz-x", (PC[0] + 140) + "px"); lz.style.setProperty("--luz-y", (PC[1] + 140) + "px"); }
    // "1964 · REPORTED": solto sobre a mesa, à direita do batiscafo, fora da câmera
    var R = CENA.relato, er = E("rotRelato"), vr = eo(seg(t, R.entra, 0.3));
    if (vr > 0.001) mostrar(er, vr, R.x, R.cy - er.offsetHeight / 2 + (1 - vr) * 24); else mostrar(er, 0, 0, 0);
    // o crédito da fonte: entra em 300 ms no primeiro quadro do corte
    var cf = E("credFonte"), vc = eo(seg(t, CENA.corte, 0.3));
    cf.style.opacity = vc.toFixed(3); cf.style.visibility = vc > 0.001 ? "visible" : "hidden";
  }

  function aplicar(t) {
    if (!mapaCarregado) return;
    var mesa = t >= CENA.corte - 1e-6;
    regime(mesa);
    map.jumpTo(cameraAt(t));
    if (!mesa) {
      var vf = eo(seg(t, CENA.fossa.entra, CENA.fossa.dura));
      opac("fossa-fill", "fill-opacity", vf * 0.85);
      opac("fossa-linha", "line-opacity", vf);
      aplicarAnel(1);
      var bat = aplicarBatMapa(t);
      aplicarRotulosMapa(t, bat);
      mostrar(E("rotRelato"), 0, 0, 0);
      var cf = E("credFonte"); cf.style.opacity = "0"; cf.style.visibility = "hidden";
    } else {
      mostrar(E("rot1964"), 0, 0, 0);
      aplicarRotulosMapa(t, null);
      aplicarMesa(t);
    }
  }

  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }
  };

  // O GANCHO DE MEDIDA (só leitura): as caixas das peças e a folga até o anel, num t
  window.__s05peca = function (t) {
    window.__renderAt(t);
    var cx = function (id) { var e = E(id); if (!e) return null; var r = e.getBoundingClientRect(); return [Math.round(r.left), Math.round(r.top), Math.round(r.right), Math.round(r.bottom), +(+getComputedStyle(e).opacity).toFixed(2)]; };
    var pa = mapaCarregado ? map.project(ANEL) : null, bm = E("gBatMapa").getBoundingClientRect();
    var folga = pa ? Math.round(Math.max(bm.left - pa.x, pa.x - bm.right, bm.top - pa.y, pa.y - bm.bottom) - 43) : null;
    return { t: t, cam: cameraAt(t), anel: pa ? [Math.round(pa.x), Math.round(pa.y)] : null, k: +batK(t).toFixed(4), folgaBatAnel: folga,
      batMapa: cx("gBatMapa"), batMesa: cx("gBatMesa"), rot1964: cx("rot1964"), rotFossa: cx("rotFossa"), rotRelato: cx("rotRelato"),
      peixes: cx("gPeixes"), credFonte: cx("credFonte") };
  };

  // ═══ BLOCO COMUM M1 — a espera ══════════════════════════════════════════════════════════════════════
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}

  }
  function barrarTileComErro() {

    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  var FONTES = ["base", "fossa", "entorno", "gebco"];
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!mapaCarregado || !map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) {
            if (!map.getSource(FONTES[i])) return false;
            if (!map.isSourceLoaded(FONTES[i])) return false;
          }
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = mapaCarregado && map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;

        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);

    })();
  }, function () {});
})();
