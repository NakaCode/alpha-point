    var pxp = penaGraus / (caixa[2] - caixa[0]) * w, pyp = pxp;
    x.globalCompositeOperation = "destination-out";
    [[0, 0, pxp, 0, pxp, h], [w, 0, w - pxp, 0, pxp, h], [0, 0, 0, pyp, w, pyp], [0, h, 0, h - pyp, w, pyp]].forEach(function (f) {
      var gr = x.createLinearGradient(f[0], f[1], f[2], f[3]); gr.addColorStop(0, "rgba(0,0,0,1)"); gr.addColorStop(1, "rgba(0,0,0,0)");
      x.fillStyle = gr; x.fillRect(Math.min(f[0], f[2]), Math.min(f[1], f[3]), f[4], f[5]);
    });
    x.globalCompositeOperation = "source-over";
    return { canvas: cv, coordinates: [[caixa[0], caixa[3]], [caixa[2], caixa[3]], [caixa[2], caixa[1]], [caixa[0], caixa[1]]] };
  }
  var ATL = baseGebco("gebco-atlantico-relevo");
  var imgsProntas = Promise.all([carregarImagem(GEB.imagem.arquivo), carregarImagem(ATL.imagem.arquivo)]);
  window.__fotosProntas = imgsProntas.then(function () { return true; }, function (e) { falhar(e.message); return true; });

  var comChave = function (u) { return chave ? u.split("{chave}").join(encodeURIComponent(chave)) : u; };
  function estilo() {
    var fontes = { base: { type: "raster", tiles: P.base.tiles.map(comChave), tileSize: P.base.tileSize, maxzoom: P.base.maxzoom } };
    var camadas = [
      { id: "base", type: "raster", source: "base",
        paint: { "raster-brightness-max": 0.92, "raster-saturation": 0, "raster-contrast": 0.25, "raster-fade-duration": 0 } }   // identidade §6, o tratamento C
    ];
    return { version: 8, transition: { duration: 0, delay: 0 }, sources: fontes, layers: camadas };
  }

  // ── rede com nova tentativa: falha passageira não derruba a cena inteira (molde, sem mudança) ────────
  window.__retentativasMapa = 0;
  window.__retentativasMapaPorFalha = { corrompido: 0, tempo: 0, rede: 0, http: 0 };
  var ESPERAS = [0, 1000, 3000, 6000, 10000];
  var PRAZO_TENTATIVA = 30000;
  function defeitoDaImagem(buf) {
    var b = new Uint8Array(buf), n = b.length, i;
    if (n < 8) return n ? "resposta de " + n + " bytes" : "resposta vazia";
    if (b[0] === 0xFF && b[1] === 0xD8) {
      for (i = n - 2; i >= Math.max(2, n - 64); i--) if (b[i] === 0xFF && b[i + 1] === 0xD9) return null;
      return "JPEG cortado (" + n + " bytes, sem o marcador final FF D9)";
    }
    if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) {
      for (i = n - 8; i >= Math.max(8, n - 64); i--) if (b[i] === 0x49 && b[i + 1] === 0x45 && b[i + 2] === 0x4E && b[i + 3] === 0x44) return null;
      return "PNG cortado (" + n + " bytes, sem o bloco IEND)";
    }
    if (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46) {
      var decl = (b[4] | (b[5] << 8) | (b[6] << 16) | (b[7] << 24)) >>> 0;

  }
  function erroCorpo(msg, url, st) { var e = new Error("tile corrompido: " + msg); e.falha = "corrompido"; e.url = url; e.statusCorpo = st; return e; }
  function buscarComRetentativa(params, abortar) {
    var url = params.url.replace(/^regie\+/, "");
    var tentativa = 0;
    var ehImagem = params.type === "image";
    function uma() {
      var ctl = new AbortController(), estourou = false;
      var cancelar = function () { ctl.abort(); };
      var externo = abortar && abortar.signal;
      if (externo) { if (externo.aborted) ctl.abort(); else externo.addEventListener("abort", cancelar); }
      var relogio = setTimeout(function () { estourou = true; ctl.abort(); }, PRAZO_TENTATIVA);
      var soltar = function () { clearTimeout(relogio); if (externo) externo.removeEventListener("abort", cancelar); };

        if (params.type === "json") return r.text().then(function (t) { try { return JSON.parse(t); } catch (x) { throw erroCorpo("JSON ilegível (" + t.length + " caracteres)", url, r.status); } });
        return r.arrayBuffer().then(function (buf) {
          if (!ehImagem) return buf;
          var defeito = defeitoDaImagem(buf);

            throw erroCorpo("a imagem não decodifica (" + buf.byteLength + " bytes: " + ((x && x.message) || "sem descrição") + ")", url, r.status);

        if (!e || typeof e !== "object") e = new Error(String(e));
        var st = e.status;
        if (!e.falha) e.falha = st ? "http" : "rede";

        try { e.url = url; e.tentativas = tentativa + 1; } catch (x) {}
        if (!passageira || ++tentativa >= ESPERAS.length) throw e;
        window.__retentativasMapa++;
        window.__retentativasMapaPorFalha[e.falha] = (window.__retentativasMapaPorFalha[e.falha] || 0) + 1;

      });
    }
    return uma();
  }
  maplibregl.addProtocol("regie+https", buscarComRetentativa);
  maplibregl.addProtocol("regie+http", buscarComRetentativa);
  var pelaRegie = function (url) { return /^https?:\/\//.test(url) ? { url: "regie+" + url } : undefined; };
  var c0 = cameraAt(0);
  var map;
  try {
    map = new maplibregl.Map({
      container: "map", interactive: false, preserveDrawingBuffer: true, fadeDuration: 0,
      maxTileCacheSize: 4096, attributionControl: false, maxPitch: 85, transformRequest: pelaRegie,
      style: estilo(), center: c0.center, zoom: c0.zoom, bearing: 0, pitch: 0

  } catch (e) {
    return falhar("o MapLibre não subiu (" + (e && e.message) + "). Sem WebGL no navegador não há mapa.");
  }
  window.map = map;
  (function () {
    var pt = map.painter, pintar = pt && pt.render;
    if (typeof pintar !== "function") return falhar("o MapLibre desta cena não tem painter.render: a base andaria em degraus de 1 px.");
    pt.render = function (estiloMapa, opcoes) { return pintar.call(this, estiloMapa, Object.assign({}, opcoes, { moving: true })); };
  })();

  // ── FAIL-CLOSED: tile que não chega é ERRO, não quadro preto (molde) ─────────────────────────────
  window.__errosMapa = 0;
  function motivoRede(err, msg) {
    var st = err.status, n = err.tentativas > 1 ? " (" + err.tentativas + " tentativas)" : "";
    if (err.falha === "corrompido" || /could not be decoded|could not load image|tile corrompido/i.test(msg))
      return "mandou tile CORROMPIDO" + n + " (" + String(msg).replace(/^tile corrompido: /, "") + "). Renderize de novo.";
    if (err.falha === "tempo") return "não respondeu em " + PRAZO_TENTATIVA / 1000 + " s" + n + ". Renderize de novo.";
    if (st === 401 || st === 403) return "recusou o acesso (HTTP " + st + "). Confira a chave " + (P.credencial || "") + " e o plano do dono.";
    if (st === 429) return "limitou as requisições (HTTP 429)" + n + ". Espere e renderize de novo.";
    if (st >= 500) return "está com erro no servidor (HTTP " + st + ")" + n + ". Tente de novo mais tarde.";
    if (st) return "respondeu HTTP " + st + ".";
    return "não respondeu (sem internet? servidor fora do ar? firewall?)" + n + ".";
  }
  var mapaCarregado = false;
  map.on("error", function (ev) {
    window.__errosMapa++;

    var msg = String(err.message || "");
    var deRede = err.status || err.url || (ev && ev.tile) || /fetch|network|failed to load|load failed|cors/i.test(msg);
    if (!deRede) return falhar("o MapLibre acusou erro na cena: " + (msg || "sem descrição") + ".");
    var fonte = ev && ev.sourceId ? " (fonte '" + ev.sourceId + "')" : (mapaCarregado ? "" : " (o estilo do mapa)");
    falhar("a base '" + P.nome + "'" + fonte + " " + motivoRede(err, msg) + (err.url ? " URL: " + String(err.url).split("?")[0] : ""));
  });
  map.on("load", function () {
    imgsProntas.then(function (ims) {
      try {
        var ent = canvasEntorno(ims[ims.length - 1], ATL, GEB, [-80, 10, -50, 29], 1.5);
        map.addSource("entorno", { type: "canvas", canvas: ent.canvas, coordinates: ent.coordinates, animate: false });
        map.addLayer({ id: "entorno", type: "raster", source: "entorno", paint: { "raster-fade-duration": 0, "raster-resampling": "linear",
          "raster-brightness-max": 0.34 } });
        map.addSource("gebco", { type: "canvas", canvas: canvasEsmaecido(ims[0], 72, 60), coordinates: GEB.imagem.coordinates, animate: false });
        map.addLayer({ id: "gebco", type: "raster", source: "gebco", paint: { "raster-fade-duration": 0, "raster-resampling": "linear" } });
      } catch (e) { return falhar("não consegui montar o fundo da GEBCO: " + e.message); }
      mapaCarregado = true;
      window.__renderAt(0);
      map.once("idle", function () { if (!window.__erroCena) resolverPronto(true); });
    }, function (e) { falhar(e.message); });
  });

  // ═══ BLOCO COMUM M1 — o anel ════════════════════════════════════════════════════════════════════════
  var SVGNS = "http://www.w3.org/2000/svg";
  function svgEl(tag, at, pai) { var el = document.createElementNS(SVGNS, tag); for (var k in at) el.setAttribute(k, at[k]); if (pai) pai.appendChild(el); return el; }
  function criarAnel(id) {
    var g = svgEl("g", { id: id, "class": "anel", opacity: "0" }, E("ov"));
    [1, 2].forEach(function (k) {
      var gp = svgEl("g", { id: id + "Pulso" + k, opacity: "0" }, g);
      svgEl("circle", { "class": "halo", cx: 0, cy: 0, r: 28, "stroke-width": 30 }, gp);
      svgEl("circle", { cx: 0, cy: 0, r: 28, "stroke-width": 10 }, gp);
    });
    svgEl("circle", { "class": "halo", cx: 0, cy: 0, r: 28, "stroke-width": 30 }, g);
    svgEl("circle", { cx: 0, cy: 0, r: 28, "stroke-width": 10 }, g);
    return g;
  }
  function aplicarAnel(id, ll, t, pulsos) {
    var g = E(id); if (!g) return null;
    var pa = map.project(ll);
    g.setAttribute("transform", "translate(" + pa.x.toFixed(2) + " " + pa.y.toFixed(2) + ")");
    g.setAttribute("opacity", "1");
    (pulsos || []).forEach(function (t0, k) {
      var u = (t - t0) / 1.2, c = E(id + "Pulso" + (k + 1));

      var vivo = u >= 0 && u < 1;
      c.setAttribute("transform", "scale(" + (1 + 0.8 * (vivo ? u : 0)).toFixed(4) + ")");
      c.setAttribute("opacity", vivo ? (1 - u).toFixed(3) : "0");
    });
    return pa;
  }
  criarAnel("anel");

  // ═══ O MEDIDOR ═══════════════════════════════════════════════════════════════════════════════════════
  var M = CENA.med;
  function yFt(ft) { return M.y0 + ft / M.ftPorPx; }
  var Y_FUNDO = yFt(M.fundoFt), Y_MAX = yFt(M.max);
  (function () {
    // o eixo e os tiques (a geometria inteira; o corte mostra só até a frente que desenrola)
    // os tiques à ESQUERDA do eixo, como na série (s15, s18): longos a cada 5,000 ft, curtos a cada 1,000
    var dE = "M" + M.x + " " + M.y0 + "L" + M.x + " " + Y_MAX, dL = "", dC = "";

      if (f % 5000 === 0) dL += "M" + (M.x - M.tiqueLongo) + " " + y + "L" + M.x + " " + y;
      else dC += "M" + (M.x - M.tiqueCurto) + " " + y + "L" + M.x + " " + y;
    }
    E("medSobEixo").setAttribute("d", dE); E("medEixo").setAttribute("d", dE);
    E("medSobLongo").setAttribute("d", dL); E("medLongo").setAttribute("d", dL);
    E("medSobCurto").setAttribute("d", dC); E("medCurto").setAttribute("d", dC);

  })();
  var NUMS = M.numeros.map(function (ft) { return { el: E("num" + ft), ft: ft }; });
  function aplicarMedidor(t) {
    var u = eio(seg(t, M.nasce, M.desenrola));
    var nasceu = t >= M.nasce;
    E("medidor").setAttribute("opacity", nasceu ? "1" : "0");
    if (!nasceu) { NUMS.forEach(function (n) { if (n.el) n.el.style.opacity = "0"; }); return; }
    var frente = M.y0 + (Y_MAX - M.y0) * u;
    // o corte vai da margem de cima (com folga para a ponta redonda e o contorno) até a frente
    var r = E("medCorteRet"); r.setAttribute("y", (M.y0 - 30).toFixed(2)); r.setAttribute("height", Math.max(0, frente - M.y0 + 30).toFixed(2));

    });

  }

  function tempoDaFrente(q) {

    return q < 0.5 ? Math.cbrt(q / 4) : 1 - Math.cbrt((1 - q) * 2) / 2;
  }

  // ═══ O SUBMERSÍVEL de traço (genérico; o traço de engenheiro: só linha, 6 px, arestas escondidas tracejadas) ═══
  // coordenadas locais em px, origem no ponto de contato (o meio dos patins), y para cima negativo; o eixo da régua passa pelo meio
  var SUB = {
    linha: [
      "M -78 -36 L -78 -82 Q -78 -110 -50 -110 L 50 -110 Q 78 -110 78 -82 L 78 -36 Q 78 -30 72 -30 L -72 -30 Q -78 -30 -78 -36 Z",   // o casco
      "M -24 -110 L -16 -134 L 22 -134 L 30 -110",                                                                                      // a torre
      "M -48 -30 L -40 0 M 48 -30 L 40 0 M -66 0 L 66 0",                                                                               // as pernas e os patins
      "M -86 -60 L -78 -60 M 78 -60 L 86 -60",                                                                                          // os propulsores
      "M -58 -70 m -16 0 a 16 16 0 1 0 32 0 a 16 16 0 1 0 -32 0"                                                                        // a vigia
    ].join(" "),
    oculto: "M -16 -70 a 30 30 0 1 0 60 0 a 30 30 0 1 0 -60 0"                                                                          // a esfera de pressão, por dentro do casco
  };
  E("subLinha").setAttribute("d", SUB.linha); E("subSob").setAttribute("d", SUB.linha); E("subOculto").setAttribute("d", SUB.oculto);
  function aplicarSub(t) {
    var S = CENA.sub, g = E("sub");
    var vin = eo(seg(t, S.entra, 0.3));
    if (vin <= 0) { g.setAttribute("opacity", "0"); return null; }
    var u = eio(seg(t, S.entra, S.pousa - S.entra));
    var y = S.yIni + (Y_FUNDO - S.yIni) * u;
    g.setAttribute("transform", "translate(" + M.x + " " + y.toFixed(2) + ") scale(" + S.escala + ")");
    g.setAttribute("opacity", vin.toFixed(3));
    return { x: M.x, y: y };
  }

  function mostrar(el, v, l, tp) {
    el.style.opacity = v.toFixed(3);
    el.style.visibility = v > 0.001 ? "visible" : "hidden";
    el.style.transform = "translate(" + l.toFixed(2) + "px," + tp.toFixed(2) + "px)";
  }
  function aplicarData(t) {
    var R = CENA.rotData, el = E("rotData"), v = eo(seg(t, R.entra, 0.3));
    if (v <= 0) { mostrar(el, 0, 0, 0); return; }
    var w = el.offsetWidth, h = el.offsetHeight;

    E("credMapa").style.opacity = "1"; E("credMapa").style.visibility = "visible";
    E("credGebco").style.opacity = "1"; E("credGebco").style.visibility = "visible";
  }

  function aplicar(t) {
    if (!mapaCarregado) return;
    map.jumpTo(cameraAt(t));
    aplicarAnel("anel", ANEL, t, CENA.anel.pulsos);
    aplicarMedidor(t);
    aplicarSub(t);
    aplicarData(t);
    aplicarCreditos();
  }

  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }
  };

  // ═══ BLOCO COMUM M1 — a espera: os tiles do satélite, o fundo e as fontes de dados, e um quadro pintado ═══
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};

  }

  }

    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!mapaCarregado || !map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) if (!map.getSource(FONTES[i]) || !map.isSourceLoaded(FONTES[i])) return false;
          return true;
        } catch (e) { return false; }
      };

      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = mapaCarregado && map.areTilesLoaded() && !map.isMoving(); } catch (e) {}

        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;

        if (performance.now() - t0 > teto) {

          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
