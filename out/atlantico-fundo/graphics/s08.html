    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();

</script>
<script>
(function () {
  "use strict";

  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo, eb = R.eb;
  var E = function (id) { return document.getElementById(id); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  // o pouso da folha (identidade §4.4): desce 420 px em 0,80 s (eo), assenta 1,03 → 1,00 em 0,56–0,80 s
  function pousoFolha(t, t0, dur, desce) {
    var p = eo(seg(t, t0, dur)), q2 = eo(seg(t, t0 + 0.56, dur - 0.56));
    return { op: t >= t0 ? 1 : 0, dy: (desce || 420) * (1 - p), k: lerp(1.03, 1.00, q2), p: p };
  }
  // a sombra solta: desfoque fixo; anima só transform e opacity (no ar +64 px, 1,05, 0,35; assentada +12 px, 1,00, 0,80)
  function sombra(el, g, s, rot) {
    if (!el) return;
    var sy = lerp(64, 12, s.p), sk = lerp(1.05, 1.00, s.p), so = lerp(0.35, 0.80, s.p) * s.op;
    por(el, g.cx, g.cy - s.dy + sy, g.w, g.h, rot, sk, so);
  }
  function objeto(idG, idS, g, s, rot) {
    var gs = g.hs ? { w: g.w, h: g.hs, cx: g.cx, cy: g.cy - (g.h - g.hs) / 2 } : g;
    sombra(E(idS), gs, s, rot);
    por(E(idG), g.cx, g.cy - s.dy, g.w, g.h, rot, s.k, s.op);
  }
  function texto(el, t, t0) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * 24).toFixed(1) + "px)";
  }
  function fita(el, t, t0, lado) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    var rot = (lado === "e" ? -5 : 4);
    el.style.transform = "translateY(" + ((1 - p) * -40).toFixed(1) + "px) rotate(" + rot + "deg) scale(" + (1 + (1 - p) * 0.08).toFixed(4) + ")";
  }
  // a câmera da mesa: a lista de estados (o push-in, eb), e o centro (cx, cy) levado ao centro do palco
  function camEstado(CAM, t) {
    var a = CAM[0], s = a.s, cx = a.cx, cy = a.cy;
    for (var i = 1; i < CAM.length; i++) {
      var m = CAM[i]; if (t < m.t0) break;
      var p = eb(seg(t, m.t0, m.t1 - m.t0));
      s = lerp(s, m.s, p); cx = lerp(cx, m.cx, p); cy = lerp(cy, m.cy, p);
    }
    return { s: s, cx: cx, cy: cy };
  }
  function aplicarCamera(c, t, luz) {
    var camEl = E("cam"), st = E("still");
    var td = Math.min(t, DUR - 0.25);   // a deriva congela nos 250 ms antes do corte
    var dx = 6 * Math.sin(td * 0.23) + (1920 - c.cx), dy = 4.8 * Math.sin(td * 0.17) + (1080 - c.cy);
    if (camEl) camEl.style.transform = "scale(" + c.s.toFixed(5) + ") translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
    // o still (-sangria1400) acompanha a câmera a 0,6 (escala, translação e deriva): folga > 1.300 px em todos os lados
    if (st) { var PAR = 0.6, ss = 1 + (c.s - 1) * PAR; st.style.transform = "scale(" + ss.toFixed(5) + ") translate(" + (dx * PAR).toFixed(2) + "px," + (dy * PAR).toFixed(2) + "px)"; }
    if (camEl && luz) { camEl.style.setProperty("--luz-x", luz.x.toFixed(1) + "px"); camEl.style.setProperty("--luz-y", luz.y.toFixed(1) + "px"); }
  }
  // os GRIFOS sobre o scan: caixas medidas no arquivo (x0, y0, x1, y1 em px do scan), levadas às coordenadas da ficha pela janela
  var SP = 1.13, JX = 205, JY = 240;
  function caixa(b) { return { l: (b[0] - JX) * SP, t: (b[1] - JY) * SP, w: (b[2] - b[0]) * SP, h: (b[3] - b[1]) * SP }; }
  function grifosFolha(lista) {
    var g = E("folGrifos"); if (!g) return [];
    return lista.map(function (it) {
      var c = caixa(it.box), d = document.createElement("div"); d.className = "grifo";
      d.style.left = c.l.toFixed(1) + "px"; d.style.top = c.t.toFixed(1) + "px"; d.style.width = c.w.toFixed(1) + "px"; d.style.height = c.h.toFixed(1) + "px";
      d.style.transform = "scaleX(0)"; g.appendChild(d);
      return { el: d, t0: it.t0, t1: it.t1 };
    });
  }
  // o grifo varre com a voz e fica aceso
  function grifar(lista, t) {
    lista.forEach(function (g) { g.el.style.transform = "scaleX(" + seg(t, g.t0, Math.max(0.04, g.t1 - g.t0)).toFixed(4) + ")"; });
  }

  var DUR = 3.934;   // espelho.json › s08 › dur, literal
  window.__duracao = DUR;
  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia final é do redator-de-tela: textos-tela.json › _textos_por_cena s08) ═══
  var TEXTOS = {
    leg: "GEBCO Gazetteer: the official list of undersea feature names",      // legenda, 1,934–3,934 ("official")
    cred: "Stewart & Jamieson / Earth-Science Reviews,\n2019 · CC BY 4.0"     // credito, 0–3,934 (longo: duas linhas, nunca encolhe)
  };
  (function () { for (var k in TEXTOS) { var e = E(k); if (e) e.textContent = TEXTOS[k]; } })();
  // ── os tempos (locais, −41,633), do words.json, da regência e dos textos de tela ──
  var T = {
    pousa: 0.00, pousaDur: 0.80, fita: 0.70,
    cam0: 0.80, cam1: 2.034,                 // o push-in termina 0,30 s antes de "list" (2,352)
    cred: 0.00,                              // o crédito entra com a página
    leg: 1.934,                              // "official" (43,595 s)
    grifo: 2.334, grifoFim: 2.592,           // "list" (43,985 → 44,225 s)
    repouso: 3.934 - 0.25
  };
  // a câmera: 1,00 no centro; de 0,80 a 2,034 vai a 1,03 com o centro em (1920, 1070), rumo à linha do Milwaukee; depois só a deriva
  var CAM = [
    { t0: 0.00, s: 1.000, cx: 1920, cy: 1080 },
    { t0: T.cam0, t1: T.cam1, s: 1.030, cx: 1920, cy: 1070 }
  ];
  // ── a geometria: a ficha pousa em 1920/800, 3283 × 950 (a sombra 900 de alto), +0,8° ──
  var FO = { w: 3283, h: 1038, hs: 988, cx: 1920.0, cy: 800.0, rot: 0.8 };
  // ── o GRIFO (caixa do scan: x0, y0, x1, y1): a linha "Atlantic · Milwaukee Deep (Puerto Rico Trench) · 19.58333° N · 66.5° W · 8740 · GEBCO Gazetteer" ──
  var GF = grifosFolha([
    { box: [236, 903, 2166, 945], t0: T.grifo, t1: T.grifoFim }
  ]);
  // a luz: atrás da ficha (segue o pouso 120 ms atrás)
  function alvoLuz(t) { var a = pousoFolha(t, T.pousa, T.pousaDur, 420); return { x: FO.cx, y: FO.cy - a.dy }; }

  function cena(t) {
    t = t + 0.0005;
    aplicarCamera(camEstado(CAM, t), t, alvoLuz(t - 0.12));
    var a = pousoFolha(t, T.pousa, T.pousaDur, 420), rot = lerp(-1.5, FO.rot, a.p);
    objeto("fol", "folSombra", FO, a, rot);
    fita(E("folFe"), t, T.fita, "e"); fita(E("folFd"), t, T.fita + 0.12, "d");
    grifar(GF, t);
    texto(E("leg"), t, T.leg);
    var c = E("cred"); if (c) c.style.opacity = eo(seg(t, T.cred, 0.3)).toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  window.__renderAt(0);
})();
</script>
