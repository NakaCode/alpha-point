  para cima, sem inclinar e sem órbita (Sala). Sem relevo.
  Word-lock (words.json, −45,567 s): 'still' 0,003 · 'had' 0,418 · 'the' 0,578 · 'Atlantic' 0,658 · 'more' 1,218 · 'than' 1,378 ·
  'one' 1,698 · 'thousand' 1,898 · 'feet' 2,408 · 'too' 2,728 · 'deep,' 2,978–3,173 · 'even' 3,543 · 'after' 3,888 · 'sonar' 4,148 ·

    fundo do Caribe pela GEBCO 2026 (gebco-caribe.png, bordas esmaecidas 72/60 px). Nenhum lado de canvas em potência de 2.

    marcadores. O anel a 60 %, sem pulso (o lugar, sem visita; como na s74). NADA liga a marca da lista ao anel (a lista e o sonar são
    profundidades máximas, não um lugar: R03, N50; o lugar da lista só vem na s60).

    cada 5,000 de x 3330 a 3380, 5 sobre 15); os números "0 FT", "15,000" e "30,000 FT" (papel eixo, Inter 500, --fs-eixo, --tinta com o

      retângulo de 55 × 30 px no 1080p. Fora do canto de 400 × 400 (y < 1760) e dentro da margem (x < 3640).

    b0 0–3,533 ("still had the Atlantic more than one thousand feet too deep,"):
      · 0: a régua inteira, com os três números e o fundo do sonar (a 60 %);

    return { t: t, cam: cameraAt(t), anel: pa ? [Math.round(pa.x), Math.round(pa.y)] : null, yLista: +yLista(t).toFixed(2), lista: window.__lista,
      mSonar: cx("mSonar"), mVao: cx("mVao"), mLista: cx("mLista"), num0: cx("num0"), num15000: cx("num15000"), num30000: cx("num30000"),
      credFonte: cx("credFonte"), credGebco: cx("credGebco"), credMapa: cx("credMapa") };
  };

  // ═══ BLOCO COMUM M1 — a espera ══════════════════════════════════════════════════════════════════════
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou. O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  var FONTES = ["base", "entorno", "gebco"];
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!mapaCarregado || !map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) { if (!map.getSource(FONTES[i])) return false; if (!map.isSourceLoaded(FONTES[i])) return false; }
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = mapaCarregado && map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
