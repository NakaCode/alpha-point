      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));

  }

  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {

    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });

    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();

<script>
(function () {
  "use strict";
  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo, eb = R.eb;
  var E = function (id) { return document.getElementById(id); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var DUR = 9.633;
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia final é do redator-de-tela: textos-tela.json s16) ═══════════════
  var TEXTOS = {
    ref: "U.S. Coast and Geodetic Survey, report for 1883"   // _textos_por_cena s16 › legenda, t0 0,567 ("report"), até o fim
  };
  // os grifo_na_pagina s16 ("and the specimen-cup brought up brown ooze" · "No record is known of any sounding from which bottom
  // specimen and temperature have been obtained at a depth equaling this.") são texto IMPRESSO na página, listado para conferência:
  // a tela não os escreve, o marca-texto os varre.
  // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
  (function () { var e = E("ref"); if (e) e.textContent = TEXTOS.ref; })();

  // ── os tempos (locais, −87,5), do words.json, dos textos de tela e da regência s16 ──
  var T = {
    pousa: 0.00, pousaDur: 0.80,     // "The" (87,5 s): a folha, 0,80 s (identidade §4.4)
    fita: 0.70,
    ref: 0.567,                      // "report" (88,085 s): a legenda, no tempo da voz (textos-tela t0 0,567)
    g1: 2.967, g1Fim: 4.12,          // "brown" (90,48 s) → o fim de "ooze." (91,62 s): o grifo 1 varre a frase impressa
    g2: 5.60,                        // "no" (93,13 s): o grifo 2 começa; o grifo 1 baixa a 35 % em 0,3 s
    entrada: 0.3,
    repouso: DUR - 0.25
  };
  // a CÂMERA: estados {s, cx, cy}; cada movimento termina ≥ 0,3 s antes da palavra do grifo, e a câmera fica parada no grifo
  var CAM = [
    { t0: 0.00, s: 1.000, cx: 1920, cy: 1080 },
    { t0: 1.10, t1: 2.50, s: 1.050, cx: 1920, cy: 1080 },   // "lê o parágrafo": termina 0,47 s antes de "brown" (2,967)
    { t0: 4.40, t1: 5.25, s: 1.070, cx: 1920, cy: 1080 }    // "sublinha a segunda prova": termina 0,38 s antes de "no" (5,63)
  ];
  function cam(t) {
    var a = CAM[0], s = a.s, cx = a.cx, cy = a.cy;
    for (var i = 1; i < CAM.length; i++) {
      var m = CAM[i]; if (t < m.t0) break;

    }
    return { s: s, cx: cx, cy: cy };
  }

  // ── a geometria ──
  var K = 1.3;                                                                   // a página: 1,3× o scan (× 1,03 no assentamento = 1,339; × 1,07 da câmera, já assentada = 1,391; ≤ 1,4)
  var P = { w: 2626, h: 1228.5, cx: 1920, cy: 934.25, rot: -0.9, x0: 260, y0: 1805, topo: 78 };   // o recorte x 260→2280, y 1805→2650; a banda de cima de 78 px
  // do scan para a folha: x_folha = (x − 260) × 1,3; y_folha = 78 + (y − 1805) × 1,3
  var fx = function (x) { return (x - P.x0) * K; }, fy = function (y) { return P.topo + (y - P.y0) * K; };

  // ── os GRIFOS: trechos impressos (px do scan, medidos por projeção de tinta em _tmp/arte-1/EF2/palavras-p8.json e conferidos
  //    contra os bbox_px da pauta-documentos) e o tempo da voz que corresponde a cada um ──
  // as linhas: A (…brown ooze. No record) tinta y 2334–2391 · B (is known … at a) 2382–2439 · C (depth equaling this.) 2430–2487;
  // o marca-texto cobre da caixa alta à base de cada linha (50 px no scan = 65 px na folha), sem invadir a linha vizinha
  var LA = [2336, 2386], LB = [2384, 2434], LC = [2432, 2482];
  var G1 = [ { x0: 1098, x1: 1922, y: LA, t0: T.g1, t1: T.g1Fim } ];                       // "and the specimen-cup brought up brown ooze"
  var G2 = [
    { x0: 1962, x1: 2137, y: LA, t0: 5.60, t1: 6.05 },   // "No record"                                 ← 'no one' 5,63–6,025
    { x0: 398,  x1: 552,  y: LB, t0: 6.10, t1: 6.43 },   // "is known"                                  ← 'was known' 6,105–6,425
    { x0: 570,  x1: 1381, y: LB, t0: 6.50, t1: 7.70 },   // "of any sounding from which bottom specimen" ← 'to have brought back a sample' 6,505–7,705
    { x0: 1399, x1: 1693, y: LB, t0: 7.78, t1: 8.50 },   // "and temperature"                           ← 'and a temperature' 7,785–8,505
    { x0: 1706, x1: 2134, y: LB, t0: 8.58, t1: 8.90 },   // "have been obtained at a"                   ← 'from that' 8,585–8,905
    { x0: 397,  x1: 747,  y: LC, t0: 8.98, t1: 9.21 }    // "depth equaling this."                      ← 'deep.' 8,985–9,21
  ];
  function criarGrifos(lista) {
    var g = E("grifos"); if (!g) return [];
    return lista.map(function (p) {
      var d = document.createElement("div"); d.className = "grifo";
      d.style.left = (fx(p.x0) - 4).toFixed(1) + "px"; d.style.top = fy(p.y[0]).toFixed(1) + "px";
      d.style.width = ((p.x1 - p.x0) * K + 8).toFixed(1) + "px"; d.style.height = ((p.y[1] - p.y[0]) * K).toFixed(1) + "px";
      d.style.transform = "scaleX(0)"; g.appendChild(d);
      return { el: d, t0: p.t0, t1: p.t1 };
    });
  }
  var GR1 = criarGrifos(G1), GR2 = criarGrifos(G2);
  function grifar(lista, t, op) {
    lista.forEach(function (g) {
      g.el.style.transform = "scaleX(" + seg(t, g.t0, Math.max(0.04, g.t1 - g.t0)).toFixed(4) + ")";
      if (op !== undefined) g.el.style.opacity = op.toFixed(3);
    });
  }

  // ── os movimentos (funções puras de t) ──
  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  // o pouso da FOLHA (identidade §4.4): desce 420 px em 0,80 s, girando de −1,5° a rot, e assenta 1,03 → 1,00 em 0,56–0,80 s
  function pousoFolha(t, t0, dur) {
    var p = eo(seg(t, t0, dur)), q2 = eo(seg(t, t0 + 0.56, dur - 0.56));
    return { op: t >= t0 ? 1 : 0, dy: 420 * (1 - p), k: lerp(1.03, 1.00, q2), p: p };
  }
  // a sombra solta: no ar +64 px / 1,05 / 0,35; assentada +12 px / 1,00 / 0,80 (tokens "A mão que arruma")
  function sombra(el, g, s, rot) {
    if (!el) return;
    var sy = lerp(64, 12, s.p), sk = lerp(1.05, 1.00, s.p), so = lerp(0.35, 0.80, s.p) * s.op;
    por(el, g.cx, g.cy - s.dy + sy, g.w, g.h, rot, sk, so);
  }
  // o texto: entra em 300 ms (opacidade + 24 px de subida)
  function texto(el, t, t0) {
    if (!el) return 0;
    var p = eo(seg(t, t0, T.entrada));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * 24).toFixed(1) + "px)";
    return p;
  }
  function fita(el, t, t0) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    var rot = /Fe$/.test(el.id) ? -5 : 4;
    el.style.transform = "translateY(" + ((1 - p) * -40).toFixed(1) + "px) rotate(" + rot + "deg) scale(" + (1 + (1 - p) * 0.08).toFixed(4) + ")";
  }
  // o objeto principal da luz: a página → a linha do grifo 1 (2,967) → o bloco do grifo 2 (5,60), em eb 0,6 s
  var L1 = { x: P.cx - P.w / 2 + fx((1098 + 1922) / 2), y: P.cy - P.h / 2 + fy(2361) };      // o centro de "and the specimen-cup … brown ooze"
  var L2 = { x: P.cx - P.w / 2 + fx((397 + 2137) / 2),  y: P.cy - P.h / 2 + fy(2410) };      // o centro das três linhas de "No record is known…"
  function alvoLuz(t) {
    var a = pousoFolha(t, T.pousa, T.pousaDur);
    var u = eb(seg(t, T.g1, 0.6)), v = eb(seg(t, T.g2, 0.6));
    return { x: lerp(lerp(P.cx, L1.x, u), L2.x, v), y: lerp(lerp(P.cy - a.dy, L1.y, u), L2.y, v) };
  }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    var camEl = E("cam"), st = E("still");
    // a câmera: o estado em t + a deriva senoidal do RIG (6 / 4,8 px), congelada nos últimos 250 ms (o repouso da mesa)
    var td = Math.min(t, T.repouso);
    var c = cam(t), dx = 6 * Math.sin(td * 0.23) + (1920 - c.cx), dy = 4.8 * Math.sin(td * 0.17) + (1080 - c.cy);
    if (camEl) camEl.style.transform = "scale(" + c.s.toFixed(5) + ") translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
    // o still acompanha a câmera a --mesa-satelite-paralaxe (0,6)
    if (st) { var PAR = 0.6, ss = 1 + (c.s - 1) * PAR; st.style.transform = "scale(" + ss.toFixed(5) + ") translate(" + (dx * PAR).toFixed(2) + "px," + (dy * PAR).toFixed(2) + "px)"; }

    var L = alvoLuz(t - 0.12);
    if (camEl) { camEl.style.setProperty("--luz-x", L.x.toFixed(1) + "px"); camEl.style.setProperty("--luz-y", L.y.toFixed(1) + "px"); }

    sombra(E("pSombra"), P, a, rot);
    por(E("p"), P.cx, P.cy - a.dy, P.w, P.h, rot, a.k, a.op);
    fita(E("pFe"), t, T.fita); fita(E("pFd"), t, T.fita + 0.12);
    texto(E("ref"), t, T.ref);

    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança: uma exceção mataria a captura
  };

  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  window.__renderAt(0);
})();
</script>
