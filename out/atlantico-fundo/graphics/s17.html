    for (let i = 0; i < d.length; i += 4) { const v = (sorte() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }
    ctx.putImageData(img, 0, 0);
  }
  // Paleta por vídeo: OBJETO de papéis {acento:"#…"}, montado pelo editor-de-arte. O espelho.paleta é
  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }
  function cor(v) { return typeof CSS !== "undefined" && CSS.supports ? CSS.supports("color", v) : /^#[0-9a-f]{3,8}$|^(rgb|hsl)a?\(/i.test(v); }
  function paleta(p) {
    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));
    }
  }
  // Prontidão: <img>, <image> de SVG e TODAS as faces "Marca"/"MarcaSec". Nunca rejeita: o que falhou
  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();

</script>
<script>
(function () {
  "use strict";

  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo, eb = R.eb;
  var E = function (id) { return document.getElementById(id); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };

  var DUR = 8.634;   // espelho.json › s17 › dur, literal
  window.__duracao = DUR;
  var BEAT2 = 5.9;   // regência s17 › beats[1].t0: "under"

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia final é do redator-de-tela: textos-tela.json › _textos_por_cena s17 e cards_pessoa) ═══
  var TEXTOS = {
    avisoG: "Engraving, 1872",        // aviso_ano da gravura (t0 do redator 0; entra 150 ms depois do assentamento)
    rNavio: "HMS Challenger",         // rotulo, 3,5 → 5,6 ("British research ship")
    nome: "Capt. George Nares",       // card_nome, t0 6,3 ("Captain")
    avisoN: "Photo from the 1870s"    // aviso_ano do retrato (t0 do redator 5,9; entra 150 ms depois do assentamento)
  };
  (function () { for (var k in TEXTOS) { var e = E(k); if (e) e.textContent = TEXTOS[k]; } })();

  // ── os tempos (locais, −97,133), do words.json, da regência e dos textos de tela ──
  var T = {
    g: 0.00, gFita: 0.30, avisoG: 0.70,       // a estampa pousa (0,55 s); o aviso 150 ms depois do assentamento
    navio: 3.5, navioSai: 5.6,                // a pílula do navio: entra em "British", sai 0,3 s antes do retrato
    n: BEAT2, nFita: BEAT2 + 0.30,            // o retrato pousa em "under" (0,55 s)
    nome: 6.3, avisoN: BEAT2 + 0.55 + 0.15,   // o nome em "Captain"; o aviso 150 ms depois do assentamento (6,6)
    luz: BEAT2, luzDur: 0.6,                  // a luz vai ao rosto de Nares (eb), 120 ms atrás
    cam0: 0.55, cam1: BEAT2 - 0.25,           // o push-in do RIG para 0,25 s antes de "under"
    repouso: DUR - 0.25
  };
  var G = { w: 1828, h: 1427, cx: 1420, cy: 1131.5, rot: -1.2, rot0: -2.0 };
  var N = { w: 1024, h: 1170, cx: 2750, cy: 900, rot: 1.5, rot0: 2.5 };
  var CASCO = { x: 1440, y: 1200 };   // o casco e a chaminé na tela (a luz do beat 1)
  var ROSTO = { x: 2750, y: 791 };    // o rosto de Nares na tela (a luz do beat 2)

  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  // o pouso da FOTO IMPRESSA (identidade §4.4): desce 240 px, escala 0,72 → 1,03 até 0,33 s e assenta 1,00 até 0,55 s; a inclinação chega
  function pousoFoto(t, t0, P) {
    var p = eo(seg(t, t0, 0.33)), q = eo(seg(t, t0 + 0.33, 0.22)), pt = eo(seg(t, t0, 0.55));
    return { op: t >= t0 ? 1 : 0, dy: 240 * (1 - pt), k: t < t0 + 0.33 ? lerp(0.72, 1.03, p) : lerp(1.03, 1.00, q), p: pt, rot: lerp(P.rot0, P.rot, pt) };
  }
  // a sombra solta: desfoque fixo; anima só transform e opacity (no ar +64 px, 1,05, 0,35; assentada +12 px, 1,00, 0,80)
  function sombra(el, g, s) {
    if (!el) return;
    var sy = lerp(64, 12, s.p), sk = lerp(1.05, 1.00, s.p), so = lerp(0.35, 0.80, s.p) * s.op;
    por(el, g.cx, g.cy - s.dy + sy, g.w, g.h, s.rot, sk * s.k, so);
  }
  function objeto(idG, idS, P, s) {
    sombra(E(idS), P, s);
    por(E(idG), P.cx, P.cy - s.dy, P.w, P.h, s.rot, s.k, s.op);
  }
  // o texto entra em 300 ms (opacidade + 24 px de subida) e, se tem t1, sai em 300 ms (opacidade + 24 px para baixo)
  function texto(el, t, t0, t1, x, y) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3)), q = (t1 == null) ? 0 : eo(seg(t, t1, 0.3));
    el.style.opacity = (p * (1 - q)).toFixed(3);
    var dy = (1 - p) * 24 + q * 24;
    if (x !== undefined) el.style.transform = "translate(" + x.toFixed(1) + "px," + (y + dy).toFixed(1) + "px)";
    else el.style.transform = "translateY(" + dy.toFixed(1) + "px)";
  }
  function fita(el, t, t0, lado) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    var rot = (lado === "e" ? -6 : 5);
    el.style.transform = "translateY(" + ((1 - p) * -40).toFixed(1) + "px) rotate(" + rot + "deg) scale(" + (1 + (1 - p) * 0.08).toFixed(4) + ")";
  }
  // a câmera da mesa: o push-in do RIG (1,00 → 1,03, eb) com o centro derivando rumo ao casco; para em 5,65; a deriva senoidal; congela no repouso
  function camEstado(t) {
    var p = eb(seg(t, T.cam0, T.cam1 - T.cam0));
    return { s: lerp(1.0, 1.03, p), cx: lerp(1920, 1890, p), cy: lerp(1080, 1095, p) };
  }
  function aplicarCamera(c, t, luz) {
    var camEl = E("cam"), st = E("still");
    var td = Math.min(t, T.repouso);
    var dx = 6 * Math.sin(td * 0.23) + (1920 - c.cx), dy = 4.8 * Math.sin(td * 0.17) + (1080 - c.cy);
    if (camEl) camEl.style.transform = "scale(" + c.s.toFixed(5) + ") translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
    // o still (-sangria1400) acompanha a câmera a 0,6 (escala, translação e deriva): folga > 1.300 px em todos os lados
    if (st) { var PAR = 0.6, ss = 1 + (c.s - 1) * PAR; st.style.transform = "scale(" + ss.toFixed(5) + ") translate(" + (dx * PAR).toFixed(2) + "px," + (dy * PAR).toFixed(2) + "px)"; }
    if (camEl && luz) { camEl.style.setProperty("--luz-x", luz.x.toFixed(1) + "px"); camEl.style.setProperty("--luz-y", luz.y.toFixed(1) + "px"); }
  }
  // a luz: atrás do casco (segue o pouso da estampa) e, em "under", vai ao rosto de Nares (0,6 s, eb): "a antiga fica, a luz escolhe"
  function alvoLuz(t) {
    var a = pousoFoto(t, T.g, G), b = pousoFoto(t, T.n, N);
    var p = eb(seg(t, T.luz, T.luzDur));
    return { x: lerp(CASCO.x, ROSTO.x, p), y: lerp(CASCO.y - a.dy, ROSTO.y - b.dy, p) };
  }

  function cena(t) {
    t = t + 0.0005;
    aplicarCamera(camEstado(Math.min(t, T.repouso)), t, alvoLuz(t - 0.12));
    var a = pousoFoto(t, T.g, G);
    objeto("grav", "gSombra", G, a);
    fita(E("gFe"), t, T.gFita, "e"); fita(E("gFd"), t, T.gFita + 0.12, "d");
    texto(E("avisoG"), t, T.avisoG, null);
    texto(E("rNavio"), t, T.navio, T.navioSai);
    var b = pousoFoto(t, T.n, N);
    objeto("nares", "nSombra", N, b);
    fita(E("nFe"), t, T.nFita, "e"); fita(E("nFd"), t, T.nFita + 0.12, "d");
    texto(E("avisoN"), t, T.avisoN, null);
    var n = E("nome");
    if (n) texto(n, t, T.nome, null, N.cx - n.offsetWidth / 2, N.cy + N.h / 2 + 24);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  window.__renderAt(0);
})();
</script>
