  // textos-tela (opacidade + 24 px de descida) ──
  function vida(t, t0, t1) {
    var e = eo(seg(t, t0, 0.3)), s = t1 == null ? 0 : seg(t, t1 - 0.3, 0.3);
    return { op: Math.min(e, 1 - s), dy: 24 * (1 - e) + 24 * s };
  }
  // a pílula com o CENTRO no ponto (x, y) da tela
  function porCentro(el, x, y, v) {

  // a caixa de um elemento na tela (para __medidas)
  function caixa(id) { var e = E(id); if (!e) return null; var r = e.getBoundingClientRect(); return [Math.round(r.left), Math.round(r.top), Math.round(r.right), Math.round(r.bottom), +(+getComputedStyle(e).opacity).toFixed(2)]; }

  function creditos(t, extras) {

  // ═══ fim das peças ═══

  // ── A CONFERÊNCIA DA COMPOSIÇÃO (só leitura, para a prévia do mapista e para o qc): as caixas das pílulas no instante t e a
  // folga de cada uma até o contorno da fossa (0 = encosta ou cruza), e se o centro dela cai dentro da fossa ──

  // ═══ A CENA s20 (tempo local = master − 118,900) ═══
  var DUR = 11.4;   // número literal, a dur do espelho (o qc-janela só lê o número)
  window.__duracao = DUR;

  var TEXTOS = {

    num0: "0 FT",                                                  // eixo, 2,967–7,767 (a régua: só as pontas,
    num30: "30,000 FT",                                            //   "a arte pode mostrar só parte deles")
    cota: "1939 · SOUND · MORE THAN 28,000 FT · REPORTED",         // cota, 3,6–7,767 ("more than twenty-eight thousand")
    crFonte: "Source: National Geographic Society bulletin, 1939", // credito, 3,6–7,767
    rotMilw: "Milwaukee Deep (1939)",                              // rotulo, 8,867–11,4 ("Milwaukee Deep")
    crMapa: ["© MapTiler © OpenStreetMap contributors", "GEBCO Compilation Group (2026) GEBCO 2026 Grid"]   // credito, 0–11,4
  };

  var COTA_LINHAS = ["1939 · SOUND", "MORE THAN 28,000 FT", "REPORTED"];
  if (COTA_LINHAS.join(" · ") !== TEXTOS.cota) falhar("a cota em linhas não é a do textos-tela.");
  ["rotNorte", "num0", "num30", "crFonte", "rotMilw"].forEach(function (k) { var e = E(k); if (e) e.textContent = TEXTOS[k]; });
  (function () { var e = E("cota"); if (e) e.textContent = COTA_LINHAS.join("\n"); })();
  var T = { fossa: 1.275, norte: 1.5, norteFim: 8.734, med: 2.967, medFim: 7.767, desce: 3.05, cota: 3.6, cotaFim: 7.767, milw: 8.867 };

  // ═══ A CÂMERA, norte para cima, sem parar do 1º ao último quadro (soma de uma deriva lenta e de UMA viagem, nunca salto) ═══
  // b0–b1: deriva lenta para leste e aproximação lenta, com Porto Rico INTEIRO acima da cota (a pílula da cota ocupa o canto de
  // baixo à direita, ao lado do medidor). b2: em 7,6 s, quando a cota já está saindo e o medidor vai enrolar, UMA viagem de 1,8 s
  // (cúbica de entrada e saída; identidade §4.4) sobe até a fossa, a noroeste, onde o nome assenta: a lista antiga põe o
  // Milwaukee Deep em 19°35'N 66°30'W (S02, Tabela 1; milwaukee-deep-lista-antiga), dentro do trecho que a pílula cobre. Depois,
  // a deriva lenta para leste continua até o corte. A viagem não vai para leste porque a pílula de 128 px só cabe POR DENTRO da

  var CAM = { lon0: -65.35, lat0: 18.62, z0: 8.32, vLon: 0.02, vLat: 0.002, vZ: 0.012, tA: 7.6, dA: 1.8, alvo: [-66.45, 19.30], zAlvo: 9.15 };

  }

  // ═══ OS LUGARES (de onde cada peça se ancora) ═══
  var NAVIO = [-66.40, 19.62];   // o navio-ponto: sobre a fossa ao norte de Porto Rico, SEM alfinete (a posição do
                                 // Milwaukee muda de fonte para fonte: F26, F29; espelho › s20 › motivo). É desenho, não sítio.
  var NORTE = [-66.45, 18.80];   // NORTH OF PUERTO RICO: na faixa de mar entre a costa norte e a fossa (o mar ao norte de Porto
                                 // Rico, a região do b0), sem tocar o contorno da fossa
  var MILW = [-66.95, 19.64];    // a pílula de REGIÃO Milwaukee Deep (1939): por dentro da fossa, sem tocar o contorno

  // ═══ O PULSO DE SOM (ilustração sobre o mapa): três anéis descem do navio (crescem e apagam: afundam) e voltam (encolhem e
  // acendem: o eco), em 1,2 s, duas vezes (0,0 s em "bounced" e 1,35 s), e param; o navio sai antes da régua ═══
  var ANEIS = [];
  function montarPulso() {

    var nv = svgEl(s, "circle", { id: "navio", cx: 0, cy: 0, r: 20, "stroke-width": 10 });
    nv.style.fill = "var(--tinta)"; nv.style.stroke = "var(--rotulo)"; nv.style.paintOrder = "stroke fill";
  }
  function pulso(t, x, y, op) {
    var PINGS = [0.0, 1.35];
    ANEIS.forEach(function (a, i) {
      var r = 0, o = 0;
      PINGS.forEach(function (t0) {
        var s = t0 + 0.1 * i, desce = seg(t, s, 0.45), volta = seg(t, s + 0.55, 0.45);
        if (t >= s && t < s + 0.45) { r = 34 + 250 * eo(desce); o = 0.95 * (1 - desce); }
        else if (t >= s + 0.55 && t < s + 1.0) { r = 284 - 250 * eo(volta); o = 0.25 + 0.7 * volta; }
      });

  // ═══ O MARCADOR DE 1939 no medidor: o traço desce de 0 a 28,000 ft (y 1620) e, na cota, a guia vai até a pílula e a seta
  // aponta para baixo ("more than": faixa ou seta abaixo de 28,000, nunca um ponto; textos-tela › s20) ═══

  function montarMarca(s) {

    // no traço da série (s18): a marca de 9 px sobre o contorno de 20, de x 3330 a 3440; a guia de 4 px sobre 12; a seta como a marca
    MARCA.guia = parTraco(g, "line", {}, 4, 12, "var(--neutro)");
    MARCA.seta = parTraco(g, "path", { d: "M0 0" }, 8, 18, "var(--neutro)");
    MARCA.traco = parTraco(g, "line", {}, 9, 20, "var(--neutro)");
  }
  var COTA_DIR = 2830;   // a borda direita da pílula da cota: longe dos números da régua (que acabam em x 3310)
  function marca(t, op) {
    if (!MARCA.g) return;
    MARCA.g.style.opacity = op.toFixed(3);
    var y = yFt(28000 * eb(seg(t, T.desce, 0.55)));
    MARCA.traco.set("x1", MED.eixo - 50); MARCA.traco.set("x2", MED.eixo + 60);
    MARCA.traco.set("y1", y.toFixed(1)); MARCA.traco.set("y2", y.toFixed(1));
    var g = eo(seg(t, T.cota, 0.3));
    MARCA.guia.set("x1", (MED.eixo - 50).toFixed(1)); MARCA.guia.set("x2", (MED.eixo - 50 - (MED.eixo - 50 - COTA_DIR) * g).toFixed(1));
    MARCA.guia.set("y1", y.toFixed(1)); MARCA.guia.set("y2", y.toFixed(1));
    MARCA.guia.op(g > 0 ? "1" : "0");
    var L = 96 * g, x = MED.eixo;
    MARCA.seta.set("d", g > 0 ? "M" + x + " " + y + "V" + (y + L) + "M" + (x - 26) + " " + (y + L - 28) + "L" + x + " " + (y + L) + "L" + (x + 26) + " " + (y + L - 28) : "M0 0");
  }

  var MEDIDOR = null;
  window.__fotosProntas = true;
  if (prepararFossa()) iniciarMapa({ c0: cameraEm(0), creditoMapa: TEXTOS.crMapa });
  MEDIDOR = montarMedidor([27366, 23250]);   // os traços de 1883 (s15) e do Challenger (s18), sem rótulo
  montarPulso();
  montarMarca(E("svgMed"));

  function cena(t) {
    t = t + 0.0005;
    if (map && mapaCarregado) map.jumpTo(cameraEm(t));
    // a fossa: acende (preenche e contorna) em 500 ms em "bottom" — a região falada, demarcada enquanto é dita
    var f = eo(seg(t, T.fossa, 0.5));
    if (mapaCarregado) desenharFossa(E("fossa"), { preench: f, contorno: f });
    // o navio e o pulso
    var pn = map && mapaCarregado ? map.project(NAVIO) : { x: 0, y: 0 };
    pulso(t, pn.x, pn.y, 1 - seg(t, 2.55, 0.35));
    // NORTH OF PUERTO RICO, preso ao mar ao norte da fossa
    var pN = map && mapaCarregado ? map.project(NORTE) : { x: 0, y: 0 };
    porCentro(E("rotNorte"), pN.x, pN.y, vida(t, T.norte, T.norteFim));
    // o medidor: desenrola em "It" (450 ms) e enrola depois da cota (400 ms)
    var k = Math.min(eo(seg(t, T.med, 0.45)), 1 - eb(seg(t, T.medFim, 0.4)));
    medidorAberto(MEDIDOR, k);
    var vn0 = vida(t, T.med + 0.05, T.medFim), vn30 = vida(t, T.med + 0.30, T.medFim);
    porNumero(E("num0"), 0, vn0.op); porNumero(E("num30"), 30000, vn30.op);
    marca(t, Math.min(seg(t, T.desce, 0.1), 1 - seg(t, T.cotaFim - 0.3, 0.3)));

    var ct = E("cota");
    if (ct) {
      var v = vida(t, T.cota, T.cotaFim), cs = getComputedStyle(ct), lh = parseFloat(cs.lineHeight), pt = parseFloat(cs.paddingTop);
      ct.style.opacity = v.op.toFixed(3);

    }

    var pM = map && mapaCarregado ? map.project(MILW) : { x: 0, y: 0 };
    porCentro(E("rotMilw"), pM.x, pM.y, vida(t, T.milw, null));
    creditos(t, [{ id: "crFonte", t0: T.cota, t1: T.cotaFim }]);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); return true; };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  window.__ready.then(function () { window.__renderAt(0); }, function () {});
  window.__medidas = function (t) { return medir(t, ["rotNorte", "rotMilw", "cota", "num0", "num30", "crMapa", "crFonte"]); };
  window.__renderAt(0);
})();
