    return ds;
  }

  // ── o NÚMERO SEM VALOR: cinco células de sete segmentos (o "8"). Os sete segmentos de uma célula crescem JUNTOS, do meio para as
  //    pontas (0,18 s, eo), para que nenhum estado intermediário forme um algarismo ou uma letra (um "7" ou um "J" seria um valor);
  //    as células se sucedem a cada 0,07 s, da esquerda para a direita ──
  var CW = 96, CH = 176, GAP = 34, NC = 5, X0N = XE - (NC * CW + (NC - 1) * GAP) / 2, CRESCE = 0.18, PASSO_C = 0.07;
  var SEGS = [[8, 0, 88, 0], [96, 8, 96, 84], [96, 92, 96, 168], [88, 176, 8, 176], [0, 168, 0, 92], [0, 84, 0, 8], [8, 88, 88, 88]];
  var gS = E("gSegs"), segs = [], somD = "";
  for (var ci = 0; ci < NC; ci++) for (var si = 0; si < SEGS.length; si++) {
    var q = SEGS[si], x0 = X0N + ci * (CW + GAP);
    var ax = x0 + q[0], ay = q[1] - CH / 2, bx = x0 + q[2], by = q[3] - CH / 2;
    var el = document.createElementNS(NS, "path"); el.setAttribute("class", "ar"); el.setAttribute("d", ""); if (gS) gS.appendChild(el);
    segs.push({ el: el, t0: T.numero + ci * PASSO_C, ax: ax, ay: ay, bx: bx, by: by });
    somD += "M" + ax + "," + ay + " L" + bx + "," + by + " ";
  }
  if (E("somNum")) E("somNum").setAttribute("d", somD);
  function yNum(t) { return lerp(345, 300, eo(seg(t, T.numero, T.sobe))); }   // o centro do número: da linha d'água ao alto

  // a CÂMERA: push-in de 0,006/s em torno de (1920, 1450), o chão escuro; para 250 ms antes do corte; a deriva; o still a 0,6
  function camera(t) {
    var s = 1 + 0.006 * Math.min(t, T.repouso), dx = 6 * Math.sin(t * 0.23), dy = 4.8 * Math.sin(t * 0.17);
    var c = E("cam"); if (c) c.style.transform = "scale(" + s.toFixed(5) + ") translate(" + f2(dx) + "px," + f2(dy) + "px)";
    var st = E("still"); if (st) st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ") translate(" + f2(dx * 0.6) + "px," + f2(dy * 0.6) + "px)";
  }

  function cena(t) {
    t = t + 0.0005;
    camera(t);
    // o pulso
    for (var a = 0; a < TE.length; a++) {
      var ds = frente(a, t);
      for (var k = 0; k < AMP.length; k++) { var p = ondas[a][k]; p.setAttribute("d", ds[k]); p.style.opacity = (AMP[k] * BRILHO[a]).toFixed(3); }
    }
    // o número: os segmentos de cada célula crescem juntos do meio às pontas; o conjunto sobe da linha d'água e fica
    var yc = yNum(t), vis = t >= T.numero;
    var g = E("gNum"); if (g) { g.setAttribute("transform", "translate(0," + f2(yc) + ")"); g.style.opacity = vis ? "1" : "0"; }
    for (var i = 0; i < segs.length; i++) {
      var sg = segs[i], pr = eo(seg(t, sg.t0, CRESCE)), mx = (sg.ax + sg.bx) / 2, my = (sg.ay + sg.by) / 2;
      sg.el.setAttribute("d", pr > 0 ? "M" + f2(lerp(mx, sg.ax, pr)) + "," + f2(lerp(my, sg.ay, pr)) + " L" + f2(lerp(mx, sg.bx, pr)) + "," + f2(lerp(my, sg.by, pr)) : "");
    }
    var sm = E("somNum"); if (sm) sm.style.opacity = (0.8 * eo(seg(t, T.numero + (NC - 1) * PASSO_C + CRESCE, 0.3))).toFixed(3);
    // a luz: no emissor; depois atrás do número, 120 ms atrás dele. Nunca desce ao chão.
    var ly = t < T.numero + 0.12 ? YS : yNum(t - 0.12);
    var lz = E("luz"); if (lz) { lz.style.setProperty("--luz-x", (XE + 140) + "px"); lz.style.setProperty("--luz-y", f2(ly + 140) + "px"); }
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  // O GANCHO DE MEDIDA (só leitura, do DOM): onde a 1ª frente está (o ponto do meio, na tela), e onde está o número
  window.__s22peca = function (t) {
    t = clamp(+t || 0, 0, DUR); window.__renderAt(t);
    var r = C * (t - TE[0]), z = r, k = Math.floor(z / DP), dd = z - k * DP; if (k % 2 === 1) dd = DP - dd;
    var bn = E("gSegs").getBoundingClientRect(), lw = E("linhaAgua").getBoundingClientRect(), ch = E("chao").getBoundingClientRect();
    return { t: t, travessia: k, y_frente_desenho: +(YS + dd).toFixed(1), numero_tela: [Math.round(bn.left), Math.round(bn.top), Math.round(bn.right), Math.round(bn.bottom)],
      linha_dagua_tela: Math.round((lw.top + lw.bottom) / 2), chao_tela: Math.round((ch.top + ch.bottom) / 2) };
  };
  window.__renderAt(0);
})();
</script>
