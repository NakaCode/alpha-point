  // folga de cada uma até o contorno da fossa (0 = encosta ou cruza), e se o centro dela cai dentro da fossa ──

  // ═══ A CENA s28 (tempo local = master − 172,067) ═══
  var DUR = 7.433;   // número literal, a dur do espelho (o qc-janela só lê o número)
  window.__duracao = DUR;

  var TEXTOS = {

  var FT = { rede: 27460 };

  // quadro, SEM visita e SEM pulso (a rede não chegou nele) ═══
  var ANEL = null, ANEL_C = null;
  function prepararAnel() {

    var f = (g.features || [])[0];

  }

  // ═══ A REDE (ilustração sobre o mapa; o traço de engenheiro, identidade §5: só linha --tinta, a aresta escondida
  // tracejada; o miolo --rotulo a 45 % só para a malha se separar da régua que fica atrás: a rede é vazada, a régua aparece
  // por ela). A peça, no espaço dela (px locais, origem no ponto em que o cabo prende o freio; y para baixo), a 1,5×:
  //   o freio (dois cabos curtos do ponto do cabo até a boca), a BOCA (o aro visto quase de lado: a metade da frente em linha
  //   cheia, a de trás tracejada), o SACO afunilando até o copo (a ponta de baixo, y 160 local = 240 px: o ponto que a régua
  //   mede) e o nó do copo. A malha: diagonais de 3 px recortadas pelo saco. A 1,5×: 150 px de largura, 240 de altura.
  // A FÍSICA (o método do ilustrador: ilustracao/knowledge/ilustracao/CONSTRUCAO.md, "Cabo/corrente: extremidades fixas";

  //   até parar). Nada empurra a rede de lado, então ela NÃO balança (nenhum balanço sem fonte de energia), e o saco é desenhado

  var REDE = { x: 3412, sup: 220, esc: 1.5, alt: 160, rampa: 0.35 };
  var R28 = {};

    R28.caboSob = svgEl(s, "line", { x1: REDE.x, x2: REDE.x, y1: REDE.sup, y2: REDE.sup, "stroke-width": 11, "stroke-linecap": "round" }); R28.caboSob.style.stroke = "var(--rotulo)";

    var g = svgEl(s, "g", { id: "rede" });
    function linha(tag, at, w, extra) {

      e.setAttribute("vector-effect", "non-scaling-stroke"); if (extra) for (var k in extra) e.setAttribute(k, extra[k]); return e;
    }
    var miolo = svgEl(g, "path", { d: SACO }); miolo.style.fill = "color-mix(in srgb, var(--rotulo) 45%, transparent)"; miolo.style.stroke = "none";
    // a malha: as duas diagonais (45°) a cada 22 px locais, cortadas no retângulo do saco (x −50…50, y 34…160) e recortadas
    // pela forma dele (o clipPath); cortadas no retângulo para a caixa da peça ser a do saco, e não a de linhas invisíveis
    var malha = svgEl(g, "g", { "clip-path": "url(#sacoClip)" }), dM = "";
    var BX0 = -50, BX1 = 50, BY0 = 34, BY1 = 160;
    function diag(c, s) {   // a reta y = s·x + c cortada no retângulo; s = ±1
      var p = [];
      [BX0, BX1].forEach(function (x) { var y = s * x + c; if (y >= BY0 && y <= BY1) p.push([x, y]); });

      if (p.length >= 2) dM += "M" + p[0][0].toFixed(1) + " " + p[0][1].toFixed(1) + "L" + p[1][0].toFixed(1) + " " + p[1][1].toFixed(1);
    }

    var m = svgEl(malha, "path", { d: dM }); m.style.stroke = "var(--tinta)"; m.style.fill = "none"; m.style.opacity = "0.5";
    m.setAttribute("stroke-width", 3); m.setAttribute("vector-effect", "non-scaling-stroke");
    linha("path", { d: SACO }, 6);                                                     // o contorno do saco
    linha("path", { d: "M-50 34 A50 11 0 0 1 50 34" }, 6, { "stroke-dasharray": "14 12" });   // a boca, a metade de trás (escondida)
    linha("path", { d: "M-50 34 A50 11 0 0 0 50 34" }, 6);                             // a boca, a metade da frente
    linha("path", { d: "M0 0 L-50 34 M0 0 L50 34" }, 4);                               // o freio
    linha("line", { x1: -14, y1: 144, x2: 14, y2: 144 }, 6);                           // o nó do copo
    R28.rede = g;
    // a MARCA da visita, no traço da série (s15, s18, s25): 9 px --neutro sobre 20 px --rotulo, de x 3330 a 3440, por cima da
    // rede; a guia (4 sobre 12) da borda da cota (x 3300) ao começo da marca (x 3330)
    R28.marca = parTraco(s, "line", { x1: MED.eixo - 50, x2: MED.eixo + 60, y1: yFt(FT.rede), y2: yFt(FT.rede) }, 9, 20, "var(--neutro)");
    R28.guia = parTraco(s, "line", { x1: COTA_DIR, x2: COTA_DIR, y1: yFt(FT.rede), y2: yFt(FT.rede) }, 4, 12, "var(--neutro)");
    R28.marca.op("0"); R28.guia.op("0");
  }
  var COTA_DIR = 3300;   // a borda direita da cota, como o marcador das s15 e s18 (M2)
  // o cabo pago (px), de 0 (a boca na superfície) até a ponta em 27,460 ft: o trapézio de velocidade do guincho
  function caboPago(t) {
    var D = yFt(FT.rede) - (REDE.sup + REDE.alt * REDE.esc), Tt = T.rede1 - T.rede0, a = REDE.rampa, v = D / (Tt - a), u = t - T.rede0;
    if (u <= 0) return 0;
    if (u >= Tt) return D;
    if (u < a) return v * u * u / (2 * a);

  function rede(t) {
    if (!R28.rede) return;
    var yApice = REDE.sup + caboPago(t), op = seg(t, T.rede0, 0.15);   // entra na água: 150 ms de opacidade na superfície
    R28.rede.setAttribute("transform", "translate(" + REDE.x + "," + yApice.toFixed(2) + ") scale(" + REDE.esc + ")");

  }
  // a ponta da rede na tela (para a conferência: o contato que se mede no DOM, não na fórmula)
  function pontaDaRede() { var g = E("rede"); if (!g) return null; var r = g.getBoundingClientRect(); return [Math.round(r.left), Math.round(r.top), Math.round(r.right), +(r.bottom).toFixed(2)]; }

  var MEDIDOR = null;
  window.__fotosProntas = true;
  if (prepararAnel()) iniciarMapa({ c0: cameraEm(0), creditoMapa: TEXTOS.crMapa });
  // os traços sem rótulo das visitas anteriores (textos-tela › _regras_de_serie: "SÓ A VISITA DA VEZ TEM RÓTULO"): 1883 (s15),
  // o Challenger (s18), 1939 (s20) e 1964 em ~24,000 ft, a profundidade da série (s26 "1964 · CREW · ~24,000 FT"; a s53 põe o mesmo traço
  // sem rótulo em 24,000, y 1420; conserto 2, 29/10: era 21,120, o "MORE THAN 4 MI" da s25)
  MEDIDOR = montarMedidor([27366, 23250, 28000, 24000]);
  montarRede(E("svgRede"));
  ANEL = montarAnel(E("svgIlus"));

  function cena(t) {
    t = t + 0.0005;
    if (map && mapaCarregado) map.jumpTo(cameraEm(t));
    // o anel, preso ao ponto, aceso e sem visita
    if (ANEL && map && mapaCarregado) { var pa = map.project(ANEL_C); ANEL.setAttribute("transform", "translate(" + pa.x.toFixed(2) + "," + pa.y.toFixed(2) + ")"); ANEL.style.opacity = "1"; }

    medidorAberto(MEDIDOR, eo(seg(t, T.med, 0.45)));

    porNumero(E("num15"), 15000, vida(t, T.med + 0.12, null).op);
    porNumero(E("num30"), 30000, vida(t, T.med + 0.30, null).op);
    rede(t);
    // a cota, à esquerda da régua, centrada na altura da marca (y 1593): entra na palavra e fica PARADA até o corte
    var ct = E("cota");
    if (ct) {
      var v = vida(t, T.cota, null);
      ct.style.opacity = v.op.toFixed(3);
      ct.style.transform = "translate(" + (COTA_DIR - ct.offsetWidth).toFixed(1) + "px," + (yFt(FT.rede) - ct.offsetHeight / 2 + v.dy).toFixed(1) + "px)";
    }
    creditos(t, [{ id: "crFonte", t0: T.fonte, t1: null }]);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); return true; };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  window.__ready.then(function () { window.__renderAt(0); }, function () {});
  window.__medidas = function (t) {
    var m = medir(t, ["cota", "num0", "num15", "num30", "crMapa", "crFonte"]);
    if (ANEL_C && map) { var p = map.project(ANEL_C); m.anel = [Math.round(p.x), Math.round(p.y)]; }
    m.rede = pontaDaRede(); m.fundoSonarY = yFt(MED.fundo); m.marcaY = yFt(FT.rede);
    return m;
  };

})();
