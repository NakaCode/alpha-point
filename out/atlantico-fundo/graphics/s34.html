  }
  function d(pts, ini) { return pts.map(function (p, i) { return ((i || !ini) ? (i ? "L" : "M") : ini) + f2(p[0]) + "," + f2(p[1]); }).join(" "); }

  // ── A PLACA CONTINENTAL (fixa): o pé da parede interna sobre o teto da fenda, a parede, a costa, a terra, o corte ──
  var S_PE = SA + 100;                     // o pé da parede interna (a fossa mais funda) no topo do caminho
  var PE = sup2(S_PE, -1);                 // (2069,1, 1194,3)
  var YN = 640;                            // o nível do mar
  var COSTA = [2420, YN];
  var TERRA = [[2560, 560], [2760, 522], [3000, 476], [3200, 446], [3400, 470], [3640, 455]];
  var YB = 1760;                           // o corte de baixo da seção
  var S_TETO_FIM = SA + (YB - eixo(SA).y + MEIA * Math.cos(DIP)) / Math.sin(DIP) - 4;  // onde o teto chega ao corte
  (function () {
    var c = "M" + f2(PE[0]) + "," + f2(PE[1]) + " L" + COSTA[0] + "," + COSTA[1];
    TERRA.forEach(function (p) { c += " L" + p[0] + "," + p[1]; });
    if (E("contorno")) E("contorno").setAttribute("d", c);
    // o teto da fenda: o topo do caminho, do pé da parede até o corte de baixo (o contato entre as placas)
    if (E("teto")) E("teto").setAttribute("d", d(curva(S_PE, S_TETO_FIM, -1, 16)));
    var fimTeto = sup2(S_TETO_FIM, -1);
    // o corte da seção: a quebra em zigue-zague na borda direita e a linha de corte embaixo (a seção continua)
    var z = "M3640,455"; for (var y = 455, i = 0; y < YB; y += 52, i++) z += " L" + (3640 + (i % 2 ? -14 : 14)) + "," + Math.min(YB, y + 52);
    z += " M" + f2(fimTeto[0]) + "," + YB + " L3640," + YB;
    if (E("corteCont")) E("corteCont").setAttribute("d", z);
  })();

  // ── A ÁGUA: o nível do mar (do corte da esquerda à costa), o ∇ e a hachura do líquido, longe do texto e da fossa ──
  (function () {
    if (E("linhaAgua")) E("linhaAgua").setAttribute("d", "M" + X0 + "," + YN + " L" + COSTA[0] + "," + YN);
    var xn = 1780;
    if (E("nivel")) E("nivel").setAttribute("d", "M" + (xn - 32) + "," + (YN - 52) + " L" + (xn + 32) + "," + (YN - 52) + " L" + xn + "," + (YN - 5) + " Z" +
      " M" + (xn - 26) + "," + (YN + 22) + " L" + (xn + 26) + "," + (YN + 22) + " M" + (xn - 12) + "," + (YN + 40) + " L" + (xn + 12) + "," + (YN + 40));
    var s = "", AG = [[1300, 760], [1180, 930], [1740, 860], [1920, 1010]];
    AG.forEach(function (c) { s += "M" + (c[0] - 36) + "," + c[1] + " L" + (c[0] + 36) + "," + c[1] + " M" + (c[0] - 24) + "," + (c[1] + 16) +
      " L" + (c[0] + 24) + "," + (c[1] + 16) + " M" + (c[0] - 12) + "," + (c[1] + 32) + " L" + (c[0] + 12) + "," + (c[1] + 32) + " "; });
    if (E("simbAgua")) E("simbAgua").setAttribute("d", s);
  })();

  // ── A SETA DO MOVIMENTO: sob a laje, ao longo do mesmo caminho, da reta ao mergulho (o rumo: entra por baixo da outra) ──
  var S_SETA0 = SH - 560, S_SETA1 = SA + 200, OFF_SETA = MEIA + 92;
  var SETA = (function () {
    var pts = [], n = 60;
    for (var i = 0; i <= n; i++) { var e = eixo(S_SETA0 + (S_SETA1 - S_SETA0) * i / n); pts.push([e.x - e.dy * OFF_SETA, e.y + e.dx * OFF_SETA]); }
    return pts;
  })();
  var LEN_SETA = 0;
  for (var i = 1; i < SETA.length; i++) LEN_SETA += Math.hypot(SETA[i][0] - SETA[i - 1][0], SETA[i][1] - SETA[i - 1][1]);
  if (E("seta")) E("seta").setAttribute("d", d(SETA));
  (function () {   // a ponta aberta da seta, na tangente do fim
    var e = eixo(S_SETA1), p = SETA[SETA.length - 1], L = 46, W = 28;
    var bx = p[0] - e.dx * L, by = p[1] - e.dy * L;
    if (E("setaPonta")) E("setaPonta").setAttribute("d", "M" + f2(bx - e.dy * W) + "," + f2(by + e.dx * W) + " L" + f2(p[0]) + "," + f2(p[1]) +
      " L" + f2(bx + e.dy * W) + "," + f2(by - e.dx * W));
  })();

  // ── O DESLIZE: um controlador só. Perfil trapezoidal de velocidade (acelera ta, constante, freia tb), do repouso ao repouso ──
  var DS = 851, TA = 0.40, TB = 0.50;
  function desliza(t) {
    var tt = clamp(t - T.desliza, 0, T.deslizaDur), Tt = T.deslizaDur, v = DS / (Tt - TA / 2 - TB / 2);
    if (tt <= TA) return v * tt * tt / (2 * TA);
    if (tt <= Tt - TB) return v * TA / 2 + v * (tt - TA);
    var r = Tt - tt; return DS - v * r * r / (2 * TB);
  }

  // a laje no instante: o material entre o corte da esquerda (s 0) e a ponta (s = SH + deslize)
  var PASSO_H = 52, INCL_H = 40;
  function laje(t) {
    var sp = SH + desliza(t);
    var topo = curva(0, sp, -1, 12), base = curva(0, sp, 1, 12).reverse();
    var c = d(topo) + " " + d(base, "L") + " Z";
    ["laje", "lajeSombra"].forEach(function (k) { if (E(k)) E(k).setAttribute("d", c); });
    // a hachura de corte anda COM o material: a fase é o próprio deslize
    var h = "", fase = desliza(t) % PASSO_H;
    for (var m = fase + 12; m + INCL_H < sp - 10; m += PASSO_H) {
      var a = sup2(m, -1), b = sup2(m + INCL_H, 1);
      h += "M" + f2(a[0]) + "," + f2(a[1]) + " L" + f2(b[0]) + "," + f2(b[1]) + " ";
    }
    if (E("lajeHach")) E("lajeHach").setAttribute("d", h);
    // a quebra no corte da esquerda (a placa continua)
    var q = "M" + X0 + "," + (YC - MEIA); for (var y = YC - MEIA, j = 0; y < YC + MEIA; y += 26, j++) q += " L" + (X0 + (j % 2 ? -12 : 12)) + "," + Math.min(YC + MEIA, y + 26);
    if (E("corteLaje")) E("corteLaje").setAttribute("d", q);
    return sp;
  }

  function texto(id, t, tin, x, y) {
    var e = E(id); if (!e) return;
    var pi = eo(seg(t, tin, 0.3));
    e.style.opacity = pi.toFixed(3);
    e.style.transform = "translate(" + f2(x) + "px," + f2(y + 24 * (1 - pi)) + "px)";
  }
  function corre(id, len, p) { var e = E(id); if (!e) return; e.style.strokeDasharray = len.toFixed(1); e.style.strokeDashoffset = (len * (1 - p)).toFixed(1); }
  // a CÂMERA: push-in contínuo (0,0024/s, base 1,0) que PARA 250 ms antes do corte; a deriva do RIG segue; o still a 0,6
  function camera(t) {
    var c = E("cam"), s = 1 + 0.0024 * Math.min(t, T.repouso), dx = 6 * Math.sin(t * 0.23), dy = 4.8 * Math.sin(t * 0.17);
    if (c) c.style.transform = "scale(" + s.toFixed(5) + ") translate(" + f2(dx) + "px," + f2(dy) + "px)";
    var st = E("still"); if (st) st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ") translate(" + f2(dx * 0.6) + "px," + f2(dy * 0.6) + "px)";
  }

  function cena(t) {
    t = t + 0.0005;
    camera(t);
    laje(t);
    // a seta se traça ao longo do caminho quando o deslize começa; a ponta abre no fim do traço
    var ps = eo(seg(t, T.seta, T.setaDur));
    corre("seta", LEN_SETA, ps);
    var se = E("seta"); if (se) se.style.opacity = t >= T.seta ? "1" : "0";
    var sp = E("setaPonta"); if (sp) sp.style.opacity = eo(seg(t, T.seta + T.setaDur - 0.08, 0.12)).toFixed(3);
    // a luz: atrás da dobra (a fossa), parada (a dobra não anda: o material é que passa por ela)
    var lz = E("luz"); if (lz) { lz.style.setProperty("--luz-x", (1960 + 140) + "px"); lz.style.setProperty("--luz-y", (1120 + 140) + "px"); }
    texto("rotPacific", t, T.rot, 420, 772);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  // O GANCHO DE MEDIDA (só leitura, do DOM): a ponta da laje na tela, o quanto o topo dela se afasta do teto da fenda
  window.__s34peca = function (t) {
    t = clamp(+t || 0, 0, DUR); window.__renderAt(t);
    var sp = SH + desliza(t), lj = E("laje"), te = E("teto");
    var m = lj.getScreenCTM(), p = lj.ownerSVGElement.createSVGPoint();
    var ponta = sup2(sp, -1); p.x = ponta[0]; p.y = ponta[1]; var pt = p.matrixTransform(m);
    // a distância do canto de cima da ponta ao teto (na geometria do teto, medida no DOM pelo comprimento do caminho)
    var L = te.getTotalLength(), melhor = 1e9;
    for (var i = 0; i <= 400; i++) { var q = te.getPointAtLength(L * i / 400); melhor = Math.min(melhor, Math.hypot(q.x - ponta[0], q.y - ponta[1])); }
    return { t: t, deslize_px: +desliza(t).toFixed(2), ponta_tela: [+pt.x.toFixed(1), +pt.y.toFixed(1)],
             sob_o_teto: sp > S_PE, dist_topo_teto_px: sp > S_PE ? +melhor.toFixed(2) : null };
  };
  window.__renderAt(0);
})();
</script>
</body>
