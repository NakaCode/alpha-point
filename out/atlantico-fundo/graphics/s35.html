    caminho(); ctx.lineWidth = 12; ctx.strokeStyle = gradienteDasPontas(ctx, C, c.frontC, c.frontC[3] * alfa); ctx.stroke();
    caminho(); ctx.lineWidth = 5; ctx.strokeStyle = gradienteDasPontas(ctx, C, c.front, c.front[3] * alfa); ctx.stroke();
    ctx.restore();
  }
  // a LINGUETA: uma faixa estreita que passa por baixo da placa do Caribe, ao sul do contato, num trecho só (nunca a subducção
  // plena): o preenchimento --neutro e o contorno tracejado (a convenção da linha escondida). xm = o centro do trecho, meia = a meia
  // largura, prof = quanto ela passa por baixo (px), k = o crescimento
  function lingueta(ctx, C, xm, meia, prof, k, alfa) {
    if (k <= 0 || alfa <= 0) return;
    var c = cores2(), xa = xm - meia, xb = xm + meia, pts = [], n = 36;
    for (var i = 0; i <= n; i++) { var x = lerp(xa, xb, i / n); pts.push([x, yContato(C, x)]); }
    var fundo = pts.slice().reverse().map(function (p, j) {
      var u = 1 - j / n; return [p[0], p[1] + prof * k * Math.sqrt(Math.max(0, Math.sin(Math.PI * u)))];
    });
    ctx.save(); ctx.beginPath(); pts.concat(fundo).forEach(function (p, i) { if (i) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); }); ctx.closePath();
    ctx.fillStyle = css(c.neutro, 0.55 * alfa); ctx.fill();
    ctx.setLineDash([18, 12]); ctx.lineWidth = 4; ctx.strokeStyle = css(c.tinta, 0.9 * alfa);
    ctx.beginPath(); fundo.forEach(function (p, i) { if (i) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); }); ctx.stroke();
    ctx.restore();
  }
  // a SETA no traço do canal: o corpo e a ponta em --tinta sobre o contorno --rotulo (k = o quanto já saiu do pé)
  function seta(ctx, x0, y0, x1, y1, k, alfa, larg) {
    if (k <= 0 || alfa <= 0) return;
    var c = cores2(), w = larg || 10, xe = lerp(x0, x1, k), ye = lerp(y0, y1, k), dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1;
    var ux = dx / L, uy = dy / L, H = 4.4 * w, B = 2.6 * w;
    var xb = xe - ux * H * 0.85, yb = ye - uy * H * 0.85;
    function corpo() { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(xb, yb); }
    function ponta() { ctx.beginPath(); ctx.moveTo(xe, ye); ctx.lineTo(xe - ux * H - uy * B, ye - uy * H + ux * B); ctx.lineTo(xe - ux * H + uy * B, ye - uy * H - ux * B); ctx.closePath(); }
    ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round";
    corpo(); ctx.lineWidth = w + 12; ctx.strokeStyle = css(c.rotulo, 0.75 * alfa); ctx.stroke();
    ponta(); ctx.lineWidth = 12; ctx.strokeStyle = css(c.rotulo, 0.75 * alfa); ctx.stroke();
    corpo(); ctx.lineWidth = w; ctx.strokeStyle = css(c.tinta, alfa); ctx.stroke();
    ponta(); ctx.fillStyle = css(c.tinta, alfa); ctx.fill();
    ctx.restore();
  }
  // ── A GRAVIDADE (b3–b4): a linha do NORMAL (tracejada, --tinta) corre de oeste a leste sobre a fossa, um pouco ao norte da borda
  // norte dela; a CURVA da gravidade coincide com ela fora da fossa e cede ABAIXO dela sobre a fossa, como um fio que afunda. A
  // forma da curva é desenho (seno²), não dado: o único número é o −380 mGal do USGS, e a fonte não dá onde fica o mínimo; o vale
  // ocupa o vão leste–oeste da fossa inteira, com o fundo no meio dele ──
  var GRAV = { latNormal: 20.55, xMin: 220, xMax: 3620, fundo: 330 };
  function curvaGrav(ctx, kNormal, kCurva, afund, alfa) {
    if (alfa <= 0) return;
    var c = cores2(), y0 = P([-64.755, GRAV.latNormal]).y;
    var xa = P([FOSSA_LON[0], GRAV.latNormal]).x, xb = P([FOSSA_LON[1], GRAV.latNormal]).x;
    var xL = GRAV.xMin, xR = GRAV.xMax;
    function yc(x) { var u = (x - xa) / (xb - xa); if (u <= 0 || u >= 1) return y0; var s = Math.sin(Math.PI * u); return y0 + GRAV.fundo * afund * s * s; }
    ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (kNormal > 0) {
      var xn = lerp(xL, xR, kNormal);
      ctx.beginPath(); ctx.moveTo(xL, y0); ctx.lineTo(xn, y0);
      ctx.setLineDash([]); ctx.lineWidth = 15; ctx.strokeStyle = css(c.rotulo, 0.6 * alfa); ctx.stroke();
      ctx.setLineDash([36, 26]); ctx.lineWidth = 5; ctx.strokeStyle = css(c.tinta, 0.85 * alfa); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (kCurva > 0) {
      var xc = lerp(xL, xR, kCurva);
      ctx.beginPath();
      for (var x = xL; x <= xc + 0.5; x += 6) { var xx = Math.min(x, xc); if (x === xL) ctx.moveTo(xx, yc(xx)); else ctx.lineTo(xx, yc(xx)); }
      ctx.lineWidth = 20; ctx.strokeStyle = css(c.rotulo, 0.75 * alfa); ctx.stroke();
      ctx.lineWidth = 8; ctx.strokeStyle = css(c.tinta, alfa); ctx.stroke();
    }
    ctx.restore();
    return { x: (xa + xb) / 2, y: yc((xa + xb) / 2), y0: y0 };
  }

  // ═══ O DESENHO, função de t ═══
  var LINGUA_LON = -65.95;
  // as setas, presas ao mapa: a norte-americana no mar aberto ao norte da fossa (lat 20,40), para oeste; a do Caribe na faixa de mar
  // entre a fossa e as ilhas (lat 18,92), para leste, e que se alonga no b2
  var SETA_NA = [[-64.10, 20.40], [-65.45, 20.40]], SETA_CA = [[-65.10, 18.92], [-63.75, 18.92]], SETA_CA_LONGA = -63.20;
  var NOME_NA = [-66.10, 20.95], NOME_CA = [-66.75, 18.80];
  function desenhar(t) {
    var ok = map && mapaCarregado;
    var cvF = E("cvFossa"), cvP = E("cvPlacas"), cvI = E("cvIlus");
    // a fossa: 40 % do b0 ao b2 (contexto), 85 % do "gravity" em diante (o assunto); o contorno --tinta
    var kF = eo(seg(t, T.fossa, 0.5)), k85 = eo(seg(t, T.fossa85, 0.5));
    if (ok) desenharFossa(cvF, { preench: kF * lerp(0.40 / 0.85, 1, k85), contorno: kF * lerp(0.6, 1, k85) });
    var cP = cvP && cvP.getContext("2d"), cI = cvI && cvI.getContext("2d");
    if (cP) cP.clearRect(0, 0, 3840, 2160);
    if (cI) cI.clearRect(0, 0, 3840, 2160);
    if (!ok || !cP || !cI) return null;
    var C = contatoNaTela();
    // as placas saem no b3 (600 ms), os nomes ficam
    var sai = 1 - eb(seg(t, T.placasSaem, 0.6));
    // o deslize: a do Caribe para leste, a norte-americana para oeste (o movimento é relativo); no b2 só a do Caribe
    var kD = eb(seg(t, T.deslize, T.deslizeDur)), kM = eb(seg(t, T.caMove, T.caMoveDur));
    var dNA = -40 * kD, dCA = 40 * kD + 64 * kM;
    hachura(cP, C, -1, dNA, HACH.alfa * eo(seg(t, T.nomeNA, 0.5)) * sai);
    // a lingueta fica POR BAIXO da hachura do Caribe (é ela que passa por baixo)
    var xs = P([LINGUA_LON, 19.8]).x;
    var kL = eo(seg(t, T.lingua, T.linguaDur)), aL = 1 - eb(seg(t, T.linguaFim - 0.3, 0.3));
    lingueta(cP, C, xs, 300, 52, kL, aL);
    hachura(cP, C, 1, dCA, HACH.alfa * eo(seg(t, T.nomeCA, 0.5)) * sai);
    tracoContato(cP, C, eb(seg(t, T.contato, T.contatoDur)), sai);
    // as SETAS opostas (b0), ao lado do contato: a norte-americana 150 px ao norte, para oeste; a do Caribe 150 px ao sul, para leste
    var kS = eo(seg(t, T.setas, 0.5)), aS = 1 - eb(seg(t, T.setasFim, 0.3));
    var n0 = P(SETA_NA[0]), n1 = P(SETA_NA[1]), c0 = P(SETA_CA[0]), c1 = P(SETA_CA[1]), c2 = P([SETA_CA_LONGA, SETA_CA[1][1]]);
    seta(cI, n0.x, n0.y, n1.x, n1.y, kS, aS);       // b0: a norte-americana, para oeste
    seta(cI, c0.x, c0.y, c1.x, c1.y, kS, aS);       // b0: a do Caribe, para leste
    // b2: a do Caribe volta sozinha, mais longa, e sai com a taxa
    var kCA = eo(seg(t, T.setaCA, T.setaCAdur)), aCA = 1 - eb(seg(t, T.taxaFim - 0.3, 0.3));
    seta(cI, c0.x, c0.y, c2.x, c2.y, kCA, aCA);
    // a GRAVIDADE
    var kN = eo(seg(t, T.normal, T.normalDur)), kC = eb(seg(t, T.curva, T.curvaDur));
    var af = 0.62 + 0.38 * eo(seg(t, T.cai, T.caiDur)) + 0.08 * eo(seg(t, T.forca, T.forcaDur));
    var g = curvaGrav(cI, kN, kC, af, 1);
    // a FORÇA (b4): a seta vertical do fundo do vale para baixo, em "force"
    var kFz = eo(seg(t, T.forca, T.forcaDur));
    if (g) seta(cI, g.x, g.y + 26, g.x, g.y + 26 + 250, kFz, 1, 12);
    return { xTaxa: c0.x, yTaxa: c0.y, g: g };
  }

  window.__fotosProntas = true;
  if (prepararLugares()) iniciarMapa({ c0: cameraEm(0), creditoMapa: TEXTOS.crMapa });

  function por(el, x, y, v) {
    if (!el) return; el.style.opacity = v.op.toFixed(3);
    el.style.transform = "translate(" + x.toFixed(2) + "px," + (y + v.dy).toFixed(2) + "px)";
  }
  var NADA = { op: 0, dy: 0 };
  function cena(t) {
    t = t + 0.0005;
    var ok = map && mapaCarregado;
    if (ok) map.jumpTo(cameraEm(t));
    var d = desenhar(t);
    // os nomes das placas, presos ao mapa: NORTH AMERICAN PLATE ao norte da fossa (o mar aberto), CARIBBEAN PLATE ao sul, entre a
    // fossa e as ilhas, a leste de Porto Rico (TA255: o redator vale contra o "below/above" da regência)
    var na = E("nomeNA"), ca = E("nomeCA");
    if (na && ok) { var q = P(NOME_NA); porCentro(na, q.x, q.y, vida(t, T.nomeNA, null)); } else porCentro(na, 0, 0, NADA);
    if (ca && ok) { var q2 = P(NOME_CA); porCentro(ca, q2.x, q2.y, vida(t, T.nomeCA, null)); } else porCentro(ca, 0, 0, NADA);
    // ≈ ¾ IN/YR logo abaixo da seta do Caribe, alinhado ao pé dela (a faixa de mar ao sul da fossa; nenhuma linha por baixo)
    var tx = E("taxa");
    if (tx && ok && d) por(tx, d.xTaxa, d.yTaxa + 50, vida(t, T.taxa, T.taxaFim)); else por(tx, 0, 0, NADA);
    // −380 mGal · USGS (em duas linhas, quebra no " · "): à direita da ponta da seta da força, ao sul da fossa (no lugar que a seta e
    // a taxa do Caribe deixaram)
    var gv = E("grav");
    // (preso à altura FINAL do vale, 1,08 × o fundo: a cota não escorrega enquanto a curva afunda)
    if (gv && ok && d && d.g) por(gv, d.g.x + 70, d.g.y0 + GRAV.fundo * 1.08 + 26 + 250 - 40, vida(t, T.grav, null)); else por(gv, 0, 0, NADA);
    // a legenda: presa à tela, no alto à direita (o mar aberto), acima da linha do normal
    var lg = E("legGrav"); if (lg) por(lg, 3640 - lg.offsetWidth, 170, vida(t, T.leg, null));
    creditos(t, [{ id: "crFonte", t0: T.fonte, t1: null }], true);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); return true; };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  window.__ready.then(function () { window.__renderAt(0); }, function () {});

  // ── A CONFERÊNCIA DA COMPOSIÇÃO (só leitura): as caixas no instante t, a folga até o contato e até a fossa, e a vista contra o
  // recorte da GEBCO (72,5–59°W, 15–24,5°N) ──
  window.__medidas = function (t) {
    var ids = ["nomeNA", "nomeCA", "taxa", "grav", "legGrav", "crMapa", "crFonte"];
    window.__renderAt(t);
    var out = { t: t, cam: cameraEm(t) };
    if (!map) return out;
    var b = map.getBounds(); out.vista = [+b.getWest().toFixed(3), +b.getSouth().toFixed(3), +b.getEast().toFixed(3), +b.getNorth().toFixed(3)];
    out.dentroGebco = b.getWest() >= -72.5 && b.getEast() <= -59.0 && b.getSouth() >= 15.0 && b.getNorth() <= 24.5;
    var C = contatoNaTela(), F = fossaNaTela();
    ids.forEach(function (id) {
      var c = caixa(id); if (!c || c[4] < 0.05) return;
      out[id] = { caixa: c, folgaContato: folga(C, c), folgaFossa: folga(F, c) };
    });
    return out;
  };
})();
</script>
