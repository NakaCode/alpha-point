    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();
</script>
<script>
(function () {
  "use strict";

  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo, eb = R.eb;
  var E = function (id) { return document.getElementById(id); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var f2 = function (v) { return (+v).toFixed(2); };
  var NS = "http://www.w3.org/2000/svg";

  var DUR = 9.2;
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia é do redator-de-tela: textos-tela.json › s38) ═══
  var TEXTOS = {
    rotMarca: "2002–2003 · USGS · ~27,300 FT (8,300–8,340 M)",   // cota, 0,867 · lastro: "deepest" (0,875–1,225); a série do marcador
    legBlocos: "Rotated blocks",                                // legenda, 1,767 · lastro: "rotated blocks" (1,78–2,635)
    cred1: "Source: U.S. Geological Survey, 2018"               // credito, 0
  };
  // as linhas do marcador, quebradas só nos separadores; juntas de volta, têm de dar o texto do redator
  var MARCA_LINHAS = ["2002–2003 · USGS", "~27,300 FT", "(8,300–8,340 M)"];
  // ═════════════════════════════════════════════════════════════════════════════════════════════
  if (MARCA_LINHAS[0] + " · " + MARCA_LINHAS[1] + " " + MARCA_LINHAS[2] !== TEXTOS.rotMarca) { window.__avisos = (window.__avisos || []).concat("s38: o marcador em linhas não é o do textos-tela"); }
  if (E("rotMarca")) E("rotMarca").textContent = MARCA_LINHAS.join("\n");
  if (E("legBlocos")) E("legBlocos").textContent = TEXTOS.legBlocos;
  if (E("cred1")) E("cred1").textContent = TEXTOS.cred1;

  var T = { marca: 0.867, blocos: 1.767, giro: 1.78, giroDur: 1.42, seta: 3.715, setaDur: 0.35, plano2: 5.067, recuo: 0.9,
            cai: 7.275, crava: 8.315, repouso: DUR - 0.25 };

  // ── a geometria (px do palco) ──
  var XL = 1140, XR = 2700;                // as paredes da seção (o recorte)
  var YN = 300;                            // o nível do mar
  var YQ = 1700;                           // a linha de quebra de baixo (a seção continua)
  var YB = 1780;                           // a base dos blocos (abaixo da quebra: os pivôs não aparecem)
  var BW = 390, BH = 620;                  // o bloco rígido
  var SED = 56;                            // o sedimento: a superfície fica 56 px acima da altura MÉDIA do topo dos blocos
  var THF = 9 * Math.PI / 180;             // o giro final, 9°
  var XM = 1920;                           // o meio do conjunto (o que não anda)
  var IDX = [-1, 0, 1, 2, 3, 4];           // 4 blocos inteiros na janela em θ = 0, e um de cada lado (entram e saem pelo corte)
  var XA = 2540;                           // a seta do afundamento e a cota
  var YCAUDA = 820;                        // a cauda da seta (onde a cota que cai crava)

  // a janela (clip) e a quebra de baixo: a mesma onda, para o corte dos blocos coincidir com a linha
  function onda(x) { return YQ + 12 * Math.sin((x - XL) / 70); }
  (function () {
    var w = "M" + XL + ",0 L" + XR + ",0", q = "";
    for (var x = XR; x >= XL; x -= 20) w += " L" + x + "," + f2(onda(x));
    w += " Z";
    for (var x2 = XL, i = 0; x2 <= XR; x2 += 20, i++) q += (i ? " L" : "M") + x2 + "," + f2(onda(x2));
    if (E("cJanelaP")) E("cJanelaP").setAttribute("d", w);
    if (E("quebra")) E("quebra").setAttribute("d", q);
    if (E("paredes")) E("paredes").setAttribute("d", "M" + XL + "," + YN + " L" + XL + "," + f2(onda(XL)) + " M" + XR + "," + YN + " L" + XR + "," + f2(onda(XR)));
    if (E("linhaAgua")) E("linhaAgua").setAttribute("d", "M" + XL + "," + YN + " L" + XR + "," + YN);
    var xn = 1400;
    if (E("nivel")) E("nivel").setAttribute("d", "M" + (xn - 32) + "," + (YN - 52) + " L" + (xn + 32) + "," + (YN - 52) + " L" + xn + "," + (YN - 5) + " Z" +
      " M" + (xn - 26) + "," + (YN + 22) + " L" + (xn + 26) + "," + (YN + 22) + " M" + (xn - 12) + "," + (YN + 40) + " L" + (xn + 12) + "," + (YN + 40));
    var s = "", AG = [[1350, 470], [2150, 450]];
    AG.forEach(function (c) { s += "M" + (c[0] - 36) + "," + c[1] + " L" + (c[0] + 36) + "," + c[1] + " M" + (c[0] - 24) + "," + (c[1] + 16) +
      " L" + (c[0] + 24) + "," + (c[1] + 16) + " M" + (c[0] - 12) + "," + (c[1] + 32) + " L" + (c[0] + 12) + "," + (c[1] + 32) + " "; });
    if (E("simbAgua")) E("simbAgua").setAttribute("d", s);
  })();

  // OS BLOCOS: um <g> por bloco, no referencial dele (origem no pivô = canto de baixo à esquerda; y para cima negativo),
  // com o contorno e a hachura de corte; o transform de cada um é translate(pivô) rotate(θ)
  var BLOCO = (function () {
    var c = "M0,0 L0," + (-BH) + " L" + BW + "," + (-BH) + " L" + BW + ",0 Z", h = "";
    for (var k = -BH + 30; k < BW; k += 52) {   // a hachura a 45°: y = −BH + (x − k)
      var x0 = Math.max(0, k), x1 = Math.min(BW, k + BH);
      if (x1 - x0 < 8) continue;
      h += "M" + f2(x0 + 4) + "," + f2(-BH + (x0 - k) + 4) + " L" + f2(x1 - 4) + "," + f2(-BH + (x1 - k) - 4) + " ";
    }
    return { contorno: c, hach: h };
  })();
  var gB = E("gBlocos"), GS = {};
  IDX.forEach(function (i) {
    if (!gB) return;
    var g = document.createElementNS(NS, "g"); g.setAttribute("id", "bloco" + i);
    var ph = document.createElementNS(NS, "path"); ph.setAttribute("class", "ar-fina"); ph.setAttribute("d", BLOCO.hach);
    var pc = document.createElementNS(NS, "path"); pc.setAttribute("class", "ar"); pc.setAttribute("d", BLOCO.contorno);
    pc.setAttribute("id", "blocoC" + i);
    g.appendChild(ph); g.appendChild(pc); gB.appendChild(g); GS[i] = g;
  });
  function thetaAt(t) { return THF * eb(seg(t, T.giro, T.giroDur)); }
  function pivo(i, th) { return XM + (i - 2) * BW / Math.cos(th); }   // o passo w/cos θ: as faces ficam encostadas
  // a altura média do topo (acima da base) num período do serrilhado, por trapézios: TL_i → TR_i → (face) → TL_{i+1}
  function topoMedio(th) {
    var s = BW / Math.cos(th), c = Math.cos(th), sn = Math.sin(th);
    var tl = [BH * sn, BH * c], tr = [BW * c + BH * sn, BH * c - BW * sn], tl2 = [s + BH * sn, BH * c];
    var area = (tr[0] - tl[0]) * (tl[1] + tr[1]) / 2 + (tl2[0] - tr[0]) * (tr[1] + tl2[1]) / 2;
    return area / s;
  }
  function yFundo(th) { return YB - (topoMedio(th) + SED); }

  // a chamada de "Rotated blocks": do fim do texto até um ponto do bloco 0, perto da face esquerda (gira com ele)
  var CH0 = [1090, 1422], CHP = [70, -330];
  function noMundo(i, th, p) { var x0 = pivo(i, th), c = Math.cos(th), s = Math.sin(th); return [x0 + p[0] * c - p[1] * s, YB + p[0] * s + p[1] * c]; }

  // a seta do afundamento: a ponta aberta, para baixo, encostada no fundo final
  var YF_FIM = yFundo(THF);
  if (E("setaPonta")) E("setaPonta").setAttribute("d", "M" + (XA - 30) + "," + f2(YF_FIM - 56) + " L" + XA + "," + f2(YF_FIM - 8) + " L" + (XA + 30) + "," + f2(YF_FIM - 56));
  // a ponta de cima da cota, encostada no nível do mar
  if (E("cotaTopo")) E("cotaTopo").setAttribute("d", "M" + (XA - 9) + "," + (YN + 20) + " L" + XA + "," + (YN + 3) + " L" + (XA + 9) + "," + (YN + 20) +
    " M" + (XA - 40) + "," + YN + " L" + (XA + 40) + "," + YN);

  function texto(id, t, tin, x, y) {
    var e = E(id); if (!e) return;
    var pi = eo(seg(t, tin, 0.3));
    e.style.opacity = pi.toFixed(3);
    e.style.transform = "translate(" + f2(x) + "px," + f2(y + 24 * (1 - pi)) + "px)";
  }
  function credito(id, t, tin) { var e = E(id); if (e) e.style.opacity = eo(seg(t, tin, 0.3)).toFixed(3); }
  // a CÂMERA: uma escala só em torno de O (1920, 1300): o push-in do RIG (0,0024/s, para 250 ms antes do corte) + 0,12 no plano 1,
  // que sai no recuo do plano 2 (eb); a deriva do RIG; o still a 0,6, em torno do mesmo ponto
  function escala(t) { return 1 + 0.0024 * Math.min(t, T.repouso) + 0.12 * (1 - eb(seg(t, T.plano2, T.recuo))); }
  function camera(t) {
    var c = E("cam"), s = escala(t), dx = 6 * Math.sin(t * 0.23), dy = 4.8 * Math.sin(t * 0.17);
    if (c) c.style.transform = "scale(" + s.toFixed(5) + ") translate(" + f2(dx) + "px," + f2(dy) + "px)";
    var st = E("still"); if (st) st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ") translate(" + f2(dx * 0.6) + "px," + f2(dy * 0.6) + "px)";
  }

  function cena(t) {
    t = t + 0.0005;
    camera(t);
    // os blocos giram juntos (um controlador: θ), cada um no pivô dele; o fundo desce pela conservação da área do sedimento
    var th = thetaAt(t), gr = (th * 180 / Math.PI).toFixed(4);
    IDX.forEach(function (i) { var g = GS[i]; if (g) g.setAttribute("transform", "translate(" + f2(pivo(i, th)) + "," + YB + ") rotate(" + gr + ")"); });
    var yf = yFundo(th);
    if (E("fundo")) E("fundo").setAttribute("d", "M" + XL + "," + f2(yf) + " L" + XR + "," + f2(yf));
    // a chamada da legenda acompanha o bloco 0
    var pc = noMundo(0, th, CHP), ch = E("chamada");
    if (ch) { ch.setAttribute("d", "M" + CH0[0] + "," + CH0[1] + " L" + f2(pc[0]) + "," + f2(pc[1])); ch.style.opacity = eo(seg(t, T.blocos, 0.3)).toFixed(3); }
    // a seta do afundamento desce sobre o fundo em "sinking"
    var ps = eo(seg(t, T.seta, T.setaDur)), ha = E("setaHaste");
    if (ha) { ha.setAttribute("d", "M" + XA + "," + YCAUDA + " L" + XA + "," + f2(YCAUDA + (YF_FIM - 10 - YCAUDA) * ps)); ha.style.opacity = t >= T.seta ? "1" : "0"; }
    var sp = E("setaPonta"); if (sp) sp.style.opacity = eo(seg(t, T.seta + T.setaDur - 0.1, 0.1)).toFixed(3);
    // no contato, a seta VIRA COTA: o traço dela afina de 6 para 3 px (a linha de cota) em 0,25 s
    var w = (6 - 3 * eo(seg(t, T.crava, 0.25))).toFixed(2);
    if (ha) ha.style.strokeWidth = w + "px";
    if (sp) sp.style.strokeWidth = w + "px";
    // a cota CAI da superfície: y ∝ t², crava na cauda da seta em "deep", e para (e = 0)
    var pq = seg(t, T.cai, T.crava - T.cai), yc = YN + (YCAUDA - YN) * pq * pq;
    var cc = E("cotaCai"); if (cc) { cc.setAttribute("d", "M" + XA + "," + YN + " L" + XA + "," + f2(yc)); cc.style.opacity = t >= T.cai ? "1" : "0"; }
    var ct = E("cotaTopo"); if (ct) ct.style.opacity = eo(seg(t, T.cai, 0.15)).toFixed(3);
    // a LUZ: atrás dos blocos no plano 1; no plano 2, sobe para a coluna d'água (120 ms atrás do recuo)
    var pl = eb(seg(t, T.plano2 + 0.12, 0.8));
    var lz = E("luz"); if (lz) { lz.style.setProperty("--luz-x", f2(lerp(1920, 2200, pl) + 140) + "px"); lz.style.setProperty("--luz-y", f2(lerp(1400, 820, pl) + 140) + "px"); }
    texto("rotMarca", t, T.marca, 1220, 600);
    texto("legBlocos", t, T.blocos, 420, 1380);
    credito("cred1", t, 0);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  // O GANCHO DE MEDIDA (só leitura, do DOM): os cantos dos blocos na tela (getScreenCTM), a folga entre faces vizinhas
  // (negativa = penetração), o canto mais alto contra o fundo, e a ponta da cota contra a cauda da seta
  window.__s38peca = function (t) {
    t = clamp(+t || 0, 0, DUR); window.__renderAt(t);
    function tela(el, x, y) { var m = el.getScreenCTM(), p = el.ownerSVGElement.createSVGPoint(); p.x = x; p.y = y; return p.matrixTransform(m); }
    var esc = escala(t), folgas = [], acima = [];
    for (var j = 0; j < IDX.length - 1; j++) {
      var a = E("blocoC" + IDX[j]), b = E("blocoC" + IDX[j + 1]);
      var br = tela(a, BW, 0), tr = tela(a, BW, -BH), bl = tela(b, 0, 0);
      // a distância (sinal) do canto de baixo à esquerda do bloco seguinte à face direita deste, em px do palco
      var dx = tr.x - br.x, dy = tr.y - br.y, n = Math.hypot(dx, dy);
      folgas.push(+((((bl.x - br.x) * dy - (bl.y - br.y) * dx) / n) / esc * -1).toFixed(3));
    }
    var f = E("fundo"), bf = f.getBBox(), yfTela = tela(f, XL, bf.y).y;
    IDX.forEach(function (i) { var c = E("blocoC" + i), p = tela(c, 0, -BH); acima.push(+((yfTela - p.y) / esc).toFixed(2)); });
    return { t: t, theta_graus: +(thetaAt(t) * 180 / Math.PI).toFixed(3), fundo_y_palco: +yFundo(thetaAt(t)).toFixed(2),
             folga_entre_faces_px: folgas, canto_alto_abaixo_do_fundo_px: acima };
  };
  window.__renderAt(0);
})();
</script>
