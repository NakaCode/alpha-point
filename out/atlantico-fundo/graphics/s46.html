<script>

  //    (64 px), o MAIOR nos SÉCULOS (320 px); as pontas em 940 e 1740 (40 intervalos, 2.560 px, como na 1ª montagem) ──

  // ── O BLOCO DE CORAL (conserto, arte-4): o que os cientistas dataram (Kilbourne et al. 2025, l. 410–420 e 445–447). Embaixo da
  //    régua, à direita do tique, assentado no chão. Esquemático: um bloco arredondado e irregular (superelipse com calombos), mais

      still: [Math.round(st.left), Math.round(st.top), Math.round(st.right), Math.round(st.bottom)],

  };

})();
