/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de
   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();
   Lei: a cena é função pura de t. Nada aqui lê relógio, sorteia ou anda sozinho. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};
    const s = (o.base ?? 1.02) + (o.zoom ?? 0.0024) * t;
    const x = (o.ax ?? 6) * Math.sin(t * 0.23), y = (o.ay ?? 4.8) * Math.sin(t * 0.17);
    el.style.transform = "scale(" + s.toFixed(5) + ") translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
  }
  // Vídeo por f(t): posiciona e espera o "seeked". Na galeria (__PREVIEW) não mexe.
  function seekTo(v, tt) {
    if (!v || window.__PREVIEW || v.readyState < 1) return Promise.resolve();
    const d = v.duration; if (d > 0 && isFinite(d)) tt = clamp(tt, 0, Math.max(0, d - 0.001));
    if (Math.abs(v.currentTime - tt) < 1e-4 && !v.seeking) return Promise.resolve();
    return new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.addEventListener("error", r, { once: true }); v.currentTime = tt; });
  }
  // Grão: ruído de semente fixa por quadro (mulberry32). Mesmo t, mesmo grão.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  function grao(cv, t, o) {
    if (!cv || !cv.getContext) return; o = o || {};
    const ctx = cv.getContext("2d"), w = cv.width, h = cv.height;
    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));
    const img = ctx.createImageData(w, h), d = img.data, a = o.alfa ?? 22;
    for (let i = 0; i < d.length; i += 4) { const v = (sorte() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }
    ctx.putImageData(img, 0, 0);
  }
  // Paleta por vídeo: OBJETO de papéis {acento:"#…"}, montado pelo editor-de-arte. O espelho.paleta é
  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }
  function cor(v) { return typeof CSS !== "undefined" && CSS.supports ? CSS.supports("color", v) : /^#[0-9a-f]{3,8}$|^(rgb|hsl)a?\(/i.test(v); }
  function paleta(p) {
    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));
    }
  }
  // Prontidão: <img>, <image> de SVG e TODAS as faces "Marca"/"MarcaSec". Nunca rejeita: o que falhou
  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();

      " L" + (NV.proa + 520) + "," + (y - 196) + " L" + (NV.proa + 520) + "," + (y - 52) +                 // a ponte e o castelo
      " M" + (NV.proa + 420) + "," + (y - 196) + " L" + (NV.proa + 420) + "," + (y - 262) +                 // o mastro
      " M" + (NV.proa + 640) + "," + (y - 50) + " L" + (NV.proa + 640) + "," + (y - 120) + " L" + (NV.proa + 760) + "," + (y - 120) +
      " L" + (NV.proa + 760) + "," + (y - 48);                                                               // a casa de ré
    var fina = "M" + (NV.proa + 330) + "," + (y - 170) + " L" + (NV.proa + 500) + "," + (y - 170);           // as janelas da ponte, uma linha
    if (E("navio")) E("navio").setAttribute("d", casco + sup);
    if (E("somNavio")) E("somNavio").setAttribute("d", casco + sup);
    if (E("navioFina")) E("navioFina").setAttribute("d", fina);
    // a superfície em dois trechos: o casco interrompe a água (dentro dele não há água)
    var xProaAgua = NV.proa + 70 * (80 / 124), xPopaAgua = NV.popa;
    if (E("linhaAgua")) E("linhaAgua").setAttribute("d", "M" + XA + "," + y + " L" + f2(xProaAgua) + "," + y + " M" + xPopaAgua + "," + y + " L" + XB + "," + y);
    var xn = 3000;
    if (E("nivel")) E("nivel").setAttribute("d", "M" + (xn - 32) + "," + (YS - 52) + " L" + (xn + 32) + "," + (YS - 52) + " L" + xn + "," + (YS - 5) + " Z" +
      " M" + (xn - 26) + "," + (YS + 22) + " L" + (xn + 26) + "," + (YS + 22) + " M" + (xn - 12) + "," + (YS + 40) + " L" + (xn + 12) + "," + (YS + 40));
    var s = "", AG = [[1120, 1060], [2980, 1460]];   // a hachura do líquido (a mesma do s22), longe da legenda e das marcas
    AG.forEach(function (c) { s += "M" + (c[0] - 36) + "," + c[1] + " L" + (c[0] + 36) + "," + c[1] + " M" + (c[0] - 24) + "," + (c[1] + 16) +
      " L" + (c[0] + 24) + "," + (c[1] + 16) + " M" + (c[0] - 12) + "," + (c[1] + 32) + " L" + (c[0] + 12) + "," + (c[1] + 32) + " "; });
    if (E("simbAgua")) E("simbAgua").setAttribute("d", s);
    if (E("chao")) E("chao").setAttribute("d", "M" + XA + "," + YF + " L" + XB + "," + YF);
    var d = ""; for (var x = XA + 24; x <= XB; x += 48) d += "M" + x + "," + (YF + 8) + " L" + (x - 26) + "," + (YF + 40) + " ";
    if (E("hachura")) E("hachura").setAttribute("d", d);
  })();

  // ── o SUBMERSÍVEL: o traço de s07 (graphics/s07.html › SUB), origem no meio dos patins, y para cima negativo, a KS ──
  var KS = 1.5;
  function pt(x, y) { return f2(x * KS) + "," + f2(y * KS); }
  function caminho(lista) {   // lista de comandos absolutos [cmd, x, y, (x2, y2)]
    return lista.map(function (c) { var s = c[0]; for (var i = 1; i < c.length; i += 2) s += (i > 1 ? " " : "") + pt(c[i], c[i + 1]); return s; }).join(" ");
  }
  function circulo(cx, cy, r) { r *= KS; var x = cx * KS, y = cy * KS;
    return "M" + f2(x - r) + "," + f2(y) + " A" + f2(r) + "," + f2(r) + " 0 1 0 " + f2(x + r) + "," + f2(y) + " A" + f2(r) + "," + f2(r) + " 0 1 0 " + f2(x - r) + "," + f2(y); }
  var SUB = caminho([
    ["M", -78, -36], ["L", -78, -82], ["Q", -78, -110, -50, -110], ["L", 50, -110], ["Q", 78, -110, 78, -82], ["L", 78, -36],
    ["Q", 78, -30, 72, -30], ["L", -72, -30], ["Q", -78, -30, -78, -36], ["Z"],                                   // o casco
    ["M", -24, -110], ["L", -16, -134], ["L", 22, -134], ["L", 30, -110],                                         // a torre
    ["M", -48, -30], ["L", -40, 0], ["M", 48, -30], ["L", 40, 0], ["M", -66, 0], ["L", 66, 0],                    // as pernas e os patins
    ["M", -86, -60], ["L", -78, -60], ["M", 78, -60], ["L", 86, -60]                                              // os propulsores
  ]) + " " + circulo(-58, -70, 16);                                                                                // a vigia
  var SUBOC = circulo(14, -70, 30);   // a esfera de pressão, por dentro do casco, tracejada: o "M -16 -70 a 30 30 …" da s07 entregue (centro 14,−70, raio 30)
  if (E("sub")) E("sub").setAttribute("d", SUB);
  if (E("somSub")) E("somSub").setAttribute("d", SUB);
  if (E("subOculto")) E("subOculto").setAttribute("d", SUBOC);
  var ALT = 134 * KS, SENSOR = 70 * KS;          // a altura do traço (dos patins ao topo da torre); o sensor no meio do casco

  // a DESCIDA: um controlador só, vertical. Boiando → velocidade terminal → quase neutro e arrasto até o repouso no fundo.
  var XS = 1760;                                  // o eixo da descida: à direita da popa (x 1560), o propulsor a ~70 px dela
  var Y0 = YS + ALT - 16;                         // os patins quando boia (o topo da torre 16 px acima da linha d'água)
  var TAU1 = 0.40, TAU2 = 0.25, DT = T.larga - T.solta;
  var A1 = DT - TAU1 * (1 - Math.exp(-DT / TAU1)), B1 = 1 - Math.exp(-DT / TAU1);
  var VT = (YF - Y0) / (A1 + B1 * TAU2);           // a velocidade terminal que leva os patins exatamente ao fundo no repouso
  var YB = Y0 + VT * A1, VB = VT * B1;             // onde e com que velocidade larga o peso
  function ySub(t) {
    if (t <= T.solta) return Y0;
    if (t < T.larga) { var u = t - T.solta; return Y0 + VT * (u - TAU1 * (1 - Math.exp(-u / TAU1))); }
    var y = YB + VB * TAU2 * (1 - Math.exp(-(t - T.larga) / TAU2));
    return (YF - y) < 0.5 ? YF : y;                 // o limiar de repouso declarado: 0,5 px
  }
  // quando a descida percorreu a fração f da coluna (superfície → fundo): inverte ySub pela bisseção (a função é monótona).
  // A marca da profundidade k acende quando a descida percorreu k/27,5 da coluna: ela cai sempre ao lado do casco (do topo da
  // torre, na superfície, aos patins, no fundo), porque o traço do submersível é alto demais para a escala da coluna.
  function tempoNaFracao(f) {
    var alvo = Y0 + f * (YF - Y0), a = T.solta, b = DUR;
    if (f <= 0) return T.solta;
    for (var i = 0; i < 40; i++) { var m = (a + b) / 2; if (ySub(m) < alvo) a = m; else b = m; }
    return b;
  }

  // ── as MARCAS: uma a cada ~1,000 ft (a coluna de 1290 px ↔ ~27,500 ft: 46,9 px), ao lado da descida; a de 5,000 ft mais longa ──
  var PES = 27.5, NM = 27, PX1000 = (YF - YS) / PES, XM = XS + 86 * KS + 52;
  var gM = E("gMarcas"), marcas = [];
  for (var k = 1; k <= NM; k++) {
    var y = YS + k * PX1000, longa = (k % 5 === 0);
    var p = document.createElementNS(NS, "path"); p.setAttribute("class", "ar-marca");
    p.setAttribute("d", "M" + f2(XM) + "," + f2(y) + " L" + f2(XM + (longa ? 84 : 44)) + "," + f2(y));
    p.style.opacity = "0";
    if (gM) gM.appendChild(p);
    marcas.push({ el: p, t: tempoNaFracao(k / PES) });
  }

  // a CÂMERA: push-in do RIG em torno de C; a deriva; o still a 0,6
  var CX = 1920, CY = 1080;
  function escala(t) { return 1 + 0.0024 * Math.min(t, T.repouso); }
  function deriva(t) { return [6 * Math.sin(t * 0.23), 4.8 * Math.sin(t * 0.17)]; }
  function camera(t) {
    var s = escala(t), dv = deriva(t);
    var c = E("cam"); if (c) c.style.transform = "scale(" + s.toFixed(5) + ") translate(" + f2(dv[0]) + "px," + f2(dv[1]) + "px)";
    var st = E("still"); if (st) st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ") translate(" + f2(dv[0] * 0.6) + "px," + f2(dv[1] * 0.6) + "px)";
  }

  function texto(id, t, tin, x, yc) {
    var e = E(id); if (!e) return;
    var pi = eo(seg(t, tin, 0.3)), h = e.offsetHeight;
    e.style.opacity = pi.toFixed(3);
    e.style.transform = "translate(" + f2(x) + "px," + f2(yc - h / 2 + 24 * (1 - pi)) + "px)";
  }
  function credito(id, t, tin) { var e = E(id); if (e) e.style.opacity = eo(seg(t, tin, 0.3)).toFixed(3); }

  function cena(t) {
    t = t + 0.0005;
    camera(t);
    var ys = ySub(t), gs = E("gSub");
    if (gs) gs.setAttribute("transform", "translate(" + XS + "," + f2(ys) + ")");
    // a luz segue o submersível 120 ms atrás (o #luz está deslocado −140 px)
    var yl = ySub(Math.max(0, t - 0.12)) - SENSOR;
    var lz = E("luz"); if (lz) { lz.style.setProperty("--luz-x", (XS + 140) + "px"); lz.style.setProperty("--luz-y", f2(yl + 140) + "px"); }
    // as marcas acendem quando o sensor passa (150 ms, ease-out) e ficam
    for (var k = 0; k < marcas.length; k++) marcas[k].el.style.opacity = eo(seg(t, marcas[k].t, 0.15)).toFixed(3);
    texto("legenda", t, T.legenda, XM + 150, 1000);
    credito("cred1", t, T.cred);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  // O GANCHO DE MEDIDA (só leitura, do DOM): os patins contra o fundo, as marcas acesas, a legenda e o still
  window.__s49peca = function (t) {
    t = clamp(+t || 0, 0, DUR); window.__renderAt(t);
    var sb = E("sub"), m = sb.getScreenCTM(), q = sb.ownerSVGElement.createSVGPoint();
    q.x = 0; q.y = 0; var pat = q.matrixTransform(m);
    var ch = E("chao"), mc = ch.getScreenCTM(), r = ch.ownerSVGElement.createSVGPoint(); r.x = XS; r.y = YF; var fu = r.matrixTransform(mc);
    var acesas = marcas.filter(function (o) { return +o.el.style.opacity > 0.5; }).length;
    var lg = E("legenda").getBoundingClientRect(), st = E("still").getBoundingClientRect(), sr = sb.getBoundingClientRect();
    var nv = E("navio").getBoundingClientRect(), mk = E("gMarcas").getBoundingClientRect();
    return { t: t, ySub: +ySub(t).toFixed(2), patins_acima_do_fundo_px: +(fu.y - pat.y).toFixed(3), marcas_acesas: acesas,
      vT: +VT.toFixed(1), legenda: [Math.round(lg.left), Math.round(lg.top), Math.round(lg.right), Math.round(lg.bottom)],
      sub: [Math.round(sr.left), Math.round(sr.top), Math.round(sr.right), Math.round(sr.bottom)],
      navio: [Math.round(nv.left), Math.round(nv.top), Math.round(nv.right), Math.round(nv.bottom)],
      marcas: [Math.round(mk.left), Math.round(mk.top), Math.round(mk.right), Math.round(mk.bottom)],
      still: [Math.round(st.left), Math.round(st.top), Math.round(st.right), Math.round(st.bottom)] };
  };
  window.__renderAt(0);
})();
</script>
