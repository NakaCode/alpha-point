<title>s50 — the deepest point of the Atlantic: about 27,500 feet, give or take 16; about 83 miles off Aguadilla</title>
<!--
CANAL ALPHA POINT — O ATLÂNTICO (vídeo 4, atlantico-fundo), CENA s50 (406,9 → 422,133 s do master; 15,233 s; 3 beats). PICO do arco
(showpiece, paga S1 e S2). Mapista, lote M4 da tarefa atlantico-fundo-arte-2 (29/10/2026): cena NOVA. Montada por
out/atlantico-fundo/_tmp/arte-2/M4/montar.mjs (o motor do mapa é o da s63 da M7, fatiado por fatiar.mjs sem mudar o texto); o MEDIDOR é o
da s53 (M6 da arte-1), no traço da série (s07, s15, s18).
  "By the expedition's survey, the deepest point of the Atlantic is about 27,500 feet down. Give or take about 16 feet. That point lies
   about 83 miles from the nearest coast of Puerto Rico, off Aguadilla, in the island's northwest."
  O que manda: textos-tela.json f4eede4d (o QUE e a grafia, s50); regencia.json 9d0ab49f (s50 › beats[0..2]: o TEMPO, o exige, a lupa);
  conceito-visual.json e34292ec (s50); espelho.json bcfe74f9 (a janela). Word-lock (words.json, −406,9 s): 'survey' 0,995 · 'deepest'
  1,875 · 'twenty-seven' 3,615 · 'down.' 5,555–5,840 · 'Give' 6,310 · 'sixteen' 7,175 · 'feet.' 7,585–7,800 · 'That' 8,430 ·
  'eighty-three' 9,635 · 'coast' 11,115 · 'Puerto' 11,555 · 'Rico,' 11,795 · 'Aguadilla,' 12,635–13,240 · 'northwest.' 14,145–14,640.

  POR QUE PLANO (ofício §5 e §5c; Sala, decisão 4): a profundidade se lê na régua do vídeo (o MEDIDOR, 20 ft por px, a escala vertical
  honesta), e o ± 16 ft na LUPA (2,6 px por pé): no relevo, 16 pés seriam fração de pixel. O mapa diz ONDE: o anel, a costa de
  Aguadilla e a zona econômica. Norte para cima, sem órbita (a decisão da série); a câmera nunca para.

  A BASE: o satélite da MapTiler (perfil maptiler, tratamento C da identidade §6) na terra e na superfície; o fundo do mar pela GEBCO 2026:
    o recorte fino do Caribe (gebco-caribe, bordas esmaecidas 72 × 60) sobre o Atlântico (gebco-atlantico-relevo, só o mar, a 0,34; a
    pilha da s63, sem o mundo: o quadro fica todo dentro do recorte do Caribe).
  A GEOMETRIA (toda de _media/geo/, a da _pesquisa/pauta-geo.json): ponto-mais-fundo-atlantico (o anel), fossa-porto-rico-trecho-mais-fundo
    (a isóbata de 8.000 m da GEBCO 2026, o corpo que contém o anel; nunca com nome), aguadilla-costa-ponto (o ponto da costa de onde
    saem as ≈ 83 MI: 83,46 mi pelo arquivo, F04), aguadilla-municipio (Census 2025, GEOID 72005) e zee-eua-porto-rico (MarineRegions,
    MRGID 33179, CC BY 4.0: zona econômica, não território, N32). A linha das 83 mi é a distância entre dois pontos lidos (reta na tela;
    a geodésica tem a mesma direção a esta escala), não uma feição.

  O QUE A CENA FAZ (tempo local; 0 = 406,9 s):
    b0 0–6,3 (mapa em PALCO + o MEDIDOR): a câmera se APROXIMA do anel (cúbica, zoom 8,15 → 8,55) e deriva. Em 0 o medidor desenrola
      (450 ms), com "0 FT" e "30,000 FT", os traços SEM RÓTULO das visitas anteriores (Challenger 23,250 · 1964 ~24,000 · 2002–2003
      ~27,300 · 1883 27,366 · 1970 27,460, o pedido comum e a s53) e a linha FRACA do sonar (27,487 ft, y 1594,35: --destaque a 45 %,
      6 px, a da s07). O anel está fraco (40 %). Em 1,875 ('deepest') o anel ACENDE DE VEZ e pulsa duas vezes (1,875 e 3,075; escala
      1 → 1,8 e opacidade 1 → 0 em 1,2 s) e fica; o trecho mais fundo acende (500 ms) em --destaque a 85 % (o assunto) com o contorno
      --tinta de 6 px, e 'Surveyed Dec. 18–19, 2018' (legenda, 1,867) acima dele, sem área nenhuma. Em 3,6 ('twenty-seven') o marcador
      'DECEMBER 2018 · SONAR · 27,487 FT' entra no alto e DESCE 330 px pela régua, pousando em 4,27 com o meio na altura do fundo (a borda
      direita em x 3300, o líder até 3330): no pouso a linha fraca vira a linha de verdade (--destaque cheio, 10 px).
    b1 6,3–8,4 (só o medidor): em 'Give' (6,3) a pílula do dado '27,487 ± 16 FT (8,378 ± 5 M) · BONGIOVANNI ET AL. 2021' (duas linhas,
      quebradas depois de '(8,378 ± 5 M) · ') acima do marcador, até o fim da cena. Em 7,167 ('sixteen') a LUPA abre presa ao eixo
      ('DETAIL · 100 FT': a janela de 27,437 a 27,537 ft a 2,6 px/ft) e a faixa de ± 16 ft aparece como ESPESSURA em volta da linha do
      fundo (83 px na lupa), sem outro rótulo. A lupa fecha em 8,4 (o t1 do redator).
    b2 8,4–15,233 (mapa): em 'That' (8,43) a câmera RECUA (cúbica, 2,6 s) até a ilha caber; a legenda do levantamento sai em 8,4 e o trecho
      mais fundo se apaga (8,4–8,9). Em 'eighty-three' (9,635) a linha das 83 mi se traça da costa de Aguadilla ao anel em 1,5 s, e
      '≈ 83 MI · Aguadilla' (9,633) entra à direita do meio dela; com ela, 'Maritime boundaries: MarineRegions.org (VLIZ)' na faixa. Em
      11,533 ('Puerto') a ZONA ECONÔMICA DOS EUA acende em --contexto-3 a 25 % (só o preenchimento) e 'Inside the U.S. exclusive economic
      zone' (duas linhas, quebradas depois de 'exclusive ') entra dentro dela, ao sul da ilha, com o canto de cima à esquerda em
      68,2°W 17,75°N (conferido dentro da zona na própria cena); o anel fica a 1,6 mi da área de reivindicação sobreposta (nunca
      'deep inside'). Em
      'Aguadilla' (12,635) o município acende em --neutro a 25 %, com o contorno --neutro de 5 px sobre o escuro de 12.

  ELEMENTOS (teto 6; conta minha): b0 o anel, o trecho com a legenda, o medidor com o marcador = 3; b1 + a pílula do dado + a lupa = 5;
    b2 o anel, o medidor com o marcador, a pílula do dado, a linha com a cota (e o município, que é a ponta dela), a zona com a legenda = 5.
  CRÉDITOS (60 px, var(--fs-credito), o override do Atlântico), empilhados de baixo (bottom 40): '© MapTiler © OpenStreetMap contributors' e
    'GEBCO Compilation Group (2026) GEBCO 2026 Grid' num elemento só, a cena toda (data-qc-credito="mapa"); de 9,633 ao fim, acima dele,

    número vai na própria pílula do dado (BONGIOVANNI ET AL. 2021): sem linha 'Source:' a mais (o textos-tela não a dá).
  Nenhuma mídia de acervo nesta cena.
-->
