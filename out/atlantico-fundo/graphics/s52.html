/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.

   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.

(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d

  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};

  }
  // Grão: ruído de semente fixa por quadro (mulberry32). Mesmo t, mesmo grão.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }

  function cor(v) { return typeof CSS !== "undefined" && CSS.supports ? CSS.supports("color", v) : /^#[0-9a-f]{3,8}$|^(rgb|hsl)a?\(/i.test(v); }
  function paleta(p) {
    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));

  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {

    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }

    if (!el) return;
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  // o pouso da foto impressa (identidade §4.4): desce em eo durante `dur`, assenta 1,03 → 1,00 nos últimos 220 ms
  function pouso(t, t0, dur, desce) {
    var p = eo(seg(t, t0, dur)), q2 = eo(seg(t, t0 + dur - 0.22, 0.22));
    return { op: t >= t0 ? 1 : 0, dy: desce * (1 - p), k: lerp(1.03, 1.00, q2), p: p };
  }
  // a sombra solta: desfoque fixo; anima só transform e opacity (no ar +64 px, 1,05, 0,35; assentada +12 px, 1,00, 0,80)
  function sombra(el, g, s, rot) {
    if (!el) return;
    var sy = lerp(64, 12, s.p), sk = lerp(1.05, 1.00, s.p), so = lerp(0.35, 0.80, s.p) * s.op;
    por(el, g.cx, g.cy - s.dy + sy, g.w, g.h, rot, sk * s.k, so);
  }
  // o texto: entra em 300 ms (opacidade + 24 px de subida); o número também com escala 1,04 → 1,00
  function texto(el, t, t0, escala) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * 24).toFixed(1) + "px)" + (escala ? " scale(" + (1.04 - 0.04 * p).toFixed(4) + ")" : "");
  }
  // a fita lateral: cola em 300 ms (quase vertical, como a da foto impressa da s46 do Peru)
  function fita(el, t, t0, rotDeg) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "rotate(" + rotDeg + "deg) scale(" + (1.06 - 0.06 * p).toFixed(4) + ")";
  }
  function aplicarCamera(t, luz) {
    var camEl = E("cam"), st = E("still");
    var td = Math.min(t, DUR - 0.25);   // a deriva congela nos últimos 250 ms (o repouso da mesa)
    var dx = 6 * Math.sin(td * 0.23), dy = 4.8 * Math.sin(td * 0.17);
    if (camEl) camEl.style.transform = "scale(1) translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
    if (st) { var PAR = 0.6; st.style.transform = "scale(1) translate(" + (dx * PAR).toFixed(2) + "px," + (dy * PAR).toFixed(2) + "px)"; }
    if (camEl && luz) { camEl.style.setProperty("--luz-x", luz.x.toFixed(1) + "px"); camEl.style.setProperty("--luz-y", luz.y.toFixed(1) + "px"); }
  }

  var DUR = 3.9;   // espelho.json › s52 › dur, literal
  window.__duracao = DUR;
  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia final é do redator-de-tela: textos-tela.json › _textos_por_cena s52) ═══
  var TEXTOS = {
    data:  "WEDNESDAY, DEC. 19, 2018",                                   // cota, t0 0,233 ("Wednesday"), até o corte; solta, longe do retrato
    nome:  "VICTOR VESCOVO",                                             // card_nome, t0 0,933 (o retrato assentou + 150 ms)
    cargo: "Five Deeps Expedition",                                      // card_cargo, t0 1,067: só isto sob o retrato, nenhuma data
    cred:  "Richard Varcoe, Caladan Oceanic /\nWikimedia Commons · CC BY-SA 4.0"   // credito, t0 0 (longo: duas linhas, nunca encolhe)
  };
  (function () { for (var k in TEXTOS) { var e = E(k); if (e) e.textContent = TEXTOS[k]; } })();
  // ── os tempos (locais, −425,267), do words.json, da regência e dos textos de tela ──
  var T = {
    pousa: 0.00, pousaDur: 0.78, fita: 0.68,   // o retrato pousa em "On" e assenta em 0,78
    data: 0.233,                              // "Wednesday" (425,505 s)
    nome: 0.933,                              // o assentamento + 150 ms (identidade §4.4)
    cargo: 1.067,                             // 120 ms + 1 quadro depois do nome
    cred: 0.00,
    repouso: DUR - 0.25
  };
  // ── a geometria: o card pousa em (1070, 883), 1020 × 1166, +1,0° ──
  var FO = { w: 1020, h: 1166, cx: 1070.0, cy: 883.0, rot: 1.0 };
  // a luz: atrás do rosto (o centro da janela da foto), seguindo o pouso 120 ms atrás
  function alvoLuz(t) { var a = pouso(t, T.pousa, T.pousaDur, 300); return { x: FO.cx, y: FO.cy - 73 - a.dy }; }

  function cena(t) {
    t = t + 0.0005;
    aplicarCamera(t, alvoLuz(t - 0.12));
    var a = pouso(t, T.pousa, T.pousaDur, 300), rot = lerp(-1.5, FO.rot, a.p);
    sombra(E("fotoSombra"), FO, a, rot);
    por(E("foto"), FO.cx, FO.cy - a.dy, FO.w, FO.h, rot, a.k, a.op);
    fita(E("fitaE"), t, T.fita, -89); fita(E("fitaD"), t, T.fita + 0.12, 91);
    texto(E("data"), t, T.data, true);
    texto(E("nome"), t, T.nome);
    texto(E("cargo"), t, T.cargo);
    var c = E("cred"); if (c) c.style.opacity = eo(seg(t, T.cred, 0.3)).toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  window.__renderAt(0);
})();
</script>
