    if (t < T.solta) return lerp(DESC.yEntra, DESC.yTopo, eo(seg(t, T.subEntra, 0.5)));
    if (t < T.volta) { var u = t - T.solta; return DESC.yTopo + DESC.vT * (u - DESC.tau * (1 - Math.exp(-u / DESC.tau))); }
    var yF = yFt(MED.fundo), tf = T.pousa - DESC.freio;
    if (t < tf) return DESC.yVolta + DESC.v * (t - T.volta);
    if (t < T.pousa) { var r = T.pousa - t; return yF - DESC.v * r * r / (2 * DESC.freio); }
    return yF;
  }
  function porSub(t) {
    if (!SUBG) return null;
    var y = patinsEm(t), op = noMapa(t) ? (t < T.foto ? eo(seg(t, T.subEntra, 0.3)) : 1) : 0;
    SUBG.setAttribute("transform", "translate(" + SUB.x + "," + y.toFixed(2) + ")");
    SUBG.style.opacity = op.toFixed(3);
    // arte-4: o líder, na altura dos patins, do eixo à ponta esquerda dos patins; só onde a régua já desenrolou; sai no pouso
    if (LIDER) {
      LIDER.set("x1", MED.eixo); LIDER.set("x2", (SUB.x - 66 * SUB.k).toFixed(2));
      LIDER.set("y1", y.toFixed(2)); LIDER.set("y2", y.toFixed(2));
      var kMed = t < T.foto ? eo(seg(t, T.med, 0.45)) : 1, frente = MED.fita.y0 + (MED.fita.y1 - MED.fita.y0) * kMed;
      LIDER.op((op * clamp((frente - y) / 40, 0, 1) * (1 - eo(seg(t, T.pousa, SUB.liderSai)))).toFixed(3));
    }
    return y;
  }

  // ═══ O COLCHETE DO TEMPO (≈ 2 H 30 MIN): ao lado da descida, à esquerda da régua (x 3080), do 0 ft (a superfície, y 220) ao fundo do
  // sonar (y 1594,35), com as pontas para a régua (30 px) e o bico para a cota no meio; --tinta 5 px sobre o contorno de 15 (o traço da
  // régua). Abre do meio para as duas pontas em 0,6 s (eb) em "two" ═══
  var COL = { x: 3080, ponta: 30, bico: 24, y0: 220, y1: 0, dir: 3020 };
  var COLP = null;
  function montarColchete(s) {
    COL.y1 = yFt(MED.fundo);
    COLP = parTraco(s, "path", { d: "M0 0" }, 5, 15, "var(--tinta)");
    COLP.op("0");
  }
  function colchete(t) {
    if (!COLP) return;
    var k = eb(seg(t, T.tempo, 0.6)), on = noMapa(t) && t >= T.tempo;
    if (!on || k <= 0) { COLP.op("0"); return; }
    var ym = (COL.y0 + COL.y1) / 2, a = ym - (ym - COL.y0) * k, b = ym + (COL.y1 - ym) * k;
    var d = "M" + (COL.x - COL.bico) + " " + ym.toFixed(1) + "H" + COL.x + "M" + COL.x + " " + a.toFixed(1) + "V" + b.toFixed(1);
    if (k >= 0.999) d += "M" + COL.x + " " + COL.y0 + "H" + (COL.x + COL.ponta) + "M" + COL.x + " " + COL.y1.toFixed(2) + "H" + (COL.x + COL.ponta);
    COLP.set("d", d); COLP.op("1");
  }

  // ═══ A MESA (b2: identidade §5, "satélite sob a luz", e §4.4, "A mão que arruma"): a foto do Limiting Factor no teste de 2018
  // IMPRESSA (2.400 × 1.250, o arquivo inteiro a 1,00 ×: nunca ampliado; o produto máximo das escalas 1,00 × 1,035 × 1,04 = 1,08 ≤ 1,4),
  // moldura --tinta 2.488 × 1.424 (respiro 44/44/130: a legenda na margem de baixo), centro (1920, 1060), −2° → −1,5°. Pousa em 0,55 s
  // (desce 240 px, escala 0,72 → 1,03 até 0,33 s, assenta em 1,00 até 0,55 s); sombra solta; fitas em +0,30 e +0,42; a luz da mesa
  // ATRÁS DO CASCO (o centro dela no rosto do submersível: as vigias e o braço, x 1.360 e y 660 do arquivo), 120 ms atrás. O push-in
  // rumo ao submersível de 5,783 a 9,6 (1,00 → 1,035, eb; o centro da câmera de 1920 a 1975: o casco vai ao meio), o levantar de 9,85
  // a 10,2 (1,00 → 1,04 em ease-in cúbico, a sombra cresce, a opacidade 1 → 0 nos últimos 200 ms) ═══
  var F = { w: 2488, h: 1424, cx: 1920, cy: 1060, rot: -1.5, rot0: -2.0, rosto: [160, -8] };
  function pousoFoto(t) {
    var t0 = T.foto, p = eo(seg(t, t0, 0.33)), q = eo(seg(t, t0 + 0.33, 0.22)), pt = eo(seg(t, t0, 0.55));
    return { dy: 240 * (1 - pt), k: t < t0 + 0.33 ? lerp(0.72, 1.03, p) : lerp(1.03, 1.00, q), p: pt, rot: lerp(F.rot0, F.rot, pt) };
  }
  // arte-4: a opacidade cai nos últimos 200 ms do levantar (9,75–9,95), não do corte: a mesa fica parada de 9,95 a 10,2
  function levantar(t) { var p = seg(t, T.levanta, 0.35); return { k: 1 + 0.04 * p * p * p, p: p, op: 1 - seg(t, T.levanta + 0.15, 0.2) }; }
  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" + rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  function fita(el, t, t0, lado) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * -40).toFixed(1) + "px) rotate(" + (lado === "e" ? -6 : 5) + "deg) scale(" + (1 + (1 - p) * 0.08).toFixed(4) + ")";
  }
  function camMesa(t) { var p = eb(seg(t, T.push0, T.push1 - T.push0)); return { s: lerp(1.0, 1.035, p), cx: lerp(1920, 1975, p), cy: 1080 }; }
  function mesa(t) {
    var mp = E("mesaPalco"); if (!mp) return;
    var on = !noMapa(t);
    mp.style.visibility = on ? "visible" : "hidden"; mp.style.opacity = on ? "1" : "0";
    if (!on) return;
    var a = pousoFoto(t), l = levantar(t), op = l.op;
    // a sombra solta: no ar +64 px, 1,05, 0,35; assentada +12 px, 1,00, 0,80; no levantar, de volta ao ar
    var sp = a.p * (1 - l.p);
    por(E("fSombra"), F.cx, F.cy - a.dy + lerp(64, 12, sp), F.w, F.h, a.rot, lerp(1.05, 1.0, sp) * a.k * l.k, lerp(0.35, 0.80, sp) * op);
    por(E("fGrupo"), F.cx, F.cy - a.dy, F.w, F.h, a.rot, a.k * l.k, op);
    fita(E("fFe"), t, T.fita, "e"); fita(E("fFd"), t, T.fita + 0.12, "d");
    var lg = E("legFoto"); if (lg) lg.style.opacity = eo(seg(t, T.leg, 0.3)).toFixed(3);
    // a câmera da mesa e o still (-sangria1400) acompanhando a 0,6; a deriva senoidal do RIG para com o push-in (9,6)
    var c = camMesa(t), td = Math.min(t, T.push1) - T.foto;
    var dx = 6 * Math.sin(td * 0.23) + (1920 - c.cx), dy = 4.8 * Math.sin(td * 0.17) + (1080 - c.cy);
    var cm = E("cam"), st = E("still");
    if (cm) cm.style.transform = "scale(" + c.s.toFixed(5) + ") translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
    if (st) { var ss = 1 + (c.s - 1) * 0.6; st.style.transform = "scale(" + ss.toFixed(5) + ") translate(" + (dx * 0.6).toFixed(2) + "px," + (dy * 0.6).toFixed(2) + "px)"; }
    // a luz atrás do casco: o rosto do submersível no instante t − 0,12 (antes do pouso, a posição inicial)
    var b = pousoFoto(Math.max(T.foto, t - 0.12));
    if (cm) { cm.style.setProperty("--luz-x", (F.cx + F.rosto[0]).toFixed(1) + "px"); cm.style.setProperty("--luz-y", (F.cy + F.rosto[1] - b.dy).toFixed(1) + "px"); }
  }

  // ═══ OS TEXTOS SOBRE O MAPA: entram em 300 ms (opacidade + 24 px de subida, eo); os que terminam num CORTE (o da mesa em 5,233 e o fim
  // da cena) saem com ele, sem esmaecer antes ═══
  function ate(t, t0, t1) { if (t < t0 || (t1 != null && t >= t1)) return { op: 0, dy: 24 }; var e = eo(seg(t, t0, 0.3)); return { op: e, dy: 24 * (1 - e) }; }
  function porDireita(el, xDir, yC, v, k) {
    if (!el) return; el.style.opacity = v.op.toFixed(3);
    el.style.transform = "translate(" + (xDir - el.offsetWidth).toFixed(1) + "px," + (yC - el.offsetHeight / 2 + v.dy).toFixed(1) + "px)" + (k ? " scale(" + k.toFixed(4) + ")" : "");
  }

  var MEDIDOR = null;
  window.__fotosProntas = true;
  if (prepararAnel()) iniciarMapa({ c0: cameraEm(0), creditoMapa: TEXTOS.crMapa });
  // os traços sem rótulo das visitas anteriores, no lugar de sempre: o Challenger (23,250, s18), 1964 (~24,000, s26), 2002–2003 (27,300,
  // s33), 1883 (27,366, s15), 1970 (27,460, s30) e 1939 (28,000, s20) — "SÓ A VISITA DA VEZ TEM RÓTULO" (textos-tela › _regras_de_serie)
  MEDIDOR = montarMedidor([23250, 24000, 27300, 27366, 27460, 28000]);
  // arte-4: o líder do submersível (o do marcador da série), por baixo da régua (antes do grupo dela): o eixo o cobre na ponta
  (function () {
    var s = E("svgMed"); if (!s || !MEDIDOR) return;
    var gl = svgEl(null, "g", { id: "subLider" });
    s.insertBefore(gl, MEDIDOR.grupo);
    LIDER = parTraco(gl, "line", { x1: 0, y1: 0, x2: 0, y2: 0 }, 4, 12, "var(--neutro)");
    LIDER.op("0");
  })();
  montarColchete(E("svgMed"));
  montarSub(E("svgMed"));
  ANEL = montarAnel(E("svgIlus"));

  function cena(t) {
    t = t + 0.0005;
    var mapa = noMapa(t);
    if (map && mapaCarregado) map.jumpTo(cameraEm(mapa ? t : T.foto - 0.001));
    // o anel, preso ao ponto, aceso; UM pulso em "first person"
    if (ANEL && map && mapaCarregado) {
      var pa = map.project(ANEL_C); ANEL.setAttribute("transform", "translate(" + pa.x.toFixed(2) + "," + pa.y.toFixed(2) + ")"); ANEL.style.opacity = mapa ? "1" : "0";
      // arte-4: DOIS pulsos seguidos (13,388 e 14,588; identidade §4.4), e para
      var k2 = (t - T.pousa) / 1.2, vivo = k2 >= 0 && k2 < 2, u = vivo ? k2 - Math.floor(k2) : 0;
      ANEL.__pulso.setAttribute("transform", "scale(" + (1 + 0.8 * (vivo ? u : 0)).toFixed(4) + ")"); ANEL.__pulso.setAttribute("opacity", vivo ? (1 - u).toFixed(3) : "0");
    }
    // o medidor: desenrola no 1º quadro (450 ms); some com o mapa no corte da mesa e VOLTA inteiro com ele em 10,2
    medidorAberto(MEDIDOR, mapa ? (t < T.foto ? eo(seg(t, T.med, 0.45)) : 1) : 0);
    porNumero(E("num0"), 0, mapa ? (t < T.foto ? ate(t, T.num0, T.foto).op : ate(t, T.volta, null).op) : 0);
    porNumero(E("num30"), 30000, mapa ? (t < T.foto ? ate(t, T.num30, T.foto).op : ate(t, T.volta + 0.12, null).op) : 0);
    var yp = porSub(t);
    colchete(t);
    // "Limiting Factor": à esquerda do submersível, na altura do meio do casco; parado enquanto a voz o lê, e desce com ele em "down"
    porDireita(E("rotLF"), RLF_DIR, (yp == null ? 0 : yp) - 70 * SUB.k, ate(t, T.rotLF, T.foto));
    // ≈ 2 H 30 MIN: à esquerda do bico do colchete; o número que a voz diz entra na palavra (300 ms, + 24 px, escala 1,04 → 1,00)
    var vt = mapa ? ate(t, T.tempo, null) : { op: 0, dy: 24 };
    porDireita(E("tempo"), COL.dir, (COL.y0 + COL.y1) / 2, vt, lerp(1.04, 1.0, vt.op));
    // FIRST PERSON · DEC. 19, 2018: a legenda da chegada, à esquerda do colchete, acima do fundo e do "30,000 FT"
    var vp = mapa ? ate(t, T.primeiro, null) : { op: 0, dy: 24 };
    porDireita(E("primeiro"), COL.dir, 1460, vp);
    mesa(t);
    // arte-4: o crédito da foto fica PARADO até o corte (10,2, o t1 do redator), sem esmaecer nos 250 ms de repouso
    creditos(t, [{ id: "crFoto", t0: mapa ? 99 : T.foto, t1: null }, { id: "crFonte", t0: mapa ? T.fonte : 99, t1: null }], mapa);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); return true; };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  window.__ready.then(function () { window.__renderAt(0); }, function () {});
  window.__medidas = function (t) {
    var m = medir(t, ["rotLF", "tempo", "primeiro", "num0", "num30", "crMapa", "crFonte", "crFoto", "legFoto", "fGrupo"]);
    if (ANEL_C && map) { var p = map.project(ANEL_C); m.anel = [Math.round(p.x), Math.round(p.y)]; }
    m.patins = +patinsEm(t + 0.0005).toFixed(2);
    return m;
  };
  window.__renderAt(0);
})();
</script>
