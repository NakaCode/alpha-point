/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.

  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d

  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }

  // o pouso da foto impressa (identidade §4.4): desce em eo durante `dur`, assenta 1,03 → 1,00 nos últimos 220 ms
  function pouso(t, t0, dur, desce) {
    var p = eo(seg(t, t0, dur)), q2 = eo(seg(t, t0 + dur - 0.22, 0.22));
    return { op: t >= t0 ? 1 : 0, dy: desce * (1 - p), k: lerp(1.03, 1.00, q2), p: p };
  }
  function sombra(el, g, s, rot) {
    if (!el) return;
    var sy = lerp(64, 12, s.p), sk = lerp(1.05, 1.00, s.p), so = lerp(0.35, 0.80, s.p) * s.op;
    por(el, g.cx, g.cy - s.dy + sy, g.w, g.h, rot, sk * s.k, so);
  }
  function fita(el, t, t0, rotDeg) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "rotate(" + rotDeg + "deg) scale(" + (1.06 - 0.06 * p).toFixed(4) + ")";
  }
  // o CARTÃO DA FALA entra na palavra (identidade §4.4): 300 ms, opacidade + 24 px de subida e escala 1,04 → 1,00; a sombra solta
  // vai já assentada (+12 px, 0,80)
  function entraCartao(el, sh, G, t, t0) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3)), dy = (1 - p) * 24, k = lerp(1.04, 1.0, p);
    por(el, G.cx, G.cy + dy, G.w, G.h, G.rot, k, p);
    if (sh) por(sh, G.cx, G.cy + dy + 12, G.w, G.h, G.rot, k, 0.8 * p);
  }
  function aplicarCamera(t, luz) {
    var camEl = E("cam"), st = E("still");
    var td = Math.min(t, DUR - 0.25);   // a deriva congela nos últimos 250 ms (o repouso da mesa)
    var dx = 6 * Math.sin(td * 0.23), dy = 4.8 * Math.sin(td * 0.17);
    if (camEl) camEl.style.transform = "scale(1) translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
    if (st) { var PAR = 0.6; st.style.transform = "scale(1) translate(" + (dx * PAR).toFixed(2) + "px," + (dy * PAR).toFixed(2) + "px)"; }
    if (camEl && luz) { camEl.style.setProperty("--luz-x", luz.x.toFixed(1) + "px"); camEl.style.setProperty("--luz-y", luz.y.toFixed(1) + "px"); }
  }

  var DUR = 4.5;   // espelho.json › s54 › dur, literal
  window.__duracao = DUR;
  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia final é do redator-de-tela: textos-tela.json › _textos_por_cena s54) ═══
  var TEXTOS = {
    fala:  "“One down!”",                                                 // citacao, t0 2,467 ("say:"), até o corte; literal; nunca "first words"
    atrib: "— Victor Vescovo",                                             // legenda, t0 2,467: dentro do cartão, sob a fala, SEM data
    cred1: "Richard Varcoe, Caladan Oceanic /\nWikimedia Commons · CC BY-SA 4.0",   // credito, t0 0 (o retrato da s52; duas linhas)
    cred2: "Source: Popular Science, 2018"                                 // credito, t0 2,467 (a fonte da fala, na faixa)
  };
  (function () { for (var k in TEXTOS) { var e = E(k); if (e) e.textContent = TEXTOS[k]; } })();
  // ── os tempos (locais, −445,9), do words.json, da regência e dos textos de tela ──
  var T = {
    pousa: 0.00, pousaDur: 0.78, fita: 0.68,   // o retrato pousa em "When" e assenta em 0,78 (o mesmo pouso da s52)
    fala: 2.467,                              // "say:" (448,385 s): o cartão e a fonte
    cred1: 0.00,
    repouso: DUR - 0.25
  };
  // ── a geometria ──
  var FO = { w: 1020, h: 1166, cx: 900.0, cy: 1020.0, rot: 1.0 };          // o retrato: x 390 → 1410, y 437 → 1603
  var C1 = { w: 1780, h: 500, cx: 1640 + 890, cy: 740 + 250, rot: 0.6 };    // o cartão: canto (1640, 740); as medidas reais vêm do DOM
  var __medido = false;
  function medir() {   // o cartão se dimensiona pelo texto (a Inter real); a sombra ganha o tamanho dele
    var c = E("c1"), cs = E("c1Sombra"); if (!c) return;
    if (c.offsetWidth < 10) return;
    C1.w = c.offsetWidth; C1.h = c.offsetHeight; C1.cx = 1640 + C1.w / 2; C1.cy = 740 + C1.h / 2;
    if (cs) { cs.style.width = C1.w + "px"; cs.style.height = C1.h + "px"; }
    __medido = true;
  }
  // a luz (120 ms atrás, pelo chamador): atrás do rosto; em 2,467 vai ao cartão (0,6 s, eb), e o retrato fica fora da poça
  function alvoLuz(t) {
    var a = pouso(t, T.pousa, T.pousaDur, 300), u = eb(seg(t, T.fala, 0.6));
    return { x: lerp(FO.cx, C1.cx, u), y: lerp(FO.cy - 73 - a.dy, C1.cy, u) };
  }

  function cena(t) {
    t = t + 0.0005;
    if (!__medido) medir();
    aplicarCamera(t, alvoLuz(t - 0.12));
    var a = pouso(t, T.pousa, T.pousaDur, 300), rot = lerp(-1.5, FO.rot, a.p);
    sombra(E("fotoSombra"), FO, a, rot);
    por(E("foto"), FO.cx, FO.cy - a.dy, FO.w, FO.h, rot, a.k, a.op);
    fita(E("fitaE"), t, T.fita, -89); fita(E("fitaD"), t, T.fita + 0.12, 91);
    entraCartao(E("c1"), E("c1Sombra"), C1, t, T.fala);
    var c1 = E("cred1"); if (c1) c1.style.opacity = eo(seg(t, T.cred1, 0.3)).toFixed(3);
    var c2 = E("cred2"); if (c2) c2.style.opacity = eo(seg(t, T.fala, 0.3)).toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () { __medido = false; medir(); window.__renderAt(0); return true; });
  window.__renderAt(0);
})();
</script>
