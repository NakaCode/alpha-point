/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.

   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();

    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");

  // a luz: atrás do cartão (um pouco acima do centro, nas barras do meio); segue o pouso 120 ms atrás
  function alvoLuz(t) { var a = pouso(t, T.pousa, T.pousaDur, 420); return { x: 2200, y: CA.cy - 40 - a.dy }; }

  function cena(t) {
    t = t + 0.0005;
    aplicarCamera(camEstado(CAM, t), t, alvoLuz(t - 0.12));
    // o inset da Tabela 1: já assentado desde o 1º quadro (fica)
    objeto("ins", "insSombra", IN, { op: 1, dy: 0, k: 1, p: 1 }, IN.rot);
    // o cartão pousa
    var a = pouso(t, T.pousa, T.pousaDur, 420), rot = lerp(-0.6, CA.rot, a.p);
    objeto("car", "carSombra", CA, a, rot);
    // as barras, por ponto (500 ms cada), e os rótulos diretos do 1º par (recortados ao fim da barra enquanto ela cresce)
    var p1 = barra(E("pub1"), t, T.pub1); legenda(E("legPub"), t, T.legPub, p1, 1670);
    var s1 = barra(E("son1"), t, T.son1); legenda(E("legSon"), t, T.legSon, s1, 1423.5);
    barra(E("pub2"), t, T.pub2); barra(E("son2"), t, T.son2);
    barra(E("pub3"), t, T.pub3); barra(E("son3"), t, T.son3);
    // os blocos dos pares (rótulo + cota), na palavra
    numero(E("par1"), t, T.par1); numero(E("par2"), t, T.par2); numero(E("par3"), t, T.par3);
    // o herói (a legenda do gráfico), na palavra
    numero(E("heroi"), t, T.heroi);
    // a diferença se acende nas três de uma vez: a hachura da esquerda para a direita, o degrau de baixo para cima (0,5 s, eo)
    var d = eo(seg(t, T.dif, 0.5));
    ["dif1", "dif2", "dif3"].forEach(function (id) { var e = E(id); if (e) e.style.transform = "scaleX(" + d.toFixed(5) + ")"; });
    ["deg1", "deg2", "deg3"].forEach(function (id) { var e = E(id); if (e) e.style.transform = "scaleY(" + d.toFixed(5) + ")"; });
    var c = E("cred"); if (c) c.style.opacity = eo(seg(t, T.cred, 0.3)).toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  window.__renderAt(0);
})();
