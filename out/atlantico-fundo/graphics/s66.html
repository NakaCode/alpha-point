<script>
/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de
   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();

(function () {

  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.

  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }

  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {

    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;

    });

    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();

<script>
(function () {
  "use strict";
  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo, eb = R.eb;
  var E = function (id) { return document.getElementById(id); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var DUR = 7.633;   // espelho.json › s66 › dur, literal
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia final é do redator-de-tela: textos-tela.json › _textos_por_cena s66) ═══
  var TEXTOS = {
    rMM: "Mount Michael",                 // rotulo, 0,3–3,033 (lugar_na_origem "Mount Michael on Saunders Island")
    lLs: "Landsat · Aug. 24, 2026",       // legenda, 0,233–3,033 (sem crédito: NASA/USGS)
    lLl: "Lava lake\n(illustration)"      // legenda, 3,9–7,633 (o desenho da cratera: diz que é desenho; duas linhas)
  };
  Object.keys(TEXTOS).forEach(function (k) { var e = E(k); if (e) e.textContent = TEXTOS[k]; });

  // ── os tempos (locais, −571,8), do words.json, da regência e dos textos de tela ──
  var T = {
    leg1: 0.233, rot1: 0.30,             // "August" (572,035) e o t0 do redator
    saem0: 2.80, saem1: 3.03,            // as pílulas do plano 1 saem antes do encolhimento (textos-tela t1 3,033)
    encolhe: 3.035, encolheDur: 0.30,    // "caught" (574,835): a foto vai à metade esquerda em 300 ms
    corte0: 3.15, corteDur: 0.60,        // o corte da cratera se desenha
    sat0: 3.35, satDur: 0.40,            // o satélite se desenha
    conduto0: 3.60,                      // a aresta escondida aparece
    raios0: 3.325, raioDur: 0.90, raioPasso: 0.07,   // "heat" (575,125): os raios crescem do lago ao sensor
    cam0: 3.335, cam1: 3.65,             // push-in 1,00 → 1,02; termina 0,25 s antes de "lava" (3,915)
    cam2: 6.00, cam3: 7.20,              // "one of those volcanoes.": 1,02 → 1,04
    leg2: 3.90,                          // "lava" (575,715; textos-tela t0 3,9): a legenda do desenho e a chamada
    hach0: 3.915,                        // a hachura do líquido
    repouso: DUR - 0.25
  };
  // a câmera da mesa (só sobre #cam; a deriva do RIG entra com o encolhimento)
  var CAM = [
    { t0: 0.00, s: 1.000, cx: 1920, cy: 1080 },
    { t0: T.cam0, t1: T.cam1, s: 1.020, cx: 1920, cy: 1080 },
    { t0: T.cam2, t1: T.cam3, s: 1.040, cx: 1920, cy: 1080 }
  ];
  function camEstado(t) {
    var a = CAM[0], s = a.s, cx = a.cx, cy = a.cy;
    for (var i = 1; i < CAM.length; i++) {
      var m = CAM[i]; if (t < m.t0) break;
      var p = eb(seg(t, m.t0, m.t1 - m.t0));
      s = lerp(s, m.s, p); cx = lerp(cx, m.cx, p); cy = lerp(cy, m.cy, p);
    }
    return { s: s, cx: cx, cy: cy };
  }
  function aplicarCamera(t) {
    var c = camEstado(t), camEl = E("cam"), st = E("still");
    var td = Math.min(t, T.repouso);                    // a deriva congela nos 250 ms antes do corte
    var ganho = eb(seg(t, T.encolhe, T.encolheDur));    // e só existe depois do encolhimento (antes, a foto em tela cheia)
    var dx = ganho * 6 * Math.sin(td * 0.23) + (1920 - c.cx), dy = ganho * 4.8 * Math.sin(td * 0.17) + (1080 - c.cy);
    if (camEl) camEl.style.transform = "scale(" + c.s.toFixed(5) + ") translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
    if (st) { var PAR = 0.6, ss = 1 + (c.s - 1) * PAR; st.style.transform = "scale(" + ss.toFixed(5) + ") translate(" + (dx * PAR).toFixed(2) + "px," + (dy * PAR).toFixed(2) + "px)"; }
  }
  // o Ken Burns com direção (identidade §4.4): 1,00 → 1,091 em 6 s (1,4 ÷ 1,283), linear, até o encolhimento; a janela anda rumo à cratera
  var KB = { taxa: 0.091 / 6, vel: 80 / 6, dir: [0.83, -0.57] };
  function foto(t) {
    var f = E("foto"), j = E("janela"); if (!f || !j) return;
    var tk = Math.min(t, T.encolhe);
    var s = 1 + KB.taxa * tk, dx = KB.vel * KB.dir[0] * tk, dy = KB.vel * KB.dir[1] * tk;
    f.style.transform = "translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px) scale(" + s.toFixed(5) + ")";
    var p = eb(seg(t, T.encolhe, T.encolheDur)), k = lerp(1, 0.4375, p);

  }
  // o traço que se desenha: o comprimento total vem do próprio caminho (medido no DOM, uma vez)
  var LEN = {};
  function medir(id) { var e = E(id); if (!e || !e.getTotalLength) return 0; var L = e.getTotalLength(); e.style.strokeDasharray = L + " " + L; return L; }
  ["corte", "sCorte", "sat", "sSat", "chamada"].forEach(function (id) { LEN[id] = medir(id); });
  function tracar(id, p) { var e = E(id); if (!e) return; var L = LEN[id] || 0; e.style.strokeDashoffset = (L * (1 - p)).toFixed(2); e.style.opacity = p > 0 ? "" : "0"; }
  // a hachura do líquido: linhas a 45° dentro do lago (recortadas pelo polígono do lago)
  (function () {
    var g = E("hachura"); if (!g) return;
    for (var x = 2480; x <= 2900; x += 44) {
      var l = document.createElementNS("http://www.w3.org/2000/svg", "line");
      l.setAttribute("class", "hach"); l.setAttribute("x1", x); l.setAttribute("y1", 990); l.setAttribute("x2", x + 140); l.setAttribute("y2", 850);
      g.appendChild(l);
    }
  })();
  // os raios: o recorte circular de cada um cresce do lago ao sensor (o comprimento de cada raio, calculado)
  var RAIOS = [2590, 2660, 2730, 2800, 2860].map(function (x, i) { return { c: "c" + i, len: Math.hypot(3270 - x, 450 - 860), i: i }; });
  function raios(t) {
    var g = E("raios"); if (!g) return;
    var linhas = g.querySelectorAll("line"), td = Math.min(t, T.repouso);
    RAIOS.forEach(function (r) {
      var p = eo(seg(t, T.raios0 + r.i * T.raioPasso, T.raioDur));
      var c = E(r.c); if (c) c.setAttribute("r", (r.len * p + 0.5).toFixed(2));
      var respira = 0.68 + 0.12 * Math.sin(2 * Math.PI * td / 1.7 + r.i * 1.3);
      var l = linhas[r.i]; if (l) l.style.opacity = (p > 0 ? respira : 0).toFixed(3);
    });
  }
  // o rótulo e a legenda: 300 ms, opacidade + 24 px (eo); as pílulas do plano 1 saem em 230 ms
  function texto(el, t, t0) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * 24).toFixed(1) + "px)";
  }
  function textoSai(el, t, t0, s0, s1) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3)), q = 1 - seg(t, s0, s1 - s0);
    el.style.opacity = (p * q).toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * 24).toFixed(1) + "px)";
  }
  function cena(t) {
    var tt = t + 0.0005;
    aplicarCamera(tt);
    foto(tt);
    textoSai(E("rMM"), tt, T.rot1, T.saem0, T.saem1);
    textoSai(E("lLs"), tt, T.leg1, T.saem0, T.saem1);
    var pc = eo(seg(tt, T.corte0, T.corteDur)); tracar("corte", pc); tracar("sCorte", pc);
    var ps = eo(seg(tt, T.sat0, T.satDur)); tracar("sat", ps); tracar("sSat", ps);
    var cd = E("conduto"); if (cd) cd.style.opacity = (0.42 * eo(seg(tt, T.conduto0, 0.3))).toFixed(3);
    raios(tt);
    tracar("chamada", eo(seg(tt, T.leg2, 0.3)));
    texto(E("lLl"), tt, T.leg2);
    var ph = 0.45 * eo(seg(tt, T.hach0, 0.3)), hs = E("hachura");
    if (hs) [].slice.call(hs.querySelectorAll("line")).forEach(function (l) { l.style.opacity = ph.toFixed(3); });
  }
  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  window.__renderAt(0);
})();
