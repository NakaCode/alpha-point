    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");

      tampaCau.push([cau.x + ru * (cau.ty * Math.cos(a) - cau.tx * Math.sin(a)), cau.y + ru * (-cau.tx * Math.cos(a) - cau.ty * Math.sin(a))]);
    }
    var todos = esq.concat(tampaCab, dir.slice().reverse(), tampaCau);
    return "M" + todos.map(function (q) { return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" L") + " Z";
  })();
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function eo(p) { return 1 - Math.pow(1 - p, 3); }
  function montar(g, op) {
    if (!g) return null;
    op = op || {};
    var tinta = op.tinta || "var(--tinta-escura)", destaque = op.destaque || "var(--destaque)";
    var ticks = [], k;
    for (k = 0; k < G.total; k++) {
      var c = centro(k), e = document.createElementNS(NS, "path");
      e.setAttribute("d", D_TICK);
      e.setAttribute("pathLength", "1");
      e.setAttribute("transform", "translate(" + c.x.toFixed(2) + "," + c.y.toFixed(2) + ")");
      e.setAttribute("stroke-width", G.tick.traco);
      e.setAttribute("stroke-linejoin", "round");
      e.setAttribute("stroke-dasharray", "1 1");
      e.style.setProperty("stroke", tinta);
      e.style.setProperty("fill", tinta);
      e.setAttribute("fill-opacity", "0");
      e.setAttribute("opacity", "0");
      g.appendChild(e);
      ticks.push({ el: e, c: c, cheio: k < G.cheios });
    }
    function estado(s) {
      s = s || {};
      var pc = s.contorno == null ? 1 : clamp01(s.contorno), ph = s.cheio == null ? 1 : clamp01(s.cheio), pt = clamp01(s.taipan || 0);
      for (var k = 0; k < ticks.length; k++) {
        var t = ticks[k], c = t.c;
        // a onda do contorno: o atraso cresce com a coluna (até 38 %) e a fileira (até 18 %); a pena leva 44 %
        var d0 = 0.38 * c.c / (G.colunas - 1) + 0.18 * c.f / (G.fileiras - 1);
        var p = eo(clamp01((pc - d0) / 0.44));
        t.el.setAttribute("stroke-dashoffset", (1 - p).toFixed(4));
        t.el.setAttribute("opacity", p > 0 ? "1" : "0");
        // a maré do cheio: fileira a fileira (até 57 %), da esquerda para a direita (até 15 %); cada um leva 28 %
        var q = 0;
        if (t.cheio) q = eo(clamp01((ph - (0.57 * c.f / 6 + 0.15 * c.c / (G.colunas - 1))) / 0.28));
        t.el.setAttribute("fill-opacity", q.toFixed(3));
        if (k === G.taipan) {
          var e = eo(pt);
          t.el.style.setProperty("fill", pt > 0 ? "color-mix(in srgb, " + destaque + " " + (e * 100).toFixed(1) + "%, " + tinta + ")" : tinta);
          t.el.setAttribute("transform", "translate(" + c.x.toFixed(2) + "," + c.y.toFixed(2) + ") scale(" + (1 + 0.18 * e).toFixed(4) + ")");
        }
      }
    }
    return { estado: estado, ticks: ticks };
  }
  return { G: G, centro: centro, caixaCheio: caixaCheio, montar: montar, D_TICK: D_TICK };
})();
