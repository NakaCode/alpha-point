    textos = textos || {}; op = op || {};

    host.style.width = G.W + "px"; host.style.height = G.H + "px";
    if (sombra) { sombra.style.width = G.W + "px"; sombra.style.height = (G.H - G.sombra.recuo) + "px"; }
    var papel = div("folha rasgada", host);
    papel.id = id + "Papel";
    papel.style.width = G.W + "px"; papel.style.height = G.H + "px";
    papel.setAttribute("data-qc-margem", "papel");
    papel.setAttribute("data-qc-fonte-livre", "folha de documento recriada: Courier Prime (--fonte-doc), identidade §3 e §5");
    // a tabela: os fios, os tracinhos da régua e as pautas do pé
    var tab = svg("svg", { "class": "fol-tab", viewBox: "0 0 " + G.W + " " + G.H, width: G.W, height: G.H }, papel);
    svg("line", { "class": "fol-fio", x1: T.x0, x2: T.x1, y1: T.yTopo, y2: T.yTopo, "stroke-width": 4 }, tab);
    svg("line", { "class": "fol-fio", x1: T.x0, x2: T.x1, y1: T.yFioRegua, y2: T.yFioRegua, "stroke-width": 7 }, tab);
    for (i = 1; i < T.colunas; i++) svg("line", { "class": "fol-fio-leve", x1: T.x0 + T.passo * i, x2: T.x0 + T.passo * i, y1: T.yTopo + 14, y2: T.yFioRegua - 14, "stroke-width": 3 }, tab);
    for (s = 0; s < T.slots; s++) svg("line", { "class": s === T.slots - 1 ? "fol-fio" : "fol-fio-leve", x1: T.x0, x2: T.x1, y1: yFioSlot(s), y2: yFioSlot(s), "stroke-width": s === T.slots - 1 ? 4 : 3 }, tab);
    var nLinhasNota = 6;
    for (i = 1; i <= nLinhasNota; i++) svg("line", { "class": "fol-pauta", x1: G.nota.x, x2: G.lapis.x1, y1: G.nota.y + G.nota.linhaAlt * i - 6, y2: G.nota.y + G.nota.linhaAlt * i - 6, "stroke-width": 3 }, tab);
    // a régua dos anos
    var anos = fila(tab, id + "Anos", textos.anos || "", T.yRegua);
    // os slots: o rótulo (um nó, da esquerda, revelado por um recorte que anda de letra em letra) e as células
    var defs = svg("defs", {}, tab), slots = [];
    for (s = 0; s < T.slots; s++) {
      var L = (textos.linhas || [])[s] || null, slot = { rot: null, rec: null, n: 0, cel: null };
      if (L) {
        var cp = svg("clipPath", { id: id + "RecRot" + s, clipPathUnits: "objectBoundingBox" }, defs);
        slot.rec = svg("rect", { x: 0, y: -0.5, width: 0, height: 2 }, cp);
        slot.rot = svg("text", { id: id + "Rot" + s, "class": "fol-txt", "data-qc-papel": "eixo", x: T.x0 + T.recuo, y: (yRotulo(s) + G.baixa).toFixed(1),
          "clip-path": "url(#" + id + "RecRot" + s + ")" }, tab);
        slot.rot.textContent = L.rotulo; slot.n = String(L.rotulo).length;
        slot.cel = fila(tab, id + "Cel" + s, L.celulas || "", yCelulas(s));
      }
      slots.push(slot);
    }
    // o cabeçalho, na caixa de contorno; o texto é um <span> só, revelado de letra em letra
    var cab = div("fol-cab", papel);
    cab.style.left = G.cab.x + "px"; cab.style.top = G.cab.y + "px"; cab.style.fontSize = G.cab.px + "px";
    var cabTx = document.createElement("span"); cabTx.id = id + "Cab"; cabTx.setAttribute("data-qc-papel", "eixo");
    cabTx.textContent = textos.cab || ""; cab.appendChild(cabTx);
    var nCab = String(textos.cab || "").length;
    // a nota (a), no pé
    var nota = null;
    if (textos.nota) {
      nota = div("fol-nota", papel); nota.id = id + "Nota"; nota.setAttribute("data-qc-papel", "eixo");
      nota.style.left = G.nota.x + "px"; nota.style.top = G.nota.y + "px";
      nota.textContent = quebrar(textos.nota, G.nota.colunas).join("\n");
    }
    // as fitas, nos cantos de cima, para fora do texto
    var fe = div("fita", host), fd = div("fita", host);
    fe.id = id + "Fe"; fd.id = id + "Fd";
    fe.style.left = G.fita.borda + "px"; fe.style.top = G.fita.cima + "px";
    fd.style.left = (G.W - G.fita.larg - G.fita.borda) + "px"; fd.style.top = G.fita.cima + "px";
    function ver(el, on) { if (el) { el.style.opacity = on ? "1" : "0"; el.style.visibility = on ? "visible" : "hidden"; } }
    function estado(e) {
      e = e || {};
      // o cabeçalho: n letras batidas
      var fc = e.cab == null ? 1 : clamp01(e.cab), n = Math.round(fc * nCab);
      ver(cabTx, n > 0);
      cabTx.style.clipPath = n >= nCab ? "none" : "inset(-20% " + (100 * (1 - n / Math.max(1, nCab))).toFixed(3) + "% -20% 0)";
      ver(anos.el, e.regua == null ? true : !!e.regua);
      var ls = e.linhas || [];
      slots.forEach(function (slot, s) {
        if (!slot.rot) return;

        ver(slot.rot, nr > 0);
        slot.rec.setAttribute("width", (nr / Math.max(1, slot.n)).toFixed(5));
        ver(slot.cel.el, nc > 0);
        slot.cel.cel.forEach(function (c, j) { c.setAttribute("fill-opacity", j < nc ? "1" : "0"); });
      });
      ver(nota, e.nota == null ? !!nota : !!e.nota);
    }
    estado({ cab: 0, regua: 0, linhas: [], nota: 0 });
    return { estado: estado, papel: papel, host: host, sombra: sombra || null, fitas: [fe, fd], cab: cab, cabTx: cabTx, anos: anos, slots: slots, nota: nota };
  }
  return { G: G, colCentro: colCentro, colDireita: colDireita, yRotulo: yRotulo, yCelulas: yCelulas, yFioSlot: yFioSlot, naCamera: naCamera, quebrar: quebrar, montar: montar };
})();
/* ═══════════════ PEÇA 2 · O LIVRO DO ABS — FIM DO BLOCO ═══════════════ */
</script>
<script>
(function () {
  "use strict";
  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo, eb = R.eb;
  var E = function (id) { return document.getElementById(id); };

  var DUR = 8.2;
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia é do redator-de-tela: textos-tela.json › _textos_por_cena s07) ═══
  var TEXTOS = {
    eixo: "2016   2017   2018   2019   2020   2021   2022   2023   2024   2025",           // [16] eixo, 1,433–3,633 (P1)
    cab: "Causes of Death, Australia, 2025",                                                // [17] folha_cabecalho, 3,667–8,200
    anos: "2016   2017   2018   2019   2020   2021   2022   2023   2024   2025",           // [18] folha_texto, 3,667–8,200: a régua dos anos
    rotulo: "Contact with venomous animals and plants (X20-X29)",                           // [19] folha_texto, 3,667–8,200: como o ABS escreve
    celulas: "4   10   19   6   9   6   6   8   11   6",                                    // [20] folha_texto, 6,333–8,200: as dez células "Persons"
    nota: "(a) Causes of death data for recent years is preliminary and subject to a revisions process. This table includes final data for 2016-2022, revised data for 2023, preliminary revised data for 2024 and preliminary data for 2025.",   // [21] folha_texto, 3,667–8,200: a nota (a) do ABS, literal
    oitenta: "= 85",                                                                        // [22] cota, 6,800–8,200: o lápis do canal, fora da tabela
    legenda: "2016–2025 · 2023 REVISED\n2024–2025 PRELIMINARY",                             // [23] legenda, 3,667–8,200: a quebra no lugar do 2º "·", que sai
    cred: "Source: Australian Bureau of Statistics (ABS),\nCauses of Death, Australia, 2025 · CC BY 4.0"   // [24] credito, 0–8,200 (a quebra do redator)
  };
  (function () { var c = E("cred"); if (c) c.textContent = TEXTOS.cred; })();

  // ═══ A MESA: os executores de "A mão que arruma" (identidade §4.4), um por transformação ═══
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var ein3 = function (p) { return p * p * p; };   // o levantar (a única curva fora do eo e do eb do RIG)
  // põe um elemento de w × h com o CENTRO em (cx, cy), girado (graus) e na escala s
  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  // a chegada da FOLHA: desce `desce` px em `dur` (0,80 s) em eo; ASSENTA 1,03 → 1,00 de 0,56 s ao fim, uma vez, sem voltar
  function pousoFolha(t, t0, dur, desce) {
    var p = eo(seg(t, t0, dur)), q2 = eo(seg(t, t0 + 0.56, dur - 0.56));
    return { op: t >= t0 ? 1 : 0, dy: desce * (1 - p), k: lerp(1.03, 1.00, q2), p: p };
  }
  // a chegada da FOTO impressa: desce 240 px em 0,55 s (eo); a escala 0,72 → 1,03 até 0,33 s e ASSENTA 1,03 → 1,00 até 0,55 s
  function pousoFoto(t, t0) {
    var p = eo(seg(t, t0, 0.55)), q1 = eo(seg(t, t0, 0.33)), q2 = eo(seg(t, t0 + 0.33, 0.22));
    return { op: t < t0 ? 0 : eo(seg(t, t0, 0.12)), dy: 240 * (1 - p), k: lerp(lerp(0.72, 1.03, q1), 1.00, q2), p: p };
  }
  // o objeto e a sombra solta dele (no ar +64 px / 1,05 / 0,35; assentada +12 px / 1,00 / 0,80; só transform e opacity)
  // g = { w, h, hs (a altura da sombra), k (a escala do objeto na cena), cx, cy }; s = o pouso; rot em graus
  function objeto(elG, elS, g, s, rot) {
    var k = g.k || 1, hs = g.hs || g.h;
    var sy = lerp(64, 12, s.p), sk = lerp(1.05, 1.00, s.p), so = lerp(0.35, 0.80, s.p) * s.op;
    por(elS, g.cx, g.cy - s.dy + sy - k * (g.h - hs) / 2, g.w, hs, rot, sk * k * s.k, so);
    por(elG, g.cx, g.cy - s.dy, g.w, g.h, rot, s.k * k, s.op);
  }
  // a fita cola em 300 ms (desce 40 px, encolhe 8 %)
  function fita(el, t, t0, lado) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * -40).toFixed(1) + "px) rotate(" + (lado === "e" ? -5 : 4) + "deg) scale(" + (1 + (1 - p) * 0.08).toFixed(4) + ")";
  }
  // a câmera da mesa: escala s em torno de (ox, oy) + a deriva (dx, dy); o still acompanha a --mesa-satelite-paralaxe (0,6), sobre
  // o mesmo ponto (com a sangria de 56 px); a luz é o véu no fundo de #cam, atrás do objeto que a voz nomeia (luz = {x, y})
  function cameraMesa(s, ox, oy, dx, dy, luz) {
    var camEl = E("cam"), st = E("still");
    if (camEl) {
      camEl.style.transformOrigin = ox.toFixed(1) + "px " + oy.toFixed(1) + "px";
      camEl.style.transform = "scale(" + s.toFixed(5) + ") translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
      if (luz) { camEl.style.setProperty("--luz-x", luz.x.toFixed(1) + "px"); camEl.style.setProperty("--luz-y", luz.y.toFixed(1) + "px"); }
    }

  // ═══ fim dos executores da mesa ═══

  // ═══ A POSE "DE PERTO" (s07 P2 e s08: a mesma mesa, a mesma folha, a mesma câmera; as duas cenas trazem este bloco IGUAL) ═══
  // A folha na medida dela (k 1: o corpo a 86 px na tela), mais larga que o quadro (3620 px: a borda de cima e as fitas ficam fora
  // dele; o rasgo fica à vista embaixo, com a mesa). O centro em (1930, 820), −1,5°: o cabeçalho encosta no alto (y ≥ 170), a régua e
  // a linha X20-X29 vão de x 247 a 3010, o "= 85" do lápis até x 3545, a nota (a) até y 1530, e o rasgo fica acima de y 1820.
  var PERTO = {
    folha: { cx: 1930, cy: 820, k: 1, rot: -1.5 },
    cam: { ox: 1930, oy: 640, s0: 0.985, s1: 1 },   // o empurrão curto da s07 P2 (0,985 → 1,000) em torno do meio da tabela; na s08 a câmera fica em 1
    deriva0: 3.65,                                  // o relógio da deriva de P2 conta do corte da s07 (3,65 s)
    derivaFimS07: 4.30,                             // o relógio da deriva no último quadro da s07 (8,20 − 0,25 − 3,65): a s08 continua dele
    lapis85: { x: 2990, yMeio: 764 },               // o "= 85": à direita da tabela, na altura das dez células (px da folha)
    lapisLeg: { xDir: 3430, y: 1064 }               // a legenda do período (s07): alinhada à direita, na altura da nota (px da folha)
  };
  // o lápis: os dois nós da anotação do canal, dentro do papel (o estilo é o bloco "O LÁPIS DO CANAL")
  function lapisMontar(papel, textos) {
    var o = {};
    if (!papel) return o;
    if (textos.oitenta) {
      o.oitenta = document.createElement("div"); o.oitenta.className = "lapis lapis-85"; o.oitenta.id = "lapis85";
      o.oitenta.setAttribute("data-qc-papel", "rotulo"); o.oitenta.textContent = textos.oitenta;
      o.oitenta.style.left = PERTO.lapis85.x + "px"; o.oitenta.style.top = (PERTO.lapis85.yMeio - 84) + "px";
      papel.appendChild(o.oitenta);
    }
    if (textos.legenda) {
      o.legenda = document.createElement("div"); o.legenda.className = "lapis lapis-leg"; o.legenda.id = "lapisLeg";
      o.legenda.setAttribute("data-qc-papel", "eixo"); o.legenda.textContent = textos.legenda;
      o.legenda.style.right = (FOLHA.G.W - PERTO.lapisLeg.xDir) + "px"; o.legenda.style.top = PERTO.lapisLeg.y + "px";
      papel.appendChild(o.legenda);
    }
    return o;
  }
  // ═══ fim da pose "de perto" ═══

  // ── os tempos (locais, −27,933), do words.json, dos textos de tela e da regência s07 ──
  var T = {
    sobe: 0.00, sobeDur: 1.25,            // P1: as dez pilhas, em "Over ten years"
    eixo: 1.433, eixoDur: 1.38,           // [16]: de "twenty" (2016 em 1,433) a "twenty-five," (2025 em 2,607)
    corte: 3.65,                          // P1 → P2: o quadro de 3,633 s ainda é o dado; o de 3,667 s (o t0 do redator) já é a folha
    legenda: 3.667,                       // [23]
    rotulo: [[3.667, 0], [4.07, 13], [4.85, 30], [5.75, 50]],   // [19]: as letras batidas em cada instante ("venomous" na palavra)
    camFim: 6.00,                         // a câmera chega 0,3 s antes das células e para
    celulas: 6.333, celulaPasso: 0.042,   // [20]: "killed"; uma célula a cada 42 ms
    oitenta: 6.800,                       // [22]: "eighty-five"
    cred: 0
  };

  // ── P1: as dez colunas ──
  var C = COLUNAS.montar(E("gColunas"), E("colChao"), E("colEixo"), TEXTOS.eixo);

  // ── P2: a folha de perto ──
  var GF = FOLHA.G, P = PERTO.folha;
  var FO = { w: GF.W, h: GF.H, hs: GF.H - GF.sombra.recuo, k: P.k, cx: P.cx, cy: P.cy };
  var F = FOLHA.montar(E("fol"), E("folSombra"), { cab: TEXTOS.cab, anos: TEXTOS.anos, linhas: [{ rotulo: TEXTOS.rotulo, celulas: TEXTOS.celulas }], nota: TEXTOS.nota });
  var L = lapisMontar(F ? F.papel : null, { oitenta: TEXTOS.oitenta, legenda: TEXTOS.legenda });
  var ASSENTADA = { op: 1, dy: 0, k: 1, p: 1 };     // a folha já está na mesa (o corte a encontra pousada)
  var LUZ = { x: P.cx, y: P.cy };                   // a luz atrás da folha

  function letras(t, m) {   // as letras batidas em t, pelos marcos [[t, n], …]
    if (t <= m[0][0]) return t < m[0][0] ? 0 : m[0][1];
    for (var i = 1; i < m.length; i++) if (t <= m[i][0]) return m[i - 1][1] + (m[i][1] - m[i - 1][1]) * (t - m[i - 1][0]) / (m[i][0] - m[i - 1][0]);
    return m[m.length - 1][1];
  }
  function ver(el, on) { if (el) el.style.display = on ? "block" : "none"; }   // display, e não visibility: um filho com visibility própria apareceria com o pai escondido

  function cena(t) {
    var p2 = t >= T.corte;
    ver(E("vDado"), !p2); ver(E("vMesa"), p2);
    var c = E("cred");
    if (c) { c.style.opacity = eo(seg(t, T.cred, 0.3)).toFixed(3); c.className = p2 ? "cred" : "cred no-papel"; }
    if (!p2) {
      // P1: a câmera do dado (o empurrão lento e a deriva do RIG)
      var cd = E("camD"), d1 = deriva(t);
      if (cd) cd.style.transform = "scale(" + (1 + 0.012 * t / T.corte).toFixed(5) + ") translate(" + d1.x.toFixed(2) + "px," + d1.y.toFixed(2) + "px)";
      if (C) C.estado({ sobe: seg(t, T.sobe, T.sobeDur), eixo: seg(t, T.eixo, T.eixoDur) });

    var td = Math.min(t, DUR - 0.25) - PERTO.deriva0, d = deriva(td);
    var s = lerp(PERTO.cam.s0, PERTO.cam.s1, eo(seg(t, T.corte, T.camFim - T.corte)));
    cameraMesa(s, PERTO.cam.ox, PERTO.cam.oy, d.x, d.y, LUZ);
    objeto(E("fol"), E("folSombra"), FO, ASSENTADA, P.rot);
    if (F) {
      F.fitas.forEach(function (f) { f.style.opacity = "1"; f.style.transform = "rotate(" + (f === F.fitas[0] ? -5 : 4) + "deg)"; });
      var nc = t < T.celulas ? 0 : Math.min(10, 1 + Math.floor((t - T.celulas) / T.celulaPasso + 1e-6));
      F.estado({ cab: 1, regua: 1, linhas: [{ rotulo: letras(t, T.rotulo) / TEXTOS.rotulo.length, celulas: nc }], nota: 1 });
    }
    // o lápis: a legenda entra em 300 ms (opacidade + 24 px); o "= 85" se escreve da esquerda para a direita em 300 ms (1,04 → 1,00)
    if (L.legenda) { var pl = eo(seg(t, T.legenda, 0.3)); L.legenda.style.opacity = pl.toFixed(3); L.legenda.style.transform = "translateY(" + ((1 - pl) * 24).toFixed(1) + "px)"; }
    if (L.oitenta) {
      var po = seg(t, T.oitenta, 0.3), pe = eo(po);
      L.oitenta.style.opacity = t < T.oitenta ? "0" : "1";
      L.oitenta.style.clipPath = po >= 1 ? "none" : "inset(-10% " + (100 * (1 - pe)).toFixed(2) + "% -10% -5%)";
      L.oitenta.style.transform = "scale(" + (1.04 - 0.04 * pe).toFixed(4) + ")";
    }
  }

    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e); }   // nunca lança
  };

  var fontesDoc = [
    document.fonts.load('400 86px "MarcaDoc"').then(function (f) { if (!f.length) window.__fontesFaltando.push("MarcaDoc 400 (Courier Prime da folha)"); }, function () { window.__fontesFaltando.push("MarcaDoc 400 (Courier Prime da folha)"); }),
    document.fonts.load('700 112px "MarcaDoc"').then(function (f) { if (!f.length) window.__fontesFaltando.push("MarcaDoc 700 (Courier Prime do cabeçalho)"); }, function () { window.__fontesFaltando.push("MarcaDoc 700 (Courier Prime do cabeçalho)"); })
  ];
  window.__fotosProntas = Promise.all([R.prontas()].concat(fontesDoc)).then(function () { window.__renderAt(0); return true; });
  window.__renderAt(0);
})();
