    return { op: t < t0 ? 0 : eo(seg(t, t0, 0.12)), dy: 240 * (1 - p), k: lerp(lerp(0.72, 1.03, q1), 1.00, q2), p: p };
  }
  // o objeto e a sombra solta dele (no ar +64 px / 1,05 / 0,35; assentada +12 px / 1,00 / 0,80; só transform e opacity)
  // g = { w, h, hs (a altura da sombra), k (a escala do objeto na cena), cx, cy }; s = o pouso; rot em graus
  function objeto(elG, elS, g, s, rot) {
    var k = g.k || 1, hs = g.hs || g.h;
    var sy = lerp(64, 12, s.p), sk = lerp(1.05, 1.00, s.p), so = lerp(0.35, 0.80, s.p) * s.op;
    por(elS, g.cx, g.cy - s.dy + sy - k * (g.h - hs) / 2, g.w, hs, rot, sk * k * s.k, so);
    por(elG, g.cx, g.cy - s.dy, g.w, g.h, rot, s.k * k, s.op);
  }
  // a fita cola em 300 ms (desce 40 px, encolhe 8 %)
  function fita(el, t, t0, lado) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * -40).toFixed(1) + "px) rotate(" + (lado === "e" ? -5 : 4) + "deg) scale(" + (1 + (1 - p) * 0.08).toFixed(4) + ")";
  }
  // a câmera da mesa: escala s em torno de (ox, oy) + a deriva (dx, dy); o still acompanha a --mesa-satelite-paralaxe (0,6), sobre
  // o mesmo ponto (com a sangria de 56 px); a luz é o véu no fundo de #cam, atrás do objeto que a voz nomeia (luz = {x, y})
  function cameraMesa(s, ox, oy, dx, dy, luz) {
    var camEl = E("cam"), st = E("still");
    if (camEl) {
      camEl.style.transformOrigin = ox.toFixed(1) + "px " + oy.toFixed(1) + "px";
      camEl.style.transform = "scale(" + s.toFixed(5) + ") translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
      if (luz) { camEl.style.setProperty("--luz-x", luz.x.toFixed(1) + "px"); camEl.style.setProperty("--luz-y", luz.y.toFixed(1) + "px"); }
    }
    if (st) {
      var PAR = 0.6, M = 56, ss = 1 + (s - 1) * PAR;
      st.style.transformOrigin = (ox + M).toFixed(1) + "px " + (oy + M).toFixed(1) + "px";
      st.style.transform = "scale(" + ss.toFixed(5) + ") translate(" + (dx * PAR).toFixed(2) + "px," + (dy * PAR).toFixed(2) + "px)";
    }
  }
  // a deriva do RIG (±6 / ±4,8 px), em função do relógio da deriva
  function deriva(td) { return { x: 6 * Math.sin(td * 0.23), y: 4.8 * Math.sin(td * 0.17) }; }
  // ═══ fim dos executores da mesa ═══

  // ═══ A POSE "DE PERTO" (s07 P2 e s08: a mesma mesa, a mesma folha, a mesma câmera; as duas cenas trazem este bloco IGUAL) ═══
  // A folha na medida dela (k 1: o corpo a 86 px na tela), mais larga que o quadro (3620 px: a borda de cima e as fitas ficam fora
  // dele; o rasgo fica à vista embaixo, com a mesa). O centro em (1930, 820), −1,5°: o cabeçalho encosta no alto (y ≥ 170), a régua e
  // a linha X20-X29 vão de x 247 a 3010, o "= 85" do lápis até x 3545, a nota (a) até y 1530, e o rasgo fica acima de y 1820.
  var PERTO = {
    folha: { cx: 1930, cy: 820, k: 1, rot: -1.5 },
    cam: { ox: 1930, oy: 640, s0: 0.985, s1: 1 },   // o empurrão curto da s07 P2 (0,985 → 1,000) em torno do meio da tabela; na s08 a câmera fica em 1
    deriva0: 3.65,                                  // o relógio da deriva de P2 conta do corte da s07 (3,65 s)
    derivaFimS07: 4.30,                             // o relógio da deriva no último quadro da s07 (8,20 − 0,25 − 3,65): a s08 continua dele
    lapis85: { x: 2990, yMeio: 764 },               // o "= 85": à direita da tabela, na altura das dez células (px da folha)
    lapisLeg: { xDir: 3430, y: 1064 }               // a legenda do período (s07): alinhada à direita, na altura da nota (px da folha)
  };
  // o lápis: os dois nós da anotação do canal, dentro do papel (o estilo é o bloco "O LÁPIS DO CANAL")
  function lapisMontar(papel, textos) {
    var o = {};
    if (!papel) return o;
    if (textos.oitenta) {
      o.oitenta = document.createElement("div"); o.oitenta.className = "lapis lapis-85"; o.oitenta.id = "lapis85";
      o.oitenta.setAttribute("data-qc-papel", "rotulo"); o.oitenta.textContent = textos.oitenta;
      o.oitenta.style.left = PERTO.lapis85.x + "px"; o.oitenta.style.top = (PERTO.lapis85.yMeio - 84) + "px";
      papel.appendChild(o.oitenta);
    }
    if (textos.legenda) {
      o.legenda = document.createElement("div"); o.legenda.className = "lapis lapis-leg"; o.legenda.id = "lapisLeg";
      o.legenda.setAttribute("data-qc-papel", "eixo"); o.legenda.textContent = textos.legenda;
      o.legenda.style.right = (FOLHA.G.W - PERTO.lapisLeg.xDir) + "px"; o.legenda.style.top = PERTO.lapisLeg.y + "px";
      papel.appendChild(o.legenda);
    }
    return o;
  }
  // ═══ fim da pose "de perto" ═══

  // ── os tempos (locais, −36,133), do words.json, dos textos de tela e da regência s08 ──
  var T = {
    foto: 0.00,          // a foto pousa em "Spiders" (0,027): a descida começa no corte
    luz: 0.12,           // a luz passa para trás da foto, 120 ms atrás (0,6 s, eb)
    fita: 0.50,          // a fita cola no alto da foto
    credFoto: 0.00,      // [31]: entra em 300 ms, com a foto
    derivaFim: DUR - 0.25
  };

  // ── a folha de perto, como a s07 a deixou ──
  var GF = FOLHA.G, P = PERTO.folha;
  var FO = { w: GF.W, h: GF.H, hs: GF.H - GF.sombra.recuo, k: P.k, cx: P.cx, cy: P.cy };
  var F = FOLHA.montar(E("fol"), E("folSombra"), { cab: TEXTOS.cab, anos: TEXTOS.anos, linhas: [{ rotulo: TEXTOS.rotulo, celulas: TEXTOS.celulas }], nota: TEXTOS.nota });
  var L = lapisMontar(F ? F.papel : null, { oitenta: TEXTOS.oitenta });   // sem a legenda do período: ela é só da s07
  var ASSENTADA = { op: 1, dy: 0, k: 1, p: 1 };
  // ── a foto impressa: o centro, o tamanho com a moldura e a inclinação assentada ──
  var FT = { w: 1228, h: 933, k: 1, cx: 2946, cy: 1258, rot: 1.6 };

  function cena(t) {
    var td = PERTO.derivaFimS07 + Math.min(t, T.derivaFim), d = deriva(td);
    var u = eb(seg(t, T.luz, 0.6));
    cameraMesa(PERTO.cam.s1, PERTO.cam.ox, PERTO.cam.oy, d.x, d.y, { x: lerp(P.cx, FT.cx, u), y: lerp(P.cy, FT.cy, u) });
    objeto(E("fol"), E("folSombra"), FO, ASSENTADA, P.rot);
    if (F) {
      F.fitas.forEach(function (f) { f.style.opacity = "1"; f.style.transform = "rotate(" + (f === F.fitas[0] ? -5 : 4) + "deg)"; });
      F.estado({ cab: 1, regua: 1, linhas: [{ rotulo: 1, celulas: 10 }], nota: 1 });
    }
    if (L.oitenta) { L.oitenta.style.opacity = "1"; L.oitenta.style.clipPath = "none"; L.oitenta.style.transform = "scale(1)"; }
    var pf = pousoFoto(t, T.foto);
    objeto(E("fotoG"), E("fotoSombra"), FT, pf, FT.rot + 0.5 * (1 - pf.p));
    fita(E("fotoFita"), t, T.fita, "d");
    var cf = E("credFoto"); if (cf) cf.style.opacity = eo(seg(t, T.credFoto, 0.3)).toFixed(3);
    var c = E("cred"); if (c) c.style.opacity = "1";
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e); }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  // a prontidão: o still, a foto e as faces da marca (RIG) + a Courier Prime da folha, que o RIG não espera (lição L2)
  var fontesDoc = [
    document.fonts.load('400 86px "MarcaDoc"').then(function (f) { if (!f.length) window.__fontesFaltando.push("MarcaDoc 400 (Courier Prime da folha)"); }, function () { window.__fontesFaltando.push("MarcaDoc 400 (Courier Prime da folha)"); }),
    document.fonts.load('700 112px "MarcaDoc"').then(function (f) { if (!f.length) window.__fontesFaltando.push("MarcaDoc 700 (Courier Prime do cabeçalho)"); }, function () { window.__fontesFaltando.push("MarcaDoc 700 (Courier Prime do cabeçalho)"); })
  ];
  window.__fotosProntas = Promise.all([R.prontas()].concat(fontesDoc)).then(function () { window.__renderAt(0); return true; });
  window.__renderAt(0);
})();
</script>
