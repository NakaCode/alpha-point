/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.

   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();
   Lei: a cena é função pura de t. Nada aqui lê relógio, sorteia ou anda sozinho. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};
    const s = (o.base ?? 1.02) + (o.zoom ?? 0.0024) * t;
    const x = (o.ax ?? 6) * Math.sin(t * 0.23), y = (o.ay ?? 4.8) * Math.sin(t * 0.17);
    el.style.transform = "scale(" + s.toFixed(5) + ") translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
  }
  // Vídeo por f(t): posiciona e espera o "seeked". Na galeria (__PREVIEW) não mexe.
  function seekTo(v, tt) {
    if (!v || window.__PREVIEW || v.readyState < 1) return Promise.resolve();
    const d = v.duration; if (d > 0 && isFinite(d)) tt = clamp(tt, 0, Math.max(0, d - 0.001));
    if (Math.abs(v.currentTime - tt) < 1e-4 && !v.seeking) return Promise.resolve();
    return new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.addEventListener("error", r, { once: true }); v.currentTime = tt; });
  }
  // Grão: ruído de semente fixa por quadro (mulberry32). Mesmo t, mesmo grão.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  function grao(cv, t, o) {
    if (!cv || !cv.getContext) return; o = o || {};
    const ctx = cv.getContext("2d"), w = cv.width, h = cv.height;
    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));
    const img = ctx.createImageData(w, h), d = img.data, a = o.alfa ?? 22;
    for (let i = 0; i < d.length; i += 4) { const v = (sorte() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }
    ctx.putImageData(img, 0, 0);
  }
  // Paleta por vídeo: OBJETO de papéis {acento:"#…"}, montado pelo editor-de-arte. O espelho.paleta é
  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }

  function paleta(p) {

    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));
    }
  }
  // Prontidão: <img>, <image> de SVG e TODAS as faces "Marca"/"MarcaSec". Nunca rejeita: o que falhou
  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();
</script>
<script>
(function () {
  "use strict";
  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo;
  var E = function (id) { return document.getElementById(id); };
  var DUR = 6.5;                                    // espelho.json › s09 › dur, literal
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia final é do redator-de-tela: textos-tela.json › _textos_por_cena s09) ═══
  var TEXTOS = {
    legRoads: "ROADS · AN AVERAGE MONTH OF 2025",   // [33] legenda, 2,267–6,500 (em "average"; _bloco col-roads; numa linha só)
    numRoads: "≈ 106",                              // [34] cota, 2,600–6,500 (depois de "month": a voz não o diz; 1.276 ÷ 12 = 106,3)
    legVenom: "VENOM · 2016–2025",                  // [35] legenda, 4,367–6,500 (em "venom"; _bloco col-venom)
    numVenom: "85",                                 // [36] cota, 4,367–6,500 (o número que a voz já disse em s07)
    cred1: "Alpha Point calculation: ABS, Causes of Death,\nAustralia, 2025 (CC BY 4.0)\n2023 revised · 2024–2025 preliminary"   // [37] credito, 1,900–6,500: 3 linhas (a quebra do redator)
  };
  Object.keys(TEXTOS).forEach(function (k) { var e = E(k); if (e) e.textContent = TEXTOS[k]; });

  // ── os tempos (locais, −38,200), do words.json, dos textos de tela e da regência s09 ──
  var T = {
    corte: 1.900,                                   // "in" (40,100 s): o corte seco do clipe para o DADO (o quadro 57)
    roads: 1.900, roadsDur: 0.70,                   // a coluna ROADS sobe do zero (eo) e chega ao topo em 2,600
    legRoads: 2.267,                                // [33] "average" (2,260)
    numRoads: 2.600,                                // [34] depois de "month" (2,580)
    venom: 4.367, venomDur: 0.40,                   // "venom" (4,355): a coluna, o rótulo [35] e a cota [36], o bloco junto
    cred: 1.900,                                    // [37]: com o primeiro quadro do dado
    repouso: 0.25                                   // o push-in para 250 ms antes do corte
  };

  // ═════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
  // A ESTRADA · O CLIPE (nasce aqui; a s66 P2 usa OUTRO trecho do mesmo arquivo: de 2,6 s em diante está livre).
  //   `ini` = o começo da janela no clipe; t0 e t1 = a janela do plano na cena. currentTime = ini + (t − t0), só dentro do plano.
  //   `ini` aponta o MEIO do quadro 12 do clipe (0,400 s + 1/60): cada t da grade de 30 fps cai no meio de um quadro, nunca na divisa.
  var PLANO = { id: "vA", ini: 0.4 + 1 / 60, t0: 0.0, t1: T.corte };   // os quadros 12 → 68 do clipe (0,400 → 2,267 s), um por quadro de P1
  function plano(P, t) {
    var v = E(P.id); if (!v) return Promise.resolve();
    var dentro = t < P.t1 - 1e-6;
    v.style.visibility = dentro ? "visible" : "hidden";
    var tv = P.ini + clamp(t - P.t0, 0, P.t1 - P.t0);
    if (window.__PREVIEW) {
      if (!dentro) { if (!v.paused) v.pause(); return Promise.resolve(); }
      if (v.readyState >= 1 && Math.abs(v.currentTime - tv) > 0.3) v.currentTime = tv;
      if (v.paused && v.readyState >= 2) { var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); }
      return Promise.resolve();
    }
    return dentro ? R.seekTo(v, tv) : Promise.resolve();   // depois do corte o clipe fica parado, escondido atrás do papel
  }
  // ═══════════════════════════════════════════ fim do CLIPE DA ESTRADA ══════════════════════════════════════════════════

  // ═════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
  // A ESTRADA · A COLUNA ROADS (nasce aqui, na s09; na saída sem o clipe, volta em s66 P2: copie este bloco, o <svg id="graf">, as
  // <div id="legRoads"> e <div id="numRoads"> e o estilo "A COLUNA ROADS"). Tudo o que diz ONDE as colunas ficam está no objeto DADO.
  //   - a escala é UMA para as duas colunas: DADO.pxPorMorte px de altura por morte (a coluna da estrada, 106,33 mortes, tem 1.040 px);
  //   - a coluna c: x de c.cx − c.larg/2 a c.cx + c.larg/2; a base em DADO.base; o topo em DADO.base − c.valor × DADO.pxPorMorte;
  //   - a ROADS fica onde o asfalto do clipe estava (x 2210–2550 na altura da base): no corte, a estrada vira a coluna;
  //   - o rótulo de cada coluna: centrado em c.cx, o topo da caixa em DADO.base + DADO.legVao (84 px);
  //   - a cota de cada coluna: centrada em c.cx, o pé da caixa DADO.numVao px acima do topo da coluna (128 px);
  //   - a linha de base: de DADO.eixo[0] a DADO.eixo[1], logo abaixo das colunas.
  var DADO = {
    base: 1600,                                     // o y da base das colunas
    pxPorMorte: 1040 / (1276 / 12),                 // 9,7806 px por morte: a coluna da estrada com 1.040 px (o topo em y 560)
    eixo: [400, 3300],                              // as pontas da linha de base
    legVao: 46,                                     // da base ao topo da caixa do rótulo
    numVao: 40,                                     // do topo da coluna ao pé da caixa da cota
    numAlt: 141,                                    // a altura da caixa da cota (128 px × 1,1)
    roads: { col: "colRoads", leg: "legRoads", num: "numRoads", cx: 2380, larg: 340, valor: 1276 / 12 },   // 1.276 mortes na estrada em 2025 ÷ 12 = 106,33 por mês (F014)
    venom: { col: "colVenom", leg: "legVenom", num: "numVenom", cx: 960, larg: 340, valor: 85 }            // 85 mortes por animais e plantas venenosos, 2016–2025
  };
  function colAlt(c) { return c.valor * DADO.pxPorMorte; }                 // a altura cheia da coluna, em px
  function colTopo(c) { return DADO.base - colAlt(c); }                    // o y do topo da coluna cheia
  (function dadoMonta() {
    var b = E("eixoBase"); if (b) b.setAttribute("d", "M " + DADO.eixo[0] + " " + (DADO.base + 3) + " L " + DADO.eixo[1] + " " + (DADO.base + 3));
    [DADO.roads, DADO.venom].forEach(function (c) {
      var r = E(c.col), l = E(c.leg), n = E(c.num);
      if (r) { r.setAttribute("x", (c.cx - c.larg / 2).toFixed(2)); r.setAttribute("width", c.larg); r.setAttribute("y", DADO.base); r.setAttribute("height", 0); }
      if (l) { l.style.left = c.cx + "px"; l.style.top = (DADO.base + DADO.legVao) + "px"; }
      if (n) { n.style.left = c.cx + "px"; n.style.top = (colTopo(c) - DADO.numVao - DADO.numAlt).toFixed(2) + "px"; }
    });
  })();
  // o único executor da coluna: g = quanto cresceu (0 → 1); a borda de baixo fica sempre em DADO.base (o contato com o eixo)
  function coluna(c, g) {
    var r = E(c.col); if (!r) return;
    var h = Math.max(0, colAlt(c) * g);
    r.setAttribute("y", (DADO.base - h).toFixed(2));
    r.setAttribute("height", h.toFixed(2));
  }
  // ═══════════════════════════════════════════ fim da COLUNA ROADS ══════════════════════════════════════════════════════

  // o texto: entra em 300 ms (opacidade + 24 px de subida, eo), centrado no `left`; o número, com a escala 1,04 → 1,00 (identidade §4.4)
  function texto(id, t, t0, numero) {
    var el = E(id); if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translate(-50%," + ((1 - p) * 24).toFixed(1) + "px)" + (numero ? " scale(" + (1.04 - 0.04 * p).toFixed(4) + ")" : "");
  }
  function credito(id, t, t0) { var e = E(id); if (e) e.style.opacity = eo(seg(t, t0, 0.3)).toFixed(3); }

  // a câmera do dado (a do RIG: push-in contínuo + deriva senoidal), contada do corte; o push-in para 250 ms antes do fim
  function camera(t) {
    var cam = E("cam"); if (!cam) return;
    var tc = Math.max(0, t - T.corte), tp = Math.min(tc, DUR - T.corte - T.repouso);
    var s = 1 + 0.0024 * tp, x = 6 * Math.sin(tc * 0.23), y = 4.8 * Math.sin(tc * 0.17);
    cam.style.transform = "scale(" + s.toFixed(5) + ") translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
  }

  function cena(t) {
    var tt = t + 0.0005;                             // a folga de ponto flutuante: o quadro 57 (t = 1,9) já é do dado
    var noDado = tt >= T.corte;
    var d = E("papelDado"); if (d) d.style.visibility = noDado ? "visible" : "hidden";
    camera(tt);
    coluna(DADO.roads, eo(seg(tt, T.roads, T.roadsDur)));
    coluna(DADO.venom, eo(seg(tt, T.venom, T.venomDur)));
    texto("legRoads", tt, T.legRoads, false);
    texto("numRoads", tt, T.numRoads, true);
    texto("legVenom", tt, T.venom, false);
    texto("numVenom", tt, T.venom, true);
    credito("cred1", tt, T.cred);
    return plano(PLANO, tt);
  }

  window.__renderAt = function (t) {
    try { return cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; return Promise.resolve(); }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__videoPronto = new Promise(function (r) {
    var v = E(PLANO.id); if (!v) return r();
    if (v.readyState >= 2) return r();
    v.addEventListener("loadeddata", r, { once: true }); v.addEventListener("error", r, { once: true });
  });
  window.__renderAt(0);
})();
</script>
