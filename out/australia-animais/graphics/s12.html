  // Paleta por vídeo: OBJETO de papéis {acento:"#…"}, montado pelo editor-de-arte. O espelho.paleta é
  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }

  function paleta(p) {
    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));

  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();
</script>
<script>
(function () {
  "use strict";
  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo, eb = R.eb;
  var E = function (id) { return document.getElementById(id); };

  var DUR = 17.4;
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia é do redator-de-tela: textos-tela.json › _textos_por_cena s12) ═══
  var TEXTOS = {
    cred1: "John Tann from Sydney, Australia (CC BY 2.0)",       // [40] credito, 6,333–12,700: a cobra
    cred2: "Ian Sutton from Oberon, Australia (CC BY 2.0)",      // [41] credito, 7,133–12,700: a huntsman
    cred3: "Björn Söderlund, Sw3dPix (CC BY-SA 4.0)"             // [42] credito, 8,000–12,700: o losango da placa de Ellis Beach
  };
  Object.keys(TEXTOS).forEach(function (k) { var e = E(k); if (e) e.textContent = TEXTOS[k]; });

  // ═══ A MESA: os executores de "A mão que arruma" (identidade §4.4), um por transformação ═══
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var ein3 = function (p) { return p * p * p; };   // o levantar (a única curva fora do eo e do eb do RIG)
  // põe um elemento de w × h com o CENTRO em (cx, cy), girado (graus) e na escala s
  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  // a chegada da FOLHA: desce `desce` px em `dur` (0,80 s) em eo; ASSENTA 1,03 → 1,00 de 0,56 s ao fim, uma vez, sem voltar
  function pousoFolha(t, t0, dur, desce) {
    var p = eo(seg(t, t0, dur)), q2 = eo(seg(t, t0 + 0.56, dur - 0.56));
    return { op: t >= t0 ? 1 : 0, dy: desce * (1 - p), k: lerp(1.03, 1.00, q2), p: p };
  }
  // a chegada da FOTO impressa: desce 240 px em 0,55 s (eo); a escala 0,72 → 1,03 até 0,33 s e ASSENTA 1,03 → 1,00 até 0,55 s
  function pousoFoto(t, t0) {
    var p = eo(seg(t, t0, 0.55)), q1 = eo(seg(t, t0, 0.33)), q2 = eo(seg(t, t0 + 0.33, 0.22));
    return { op: t < t0 ? 0 : eo(seg(t, t0, 0.12)), dy: 240 * (1 - p), k: lerp(lerp(0.72, 1.03, q1), 1.00, q2), p: p };
  }
  // o objeto e a sombra solta dele (no ar +64 px / 1,05 / 0,35; assentada +12 px / 1,00 / 0,80; só transform e opacity)
  // g = { w, h, hs (a altura da sombra), k (a escala do objeto na cena), cx, cy }; s = o pouso; rot em graus
  function objeto(elG, elS, g, s, rot) {
    var k = g.k || 1, hs = g.hs || g.h;
    var sy = lerp(64, 12, s.p), sk = lerp(1.05, 1.00, s.p), so = lerp(0.35, 0.80, s.p) * s.op;
    por(elS, g.cx, g.cy - s.dy + sy - k * (g.h - hs) / 2, g.w, hs, rot, sk * k * s.k, so);
    por(elG, g.cx, g.cy - s.dy, g.w, g.h, rot, s.k * k, s.op);
  }
  // a fita cola em 300 ms (desce 40 px, encolhe 8 %)
  function fita(el, t, t0, lado) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * -40).toFixed(1) + "px) rotate(" + (lado === "e" ? -5 : 4) + "deg) scale(" + (1 + (1 - p) * 0.08).toFixed(4) + ")";
  }
  // a câmera da mesa: escala s em torno de (ox, oy) + a deriva (dx, dy); o still acompanha a --mesa-satelite-paralaxe (0,6), sobre
  // o mesmo ponto (com a sangria de 56 px); a luz é o véu no fundo de #cam, atrás do objeto que a voz nomeia (luz = {x, y})
  function cameraMesa(s, ox, oy, dx, dy, luz) {
    var camEl = E("cam"), st = E("still");
    if (camEl) {
      camEl.style.transformOrigin = ox.toFixed(1) + "px " + oy.toFixed(1) + "px";
      camEl.style.transform = "scale(" + s.toFixed(5) + ") translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
      if (luz) { camEl.style.setProperty("--luz-x", luz.x.toFixed(1) + "px"); camEl.style.setProperty("--luz-y", luz.y.toFixed(1) + "px"); }
    }
    if (st) {
      var PAR = 0.6, M = 56, ss = 1 + (s - 1) * PAR;
      st.style.transformOrigin = (ox + M).toFixed(1) + "px " + (oy + M).toFixed(1) + "px";
      st.style.transform = "scale(" + ss.toFixed(5) + ") translate(" + (dx * PAR).toFixed(2) + "px," + (dy * PAR).toFixed(2) + "px)";
    }
  }
  // a deriva do RIG (±6 / ±4,8 px), em função do relógio da deriva
  function deriva(td) { return { x: 6 * Math.sin(td * 0.23), y: 4.8 * Math.sin(td * 0.17) }; }
  // ═══ fim dos executores da mesa ═══

  // ── os tempos (locais, −54,700), do words.json, dos textos de tela e da regência s12; os cortes na grade de 30 fps ──
  var T = {
    corte1: 190 / 30,                     // 6,333: P1 → P2, em "snakes," (RG-08); o quadro 190 é o 1º da mesa
    corte2: 381 / 30,                     // 12,700: P2 → P3, em "Before"; o quadro 381 é o 1º do mato
    cartas: [190 / 30 - 0.12, 214 / 30, 240 / 30, 269 / 30, 298 / 30],   // 6,213 · 7,133 · 8,000 · 8,967 · 9,933: o começo do pouso de cada carta
    creds: [190 / 30, 214 / 30, 240 / 30],                               // [40], [41], [42]: os t0 do redator
    camFim: 381 / 30 - 0.25               // a câmera e a deriva da mesa param 250 ms antes do corte
  };

  // ═══ OS PLANOS DE VÍDEO (um lugar só): o <video>, o início da janela no clipe (o MEIO de um quadro: + 1/60), o t0 e o t1 na cena ═══
  var PLANOS = [
    { id: "vPlaca", ini: 12 / 30 + 1 / 60, t0: 0, t1: T.corte1 - 1 / 30 },              // os quadros 12 → 201 do clipe
    { id: "vCroc", ini: 9 / 30 + 1 / 60, t0: T.cartas[3], t1: T.corte2 - 1 / 30 },      // 0,300 → 4,033 s do clipe (os primeiros 9 s: item 79)
    { id: "vTub", ini: 123 / 30 + 1 / 60, t0: T.cartas[4], t1: T.corte2 - 1 / 30 },     // 4,100 → 6,833 s do clipe
    { id: "vMato", ini: 6 / 30 + 1 / 60, t0: T.corte2, t1: DUR }                        // 0,200 → 4,900 s do clipe
  ];
  // o vídeo por t: currentTime = início da janela + t, preso à janela (RIG.seekTo; nunca play() no render); no __PREVIEW toca e se realinha
  function plano(P, t) {
    var v = E(P.id); if (!v) return Promise.resolve();
    var tv = P.ini + clamp(t - P.t0, 0, P.t1 - P.t0);
    if (window.__PREVIEW) {
      if (v.readyState >= 1 && Math.abs(v.currentTime - tv) > 0.3) v.currentTime = tv;
      if (v.paused && v.readyState >= 2) { var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); }
      return Promise.resolve();
    }
    return R.seekTo(v, tv);
  }

  // ═══ AS CARTAS: o tamanho com a moldura, o centro e a inclinação assentada; o lado da fita ═══
  var CARTAS = [
    { id: "c1", w: 1187, h: 688, k: 1, cx: 989, cy: 672, rot: -1.4, fita: "e" },    // a cobra
    { id: "c2", w: 1010, h: 688, k: 1, cx: 2166, cy: 656, rot: 0.9, fita: "d" },    // a huntsman
    { id: "c3", w: 688, h: 688, k: 1, cx: 3102, cy: 676, rot: 1.5, fita: "e" },     // o losango da água-viva
    { id: "c4", w: 1186, h: 688, k: 1, cx: 1262, cy: 1466, rot: 1.1, fita: "d" },   // o crocodilo
    { id: "c5", w: 1186, h: 688, k: 1, cx: 2552, cy: 1456, rot: -1.3, fita: "e" }   // o tubarão
  ];

  function ver(el, on) { if (el) el.style.display = on ? "block" : "none"; }   // display, e não visibility: um filho com visibility própria apareceria com o pai escondido

  function mesa(t) {
    // a câmera da mesa: o empurrão lento (1,000 → 1,018, linear) e a deriva do RIG, contados do corte; param 250 ms antes do corte de saída
    var td = clamp(t, T.corte1, T.camFim) - T.corte1, d = deriva(td), s = 1 + 0.018 * td / (T.camFim - T.corte1);
    // a luz: atrás da carta nova (0,6 s, eb), 120 ms atrás dela; fica na última
    var luz = { x: CARTAS[0].cx, y: CARTAS[0].cy }, i, u;
    for (i = 1; i < CARTAS.length; i++) { u = eb(seg(t, T.cartas[i] + 0.12, 0.6)); luz = { x: lerp(luz.x, CARTAS[i].cx, u), y: lerp(luz.y, CARTAS[i].cy, u) }; }
    cameraMesa(s, 1920, 1080, d.x, d.y, luz);
    CARTAS.forEach(function (c, k) {
      var p = pousoFoto(t, T.cartas[k]);
      objeto(E(c.id), E(c.id + "Sombra"), c, p, c.rot + (c.rot < 0 ? -0.5 : 0.5) * (1 - p.p));
      fita(E(c.id + "Fita"), t, T.cartas[k] + 0.50, c.fita);
    });
    ["cred1", "cred2", "cred3"].forEach(function (id, k) { var c = E(id); if (c) c.style.opacity = eo(seg(t, T.creds[k], 0.3)).toFixed(3); });
  }

  function cena(t) {
    var p1 = t < T.corte1 - 1e-6, p3 = t >= T.corte2 - 1e-6, p2 = !p1 && !p3;
    ver(E("vP1"), p1); ver(E("vMesa"), p2); ver(E("vP3"), p3);
    mesa(t);
    return Promise.all(PLANOS.map(function (P) { return plano(P, t); }));
  }

  window.__renderAt = function (t) {
    try { return cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e); return Promise.resolve(); }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  window.__videoPronto = Promise.all(PLANOS.map(function (P) {
    return new Promise(function (r) {
      var v = E(P.id); if (!v) return r();
      if (v.readyState >= 2) return r();
      v.addEventListener("loadeddata", r, { once: true }); v.addEventListener("error", r, { once: true });

})();
