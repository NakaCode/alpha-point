/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de
   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();
   Lei: a cena é função pura de t. Nada aqui lê relógio, sorteia ou anda sozinho. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};
    const s = (o.base ?? 1.02) + (o.zoom ?? 0.0024) * t;
    const x = (o.ax ?? 6) * Math.sin(t * 0.23), y = (o.ay ?? 4.8) * Math.sin(t * 0.17);
    el.style.transform = "scale(" + s.toFixed(5) + ") translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
  }
  // Vídeo por f(t): posiciona e espera o "seeked". Na galeria (__PREVIEW) não mexe.
  function seekTo(v, tt) {
    if (!v || window.__PREVIEW || v.readyState < 1) return Promise.resolve();
    const d = v.duration; if (d > 0 && isFinite(d)) tt = clamp(tt, 0, Math.max(0, d - 0.001));
    if (Math.abs(v.currentTime - tt) < 1e-4 && !v.seeking) return Promise.resolve();
    return new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.addEventListener("error", r, { once: true }); v.currentTime = tt; });
  }
  // Grão: ruído de semente fixa por quadro (mulberry32). Mesmo t, mesmo grão.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  function grao(cv, t, o) {
    if (!cv || !cv.getContext) return; o = o || {};
    const ctx = cv.getContext("2d"), w = cv.width, h = cv.height;
    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));
    const img = ctx.createImageData(w, h), d = img.data, a = o.alfa ?? 22;
    for (let i = 0; i < d.length; i += 4) { const v = (sorte() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }
    ctx.putImageData(img, 0, 0);
  }
  // Paleta por vídeo: OBJETO de papéis {acento:"#…"}, montado pelo editor-de-arte. O espelho.paleta é
  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }
  function cor(v) { return typeof CSS !== "undefined" && CSS.supports ? CSS.supports("color", v) : /^#[0-9a-f]{3,8}$|^(rgb|hsl)a?\(/i.test(v); }
  function paleta(p) {
    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));
    }
  }
  // Prontidão: <img>, <image> de SVG e TODAS as faces "Marca"/"MarcaSec". Nunca rejeita: o que falhou
  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();

(function () {
  "use strict";
  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo;
  var E = function (id) { return document.getElementById(id); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };

  var DUR = 12.367;
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia é do redator-de-tela: textos-tela.json › _textos_por_cena s14) ═══
  var TEXTOS = {
    legenda: "2016–2025",                 // [48] legenda, 0,800–12,367: o período das fichas
    rotCobras: "VENOMOUS SNAKES",         // [49] rotulo, 5,100–12,367
    numCobras: "35",                      // [50] cota, 5,833–12,367
    rotAbelhas: "BEES & WASPS",           // [51] rotulo, 7,233–12,367
    numAbelhas: "42",                     // [52] cota, 8,633–12,367
    cred: "Source: ABS, Causes of Death, Australia, 2025\nCC BY 4.0 · 2023 revised · 2024–2025 preliminary"   // [53] credito, 0–12,367 (a quebra do redator)
  };
  (function () { var c = E("cred"), l = E("legenda"); if (c) c.textContent = TEXTOS.cred; if (l) { l.textContent = TEXTOS.legenda; l.style.opacity = "0"; } })();

  // ── os tempos (locais, −80,533), do words.json, dos textos de tela e da regência s14 ──
  var T = {
    sobe: 0.00, sobeDur: 1.05,            // as dez pilhas voltam: de pé em "decade" (0,767–1,007)
    legenda: 0.800,                       // [48]
    quebra: 3.100, onda: 0.030,           // "one" (3,172): a 1ª pilha se desfaz em 3,100; cada uma 30 ms depois da vizinha
    chaoSai: 3.100,                       // o chão some em 0,5 s
    cobras: 5.087, passoCobras: 0.011,    // "snakes": 35 fichas, uma a cada 11 ms
    rotCobras: 5.100, numCobras: 5.833,   // [49], [50] ("thirty-five" 5,807)
    abelhas: 7.217, passoAbelhas: 0.023,  // "Bees": 42 fichas, uma a cada 23 ms (a volta pela direita; fecha em "forty-two,")
    rotAbelhas: 7.233, numAbelhas: 8.633, // [51], [52] ("forty-two," 8,607)
    corrida: 0.42,                        // a viagem de cada ficha do campo à casa (cobras) ou à entrada da linha de cima (abelhas)
    mais: 9.437,                          // "more": o salto das 7 que passam
    clipe: 11.087,                        // "come"
    camFim: DUR - 0.25,                   // a câmera e a deriva param 250 ms antes do corte
    cred: 0
  };

  // ── as peças ──
  var C = COLUNAS.montar(E("gColunas"), E("colChao"), null, "");
  var POSES = C ? BARRAS.distribuir(C.fichas) : [];
  var CC = BARRAS.cabecalho(E("gTextos"), "cobras", BARRAS.G.cobras, TEXTOS.rotCobras, TEXTOS.numCobras);
  var CA = BARRAS.cabecalho(E("gTextos"), "abelhas", BARRAS.G.abelhas, TEXTOS.rotAbelhas, TEXTOS.numAbelhas);
  var CL = CLIPE.montar(E("gClipe"), "clipe", CLIPE.faixaDa(BARRAS.G.abelhas));

  // ═══ O TOMBO DAS PILHAS: cada pilha gira no canto de baixo à direita; o ângulo cresce como A (e^(k τ) − 1) (o tombo de uma coluna
  //     em pé: devagar, depois depressa) e, a 16°, a pilha se desfaz. Cada ficha sai com a velocidade que tinha (ω × r) e freia até o
  //     lugar dela no campo (um Hermite cúbico: a velocidade é contínua na saída e zero na chegada). ═══
  var TOMBO = { k: 4.2, dur: 1.125, quebra: 16 };
  var TA = TOMBO.quebra / (Math.exp(TOMBO.k * TOMBO.dur) - 1);                         // A, em graus
  var TW = TA * TOMBO.k * Math.exp(TOMBO.k * TOMBO.dur) * Math.PI / 180;               // ω na quebra, em rad/s
  var VOO = (function () {
    if (!C) return [];
    var sorte = R.mulberry32(77), aB = TOMBO.quebra * Math.PI / 180, co = Math.cos(aB), si = Math.sin(aB);
    return C.fichas.map(function (f) {
      var px = COLUNAS.centro(f.i) + FICHA.lado / 2, py = COLUNAS.G.base;              // o pivô: o canto de baixo à direita da pilha
      var rx = f.x + FICHA.lado / 2 - px, ry = f.y + FICHA.lado / 2 - py;              // do pivô ao centro da ficha, em pé
      var bx = px + rx * co - ry * si, by = py + rx * si + ry * co;                    // o centro na quebra
      return { px: px, py: py, rx: rx, ry: ry, bx: bx, by: by, vx: -TW * (by - py), vy: TW * (bx - px),
        tB: T.quebra + T.onda * f.i, D: 0.75 + 0.35 * sorte() };
    });
  })();

  // ═══ O DESLIZE DO CLIPE (ver o cabeçalho): atrito de Coulomb, desaceleração constante; um executor ═══
  var DESLIZE = (function () {
    var g = 9.81 * 2000, mu = 0.35, a = mu * g, d = 260, v0 = Math.sqrt(2 * a * d);
    return { a: a, d: d, v0: v0, tf: v0 / a };
  })();

  // ═══ A VOLTA DAS ABELHAS: do campo à ENTRADA da linha de cima (180 px depois da ponta da barra), por uma curva (Bézier cúbica)
  //     que passa pela DIREITA da barra das cobras; da entrada, a ficha corre pela linha até a casa. Um parâmetro só para os dois
  //     trechos (eo: sai depressa e freia na casa); o comprimento nominal da curva (L1) só reparte o tempo entre eles. ═══
  var ROTA = { x: BARRAS.fim(BARRAS.G.abelhas) + 180, c1: { x: 3000, y: 1300 }, c2: { x: 3300, y: 600 }, L1: 2400, vel: 7000 };

  function ficha(k, t) {
    var f = C.fichas[k], v = VOO[k], p = POSES[k], cx, cy, rot;
    if (t < v.tB) {                                    // de pé, ou se inclinando
      var tau = t - (v.tB - TOMBO.dur), a = tau <= 0 ? 0 : TA * (Math.exp(TOMBO.k * tau) - 1);
      var ar = a * Math.PI / 180, co = Math.cos(ar), si = Math.sin(ar);
      cx = v.px + v.rx * co - v.ry * si; cy = v.py + v.rx * si + v.ry * co; rot = a;
    } else {                                           // solta: da pilha ao campo
      var u = clamp((t - v.tB) / v.D, 0, 1), u2 = u * u, u3 = u2 * u;
      var h00 = 2 * u3 - 3 * u2 + 1, h10 = u3 - 2 * u2 + u, h01 = 3 * u2 - 2 * u3;
      cx = h00 * v.bx + h10 * v.D * v.vx + h01 * p.cx;
      cy = h00 * v.by + h10 * v.D * v.vy + h01 * p.cy;
      rot = lerp(TOMBO.quebra, p.rot, eo(u));
      if (p.barra) {                                   // do campo à casa na barra
        var cobra = p.barra === "cobras", alvo = BARRAS.centroCasa(BARRAS.G[p.barra], p.m), q;
        if (cobra) {                                   // as cobras: em linha reta, de baixo para a barra
          q = eo(seg(t, T.cobras + p.m * T.passoCobras, T.corrida));
          if (q > 0) { cx = lerp(cx, alvo.x, q); cy = lerp(cy, alvo.y, q); rot = rot * (1 - q); }
        } else {                                       // as abelhas: a volta pela direita e a corrida pela linha de cima
          var d2 = ROTA.x - alvo.x, wl = ROTA.L1 / (ROTA.L1 + d2);
          q = eo(seg(t, T.abelhas + p.m * T.passoAbelhas, T.corrida + d2 / ROTA.vel));
          if (q > 0 && q < wl) {
            var z = q / wl, y = 1 - z, b0 = y * y * y, b1 = 3 * y * y * z, b2 = 3 * y * z * z, b3 = z * z * z;
            cx = b0 * cx + b1 * ROTA.c1.x + b2 * ROTA.c2.x + b3 * ROTA.x;
            cy = b0 * cy + b1 * ROTA.c1.y + b2 * ROTA.c2.y + b3 * alvo.y;
            rot = rot * (1 - z);
          } else if (q >= wl) { cx = lerp(ROTA.x, alvo.x, (q - wl) / (1 - wl)); cy = alvo.y; rot = 0; }
          if (p.m >= BARRAS.G.cobras.n) cy -= 18 * Math.sin(Math.PI * seg(t, T.mais + (p.m - BARRAS.G.cobras.n) * 0.04, 0.42));   // "more": as 7 que passam
        }
      }
    }
    BARRAS.por(f, cx, cy, rot);
  }

  function cena(t) {
    // a câmera: o empurrão lento (1,000 → 1,014, linear) até 250 ms antes do corte, e a deriva do RIG (±6 / ±4,8 px), que congela junto
    var cam = E("cam"), td = Math.min(t, T.camFim);
    if (cam) cam.style.transform = "scale(" + (1 + 0.014 * (td / T.camFim)).toFixed(5) + ") translate(" + (6 * Math.sin(td * 0.23)).toFixed(2) + "px," + (4.8 * Math.sin(td * 0.17)).toFixed(2) + "px)";
    var ch = E("colChao"); if (ch) ch.style.opacity = (1 - eo(seg(t, T.chaoSai, 0.5))).toFixed(3);
    if (C) {
      C.estado({ sobe: seg(t, T.sobe, T.sobeDur), eixo: 0 });
      for (var k = 0; k < C.fichas.length; k++) ficha(k, t);
    }
    BARRAS.entra(E("legenda"), eo(seg(t, T.legenda, 0.3)), false);
    BARRAS.entra(CC.rot, eo(seg(t, T.rotCobras, 0.3)), false);
    BARRAS.entra(CC.num, eo(seg(t, T.numCobras, 0.3)), true);
    BARRAS.entra(CA.rot, eo(seg(t, T.rotAbelhas, 0.3)), false);
    BARRAS.entra(CA.num, eo(seg(t, T.numAbelhas, 0.3)), true);
    if (CL) {
      var r = CLIPE.repouso(BARRAS.G.abelhas), tt = clamp(t - T.clipe, 0, DESLIZE.tf);
      CL.por(r.x, r.y - DESLIZE.d + DESLIZE.v0 * tt - 0.5 * DESLIZE.a * tt * tt, 0, t < T.clipe ? 0 : eo(seg(t, T.clipe, 0.08)));
    }
    var c = E("cred"); if (c) c.style.opacity = eo(seg(t, T.cred, 0.3)).toFixed(3);
  }

  var agora = 0;
  window.__renderAt = function (t) {
    try { agora = clamp(+t || 0, 0, DUR); cena(agora); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e); }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  // a prontidão: as faces da marca (RIG); depois delas, o número de cada barra vai de novo para trás do rótulo MEDIDO (lição L2)
  window.__fotosProntas = R.prontas().then(function () { CC.medir(); CA.medir(); window.__renderAt(agora); return true; });
  window.__s14 = { T: T, POSES: POSES, DESLIZE: DESLIZE, TOMBO: TOMBO };   // para a sonda (não é usado pela cena)
  window.__renderAt(0);
})();
</script>
</body>
</html>
