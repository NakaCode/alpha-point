<script>
/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de
   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();
   Lei: a cena é função pura de t. Nada aqui lê relógio, sorteia ou anda sozinho. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};
    const s = (o.base ?? 1.02) + (o.zoom ?? 0.0024) * t;
    const x = (o.ax ?? 6) * Math.sin(t * 0.23), y = (o.ay ?? 4.8) * Math.sin(t * 0.17);
    el.style.transform = "scale(" + s.toFixed(5) + ") translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
  }
  // Vídeo por f(t): posiciona e espera o "seeked". Na galeria (__PREVIEW) não mexe.
  function seekTo(v, tt) {
    if (!v || window.__PREVIEW || v.readyState < 1) return Promise.resolve();
    const d = v.duration; if (d > 0 && isFinite(d)) tt = clamp(tt, 0, Math.max(0, d - 0.001));
    if (Math.abs(v.currentTime - tt) < 1e-4 && !v.seeking) return Promise.resolve();
    return new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.addEventListener("error", r, { once: true }); v.currentTime = tt; });
  }
  // Grão: ruído de semente fixa por quadro (mulberry32). Mesmo t, mesmo grão.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  function grao(cv, t, o) {
    if (!cv || !cv.getContext) return; o = o || {};
    const ctx = cv.getContext("2d"), w = cv.width, h = cv.height;
    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));
    const img = ctx.createImageData(w, h), d = img.data, a = o.alfa ?? 22;
    for (let i = 0; i < d.length; i += 4) { const v = (sorte() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }
    ctx.putImageData(img, 0, 0);
  }
  // Paleta por vídeo: OBJETO de papéis {acento:"#…"}, montado pelo editor-de-arte. O espelho.paleta é
  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }
  function cor(v) { return typeof CSS !== "undefined" && CSS.supports ? CSS.supports("color", v) : /^#[0-9a-f]{3,8}$|^(rgb|hsl)a?\(/i.test(v); }
  function paleta(p) {
    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));
    }
  }
  // Prontidão: <img>, <image> de SVG e TODAS as faces "Marca"/"MarcaSec". Nunca rejeita: o que falhou
  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();
</script>

/* ═══════════════ PEÇA 1 · A FICHA e AS DEZ COLUNAS — INÍCIO DO BLOCO (copie daqui até "FIM DO BLOCO", sem mudar nada) ═══════════════

   <style>, e usa FICHA (o tamanho e a cor) e COLUNAS (onde cada ficha mora) com o que a sua cena pede.

   A FICHA (conceito-visual.json f554a521… › arco, peça 1): toda MORTE na tela é uma ficha QUADRADA em --tensao, DO MESMO TAMANHO do
     começo ao fim do vídeo, e --tensao não pinta mais nada. O que não é morte (picada, internação, aranha aberta) NÃO é ficha: vai

     · FICHA.lado = 44 px; FICHA.vao = 8 px; FICHA.passo = 52 px (de uma ficha à vizinha, na pilha, na fila e no bloco); os cantos

     · Por que 44: é o tamanho que deixa a s66 caber "na MESMA escala" (o bloco do afogamento com 40 fichas de largura e 26
       fileiras, ao lado dos blocos de 85 e de 202: 60 colunas × 52 px + dois vãos = 3.440 px, a largura útil; 26 × 52 = 1.352 px).
       Com 44 px, a fila de 42 da s14 mede 2.176 px e a de 23 da s44, 1.188 px.
   AS DEZ COLUNAS (cenas.s07, P1): as mortes por contato com animais e plantas venenosos (X20-X29) em cada ano de registro, de
     2016 a 2025: 4, 10, 19, 6, 9, 6, 6, 8, 11, 6 (ABS, Causes of Death, Australia, 2025, Table 1.2, "Persons"; fatos-medidas
     [A-X20-X29]; somam 85). Cada coluna é uma PILHA de fichas, uma ficha por morte, com 1 ficha de largura: a escala é real e se
     conta (0 a 20: a mais alta tem 19), e nenhum valor vai escrito em cima.
     · G.base = 1480 (o pé das pilhas); o CHÃO: um fio de 6 px em --eixo-cor de x 520 a 3320, em y 1493;
     · o meio da coluna i (0 = 2016): COLUNAS.centro(i) = 660 + 280 i (660 … 3180); a ficha j (0 = a de baixo) da coluna i tem o
       canto de cima à esquerda em COLUNAS.pos(i, j) = (centro − 22, 1480 − 44 − 52 j); a pilha de 19 chega a y 500;
     · o EIXO DOS ANOS: UM <text> (o literal do redator, um nó só), com um <tspan> por ano centrado na sua coluna, a linha de base
       em y 1626 (Inter 500, 84 px, --eixo-cor: o papel "eixo" da marca).
   O MOVIMENTO (cada um é um número de 0 a 1 que a CENA dá; a forma da onda mora aqui):
     · sobe: as pilhas se montam da esquerda para a direita, cada uma de baixo para cima, ficha a ficha (cada ficha cai 18 px e
       aparece em 12 % do tempo; sem quique); na s07, 1,25 s a partir do corte;
     · eixo: os dez anos se escrevem da esquerda para a direita (cada um em 15 % do tempo); na s07, de "twenty" a "twenty-five,".
   O HTML (dentro da câmera do dado, sobre --papel):
       <svg id="graf" viewBox="0 0 3840 2160" width="3840" height="2160" xmlns="http://www.w3.org/2000/svg">
         <line id="colChao" class="col-chao"/><g id="gColunas"></g><text id="colEixo" class="col-eixo" data-qc-papel="eixo"></text>
       </svg>
   USO:
     var C = COLUNAS.montar(document.getElementById("gColunas"), document.getElementById("colChao"), document.getElementById("colEixo"),
                            "2016   2017   2018   2019   2020   2021   2022   2023   2024   2025");
     C.estado({ sobe: 1, eixo: 1 });     // o estado completo (a volta em s14)
     C.fichas → [{ el, i, j, x, y }] (as 85, na ordem das colunas: para a cena que as solta, tomba ou junta)
     FICHA.lado, FICHA.passo, COLUNAS.G, COLUNAS.centro(i), COLUNAS.pos(i, j)
   ════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════ */
var FICHA = { lado: 44, vao: 8, passo: 52, raio: 3 };
var COLUNAS = (function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var G = {
    base: 1480,                                        // o pé das pilhas
    cx0: 660, passoX: 280,                             // o meio da 1ª coluna e o passo
    valores: [4, 10, 19, 6, 9, 6, 6, 8, 11, 6],        // X20-X29, "Persons", 2016 … 2025 (somam 85)
    chao: { x0: 520, x1: 3320, y: 1493, traco: 6 },
    eixo: { base: 1626 }
  };
  function centro(i) { return G.cx0 + G.passoX * i; }
  function pos(i, j) { return { x: centro(i) - FICHA.lado / 2, y: G.base - FICHA.lado - FICHA.passo * j }; }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function eo(p) { return 1 - Math.pow(1 - p, 3); }

    if (chao) { chao.setAttribute("x1", G.chao.x0); chao.setAttribute("x2", G.chao.x1); chao.setAttribute("y1", G.chao.y); chao.setAttribute("y2", G.chao.y); chao.setAttribute("stroke-width", G.chao.traco); }
    for (i = 0; i < G.valores.length; i++) for (j = 0; j < G.valores[i]; j++) {

      r.setAttribute("rx", FICHA.raio); r.setAttribute("x", p.x.toFixed(1)); r.setAttribute("y", p.y.toFixed(1)); r.setAttribute("opacity", "0");
      g.appendChild(r); fichas.push({ el: r, i: i, j: j, x: p.x, y: p.y });
    }

      var partes = String(literal || "").trim().split(/(\s+)/), k = 0;
      eixoEl.setAttribute("text-anchor", "middle");
      partes.forEach(function (q) {
        if (!q) return;
        // (os espaços vão num <tspan> próprio, com x: assim não entram na conta da centragem do ano vizinho)
        if (/^\s+$/.test(q)) { var v = document.createElementNS(NS, "tspan"); v.setAttribute("x", centro(k).toFixed(1)); v.setAttribute("y", G.eixo.base); v.textContent = q; eixoEl.appendChild(v); return; }
        var s = document.createElementNS(NS, "tspan"); s.setAttribute("x", centro(k).toFixed(1)); s.setAttribute("y", G.eixo.base);
        s.textContent = q; s.setAttribute("fill-opacity", "0"); eixoEl.appendChild(s); anos.push(s); k++;
      });
    }
    function estado(e) {
      e = e || {};
      var ps = e.sobe == null ? 1 : clamp01(e.sobe), pe = e.eixo == null ? 1 : clamp01(e.eixo);
      fichas.forEach(function (f) {
        var q = eo(clamp01((ps - (0.40 * f.i / 9 + 0.036 * f.j)) / 0.12));
        f.el.setAttribute("opacity", q.toFixed(3));
        f.el.setAttribute("y", (f.y - 18 * (1 - q)).toFixed(1));
      });
      if (eixoEl) {
        eixoEl.style.visibility = pe > 0 ? "visible" : "hidden";
        eixoEl.style.opacity = pe > 0 ? "1" : "0";
        anos.forEach(function (s, k) { s.setAttribute("fill-opacity", eo(clamp01((pe - 0.85 * k / 9) / 0.15)).toFixed(3)); });
      }
    }
    estado({ sobe: 0, eixo: 0 });
    return { estado: estado, fichas: fichas, anos: anos };
  }
  return { G: G, centro: centro, pos: pos, montar: montar };
})();
/* ═══════════════ PEÇA 1 · A FICHA e AS DEZ COLUNAS — FIM DO BLOCO ═══════════════ */

      svg("path", { "class": "gav-traco gav-oculto", d: GAV.d }, dentro)];
    // o fio do móvel (a face dele), com a sombra do traço
    var x0 = GAV.x[lado] - GAV.aba, x1 = GAV.x[lado] + GAV.W + GAV.aba;
    svg("path", { "class": "gav-sombra", d: "M " + (x0 + GAV.sombra.dx) + "," + (GAV.yFio + GAV.sombra.dy) + " H " + (x1 + GAV.sombra.dx) }, raiz);
    svg("path", { "class": "gav-traco", d: "M " + x0 + "," + GAV.yFio + " H " + x1 }, raiz);
    return { raiz: raiz, partes: partes, lado: lado };
  };
  GAV.por = function (G, p, op) {                  // o ÚNICO executor da gaveta: a translação no eixo dela (e a opacidade do conjunto)
    if (!G) return;
    var x = GAV.x[G.lado], y = GAV.y(clamp(p, 0, 1));
    G.partes.forEach(function (e, i) {
      e.setAttribute("transform", "translate(" + (x + (i === 0 ? GAV.sombra.dx : 0)).toFixed(2) + "," + (y + (i === 0 ? GAV.sombra.dy : 0)).toFixed(2) + ")");
    });
    G.raiz.style.opacity = clamp(op, 0, 1).toFixed(3);
  };
  // a etiqueta: duas linhas sob a gaveta, da esquerda; a 1ª com a chave (128 px) e o resto (84 px) na mesma linha de base
  GAV.etiqueta = function (g, id, lado, tx) {
    if (!g) return null;
    var x = GAV.x[lado], y1 = 1232, y2 = 1342;
    var defs = svg("defs", {}, g);
    var r1 = svg("rect", { x: x - 20, y: y1 - 150, width: 0, height: 200 }, svg("clipPath", { id: id + "Rec1" }, defs));
    var r2 = svg("rect", { x: x - 20, y: y2 - 110, width: 0, height: 150 }, svg("clipPath", { id: id + "Rec2" }, defs));
    var l1 = svg("text", { id: id + "L1", "class": "gav-txt", x: x, y: y1, "clip-path": "url(#" + id + "Rec1)" }, g);
    var ch = svg("tspan", { "class": "gav-ch", "data-qc-papel": "rotulo" }, l1); ch.textContent = tx.chave;
    var rs = svg("tspan", { "class": "gav-rs", "data-qc-papel": "eixo" }, l1); rs.textContent = tx.resto;
    var l2 = svg("text", { id: id + "L2", "class": "gav-txt gav-rs", "data-qc-papel": "eixo", x: x, y: y2, "clip-path": "url(#" + id + "Rec2)" }, g);
    l2.textContent = tx.linha2;
    var n1 = (tx.chave + tx.resto).length, n2 = tx.linha2.length;
    // n letras batidas (da etiqueta inteira): o recorte de cada linha anda de letra em letra, pela largura MEDIDA no quadro
    function bate(n) {
      var a = clamp(Math.round(n), 0, n1), b = clamp(Math.round(n) - n1, 0, n2), w1 = 0, w2 = 0;
      try { w1 = a > 0 ? l1.getSubStringLength(0, a) : 0; w2 = b > 0 ? l2.getSubStringLength(0, b) : 0; } catch (e) { w1 = a > 0 ? 4000 : 0; w2 = b > 0 ? 4000 : 0; }
      r1.setAttribute("width", (a > 0 ? w1 + 22 : 0).toFixed(1)); r2.setAttribute("width", (b > 0 ? w2 + 22 : 0).toFixed(1));
      l1.style.visibility = a > 0 ? "visible" : "hidden"; l2.style.visibility = b > 0 ? "visible" : "hidden";
    }
    // a linha vazia e o cursor (b5), sob a etiqueta
    var yL = 1482, linha = svg("path", { "class": "gav-linha", d: "M " + x + "," + yL + " H " + (x + GAV.W) }, g);
    var cursor = svg("rect", { "class": "gav-cursor", x: x, y: yL - 96, width: 44, height: 84 }, g);
    linha.style.opacity = "0"; cursor.style.opacity = "0";
    bate(0);
    return { bate: bate, total: n1 + n2, linha: linha, cursor: cursor, comp: GAV.W };
  };
  // ═══ AS GAVETAS — FIM DO BLOCO ═══

  var GA = GAV.montar(E("gGavetas"), "A"), GB = GAV.montar(E("gGavetas"), "B");
  var outros = svg("text", { id: "outros", "class": "barra-rot", "data-qc-papel": "rotulo", "text-anchor": "middle", x: 1920, y: 460 }, E("gRot"));
  outros.textContent = TEXTOS.outros; outros.style.opacity = "0";
  var EA = GAV.etiqueta(E("gRot"), "x25", "A", TEXTOS.x25), EB = GAV.etiqueta(E("gRot"), "x26", "B", TEXTOS.x26);

  // ═══ AS OITO SOBRAS: do campo de s14 à FILA do centro, e da fila às gavetas ═══
  var FILA = { y: 522, x0: 1920 - (8 * FICHA.passo - FICHA.vao) / 2 + FICHA.lado / 2 };   // o centro da 1ª casa da fila (1738); a fila vai de x 1716 a 2124
  var PARA_A = [0, 1, 2, 5, 6, 7], PARA_B = [3, 4];                                       // as casas da fila que vão a cada gaveta (as duas do meio ficam)
  var SOBRAS = [];                                                                        // { k (em C.fichas), s (0–7, da esquerda), oca }
  if (C) C.fichas.forEach(function (f, k) {
    var p = POSES[k]; if (p.barra) return;
    var oca = svg("rect", { "class": "ficha-oca", x: (f.x + 3).toFixed(1), y: (f.y + 3).toFixed(1), width: FICHA.lado - 6, height: FICHA.lado - 6, rx: 1, opacity: 0 }, E("gOcas"));
    SOBRAS.push({ k: k, s: p.m, oca: oca });
  });
  function letras(t, m) {   // as letras batidas em t, pelos marcos [[t, n], …]
    if (t < m[0][0]) return 0;
    for (var i = 1; i < m.length; i++) if (t < m[i][0]) return lerp(m[i - 1][1], m[i][1], (t - m[i - 1][0]) / (m[i][0] - m[i - 1][0]));
    return m[m.length - 1][1];
  }
  // a descida da fila à gaveta: uma Bézier quadrática que desce primeiro (o ponto de controle logo abaixo da fila) e depois corre
  function descida(a, b, q) { var y = 1 - q, cx = a.x, cy = 730; return { x: y * y * a.x + 2 * y * q * cx + q * q * b.x, y: y * y * a.y + 2 * y * q * cy + q * q * b.y }; }
  function sobra(S, t) {
    var f = C.fichas[S.k], p = POSES[S.k];
    var fila = { x: FILA.x0 + FICHA.passo * S.s, y: FILA.y };
    var q1 = eb(seg(t, T.junta + T.juntaOnda * S.s, T.juntaDur));
    var cx = lerp(p.cx, fila.x, q1), cy = lerp(p.cy, fila.y, q1), rot = p.rot * (1 - q1);
    var iA = PARA_A.indexOf(S.s), iB = PARA_B.indexOf(S.s), q2 = 0, alvo = null;
    if (iA >= 0) { q2 = eo(seg(t, T.seis + T.seisOnda * iA, T.desce)); alvo = GAV.casa("A", iA); }
    else if (iB >= 0) { q2 = eo(seg(t, T.dois + T.doisOnda * iB, T.desce)); alvo = GAV.casa("B", iB); }
    if (q2 > 0 && alvo) { var d = descida(fila, alvo, q2); cx = d.x; cy = d.y; rot = 0; }
    BARRAS.por(f, cx, cy, rot);
    // em "don't" a ficha fica em contorno: o miolo some e o traço aparece, na mesma casa
    var o = eo(seg(t, T.oco, T.ocoDur));
    f.el.setAttribute("opacity", (1 - o).toFixed(3));
    S.oca.setAttribute("opacity", o.toFixed(3));
    S.oca.setAttribute("transform", f.el.getAttribute("transform") || "");
  }

  // ═══ O DADO ═══
  function dado(t) {
    // a câmera: continua a de s14 (1,014; a deriva em td = 12,117) e empurra devagar, parando 250 ms antes de cada corte
    var cam = E("cam"), td = 12.117 + Math.max(0, t - T.recuo);
    var s = 1.014 + 0.008 * seg(t, T.recuo, B.b1 - 0.25 - T.recuo) + 0.003 * seg(t, B.b2, B.b3 - 0.25 - B.b2) + 0.003 * seg(t, B.b5, DUR - 0.25 - B.b5);
    if (cam) cam.style.transform = "scale(" + s.toFixed(5) + ") translate(" + (6 * Math.sin(td * 0.23)).toFixed(2) + "px," + (4.8 * Math.sin(td * 0.17)).toFixed(2) + "px)";

    // as barras de s14 recuam para o alto, com os rótulos (que esmaecem primeiro) e o clipe
    var qr = eb(seg(t, T.recuo, T.recuoDur)), dy = -T.recuoPx * qr, fora = t >= T.recuo + T.recuoDur;
    var gr = E("gRecuo");
    if (gr) { gr.setAttribute("transform", "translate(0," + dy.toFixed(2) + ")"); gr.style.display = fora ? "none" : "block"; }
    var pe = 1 - eo(seg(t, T.recuo, 0.30));
    BARRAS.entra(E("legenda"), pe, false);
    BARRAS.entra(CC.rot, pe, false); BARRAS.entra(CC.num, pe, false);
    BARRAS.entra(CA.rot, pe, false); BARRAS.entra(CA.num, pe, false);
    if (CL) { var rp = CLIPE.repouso(BARRAS.G.abelhas); CL.por(rp.x, rp.y, 0, 1); }
    if (C) for (var k = 0; k < C.fichas.length; k++) {
      var p = POSES[k]; if (!p.barra) continue;
      var a = BARRAS.centroCasa(BARRAS.G[p.barra], p.m);
      BARRAS.por(C.fichas[k], a.x, a.y + dy, 0);
      C.fichas[k].el.setAttribute("opacity", fora ? "0" : "1");
    }
    // as oito sobras
    if (C) SOBRAS.forEach(function (S) { sobra(S, t); });
    // a cota "OTHERS: 8": só em b0
    BARRAS.entra(outros, t < B.b1 ? eo(seg(t, T.outros, 0.3)) : 0, false);
    // as gavetas: o fio do móvel e a frente aparecem; cada uma abre até o batente
    var om = eo(seg(t, T.movel, 0.2));
    GAV.por(GA, eo(seg(t, T.abreA, T.abreDur)), om);
    GAV.por(GB, eo(seg(t, T.abreB, T.abreDur)), om);
    // as etiquetas, batidas na palavra
    if (EA) EA.bate(letras(t, T.x25));
    if (EB) EB.bate(letras(t, T.x26));
    // b5: a linha vazia e o cursor sob cada gaveta
    [EA, EB].forEach(function (e) {
      if (!e) return;
      var ql = eo(seg(t, T.oco, 0.25)), tc = t - T.oco;
      e.linha.style.opacity = t >= T.oco ? "1" : "0";
      e.linha.setAttribute("stroke-dasharray", e.comp + " " + e.comp);
      e.linha.setAttribute("stroke-dashoffset", (e.comp * (1 - ql)).toFixed(1));
      var aceso = tc >= 0 && (t >= DUR - 0.25 || (tc % 0.9) < 0.5);
      e.cursor.style.opacity = aceso ? "1" : "0";
    });
    // os créditos: o do ABS desde 0 (a s14 continua); o da CID com a etiqueta do X25; os dois em b2 e b5
    var c = E("cred"), d = E("credCid");
    if (c) c.style.opacity = "1";
    if (d) d.style.opacity = (t < B.b1 ? eo(seg(t, T.cid, 0.3)) : 1).toFixed(3);
  }

  // ═══ O REGISTRO: os quatro clipes ═══
  // `ini` aponta o MEIO do quadro inicial do clipe (+ 1/60): cada t da grade de 30 fps cai no meio de um quadro, nunca na divisa
  var PLANOS = {
    ants:  { id: "vAnts",  ini: 240 / 30 + 1 / 60, t0: B.b1, t1: B.b2 },          // as formigas: os quadros 240 → 338
    cat:   { id: "vCat",   ini: 405 / 30 + 1 / 60, t0: T.lagarta, t1: B.b2 },     // a lagarta: os quadros 405 → 441
    jelly: { id: "vJelly", ini: 258 / 30 + 1 / 60, t0: B.b3, t1: B.b4 },          // a água-viva: os quadros 258 → 308
    anem:  { id: "vAnem",  ini: 130 / 30 + 1 / 60, t0: B.b4, t1: B.b5 }           // a anêmona: os quadros 130 → 189
  };
  var EPS = 0.001;   // 1 ms: as bordas dos beats são n/30 arredondado ao milésimo (13,867 > 416/30); com 1e-6 o corte caía um quadro depois
  var LADO = { painelB: 1080, vao: 40, antsDx: -452 };   // lado a lado: o quadro da lagarta, o vão e o deslize da tomada das formigas
  function plano(P, t, naTela) {
    var v = E(P.id); if (!v) return Promise.resolve();
    var tv = P.ini + clamp(t - P.t0, 0, Math.max(0, P.t1 - P.t0 - 1 / 30));
    if (window.__PREVIEW) {
      if (!naTela) { if (!v.paused) v.pause(); return Promise.resolve(); }
      if (v.readyState >= 1 && Math.abs(v.currentTime - tv) > 0.3) v.currentTime = tv;
      if (v.paused && v.readyState >= 2) { var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); }
      return Promise.resolve();
    }
    return R.seekTo(v, tv);
  }
  function ver(el, on) { if (el) el.style.display = on ? "block" : "none"; }
  function registro(t) {
    var eB1 = t < B.b2 - EPS, eB3 = !eB1 && t < B.b4 - EPS, eB4 = !eB1 && !eB3;
    ver(E("pA"), eB1); ver(E("pB"), eB1); ver(E("pV"), eB1); ver(E("vJelly"), eB3); ver(E("vAnem"), eB4);
    var lag = eB1 && t >= T.lagarta - EPS;
    if (eB1) {
      // o quadro da lagarta entra pela direita; a tomada das formigas desliza para as duas ficarem inteiras no quadro da esquerda
      var q = eo(seg(t, T.lagarta, T.lagartaDur)), xB = 3840 - LADO.painelB * q;
      var pB = E("pB"), pV = E("pV"), va = E("vAnts");
      if (pB) pB.style.transform = "translateX(" + xB.toFixed(2) + "px)";
      if (pV) pV.style.transform = "translateX(" + (xB - LADO.vao * q).toFixed(2) + "px)";   // o vão nasce com o painel (fora do quadro antes dele)
      if (va) va.style.transform = "translateX(" + (LADO.antsDx * q).toFixed(2) + "px)";
    }
    return Promise.all([plano(PLANOS.ants, t, eB1), plano(PLANOS.cat, t, lag), plano(PLANOS.jelly, t, eB3), plano(PLANOS.anem, t, eB4)]);
  }

  function cena(t) {
    var reg = (t >= B.b1 - EPS && t < B.b2 - EPS) || (t >= B.b3 - EPS && t < B.b5 - EPS);
    ver(E("vDado"), !reg); ver(E("vReg"), reg);
    if (reg) return registro(t);
    dado(t);
    return Promise.resolve();
  }

  var agora = 0;
  window.__renderAt = function (t) {
    try { agora = clamp(+t || 0, 0, DUR); return cena(agora); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e); return Promise.resolve(); }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  // a prontidão: as faces da marca (RIG); depois delas, o número de cada barra vai de novo para trás do rótulo MEDIDO (lição L2)
  window.__fotosProntas = R.prontas().then(function () { CC.medir(); CA.medir(); window.__renderAt(agora); return true; });
  window.__videoPronto = Promise.all(Object.keys(PLANOS).map(function (n) {
    return new Promise(function (r) {
      var v = E(PLANOS[n].id); if (!v) return r();
      if (v.readyState >= 2) return r();
      v.addEventListener("loadeddata", r, { once: true }); v.addEventListener("error", r, { once: true });
    });
  }));
  window.__s15 = { T: T, B: B, GAV: GAV, FILA: FILA, SOBRAS: SOBRAS, POSES: POSES };   // para a sonda (não é usado pela cena)
  window.__renderAt(0);
})();
</script>
