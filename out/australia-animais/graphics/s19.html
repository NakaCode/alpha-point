/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de
   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();
   Lei: a cena é função pura de t. Nada aqui lê relógio, sorteia ou anda sozinho. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.

  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }

    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));

  }

  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }

  function paleta(p) {
    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));
    }
  }

  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });

    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);

})();

  function entradaFala(t, t0) {
    var p = eo(seg(t, t0, 0.30));
    return { op: p, dy: -24 * (1 - p), k: lerp(1.02, 1.00, p), p: 1 };
  }
  // o LEVANTAR (identidade §4.4): 350 ms, 1,00 → 1,04 em p³; a sombra solta cresce; opacidade 1 → 0 nos últimos 200 ms
  function levantar(t, t0) {
    var u = seg(t, t0, 0.35);
    return { k: 1 + 0.04 * u * u * u, op: 1 - seg(t, t0 + 0.15, 0.20), u: u };
  }

  // ═══ BATER À MÁQUINA: a largura de cada prefixo de cada linha, medida com a face da marca (só depois de ela carregar: lição L2) ═══
  var MEDIDA = { f1Fala: null, f2Fala: null };
  function medirFala(id, linhas) {
    if (MEDIDA[id]) return true;
    if (!document.fonts || !document.fonts.check('700 260px "Marca"')) return false;
    var el = E(id); if (!el) return false;
    var px = parseFloat(getComputedStyle(el).fontSize) || 260;
    var cv = document.createElement("canvas").getContext("2d"); if (!cv) return false;
    cv.font = "700 " + px + 'px "Marca"';
    var m = linhas.map(function (ln) {
      var b = [0]; for (var k = 1; k <= ln.length; k++) b.push(cv.measureText(ln.slice(0, k)).width); return b;
    });
    MEDIDA[id] = { b: m, larg: el.offsetWidth, alt: el.offsetHeight };
    return true;
  }
  // quantas letras de uma linha já foram batidas em t (a 1ª no t0 da linha; depois LETRAS_POR_S por segundo)
  function batidas(t, t0, n) { return t < t0 - 1e-6 ? 0 : Math.min(n, Math.floor((t - t0) * LETRAS_POR_S + 1e-6) + 1); }
  function bater(id, linhas, t, tL) {
    var el = E(id); if (!el) return;
    if (t < tL[0] - 1e-6) { el.style.visibility = "hidden"; return; }
    el.style.visibility = "visible";
    if (!MEDIDA[id]) medirFala(id, linhas);
    var M = MEDIDA[id], tam = [], pos = [];
    for (var i = 0; i < linhas.length; i++) {
      var n = batidas(t, tL[i], linhas[i].length), w;
      if (n <= 0) w = 0;
      else if (n >= linhas[i].length) w = (M ? M.larg : el.offsetWidth) + 40;           // a linha inteira: o recorte cobre o nó todo
      else if (M) w = RESP.lado + M.b[i][n] + 3;                                        // até a borda direita da letra n
      else w = el.offsetWidth * n / linhas[i].length;                                   // sem medida (a face ainda não carregou): por fração
      tam.push(w.toFixed(1) + "px " + (LINHA + 26) + "px");
      pos.push("0px " + (i * LINHA) + "px");
    }
    el.style.setProperty("-webkit-mask-size", tam.join(", ")); el.style.setProperty("mask-size", tam.join(", "));
    el.style.setProperty("-webkit-mask-position", pos.join(", ")); el.style.setProperty("mask-position", pos.join(", "));
  }

  // ── a câmera: push-in em dois trechos que param antes de cada fala, mais a deriva do RIG (±6 / ±4,8 px); o still a 0,6 ──
  function escalaCam(t) { return 1 + 0.020 * eb(seg(t, T.cam1, T.cam1Dur)) + 0.010 * eb(seg(t, T.cam2, T.cam2Dur)); }
  function aplicarCamera(t, luz) {
    var camEl = E("cam"), st = E("still");
    var s = escalaCam(t), dx = 6 * Math.sin(t * 0.23), dy = 4.8 * Math.sin(t * 0.17);
    if (camEl) camEl.style.transform = "translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px) scale(" + s.toFixed(5) + ")";
    if (st) st.style.transform = "translate(" + (dx * 0.6).toFixed(2) + "px," + (dy * 0.6).toFixed(2) + "px) scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ")";
    if (camEl && luz) { camEl.style.setProperty("--luz-x", luz.x.toFixed(1) + "px"); camEl.style.setProperty("--luz-y", luz.y.toFixed(1) + "px"); }
  }
  // a luz (chamada com t − 120 ms). O CONSERTO 4 (decisão da Sala, 19/11/2026): no 1º quadro ela repousa em LUZ0, à esquerda e embaixo,
  // e de 0 a LUZ_DUR ANDA até o lugar do cartão (curva suave 3p² − 2p³: o pico a 1,5× a média, ~800 px/s), chegando em 2,12 s, junto
  // com o pouso em "words.": a mesa vazia dos 2 primeiros segundos não fica parada, e o cartão pousa dentro da luz. Só o caminho da luz:
  // nada de texto, peça ou sombra nova. Quando o papel da 1ª fala entra, ela vai a ele (0,6 s, eb) e fica ali
  var LUZ0 = { x: 1000, y: 1380 }, LUZ_DUR = 2.00;
  function suave(p) { return p * p * (3 - 2 * p); }
  function alvoLuz(t) {
    var v = suave(seg(t, 0, LUZ_DUR));
    var x = lerp(LUZ0.x, POSE_CARD.cx, v), y = lerp(LUZ0.y, POSE_CARD.cy, v);
    var u = eb(seg(t, T.f1, 0.6));
    return { x: lerp(x, F1.cx, u), y: lerp(y, F1.cy, u) };
  }

  function cena(t) {
    // b0 · o card
    var a = pousoFolha(t, T.n, POSE_CARD);
    CARD.por({ cx: POSE_CARD.cx, cy: POSE_CARD.cy - a.dy, rot: a.rot, k: a.k, op: a.op, p: a.p,
      nome: eo(seg(t, T.nome, 0.3)), cargo: eo(seg(t, T.cargo, 0.3)),
      fitaE: eo(seg(t, T.nFitaE, 0.3)), fitaD: eo(seg(t, T.nFitaD, 0.3)) });
    // b1 · o papel da 1ª fala: entra, recebe a letra, levanta
    var b = entradaFala(t, T.f1), l = levantar(t, T.f1Sai);
    por(E("f1"), F1.cx, F1.cy - b.dy, F1.w, F1.h, F1.rot, b.k * l.k, b.op * l.op);
    sombra(E("f1Sombra"), F1.w, F1.h, F1.cx, F1.cy - b.dy, F1.rot, b.k * l.k, b.p * (1 - l.u), b.op * l.op);
    bater("f1Fala", FALA1, t, T.f1L);
    // b2 · o papel da 2ª fala
    var c = entradaFala(t, T.f2);
    por(E("f2"), F2.cx, F2.cy - c.dy, F2.w, F2.h, F2.rot, c.k, c.op);
    sombra(E("f2Sombra"), F2.w, F2.h, F2.cx, F2.cy - c.dy, F2.rot, c.k, c.p, c.op);
    bater("f2Fala", FALA2, t, T.f2L);
    // o crédito da fala
    var cr = E("cred"), pc = eo(seg(t, T.cred, 0.3));
    if (cr) { cr.style.opacity = pc.toFixed(3); cr.style.visibility = pc > 0.001 ? "visible" : "hidden"; }
    aplicarCamera(t, alvoLuz(Math.max(0, t - ATRASO_LUZ)));
  }

  function erro(msg) {
    window.__erroCena = msg;
    var el = E("erroCena"); if (el) { el.textContent = "CENA COM ERRO — " + msg; el.hidden = false; }
  }
  // os tamanhos fixos dos papéis de fala (o texto foi medido com a Inter do canal: _tmp/arte-1/EF5/medir.mjs)
  (function () {
    CARD.montar();
    [["f1", F1], ["f2", F2]].forEach(function (x) {
      var g = E(x[0]), p = E(x[0] + "Papel"), s = E(x[0] + "Sombra");
      if (g) { g.style.width = x[1].w + "px"; g.style.height = x[1].h + "px"; }
      if (p) { p.style.width = x[1].w + "px"; p.style.height = x[1].h + "px"; }
      if (s) { s.style.width = x[1].w + "px"; s.style.height = x[1].h + "px"; }
    });
  })();

  var __t = 0;
  window.__renderAt = function (t) {
    try { __t = clamp(+t || 0, 0, DUR); cena(__t); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () {
    // só agora a letra tem a face certa: centra a pílula, mede as falas e confere que cada fala cabe no papel dela (lição L2)
    CARD.ajustar(); medirFala("f1Fala", FALA1); medirFala("f2Fala", FALA2);
    [["f1Fala", F1, FALA1], ["f2Fala", F2, FALA2]].forEach(function (x) {
      var M = MEDIDA[x[0]]; if (!M) { erro("a fala " + x[0] + " não foi medida (a face da marca não carregou)."); return; }
      var maior = Math.max.apply(null, M.b.map(function (b) { return b[b.length - 1]; }));
      if (maior + 2 * (44 + RESP.lado) > x[1].w + 1) erro("a fala " + x[0] + " (" + Math.round(maior) + " px) não cabe no papel de " + x[1].w + " px.");
      if (M.alt > x[1].h - 50 - 34 + 1) erro("a fala " + x[0] + " tem " + M.alt + " px de altura e não cabe no papel de " + x[1].h + " px.");
    });
    window.__renderAt(__t); return true;
  });
  window.__renderAt(0);
})();
</script>
