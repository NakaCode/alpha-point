    var u = clamp((t - F.t0) / (F.t1 - F.t0), 0, 1);
    var k = F.kb[0] + (F.kb[1] - F.kb[0]) * u;
    var s = F.encher * k, w = F.nat[0] * s, h = F.nat[1] * s;
    var cx = PALCO[0] / 2 - F.janela[0] * u, cy = F.cy0 - F.janela[1] * u;      // a janela vai para um lado, a foto para o outro
    var x = cx - w / 2, y = cy - h / 2;
    return { t: t, u: u, kenBurns: k, escala: s, centro: [cx, cy], caixa: [x, y, x + w, y + h] };
  }
  window.__caixaFoto = function (qual, t) { return fotoAt(FOTOS[qual === "B" ? "B" : "A"], clamp(+t || 0, 0, DUR)); };
  function porFoto(F, t) {
    var f = fotoAt(F, t), im = E(F.id);
    if (im) im.style.transform = "translate(" + f.caixa[0].toFixed(3) + "px," + f.caixa[1].toFixed(3) + "px) scale(" + f.escala.toFixed(6) + ")";
  }
  // o crédito: entra em 300 ms (opacidade + 24 px de subida, eo) e fica até o plano dele acabar (sai com a foto, no corte)
  function credito(el, t, t0, t1) {
    if (!el) return;
    var p = (t >= t0 - EPS && t < t1 - EPS) ? eo(seg(t, t0, 0.3)) : 0;
    el.style.opacity = p.toFixed(3);
    el.style.visibility = p > 0.001 ? "visible" : "hidden";
    el.style.transform = "translateY(" + ((1 - p) * 24).toFixed(1) + "px)";
  }

  function cena(t) {
    var segundo = t >= T.corte - EPS;
    var b = E("fotoB"); if (b) b.style.visibility = segundo ? "visible" : "hidden";
    porFoto(FOTOS.A, t); porFoto(FOTOS.B, t);
    credito(E("credA"), t, T.credA, T.corte);
    credito(E("credB"), t, T.credB, DUR + 1);
  }

  function erro(msg) {
    window.__erroCena = msg;
    var el = E("erroCena"); if (el) { el.textContent = "CENA COM ERRO — " + msg; el.hidden = false; }
  }
  var __t = 0;
  window.__renderAt = function (t) {
    try { __t = clamp(+t || 0, 0, DUR); cena(__t); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () {
    var esperas = ["A", "B"].map(function (k) {
      var F = FOTOS[k], im = E(F.id);
      if (!im) { erro("a foto " + k + " não está na cena."); return Promise.resolve(); }
      return (im.decode ? im.decode().catch(function () {}) : Promise.resolve()).then(function () {
        if (!im.naturalWidth) erro("a foto " + im.getAttribute("src") + " não carregou.");
        else if (im.naturalWidth !== F.nat[0] || im.naturalHeight !== F.nat[1])
          erro("a foto " + k + " não tem " + F.nat.join(" × ") + " px (veio " + im.naturalWidth + " × " + im.naturalHeight + "): o enquadramento foi medido nela.");
      });
    });
    return Promise.all(esperas).then(function () { window.__renderAt(__t); return true; });
  });
  window.__renderAt(0);
})();
