(function () {

  // Determinístico: a cena é função de t (nada de Date, Math.random, @keyframes nem flyTo/easeTo: a câmera é jumpTo(cameraAt(t))).
  var E = function (id) { return document.getElementById(id); };
  var cl = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  var eo = function (x) { x = cl(x, 0, 1); return 1 - Math.pow(1 - x, 3); };
  var eio = function (x) { x = cl(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

  var LON = function (x) { return x * 360 - 180; };
  var LAT = function (y) { var n = Math.PI * (1 - 2 * y); return Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))) * 180 / Math.PI; };
  var SZ = function (z) { return TILE * Math.pow(2, z); };

  // ═══ TEMPOS (0 = 182,467 s do master), na cena: 'Australia' 2,093 · 'where' 5,533 · 'been.' 6,413 (acaba 6,713) · 'Go' 7,133 ·
  //   'globe.' 8,196 · 'eighty' 9,863 · 'pull' 13,223 · 'break' 16,263 · 'Gondwana.' 18,308 · 'forty-five' 19,873 · 'moving' 22,593 ·
  //   'opened' 26,673 · 'Follow' 28,213 · 'nothing' 37,563 · 'Asia,' 42,283 · 'something' 42,983 · 'crossing.' 44,488 (acaba 44,953) ═══
  var DUR = 45.4;   // espelho.json › s22 › dur (a mãe do run), literal (roupa §8)
  var T = {
    aus: 2.093, ausPil: 2.100, ausSai: 7.133, where: 5.533, regua: 6.433, voo: [6.80, 1.6], ant: 8.200, antSai: 28.2,
    e8580: 9.867, geoSai: 19.867, pull: 13.223, quebra: 16.263, gond: [18.333, 20.933], f45: 19.900, moving: 22.593,
    opened: 26.673, follow: 28.2, nothing: 37.563, asia: 42.300, something: 42.983, chega: 44.933, apaga45: 33.500

    A1: pose(133.28, -27.5455, 4.74),      // o fim de P1 (P-CONTINENTE-BAIXA ajustada: o item 63)
    SUL: pose(136.0, -55.14, 3.95),        // P-SUL

  };

  var SEGUE = { yCentro: 1110, rampa: 2.0 };         // o seguimento: o centro do viajante em y 1110; a passagem do recuo em 2 s
  var ABRE = 7.37;                                   // a abertura para P-NORTE, de 'nothing' a 44,933

  function lerpCam(a, b, u) { return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u, z: a.z + (b.z - a.z) * u }; }
  // o voo entre duas poses (o do vídeo 7): o zoom pela fração U, o centro pelo ponto fixo do zoom
  function voo(a, b, U) {
    var z = a.z + (b.z - a.z) * U, s;
    if (Math.abs(b.z - a.z) < 1e-6) s = U; else s = (Math.pow(2, -z) - Math.pow(2, -a.z)) / (Math.pow(2, -b.z) - Math.pow(2, -a.z));
    return { x: a.x + (b.x - a.x) * s, y: a.y + (b.y - a.y) * s, z: z };
  }

  // A Antártida fica PARADA onde o satélite a mostra hoje (âncora 802: a camada australia-em-movimento-relativa-antartida, item 27).
  // POLOS: os polos de Euler do arquivo, de 0,5 em 0,5 milhão de anos (placa 801, âncora '802'); a rotação de um tempo qualquer é o
  // slerp entre os dois quatérnios vizinhos (como a GPlates). Cada ponto de HOJE gira pelo quatérnio (regra da mão direita).
  // O desenho: cheio em --neutro a VIAJ.opac, contorno de VIAJ.linha px em --tinta sobre o contorno escuro, sombra solta por baixo
  // (o recorte de papel); ao levantar ('where'), sobe VIAJ.levanta px (8: o topo das ilhas do Estreito de Torres fica em y ≥ 335, abaixo da placa da régua) e a sombra cresce; pousa na descida, encostado no gelo.
  var VIAJ = { opac: 0.85, linha: 6, linhaSob: 12, levanta: 8, sombraBlur: 28, sombraY: 6, sombraYLevantado: 20, sombraOpac: 0.55 };
  var POLOS = null, BASE = null;   // POLOS[k] = quatérnio do tempo k/2; BASE = os anéis de 0 Ma em [lon, lat]
  function vec(lon, lat) { var l = lon * Math.PI / 180, p = lat * Math.PI / 180; return [Math.cos(p) * Math.cos(l), Math.cos(p) * Math.sin(l), Math.sin(p)]; }
  function quat(lon, lat, ang) {
    if (!ang) return [1, 0, 0, 0];
    var k = vec(lon, lat), a = ang * Math.PI / 360, s = Math.sin(a);
    return [Math.cos(a), k[0] * s, k[1] * s, k[2] * s];
  }
  function slerp(q1, q2, u) {
    var d = q1[0] * q2[0] + q1[1] * q2[1] + q1[2] * q2[2] + q1[3] * q2[3], b = q2, r;
    if (d < 0) { b = [-q2[0], -q2[1], -q2[2], -q2[3]]; d = -d; }
    if (d > 0.9995) r = [q1[0] + (b[0] - q1[0]) * u, q1[1] + (b[1] - q1[1]) * u, q1[2] + (b[2] - q1[2]) * u, q1[3] + (b[3] - q1[3]) * u];
    else { var th = Math.acos(d), s = Math.sin(th), f1 = Math.sin((1 - u) * th) / s, f2 = Math.sin(u * th) / s;
      r = [q1[0] * f1 + b[0] * f2, q1[1] * f1 + b[1] * f2, q1[2] * f1 + b[2] * f2, q1[3] * f1 + b[3] * f2]; }
    var n = Math.sqrt(r[0] * r[0] + r[1] * r[1] + r[2] * r[2] + r[3] * r[3]);
    return [r[0] / n, r[1] / n, r[2] / n, r[3] / n];
  }
  function quatAt(ma) {
    var k = cl(ma, 0, 90) * 2, i = Math.floor(k), u = k - i;
    if (i >= POLOS.length - 1) return POLOS[POLOS.length - 1];
    return u < 1e-9 ? POLOS[i] : slerp(POLOS[i], POLOS[i + 1], u);
