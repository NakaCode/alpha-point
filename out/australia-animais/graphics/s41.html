  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};
    const s = (o.base ?? 1.02) + (o.zoom ?? 0.0024) * t;
    const x = (o.ax ?? 6) * Math.sin(t * 0.23), y = (o.ay ?? 4.8) * Math.sin(t * 0.17);
    el.style.transform = "scale(" + s.toFixed(5) + ") translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
  }
  // Vídeo por f(t): posiciona e espera o "seeked". Na galeria (__PREVIEW) não mexe.
  function seekTo(v, tt) {
    if (!v || window.__PREVIEW || v.readyState < 1) return Promise.resolve();
    const d = v.duration; if (d > 0 && isFinite(d)) tt = clamp(tt, 0, Math.max(0, d - 0.001));
    if (Math.abs(v.currentTime - tt) < 1e-4 && !v.seeking) return Promise.resolve();
    return new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.addEventListener("error", r, { once: true }); v.currentTime = tt; });
  }
  // Grão: ruído de semente fixa por quadro (mulberry32). Mesmo t, mesmo grão.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  function grao(cv, t, o) {
    if (!cv || !cv.getContext) return; o = o || {};
    const ctx = cv.getContext("2d"), w = cv.width, h = cv.height;
    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));
    const img = ctx.createImageData(w, h), d = img.data, a = o.alfa ?? 22;
    for (let i = 0; i < d.length; i += 4) { const v = (sorte() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }
    ctx.putImageData(img, 0, 0);
  }
  // Paleta por vídeo: OBJETO de papéis {acento:"#…"}, montado pelo editor-de-arte. O espelho.paleta é
  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }
  function cor(v) { return typeof CSS !== "undefined" && CSS.supports ? CSS.supports("color", v) : /^#[0-9a-f]{3,8}$|^(rgb|hsl)a?\(/i.test(v); }
  function paleta(p) {
    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));
    }
  }
  // Prontidão: <img>, <image> de SVG e TODAS as faces "Marca"/"MarcaSec". Nunca rejeita: o que falhou
  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();

<script>
(function () {
  "use strict";
  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo, eb = R.eb;
  var E = function (id) { return document.getElementById(id); };

  var DUR = 10.0;
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia é do redator-de-tela: textos-tela.json › _textos_por_cena s41) ═══
  var TEXTOS = {
    pil: "BROWN SNAKES",                                         // [197] rotulo, 4,833–6,967: a pílula fora da foto (_bloco brown-s41)
    tagBrown: "BROWN SNAKES",                                    // [198] rotulo, 7,000–10,000: a etiqueta do fio em --contraparte (_bloco brown-s41)
    tagTaipan: "TAIPANS",                                        // [199] rotulo, 7,000–10,000: a etiqueta do fio em --destaque
    credFoto: "Greg Tasney / Wikimedia Commons · CC BY-SA 4.0",  // [200] credito, 0–6,967 (sai com a foto)
    credFonte: "Source: Jackson et al., Toxins, 2016"            // [201] credito, 7,000–10,000
  };
  Object.keys(TEXTOS).forEach(function (k) { var e = E(k); if (e) e.textContent = TEXTOS[k]; });

  // ═══ A MESA: os executores de "A mão que arruma" (identidade §4.4), um por transformação ═══
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var ein3 = function (p) { return p * p * p; };   // o levantar (a única curva fora do eo e do eb do RIG)
  // põe um elemento de w × h com o CENTRO em (cx, cy), girado (graus) e na escala s
  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  // a chegada da FOLHA: desce `desce` px em `dur` (0,80 s) em eo; ASSENTA 1,03 → 1,00 de 0,56 s ao fim, uma vez, sem voltar
  function pousoFolha(t, t0, dur, desce) {
    var p = eo(seg(t, t0, dur)), q2 = eo(seg(t, t0 + 0.56, dur - 0.56));
    return { op: t >= t0 ? 1 : 0, dy: desce * (1 - p), k: lerp(1.03, 1.00, q2), p: p };
  }
  // a chegada da FOTO impressa: desce 240 px em 0,55 s (eo); a escala 0,72 → 1,03 até 0,33 s e ASSENTA 1,03 → 1,00 até 0,55 s
  function pousoFoto(t, t0) {
    var p = eo(seg(t, t0, 0.55)), q1 = eo(seg(t, t0, 0.33)), q2 = eo(seg(t, t0 + 0.33, 0.22));
    return { op: t < t0 ? 0 : eo(seg(t, t0, 0.12)), dy: 240 * (1 - p), k: lerp(lerp(0.72, 1.03, q1), 1.00, q2), p: p };
  }
  // o objeto e a sombra solta dele (no ar +64 px / 1,05 / 0,35; assentada +12 px / 1,00 / 0,80; só transform e opacity)
  // g = { w, h, hs (a altura da sombra), k (a escala do objeto na cena), cx, cy }; s = o pouso; rot em graus
  function objeto(elG, elS, g, s, rot) {
    var k = g.k || 1, hs = g.hs || g.h;
    var sy = lerp(64, 12, s.p), sk = lerp(1.05, 1.00, s.p), so = lerp(0.35, 0.80, s.p) * s.op;
    por(elS, g.cx, g.cy - s.dy + sy - k * (g.h - hs) / 2, g.w, hs, rot, sk * k * s.k, so);
    por(elG, g.cx, g.cy - s.dy, g.w, g.h, rot, s.k * k, s.op);
  }
  // a fita cola em 300 ms (desce 40 px, encolhe 8 %)
  function fita(el, t, t0, lado) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * -40).toFixed(1) + "px) rotate(" + (lado === "e" ? -5 : 4) + "deg) scale(" + (1 + (1 - p) * 0.08).toFixed(4) + ")";
  }
  // a câmera da mesa: escala s em torno de (ox, oy) + a deriva (dx, dy); o still acompanha a --mesa-satelite-paralaxe (0,6), sobre
  // o mesmo ponto (com a sangria de 56 px); a luz é o véu no fundo de #cam, atrás do objeto que a voz nomeia (luz = {x, y})
  function cameraMesa(s, ox, oy, dx, dy, luz) {
    var camEl = E("cam"), st = E("still");
    if (camEl) {
      camEl.style.transformOrigin = ox.toFixed(1) + "px " + oy.toFixed(1) + "px";
      camEl.style.transform = "scale(" + s.toFixed(5) + ") translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
      if (luz) { camEl.style.setProperty("--luz-x", luz.x.toFixed(1) + "px"); camEl.style.setProperty("--luz-y", luz.y.toFixed(1) + "px"); }
    }
    if (st) {
      var PAR = 0.6, M = 56, ss = 1 + (s - 1) * PAR;
      st.style.transformOrigin = (ox + M).toFixed(1) + "px " + (oy + M).toFixed(1) + "px";
      st.style.transform = "scale(" + ss.toFixed(5) + ") translate(" + (dx * PAR).toFixed(2) + "px," + (dy * PAR).toFixed(2) + "px)";
    }
  }
  // a deriva do RIG (±6 / ±4,8 px), em função do relógio da deriva
  function deriva(td) { return { x: 6 * Math.sin(td * 0.23), y: 4.8 * Math.sin(td * 0.17) }; }
  // ═══ fim dos executores da mesa ═══

  // ── os tempos (locais, −458,500), do words.json, dos textos de tela e da regência s41 ──
  var T = {
    pouso: -0.12,                         // a foto começa a pousar 120 ms antes do corte: a mesa nunca aparece vazia
    credFoto: 0,                          // [200]
    empurra: 0, empurraFim: 4.55, freia: 0.6,   // o empurrão 1,00 → 1,05; para 0,26 s antes de "brown" (4,810)
    pil: 4.833,                           // [197] "brown"
    pilSai: 6.667,                        // a pílula sai 300 ms antes de a foto levantar (regência: 465,17 s)
    levanta: 6.967,                       // "taipans": a foto levanta (regência: 465,47 s)
    credFonte: 7.000,                     // [201]
    tags: 7.317,                          // [198], [199]: o t0 do redator é 7,000; entram quando a foto acabou de sair (levanta + 0,35), ver o cabeçalho
    fioA: 7.317, fioB: 7.367, fioDur: 0.46,     // as duas linhas se desenham quando a foto acabou de sair
    conta: 7.850,                         // "toxin"
    neutras: 8.410, neutraPasso: 0.07, neutraDur: 0.42,   // "no"
    camFim: DUR - 0.25                    // a deriva para 250 ms antes do corte
  };

  // ═══ A FOTO IMPRESSA e A CÂMERA (px do palco) ═══
  var FOTO = { w: 2608, h: 1278, k: 1, cx: 1920, cy: 893, rot: -0.8, nat: [2048, 1739] };
  var FOCO = { x: 1202, y: 678 };         // as duas cabeças: o ponto fixo do empurrão
  var CAM = { k: 1.05 };
  var PIL = { x: 616, y: 1600 };
  // 0 → 1 com velocidade constante e freada linear nos últimos `sv` segundos (para sem tranco)
  function rampa(t, t0, t1, sv) {
    var D = t1 - t0, v = 1 / (D - sv / 2), x = clamp(t - t0, 0, D);
    if (x <= D - sv) return v * x;
    var q = x - (D - sv);
    return v * (D - sv) + v * (q - q * q / (2 * sv));
  }
  // o levantar (identidade §4.4): 350 ms, 1,00 → 1,04 em p³; a sombra solta cresce; a opacidade cai nos últimos 200 ms
  function levantar(t, t0) {
    var q = ein3(seg(t, t0, 0.35));
    return { op: 1 - seg(t, t0 + 0.15, 0.2), dy: 0, k: 1 + 0.04 * q, p: 1 - q };
  }

  // ═══ O DESENHO (coordenadas da TELA: o #desCam desfaz o empurrão) ═══
  var DES = { yA: 765, yB: 965,           // os dois fios (o de cima, as marrons; o de baixo, as taipans)
    fioX0: 1500, x1: 3920,                // os fios nascem 50 px depois das etiquetas e saem pela borda direita
    neutras: [1215, 1305, 1395, 1485], neutraX0: -80,   // as quatro neutras, de borda a borda
    tagDir: 1450, meio128: 64 };          // as etiquetas, alinhadas à direita aqui; o meio da letra fica 64 px abaixo do topo da caixa (Inter 128, line-height 1)
  // A CONTA: atrito de Coulomb, desaceleração constante; um executor (ver o cabeçalho)
  var CONTA = (function () {
    var pxmm = 5, g = 9810 * pxmm, mu = 0.25, a = mu * g, xi = 4090, xf = 2670, d = xi - xf, v0 = Math.sqrt(2 * a * d), tf = v0 / a;
    return { y: (DES.yA + DES.yB) / 2, r: 190, xi: xi, xf: xf, a: a, v0: v0, tf: tf,
      x: function (t) { var q = clamp(t - T.conta, 0, tf); return xi - v0 * q + 0.5 * a * q * q; } };
  })();
  (function () {
    var dc = E("desCam");
    if (dc) { dc.style.transformOrigin = FOCO.x + "px " + FOCO.y + "px"; dc.style.transform = "scale(" + (1 / CAM.k).toFixed(6) + ")"; }
    var a = E("tagBrown"), b = E("tagTaipan");
    if (a) { a.style.right = (3840 - DES.tagDir) + "px"; a.style.top = (DES.yA - DES.meio128) + "px"; }
    if (b) { b.style.right = (3840 - DES.tagDir) + "px"; b.style.top = (DES.yB - DES.meio128) + "px"; }
    var c = E("conta"); if (c) c.setAttribute("r", CONTA.r);
    var p = E("pil"); if (p) { p.style.left = PIL.x + "px"; p.style.top = PIL.y + "px"; }
  })();
  // onde a luz fica no desenho: atrás da conta parada (em px da câmera: o empurrão desfeito)
  var LUZ_B = { x: FOCO.x + (CONTA.xf - FOCO.x) / CAM.k, y: FOCO.y + (CONTA.y - FOCO.y) / CAM.k };

  function ver(el, p, dy) {
    if (!el) return;
    el.style.opacity = clamp(p, 0, 1).toFixed(3);
    el.style.visibility = p > 0.001 ? "visible" : "hidden";
    el.style.transform = "translateY(" + (dy || 0).toFixed(1) + "px)";
  }
  function linha(id, x0, y, p) {
    var e = E(id); if (!e) return;
    e.setAttribute("x1", x0); e.setAttribute("y1", y); e.setAttribute("y2", y);
    e.setAttribute("x2", lerp(x0, DES.x1, p).toFixed(1));
    e.style.visibility = p > 0 ? "visible" : "hidden";
  }

  function cena(t) {
    // a câmera da mesa: o empurrão rumo às duas cabeças e a deriva do RIG, que para 250 ms antes do corte
    var d = deriva(Math.min(t, T.camFim));
    var s = 1 + (CAM.k - 1) * rampa(t, T.empurra, T.empurraFim, T.freia);
    // a luz: atrás da foto; quando ela levanta, vai para onde a conta para (0,6 s, eb, 120 ms atrás)
    var uL = eb(seg(t, T.levanta + 0.12, 0.6));
    cameraMesa(s, FOCO.x, FOCO.y, d.x, d.y, { x: lerp(FOTO.cx, LUZ_B.x, uL), y: lerp(FOTO.cy, LUZ_B.y, uL) });

    // a foto: pousa, fica e levanta
    var st = t >= T.levanta ? levantar(t, T.levanta) : pousoFoto(t, T.pouso);
    objeto(E("fotoG"), E("fotoSombra"), FOTO, st, FOTO.rot - 0.5 * (1 - st.p));
    fita(E("fotoFita"), t, T.pouso + 0.50, "e");
    // a pílula: entra em "brown" e sai 300 ms antes do levantar
    var pe = eo(seg(t, T.pil, 0.3)), ps = eo(seg(t, T.pilSai, 0.3));
    ver(E("pil"), pe * (1 - ps), (1 - pe) * 24 + ps * 24);
    // os créditos: o da foto sai com ela; o do dado entra em 7,000
    var cf = E("credFoto"); if (cf) cf.style.opacity = (eo(seg(t, T.credFoto, 0.3)) * (t >= T.levanta ? st.op : 1)).toFixed(3);
    var cd = E("credFonte"); if (cd) cd.style.opacity = eo(seg(t, T.credFonte, 0.3)).toFixed(3);

    // o desenho: as etiquetas (sob a foto até ela sair), os dois fios, a conta e as quatro neutras
    var pt = eo(seg(t, T.tags, 0.3));
    ver(E("tagBrown"), pt, (1 - pt) * 24); ver(E("tagTaipan"), pt, (1 - pt) * 24);
    var pa = eb(seg(t, T.fioA, T.fioDur)), pb = eb(seg(t, T.fioB, T.fioDur));
    linha("fioA", DES.fioX0, DES.yA, pa); linha("fioAo", DES.fioX0, DES.yA, pa);
    linha("fioB", DES.fioX0, DES.yB, pb); linha("fioBo", DES.fioX0, DES.yB, pb);
    for (var i = 0; i < 4; i++) linha("neutra" + i, DES.neutraX0, DES.neutras[i], eb(seg(t, T.neutras + i * T.neutraPasso, T.neutraDur)));
    var c = E("conta"), noAr = t >= T.conta, x = CONTA.x(t), ri = CONTA.r - 3;
    if (c) { c.setAttribute("cx", x.toFixed(2)); c.setAttribute("cy", CONTA.y); c.style.visibility = noAr ? "visible" : "hidden"; }
    var cd2 = E("cDentro"), pf = E("pFora");
    if (cd2) { cd2.setAttribute("cx", (noAr ? x : -999).toFixed(2)); cd2.setAttribute("cy", noAr ? CONTA.y : -999); cd2.setAttribute("r", ri); }
    if (pf) pf.setAttribute("d", "M -400,-400 H 4240 V 2560 H -400 Z" + (noAr ? " M " + (x - ri).toFixed(2) + "," + CONTA.y +
      " a " + ri + "," + ri + " 0 1,0 " + (2 * ri) + ",0 a " + ri + "," + ri + " 0 1,0 " + (-2 * ri) + ",0 Z" : ""));
  }

  function erro(msg) {
    window.__erroCena = msg;
    var el = E("erroCena"); if (el) { el.textContent = "CENA COM ERRO — " + msg; el.hidden = false; }
  }
  var agora = 0;
  window.__renderAt = function (t) {
    try { agora = clamp(+t || 0, 0, DUR); cena(agora); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e); }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () {
    var im = E("foto");
    if (!im || !im.naturalWidth) erro("a foto não carregou.");
    else if (im.naturalWidth !== FOTO.nat[0] || im.naturalHeight !== FOTO.nat[1]) erro("a foto não tem " + FOTO.nat.join(" × ") + " px (veio " + im.naturalWidth + " × " + im.naturalHeight + "): o recorte foi medido nela.");
    window.__renderAt(agora); return true;
  });
  window.__s41 = { T: T, FOTO: FOTO, FOCO: FOCO, DES: DES, CONTA: CONTA };   // para a sonda (não é usado pela cena)
  window.__renderAt(0);
})();
</script>
