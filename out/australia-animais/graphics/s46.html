    enche: 12.777, encheDur: 0.823,        // "found" → "hundred": as 84 casas
    cota: 13.633,                          // [247]
    repouso: DUR - 0.25
  };
  var ONDA = { amp: 2.2, hz: 3.4, tau: 0.20 };   // a superfície: amplitude (unidades do desenho), frequência e decaimento (ilustrativos)
  var CART = { x0: 300, y0: 340, k: 1.18 };
  var CHEIAS = 84;                                // 835 em dez anos = 83,5 por ano (a regência: 84 casas)

  // o frasco na mesa: a base em (880, 1540), a 5,0× (960 px de altura, 440 de largura: x 660 … 1100, y 580 … 1540)
  var FR = { x: 880, yBase: 1540, k: 5.0 };
  // a foto impressa: o centro, o tamanho com a moldura, a inclinação; a cabeça da cobra (45 % × 53 % da foto) em coordenadas da mesa
  var FT = { w: 1928, h: 1105, cx: 2440, cy: 1010, rot: 1.2 };
  var CABECA = { x: FT.cx - FT.w / 2 + 24 + 0.45 * 1880, y: FT.cy - FT.h / 2 + 24 + 0.53 * 1057 };
  var LUZ_FRASCO = { x: FR.x, y: FR.yBase - 480 }, LUZ_FOTO = { x: FT.cx, y: FT.cy };

  // a câmera: b0 abre em torno do frasco (×1,000 → ×1,014); b1 empurra em torno da cabeça (× 1,08, linear), que fica parada na tela
  var CAM = { vx: FR.x, vy: FR.yBase - 480, taxaA: 0.0032, kB: 1.08 };
  function camAt(t) {
    var sA = 1 + CAM.taxaA * Math.min(t, T.empurra);
    var cA = { cx: CAM.vx - (CAM.vx - 1920) / sA, cy: CAM.vy - (CAM.vy - 1080) / sA, s: sA };
    if (t <= T.empurra) return cA;
    var hsx = (CABECA.x - cA.cx) * sA + 1920, hsy = (CABECA.y - cA.cy) * sA + 1080;   // a cabeça na tela no fim de b0
    var s = sA * (1 + (CAM.kB - 1) * seg(t, T.empurra, T.empurraFim - T.empurra));
    return { cx: CABECA.x - (hsx - 1920) / s, cy: CABECA.y - (hsy - 1080) / s, s: s };
  }
  function luz(t) {
    var td = Math.max(0, t - LUZ_ATRASO), p = eb(seg(td, T.luz, T.luzDur)), lz = E("luz");
    if (!lz) return;
    lz.style.setProperty("--luz-x", f2(lerp(LUZ_FRASCO.x, LUZ_FOTO.x, p) + 1200) + "px");
    lz.style.setProperty("--luz-y", f2(lerp(LUZ_FRASCO.y, LUZ_FOTO.y, p) + 1200) + "px");
  }

  var G = {};
  function montar() {
    var sombras = E("sombras"), frascos = E("frascos"), cart = E("cartela");
    if (!sombras || !frascos || !cart) return;
    G.f = frascoMontar(frascos, sombras);
    G.n = frascoNivelMontar(G.f);
    // o traço que se desenha: os três contornos cheios do frasco, na ordem (corpo, tampa, lacre), pelo comprimento de cada um
    G.tracos = [].slice.call(G.f.g.querySelectorAll("path.ar")).filter(function (p) { return p.parentNode === G.f.g; })
      .map(function (p) { return { el: p, len: p.getTotalLength() }; });
    G.finos = [].slice.call(G.f.g.children).filter(function (p) { return p.tagName === "path" && (p.getAttribute("class") === "ar-fina" || p.getAttribute("class") === "ar-oculta"); });
    G.total = G.tracos.reduce(function (a, x) { return a + x.len; }, 0);
    // a cartela: o canto em (300, 340), a 1,18× (a casa a 113 px; o lado, 1281: x 300 … 1581, y 340 … 1621)
    G.cart = cartelaMontar(cart, CART.x0, CART.y0, CART.k);
  }

  function cenaMesa(t) {
    var c = camAt(t), d = deriva(t);
    aplicarCamera(c, d);
    luz(t);
    // o frasco: o traço se desenha (0,95 → 1,75), a sombra entra junto
    var p = seg(t, T.traco, T.tracoDur), feito = p * G.total, acc = 0;
    frascoPor(G.f, FR.x, FR.yBase, FR.k, t >= T.traco ? 1 : 0, 0, 12 / c.s, 0.56 * eo(seg(t, T.traco + T.tracoDur - 0.15, 0.35)));
    for (var i = 0; i < G.tracos.length; i++) {
      var tr = G.tracos[i], parte = clamp((feito - acc) / tr.len, 0, 1), tela = tr.len * FR.k;
      acc += tr.len;
      tr.el.style.strokeDasharray = parte >= 1 ? "none" : (tela * parte).toFixed(1) + " " + (tela * 1.5 + 200).toFixed(1);
      op(tr.el, parte > 0 ? "1" : "0");
    }
    var fim = eo(seg(t, T.traco + T.tracoDur - 0.2, 0.3));
    op(G.finos[0], (0.62 * fim).toFixed(3)); op(G.finos[1], (0.45 * fim).toFixed(3));
    // a cânula: desce, fica, sobe
    var entra = eo(seg(t, T.canula, T.canulaDur)), sai = seg(t, T.canulaSai, T.canulaSaiDur);
    frascoCanula(G.n, 60 * (1 - entra) + 90 * sai * sai, Math.min(entra, 1 - sai));
    // o nível: vazão constante de fluxoOn a fluxoOff, até a metade do volume; a onda enquanto enche e o assentamento depois
    var fr = 0.5 * seg(t, T.fluxoOn, T.fluxoOff - T.fluxoOn), y = frascoYDoVolume(fr);
    var enchendo = t >= T.fluxoOn && t < T.fluxoOff;
    var amp = t < T.fluxoOn ? 0 : ONDA.amp * Math.min(1, (t - T.fluxoOn) / 0.15) *
      (t < T.fluxoOff ? 1 : Math.exp(-(t - T.fluxoOff) / ONDA.tau)) * Math.cos(2 * Math.PI * ONDA.hz * (t - T.fluxoOn));
    if (Math.abs(amp) < 0.02) amp = 0;
    frascoNivel(G.n, y, amp, t >= T.fluxoOn + 0.04 ? 1 : 0);
    frascoFilete(G.n, y, enchendo ? Math.min(1, (t - T.fluxoOn) / 0.05) : 0);
    // a foto impressa: pousa em "The"; a fita 0,5 s depois
    var pf = pousoFoto(t, T.foto);
    objeto(E("fotoG"), E("fotoSombra"), FT, pf, FT.rot + 0.5 * (1 - pf.p));
    fita(E("fotoFita"), t, T.fita);
  }

  function cenaDado(t) {
    var td = Math.min(t, T.repouso) - T.corte, s = 1 + 0.003 * td, d = deriva(t), dc = E("dcam");
    if (dc) dc.style.transform = "scale(" + s.toFixed(5) + ") translate(" + f2(d.x * 0.5) + "px," + f2(d.y * 0.5) + "px)";
    cartelaEstado(G.cart, seg(t, T.grade, T.gradeDur), CHEIAS, seg(t, T.enche, T.encheDur));
    var co = E("cota"), v = eo(seg(t, T.cota, 0.3));
    if (co) { co.style.opacity = v.toFixed(3); co.style.transform = "translateY(" + f2(24 * (1 - v)) + "px)"; }
  }

  function cena(t) {
    if (!G.f) return;
    var naMesa = t < T.corte, cm = E("cenaMesa"), cd = E("cenaDado");
    if (cm) cm.style.visibility = naMesa ? "visible" : "hidden";
    if (cd) cd.style.visibility = naMesa ? "hidden" : "visible";
    if (naMesa) cenaMesa(t); else cenaDado(t);
    var c1 = E("cred1"), c2 = E("cred2");
    if (c1) { c1.style.display = naMesa ? "block" : "none"; c1.style.opacity = eo(seg(t, T.cred1, 0.3)).toFixed(3); }
    if (c2) { c2.style.display = naMesa ? "none" : "block"; c2.style.opacity = eo(seg(t, T.cred2, 0.3)).toFixed(3); }
  }

  try { montar(); } catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e); }
  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e); }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  // só conferência (a prova vem dos quadros)
  window.__s46estado = function (t) {
    t = clamp(+t || 0, 0, DUR);
    var c = camAt(t), fr = 0.5 * seg(t, T.fluxoOn, T.fluxoOff - T.fluxoOn);
    return { camera: { cx: +c.cx.toFixed(2), cy: +c.cy.toFixed(2), s: +c.s.toFixed(5) }, fracao_volume: +fr.toFixed(4),
      nivel_y_local: +frascoYDoVolume(fr).toFixed(2), volume_total: +FRASCO_VOL.total.toFixed(0), y_metade: +frascoYDoVolume(0.5).toFixed(2),
      cheias: CHEIAS, erros: window.__errosRender || 0, ultimo: window.__ultimoErroRender || null };
  };
  window.__renderAt(0);
})();
