/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.

(function () {

  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.

    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;

    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");

  var SVGNS = "http://www.w3.org/2000/svg";
  function op(e, v) { if (e) e.style.opacity = v; }   // style, não atributo: a opacidade da classe no CSS (.ar-fina) venceria o atributo
  function el(tag, attrs, pai) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (pai) pai.appendChild(e);
    return e;
  }

  var DUR = 9.933;
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia é do redator-de-tela: textos-tela.json › _textos_por_cena s47) ═══
  var TEXTOS = {
    r1930: "SINCE 1930",                                   // [249] cota, 3,500–9,933 · o risco 1930 da régua dos soros
    cred1: "Source: Johnston et al., MJA, 2017 (ASP-20)",  // [250] credito, 3,500–9,933 (1.170 px)
    cred2: "Source: healthdirect Australia, 2024"          // [251] credito, 4,567–9,933 (953 px)
  };
  // ══════════════════════════════════════════════════════════════════════════════════════════════════════════
  Object.keys(TEXTOS).forEach(function (k) { var e = E(k); if (e) e.textContent = TEXTOS[k]; });

  var CSSV = getComputedStyle(document.documentElement);
  var PARALAXE = parseFloat(CSSV.getPropertyValue("--mesa-satelite-paralaxe")) || 0.6;
  var MARGEM = parseFloat(CSSV.getPropertyValue("--mesa-satelite-margem")) || 56;
  var LUZ_ATRASO = parseFloat(CSSV.getPropertyValue("--mov-luz-atraso")) || 0.12;

  // ═══ A RÉGUA DOS SOROS (peça 6a; nasce aqui; s52, s57, s58 e s72 copiam este bloco inteiro, de RS até frascoPor) ═══
  var RS = {
    ano0: 1930, anoHoje: 2026,     // a fita: de 1930 a hoje, escala LINEAR
    x0: 720, pxAno: 20,            // x (mundo) do risco 1930; px de mundo por ano
    yTopo: 1180, alt: 140,         // a tira vista de cima: borda de cima e altura (mundo)
    folga: 60,                     // a ponta solta da fita, antes de 1930
    riscoAlem: 30,                 // o risco passa este tanto da borda de baixo
    rotuloAbaixo: 40,              // o ano solto: px de TELA abaixo da ponta do risco projetada
    frascoK: 1.35,                 // a escala do FRASCO_D em pé sobre a tira (259 px de altura)
    rolo: { R0: 110, R1: 64, alma: 26, geratrizes: 4, elipse: 0.35 }   // o rolo: raio cheio, o que sobra em hoje, o tubo de
                                   // papelão, linhas do cilindro, e o achatamento da face da ponta (a vista oblíqua, de cima e da frente)
  };
  function rsX(ano) { return RS.x0 + (ano - RS.ano0) * RS.pxAno; }
  var RS_XINI = RS.x0 - RS.folga, RS_XHOJE = rsX(RS.anoHoje), RS_COMPR = RS_XHOJE - RS_XINI;   // 660, 2640, 1980
  var RS_YBAIXO = RS.yTopo + RS.alt;
  // a espessura do papel (mundo) que faz o rolo cair de R0 a R1 ao deitar a fita inteira (conservação da área do papel)
  var RS_ESP = Math.PI * (RS.rolo.R0 * RS.rolo.R0 - RS.rolo.R1 * RS.rolo.R1) / RS_COMPR;
  function rsRaio(L) { return Math.sqrt(Math.max(0, RS.rolo.R0 * RS.rolo.R0 - RS_ESP * L / Math.PI)); }
  function rsGiro(L) { return (2 * Math.PI / RS_ESP) * (RS.rolo.R0 - rsRaio(L)); }   // θ(L) = ∫ dL / R(L): rolar sem escorregar
  // monta a fita e o rolo (o traço e a sombra solta do rolo); a fita deitada não faz sombra (está colada à mesa)
  function rsMontar(pai, paiSombra) {
    var h = { fita: el("path", { "class": "ar" }, pai), roloSombra: el("path", { "class": "sombra-linha" }, paiSombra),
      roloOculto: el("path", { "class": "ar-oculta" }, pai), rolo: el("path", { "class": "ar" }, pai),
      espiral: el("path", { "class": "ar-fina" }, pai), alma: el("path", { "class": "ar" }, pai), geratrizes: [] };
    for (var i = 0; i < RS.rolo.geratrizes; i++) h.geratrizes.push(el("line", { "class": "ar-fina" }, pai));
    return h;
  }
  function rsElipse(cx, cy, rx, ry, a0, a1, n) {   // arco de elipse por pontos (ângulo 0 = topo da face; cresce no sentido do rolar)
    var d = "";
    for (var i = 0; i <= n; i++) { var a = a0 + (a1 - a0) * i / n; d += (i ? " L" : "M") + f2(cx + rx * Math.sin(a)) + "," + f2(cy - ry * Math.cos(a)); }
    return d;
  }
  // a fita deitada até L (0 … RS_COMPR) e o rolo com o centro sobre a ponta deitada. O rolo em VISTA OBLÍQUA (de cima e da frente):
  // o corpo é o retângulo do cilindro (eixo ao longo de y); a face da ponta da frente (em y = borda de baixo) é uma elipse de
  // achatamento RS.rolo.elipse, com a ESPIRAL do papel (passo = a espessura RS_ESP) e o tubo de papelão (alma); a face de trás só
  // mostra a metade de cima (a de baixo é oculta, tracejada). A espiral e as geratrizes giram com θ(L): rolar sem escorregar, para a
  // direita (o topo anda para a frente). As linhas da fita param na borda do rolo (oclusão: o traço não tem preenchimento).
  function rsFita(h, L, sombraOff) {
    var r = rsRaio(L), xc = RS_XINI + L, xa = xc - r, yT = RS.yTopo, yB = RS_YBAIXO, ry = r * RS.rolo.elipse;
    h.fita.setAttribute("d", xa > RS_XINI + 1
      ? "M" + f2(xa) + "," + yT + " L" + RS_XINI + "," + yT + " L" + RS_XINI + "," + yB + " L" + f2(xa) + "," + yB : "M0,0");
    // o contorno: a metade de cima da face de trás, os dois lados, a face da frente inteira
    var cont = rsElipse(xc, yT, r, ry, -Math.PI / 2, Math.PI / 2, 24) + " L" + f2(xc + r) + "," + yB +
      " M" + f2(xa) + "," + yT + " L" + f2(xa) + "," + yB + " " + rsElipse(xc, yB, r, ry, -Math.PI, Math.PI, 48).replace(/^M/, "M");
    h.rolo.setAttribute("d", cont);
    h.roloOculto.setAttribute("d", rsElipse(xc, yT, r, ry, Math.PI / 2, 3 * Math.PI / 2, 24));
    h.roloSombra.setAttribute("d", "M" + f2(xa) + "," + yT + " L" + f2(xc + r) + "," + yT + " L" + f2(xc + r) + "," + f2(yB + ry) +
      " L" + f2(xa) + "," + f2(yB + ry) + " Z");
    h.roloSombra.setAttribute("transform", "translate(0," + f2(sombraOff) + ")");
    var th = rsGiro(L), alma = RS.rolo.alma;
    // a espiral do papel na face da frente: r(φ) = R − e·φ/2π, do lado de fora até a alma, girada por θ
    var voltas = Math.max(0, (r - alma) / RS_ESP), n = Math.max(2, Math.ceil(voltas * 40)), d = "";
    for (var i = 0; i <= n; i++) {
      var ph = voltas * 2 * Math.PI * i / n, rr = r - RS_ESP * ph / (2 * Math.PI), a = ph + th;
      d += (i ? " L" : "M") + f2(xc + rr * Math.sin(a)) + "," + f2(yB - rr * RS.rolo.elipse * Math.cos(a));
    }
    h.espiral.setAttribute("d", voltas > 0.05 ? d : "M0,0");
    h.alma.setAttribute("d", rsElipse(xc, yB, alma, alma * RS.rolo.elipse, -Math.PI, Math.PI, 28));
    for (var j = 0; j < h.geratrizes.length; j++) {
      var pj = th + j * 2 * Math.PI / h.geratrizes.length, x = xc + r * Math.sin(pj), vis = Math.cos(pj) > 0.15;
      var g = h.geratrizes[j];
      g.setAttribute("x1", f2(x)); g.setAttribute("x2", f2(x));
      g.setAttribute("y1", f2(yT - ry * Math.cos(pj) + 4)); g.setAttribute("y2", f2(yB - ry * Math.cos(pj) - 4));
      op(g, vis ? "1" : "0");
    }
    return { xc: xc, r: r };
  }
  // o risco de um ano: linha vertical que atravessa a tira de cima para baixo, desenhada pela fração p (0 … 1)
  function rsRiscoMontar(pai) { return el("path", { "class": "ar" }, pai); }
  function rsRisco(rk, ano, p) {
    var x = rsX(ano), y1 = RS.yTopo + (RS.alt + RS.riscoAlem) * clamp(p, 0, 1);
    rk.setAttribute("d", p > 0 ? "M" + f2(x) + "," + RS.yTopo + " L" + f2(x) + "," + f2(y1) : "M0,0");
  }
  function rsAncoraRotulo(ano) { return { x: rsX(ano), y: RS_YBAIXO + RS.riscoAlem }; }   // a ponta do risco (mundo)
  // O FRASCO em traço de engenheiro (o desenho do arco; peça 6b nasce em s46, a Sala casa os dois). Origem: o centro da base;
  // y negativo para cima; 192 px de altura, 88 de corpo. A faixa do rótulo fica em branco (item 23); a rolha, oculta, tracejada.
  var FRASCO_D = {
    corpo: "M -24,-160 L -24,-150 C -24,-140 -44,-140 -44,-128 L -44,-12 Q -44,0 -32,0 L 32,0 Q 44,0 44,-12 L 44,-128 " +
           "C 44,-140 24,-140 24,-150 L 24,-160",
    tampa: "M -32,-160 L 32,-160 L 32,-192 L -32,-192 Z",
    lacre: "M -32,-180 L 32,-180",
    faixa: "M -44,-104 L 44,-104 M -44,-40 L 44,-40",
    rolha: "M -18,-160 L -18,-146 L 18,-146 L 18,-160"
  };
  function frascoMontar(pai, paiSombra) {
    var g = el("g", { opacity: "0" }, pai), s = el("g", { opacity: "0" }, paiSombra);
    ["corpo", "tampa", "lacre"].forEach(function (k) { el("path", { d: FRASCO_D[k], "class": "ar" }, g); });
    el("path", { d: FRASCO_D.faixa, "class": "ar-fina" }, g);
    el("path", { d: FRASCO_D.rolha, "class": "ar-oculta" }, g);
    ["corpo", "tampa"].forEach(function (k) { el("path", { d: FRASCO_D[k], "class": "sombra-linha" }, s); });
    return { g: g, s: s };
  }
  // o frasco em pé: base em (x, yBase), escala k, a altura dy acima do pouso (mundo), e a sombra solta (deslocamento e força)
  function frascoPor(f, x, yBase, k, alfa, dy, sombraOff, sombraForca) {
    f.g.setAttribute("transform", "translate(" + f2(x) + "," + f2(yBase + dy) + ") scale(" + k.toFixed(4) + ")");
    op(f.g, alfa.toFixed(3));
    f.s.setAttribute("transform", "translate(" + f2(x) + "," + f2(yBase + dy + sombraOff) + ") scale(" + k.toFixed(4) + ")");
    op(f.s, (alfa * sombraForca).toFixed(3));
  }
  // ═══ fim do bloco A RÉGUA DOS SOROS ═══════════════════════════════════════════════════════════════════════════

  // ═══ a montagem desta cena ═══
  var T = {
    rola: 0.653, rolaDur: 1.70,        // 'medicine:': o rolo desenrola a fita até hoje (para a 2,353 s)
    frasco: 2.578,                      // 'antivenom': o frasco pousa em pé na ponta de 1930
    risco: 3.493, r1930: 3.500,         // 'nineteen': o risco; [249] SINCE 1930
    cred1: 3.500, cred2: 4.567,
    camIni: 4.700, camDur: 2.40,        // a câmera corre a fita até hoje
    luzHoje: 4.908, luzDur: 2.10,       // 'government's': a luz anda até a ponta de hoje
    estante: 7.293, estanteDur: 1.60,   // 'every': a estante
    repouso: DUR - 0.25
  };
  // o rolo: desaceleração constante (valor ilustrativo), parada exata em hoje: d(τ) = v0·τ − a·τ²/2, v0 = 2D/T, a = v0/T
  var V0 = 2 * RS_COMPR / T.rolaDur, DESAC = V0 / T.rolaDur;
  function deitada(t) { var tau = clamp(t - T.rola, 0, T.rolaDur); return Math.min(RS_COMPR, V0 * tau - DESAC * tau * tau / 2); }

  // a câmera: tela = (mundo − C) × s + (1920, 1080)
  var CAM = { p1: { cx: 1415.6, cy: 1200, s: 1.80 }, p1s: 1.84, p2: { cx: 1920, cy: 1170, s: 1.00 }, p3: { cx: 1980, cy: 1160, s: 1.025 } };
  function camAt(t) {
    var fimRun = T.camIni + T.camDur;
    if (t < T.camIni) return { cx: CAM.p1.cx, cy: CAM.p1.cy, s: lerp(CAM.p1.s, CAM.p1s, eb(seg(t, 0, 3.2))) };
    if (t < fimRun) {
      var p = eb(seg(t, T.camIni, T.camDur));
      return { cx: lerp(CAM.p1.cx, CAM.p2.cx, p), cy: lerp(CAM.p1.cy, CAM.p2.cy, p),
        s: Math.exp(lerp(Math.log(CAM.p1s), Math.log(CAM.p2.s), p)) };
    }
    var q = eb(seg(t, fimRun, T.repouso - fimRun));
    return { cx: lerp(CAM.p2.cx, CAM.p3.cx, q), cy: lerp(CAM.p2.cy, CAM.p3.cy, q), s: lerp(CAM.p2.s, CAM.p3.s, q) };
  }
  function proj(x, y, c) { return { x: (x - c.cx) * c.s + 1920, y: (y - c.cy) * c.s + 1080 }; }
  function aplicarCamera(c) {
    var m = "matrix(" + c.s.toFixed(5) + ",0,0," + c.s.toFixed(5) + "," + f2(1920 - c.cx * c.s) + "," + f2(1080 - c.cy * c.s) + ")";
    var mundo = E("mundo"); if (mundo) mundo.setAttribute("transform", m);
    var cam = E("cam"); if (cam) cam.style.transform = m;
    var ss = 1 + (c.s - 1) * PARALAXE;
    var sx = clamp(1920 + (c.cx - 1920) * PARALAXE, 1920 / ss - MARGEM, 3840 + MARGEM - 1920 / ss);
    var sy = clamp(1080 + (c.cy - 1080) * PARALAXE, 1080 / ss - MARGEM, 2160 + MARGEM - 1080 / ss);
    var sw = E("stillwrap");
    if (sw) sw.style.transform = "matrix(" + ss.toFixed(5) + ",0,0," + ss.toFixed(5) + "," + f2(1920 - sx * ss) + "," + f2(1080 - sy * ss) + ")";
  }
  // a LUZ da mesa: atrás da ponta de 1930; com a voz, anda até a ponta de hoje (a estante); 120 ms atrás
  var LUZ_1930 = { x: 820, y: 1160 }, LUZ_HOJE = { x: 3000, y: 1020 };
  function luz(t) {
    var td = Math.max(0, t - LUZ_ATRASO), p = eb(seg(td, T.luzHoje, T.luzDur));
    var lz = E("luz"); if (!lz) return;
    lz.style.setProperty("--luz-x", f2(lerp(LUZ_1930.x, LUZ_HOJE.x, p) + 1200) + "px");
    lz.style.setProperty("--luz-y", f2(lerp(LUZ_1930.y, LUZ_HOJE.y, p) + 1200) + "px");
  }
  // o pouso de um objeto da mesa (identidade §4.4): desce h, 1,03 → 1,00 nos últimos 0,22 s, a sombra de +64/0,35 a +12/0,80
  function pouso(t, t0, desce, durDesce) {
    var a = eo(seg(t, t0, 0.18)), d = eo(seg(t, t0, durDesce)), k = 1.03 - 0.03 * eo(seg(t, t0 + durDesce, 0.22));
    var sAss = eo(seg(t, t0, durDesce + 0.22));
    return { alfa: a, dy: -desce * (1 - d), k: t < t0 ? 1.03 : k, sombraTela: lerp(64, 12, sAss), sombraForca: lerp(0.35, 0.8, sAss) };
  }

  // a ESTANTE: a prateleira se desenha de x 2560 para a direita e sai do quadro; um frasco em cada vão quando a frente passa
  var EST = { x0: 2560, x1: 4800, y: 1010, esp: 24, prim: 2730, passo: 175, n: 13 };
  function estanteFrente(t) { return lerp(EST.x0, EST.x1, eo(seg(t, T.estante, T.estanteDur))); }
  function estanteChega(x) {   // o instante em que a frente passa x + 50 (inverte o eo)
    var r = clamp((x + 50 - EST.x0) / (EST.x1 - EST.x0), 0, 1);
    return T.estante + (1 - Math.cbrt(1 - r)) * T.estanteDur;
  }

  var G = {};
  function montar() {
    var sombras = E("sombras"), regua = E("regua"), frascos = E("frascos"), estante = E("estante");
    if (!sombras || !regua || !frascos || !estante) return;
    G.rs = rsMontar(regua, sombras);
    G.risco1930 = rsRiscoMontar(regua);
    G.f1930 = frascoMontar(frascos, sombras);
    G.prateleiraSombra = el("path", { "class": "sombra-linha" }, sombras);
    G.prateleira = el("path", { "class": "ar" }, estante);
    G.est = [];
    for (var i = 0; i < EST.n; i++) {
      var x = EST.prim + i * EST.passo;
      G.est.push({ x: x, t0: estanteChega(x), f: frascoMontar(estante, sombras) });
    }
  }

  function cena(t) {
    if (!G.rs) return;
    var c = camAt(t);
    aplicarCamera(c);
    luz(t);
    var s = c.s;
    // a fita e o rolo; a sombra do rolo assentada (+12 px na tela)
    rsFita(G.rs, deitada(t), 12 / s);
    // o frasco de 1930 ('antivenom')
    var pf = pouso(t, T.frasco, 60, 0.33);
    frascoPor(G.f1930, rsX(1930), RS.yTopo, pf.k * RS.frascoK, pf.alfa, pf.dy, pf.sombraTela / s, pf.sombraForca * 0.7);
    // o risco 1930 ('nineteen'), de cima para baixo em 0,25 s
    rsRisco(G.risco1930, 1930, eo(seg(t, T.risco, 0.25)));
    // a estante ('every')
    var xf = estanteFrente(t), y0 = EST.y, y1 = EST.y + EST.esp;
    var dPrat = t >= T.estante ? "M" + EST.x0 + "," + y1 + " L" + EST.x0 + "," + y0 + " L" + f2(xf) + "," + y0 +
      " M" + EST.x0 + "," + y1 + " L" + f2(xf) + "," + y1 : "M0,0";
    G.prateleira.setAttribute("d", dPrat);
    G.prateleiraSombra.setAttribute("d", dPrat);
    G.prateleiraSombra.setAttribute("transform", "translate(0," + f2(12 / s) + ")");
    op(G.prateleiraSombra, t >= T.estante ? "0.56" : "0");
    for (var i = 0; i < G.est.length; i++) {
      var e = G.est[i], pe = pouso(t, e.t0, 40, 0.22);
      frascoPor(e.f, e.x, EST.y, pe.k * RS.frascoK, pe.alfa, pe.dy, pe.sombraTela / s, pe.sombraForca * 0.7);
    }
    // SINCE 1930: solto, embaixo da ponta do risco projetada; entra na palavra (300 ms, + 24 px, 1,04 → 1,00)
    var rot = E("r1930");
    if (rot) {
      var a = rsAncoraRotulo(1930), pr = proj(a.x, a.y, c), v = eo(seg(t, T.r1930, 0.3));
      rot.style.opacity = v.toFixed(3);
      rot.style.transform = "translate(" + f2(pr.x) + "px," + f2(pr.y + RS.rotuloAbaixo + 24 * (1 - v)) + "px) translateX(-50%) scale(" +
        (1.04 - 0.04 * v).toFixed(4) + ")";
    }
    var c1 = E("cred1"); if (c1) c1.style.opacity = eo(seg(t, T.cred1, 0.3)).toFixed(3);
    var c2 = E("cred2"); if (c2) c2.style.opacity = eo(seg(t, T.cred2, 0.3)).toFixed(3);
  }

  try { montar(); } catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }
  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  // só conferência (a prova vem dos quadros)
  window.__s47estado = function (t) {
    t = clamp(+t || 0, 0, DUR);
    var c = camAt(t), L = deitada(t);
    return { camera: { cx: +c.cx.toFixed(2), cy: +c.cy.toFixed(2), s: +c.s.toFixed(5) }, deitada: +L.toFixed(1),
      rolo_x: +(RS_XINI + L).toFixed(1), rolo_r: +rsRaio(L).toFixed(2), estante_frente: +estanteFrente(t).toFixed(1),
      x1930: rsX(1930), xHoje: RS_XHOJE, pxAno: RS.pxAno };
  };
  window.__renderAt(0);
})();
</script>
