  // de 2 D; abaixo do piso, a opacidade cai na proporção da área ((d ÷ 3)²), até 35 %. Assim a luz (área × opacidade) de cada ponto

  // A ONDA (s17: "do litoral para dentro"): cada ponto tem w ∈ [0,1] = √(min(km da costa, 800) ÷ 800), calculado contra a costa do
  // australia.json (Natural Earth); as ilhas fora do continente (Lord Howe, Norfolk, Christmas, Cocos) têm w = 0. Com prog ≥ 1 +
  // GENTE.ONDA a onda acabou e todos os pontos estão acesos.
  var GENTE = {

    P_MEDIO: 420,      // as pessoas do SA1 médio

  var CAMADAS = camadasDaCena();
  if (window.__erroCena) return;
  function estilo() {
    var fontes = { base: { type: "raster", tiles: P.base.tiles.map(comChave), tileSize: P.base.tileSize, maxzoom: P.base.maxzoom } };
