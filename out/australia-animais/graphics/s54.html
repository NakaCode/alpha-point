<script>
/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de
   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();
   Lei: a cena é função pura de t. Nada aqui lê relógio, sorteia ou anda sozinho. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};
    const s = (o.base ?? 1.02) + (o.zoom ?? 0.0024) * t;
    const x = (o.ax ?? 6) * Math.sin(t * 0.23), y = (o.ay ?? 4.8) * Math.sin(t * 0.17);
    el.style.transform = "scale(" + s.toFixed(5) + ") translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
  }
  // Vídeo por f(t): posiciona e espera o "seeked". Na galeria (__PREVIEW) não mexe.
  function seekTo(v, tt) {
    if (!v || window.__PREVIEW || v.readyState < 1) return Promise.resolve();
    const d = v.duration; if (d > 0 && isFinite(d)) tt = clamp(tt, 0, Math.max(0, d - 0.001));
    if (Math.abs(v.currentTime - tt) < 1e-4 && !v.seeking) return Promise.resolve();
    return new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.addEventListener("error", r, { once: true }); v.currentTime = tt; });
  }
  // Grão: ruído de semente fixa por quadro (mulberry32). Mesmo t, mesmo grão.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  function grao(cv, t, o) {
    if (!cv || !cv.getContext) return; o = o || {};
    const ctx = cv.getContext("2d"), w = cv.width, h = cv.height;
    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));
    const img = ctx.createImageData(w, h), d = img.data, a = o.alfa ?? 22;
    for (let i = 0; i < d.length; i += 4) { const v = (sorte() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }

  }
  // Paleta por vídeo: OBJETO de papéis {acento:"#…"}, montado pelo editor-de-arte. O espelho.paleta é
  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }

  function paleta(p) {
    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));

  }
  // Prontidão: <img>, <image> de SVG e TODAS as faces "Marca"/"MarcaSec". Nunca rejeita: o que falhou
  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();
</script>
<script>
(function () {
  "use strict";
  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo, eb = R.eb;
  var E = function (id) { return document.getElementById(id); };
  var f2 = function (v) { return (+v).toFixed(2); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  function at(el, k, v) { if (el) el.setAttribute(k, v); }

  var DUR = 11.4;
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia é do redator-de-tela: textos-tela.json › _textos_por_cena s54) ═══
  // [282] eixo "TODAY" 0–11,4 e [283] cota "85–80 MILLION YEARS AGO" 0–11,4 (apagada, acende em 'Antarctica,') e [284] cota
  // "150–200 MILLION YEARS AGO" 3,3–11,4 estão escritos no HTML (a chave e o resto em <span>, com o espaço entre eles);
  var TEXTOS = {
    cred: "Source: Herzig et al., PNAS, 2020;\nGeoscience Australia, 2011"   // [285] credito, 0–11,4 (a quebra do redator; 899 e 708 px)
  };
  // ══════════════════════════════════════════════════════════════════════════════════════════════════════════
  var ec = E("cred"); if (ec) ec.textContent = TEXTOS.cred;

  var CSSV = getComputedStyle(document.documentElement);
  var TINTA = CSSV.getPropertyValue("--tinta").trim();
  var PARALAXE = parseFloat(CSSV.getPropertyValue("--mesa-satelite-paralaxe")) || 0.6;
  var MARGEM = parseFloat(CSSV.getPropertyValue("--mesa-satelite-margem")) || 56;
  var LUZ_ATRASO = parseFloat(CSSV.getPropertyValue("--mov-luz-atraso")) || 0.12;

  var T = {
    regua: 0.003,                  // 'Funnel-web': a régua volta inteira (0,3 s)
    goes: 2.673, comprime: 0.6,    // 'goes': maMax 85 → 200 (eb)
    estica: 2.80, esticaDur: 0.55, // a linha se estica para a esquerda (eo)
    back: 2.953, voltaDur: 0.9,    // 'back': o cursor volta até 175 milhões de anos
    one: 3.273, l150: 3.300,       // 'one': o trecho 150–200; [284] em 3,300 (o t0 do redator)
    ant: 8.073,                    // 'Antarctica,': 85–80 acende e o viajante pousa
    prim: 10.328, primDur: 0.75,   // 'primates.': o cursor corre até TODAY
    repouso: DUR - 0.25
  };

  // ═══ PEÇA 4 · A RÉGUA DO TEMPO (os números da s22; aqui maMax anda) ═══
  var PLACA = { x: 400, y: 945, w: 3040, h: 160 };
  var REGUA = { x0: 60, x1: 2980, maMax: 85, maMaxFim: 200, linhaOpac: 0.45, apagado: 0.5, cursorMeio: 175 };
  function maMax(t) { return lerp(REGUA.maMax, REGUA.maMaxFim, eb(seg(t, T.goes, T.comprime))); }
  function xR(ma, mm) { return REGUA.x1 - (REGUA.x1 - REGUA.x0) * clamp(ma, 0, mm) / mm; }
  function linhaEsq(t) { return xR(Math.min(maMax(t), REGUA.maMax + (REGUA.maMaxFim - REGUA.maMax) * eo(seg(t, T.estica, T.esticaDur))), maMax(t)); }
  function idadeCursor(t) {
    var a = REGUA.cursorMeio * eb(seg(t, T.back, T.voltaDur));
    return a * (1 - eb(seg(t, T.prim, T.primDur)));
  }
  function prepararRegua() {
    ["rLinha", "r150", "rTrecho", "rHoje", "rCursor"].forEach(function (id) { at(E(id), "stroke", TINTA || "currentColor"); });
    at(E("rLinha"), "stroke-opacity", REGUA.linhaOpac);
    at(E("rHoje"), "x1", REGUA.x1); at(E("rHoje"), "x2", REGUA.x1);
    var l1 = E("l150"); if (l1) l1.style.left = REGUA.x0 + "px";   // a ponta de 200 (a escala final)
  }
  function aplicarRegua(t) {
    var mm = maMax(t), v = eo(seg(t, T.regua, 0.3)), rg = E("regua");
    if (rg) { rg.style.opacity = v.toFixed(3); rg.style.visibility = v > 0.001 ? "visible" : "hidden"; }
    at(E("rLinha"), "x1", f2(linhaEsq(t))); at(E("rLinha"), "x2", REGUA.x1);
    // 85–80: apagado a 50 % desde a volta; acende em 'Antarctica,'
    var a85 = REGUA.apagado + (1 - REGUA.apagado) * eo(seg(t, T.ant, 0.3));
    at(E("rTrecho"), "x1", f2(xR(85, mm))); at(E("rTrecho"), "x2", f2(xR(80, mm))); at(E("rTrecho"), "opacity", a85.toFixed(3));
    var l8 = E("l8580"); if (l8) { l8.style.left = f2(xR(85, mm)) + "px"; l8.style.opacity = a85.toFixed(3); }
    // 150–200: o trecho cresce de 200 para 150 em 'one'; a cota entra em 3,300 (300 ms, + 24 px)
    var p150 = eo(seg(t, T.one, 0.3));
    at(E("r150"), "x1", f2(xR(200, mm))); at(E("r150"), "x2", f2(lerp(xR(200, mm), xR(150, mm), p150))); at(E("r150"), "opacity", p150 > 0 ? "1" : "0");
    var l1 = E("l150"), v1 = eo(seg(t, T.l150, 0.3));
    if (l1) { l1.style.opacity = v1.toFixed(3); l1.style.transform = "translateY(" + f2(24 * (1 - v1)) + "px)"; }
    var xc = f2(xR(idadeCursor(t), mm)); at(E("rCursor"), "x1", xc); at(E("rCursor"), "x2", xc);
  }
  // ═════════════════════════════════════════════════════════════════════════════════════════════════════════

  // O VIAJANTE PEQUENINO: o centro sob o trecho 85–80 na escala final; o topo 46 px abaixo da placa; o pouso da mesa
  var VIAJ = { w: 240, h: 225, topo: PLACA.y + PLACA.h + 46 };
  VIAJ.cx = PLACA.x + (xR(85, REGUA.maMaxFim) + xR(80, REGUA.maMaxFim)) / 2;   // 2.175,5
  function pousoViaj(t) {   // desce 40 px em 0,33 s; 1,03 → 1,00 nos últimos 0,22 s; a sombra de +64/0,35 a +12/0,80
    var a = eo(seg(t, T.ant, 0.18)), d = eo(seg(t, T.ant, 0.33)), k = 1.03 - 0.03 * eo(seg(t, T.ant + 0.33, 0.22));
    var sAss = eo(seg(t, T.ant, 0.55));
    return { alfa: a, dy: -40 * (1 - d), k: k, sy: lerp(64, 12, sAss), sf: lerp(0.35, 0.8, sAss) };
  }
  function aplicarViaj(t) {
    var p = pousoViaj(t), x = VIAJ.cx - VIAJ.w / 2, y = VIAJ.topo + p.dy;
    var v = E("viaj"), s = E("viajSombra");
    if (v) { v.style.opacity = p.alfa.toFixed(3); v.style.transform = "translate(" + f2(x) + "px," + f2(y) + "px) scale(" + p.k.toFixed(4) + ")"; }
    if (s) { s.style.opacity = (p.alfa * p.sf * 0.7).toFixed(3); s.style.transform = "translate(" + f2(x) + "px," + f2(VIAJ.topo + p.sy) + "px) scale(" + p.k.toFixed(4) + ")"; }
  }

  // a câmera DA MESA (só a mesa anda): tela = (mundo − 1920/1080) × s + (1920, 1080) + deriva
  function camAt(t) {
    var td = Math.min(t, T.repouso);
    return { s: 1 + 0.0024 * td, dx: 6 * Math.sin(td * 0.23), dy: 4.8 * Math.sin(td * 0.17) };
  }
  function aplicarCamera(c) {
    var ox = 1920 - 1920 * c.s + c.dx, oy = 1080 - 1080 * c.s + c.dy;
    var cam = E("cam"); if (cam) cam.style.transform = "matrix(" + c.s.toFixed(5) + ",0,0," + c.s.toFixed(5) + "," + f2(ox) + "," + f2(oy) + ")";
    var ss = 1 + (c.s - 1) * PARALAXE;
    var vx = 1920 - c.dx / c.s, vy = 1080 - c.dy / c.s;
    var sx = clamp(1920 + (vx - 1920) * PARALAXE, 1920 / ss - MARGEM, 3840 + MARGEM - 1920 / ss);
    var sy = clamp(1080 + (vy - 1080) * PARALAXE, 1080 / ss - MARGEM, 2160 + MARGEM - 1080 / ss);
    var sw = E("stillwrap");
    if (sw) sw.style.transform = "matrix(" + ss.toFixed(5) + ",0,0," + ss.toFixed(5) + "," + f2(1920 - sx * ss) + "," + f2(1080 - sy * ss) + ")";
  }
  // a LUZ da mesa (no palco; convertida para o mundo da câmera): atrás do trecho que a voz percorre, 120 ms atrás
  var LUZ = [
    { t: -1, x: PLACA.x + 1520, y: 1040 },                                   // o meio da régua inteira
    { t: T.back, x: PLACA.x + 700, y: 1000 },                                // a ponta de 150–200
    { t: T.ant, x: VIAJ.cx, y: 1120 },                                        // o 85–80 e o viajante
    { t: T.prim, x: PLACA.x + REGUA.x1 - 200, y: 1040 }                      // TODAY
  ];
  function luz(t, c) {
    var td = Math.max(0, t - LUZ_ATRASO), p = { x: LUZ[0].x, y: LUZ[0].y };
    for (var i = 1; i < LUZ.length; i++) { var q = eb(seg(td, LUZ[i].t, 0.6)); p = { x: lerp(p.x, LUZ[i].x, q), y: lerp(p.y, LUZ[i].y, q) }; }
    var lz = E("luz"); if (!lz) return;
    var wx = (p.x - 1920 - c.dx) / c.s + 1920, wy = (p.y - 1080 - c.dy) / c.s + 1080;
    lz.style.setProperty("--luz-x", f2(wx + 1200) + "px");
    lz.style.setProperty("--luz-y", f2(wy + 1200) + "px");
  }

  function cena(t) {
    var c = camAt(t);
    aplicarCamera(c);
    luz(t, c);
    aplicarRegua(t);
    aplicarViaj(t);
    var cr = E("cred"); if (cr) cr.style.opacity = eo(seg(t, T.regua, 0.3)).toFixed(3);
  }

  try { prepararRegua(); } catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e); }
  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e); }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  // só conferência (a prova vem dos quadros)
  window.__s54estado = function (t) {
    t = clamp(+t || 0, 0, DUR);
    var mm = maMax(t), c = camAt(t);
    return { maMax: +mm.toFixed(2), cursor_ma: +idadeCursor(t).toFixed(2), x85: +(PLACA.x + xR(85, mm)).toFixed(1),
      x200: +(PLACA.x + xR(200, mm)).toFixed(1), linhaEsq: +(PLACA.x + linhaEsq(t)).toFixed(1),
      mesa: { s: +c.s.toFixed(5), dx: +c.dx.toFixed(2), dy: +c.dy.toFixed(2) }, viajante_cx: VIAJ.cx };
  };
  window.__renderAt(0);
})();
</script>
