  // ═══ PEÇA 5 · A GENTE COMO PONTOS ══════════════════════════════════════════════════════════════════════════════════════════════
  // Nasce em s17 (lote M4); volta em s39, s40, s42, s43, s60, s68, s71, s74 e s75. Copie este bloco inteiro, com o GENTE_Q (o
  // <script id="gente-dados"> da cena) e a camada de genteCamada(); o que muda de cena para cena é só genteAplicar(z, prog, alfa).
  // O dado: os 60.677 pontos do Censo 2021 do ABS (_dados/gente-pontos-2021.geojson; 60.411 SA1 e 266 mesh blocks no retângulo do
  // Channel Country, 29 deles dentro dele, as 1.020 pessoas da medida), em --tinta.
  // O PONTO PESA A GENTE (o arco, peça 5): o diâmetro é D × √(p ÷ 420), em que D é o diâmetro do SA1 médio (420 pessoas) na vista
  // (8 px nas vistas do continente, 14 em P-CHC, 22 na costa; entre as âncoras, interpolado no log do zoom), com piso de 3 px e teto
  // de 2 D; abaixo do piso, a opacidade cai na proporção da área ((d ÷ 3)²), até 35 %. Assim a luz (área × opacidade) de cada ponto
  // é proporcional à gente dele, e nenhum pedaço do país fica marcado como vazio (o miúdo continua aceso a 35 %).
  // A ONDA (s17: "do litoral para dentro"): cada ponto tem w ∈ [0,1] = √(min(km da costa, 800) ÷ 800), calculado contra a costa do
  // australia.json (Natural Earth); as ilhas fora do continente (Lord Howe, Norfolk, Christmas, Cocos) têm w = 0. Com prog ≥ 1 +
  // GENTE.ONDA a onda acabou e todos os pontos estão acesos.
  var GENTE = {
    D_ANCORAS: [[4.75, 8], [6.67, 14], [8.84, 22]],   // [zoom, D px]: P-CONTINENTE, P-CHC, P-COSTA (o arco)
    P_MEDIO: 420,      // as pessoas do SA1 médio
    PISO: 3,           // px: o menor diâmetro desenhado
    TETO_D: 2,         // o maior diâmetro = 2 D

  function genteD(z) {

    if (z <= A[0][0]) return A[0][1];
    for (var i = 1; i < A.length; i++) if (z <= A[i][0]) {

  function genteGeojson() {

  maplibregl.addProtocol("regie+http", buscarComRetentativa);
  var pelaRegie = function (url) { return /^https?:\/\//.test(url) ? { url: "regie+" + url } : undefined; };
  var comChave = function (u) { return chave ? u.split("{chave}").join(encodeURIComponent(chave)) : u; };

  if (!prepararGeo()) return;
  if (window.__erroCena) return;
  window.__cameraAt = cameraAt;

  var CAMADAS = camadasDaCena();
  if (window.__erroCena) return;
  function estilo() {
    var fontes = { base: { type: "raster", tiles: P.base.tiles.map(comChave), tileSize: P.base.tileSize, maxzoom: P.base.maxzoom } };
    var ids = Object.keys(CAMADAS.fontes);
    for (var i = 0; i < ids.length; i++) fontes[ids[i]] = CAMADAS.fontes[ids[i]];
    return { version: 8, transition: { duration: 0, delay: 0 }, sources: fontes,
      layers: [{ id: "base", type: "raster", source: "base",
        // o tratamento C da base (identidade §6, Lucas 09/10/2026): brilho máximo 92 %, cor natural, contraste +25 %; sem véu
        paint: { "raster-brightness-max": 0.92, "raster-saturation": 0, "raster-contrast": 0.25, "raster-fade-duration": 0 } }].concat(CAMADAS.camadas) };

  var c0 = cameraAt(0);
  try {
    map = new maplibregl.Map({
      container: "map", interactive: false, preserveDrawingBuffer: true, fadeDuration: 0,
      maxTileCacheSize: 4096, attributionControl: false, maxPitch: 85, transformRequest: pelaRegie,

  }
  window.map = map;
  (function () {
    var pt = map.painter, pintar = pt && pt.render;
    if (typeof pintar !== "function") return falhar("o MapLibre desta cena não tem painter.render: a base andaria em degraus de 1 px.");

  function motivoRede(err, msg) {

    if (err.falha === "tempo") return "não respondeu em " + PRAZO_TENTATIVA / 1000 + " s" + n + ". Renderize de novo.";
    if (st === 401 || st === 403) return "recusou o acesso (HTTP " + st + "). Confira a chave " + (P.credencial || "") + " e o plano do dono.";

    if (st >= 500) return "está com erro no servidor (HTTP " + st + ")" + n + ". Tente de novo mais tarde.";

  }

    var msg = String(err.message || "");
    var deRede = err.status || err.url || (ev && ev.tile) || /fetch|network|failed to load|load failed|cors/i.test(msg);
    if (!deRede) return falhar("o MapLibre acusou erro na cena: " + (msg || "sem descrição") + ".");
    var fonte = ev && ev.sourceId ? " (fonte '" + ev.sourceId + "')" : (mapaCarregado ? "" : " (o estilo do mapa)");
    falhar("a base '" + P.nome + "'" + fonte + " " + motivoRede(err, msg) + (err.url ? " URL: " + String(err.url).split("?")[0] : ""));
  });

    mapaCarregado = true;
    map.once("idle", function () {
      var f = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      f.then(function () { if (!window.__erroCena) resolverPronto(true); });
    });
  });

  // ── a pílula presa ao chão: o ponto [lon, lat] vai ao ponto (ax, ay) da caixa (0..1), mais (dx, dy) px; v é a entrada (0..1) ──
  function porPilula(el, ll, ax, ay, dx, dy, v, sobe) {
    if (!el) return;
    var p = map.project(ll), w = el.offsetWidth, h = el.offsetHeight;
    var x = p.x - ax * w + (dx || 0), y = p.y - ay * h + (dy || 0) + (sobe == null ? (1 - cl(v, 0, 1)) * 24 : sobe);
    el.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
    el.style.opacity = cl(v, 0, 1).toFixed(3);
    el.style.visibility = v > 0.001 ? "visible" : "hidden";
  }
  // ── o ANEL (identidade §4.4; a roupa do mapista §3): 56 px, traço de 10 px em --destaque sobre o halo --rotulo de 20 px; o pulso

  function porAnel(id, x, y, v, tPulso, t) {
