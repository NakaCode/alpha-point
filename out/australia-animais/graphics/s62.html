    el.style.opacity = cl(v, 0, 1).toFixed(3); el.style.visibility = v > 0.001 ? "visible" : "hidden";
    el.style.transform = "translateY(" + ((sobe == null ? (1 - v) * 24 : sobe)).toFixed(2) + "px)";
  }
  var opAntes = {};
  function pinta(id, prop, v) { v = +(+v).toFixed(3); var k = id + "|" + prop; if (opAntes[k] === v) return; map.setPaintProperty(id, prop, v); opAntes[k] = v; }

  window.__videoPronto = new Promise(function (r) {
    var v = E(ABELHA.id); if (!v || v.readyState >= 2) return r();
    v.addEventListener("loadeddata", r, { once: true }); v.addEventListener("error", r, { once: true });
  });
  function ver(e, v) { if (e) { e.style.opacity = cl(v, 0, 1).toFixed(3); e.style.visibility = v > 0.001 ? "visible" : "hidden"; } }

  function aplicarTextos(t, noMapa) {
    // [344] EUROPE, dentro do continente; [345] 1822, na ponta da linha (o canto de baixo à esquerda 80 px à direita e 30 px acima)
    porPilula(E("pEuropa"), EUROPA.nome, 0.5, 0.5, 0, 0, noMapa ? eo(seg(t, T.europa, 0.3)) : 0);
    porPilula(E("pAno"), ROTA.chegada || ROTA.chega, 0, 1, 80, -30, noMapa ? eo(seg(t, T.ano, 0.3)) : 0);
  }
  function aplicar(t) {
    var noMapa = t >= T.mapa, v = E(ABELHA.id);
    if (v) {
      v.style.visibility = noMapa ? "hidden" : "visible";
      v.style.transform = "scale(" + (1 + ABELHA.zoom * cl(t / T.mapa, 0, 1)).toFixed(5) + ")";
    }
    if (mapaCarregado) { map.jumpTo(cameraAt(t)); aplicarCamadas(t); rota(t, noMapa); aplicarTextos(t, noMapa); }
    // os créditos: [342] com o dado que a voz diz, até o corte; [346] do primeiro ao último quadro de mapa; [347] com a Europa
    ver(E("crTurner"), noMapa ? 0 : eo(seg(t, T.cTurner, 0.3)));
    ver(E("credito"), noMapa ? 1 : 0);
    ver(E("crBee"), noMapa ? eo(seg(t, T.europa, 0.3)) : 0);
    return plano(t);
  }
  window.__renderAt = function (t) {
    try { return aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); return Promise.resolve(); }   // nunca lança
  };
  // só conferência (a prova vem dos quadros)
  window.__s62estado = function (t) {
    t = cl(+t || 0, 0, DUR);
    var v = E(ABELHA.id), pa = ROTA.partida ? map.project(ROTA.partida) : null, ch = ROTA.chegada ? map.project(ROTA.chegada) : null;
    return { camera: cameraAt(t), partida: ROTA.partida, chegada: ROTA.chegada, pontos: ROTA.ll.length,
      partidaTela: pa ? [+pa.x.toFixed(1), +pa.y.toFixed(1)] : null, chegadaTela: ch ? [+ch.x.toFixed(1), +ch.y.toFixed(1)] : null,
      video: v ? +v.currentTime.toFixed(3) : null, erros: window.__errosRender || 0, ultimo: window.__ultimoErroRender || null };
  };

  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou. O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) if (!map.getSource(FONTES[i]) || !map.isSourceLoaded(FONTES[i])) return false;
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
