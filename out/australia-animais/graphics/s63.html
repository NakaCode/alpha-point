<script>
/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de
   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();
   Lei: a cena é função pura de t. Nada aqui lê relógio, sorteia ou anda sozinho. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};
    const s = (o.base ?? 1.02) + (o.zoom ?? 0.0024) * t;
    const x = (o.ax ?? 6) * Math.sin(t * 0.23), y = (o.ay ?? 4.8) * Math.sin(t * 0.17);
    el.style.transform = "scale(" + s.toFixed(5) + ") translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
  }
  // Vídeo por f(t): posiciona e espera o "seeked". Na galeria (__PREVIEW) não mexe.
  function seekTo(v, tt) {
    if (!v || window.__PREVIEW || v.readyState < 1) return Promise.resolve();
    const d = v.duration; if (d > 0 && isFinite(d)) tt = clamp(tt, 0, Math.max(0, d - 0.001));
    if (Math.abs(v.currentTime - tt) < 1e-4 && !v.seeking) return Promise.resolve();
    return new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.addEventListener("error", r, { once: true }); v.currentTime = tt; });
  }
  // Grão: ruído de semente fixa por quadro (mulberry32). Mesmo t, mesmo grão.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  function grao(cv, t, o) {
    if (!cv || !cv.getContext) return; o = o || {};
    const ctx = cv.getContext("2d"), w = cv.width, h = cv.height;
    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));
    const img = ctx.createImageData(w, h), d = img.data, a = o.alfa ?? 22;
    for (let i = 0; i < d.length; i += 4) { const v = (sorte() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }
    ctx.putImageData(img, 0, 0);
  }
  // Paleta por vídeo: OBJETO de papéis {acento:"#…"}, montado pelo editor-de-arte. O espelho.paleta é
  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }
  function cor(v) { return typeof CSS !== "undefined" && CSS.supports ? CSS.supports("color", v) : /^#[0-9a-f]{3,8}$|^(rgb|hsl)a?\(/i.test(v); }
  function paleta(p) {
    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));
    }
  }
  // Prontidão: <img>, <image> de SVG e TODAS as faces "Marca"/"MarcaSec". Nunca rejeita: o que falhou
  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();
</script>

/* ═══════════════ PEÇA 1 · A FICHA e AS DEZ COLUNAS — INÍCIO DO BLOCO (copie daqui até "FIM DO BLOCO", sem mudar nada) ═══════════════

   <style>, e usa FICHA (o tamanho e a cor) e COLUNAS (onde cada ficha mora) com o que a sua cena pede.

   A FICHA (conceito-visual.json f554a521… › arco, peça 1): toda MORTE na tela é uma ficha QUADRADA em --tensao, DO MESMO TAMANHO do

       com 3 px de raio. É <rect class="ficha"> (o estilo dá a cor).

       fileiras, ao lado dos blocos de 85 e de 202: 60 colunas × 52 px + dois vãos = 3.440 px, a largura útil; 26 × 52 = 1.352 px).
       Com 44 px, a fila de 42 da s14 mede 2.176 px e a de 23 da s44, 1.188 px.

     2016 a 2025: 4, 10, 19, 6, 9, 6, 6, 8, 11, 6 (ABS, Causes of Death, Australia, 2025, Table 1.2, "Persons"; fatos-medidas
     [A-X20-X29]; somam 85). Cada coluna é uma PILHA de fichas, uma ficha por morte, com 1 ficha de largura: a escala é real e se
     conta (0 a 20: a mais alta tem 19), e nenhum valor vai escrito em cima.
     · G.base = 1480 (o pé das pilhas); o CHÃO: um fio de 6 px em --eixo-cor de x 520 a 3320, em y 1493;
     · o meio da coluna i (0 = 2016): COLUNAS.centro(i) = 660 + 280 i (660 … 3180); a ficha j (0 = a de baixo) da coluna i tem o
       canto de cima à esquerda em COLUNAS.pos(i, j) = (centro − 22, 1480 − 44 − 52 j); a pilha de 19 chega a y 500;
     · o EIXO DOS ANOS: UM <text> (o literal do redator, um nó só), com um <tspan> por ano centrado na sua coluna, a linha de base
       em y 1626 (Inter 500, 84 px, --eixo-cor: o papel "eixo" da marca).

   O HTML (dentro da câmera do dado, sobre --papel):
       <svg id="graf" viewBox="0 0 3840 2160" width="3840" height="2160" xmlns="http://www.w3.org/2000/svg">
         <line id="colChao" class="col-chao"/><g id="gColunas"></g><text id="colEixo" class="col-eixo" data-qc-papel="eixo"></text>
       </svg>
   USO:
     var C = COLUNAS.montar(document.getElementById("gColunas"), document.getElementById("colChao"), document.getElementById("colEixo"),
                            "2016   2017   2018   2019   2020   2021   2022   2023   2024   2025");
     C.estado({ sobe: 1, eixo: 1 });     // o estado completo (a volta em s14)
     C.fichas → [{ el, i, j, x, y }] (as 85, na ordem das colunas: para a cena que as solta, tomba ou junta)
     FICHA.lado, FICHA.passo, COLUNAS.G, COLUNAS.centro(i), COLUNAS.pos(i, j)
   ════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════ */
var FICHA = { lado: 44, vao: 8, passo: 52, raio: 3 };
var COLUNAS = (function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var G = {
    base: 1480,                                        // o pé das pilhas
    cx0: 660, passoX: 280,                             // o meio da 1ª coluna e o passo
    valores: [4, 10, 19, 6, 9, 6, 6, 8, 11, 6],        // X20-X29, "Persons", 2016 … 2025 (somam 85)
    chao: { x0: 520, x1: 3320, y: 1493, traco: 6 },
    eixo: { base: 1626 }
  };
  function centro(i) { return G.cx0 + G.passoX * i; }
  function pos(i, j) { return { x: centro(i) - FICHA.lado / 2, y: G.base - FICHA.lado - FICHA.passo * j }; }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function eo(p) { return 1 - Math.pow(1 - p, 3); }
  function montar(g, chao, eixoEl, literal) {
    if (!g) return null;
    var fichas = [], anos = [], i, j;
    if (chao) { chao.setAttribute("x1", G.chao.x0); chao.setAttribute("x2", G.chao.x1); chao.setAttribute("y1", G.chao.y); chao.setAttribute("y2", G.chao.y); chao.setAttribute("stroke-width", G.chao.traco); }
    for (i = 0; i < G.valores.length; i++) for (j = 0; j < G.valores[i]; j++) {

      r.setAttribute("rx", FICHA.raio); r.setAttribute("x", p.x.toFixed(1)); r.setAttribute("y", p.y.toFixed(1)); r.setAttribute("opacity", "0");
      g.appendChild(r); fichas.push({ el: r, i: i, j: j, x: p.x, y: p.y });
    }

      var partes = String(literal || "").trim().split(/(\s+)/), k = 0;
      eixoEl.setAttribute("text-anchor", "middle");

        if (!q) return;

        if (/^\s+$/.test(q)) { var v = document.createElementNS(NS, "tspan"); v.setAttribute("x", centro(k).toFixed(1)); v.setAttribute("y", G.eixo.base); v.textContent = q; eixoEl.appendChild(v); return; }
        var s = document.createElementNS(NS, "tspan"); s.setAttribute("x", centro(k).toFixed(1)); s.setAttribute("y", G.eixo.base);
        s.textContent = q; s.setAttribute("fill-opacity", "0"); eixoEl.appendChild(s); anos.push(s); k++;
      });
    }
    function estado(e) {
      e = e || {};
      var ps = e.sobe == null ? 1 : clamp01(e.sobe), pe = e.eixo == null ? 1 : clamp01(e.eixo);
      fichas.forEach(function (f) {
        var q = eo(clamp01((ps - (0.40 * f.i / 9 + 0.036 * f.j)) / 0.12));
        f.el.setAttribute("opacity", q.toFixed(3));
        f.el.setAttribute("y", (f.y - 18 * (1 - q)).toFixed(1));
      });
      if (eixoEl) {
        eixoEl.style.visibility = pe > 0 ? "visible" : "hidden";
        eixoEl.style.opacity = pe > 0 ? "1" : "0";
        anos.forEach(function (s, k) { s.setAttribute("fill-opacity", eo(clamp01((pe - 0.85 * k / 9) / 0.15)).toFixed(3)); });
      }
    }
    estado({ sobe: 0, eixo: 0 });
    return { estado: estado, fichas: fichas, anos: anos };
  }
  return { G: G, centro: centro, pos: pos, montar: montar };
})();
/* ═══════════════ PEÇA 1 · A FICHA e AS DEZ COLUNAS — FIM DO BLOCO ═══════════════ */

    var NS = "http://www.w3.org/2000/svg", larg = NC.w - 2 * NC.corpo.x, alt = lin.length * GF.linhaAlt + 20;
    var pautas = document.createElementNS(NS, "svg");
    pautas.setAttribute("class", "f79-pautas"); pautas.setAttribute("width", larg); pautas.setAttribute("height", alt);

    lin.forEach(function (l, i) {

      p.setAttribute("y1", GF.linhaAlt * (i + 1) - 8); p.setAttribute("y2", GF.linhaAlt * (i + 1) - 8); pautas.appendChild(p);

    // um trecho de grifo: a frase dentro da 2ª frase da folha, partida pelas linhas (por baixo da letra: criado antes do nó do texto)

    fe.style.left = NC.fita.borda + "px"; fd.style.left = (NC.w - NC.fita.larg - NC.fita.borda) + "px";

  })();
  // o grifo de um trecho com n letras já passadas: enche as partes em ordem (cada parte é a fatia do trecho numa linha)
  function grifo(partes, n) {

  var LUZ = [{ x: NC.cx, y: NC.cy }, { x: 1920, y: 1160 }];

  function dado(t) {
    // a câmera do dado: o empurrão lento e a deriva do RIG; para 250 ms antes do corte
    var tc = Math.min(t, T.camD), cd = E("camD"), d = deriva(tc);

    var chao = E("colChao"); if (chao) chao.style.opacity = (1 - seg(t, T.junta, 0.5)).toFixed(3);
    if (C) {

      C.fichas.forEach(function (f, k) {
        var r = CASA[k] || 0, p = eo(seg(t, T.junta + T.juntaPasso * r, T.voo)), a = MONTES.centro(GV, r);

    }
    FS.forEach(function (f, k) {
      var q = eo(seg(t, T.sem + T.semPasso * k, T.semCai)), a = MONTES.centro(GS, k);

    BARRAS.entra(CV.k, eo(seg(t, T.ven, 0.3)), false);
    BARRAS.entra(CS.k, eo(seg(t, T.sem, 0.3)), false);
    BARRAS.entra(CS.r, eo(seg(t, T.sem + 0.10, 0.3)), false);

    if (!FOLHA) return;
    var ps = pousoFolha(t, T.pouso, T.pousoDur, NC.desce);
    objeto(FOLHA.host, FOLHA.sombra, NC, ps, lerp(NC.rot0, NC.rot, ps.p));
    fita(FOLHA.fitas[0], t, T.fitas, "e"); fita(FOLHA.fitas[1], t, T.fitas + 0.08, "d");
    var nc = FOLHA79.bater(FOLHA.cabTxt, FOLHA.linCab, seg(t, T.cab[0], T.cab[1]), GF.avancoCab, GF.linhaAltCab);
    FOLHA.cab.style.opacity = nc > 0 ? "1" : "0";
    FOLHA79.bater(FOLHA.corpo, FOLHA.lin, letras(t, T.corpo) / FOLHA.total, GF.avanco, GF.linhaAlt);
    grifo(FOLHA.g1, letras(t, T.g1));
    grifo(FOLHA.g2, letras(t, T.g2));
    grifo(FOLHA.g3, letras(t, T.g3a) + letras(t, T.g3b));
    var pn = eo(seg(t, T.nota, 0.3));
    FOLHA.nota.style.opacity = pn.toFixed(3); FOLHA.nota.style.transform = "translateY(" + ((1 - pn) * 24).toFixed(1) + "px)";
  }
  function cena(t) {
    var p3 = t >= T.corte;
    ver(E("vDado"), !p3); ver(E("vMesa"), p3);
    var ca = E("credAbs"), cn = E("credNcis");
    ver(ca, !p3); ver(cn, p3);

    if (cn) cn.style.opacity = "1";

  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e); }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  // a prontidão: o still e as faces da marca (RIG) + a Courier Prime da folha, que o RIG não espera (lição L2)
  var fontesDoc = [
    document.fonts.load('400 86px "MarcaDoc"').then(function (f) { if (!f.length) window.__fontesFaltando.push("MarcaDoc 400 (Courier Prime da folha)"); }, function () { window.__fontesFaltando.push("MarcaDoc 400 (Courier Prime da folha)"); }),
