    }
  }
  // a deriva do RIG (±6 / ±4,8 px), em função do relógio da deriva
  function deriva(td) { return { x: 6 * Math.sin(td * 0.23), y: 4.8 * Math.sin(td * 0.17) }; }
  // ═══ fim dos executores da mesa ═══

  // ── os tempos (locais, −800,167), do words.json, dos textos de tela e da regência s64 ──
  var T = {
    foto: -0.12, fita: 0.50,                          // a foto no ar desde 0,12 s antes do corte; assentada em 0,43
    empurra: 6.05,                                    // a câmera da mesa chega a 1,06 e para 250 ms antes do corte
    corte: 6.283,                                     // P1 → P2: o quadro de 6,267 s ainda é a mesa; o de 6,300 s já é o papel
    parte: 7.068,                                     // 'count': a barra se parte
    saidas: [7.07, 7.17, 7.27, 7.37, 7.47], passo: 0.006, voo: 0.50,   // a saída de cada monte e das sobras
    rotulos: 7.100,                                   // os quatro rótulos, apagados
    acende: [7.353, 8.153, 9.513, 11.513],            // 'dogs' · 'mammals,' · 'sea,' · 'crocodiles.'
    tubaroes: 10.093,                                 // 'sharks': nada escrito; o monte do mar salta de novo
    fazenda: 12.767,                                  // o crédito de Peachey & Lower
    camD: 18.583                                      // a câmera do dado para 250 ms antes do fim
  };
  function ver(el, on) { if (el) el.style.display = on ? "block" : "none"; }   // display, e não visibility: um filho com visibility própria apareceria com o pai escondido

  // ── P1: a foto impressa (o centro, o tamanho com a moldura, a inclinação assentada) e a câmera rumo à cabeça ──
  var FT = { w: 1928, h: 1458, k: 1, cx: 1920, cy: 1050, rot: -1.5 };
  var CAM = { ox: 2075, oy: 1258, s1: 1.06 };

  // ── P2 + P3: a barra das 154 e os quatro montes ──
  var GS = MONTES.G.semVeneno;
  var FS = MONTES.criar(E("gSem"), GS.n);
  MONTES.chao(E("monteChao"));
  var ROT = MONTES.G.montes.map(function (m, i) { return MONTES.rotulo(E("rotulos"), "rot" + i, m.cx, TEXTOS.rotulos[i]); });
  var SALTOS = [[T.acende[0]], [T.acende[1]], [T.acende[2], T.tubaroes], [T.acende[3]]];
  // o salto de um monte: uma onda de 16 px que sobe pelas fileiras (14 ms por fileira), 0,34 s, uma vez, sem quique
  function salto(t, m, fileira) {
    var h = 0, ev = SALTOS[m] || [];
    for (var i = 0; i < ev.length; i++) h += 16 * Math.sin(Math.PI * seg(t, ev[i] + 0.014 * fileira, 0.34));
    return h;
  }

  function mesa(t) {
    var tc = Math.min(t, T.empurra), d = deriva(tc);
    cameraMesa(1 + (CAM.s1 - 1) * tc / T.empurra, CAM.ox, CAM.oy, d.x, d.y, { x: FT.cx, y: FT.cy });
    var pf = pousoFoto(t, T.foto);
    objeto(E("fotoG"), E("fotoSombra"), FT, pf, FT.rot + 0.5 * (1 - pf.p));
    fita(E("fotoFita"), t, T.fita, "d");
  }
  function dado(t) {
    // a câmera do dado: o empurrão lento e a deriva do RIG, contados do corte; para 250 ms antes do fim
    var tc = Math.min(t, T.camD) - T.corte, cd = E("camD"), d = deriva(tc);
    if (cd) cd.style.transform = "scale(" + (1 + 0.030 * tc / (T.camD - T.corte)).toFixed(5) + ") translate(" + d.x.toFixed(2) + "px," + d.y.toFixed(2) + "px)";
    // o chão se risca da esquerda para a direita em 'count'
    var chao = E("monteChao"), pc = eo(seg(t, T.parte, 0.5)), CH = MONTES.G.chao;
    if (chao) { chao.setAttribute("x2", lerp(CH.x0, CH.x1, pc).toFixed(1)); chao.style.opacity = pc > 0 ? "1" : "0"; }
    FS.forEach(function (f, k) {
      var a = MONTES.centro(GS, k), b = MONTES.pose(k), g = b.m < 0 ? 4 : b.m;
      var p = eo(seg(t, T.saidas[g] + T.passo * b.j, T.voo));
      var h = b.m < 0 ? 0 : salto(t, b.m, Math.floor(b.j / MONTES.G.larg));
      MONTES.por(f, lerp(a.x, b.x, p), lerp(a.y, b.y, p) - h * p, b.rot * p, 1);
    });
    // os rótulos: entram a 50 % (0,5 s, linear; sobem 24 px em 300 ms) e acendem cada um na sua palavra (250 ms)
    ROT.forEach(function (el, i) {
      var pin = seg(t, T.rotulos, 0.5), pa = eo(seg(t, T.acende[i], 0.25));
      MONTES.rotuloPor(el, lerp(0.5 * pin, 1, pa), (1 - eo(seg(t, T.rotulos, 0.3))) * 24);
    });
  }
  function cena(t) {
    var p2 = t >= T.corte;
    ver(E("vDado"), p2); ver(E("vMesa"), !p2);
    var cf = E("credFoto"), ca = E("credAbs"), cz = E("credFazenda");
    ver(cf, !p2); ver(ca, p2); ver(cz, p2 && t >= T.fazenda);
    if (cf) cf.style.opacity = "1";
    if (ca) ca.style.opacity = "1";
    if (cz) cz.style.opacity = eo(seg(t, T.fazenda, 0.3)).toFixed(3);
    if (p2) dado(t); else mesa(t);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e); }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });   // o still, a foto e as faces da marca
  window.__renderAt(0);
})();
</script>
