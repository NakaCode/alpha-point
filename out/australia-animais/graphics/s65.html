    var st = err.status, n = err.tentativas > 1 ? " (" + err.tentativas + " tentativas)" : "";
    if (err.falha === "corrompido" || /could not be decoded|could not load image|tile corrompido/i.test(msg))
      return "mandou tile CORROMPIDO" + n + " (" + String(msg).replace(/^tile corrompido: /, "") + "). Renderize de novo.";
    if (err.falha === "tempo") return "não respondeu em " + PRAZO_TENTATIVA / 1000 + " s" + n + ". Renderize de novo.";
    if (st === 401 || st === 403) return "recusou o acesso (HTTP " + st + "). Confira a chave " + (P.credencial || "") + " e o plano do dono.";
    if (st === 429) return "limitou as requisições (HTTP 429)" + n + ". Espere e renderize de novo.";
    if (st >= 500) return "está com erro no servidor (HTTP " + st + ")" + n + ". Tente de novo mais tarde.";
    if (st) return "respondeu HTTP " + st + ".";
    return "não respondeu (sem internet? servidor fora do ar? firewall?)" + n + ".";
  }
  var mapaCarregado = false;
  map.on("error", function (ev) {
    window.__errosMapa++;
    var err = (ev && ev.error) || {};
    var msg = String(err.message || "");
    var deRede = err.status || err.url || (ev && ev.tile) || /fetch|network|failed to load|load failed|cors/i.test(msg);
    if (!deRede) return falhar("o MapLibre acusou erro na cena: " + (msg || "sem descrição") + ".");
    var fonte = ev && ev.sourceId ? " (fonte '" + ev.sourceId + "')" : (mapaCarregado ? "" : " (o estilo do mapa)");
    falhar("a base '" + P.nome + "'" + fonte + " " + motivoRede(err, msg) + (err.url ? " URL: " + String(err.url).split("?")[0] : ""));
  });
  map.on("load", function () {
    mapaCarregado = true;
    map.once("idle", function () {
      var f = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      f.then(function () { if (!window.__erroCena) resolverPronto(true); });
    });
  });

  // ── a pílula presa ao chão: o ponto [lon, lat] vai ao ponto (ax, ay) da caixa (0..1), mais (dx, dy) px; v é a entrada (0..1) ──
  function porPilula(el, ll, ax, ay, dx, dy, v, sobe) {
    if (!el) return;
    var p = map.project(ll), w = el.offsetWidth, h = el.offsetHeight;
    var x = p.x - ax * w + (dx || 0), y = p.y - ay * h + (dy || 0) + (sobe == null ? (1 - v) * 24 : sobe);
    el.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
    el.style.opacity = cl(v, 0, 1).toFixed(3);
    el.style.visibility = v > 0.001 ? "visible" : "hidden";
  }
  function porTexto(el, v, sobe) {
    if (!el) return;
    el.style.opacity = cl(v, 0, 1).toFixed(3); el.style.visibility = v > 0.001 ? "visible" : "hidden";
    el.style.transform = "translateY(" + ((sobe == null ? (1 - v) * 24 : sobe)).toFixed(2) + "px)";
  }
  var opAntes = {};
  function pinta(id, prop, v) { v = +(+v).toFixed(3); var k = id + "|" + prop; if (opAntes[k] === v) return; map.setPaintProperty(id, prop, v); opAntes[k] = v; }

  // ═══ o clipe por t (RIG.seekTo; nunca play() no render): o trecho 21,800–27,933 s ═══
  var CLIPE = { id: "vTub", ini: 21.8 };
  function plano(t) {
    var v = E(CLIPE.id); if (!v) return Promise.resolve();
    var tv = CLIPE.ini + cl(t, 0, 6.133);
    if (window.__PREVIEW) { if (v.readyState >= 1 && Math.abs(v.currentTime - tv) > 0.3) v.currentTime = tv; return Promise.resolve(); }
    return R.seekTo(v, tv);
  }
  window.__videoPronto = new Promise(function (r) {
    var v = E(CLIPE.id); if (!v || v.readyState >= 2) return r();
    v.addEventListener("loadeddata", r, { once: true }); v.addEventListener("error", r, { once: true });
  });

  function ver(e, v) { if (e) { e.style.opacity = cl(v, 0, 1).toFixed(3); e.style.visibility = v > 0.001 ? "visible" : "hidden"; } }

  function aplicarTextos(t, noMapa) {
    var sai = 1 - seg(t, T.sriSai, 0.2);
    // b2: a pincelada (de 'from' a 'Australia.') e o Sri Lanka
    var fx = E("faixa"), pf = noMapa ? seg(t, T.faixa[0], T.faixa[1]) : 0;
    if (fx) {
      if (pf <= 0 || sai <= 0) fx.style.visibility = "hidden";
      else {
        fx.setAttribute("d", curva(FAIXA.map(function (ll) { return map.project(ll); })));
        fx.setAttribute("stroke-dashoffset", (1 - pf).toFixed(4));
        fx.style.opacity = sai.toFixed(3); fx.style.visibility = "visible";
      }
    }
    porPilula(E("pSri"), LK_PE, 0, 0, -250, 112, noMapa ? eo(seg(t, T.sri, 0.3)) * sai : 0);
    // b3: o Território do Norte e a data (a 2ª pílula embaixo da 1ª, alinhada à esquerda com ela, presa ao mesmo chão)
    var pn = E("pNt"), wn = pn ? pn.offsetWidth : 0, hn = pn ? pn.offsetHeight : 0;
    porPilula(pn, NT_ALTO, 0.5, 0, 0, 0, noMapa ? eo(seg(t, T.nt, 0.3)) : 0);
    porPilula(E("pProt"), NT_ALTO, 0, 0, -wn / 2, hn + 24, noMapa ? eo(seg(t, T.prot, 0.3)) : 0);
  }
  function aplicarCreditos(t, noPapel, noMapa) {
    ver(E("cAbs"), noPapel ? 1 : 0);
    ver(E("credito"), noMapa ? 1 : 0);
    // cada crédito entra e sai com o dado que credita (a decisão da Sala): Lloyd-Jones com a pincelada, Fukuda com PROTECTED IN 1971
    ver(E("cLloyd"), noMapa ? eo(seg(t, T.faixa[0], 0.3)) * (1 - seg(t, T.sriSai, 0.2)) : 0);
    ver(E("cFukuda"), noMapa ? eo(seg(t, T.prot, 0.3)) : 0);
    ver(E("cAsgs"), noMapa ? eo(seg(t, T.nt, 0.3)) : 0);
  }

  function aplicar(t) {
    var noVideo = t < T.papel, noMapa = t >= T.mapa, noPapel = !noVideo && !noMapa;
    var v = E("vTub"), vd = E("vDado");
    if (v) v.style.visibility = noVideo ? "visible" : "hidden";
    if (vd) vd.style.display = noPapel ? "block" : "none";
    if (noPapel) papel(t);
    if (mapaCarregado) { map.jumpTo(cameraAt(t)); aplicarCamadas(t); aplicarTextos(t, noMapa); }
    aplicarCreditos(t, noPapel, noMapa);
    return plano(t);
  }
  window.__renderAt = function (t) {
    try { return aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); return Promise.resolve(); }
  };

  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou. O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) if (!map.getSource(FONTES[i]) || !map.isSourceLoaded(FONTES[i])) return false;
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
