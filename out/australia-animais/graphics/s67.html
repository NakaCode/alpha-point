<script>
/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de
   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();
   Lei: a cena é função pura de t. Nada aqui lê relógio, sorteia ou anda sozinho. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};
    const s = (o.base ?? 1.02) + (o.zoom ?? 0.0024) * t;
    const x = (o.ax ?? 6) * Math.sin(t * 0.23), y = (o.ay ?? 4.8) * Math.sin(t * 0.17);
    el.style.transform = "scale(" + s.toFixed(5) + ") translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
  }
  // Vídeo por f(t): posiciona e espera o "seeked". Na galeria (__PREVIEW) não mexe.
  function seekTo(v, tt) {
    if (!v || window.__PREVIEW || v.readyState < 1) return Promise.resolve();
    const d = v.duration; if (d > 0 && isFinite(d)) tt = clamp(tt, 0, Math.max(0, d - 0.001));
    if (Math.abs(v.currentTime - tt) < 1e-4 && !v.seeking) return Promise.resolve();
    return new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.addEventListener("error", r, { once: true }); v.currentTime = tt; });
  }
  // Grão: ruído de semente fixa por quadro (mulberry32). Mesmo t, mesmo grão.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  function grao(cv, t, o) {
    if (!cv || !cv.getContext) return; o = o || {};
    const ctx = cv.getContext("2d"), w = cv.width, h = cv.height;
    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));
    const img = ctx.createImageData(w, h), d = img.data, a = o.alfa ?? 22;
    for (let i = 0; i < d.length; i += 4) { const v = (sorte() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }
    ctx.putImageData(img, 0, 0);
  }
  // Paleta por vídeo: OBJETO de papéis {acento:"#…"}, montado pelo editor-de-arte. O espelho.paleta é
  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }
  function cor(v) { return typeof CSS !== "undefined" && CSS.supports ? CSS.supports("color", v) : /^#[0-9a-f]{3,8}$|^(rgb|hsl)a?\(/i.test(v); }
  function paleta(p) {
    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));
    }
  }
  // Prontidão: <img>, <image> de SVG e TODAS as faces "Marca"/"MarcaSec". Nunca rejeita: o que falhou
  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();
</script>

  // O FRASCO em traço de engenheiro (o desenho do arco; peça 6b nasce em s46, a Sala casa os dois). Origem: o centro da base;
  // y negativo para cima; 192 px de altura, 88 de corpo. A faixa do rótulo fica em branco (item 23); a rolha, oculta, tracejada.
  var FRASCO_D = {
    corpo: "M -24,-160 L -24,-150 C -24,-140 -44,-140 -44,-128 L -44,-12 Q -44,0 -32,0 L 32,0 Q 44,0 44,-12 L 44,-128 " +
           "C 44,-140 24,-140 24,-150 L 24,-160",
    tampa: "M -32,-160 L 32,-160 L 32,-192 L -32,-192 Z",
    lacre: "M -32,-180 L 32,-180",
    faixa: "M -44,-104 L 44,-104 M -44,-40 L 44,-40",
    rolha: "M -18,-160 L -18,-146 L 18,-146 L 18,-160"
  };
  function frascoMontar(pai, paiSombra) {
    var g = el("g", { opacity: "0" }, pai), s = el("g", { opacity: "0" }, paiSombra);
    ["corpo", "tampa", "lacre"].forEach(function (k) { el("path", { d: FRASCO_D[k], "class": "ar" }, g); });
    el("path", { d: FRASCO_D.faixa, "class": "ar-fina" }, g);
    el("path", { d: FRASCO_D.rolha, "class": "ar-oculta" }, g);
    ["corpo", "tampa"].forEach(function (k) { el("path", { d: FRASCO_D[k], "class": "sombra-linha" }, s); });
    return { g: g, s: s };
  }
  // o frasco em pé: base em (x, yBase), escala k, a altura dy acima do pouso (mundo), e a sombra solta (deslocamento e força)
  function frascoPor(f, x, yBase, k, alfa, dy, sombraOff, sombraForca) {
    f.g.setAttribute("transform", "translate(" + f2(x) + "," + f2(yBase + dy) + ") scale(" + k.toFixed(4) + ")");
    op(f.g, alfa.toFixed(3));
    f.s.setAttribute("transform", "translate(" + f2(x) + "," + f2(yBase + dy + sombraOff) + ") scale(" + k.toFixed(4) + ")");
    op(f.s, (alfa * sombraForca).toFixed(3));
  }
  // ═══ fim do bloco A RÉGUA DOS SOROS ═══════════════════════════════════════════════════════════════════════════

  // ── a geometria da cena (o espaço da câmera; ver "A GEOMETRIA" no cabeçalho) ──
  var PIVO = { x: 212, y: 900 };                                                // o pivô do empurrão: a borda esquerda das fitas do cartão
  var POSE_CARD = { cx: 1234, cy: 710, rot: -0.6, rot0: -1.6 };                 // o cartão: x 254 → 2214, y 500 → 920
  var FP = { w: 3144, h: 772, cx: 254 + 1572, cy: 896 + 386, rot: 0.5 };        // o papel da fala: x 254 → 3398, y 896 → 1668
  var GF = FOLHA.G, G79 = FOLHA79.G;
  var POSE_ABS = { cx: 3127, cy: 789, k: 0.95, rot: -1.5, de: { dx: 2600, dy: -70, rot: -3.4 } };   // o canto de cima à esquerda em (1384, −70)
  var POSE_79 = { cx: 2796.5, cy: 1230, k: 1, rot: 0.4, de: { dx: 1750, dy: 240, rot: 2.8 } };      // x 2171 → 3422, y 446 → 2015
  var NOTA = { w: 1236, h: 172, cx: 900, cy: 1052, rot: 1.0 };                  // o bilhete: x 282 → 1518, y 966 → 1138
  // A RÉGUA na cena: a mesma fita de s47 (a escala dela não muda), vista por uma "câmera" própria (um grupo: translate + scale):
  // KR 0,84, o canto de cima à esquerda do desenho (a ponta solta da fita, o alto dos frascos) em (232, 1215). O rolo parado logo
  // depois de 1981 (L0 = 1260, o estado em que a s72 encontra a régua); os quatro riscos e os quatro frascos, acesos; sem os anos
  var KR = 0.84, RSP = { x: 232, y: 1215, de: -1500 }, RS_L0 = 1260, RS_ANOS = [1930, 1956, 1970, 1981];
  var RS_TX = RSP.x - RS_XINI * KR, RS_TY = RSP.y - (RS.yTopo - 192 * RS.frascoK) * KR;

  // ── a montagem (uma vez) ──
  var ABSF = null, F79 = null, GR = {};
  function montar() {
    CARD.montar();
    var g = E("fala"), p = E("falaPapel"), s = E("falaSombra");
    [g, p, s].forEach(function (x) { if (x) { x.style.width = FP.w + "px"; x.style.height = FP.h + "px"; } });
    var ng = E("nota"), np = E("notaPapel"), ns = E("notaSombra");
    [ng, np, ns].forEach(function (x) { if (x) { x.style.width = NOTA.w + "px"; x.style.height = NOTA.h + "px"; } });
    // a folha do ABS: só o cabeçalho vem no _textos_por_cena (sem anos, sem linhas, sem nota: só o traço, como na s13)
    ABSF = FOLHA.montar(E("abs"), E("absSombra"), { cab: CAB_ABS });
    // a folha de 1979: só o título vem no _textos_por_cena (sem a referência e sem os autores)
    F79 = FOLHA79.montar(E("f79"), E("f79Sombra"), { tit: TIT_79 });
    // a régua: a fita deitada até L0, o rolo, os riscos e os frascos (tudo parado dentro do grupo; quem anda é o grupo)
    var sombras = E("rsSombras"), regua = E("rsRegua"), riscos = E("rsRiscos"), frascos = E("rsFrascos");
    GR.cam = E("rsCam");
    if (sombras && regua && riscos && frascos) {
      GR.rs = rsMontar(regua, sombras);
      rsFita(GR.rs, RS_L0, 12 / KR);
      RS_ANOS.forEach(function (ano) {
        var rk = rsRiscoMontar(riscos); rsRisco(rk, ano, 1);
        var fr = frascoMontar(frascos, sombras); frascoPor(fr, rsX(ano), RS.yTopo, RS.frascoK, 1, 0, 12 / KR, 0.8 * 0.7);
      });
    }
  }

  // ═══ a legenda [384], batida à máquina: a largura de cada prefixo, medida com a face da marca (só depois de ela carregar: L2) ═══
  var LEG = null;
  function medirLeg() {
    if (LEG) return true;
    if (!document.fonts || !document.fonts.check('500 84px "Marca"')) return false;
    var e = E("wond"); if (!e) return false;
    var px = parseFloat(getComputedStyle(e).fontSize) || 84;
    var cv = document.createElement("canvas").getContext("2d"); if (!cv) return false;
    cv.font = "500 " + px + 'px "Marca"';
    var b = [0], tx = TEXTOS.wond; for (var k = 1; k <= tx.length; k++) b.push(cv.measureText(tx.slice(0, k)).width);
    LEG = b; return true;
  }
  function baterLeg(t) {
    var e = E("wond"); if (!e) return;
    var tot = TEXTOS.wond.length, n = batidas(t, T.wond, tot);
    if (n <= 0) { e.style.visibility = "hidden"; return; }
    e.style.visibility = "visible";
    if (n >= tot) { e.style.clipPath = "none"; return; }
    if (!LEG) medirLeg();
    e.style.clipPath = LEG ? "inset(-20% " + Math.max(0, LEG[tot] - LEG[n] - 1).toFixed(1) + "px -20% -2%)"
      : "inset(-20% " + (100 * (1 - n / tot)).toFixed(2) + "% -20% -2%)";
  }

  // ── a câmera: o empurrão de P2 (1,00 → 1,02, para 0,3 s antes da 1ª expressão) e o recuo de P3 (→ 1,00), em torno do PIVO; a
  //    deriva do RIG (±6 / ±4,8 px), que para no repouso; o still a 0,6 ──
  function escalaCam(t) { return 1 + 0.020 * eb(seg(t, T.cam1, T.cam1Dur)) - 0.020 * eb(seg(t, T.cam2, T.cam2Dur)); }
  function aplicarCamera(t, luz) {
    var camEl = E("cam"), st = E("still");
    var s = escalaCam(t), td = Math.min(t, T.repouso), dx = 6 * Math.sin(td * 0.23), dy = 4.8 * Math.sin(td * 0.17);
    var tx = (PIVO.x - 1920) * (1 - s) + dx, ty = (PIVO.y - 1080) * (1 - s) + dy;
    if (camEl) camEl.style.transform = "translate(" + tx.toFixed(2) + "px," + ty.toFixed(2) + "px) scale(" + s.toFixed(5) + ")";
    if (st) st.style.transform = "translate(" + (tx * 0.6).toFixed(2) + "px," + (ty * 0.6).toFixed(2) + "px) scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ")";
    if (camEl && luz) { camEl.style.setProperty("--luz-x", luz.x.toFixed(1) + "px"); camEl.style.setProperty("--luz-y", luz.y.toFixed(1) + "px"); }
  }
  // a LUZ (chamada com t − 120 ms): no 1º quadro repousa em LUZ0, no meio da mesa, e de 0 a T.n ANDA até o lugar do cartão (curva
  // suave 3p² − 2p³; ~720 px em 1,35 s, o pico a ~800 px/s, como na s19): a mesa vazia não fica parada, e o cartão pousa dentro
  // da luz (a regra da Sala para o vídeo). Depois ela vai ao objeto da vez: o papel da fala; de volta ao cartão quando ele levanta;
  // a régua (a única das três peças sobre a mesa escura, onde a luz se vê); o bilhete. Cada ida: 0,6 s, eb
  var LUZ0 = { x: 1850, y: 1080 };
  function suave(p) { return p * p * (3 - 2 * p); }
  var LUZ_ALVOS = [
    { t: T.f, x: FP.cx, y: FP.cy },
    { t: T.fSai, x: POSE_CARD.cx, y: POSE_CARD.cy },
    { t: T.regua, x: 800, y: 1400 },
    { t: T.nota, x: NOTA.cx, y: NOTA.cy }
  ];
  function alvoLuz(t) {
    var v = suave(seg(t, 0, T.n));
    var x = lerp(LUZ0.x, POSE_CARD.cx, v), y = lerp(LUZ0.y, POSE_CARD.cy, v);
    for (var i = 0; i < LUZ_ALVOS.length; i++) {
      var a = LUZ_ALVOS[i], u = eb(seg(t, a.t, 0.6));
      x = lerp(x, a.x, u); y = lerp(y, a.y, u);
    }
    return { x: x, y: y };
  }

  // ── os executores das peças que DESLIZAM (um por peça; a sombra assentada do começo ao fim: a peça não sai da mesa) ──
  function deslize(t, t0, dur) { return eo(seg(t, t0, dur)); }
  function absPor(t) {
    var p = deslize(t, T.abs, T.absDur), o = t >= T.abs ? 1 : 0, P = POSE_ABS;
    var x = P.cx + P.de.dx * (1 - p), y = P.cy + P.de.dy * (1 - p), r = lerp(P.de.rot, P.rot, p);
    por(E("abs"), x, y, GF.W, GF.H, r, P.k, o);
    por(E("absSombra"), x, y - GF.sombra.recuo * P.k / 2 + 12, GF.W, GF.H - GF.sombra.recuo, r, P.k, 0.80 * o);
    if (ABSF) ABSF.estado({ cab: seg(t, T.cab, 0.2), regua: 0, linhas: [], nota: 0 });
  }
  function f79Por(t) {
    var p = deslize(t, T.f79, T.f79Dur), o = t >= T.f79 ? 1 : 0, P = POSE_79;
    var x = P.cx + P.de.dx * (1 - p), y = P.cy + P.de.dy * (1 - p), r = lerp(P.de.rot, P.rot, p);
    por(E("f79"), x, y, G79.W, G79.H, r, P.k, o);
    por(E("f79Sombra"), x, y - G79.sombra.recuo * P.k / 2 + 12, G79.W, G79.H - G79.sombra.recuo, r, P.k, 0.80 * o);
    if (F79) {
      F79.estado({ ref: 0, aut: 0, tit: seg(t, T.tit, 0.3) });
      colar(F79.fitas[0], eo(seg(t, T.f79FitaE, 0.3)), -4); colar(F79.fitas[1], eo(seg(t, T.f79FitaD, 0.3)), 3);
    }
  }
  function reguaPor(t) {
    if (!GR.cam) return;
    var p = deslize(t, T.regua, T.reguaDur);
    GR.cam.setAttribute("transform", "translate(" + f2(RS_TX + RSP.de * (1 - p)) + "," + f2(RS_TY) + ") scale(" + KR + ")");
    op(GR.cam, t >= T.regua ? "1" : "0");
  }
  // a mão levanta a ponta do cartão para a folha do ABS passar por baixo: sobe em p³ (0,25 s), assenta em eo (0,22 s)
  function levantado(t) { var u = seg(t, T.hop, T.hopDur), d = eo(seg(t, T.hopDesce, T.hopDesceDur)); return u * u * u * (1 - d); }

  function cena(t) {
    // P3 · a folha do ABS (por baixo do cartão)
    absPor(t);
    // P1 · o card (em P3, levantado um instante)
    // (o levantar cresce o cartão em torno da ponta ESQUERDA das fitas, que fica na mesa: é a ponta direita que sobe)
    var a = pousoFolha(t, T.n, POSE_CARD), h = levantado(t), kh = 1 + 0.025 * h;
    CARD.por({ cx: POSE_CARD.cx + (kh - 1) * (CARD.w / 2 + CARD.fita.lado), cy: POSE_CARD.cy - a.dy, rot: a.rot, k: a.k * kh, op: a.op, p: a.p * (1 - h),
      nome: eo(seg(t, T.nome, 0.3)), cargo: eo(seg(t, T.cargo, 0.3)),
      fitaE: eo(seg(t, T.nFitaE, 0.3)), fitaD: eo(seg(t, T.nFitaD, 0.3)) });
    // P2 · o papel da fala: entra, recebe a legenda e as duas expressões, levanta
    var b = entradaFala(t, T.f), l = levantar(t, T.fSai);
    por(E("fala"), FP.cx, FP.cy - b.dy, FP.w, FP.h, FP.rot, b.k * l.k, b.op * l.op);
    sombra(E("falaSombra"), FP.w, FP.h, FP.cx, FP.cy - b.dy, FP.rot, b.k * l.k, b.p * (1 - l.u), b.op * l.op);
    baterLeg(t);
    bater("falaTxt", FALA, t, T.fL);
    // P3 · a folha de 1979 e a régua
    f79Por(t);
    reguaPor(t);
    // P4 · o bilhete
    var c = entradaFala(t, T.nota);
    por(E("nota"), NOTA.cx, NOTA.cy - c.dy, NOTA.w, NOTA.h, NOTA.rot, c.k, c.op);
    sombra(E("notaSombra"), NOTA.w, NOTA.h, NOTA.cx, NOTA.cy - c.dy, NOTA.rot, c.k, c.p, c.op);
    // os créditos
    credito("cred1", eo(seg(t, T.cred1, 0.3)) * (1 - seg(t, T.cred1Sai, 0.3)));
    credito("cred2", eo(seg(t, T.cred2, 0.3)));
    credito("cred3", eo(seg(t, T.cred3, 0.3)));
    aplicarCamera(t, alvoLuz(Math.max(0, t - ATRASO_LUZ)));
  }
  function credito(id, p) {
    var e = E(id); if (!e) return;
    e.style.opacity = p.toFixed(3); e.style.visibility = p > 0.001 ? "visible" : "hidden";
  }

  function erro(msg) {
    window.__erroCena = msg;
    var e = E("erroCena"); if (e) { e.textContent = "CENA COM ERRO — " + msg; e.hidden = false; }
  }
  try { montar(); } catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }

  var __t = 0;
  window.__renderAt = function (t) {
    try { __t = clamp(+t || 0, 0, DUR); cena(__t); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () {
    // só agora a letra tem a face certa: centra a pílula, mede a fala e a legenda, e confere que a fala cabe no papel dela (lição L2)
    CARD.ajustar(); medirFala("falaTxt", FALA); medirLeg();
    var M = MEDIDA.falaTxt;
    if (!M) erro("a fala não foi medida (a face da marca não carregou).");
    else {
      var maior = Math.max.apply(null, M.b.map(function (b) { return b[b.length - 1]; }));
      if (maior + 2 * (44 + RESP.lado) > FP.w + 1) erro("a fala (" + Math.round(maior) + " px) não cabe no papel de " + FP.w + " px.");
      if (M.alt + 96 > FP.h - 50 - 34 + 1) erro("a fala tem " + M.alt + " px de altura e não cabe no papel de " + FP.h + " px.");
    }
    if (!ABSF || !F79 || !GR.rs) erro("uma peça da P3 não foi montada.");
    window.__renderAt(__t); return true;
  });
  // só conferência (a prova vem do DOM e dos quadros): a caixa na tela de cada peça e de cada texto, em t
  window.__s67estado = function (t) {
    window.__renderAt(clamp(+t || 0, 0, DUR));
    function cx(id) { var e = E(id); if (!e) return null; var r = e.getBoundingClientRect(), o = getComputedStyle(e);
      return [Math.round(r.left), Math.round(r.top), Math.round(r.right), Math.round(r.bottom), o.visibility === "hidden" ? 0 : +(+o.opacity).toFixed(2)]; }
    function tx(id) { var e = E(id); if (!e || !e.firstChild) return null; var g = document.createRange(); g.selectNodeContents(e); var r = g.getBoundingClientRect();
      return [Math.round(r.left), Math.round(r.top), Math.round(r.right), Math.round(r.bottom)]; }
    var o = { t: +(+t).toFixed(3), s: +escalaCam(t).toFixed(4), erros: window.__errosRender || 0, ultimo: window.__ultimoErroRender || null, erroCena: window.__erroCena || null,
      card: cx("cardPapel"), cardFe: cx("cardFe"), cardFd: cx("cardFd"), nome: cx("cardNome"), cargo: tx("cardCargo"),
      fala: cx("falaPapel"), wond: tx("wond"), falaTxt: tx("falaTxt"),
      abs: cx("absPapel"), absCab: tx("absCab"), absCabCaixa: ABSF && ABSF.cab ? (function () { var r = ABSF.cab.getBoundingClientRect(); return [Math.round(r.left), Math.round(r.top), Math.round(r.right), Math.round(r.bottom)]; })() : null,
      f79: cx("f79Papel"), f79Tit: tx("f79Tit"), f79Fe: cx("f79Fe"), f79Fd: cx("f79Fd"),
      regua: cx("rsCam"), nota: cx("notaPapel"), notaTxt: tx("notaTxt"),
      cred1: cx("cred1"), cred2: cx("cred2"), cred3: cx("cred3") };
    window.__renderAt(__t);
    return o;
  };
  window.__renderAt(0);
})();
</script>
