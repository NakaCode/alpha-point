    if (depois) { amp = ONDA.amp * Math.exp(-(t - GOTA.tImpacto) / ONDA.tau) * Math.cos(2 * Math.PI * ONDA.hz * (t - GOTA.tImpacto)); if (Math.abs(amp) < 0.02) amp = 0; }
    if (t >= T.volta) amp = 0;
    frascoNivel(M.n, depois ? GOTA.yDepois : GOTA.yAntes, amp, 1);
    gotaPor(t);
  }

  // ═══ b2 · A FOTO em tela cheia: 1,18× o arquivo; o empurrão 1,00 → 1,04 rumo à cabeça, que fica parada na tela ═══
  var FOTO = { w: 3851.52, h: 2888.64, ox: -5.76, oy: -422,          // a foto a 1,18×, e onde o canto de cima à esquerda fica na tela
    cabeca: [0.95, 0.475], k: 1.04 };
  function cenaFoto(t) {
    var im = E("foto"); if (!im) return;
    var s = 1 + (FOTO.k - 1) * seg(t, T.foto, T.volta - T.repouso - T.foto), hx = FOTO.cabeca[0] * FOTO.w, hy = FOTO.cabeca[1] * FOTO.h;
    im.style.transform = "translate(" + f2(FOTO.ox + hx * (1 - s)) + "px," + f2(FOTO.oy + hy * (1 - s)) + "px) scale(" + s.toFixed(5) + ")";
  }

  function ver(e, sim) { if (e) e.style.visibility = sim ? "visible" : "hidden"; }
  function cred(e, v) { if (e) { e.style.opacity = cl(v, 0, 1).toFixed(3); e.style.visibility = v > 0.001 ? "visible" : "hidden"; } }
  function aplicar(t) {
    var tt = t + 0.0005;                              // a folga de ponto flutuante: o quadro de cada corte já é do plano novo
    var noMapa = tt >= T.mapa && tt < T.foto, naFoto = tt >= T.foto && tt < T.volta, naMesa = !noMapa && !naFoto;
    ver(E("cenaMesa"), naMesa); ver(E("cenaFoto"), naFoto);
    if (mapaCarregado) {
      var cam = cameraAt(tt);
      map.jumpTo(cam);
      aplicarCamadas(tt, cam.zoom);
      porPilula(E("taipan"), TAIPAN, 1, 0.5, 0, 0, noMapa ? eo(seg(tt, T.taipan, 0.3)) : 0);
    }
    cred(E("credito"), noMapa ? 1 : 0);                               // [394]: inteiro em todo quadro de mapa
    cred(E("fDado"), noMapa ? eo(seg(tt, T.credDado, 0.3)) : 0);      // [395]
    cred(E("fFoto"), naFoto ? eo(seg(tt, T.credFoto, 0.3)) : 0);      // [396]
    if (naMesa) cenaMesa(tt);
    if (naFoto) cenaFoto(tt);
  }
  try { montarMesa(); } catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }
  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }
  };
  // só conferência (a prova vem dos quadros)
  window.__s68estado = function () {
    return { gota: { volume: +GOTA.vol.toFixed(1), fracao_do_frasco: +GOTA.fracao.toFixed(6), y_antes: +GOTA.yAntes.toFixed(3), y_depois: +GOTA.yDepois.toFixed(3),
      queda_u: +GOTA.queda.toFixed(2), t_queda: +GOTA.tQueda.toFixed(4), t_impacto: +GOTA.tImpacto.toFixed(4) },
      camera_mapa_ini: cameraAt(T.mapa), camera_mapa_fim: cameraAt(T.foto - 1 / 30), erros: window.__errosRender || 0, ultimo: window.__ultimoErroRender || null };
  };

  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou. O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) if (!map.getSource(FONTES[i]) || !map.isSourceLoaded(FONTES[i])) return false;
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
