  // ═══════════════════════════════════════════ fim da ORDENHA DESENHADA ═════════════════════════════════════════════════

  var ONDA = { amp: 1.2, hz: 3.4, tau: 0.20 };       // a superfície no bulbo (ilustrativos; os de s46)
  var LUZ_FOTO = { x: FT.cx, y: FT.cy }, LUZ_DES = { x: ORD.x + 60, y: 960 };

  // o estado físico do líquido em t (função pura): o que já entrou, a base, a onda
  function estadoLiquido(t) {
    var f = seg(t, T.aspira, T.aspiraFim - T.aspira);                         // a fração da gota que já entrou (vazão constante)
    var yb = PIPETA.yBoca * seg(t, T.sobe, T.assenta - T.sobe);               // a base sobe a velocidade constante, da ponta à boca do bulbo
    var yt = pipYDoVol(pipVolAte(yb) + GOTA_V0 * f), noBulbo = yt < PIPETA.yBoca - 0.5;

      amp = ONDA.amp * entrou * (t < T.assenta ? 1 : Math.exp(-(t - T.assenta) / ONDA.tau)) * Math.cos(2 * Math.PI * ONDA.hz * (t - T.sobe));
      if (Math.abs(amp) < 0.02) amp = 0;
    }
    return { f: f, yb: yb, amp: amp };
  }

  // a câmera da mesa: o empurrão rumo à aranha (× 1,04, linear), que fica parada na tela
  var CAM = { k: 1.04 };
  function camAt(t) {
    var s = 1 + (CAM.k - 1) * seg(t, 0, T.empurraFim);
    return { cx: ARANHA.x - (ARANHA.x - 1920) / s, cy: ARANHA.y - (ARANHA.y - 1080) / s, s: s };
  }
  function luz(t) {
    var td = Math.max(0, t - LUZ_ATRASO), a = eb(seg(td, T.luzA, T.luzDur)), b = eb(seg(td, T.luzB, T.luzDur)), p = a - b, lz = E("luz");
    if (!lz) return;
    lz.style.setProperty("--luz-x", f2(lerp(LUZ_FOTO.x, LUZ_DES.x, p) + 1200) + "px");
    lz.style.setProperty("--luz-y", f2(lerp(LUZ_FOTO.y, LUZ_DES.y, p) + 1200) + "px");
  }

  function cena(t) {
    if (!G.pip) return;
    var c = camAt(t), d = deriva(t);
    aplicarCamera(c, d);
    luz(t);
    // a foto impressa: pousa em "adult"; a fita 0,5 s depois
    var pf = pousoFoto(t, T.foto);
    objeto(E("fotoG"), E("fotoSombra"), FT, pf, FT.rot - 0.5 * (1 - pf.p));
    fita(E("fotoFita"), t, T.fita);
    // a etiqueta [404]: 300 ms, opacidade + 24 px de subida
    var et = E("etiqueta"), pe = eo(seg(t, T.etiqueta, 0.3));
    if (et) { et.style.opacity = pe.toFixed(3); et.style.transform = "translate(" + f2(ETQ.x) + "px," + f2(ETQ.y + 24 * (1 - pe)) + "px)"; }
    // o levantar do desenho ("Those"): 1,00 → 1,04 (p³), a sombra solta cresce, some nos últimos 200 ms
    var lv = seg(t, T.levanta, T.levantaDur), kLev = 1 + 0.04 * lv * lv * lv, some = 1 - seg(t, T.levanta + T.levantaDur - 0.2, 0.2);
    var dyS = lerp(12, 64, lv) / c.s, fS = lerp(0.56, 0.25, lv);
    // a presa: o traço se desenha de baixo para cima (a quelícera, depois a presa); a de trás e a aresta cortada no fim
    var p = seg(t, T.presa, T.presaDur), feito = p * G.total, acc = 0;
    presaPor((t >= T.presa ? 1 : 0) * some, kLev, dyS, fS * eo(seg(t, T.presa + T.presaDur - 0.12, 0.3)));
    for (var i = 0; i < G.tracos.length; i++) {
      var tr = G.tracos[i], parte = clamp((feito - acc) / tr.len, 0, 1), tela = tr.len * ORD.k;
      acc += tr.len;
      tr.el.style.strokeDasharray = parte >= 1 ? "none" : (tela * parte).toFixed(1) + " " + (tela * 1.5 + 200).toFixed(1);
      op(tr.el, parte > 0 ? "1" : "0");
    }
    var fim = eo(seg(t, T.presa + T.presaDur - 0.1, 0.3));
    op(G.presa2, (0.45 * fim).toFixed(3)); op(G.quelO, (0.45 * fim).toFixed(3));
    // a pipeta desce pelo eixo e encosta em "milked,"
    var desc = eo(seg(t, T.pipeta, T.pipetaDur));
    pipetaPor(ORD.desce * (1 - desc), Math.min(1, seg(t, T.pipeta, 0.16)) * some, kLev, dyS, fS);
    // o líquido: o que sai da gota entra no vidro
    var L = estadoLiquido(t);
    gota(GOTA_V0 * eo(seg(t, T.gota, T.gotaDur)) * (1 - L.f), t >= T.toca);
    liquido(L.yb, GOTA_V0 * L.f, L.amp);
  }

  try { montar(); } catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e); }
  function creditos(t) {
    var c1 = E("cred1"), c2 = E("cred2");
    if (c1) c1.style.opacity = eo(seg(t, T.cred1, 0.3)).toFixed(3);
    if (c2) c2.style.opacity = eo(seg(t, T.cred2, 0.3)).toFixed(3);
  }
  window.__renderAt = function (t) {
    try { t = clamp(+t || 0, 0, DUR); cena(t); creditos(t); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e); }   // nunca lança
  };

  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  // só conferência (a prova vem do DOM e dos quadros)
  window.__s70estado = function (t) {
    t = clamp(+t || 0, 0, DUR);
    window.__renderAt(t);
    var c = camAt(t), L = estadoLiquido(t), yt = pipYDoVol(pipVolAte(L.yb) + GOTA_V0 * L.f);
    var rg = E("ord") && G.gota ? G.gota.getBoundingClientRect() : null, rp = G.pip ? G.pip.getBoundingClientRect() : null;
    return { camera: { cx: +c.cx.toFixed(2), cy: +c.cy.toFixed(2), s: +c.s.toFixed(5) }, fracao_dentro: +L.f.toFixed(4), base_y: +L.yb.toFixed(2),
      topo_y: +yt.toFixed(2), volume_dentro: +(pipVolAte(yt) - pipVolAte(L.yb)).toFixed(1), volume_gota: +(GOTA_V0 * (1 - L.f)).toFixed(1), v0: +GOTA_V0.toFixed(1),
      gota_tela: rg ? { topo: +rg.top.toFixed(1), pe: +rg.bottom.toFixed(1) } : null, pipeta_tela: rp ? { ponta: +rp.bottom.toFixed(1), topo: +rp.top.toFixed(1) } : null,
      erros: window.__errosRender || 0, ultimo: window.__ultimoErroRender || null };
  };
  window.__renderAt(0);
