  var V0 = 2 * D_ROLA / T.rolaDur, DESAC = V0 / T.rolaDur;   // desaceleração constante, parada exata em hoje (valor ilustrativo)
  function deitada(t) { var tau = clamp(t - T.rola, 0, T.rolaDur); return Math.min(RS_COMPR, L0 + V0 * tau - DESAC * tau * tau / 2); }

  var ANTIGOS = [1930, 1956, 1970];   // apagados a 50 % (os riscos, os frascos e os anos)
  var A50 = 0.5;
  // AS TREZE FICHAS (peça 1): deitadas na tira, à esquerda de 1981; a última termina 24 px antes do risco
  var F13 = { n: 13, fimX: rsX(1981) - 24 };
  F13.x0 = F13.fimX - (F13.n - 1) * FICHA.passo - FICHA.lado;     // 1048
  F13.y = RS.yTopo + (RS.alt - FICHA.lado) / 2;                    // 1228

  // a câmera: tela = (mundo − C) × s + (1920, 1080) + deriva
  var CAM = { cx: 1826, cy: 1090, s0: 1.000, s1: 1.012 };
  function deriva(t) { var td = Math.min(t, T.repouso); return { x: 6 * Math.sin(td * 0.23), y: 4.8 * Math.sin(td * 0.17) }; }
  function camAt(t) {
    var d = deriva(t);
    return { cx: CAM.cx, cy: CAM.cy, s: lerp(CAM.s0, CAM.s1, eb(seg(t, 0, T.camFim))), dx: d.x, dy: d.y };
  }
  function proj(x, y, c) { return { x: (x - c.cx) * c.s + 1920 + c.dx, y: (y - c.cy) * c.s + 1080 + c.dy }; }
  function aplicarCamera(c) {
    var ox = 1920 - c.cx * c.s + c.dx, oy = 1080 - c.cy * c.s + c.dy;
    var m = "matrix(" + c.s.toFixed(5) + ",0,0," + c.s.toFixed(5) + "," + f2(ox) + "," + f2(oy) + ")";
    var mundo = E("mundo"); if (mundo) mundo.setAttribute("transform", m);
    var cam = E("cam"); if (cam) cam.style.transform = m;
    var ss = 1 + (c.s - 1) * PARALAXE;
    var vx = c.cx - c.dx / c.s, vy = c.cy - c.dy / c.s;            // o ponto de mundo no centro do quadro
    var sx = clamp(1920 + (vx - 1920) * PARALAXE, 1920 / ss - MARGEM, 3840 + MARGEM - 1920 / ss);
    var sy = clamp(1080 + (vy - 1080) * PARALAXE, 1080 / ss - MARGEM, 2160 + MARGEM - 1080 / ss);
    var sw = E("stillwrap");
    if (sw) sw.style.transform = "matrix(" + ss.toFixed(5) + ",0,0," + ss.toFixed(5) + "," + f2(1920 - sx * ss) + "," + f2(1080 - sy * ss) + ")";
  }
  // a LUZ da mesa: atrás das fichas e de 1981; com o rolo, anda até o meio do trecho novo; 120 ms atrás (identidade §4.4)
  var LUZ_A = { x: 1500, y: 1180 }, LUZ_B = { x: 2240, y: 1200 };
  function luz(t) {
    var td = Math.max(0, t - LUZ_ATRASO), p = eb(seg(td, T.rola, T.rolaDur));
    var lz = E("luz"); if (!lz) return;
    lz.style.setProperty("--luz-x", f2(lerp(LUZ_A.x, LUZ_B.x, p) + 1200) + "px");
    lz.style.setProperty("--luz-y", f2(lerp(LUZ_A.y, LUZ_B.y, p) + 1200) + "px");
  }

  var G = {};
  function montar() {
    var sombras = E("sombras"), regua = E("regua"), riscos = E("riscos"), fichas = E("fichas"), frascos = E("frascos"), brilhos = E("brilhos");
    if (!sombras || !regua || !riscos || !fichas || !frascos || !brilhos) return;
    G.rs = rsMontar(regua, sombras);
    G.brilho = el("path", { "class": "brilho" }, brilhos);
    G.riscos = {}; G.frascos = {};
    ANTIGOS.concat([1981]).forEach(function (ano) {
      G.riscos[ano] = rsRiscoMontar(riscos);
      G.frascos[ano] = frascoMontar(frascos, sombras);
    });
    G.fichas = [];
    for (var i = 0; i < F13.n; i++) {
      G.fichas.push(el("rect", { "class": "ficha", x: F13.x0 + i * FICHA.passo, y: F13.y, width: FICHA.lado, height: FICHA.lado, rx: FICHA.raio }, fichas));
    }
    // [416] o eixo: UM <text> (o literal do redator), um <tspan> por ano embaixo do seu risco, os espaços em <tspan> próprios
    var anos = E("anos");
    if (anos) {
      G.anos = [];
      var partes = TEXTOS.anos.split(/(\s+)/), k = 0;
      anos.setAttribute("text-anchor", "middle");
      partes.forEach(function (q) {
        if (!q) return;
        var sp = document.createElementNS(SVGNS, "tspan");
        sp.textContent = q;
        anos.appendChild(sp);
        if (/^\s+$/.test(q)) { G.anosEsp = (G.anosEsp || []).concat([{ el: sp, k: k }]); return; }
        G.anos.push({ el: sp, ano: +q }); k++;
      });
    }
  }

  // os textos presos ao mundo: a ponta do risco (mundo) projetada; os anos com o topo das maiúsculas 40 px abaixo dela
  var CAPS = 0.727, TOPO_LINHA = 0.136, BASE_LINHA = 0.863;   // as métricas da Inter (cap height e a linha de 1 em)
  function cena(t) {
    if (!G.rs) return;
    var c = camAt(t);
    aplicarCamera(c);
    luz(t);
    var s = c.s;
    // a fita e o rolo (a sombra do rolo assentada, +12 px na tela)
    var L = deitada(t), fr = rsFita(G.rs, L, 12 / s);
    // o brilho do trecho novo (1981 → a borda esquerda do rolo), em 'forty'
    var xa = fr.xc - fr.r, x81 = rsX(1981);
    G.brilho.setAttribute("d", "M" + f2(x81) + "," + RS.yTopo + " L" + f2(xa) + "," + RS.yTopo + " M" + f2(x81) + "," + RS_YBAIXO + " L" + f2(xa) + "," + RS_YBAIXO);
    op(G.brilho, (0.30 * eo(seg(t, T.brilho, T.brilhoDur))).toFixed(3));
    // os riscos e os frascos: os antigos a 50 %, o de 1981 aceso (todos já assentados: a régua volta inteira)
    ANTIGOS.concat([1981]).forEach(function (ano) {
      var a = ano === 1981 ? 1 : A50;
      rsRisco(G.riscos[ano], ano, 1); op(G.riscos[ano], a.toFixed(3));
      frascoPor(G.frascos[ano], rsX(ano), RS.yTopo, RS.frascoK, a, 0, 12 / s, 0.8 * 0.7);
    });
    // as fichas: deitadas desde o 1º quadro (opacidade 1; o estilo da peça dá a cor)
    // [416] os anos, embaixo de cada risco
    var ponta = proj(0, RS_YBAIXO + RS.riscoAlem, c).y, topoCaps = ponta + RS.rotuloAbaixo;
    var anos = E("anos");
    if (anos && G.anos) {
      anos.setAttribute("opacity", A50.toFixed(3));
      var base = topoCaps + CAPS * 84;
      G.anos.forEach(function (a) { a.el.setAttribute("x", f2(proj(rsX(a.ano), 0, c).x)); a.el.setAttribute("y", f2(base)); });
      (G.anosEsp || []).forEach(function (e) { e.el.setAttribute("x", f2(proj(rsX(ANTIGOS[Math.min(e.k, 2)]), 0, c).x)); e.el.setAttribute("y", f2(base)); });
    }
    // [417] 1981 · FIRST USED: começa 16 px antes do risco 1981, o topo das maiúsculas alinhado com o dos anos
    var c81 = E("c1981");
    if (c81) {
      var p81 = proj(x81 - 16, 0, c);
      c81.style.opacity = "1";
      c81.style.transform = "translate(" + f2(p81.x) + "px," + f2(topoCaps - TOPO_LINHA * 128) + "px)";
    }
    // [418] AT LEAST 13 / DEATHS BEFORE 1981: alinhada à direita 50 px antes do fim da fileira, a base da 2ª linha 40 px acima das
    // tampas dos frascos (a altura do frasco: 192 × 1,35)
    var topoFrasco = proj(0, RS.yTopo - 192 * RS.frascoK, c).y;
    var c13 = E("c13");
    if (c13) {
      var p13 = proj(F13.fimX, 0, c), base2 = topoFrasco - 40, topo = base2 - (128 + 12 + BASE_LINHA * 84);
      c13.style.opacity = "1";
      c13.style.transform = "translate(" + f2(p13.x - 50) + "px," + f2(topo) + "px) translateX(-100%)";
    }
    // [419] NO ONE HAS DIED, / THE PARK SAYS: à direita do frasco de 1981, em cima do trecho aceso; a base da 2ª linha 80 px acima
    // da borda de cima da fita; entra em 'no' (300 ms, + 24 px)
    var cNo = E("cNo");
    if (cNo) {
      var pNo = proj(1830, RS.yTopo, c), bNo = pNo.y - 80, tNo = bNo - (128 + 12 + BASE_LINHA * 84), v = eo(seg(t, T.no, 0.3));
      cNo.style.opacity = v.toFixed(3);
      cNo.style.transform = "translate(" + f2(pNo.x) + "px," + f2(tNo + 24 * (1 - v)) + "px)";
    }
    var v1 = eo(seg(t, T.creds, 0.3)).toFixed(3);
    op(E("cred1"), v1); op(E("cred2"), v1);
  }

  try { montar(); } catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e); }
  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e); }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  // só conferência (a prova vem dos quadros)
  window.__s72estado = function (t) {
    t = clamp(+t || 0, 0, DUR);
    var c = camAt(t), L = deitada(t);
    return { camera: { cx: c.cx, cy: c.cy, s: +c.s.toFixed(5), dx: +c.dx.toFixed(2), dy: +c.dy.toFixed(2) }, deitada: +L.toFixed(1),
      rolo_x: +(RS_XINI + L).toFixed(1), rolo_r: +rsRaio(L).toFixed(2), x1981: rsX(1981), xHoje: RS_XHOJE, fichas_x: [F13.x0, F13.fimX] };
  };
  window.__renderAt(0);
})();
</script>
