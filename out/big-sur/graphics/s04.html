  var LADO = 640, Y0 = 560;
  var Q = [{ x: 1000, y: Y0 }, { x: 2200, y: Y0 }];   // o par centrado em x 1920 (vão de 560 px: os rótulos de 128 px cabem sob cada um)
  function quadradoD(q) { return "M" + q.x + "," + q.y + " H" + (q.x + LADO) + " V" + (q.y + LADO) + " H" + q.x + " Z"; }
  function marcasD(q) {   // as marcas de engenheiro (as da s15): traços de 28 px que saem dos quatro cantos
    var m = 28, x = q.x, y = q.y, s = LADO;
    return "M" + (x - m) + " " + y + "H" + x + "V" + (y - m) + "M" + (x + s) + " " + (y - m) + "V" + y + "H" + (x + s + m) +
      "M" + (x - m) + " " + (y + s) + "H" + x + "V" + (y + s + m) + "M" + (x + s) + " " + (y + s + m) + "V" + (y + s) + "H" + (x + s + m);
  }
  [["q1", "q1Sombra", "q1Marcas", Q[0]], ["q2", "q2Sombra", "q2Marcas", Q[1]]].forEach(function (a) {
    var d = quadradoD(a[3]);
    if (E(a[0])) E(a[0]).setAttribute("d", d);
    if (E(a[1])) E(a[1]).setAttribute("d", d);
    if (E(a[2])) E(a[2]).setAttribute("d", marcasD(a[3]));
  });
  var PERIM = 4 * LADO;

  // ── OS GRÃOS: as posições de repouso, relativas ao quadrado (dentro da margem de 12 % do traço) ──
  // Wyoming: as da s15 (REL_WY, a mesma régua no vídeo); o distrito: seis espalhados por igual (na s15 eles saem da grade real)
  var REL_D = [[0.30, 0.21], [0.76, 0.30], [0.22, 0.56], [0.57, 0.52], [0.83, 0.80], [0.38, 0.84]];
  var REL_W = [[0.22, 0.26], [0.70, 0.20], [0.47, 0.50], [0.18, 0.74], [0.80, 0.63], [0.55, 0.84]];
  var GRAOS = [];
  REL_D.forEach(function (r, i) { GRAOS.push({ x: Q[0].x + r[0] * LADO, y: Q[0].y + r[1] * LADO, solta: 0.020 + 0.026 * i, cor: "destaque" }); });
  REL_W.forEach(function (r, i) { GRAOS.push({ x: Q[1].x + r[0] * LADO, y: Q[1].y + r[1] * LADO, solta: 0.800 + 0.040 * i, cor: "neutro" }); });

  // ── A FÍSICA (estudo-dinamica-objetos, §3–§4): queda livre e quiques por trechos, solução fechada; repouso exato no limiar ──
  var G = 9.81, Z0 = 0.30, REST = 0.35, V_REPOUSO = 0.12, HC = 1.20, RAIO = 22, SOMBRA_PX_M = 200;
  var VOO = (function () {
    var t1 = Math.sqrt(2 * Z0 / G), voos = [{ ini: 0, fim: t1, z0: Z0, v0: 0 }], tt = t1, v = REST * Math.sqrt(2 * G * Z0);
    while (v >= V_REPOUSO) { var d = 2 * v / G; voos.push({ ini: tt, fim: tt + d, z0: 0, v0: v }); tt += d; v *= REST; }
    return { voos: voos, repouso: tt };
  })();
  function altura(tau) {   // z (m) do grão, tau s depois de solto; 0 no repouso; nunca negativo (o contato é no instante z = 0)
    if (tau <= 0) return Z0;
    if (tau >= VOO.repouso) return 0;
    for (var i = 0; i < VOO.voos.length; i++) {
      var f = VOO.voos[i];
      if (tau < f.fim) { var s = tau - f.ini; return Math.max(0, f.z0 + f.v0 * s - G * s * s / 2); }
    }
    return 0;
  }

  // as cores dos papéis, lidas do tokens.css (nenhum hex nesta cena)
  var css = getComputedStyle(document.documentElement);
  function tok(n) { return css.getPropertyValue(n).trim(); }
  function rgbDe(c) {   // "#rrggbb" ou "rgb(a)(…)" → [r, g, b]
    c = String(c || "").trim();
    var m = c.match(/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i);
    if (m) return [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)];
    m = c.match(/rgba?\(\s*([\d.]+)[ ,]+([\d.]+)[ ,]+([\d.]+)/i);
    return m ? [+m[1], +m[2], +m[3]] : [0, 0, 0];
  }
  var COR = { destaque: tok("--destaque"), neutro: tok("--neutro") };
  var SOMBRA = rgbDe(tok("--tinta-escura"));
  function rgba(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a.toFixed(3) + ")"; }

  var CV = E("graos"), CX = CV && CV.getContext ? CV.getContext("2d") : null;
  function estadoGrao(g, t) {
    var tau = t - g.solta;
    if (tau < 0) return null;
    var z = altura(tau), k = HC / (HC - z);
    return { z: z, k: k, r: RAIO * k, aparece: eo(seg(tau, 0, 0.05)), repouso: tau >= VOO.repouso };
  }
  function desenhaGraos(t) {
    if (!CX) return;
    CX.setTransform(1, 0, 0, 1, 0, 0);
    CX.clearRect(0, 0, 3840, 2160);
    // primeiro todas as sombras (estão na mesa), depois os grãos (estão acima dela)
    var es = GRAOS.map(function (g) { return estadoGrao(g, t); });
    GRAOS.forEach(function (g, i) {
      var s = es[i]; if (!s) return;
      var h = s.z / Z0, oy = 3 + SOMBRA_PX_M * s.z, rs = RAIO * (1.15 + 0.5 * h), op = (0.80 - 0.45 * h) * s.aparece;
      var gr = CX.createRadialGradient(g.x, g.y + oy, 0, g.x, g.y + oy, rs);
      gr.addColorStop(0, rgba(SOMBRA, op)); gr.addColorStop(0.55, rgba(SOMBRA, op * 0.85)); gr.addColorStop(1, rgba(SOMBRA, 0));
      CX.fillStyle = gr; CX.beginPath(); CX.arc(g.x, g.y + oy, rs, 0, 2 * Math.PI); CX.fill();
    });
    GRAOS.forEach(function (g, i) {
      var s = es[i]; if (!s) return;
      CX.globalAlpha = s.aparece;
      CX.fillStyle = COR[g.cor];
      CX.beginPath(); CX.arc(g.x, g.y, s.r, 0, 2 * Math.PI); CX.fill();
      CX.globalAlpha = 1;
    });
  }

  // o TEXTO: entra em 300 ms (opacidade + 24 px de subida, ease-out) e fica PARADO; centrado em cx, topo em y
  function texto(id, t, tin, cx, y) {
    var e = E(id); if (!e) return;
    var pi = eo(seg(t, tin, 0.3));
    e.style.opacity = pi.toFixed(3);
    e.style.left = f2(cx) + "px";
    e.style.transform = "translate(-50%," + f2(y + 24 * (1 - pi)) + "px)";
  }
  function credito(id, t, tin) { var e = E(id); if (e) e.style.opacity = eo(seg(t, tin, 0.3)).toFixed(3); }
  // a CÂMERA: push-in contínuo (0,0024/s, base 1,0) que PARA 250 ms antes do corte; a deriva do RIG segue; o still a 0,6
  function camera(t) {
    var c = E("cam"), s = 1 + 0.0024 * Math.min(t, T.repouso), dx = 6 * Math.sin(t * 0.23), dy = 4.8 * Math.sin(t * 0.17);
    if (c) c.style.transform = "scale(" + s.toFixed(5) + ") translate(" + f2(dx) + "px," + f2(dy) + "px)";
    var st = E("still"); if (st) st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ") translate(" + f2(dx * 0.6) + "px," + f2(dy * 0.6) + "px)";
  }

  function cena(t) {
    camera(t);
    // a luz: atrás do quadrado do distrito (o exige da regência), parada (o objeto não anda)
    var lz = E("luz"); if (lz) { lz.style.setProperty("--luz-x", (Q[0].x + LADO / 2 + 140) + "px"); lz.style.setProperty("--luz-y", (Q[0].y + LADO / 2 + 140) + "px"); }
    // o 2º quadrado se traça em "Wyoming." (o traço e a sombra dele juntos), as marcas logo depois
    var p2 = eo(seg(t, T.q2, T.q2Dur)), vis2 = t >= T.q2 ? "1" : "0";
    ["q2", "q2Sombra"].forEach(function (id) {
      var e = E(id); if (!e) return;
      e.style.strokeDasharray = PERIM.toFixed(1);
      e.style.strokeDashoffset = (PERIM * (1 - p2)).toFixed(1);
      e.setAttribute("opacity", id === "q2" ? vis2 : (t >= T.q2 ? "0.8" : "0"));
    });
    var m2 = E("q2Marcas"); if (m2) m2.setAttribute("opacity", eo(seg(t, T.marcas2, 0.15)).toFixed(3));
    desenhaGraos(t);
    texto("rotDistrito", t, T.rot1, Q[0].x + LADO / 2, Q[0].y + LADO + 64);
    texto("rotWyoming", t, T.rot2, Q[1].x + LADO / 2, Q[1].y + LADO + 64);
    texto("legenda", t, T.leg, 1920, Q[0].y + LADO + 64 + 128 + 76);
    credito("cred1", t, T.cred);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  // só conferência: o estado do controlador de cada grão no instante (a prova do contato vem dos quadros, não daqui)
  window.__s04graos = function (t) {
    t = clamp(+t || 0, 0, DUR);
    return GRAOS.map(function (g) { var s = estadoGrao(g, t); return s ? { x: g.x, y: g.y, z_m: +s.z.toFixed(4), raio_px: +s.r.toFixed(2), repouso: s.repouso } : null; });
  };
  window.__s04voo = VOO;
  window.__renderAt(0);
})();
</script>
