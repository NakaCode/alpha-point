    var vd = eo(seg(t, T.distritoAcende, 0.5));

    var vr = 0.40 * entraSai(t, T.relevo[0], T.relevo[1], T.relevo[2], T.relevo[3]);

    if (chaveCaneta !== ultimaCaneta) { map.getSource("caneta").setData(vcan > 0 ? canetaAte(lat) : VAZIO); ultimaCaneta = chaveCaneta; }
    op("caneta", "line-opacity", vcan); op("caneta-sob", "line-opacity", vcan);

  function aplicar(t) {

  var FONTES = ["base", "baseT", "mar", "dem", "bs", "ccds", "sa", "costa", "caneta"];
  window.__aguardarMapa = function (teto) {

  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
