    { id: "rotRes",    ll: [-121.2419, 35.8971], lado: "centro", entra: 11.6, sai: 13.767 },         // dentro da reserva, ao sul da estrada
    { id: "rotCota",   ll: [-121.5738, 35.9389], lado: "direita", entra: 17.267, sai: 20.767 },     // no mar, ao longo da costa sul
    { id: "rotWinter", tela: [200, 160], lado: "esquerda-topo", entra: 28.2, sai: 31.6, troca: true },
    { id: "rotSummer", tela: [200, 160], lado: "esquerda-topo", entra: 31.6, sai: 33.6, troca: true }
  ];
  function naArea(l, tp, w, h) { var r = l + w, b = tp + h; return Math.min(l - 200, 3640 - r, tp - 160, 1880 - b, Math.max(3440 - r, 1760 - b)); }
  function aplicarRotulos(t) {
    ROT.forEach(function (r) {
      var el = E(r.id); if (!el) return;
      var vin, vout;
      if (r.troca) { vin = t >= r.entra ? eo(seg(t, r.entra, 0.3)) : 0; vout = t >= r.sai ? 0 : 1 - seg(t, r.sai - 0.25, 0.25); }
      else if (r.corte) { vin = eo(seg(t, r.entra, 0.3)); vout = t >= r.sai ? 0 : 1; }
      else { vin = eo(seg(t, r.entra, 0.3)); vout = 1 - seg(t, r.sai - 0.25, 0.25); }

      if (r.tela) { x = r.tela[0]; y = r.tela[1]; } else { var p = map.project(r.ll); x = p.x; y = p.y; }
      if (r.lado === "direita") { l = x - w; tp = y - h / 2; }
      else if (r.lado === "baixo") { l = x - w / 2; tp = y - h; }
      else if (r.lado === "centro") { l = x - w / 2; tp = y - h / 2; }
      else { l = x; tp = y; }
      tp += (1 - vin) * 24;
      if (!r.tela) v *= cl(naArea(l, tp, w, h) / 60, 0, 1);
      el.style.opacity = v.toFixed(3);
      el.style.visibility = v > 0 ? "visible" : "hidden";
      el.style.transform = "translate(" + l.toFixed(2) + "px," + tp.toFixed(2) + "px)";
    });
  }

  // ── os três desenhos (b4): traço de engenheiro, --tinta 6 px, sem preenchimento, pés presos ao mapa perto do Big Sur River;
  //    cada um pousa na palavra (desce 48 px em 0,45 s e assenta 1,03 → 1,00), e um fio de --agua desce dele até o rio ──
  var NS = "http://www.w3.org/2000/svg";
  var FIG = [
    { nome: "animal", pe: [-121.76297, 36.2926], rio: [-121.78945, 36.25908] },
    { nome: "planta", pe: [-121.66838, 36.2882], rio: [-121.71648, 36.24993] },
    { nome: "casa",   pe: [-121.69811, 36.19018], rio: [-121.7354, 36.25385] }
  ];
  var DESENHO = {   // pés em (0,0), ~150 px de altura
    animal: "M-75,-75 C-75,-100 45,-102 55,-80 C60,-62 40,-55 -10,-56 C-60,-56 -75,-60 -75,-75 Z M-60,-60 L-62,0 M-40,-57 L-38,0 M25,-57 L22,0 M42,-62 L46,0 M50,-88 L72,-128 L104,-118 L76,-106 M72,-132 L66,-170 M66,-170 L54,-188 M66,-170 L82,-186 M68,-152 L56,-160 M-75,-80 L-90,-94",
    planta: "M0,0 L0,-124 M0,-40 C-30,-50 -60,-80 -60,-110 C-30,-105 -8,-80 0,-58 M0,-70 C30,-80 60,-110 62,-140 C30,-132 8,-108 0,-88 M0,-124 C-14,-142 -10,-162 0,-178 C10,-162 14,-142 0,-124 M-40,0 L40,0",
    casa: "M-70,0 L70,0 L70,-90 L-70,-90 Z M-86,-80 L0,-150 L86,-80 M-18,0 L-18,-48 L18,-48 L18,0"
  };
  (function () {
    var g = E("figs"); if (!g) return falhar("os desenhos não estão no palco.");
    FIG.forEach(function (f, i) {
      var fio = document.createElementNS(NS, "g"); fio.setAttribute("id", "fio" + i); fio.setAttribute("opacity", "0");
      ["fio-sob", "fio"].forEach(function (k) { var p = document.createElementNS(NS, "path"); p.setAttribute("class", k); fio.appendChild(p); });
      g.appendChild(fio);
      var gr = document.createElementNS(NS, "g"); gr.setAttribute("id", "fig" + i); gr.setAttribute("opacity", "0");
      ["tr-sob", "tr"].forEach(function (k) { var p = document.createElementNS(NS, "path"); p.setAttribute("class", k); p.setAttribute("d", DESENHO[f.nome]); gr.appendChild(p); });
      g.appendChild(gr);
    });
  })();
  function aplicarFiguras(t) {
    var sai = 1 - seg(t, CENA.figurasSaem, 0.3);
    FIG.forEach(function (f, i) {
      var gr = E("fig" + i), fio = E("fio" + i); if (!gr || !fio) return;
      var t0 = CENA.figuras[i], u = seg(t, t0, 0.45), v = eo(seg(t, t0, 0.2)) * sai;
      var p = map.project(f.pe), q = map.project(f.rio);
      var y = p.y - 48 * (1 - eo(u)), esc = 1 + 0.03 * (1 - eo(seg(t, t0 + 0.23, 0.22))) * (u > 0.5 ? 1 : 0);
      gr.setAttribute("opacity", v.toFixed(3));
      gr.setAttribute("transform", "translate(" + p.x.toFixed(2) + " " + y.toFixed(2) + ") scale(" + (0.85 * esc).toFixed(4) + ")");
      // o fio de água: do pé do desenho ao ponto do rio, desenhado em 0,3 s depois do pouso
      var fu = eo(seg(t, t0 + 0.45, 0.3)), fx = p.x + (q.x - p.x) * fu, fy = p.y + (q.y - p.y) * fu;
      var d = "M" + p.x.toFixed(1) + "," + p.y.toFixed(1) + " L" + fx.toFixed(1) + "," + fy.toFixed(1);
      fio.setAttribute("opacity", (fu > 0 ? sai : 0).toFixed(3));
      var ps = fio.querySelectorAll("path"); for (var j = 0; j < ps.length; j++) ps[j].setAttribute("d", d);
    });
  }

  // ── a chuva (b5): 48 traços finos em --agua-luz, presos ao chão sobre a serra (as nascentes dos riachos), caindo 1 s ──
  var CHUVA = [];
  (function () {
    var g = E("chuva"); if (!g) return;
    var fontes = CR_C.map(function (c) { return c[0]; });
    for (var k = 0; k < 48; k++) {
      var a = fontes[(k * 7) % fontes.length], ox = ((k * 37) % 11 - 5) * 0.006, oy = ((k * 53) % 9 - 4) * 0.005;
      var el = document.createElementNS(NS, "path"); el.setAttribute("class", "chuva"); el.setAttribute("opacity", "0");
      g.appendChild(el);
      CHUVA.push({ el: el, ll: [a[0] + 0.03 + ox, a[1] + oy], t0: CENA.chuva[0] + ((k * 0.6180339887) % 1) * 0.5 });
    }
  })();
  function aplicarChuva(t) {
    CHUVA.forEach(function (c) {
      var u = seg(t, c.t0, 0.5);
      if (u <= 0 || u >= 1) { c.el.setAttribute("opacity", "0"); return; }
      var p = map.project(c.ll), y = p.y - 90 + 180 * u;
      c.el.setAttribute("d", "M" + (p.x + 14).toFixed(1) + "," + (y - 36).toFixed(1) + " L" + (p.x - 14).toFixed(1) + "," + (y + 36).toFixed(1));
      c.el.setAttribute("opacity", (Math.sin(Math.PI * u) * 0.95).toFixed(3));
    });
  }

  var ultimo = {};
  function dados(id, fc, k) { if (ultimo[id] === k) return; var s = map.getSource(id); if (s) s.setData(fc); ultimo[id] = k; }
  var antes = {};
  function pint(id, prop, v) { if (typeof v === "number") v = +v.toFixed(3); var k = id + "|" + prop; if (antes[k] === v) return; map.setPaintProperty(id, prop, v); antes[k] = v; }

  // a largura dos riachos (px) e do contorno escuro, pelo tempo: 6 → 2 em "small"; 2 → 9 no inverno; 9 → 2 em "Summers"
  function larguraRiacho(t, bsr) {
    var baixa = bsr ? 4 : 2;
    var w = 6 + (baixa - 6) * eio(seg(t, CENA.small, 0.5));
    w += (9 - w) * eio(seg(t, CENA.cheia[0], CENA.cheia[1]));
    w += (2 - w) * eio(seg(t, CENA.verao, CENA.seca));
    return w;
  }
  // as janelas com a luz da correnteza (fora delas, a linha lisa)
  function correnteza(t) {
    if (t >= CENA.riachos.entra + CENA.riachos.norteSul + CENA.riachos.cresce && t < CENA.small) return "BASE";
    if (t >= CENA.cheia[0] + CENA.cheia[1] && t < CENA.verao) return "CHEIA";
    return null;
  }

  function aplicarCena(t) {
    var mapa = t >= CENA.corte;
    // a Highway 1: o fio branco de Carmel à divisa em 1,5 s, e fica até o fim
    var fh = mapa ? eo(seg(t, CENA.hwy.entra, CENA.hwy.dura)) : 0;
    dados("hwy", fcLinha(fh > 0 ? trecho(HWY_C, HWY_L, fh) : null), fh.toFixed(4));
    // a Nacimiento-Fergusson: do interior até a Highway 1, e sai (500 ms) com a volta da câmera
    var fn = mapa ? eio(seg(t, CENA.nf.entra, CENA.nf.chega - CENA.nf.entra)) : 0, vn = 1 - seg(t, CENA.nf.sai, 0.5);
    var cn = fn > 0 && vn > 0 ? trecho(NF_C, NF_L, fn) : null;
    dados("nf", fcLinha(cn), fn.toFixed(4) + vn); dados("nf-g", fcLinha(cn), fn.toFixed(4) + vn);
    pint("nf", "line-opacity", 0.7 * vn); pint("nf-sob", "line-opacity", vn);

    var kc = [], kb;
    var lsCr = CR_C.map(function (c, i) {
      var f = eio(seg(t, R.entra + R.norteSul * CR_RANK[i], R.cresce)); kc.push(f.toFixed(3));
      return f >= 1 ? c : f > 0 ? trecho(c, AG.crBase.rios[i].acc, f) : null;
    });
    var fb = eio(seg(t, R.entra + R.norteSul * BSR_RANK, R.cresce)); kb = fb.toFixed(3);
    dados("cr-g", fcMulti(lsCr), kc.join(","));
    dados("bsr-g", fcMulti([fb >= 1 ? BSR_C : fb > 0 ? trecho(BSR_C, AG.bsrBase.rios[0].acc, fb) : null]), kb);
    var vis = t >= R.entra ? 1 : 0;
    pint("cr-sob", "line-opacity", vis); pint("cr-plano", "line-opacity", vis);
    pint("bsr-sob", "line-opacity", vis); pint("bsr-plano", "line-opacity", vis);
    pint("cr-plano", "line-width", w); pint("cr-linha", "line-width", w); pint("cr-sob", "line-width", w + 8);
    pint("bsr-plano", "line-width", wb); pint("bsr-linha", "line-width", wb); pint("bsr-sob", "line-width", wb + 8);
    pint("cr-linha", "line-opacity", modo ? 1 : 0); pint("bsr-linha", "line-opacity", modo ? 1 : 0);
    if (modo) {
      var T = INSEC + t;
      dados("cr", aguaPecas(modo === "BASE" ? AG.crBase : AG.crCheia, T), modo + T.toFixed(4));
      dados("bsr", aguaPecas(modo === "BASE" ? AG.bsrBase : AG.bsrCheia, T), modo + T.toFixed(4));
    }
  }

  function aplicarCreditos(t) {
    var c = E("credito"), mapa = t >= CENA.corte;
    if (c) { c.style.opacity = mapa ? "1" : "0"; c.style.visibility = mapa ? "visible" : "hidden"; }
    var s = E("credSrc");
    if (s) {
      var v = Math.max(eo(seg(t, 4.467, 0.3)) * (t < 20.767 ? 1 : 0), eo(seg(t, 28.2, 0.3)) * (t < 33.6 ? 1 : 0));
      if (t < CENA.corte) v = 0;
      s.style.opacity = v.toFixed(3); s.style.visibility = v > 0 ? "visible" : "hidden";
    }
  }

  function aplicar(t) {
    var pr = aplicarClipe(t);
    if (!mapaCarregado) return pr;
    map.jumpTo(cameraAt(t));
    var sa = satAlto(t);   // o nível alto só no trecho de perto (z ≥ 10,55 enquanto aparece)
    if (antes.satVis !== (sa > 0)) { map.setLayoutProperty("base", "visibility", sa > 0 ? "visible" : "none"); antes.satVis = sa > 0; }
    pint("base", "raster-opacity", sa);
    aplicarCena(t);
    aplicarRotulos(t);
    aplicarFiguras(t);
    aplicarChuva(t);
    aplicarCreditos(t);
    return pr;
  }
  window.__renderAt = function (t) {
    try { return aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); return Promise.resolve(); }
  };

  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};

  function barrarTileComErro() {

    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);

      };

      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () { capturando = true; if (rafId) cancelAnimationFrame(rafId); return window.__renderAt(0) || true; };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() { if (capturando) return; window.__renderAt(((performance.now() - t0) / 1000) % DUR); rafId = requestAnimationFrame(loop); })();
  }, function () {});
})();
