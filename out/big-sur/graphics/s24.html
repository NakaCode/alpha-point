   plan lies inside the Los Padres National Forest and the Ventana Wilderness. That's federal land, owned by the U.S. Forest Service,
   and in the wilderness, the plan limits land use to backcountry recreation."

  pré-v1 com o que o canal mudou. O que manda: textos-tela.json 71405fb4 (s24, [119]–[125]) no QUE e na grafia; regencia.json e25d0e79
  (cenas[s24], beats 0–2) no TEMPO e no exige; o conceito 143736c0; o espelho 446ffccc; para-passos itens 14 (a área do plano é
  DERIVADA e declarada) e 33 (UMA COR POR TIPO DE TERRA no vídeo inteiro).
  MODO 2D, norte para cima (ofício §5): a frase diz DE QUEM é o chão (área e dono); nada argumenta com a vertical.

  A COR (para-passos item 33, que vence a regência no b1): a terra FEDERAL numa cor só, --contexto-3 (lavanda) a 25 %, com o contorno
  na cor pura a 85 % (4 px): a terra pública do b0 E a floresta nacional do b1. Os parques estaduais ficam no --contexto-1 (s25, s31,
  s38); a área selvagem em HACHURA a 45° (--tinta). A regência pedia a floresta em --contexto-1, que é a cor dos parques: o item 33 é
  desta tarefa e manda o contrário. A reserva Hunter Liggett (s21, federal) já está na lavanda: a mesma família.
  A "floresta por cima" sem mudar só a opacidade (VC-15): em "half" a terra pública que não é floresta se apaga e a floresta fica
  (a mesma cor nas duas, a troca é de território, não de tom): a mancha encolhe até a metade federal.

  O 1º QUADRO é a P-COSTA exata (corte seco do perfil da s23): center [-121.5900, 36.1400], zoom 10.3452, rumo 0, pitch 0, com o
    tracejado do plano (costa-do-plano-1986, --tinta 6 px, 3/2, sobre o contorno de 12 px a 50 %) e o distrito em contorno fraco
    (--destaque a 30 %, 5 px), como a s07 e a s31.
  b0 (0–5,1): a câmera aproxima devagar (+0,025 de zoom por segundo, com arranque suave). Em "public" (3,917) a terra pública
    (terra-publica-costa-big-sur: PAD-US 4.1 Fee FED/STAT/LOC/DIST recortado pela área do plano; para-passos 14) acende em 500 ms;
    "PUBLIC LAND" 3,9–7,2 no mar, com a guia até ela.
  b1 (5,1–11,4): de 5,4 a 6,9 (cúbico, 1,5 s) a câmera fecha sobre a área selvagem; em "half" (5,5–6,0) a terra pública que não é
    floresta se apaga e a floresta nacional (floresta-nacional-los-padres) fica; a cota "≈ HALF FEDERAL LAND / MONTEREY COUNTY PLAN
    (1986)" (duas linhas na mesma pílula) de 5,5 a 11,4, com o crédito do plano de 5,5 ao fim; "LOS PADRES / NATIONAL FOREST" em
    "Los" (7,967); a hachura da área selvagem (area-selvagem-ventana) e "VENTANA / WILDERNESS" em "Ventana" (9,967). Depois, a deriva.
  b2 (11,4–18,967): o tracejado e o distrito saem (11,4–11,9) e entra o fio branco da Highway 1 (highway-1-big-sur, OSM); a câmera
    aproxima, contínua, até o ponto em que a área selvagem chega mais perto da estrada (perto de Lime Creek, 36,126 N); "U.S. Forest
    Service" junto do nome da floresta em "U.S." (13,267); em "wilderness," (15,037) a CASINHA do espectador (traço de engenheiro,
    --tinta) desce para dentro da hachura, toca a borda de cima e é EMPURRADA para fora dela (o amortecimento crítico, sem voltar),
    e para em terra que não é pública, entre a hachura e a estrada, antes de "backcountry" (17,277). Nenhuma estrada dentro da hachura.
    O ponto em que ela tenta pousar e o ponto em que fica são ILUSTRATIVOS (out/big-sur/_tmp/arte-1/M5/casa.py: a 1,4 km para dentro
    da borda, e a 50 % do caminho da borda até a estrada, fora da terra pública); a casa não é nenhuma casa real.
