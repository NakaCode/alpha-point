    // a bateia pousa em "gold": a curva do pouso da foto (desce 240 px, 0,72 → 1,03 → 1,00), sem girar
    var bt = E("bateia");
    if (bt) {
      var d = pousoFoto(t, T.bateia);
      bt.setAttribute("opacity", d.op.toFixed(3));
      bt.setAttribute("transform", "translate(" + BAT.x + " " + (BAT.y - d.dy).toFixed(2) + ") scale(" + (d.k * 1.3).toFixed(4) + ")");
    }
    // os textos fixos no palco
    texto(E("rCab"), t, T.rCab, false, T.rCabFim);
    texto(E("rSeq"), t, T.rSeq, false, T.rSeqFim);
    texto(E("rKil"), t, T.rKil, false);
    texto(E("legTan"), t, T.legTan, false, T.legTanFim);
    aviso(E("avCab"), t, T.avCab); aviso(E("avSeq"), t, T.avSeq); aviso(E("avKil"), t, T.avKil);
    texto(E("cred"), t, T.cred);
  }
  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.stack || e); }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  window.__renderAt(0);
})();
</script>
