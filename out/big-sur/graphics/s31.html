    var vin = t0 === null ? 1 : eo(seg(t, t0, 0.3));
    var vout = t1 === null ? 1 : 1 - eio(seg(t, t1 - 0.3, 0.3));
    return { v: vin * vout, sobe: (1 - vin) * 24 };
  }
  function poe(id, l, tp, t, t0, t1, guarda) {   // a caixa em (l, tp), com a vida de entrada e saída
    var el = E(id); if (!el) return 0;
    var vt = vidaTexto(t, t0, t1);
    var v = vt.v * (guarda ? cl(naArea(l, tp, el.offsetWidth, el.offsetHeight) / 30, 0, 1) : 1);
    if (v <= 0.001) { mostrar(el, 0, 0, 0); return 0; }
    mostrar(el, v, l, tp + vt.sobe);
    return v;
  }
  var Wd = function (id) { var el = E(id); return el ? el.offsetWidth : 0; };
  var Hd = function (id) { var el = E(id); return el ? el.offsetHeight : 0; };

  // ── os créditos: o de mapa INTEIRO do 1º ao último quadro (identidade §4.2); os outros logo acima, cada um no tempo do seu asset ──
  function aplicarCreditos(t) {
    var m = E("credMapa"); if (m) { m.style.opacity = "1"; m.style.visibility = "visible"; }
    var hM = m ? m.offsetHeight : 89;
    (CREDITOS || []).forEach(function (c) {
      var el = E(c.id); if (!el) return;
      var v = eo(seg(t, c.t0, 0.3)) * (c.t1 === null ? 1 : 1 - eio(seg(t, c.t1 - 0.3, 0.3)));
      el.style.bottom = (24 + hM + 6) + "px";
      el.style.opacity = v.toFixed(3); el.style.visibility = v > 0.001 ? "visible" : "hidden";
    });
  }

  var opAntes = {};
  function pintura(id, prop, v) { v = +(+v).toFixed(3); var k = id + "|" + prop; if (opAntes[k] === v) return; map.setPaintProperty(id, prop, v); opAntes[k] = v; }

  function aplicarCasas(t, esc) {
    var C = CENA.casas, vout = 1 - eio(seg(t, C.sai - 0.3, 0.3));
    CASAS.forEach(function (ll, i) {
      var g = E("casa" + i); if (!g) return;
      var t0 = C.t0 + i * C.passo, v = eo(seg(t, t0, 0.3)) * vout;
      if (v <= 0.001) { g.setAttribute("opacity", "0"); return; }
      var p = map.project(ll), sc = esc * (1.04 - 0.04 * eo(seg(t, t0, 0.3)));
      g.setAttribute("transform", "translate(" + p.x.toFixed(2) + " " + p.y.toFixed(2) + ") scale(" + sc.toFixed(4) + ")");
      g.setAttribute("opacity", v.toFixed(3));
    });
    DPTS.forEach(function (ll, i) {
      var c = E("des" + i); if (!c) return;
      var v = eo(seg(t, C.t0 + i * 4 * C.passo, 0.3)) * vout;
      var p = map.project(ll);
      c.setAttribute("cx", p.x.toFixed(2)); c.setAttribute("cy", p.y.toFixed(2)); c.setAttribute("opacity", v.toFixed(3));
    });
  }

  function aplicarCena(t) {
    // o distrito: fora no b0; 50 % no b1, com um pulso em "census district"; 30 % (o contorno fraco da P-COSTA) do b2 ao fim
    var D = CENA.distrito, pu = seg(t, D.pulso, 0.9), bump = Math.sin(Math.PI * pu);
    var opD = 0.5 * eo(seg(t, D.entra, 0.5)) - 0.2 * eio(seg(t, D.volta - 0.3, 0.6));
    // arte-2 (A11): o contorno grosso (14 px sobre o escuro de 22), da entrada até 17,967; afina ao fraco da P-COSTA (5 px, sem o
    // escuro) até 18,567, para o último quadro ser o de antes (a emenda com a s32)
    var gr = 1 - eio(seg(t, D.afina, 0.6));
    pintura("ccd-linha", "line-opacity", opD + (1 - opD) * bump);
    pintura("ccd-linha", "line-width", 5 + (D.grosso - 5) * gr + 8 * bump);
    pintura("ccd-sob", "line-opacity", 0.8 * cl(opD / 0.5, 0, 1) * gr + 0.2 * bump);
    pintura("ccd-sob", "line-width", D.sob + 8 * bump);
    // o parque: --contexto-1 a 25 % (contorno a 85 %) de "Pfeiffers" até FIM
    var Pq = CENA.parque, vPq = eo(seg(t, Pq.t0, 0.5)) * (1 - eio(seg(t, Pq.t1 - 0.3, 0.3)));
    pintura("parque", "fill-opacity", 0.25 * vPq); pintura("parque-linha", "line-opacity", 0.85 * vPq);

    aplicarCasas(t, CENA.casas.escala);
    poe("legenda", 200, 2160 - 290 - Hd("legenda"), t, CENA.legenda.t0, CENA.legenda.t1, false);
    // o número do plano: em cima à direita, sobre a terra sem linha
    var N = CENA.nearly; poe("nearly", N.direita - Wd("nearly"), N.topo, t, N.t0, N.t1, false);
    // a dupla (as posições da s15): o plano parado na tela, sobre o mar da metade sul; o distrito preso ao mapa, à direita dele
    poe("rPlano", CENA.plano.l, CENA.plano.tp, t, CENA.plano.t0, CENA.plano.t1, false);
    var pcd = map.project(CENA.cd.ll);
    poe("rCD", pcd.x, pcd.y - Hd("rCD") / 2, t, CENA.cd.t0, CENA.cd.t1, true);

    // b2–b3: a ponte, o riacho, a miniatura, o aviso e o parque, todos no mar à esquerda, presos à ponte
    var pa = aplicarAnel(t);
    if (!pa) return;
    var lBx = pa.x - 70 - Wd("rBx"), tBx = pa.y - Hd("rBx") / 2;
    poe("rBx", lBx, tBx, t, CENA.bixby.t0, CENA.bixby.t1, true);
    var Mi = CENA.mini, mini = E("mini"), lMi = pa.x - 70 - 600, tMi = tBx + Hd("rBx") + 28;
    var vMi = 0;
    if (mini) {
      vMi = eo(seg(t, Mi.t0, 0.3)) * (1 - eio(seg(t, Mi.t1 - 0.3, 0.3)));
      var sMi = 0.94 + 0.06 * eo(seg(t, Mi.t0, 0.3));
      mini.style.opacity = vMi.toFixed(3); mini.style.visibility = vMi > 0.001 ? "visible" : "hidden";
      mini.style.transform = "translate(" + lMi.toFixed(2) + "px," + tMi.toFixed(2) + "px) scale(" + sMi.toFixed(4) + ")";
      mini.style.transformOrigin = "100% 0%";
    }
    // a guia da miniatura: do anel (fora do traço) ao canto de cima à direita dela
    var dx = (lMi + 600) - pa.x, dy = tMi - pa.y, dd = Math.hypot(dx, dy) || 1;
    guia("guiaMini", [pa.x + dx / dd * 46, pa.y + dy / dd * 46], [lMi + 600 - 6, tMi + 6], vMi);
    poe("aviso", lMi, tMi + 340 + 20, t, CENA.aviso.t0, CENA.aviso.t1, true);
    // o parque: o nome em duas linhas, no mar abaixo da miniatura, preso ao parque por uma guia curta
    var pp = map.project(LL_PARQUE), wPf = Wd("rPf"), hPf = Hd("rPf");
    var tPf = tMi + 340 + 20 + Hd("aviso") + 36, lPf = Math.max(232, pp.x - 210 - wPf);   // 232: a guarda da margem apaga nos últimos 30 px
    var vPf = poe("rPf", lPf, tPf, t, CENA.parque.t0, CENA.parque.t1, true);
    guia("guiaPf", [lPf + wPf - 4, tPf + 40], [pp.x, pp.y], vPf);
  }

  function aplicar(t) {
    if (!mapaCarregado) return;
    map.jumpTo(cameraAt(t));
    aplicarCena(t);
    aplicarCreditos(t);
  }

  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }
  };

  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou. O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  // pronto: os tiles do satélite e as fontes da cena carregados, o mapa parado, dois quadros pintados
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!mapaCarregado || !map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) if (!map.getSource(FONTES[i]) || !map.isSourceLoaded(FONTES[i])) return false;
          if (!map.getSource("base") || !map.isSourceLoaded("base")) return false;
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = mapaCarregado && map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
</body>
</html>
