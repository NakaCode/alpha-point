  // usa a fonte "base" (sem teto) e o largo a "baseT" (teto z10); entre t0 e t1 a de perto esmaece sobre a do teto (eio). Fora da fusão a
  // camada que não está na tela fica com visibility none, e a fonte dela não pede tile.
  var visAntes = {};
  function vis(id, v) { if (visAntes[id] === v) return; map.setLayoutProperty(id, "visibility", v); visAntes[id] = v; }
  function aplicarBase(t) {
    if (typeof BASE_FUSAO === "undefined" || !BASE_FUSAO) return;
    var u = eio(seg(t, BASE_FUSAO[0], BASE_FUSAO[1] - BASE_FUSAO[0]));
    vis("base", u < 1 ? "visible" : "none");
    vis("baseT", u > 0 ? "visible" : "none");
    opac("base", "raster-opacity", 1 - u);
    window.__baseNivel = u <= 0 ? "alto" : u >= 1 ? "teto z10" : "fusão";
  }
  function aplicar(t) {
    if (!mapaCarregado) return;
    // o relevo liga a partir de TERRENO_DESDE (s08: 0,2 s, pitch 0,5°, exagero 0,003): com ele ligado e o pitch 0, o MapLibre escolhia
    // outro nível de tile no canto do quadro, e o 1º quadro da s08 não casava com o último da s07
    var querRelevo = TERRENO && t >= (typeof TERRENO_DESDE === "number" ? TERRENO_DESDE : 0) && t < (typeof TERRENO_ATE === "number" ? TERRENO_ATE : 1e9);   // M12: a janela do relevo (s60: só o P2)
    if (querRelevo && !map.getTerrain()) map.setTerrain({ source: "dem", exaggeration: 0 });
    if (TERRENO && !querRelevo && map.getTerrain()) map.setTerrain(null);
    window.__relevoLigado = querRelevo;
    var cam = cameraAt(t);
    map.jumpTo(cam);
    aplicarBase(t);
    if (querRelevo) {
      // o centro da câmera fica na cota 0 (a s44 do Juneau; Peru s06): a câmera é a mesma em todo render, com ou sem o relevo pronto
      map._elevationFreeze = true;
      if (map.terrain && map.transform.elevation !== 0) map.transform.elevation = 0;
      var ex = exageroAt(t);
      if (map.terrain && Math.abs(map.terrain.exaggeration - ex) > 1e-4) map.terrain.exaggeration = ex;
      window.__exagero = ex;
    }
    aplicarCena(t, cam);
    aplicarCreditos(t);
    if (querRelevo && map.terrain) {
      // A ESPESSURA DAS LINHAS SOBRE O RELEVO (s44 do Juneau): a textura das linhas se refaz em todo quadro, no zoom dele
      var tsc = map.terrain.sourceCache;
      if (!tsc || typeof tsc.freeRtt !== "function") return falhar("o MapLibre desta cena não tem terrain.sourceCache.freeRtt.");
      tsc.freeRtt(); map.triggerRepaint();
    }
  }

  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }
  };

  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou. O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  // pronto: os tiles do satélite, as fontes da cena e (com relevo) o DEM carregados, o terreno ligado, o mapa parado, dois quadros pintados
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!mapaCarregado || !map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) if (!map.getSource(FONTES[i]) || !map.isSourceLoaded(FONTES[i])) return false;
          if (!map.getSource("base") || !map.isSourceLoaded("base")) return false;
          if (window.__relevoLigado && (!map.getSource("dem") || !map.isSourceLoaded("dem") || !map.getTerrain())) return false;
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = mapaCarregado && map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
