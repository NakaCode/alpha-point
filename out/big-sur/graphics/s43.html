/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de
   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();
   Lei: a cena é função pura de t. Nada aqui lê relógio, sorteia ou anda sozinho. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};
    const s = (o.base ?? 1.02) + (o.zoom ?? 0.0024) * t;
    const x = (o.ax ?? 6) * Math.sin(t * 0.23), y = (o.ay ?? 4.8) * Math.sin(t * 0.17);
    el.style.transform = "scale(" + s.toFixed(5) + ") translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
  }
  // Vídeo por f(t): posiciona e espera o "seeked". Na galeria (__PREVIEW) não mexe.
  function seekTo(v, tt) {
    if (!v || window.__PREVIEW || v.readyState < 1) return Promise.resolve();
    const d = v.duration; if (d > 0 && isFinite(d)) tt = clamp(tt, 0, Math.max(0, d - 0.001));
    if (Math.abs(v.currentTime - tt) < 1e-4 && !v.seeking) return Promise.resolve();
    return new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.addEventListener("error", r, { once: true }); v.currentTime = tt; });
  }
  // Grão: ruído de semente fixa por quadro (mulberry32). Mesmo t, mesmo grão.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  function grao(cv, t, o) {
    if (!cv || !cv.getContext) return; o = o || {};
    const ctx = cv.getContext("2d"), w = cv.width, h = cv.height;
    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));
    const img = ctx.createImageData(w, h), d = img.data, a = o.alfa ?? 22;
    for (let i = 0; i < d.length; i += 4) { const v = (sorte() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }
    ctx.putImageData(img, 0, 0);
  }
  // Paleta por vídeo: OBJETO de papéis {acento:"#…"}, montado pelo editor-de-arte. O espelho.paleta é
  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }
  function cor(v) { return typeof CSS !== "undefined" && CSS.supports ? CSS.supports("color", v) : /^#[0-9a-f]{3,8}$|^(rgb|hsl)a?\(/i.test(v); }
  function paleta(p) {
    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));
    }
  }
  // Prontidão: <img>, <image> de SVG e TODAS as faces "Marca"/"MarcaSec". Nunca rejeita: o que falhou
  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();

    if (err.falha === "tempo") return "não respondeu em " + PRAZO_TENTATIVA / 1000 + " s" + n + ".";
    if (st === 401 || st === 403) return "recusou o acesso (HTTP " + st + ").";
    if (st === 429) return "limitou as requisições (HTTP 429)" + n + ".";
    if (st >= 500) return "está com erro no servidor (HTTP " + st + ")" + n + ".";
    if (st) return "respondeu HTTP " + st + ".";
    return "não respondeu" + n + ".";
  }
  var mapaCarregado = false;
  map.on("error", function (ev) {
    window.__errosMapa++;
    var err = (ev && ev.error) || {}, msg = String(err.message || "");
    var deRede = err.status || err.url || (ev && ev.tile) || /fetch|network|failed to load|load failed|cors/i.test(msg);
    if (!deRede) return falhar("o MapLibre acusou erro na cena: " + (msg || "sem descrição") + ".");
    var fonte = ev && ev.sourceId ? " (fonte '" + ev.sourceId + "')" : "";
    falhar("a base '" + P.nome + "'" + fonte + " " + motivoRede(err, msg) + (err.url ? " URL: " + String(err.url).split("?")[0] : ""));
  });
  map.on("load", function () {
    mapaCarregado = true;
    window.__renderAt(0);
    map.once("idle", function () { if (!window.__erroCena) resolverPronto(true); });
  });

  // ── as guias (do rótulo ao território) e a área segura ──
  function guia(id) {
    var g = document.createElementNS(NS, "g"); g.setAttribute("id", id); g.setAttribute("opacity", "0");
    ["guia-sob", "guia"].forEach(function (c) { var p = document.createElementNS(NS, "path"); p.setAttribute("class", c); g.appendChild(p); });
    var m = document.createElementNS(NS, "circle"); m.setAttribute("class", "ponta"); m.setAttribute("r", "12"); g.appendChild(m);
    E("guias").appendChild(g); return g;
  }
  function naArea(l, tp, w, h) { var r = l + w, b = tp + h; return Math.min(l - 200, 3640 - r, tp - 160, 1880 - b, Math.max(3440 - r, 1760 - b)); }
  function vidaTexto(t, t0, t1) {
    var vin = eo(seg(t, t0, 0.3)), vout = t1 === null ? 1 : 1 - eio(seg(t, t1 - 0.3, 0.3));
    return { v: vin * vout, sobe: (1 - vin) * 24 };
  }
  // ROT: a pílula parada na TELA enquanto se lê (o canto de cima à esquerda em [x, y]); a guia prende o rótulo a um ponto dentro da
  // terra pública (a floresta nacional, ao norte do vale do Big Sur: terra federal do PAD-US)
  var ROT = [
    { id: "rotCota", vida: T.cota,   tela: [230, 1000], ancora: null },
    { id: "rotPub",  vida: T.rotPub, tela: [230, 1510], ancora: [-121.6600, 36.1900], lado: "dir" }   // A1 (sala-decisoes-qualidade-1): era [-121.62, 36.19]; a guia termina dentro da terra pública
  ];
  ROT.forEach(function (r) { if (r.ancora) r.g = guia("guia-" + r.id); });
  function aplicarRotulos(t) {
    ROT.forEach(function (r) {
      var el = E(r.id); if (!el) return;
      var vt = vidaTexto(t, r.vida[0], r.vida[1]), w = el.offsetWidth, h = el.offsetHeight;
      var l = r.tela[0], tp = r.tela[1] + vt.sobe;
      var v = vt.v * clamp(naArea(l, tp, w, h) / 30, 0, 1);
      el.style.opacity = v.toFixed(3); el.style.visibility = v > 0.001 ? "visible" : "hidden";
      el.style.transform = "translate(" + l.toFixed(2) + "px," + tp.toFixed(2) + "px)";
      if (!r.g) return;
      var q = map.project(r.ancora), ex = r.lado === "dir" ? l + w : l, ey = tp + h / 2;
      var gu = eo(seg(t, r.vida[0], 0.4));
      var d = "M" + ex.toFixed(1) + "," + ey.toFixed(1) + " L" + (ex + (q.x - ex) * gu).toFixed(1) + "," + (ey + (q.y - ey) * gu).toFixed(1);
      var ps = r.g.querySelectorAll("path"); for (var j = 0; j < ps.length; j++) ps[j].setAttribute("d", d);
      var m = r.g.querySelector("circle"); if (m) { m.setAttribute("cx", q.x.toFixed(1)); m.setAttribute("cy", q.y.toFixed(1)); m.setAttribute("opacity", gu >= 1 ? "1" : "0"); }
      r.g.setAttribute("opacity", v.toFixed(3));
    });
  }
  // os créditos do mapa: o de mapa INTEIRO do 1º ao último quadro de mapa (identidade §4.2); o do plano logo acima, no tempo do seu texto
  function aplicarCreditos(t) {
    var m = E("credMapa"), noMapa = t >= CUT;
    if (m) { m.style.opacity = noMapa ? "1" : "0"; m.style.visibility = noMapa ? "visible" : "hidden"; }
    var hM = m ? m.offsetHeight : 89, s = E("credPlano");
    // [238] entra INTEIRO no 1º quadro do mapa (sem os 300 ms de entrada: o [235] da folha acabou de sair inteiro no corte) e sai em 300 ms até o t1
    if (s) { var v = (noMapa ? 1 : 0) * (1 - eio(seg(t, T.credPlano[1] - 0.3, 0.3))); s.style.bottom = (24 + hM + 6) + "px"; s.style.opacity = v.toFixed(3); s.style.visibility = v > 0.001 ? "visible" : "hidden"; }
  }

  var antes = {};
  function pint(id, prop, v) { if (typeof v === "number") v = +v.toFixed(3); var k = id + "|" + prop; if (antes[k] === v) return; map.setPaintProperty(id, prop, v); antes[k] = v; }
  function aplicarMapa(t) {
    if (!mapaCarregado) return;
    map.jumpTo(cameraAt(t));
    var aPub = eo(seg(t, T.pub, 0.5));
    pint("pub", "fill-opacity", 0.25 * aPub);
    var vPlano = Math.min(eo(seg(t, T.plano[0], 0.001)), 1 - eo(seg(t, T.plano[1] - 0.3, 0.3)));
    pint("plano-sob", "line-opacity", 0.5 * vPlano); pint("plano", "line-opacity", vPlano);
    // só para a conferência (as linhas acesas neste instante, que nenhum rótulo pode cobrir; identidade §6)
    window.__linhasAcesas = { "costa-do-plano-1986-trecho": 1, "costa-do-plano-1986": vPlano > 0, "terra-publica-costa-big-sur": aPub > 0, "highway-1-big-sur": 1 };
    aplicarRotulos(t);
    aplicarCreditos(t);
  }
  function cena(t) {
    cenaDoc(t);
    aplicarMapa(t);
    return Promise.resolve();
  }
  window.__renderAt = function (t) {
    try { return cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); return Promise.resolve(); }
  };

  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) if (!map.getSource(FONTES[i]) || !map.isSourceLoaded(FONTES[i])) return false;
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  // ── a prontidão do documento: o RIG (o still e as faces Marca/MarcaSec) e as duas faces da Courier Prime ──
  var fontesDoc = [
    document.fonts.load('400 86px "MarcaDoc"').then(function (f) { if (!f.length) window.__fontesFaltando.push("MarcaDoc 400 (Courier Prime da folha)"); }, function () { window.__fontesFaltando.push("MarcaDoc 400 (Courier Prime da folha)"); }),
    document.fonts.load('700 84px "MarcaDoc"').then(function (f) { if (!f.length) window.__fontesFaltando.push("MarcaDoc 700 (Courier Prime do cabeçalho)"); }, function () { window.__fontesFaltando.push("MarcaDoc 700 (Courier Prime do cabeçalho)"); })
  ];
  window.__fotosProntas = Promise.all([R.prontas()].concat(fontesDoc)).then(function () { window.__renderAt(0); return true; });

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () { capturando = true; if (rafId) cancelAnimationFrame(rafId); return window.__renderAt(0) || true; };
  window.__renderAt(0);
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() { if (capturando) return; window.__renderAt(((performance.now() - t0) / 1000) % DUR); rafId = requestAnimationFrame(loop); })();
  }, function () {});
})();
