      var li = E("pl" + i); if (li) { li.setAttribute("d", "M" + OLHO[0] + "," + OLHO[1] + " L" + tx[0] + "," + tx[1]); var Ll = Math.hypot(tx[0] - OLHO[0], tx[1] - OLHO[1]); li.setAttribute("data-l", Ll.toFixed(1)); }
    });
  })();
  function aplicarPerfil(t) {
    var C = CENA, on = t >= C.corteSeco, pf = E("perfil");
    if (pf) { pf.style.opacity = on ? "1" : "0"; pf.style.visibility = on ? "visible" : "hidden"; }
    var lg2 = E("legP"); if (lg2) { var v2 = on ? 1 : 0; lg2.style.opacity = String(v2); lg2.style.visibility = v2 ? "visible" : "hidden"; lg2.style.transform = "translate(200px," + (1880 - 24 - lg2.offsetHeight) + "px)"; }
    if (!on) return;
    var u = eio(seg(t, C.corteSeco, 0.7));
    var enc = E("encosta"); if (enc) enc.setAttribute("stroke-dashoffset", ((PF.L || 4200) * (1 - u)).toFixed(1));
    var h = E("hachura"); if (h) h.setAttribute("opacity", eo(seg(t, C.corteSeco + 0.5, 0.4)).toFixed(3));
    var on2 = E("ondas"); if (on2) on2.setAttribute("opacity", eo(seg(t, C.corteSeco, 0.4)).toFixed(3));

    var cp = E("carroP"); if (cp) { var vc = eo(seg(t, C.corteSeco + 0.3, 0.3)); cp.setAttribute("opacity", vc.toFixed(3)); cp.setAttribute("transform", "translate(1310," + (1180 - 4 - 24 * (1 - vc)).toFixed(1) + ")"); }
    var ar = E("arvores"); if (ar) { var va = eo(seg(t, 17.1, 0.3)); ar.setAttribute("opacity", va.toFixed(3)); ar.setAttribute("transform", "translate(0," + (24 * (1 - va)).toFixed(1) + ")"); }
    var ceu = E("ceu"); if (ceu) ceu.setAttribute("opacity", (0.8 * eo(seg(t, 20.34, 0.4))).toFixed(3));
    CASAS.forEach(function (c, i) {

      if (g) { g.setAttribute("opacity", eo(seg(t, c.t, 0.2)).toFixed(3)); g.setAttribute("transform", "translate(" + c.x + " " + (c.y - 7 - 48 * (1 - eo(uc))).toFixed(1) + ") scale(" + esc.toFixed(4) + ")"); }
      if (li) { var ul = eo(seg(t, c.linha, 0.3)), Ll = +li.getAttribute("data-l"); li.setAttribute("opacity", ul > 0 ? "1" : "0");
        li.setAttribute("stroke-dasharray", "18 14"); li.setAttribute("stroke-dashoffset", "0");
        li.style.clipPath = "none"; li.setAttribute("d", "M" + OLHO[0] + "," + OLHO[1] + " L" + (OLHO[0] + ((c.ok ? c.bloqueio[0] : c.x) - OLHO[0]) * ul).toFixed(1) + "," + (OLHO[1] + ((c.ok ? c.bloqueio[1] : c.y - 150) - OLHO[1]) * ul).toFixed(1)); }
      // o sinal acima da casa; o da crista, à direita do telhado (acima dele, passaria da margem de 160 px do topo)
      var sx = i === 2 ? c.x + 190 : c.x, sy = i === 2 ? c.y - 95 : c.y - 230;
      if (si) { var us = eo(seg(t, c.sinal, 0.3)); si.setAttribute("opacity", us.toFixed(3)); si.setAttribute("transform", "translate(" + sx + " " + (sy - 24 * (1 - us)).toFixed(1) + ")"); }
    });
  }

  function aplicar(t) {
    if (!mapaCarregado) return Promise.resolve();
    // o relevo liga a partir de TERRENO_DESDE (s08: 0,2 s, pitch 0,5°, exagero 0,003): com ele ligado e o pitch 0, o MapLibre escolhia
    // outro nível de tile no canto do quadro, e o 1º quadro da s08 não casava com o último da s07

    aplicarCreditos(t);

      var tsc = map.terrain.sourceCache;

    return volta;
  }

  // a prova do trecho de perto (retomada-teto.md, item 1): o menor nível de tile do satélite que a câmera de t pede (os tiles que cobrem o
  // quadro, com o relevo), sem esperar tile nenhum

  };

    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  // pronto: os tiles do satélite, as fontes da cena e (com relevo) o DEM carregados, o terreno ligado, o mapa parado, dois quadros pintados
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!mapaCarregado || !map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) if (!map.getSource(FONTES[i]) || !map.isSourceLoaded(FONTES[i])) return false;
          var usaB = map.getLayoutProperty("base", "visibility") !== "none", usaA = map.getLayer("baseAlta") && map.getLayoutProperty("baseAlta", "visibility") !== "none";

        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = mapaCarregado && map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;

        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
