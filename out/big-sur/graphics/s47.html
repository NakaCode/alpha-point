    if (st >= 500) return "está com erro no servidor (HTTP " + st + ")" + n + ". Tente de novo mais tarde.";
    if (st) return "respondeu HTTP " + st + ".";
    return "não respondeu (sem internet? servidor fora do ar? firewall?)" + n + ".";
  }
  var mapaCarregado = false;
  map.on("error", function (ev) {
    window.__errosMapa++;
    var err = (ev && ev.error) || {};
    var msg = String(err.message || "");
    var deRede = err.status || err.url || (ev && ev.tile) || /fetch|network|failed to load|load failed|cors/i.test(msg);
    if (!deRede) return falhar("o MapLibre acusou erro na cena: " + (msg || "sem descrição") + ".");
    var fonte = ev && ev.sourceId ? " (fonte '" + ev.sourceId + "')" : (mapaCarregado ? "" : " (o estilo do mapa)");
    falhar("a base '" + P.nome + "'" + fonte + " " + motivoRede(err, msg) + (err.url ? " URL: " + String(err.url).split("?")[0] : ""));
  });
  map.on("load", function () {
    window.__fotosProntas.then(function () {
      mapaCarregado = true;
      window.__renderAt(0);
      map.once("idle", function () { if (!window.__erroCena) resolverPronto(true); });
    });
  });

  // ── as peças desenhadas (SVG): as células, as 85 cheias, os carrinhos, as casinhas ──
  var SVGNS = "http://www.w3.org/2000/svg";
  function svgEl(tag, at, pai) { var el = document.createElementNS(SVGNS, tag); for (var k in at) el.setAttribute(k, at[k]); if (pai) pai.appendChild(el); return el; }
  var gCar = E("gCarros"), gCas = E("gCasas");
  (function () {   // as 99 divisórias num path só
    var d = "";
    for (var k = 1; k < 100; k++) d += "M" + (400 + 30 * k) + " 1180 V1300 ";
    var p = E("celulas"); if (p) p.setAttribute("d", d);
  })();
  var CARRO_D = "M-34 10 H34 V-4 H14 L4 -18 H-16 L-26 -4 H-34 Z M-20 10 a7 7 0 1 0 0.01 0 M20 10 a7 7 0 1 0 0.01 0";
  for (var ci = 0; ci < CENA.carros.n; ci++) {
    var gc = svgEl("g", { id: "carro" + ci, opacity: 0 }, gCar);
    svgEl("path", { "class": "carro-sob", d: CARRO_D }, gc);
    svgEl("path", { "class": "carro", d: CARRO_D }, gc);
  }
  var CASA_D = "M-18 -2 V24 H18 V-2 M-23 0 L0 -22 L23 0";   // a casinha da s07/s31 (a mesma forma do vídeo)
  for (var hk = 0; hk < CENA.casas.n; hk++) {
    var gh = svgEl("g", { id: "casa" + hk, opacity: 0 }, gCas);
    svgEl("path", { "class": "casa-sob", d: CASA_D }, gh);
    svgEl("path", { "class": "casa", d: CASA_D }, gh);
  }

  function mostrar(el, v, l, tp) {
    el.style.opacity = v.toFixed(3);
    el.style.visibility = v > 0.001 ? "visible" : "hidden";
    el.style.transform = "translate(" + l.toFixed(2) + "px," + tp.toFixed(2) + "px)";
  }
  function vidaTexto(t, t0, t1) {
    var vin = t0 === null ? 1 : eo(seg(t, t0, 0.3));
    var vout = t1 === null ? 1 : 1 - eio(seg(t, t1 - 0.3, 0.3));
    return { v: vin * vout, sobe: (1 - vin) * 24 };
  }
  function poe(id, l, tp, t, t0, t1) {   // a caixa em (l, tp), com a vida de entrada (300 ms, + 24 px) e saída
    var el = E(id); if (!el) return 0;
    var vt = vidaTexto(t, t0, t1);
    if (vt.v <= 0.001) { mostrar(el, 0, 0, 0); return 0; }
    mostrar(el, vt.v, l, tp + vt.sobe);
    return vt.v;
  }
  var Wd = function (id) { var el = E(id); return el ? el.offsetWidth : 0; };
  var larguraP15 = null;   // a largura natural do "≤ 15% ", medida uma vez

  // ── os créditos: o de mapa INTEIRO do 1º ao último quadro (identidade §4.2); o do plano logo acima, no tempo do seu texto ──
  function aplicarCreditos(t) {
    var m = E("credMapa"); if (m) { m.style.opacity = "1"; m.style.visibility = "visible"; }
    var hM = m ? m.offsetHeight : 89;
    var el = E("credPlano"); if (!el) return;
    var C = CENA.credPlano, v = eo(seg(t, C.t0, 0.3)) * (1 - eio(seg(t, C.t1 - 0.3, 0.3)));
    el.style.bottom = (24 + hM + 6) + "px";
    el.style.opacity = v.toFixed(3); el.style.visibility = v > 0.001 ? "visible" : "hidden";
  }

  var opAntes = {};
  function pintura(id, prop, v) { v = +(+v).toFixed(3); var k = id + "|" + prop; if (opAntes[k] === v) return; map.setPaintProperty(id, prop, v); opAntes[k] = v; }
  function op(el, v) { if (el) el.setAttribute("opacity", (+v).toFixed(3)); }

  // ── o fio que vira faixa ──
  function aplicarFio(t) {
    var F = CENA.fio;
    var grosso = eo(seg(t, F.engrossa, F.dEngrossa));          // 6 → 60 px
    var m = eio(seg(t, F.desenrola, F.dDesenrola));            // 0 = o fio no mapa · 1 = a reta em y 1240
    var vira = eio(seg(t, F.vira, F.dVira));                   // a barra branca dissolve na faixa
    var w = 6 + 54 * grosso + 60 * vira;
    var d = "";
    for (var i = 0; i < HC.length; i++) {
      var p = map.project(HC[i]);
      var x = p.x + (400 + 3000 * S[i] - p.x) * m, y = p.y + (1240 - p.y) * m;
      d += (i ? "L" : "M") + f1(x) + " " + f1(y);
    }
    var fio = E("fio"), sob = E("fioSob"), g = E("gFio");
    if (fio) { fio.setAttribute("d", d); fio.setAttribute("stroke-width", f1(w)); }
    if (sob) { sob.setAttribute("d", d); sob.setAttribute("stroke-width", f1(w + 8)); }
    op(g, 1 - vira);
    return vira;
  }

  // ── a faixa, as células, as cheias (b3), a saída de tudo no fim ──
  function aplicarFaixa(t, vira, vFim) {
    op(E("gFaixa"), vira * vFim);
    var C = CENA.celulas, Q = CENA.cheias;
    var cr = E("clipCelRect"); if (cr) cr.setAttribute("width", f1(3000 * eo(seg(t, C.t0, C.d))));          // as divisórias, da esquerda para a direita
    var ch = E("cheias"); if (ch) ch.setAttribute("width", f1(30 * Q.n * eo(seg(t, Q.t0, Q.d))));           // as 85 células, da esquerda para a direita
  }

  // ── b1: a barra dos visitantes, a seta dupla e as duas pílulas ──
  function aplicarBarra(t) {
    var B = CENA.barra, Sx = CENA.seta;
    var v = eo(seg(t, B.t0, 0.3)) * (1 - eio(seg(t, CENA.p29.t1 - 0.3, 0.3)));
    op(E("gBarra"), v);
    var r = E("barra"); if (r) r.setAttribute("width", f1(B.w * eo(seg(t, B.t0, B.d))));
    var s = E("seta"); if (s) {
      var k = eo(seg(t, Sx.t0, Sx.d)), x1 = Sx.x0 + (Sx.x1 - Sx.x0) * k, y = Sx.y;
      if (k <= 0.001) s.setAttribute("d", "");
      else {
        var hd = Math.min(34, (x1 - Sx.x0) / 2);
        s.setAttribute("d", "M" + f1(Sx.x0) + " " + y + " L" + f1(x1) + " " + y +
          " M" + f1(x1 - hd) + " " + (y - hd) + " L" + f1(x1) + " " + y + " L" + f1(x1 - hd) + " " + (y + hd) +
          " M" + f1(Sx.x0 + hd) + " " + (y - hd) + " L" + f1(Sx.x0) + " " + y + " L" + f1(Sx.x0 + hd) + " " + (y + hd));
      }
    }
    var A = CENA.p29; poe("p29", A.l, A.tp, t, A.t0, A.t1);
    var D = CENA.pDup; poe("pDup", D.l, D.tp, t, D.t0, D.t1);
  }

  // ── b2: os carrinhos entram pela esquerda, enchem a faixa e param em "jams" ──
  function aplicarCarros(t) {
    var C = CENA.carros;
    var v = eo(seg(t, C.t0, 0.3)) * (1 - eio(seg(t, C.sai - 0.3, 0.3)));
    op(gCar, v);
    if (v <= 0.001) return;
    var chegada = eo(seg(t, C.t0, C.dEntra));   // velocidade zero em "jams"
    for (var i = 0; i < C.n; i++) {
      var g = E("carro" + i); if (!g) continue;
      var x = C.x0 + i * C.passo - C.desloc * (1 - chegada);
      g.setAttribute("transform", "translate(" + f1(x) + " 1240) scale(1.15)");
      g.setAttribute("opacity", eo(seg(t, C.t0 + i * 0.006, 0.25)).toFixed(3));
    }
  }

  // ── b4: as 15 casinhas pousam nas 15 células que sobram; a pílula das casas, com o "≤ 15%" que entra ──
  function aplicarCasas(t, vFim) {
    var C = CENA.casas;
    op(gCas, vFim);
    for (var k = 0; k < C.n; k++) {
      var g = E("casa" + k); if (!g) continue;
      var e = eo(seg(t, C.t0 + k * C.passo, 0.3));
      var cx = 400 + 30 * (85 + k) + 15, cy = 1240 - 24 * (1 - e);
      g.setAttribute("transform", "translate(" + f1(cx) + " " + f1(cy) + ") scale(" + C.escala + ")");
      g.setAttribute("opacity", e.toFixed(3));
    }
    var sp = E("p15"), pc = E("pCasas");
    if (sp && pc) {
      if (larguraP15 === null) { sp.style.width = "auto"; larguraP15 = sp.scrollWidth; sp.style.width = "0px"; }
      var e15 = eo(seg(t, CENA.p15.t0, 0.3));
      sp.style.width = (larguraP15 * e15).toFixed(1) + "px";
      sp.style.opacity = e15.toFixed(3);
      sp.style.transform = "translateY(" + ((1 - e15) * 24).toFixed(1) + "px)";
      // a pílula ancorada à ESQUERDA onde a forma final termina em x 3400: o "NEW HOMES" fica parado, o sufixo desliza 300 ms
      var P = CENA.pCasas, wFinal = Wd("pCasas") - larguraP15 * e15 + larguraP15;
      poe("pCasas", P.r - wFinal, P.tp, t, P.t0, P.t1);
    }
    var A = CENA.p85; poe("p85", A.l, A.tp, t, A.t0, A.t1);
  }

  function aplicarCena(t) {
    // o mapa: claro no b0, escuro a 35 % sob a faixa, de volta ao brilho no recuo
    var Es = CENA.escuro, esc = eio(seg(t, Es.t0, Es.d)), volta = eio(seg(t, CENA.cam.tRecuo, CENA.cam.dRecuo));
    var opMapa = 1 - (1 - Es.nivel) * esc * (1 - volta);
    var mp = E("map"); if (mp) mp.style.opacity = opMapa.toFixed(3);
    // o tracejado do plano entra no recuo (a P-COSTA do setor: o tracejado posto e o distrito em contorno fraco)
    var vPl = eo(seg(t, CENA.plano.entra, CENA.plano.d));
    pintura("plano", "line-opacity", vPl); pintura("plano-sob", "line-opacity", 0.5 * vPl);
    // a passagem alto → teto z10: a fusão das duas camadas raster em 0,6 s (o trecho LARGO do recuo); a água escura já está desde o 1º quadro
    var fus = eo(seg(t, CENA.teto.t0, CENA.teto.d));
    pintura("base", "raster-opacity", 1 - fus); pintura("baseTeto", "raster-opacity", fus);
    var vFim = 1 - eio(seg(t, FIM - 0.3, 0.3));
    var vira = aplicarFio(t);
    aplicarFaixa(t, vira, vFim);
    aplicarBarra(t);
    aplicarCarros(t);
    aplicarCasas(t, vFim);
  }

  function aplicar(t) {
    if (!mapaCarregado) return;
    window.__tAtual = t;
    map.jumpTo(cameraAt(t));
    aplicarCena(t);
    aplicarCreditos(t);
  }
  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.stack || e); }
    return Promise.resolve();
  };

  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou. O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  // pronto: os tiles do satélite e as fontes da cena carregados, o mapa parado, dois quadros pintados (o rig da s31)
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!mapaCarregado || !map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) if (!map.getSource(FONTES[i]) || !map.isSourceLoaded(FONTES[i])) return false;
          if (!map.getSource("base") || !map.isSourceLoaded("base")) return false;
          if (!map.getSource("baseTeto") || !map.isSourceLoaded("baseTeto")) return false;
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = mapaCarregado && map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
</body>
</html>
