/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.

  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.

  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }

    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));

    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");

    var g = svgEl("g", { id: "casa" + i, opacity: 0 }, gCasas);
    svgEl("path", { "class": "casa-sob", d: "M-18 -2 V24 H18 V-2 M-23 0 L0 -22 L23 0" }, g);
    svgEl("path", { "class": "casa", d: "M-18 -2 V24 H18 V-2 M-23 0 L0 -22 L23 0" }, g);
  });
  // A LINHA DO TEMPO (a peça da marca em y 1700, na escala da s33): o eixo de x 260 a 3400, a seta para a direita; o ano vira x pela
  // escala de 1880 a 1990 (27,55 px por ano); a marca dos anos 1880 no tique de 1885
  var TL = { y: 1700, x0: 260, x1: 3400, ano0: 1880, ano1: 1990 };
  function xAno(a) { return TL.x0 + (a - TL.ano0) * (TL.x1 - 110 - TL.x0) / (TL.ano1 - TL.ano0); }
  var MARCAS = [{ id: "tl1880", ano: 1885 }, { id: "tl1919", ano: 1919 }, { id: "tl1937", ano: 1937 }, { id: "tl1965", ano: 1965 }, { id: "tl1986", ano: 1986 }];
  var gTl = svgEl("g", { id: "linhaTempo", opacity: 0 }, OV);
  var tlEixo = ["eixo-tl-sob", "eixo-tl"].map(function (cls) { return svgEl("path", { "class": cls, d: "" }, gTl); });
  var tlSeta = ["eixo-tl-sob", "eixo-tl"].map(function (cls) { return svgEl("path", { "class": cls, d: "M" + (TL.x1 - 34) + " " + (TL.y - 26) + " L" + TL.x1 + " " + TL.y + " L" + (TL.x1 - 34) + " " + (TL.y + 26), opacity: 0 }, gTl); });
  var ticks = MARCAS.map(function (m) {
    return ["eixo-tl-sob", "eixo-tl"].map(function (cls) { return svgEl("path", { "class": cls, d: "M" + xAno(m.ano).toFixed(1) + " " + (TL.y - 22) + " V" + (TL.y + 22), opacity: 0 }, gTl); });
  });
  var halo1880 = svgEl("circle", { "class": "halo-tl", cx: xAno(1885).toFixed(1), cy: TL.y, r: 30, opacity: 0 }, gTl);

  function aplicarCasas(t) {
    var C = CENA.casas, vout = t < CENA.mapa.t1 ? 1 : 0;
    CASAS.forEach(function (ll, i) {
      var g = E("casa" + i); if (!g) return;
      var t0 = C.t0 + i * C.passo, e = eo(seg(t, t0, 0.3)), v = C.nivel * e * vout;
      if (v <= 0.001) { g.setAttribute("opacity", "0"); return; }
      var p = map.project(ll), sc = C.escala * (1.04 - 0.04 * e);
      g.setAttribute("transform", "translate(" + p.x.toFixed(2) + " " + p.y.toFixed(2) + ") scale(" + sc.toFixed(4) + ")");
      g.setAttribute("opacity", v.toFixed(3));
    });
  }
  function aplicarLinhaDoTempo(t) {
    var L = CENA.tl, v = eo(seg(t, L.nasce, 0.3)) * (t < L.sai ? 1 : 0);
    gTl.setAttribute("opacity", v.toFixed(3));
    var xe = TL.x0 + (TL.x1 - TL.x0) * eio(seg(t, L.nasce, L.desenha));
    tlEixo.forEach(function (p) { p.setAttribute("d", "M" + TL.x0 + " " + TL.y + " H" + xe.toFixed(1)); });
    tlSeta.forEach(function (p) { p.setAttribute("opacity", eo(seg(t, L.nasce + L.desenha - 0.1, 0.2)).toFixed(3)); });
    // o pulso dos 1880s em "before": o tique engrossa 6 → 14 → 6 px e um halo cresce de r 30 a 90 e some, em 0,9 s; a pílula fica parada
    var pu = seg(t, L.pulso, L.dPulso), bump = Math.sin(Math.PI * pu);
    MARCAS.forEach(function (m, i) {
      var x = xAno(m.ano), tEntra = L.nasce;   // as cinco marcas entram juntas no t0 do eixo ([267], 3,3): a peça VOLTA inteira, como na série
      var ve = eo(seg(t, tEntra, 0.25));
      ticks[i].forEach(function (p, k) { p.setAttribute("opacity", ve.toFixed(3)); if (i === 0 && k === 1) p.setAttribute("stroke-width", (6 + 8 * bump).toFixed(1)); });
      var el = E(m.id); if (!el) return;
      var vt = vidaTexto(t, tEntra, L.sai), vv = vt.v * (t < L.sai ? 1 : 0);
      if (vv <= 0.001) { mostrar(el, 0, 0, 0); return; }
      mostrar(el, vv, x - el.offsetWidth / 2, TL.y - 34 - el.offsetHeight + vt.sobe);
    });
    halo1880.setAttribute("r", (30 + 60 * pu).toFixed(1));
    halo1880.setAttribute("opacity", (pu > 0 && pu < 1 ? 0.9 * (1 - pu) : 0).toFixed(3));
  }
  aplicarMapa = function (t) {
    map.jumpTo(cameraAt(t));
    aplicarCasas(t);
    var Lg = CENA.legenda; poe("legenda", 200, 2160 - 290 - Hd("legenda"), t, Lg.t0, Lg.t1);
    aplicarLinhaDoTempo(t);
  };

  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou. O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  // pronto: os tiles do satélite e as fontes da cena carregados, o mapa parado, dois quadros pintados (o rig da s31)
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!mapaCarregado || !map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) if (!map.getSource(FONTES[i]) || !map.isSourceLoaded(FONTES[i])) return false;
          if (!map.getSource("base") || !map.isSourceLoaded("base")) return false;
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = mapaCarregado && map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
