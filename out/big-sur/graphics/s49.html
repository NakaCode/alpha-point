  function naArea(l, tp, w, h) { var r = l + w, b = tp + h; return Math.min(l - 200, 3640 - r, tp - 160, 1880 - b, Math.max(3440 - r, 1760 - b)); }
  function vida(t, t0, t1) {
    var vin = eo(seg(t, t0, 0.3)), vout = t1 == null ? 1 : 1 - eio(seg(t, t1 - 0.3, 0.3));
    return { v: vin * vout, sobe: (1 - vin) * 24 };
  }
  function mostrar(id, t, t0, t1, alvo) {
    var el = E(id), R = ROT[id]; if (!el || !R) return null;
    var vv = vida(t, t0, t1), w = el.offsetWidth, h = el.offsetHeight, tp = R.t + vv.sobe;
    var v = vv.v * fator(naArea(R.l, tp, w, h));
    el.style.opacity = v.toFixed(3); el.style.visibility = v > 0.001 ? "visible" : "hidden";
    el.style.transform = "translate(" + R.l.toFixed(1) + "px," + tp.toFixed(1) + "px)";
    var gr = E("guia-" + id);
    if (gr && alvo) {
      var ex = R.lado === "dir" ? R.l + w : R.l, ey = cl(alvo.y, tp + 40, tp + h - 40);
      var d = "M" + ex.toFixed(1) + "," + ey.toFixed(1) + " L" + alvo.x.toFixed(1) + "," + alvo.y.toFixed(1);
      var ps = gr.querySelectorAll("path"); for (var j = 0; j < ps.length; j++) ps[j].setAttribute("d", d);
      gr.setAttribute("opacity", v.toFixed(3));
    }
    return v;
  }
  function aplicarPaulTexto(t) {
    var fim = t >= CENA.reabre;
    var a = E("paulAte"), f = E("paulFim");
    if (a && a.textContent !== (fim ? " –" : "")) a.textContent = fim ? " –" : "";
    if (f && f.textContent !== (fim ? " JUNE 23, 2024" : "")) f.textContent = fim ? " JUNE 23, 2024" : "";
    var el = E("rotPaul"); if (!el) return;
    // a pílula ganha a terceira linha em 300 ms (a altura cresce para baixo; o texto que já está não se move)
    var u = eo(seg(t, CENA.reabre, 0.3)), lh = 128 * 1.1, h0 = 2 * lh + 48;
    el.style.height = (fim ? h0 + lh * u : h0).toFixed(1) + "px";
    if (f) f.style.opacity = u.toFixed(3);
  }

  // ── o fio: aceso, menos os cortes que crescem a partir de cada marcador ──
  var fioAntes = null, cotaAntes = null;
  function aplicarFio(t) {
    var eP = CENA.corteKm * eo(seg(t, CENA.paul.corta, 0.5)), eR = CENA.corteKm * eo(seg(t, CENA.reg.corta, 0.5));
    var k = eP.toFixed(4) + "|" + eR.toFixed(4);
    if (k !== fioAntes) {
      // a estrada vai de norte a sul: Regent's (km menor) vem antes de Paul's
      var cortes = [[K.reg - eR, K.reg + eR], [K.paul - eP, K.paul + eP]].filter(function (c) { return c[1] - c[0] > 1e-4; });
      var acesos = [], x = 0;
      cortes.forEach(function (c) { acesos.push(trecho(x, c[0])); x = c[1]; });
      acesos.push(trecho(x, HL));
      var s1 = map.getSource("hwy-aceso"); if (s1) s1.setData(fcLinhas(acesos));
      var s2 = map.getSource("hwy-corte"); if (s2) s2.setData(fcLinhas(cortes.map(function (c) { return trecho(c[0], c[1]); })));
      fioAntes = k;
    }
    // a cota de "6 MI": cresce de Regent's para Paul's em "six" (0,8 s) e sai com o "6 MI"
    var uC = eio(seg(t, CENA.seis.t0, 0.8)), vC = uC > 0 ? 1 - eio(seg(t, CENA.seis.t1 - 0.3, 0.3)) : 0;
    var kc = uC > 0 ? uC.toFixed(3) + "|" + map.getZoom().toFixed(4) : "0";
    if (kc !== cotaAntes) { var s3 = map.getSource("cota"); if (s3) s3.setData(fcLinhas([uC > 0 ? cotaDesloc(cotaAte(uC)) : null])); cotaAntes = kc; }
    pint("cota", "line-opacity", vC); pint("cota-sob", "line-opacity", vC * 0.9);
  }

  // ── a linha do tempo de p6 (a peça de marca: y 1700, x 200–3400) ──
  function xAno(a) { return LT.x0 + LT.ano * a; }
  function cursorAt(t) {   // o "agora" da linha do tempo, em anos desde 1º/1/2023
    if (t < CENA.tempo) return LT.paul0;
    if (t < CENA.reabre) return LT.paul0 + (LT.paul1 - LT.paul0) * seg(t, CENA.tempo, CENA.reabre - CENA.tempo);
    if (t < 16.2) return LT.paul1 + (2.80 - LT.paul1) * seg(t, CENA.reabre, 16.2 - CENA.reabre);
    if (t < CENA.tres) return 2.80 + 0.12 * seg(t, 16.2, CENA.tres - 16.2);
    return 2.92 + (LT.fim - 2.92) * eo(seg(t, CENA.tres, 0.45));
  }
  function barra(id, a0, a1, y) {
    var d = a1 > a0 + 1e-4 ? "M" + xAno(a0).toFixed(1) + "," + y + " L" + xAno(a1).toFixed(1) + "," + y : "";
    var b = E(id), s = E(id + "Sob"); if (b) b.setAttribute("d", d); if (s) s.setAttribute("d", d);
  }
  function aplicarTempo(t) {
    var g = E("tempo"); if (!g) return;
    var v = eo(seg(t, CENA.tempo, 0.4));
    g.setAttribute("opacity", v.toFixed(3));
    var L = 3200 * eio(seg(t, CENA.tempo, 0.5));
    ["ltSob", "ltLinha"].forEach(function (id) { var p = E(id); if (p) p.setAttribute("d", "M200," + LT.y + " L" + (200 + L).toFixed(1) + "," + LT.y); });
    var c = cursorAt(t);
    barra("barPaul", LT.paul0, Math.min(c, LT.paul1), LT.y - 44);
    barra("barReg", LT.reg0, Math.max(LT.reg0, c), LT.y - 76);
    // a chave de ALMOST THREE YEARS: de JAN. 14, 2023 a JAN. 14, 2026, com os pés descendo às barras
    var u = eio(seg(t, CENA.tres, 0.6)), y = LT.y - 112, xa = xAno(LT.paul0), xb = xa + (xAno(LT.fim) - xa) * u;
    var d = u > 0 ? "M" + xa.toFixed(1) + "," + (y + 24) + " L" + xa.toFixed(1) + "," + y + " L" + xb.toFixed(1) + "," + y + (u >= 1 ? " L" + xb.toFixed(1) + "," + (y + 24) : "") : "";
    ["chave", "chaveSob"].forEach(function (id) { var p = E(id); if (p) p.setAttribute("d", d); });
    // os marcos (eixo, 84 px), centrados no tique, logo abaixo da linha
    [["m2023", 0], ["m2024", 1], ["m2025", 2], ["m2026", 3]].forEach(function (m) {
      var el = E(m[0]); if (!el) return;
      var vv = vida(t, CENA.tempo, null), w = el.offsetWidth, l = xAno(m[1]) - w / 2, tp = LT.y + 26 + vv.sobe;
      var vz = vv.v * fator(naArea(l, tp, w, el.offsetHeight));
      el.style.opacity = vz.toFixed(3); el.style.visibility = vz > 0.001 ? "visible" : "hidden";
      el.style.transform = "translate(" + l.toFixed(1) + "px," + tp.toFixed(1) + "px)";
    });
  }

  function aplicarCreditos(t) {
    var c = E("credito"); if (c) { c.style.opacity = "1"; c.style.visibility = "visible"; }
    var s = E("credSrc"); if (s) { var v = eo(seg(t, CENA.fonte, 0.3)); s.style.opacity = v.toFixed(3); s.style.visibility = v > 0.001 ? "visible" : "hidden"; }
  }

  var antes = {};
  function tetoAt(t) { return eio(seg(t, CENA.teto[0], CENA.teto[1])); }
  function tetoPronto(t) { return t >= CENA.teto[0] - 0.1; }   // o teto entra 0,1 s antes, para os tiles dele chegarem
  function vis(id, on) { var k = id + "|vis", v = on ? "visible" : "none"; if (antes[k] === undefined) antes[k] = map.getLayoutProperty(id, "visibility") || "visible"; if (antes[k] === v) return; map.setLayoutProperty(id, "visibility", v); antes[k] = v; }
  function aplicarBase(t) {   // o teto por cima do nível alto, com a opacidade w; a camada que não aparece não pede tile
    var w = tetoAt(t);
    vis("base", w < 1); vis("base-teto", w > 0 || tetoPronto(t));
    pint("base-teto", "raster-opacity", w);
  }
  function fontesBase() { var f = []; ["base", "base-teto"].forEach(function (id) { if (map.getLayoutProperty(id, "visibility") !== "none") f.push(id); }); return f; }
  function pint(id, prop, v) { if (typeof v === "number") v = +v.toFixed(3); var k = id + "|" + prop; if (antes[k] === v) return; map.setPaintProperty(id, prop, v); antes[k] = v; }
  function aplicar(t) {
    if (!mapaCarregado) return;
    map.jumpTo(cameraAt(t));
    aplicarBase(t);
    aplicarFio(t);
    var aP = eo(seg(t, CENA.paul.acende, 0.3)), aR = eo(seg(t, CENA.reg.acende, 0.3));
    var pr = aplicarMarca("marcaReg", LL.reg, 1, aR, CENA.reg.acende, t);
    var pp = aplicarMarca("marcaPaul", LL.paul, 1, aP, CENA.paul.acende, t);
    aplicarPaulTexto(t);
    mostrar("rotPaul", t, CENA.paul.acende, null, pp);
    mostrar("rotReg", t, CENA.reg.acende, null, pr);
    mostrar("rot6", t, CENA.seis.t0, CENA.seis.t1, alvoCota());
    mostrar("rotTres", t, CENA.tres, null, map.project(LL.meio));
    aplicarTempo(t);
    aplicarCreditos(t);
  }
  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }
    return Promise.resolve();
  };

  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  // pronto: os tiles do satélite e as fontes da cena carregados, o mapa parado, dois quadros pintados (sem relevo nesta cena)
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!mapaCarregado || !map.areTilesLoaded() || map.isMoving()) return false;
          var f = CENA.fontes.concat(fontesBase());
          for (var i = 0; i < f.length; i++) if (!map.getSource(f[i]) || !map.isSourceLoaded(f[i])) return false;
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () { capturando = true; if (rafId) cancelAnimationFrame(rafId); return window.__renderAt(0) || true; };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() { if (capturando) return; window.__renderAt(((performance.now() - t0) / 1000) % DUR); rafId = requestAnimationFrame(loop); })();
  }, function () {});
})();
</script>
