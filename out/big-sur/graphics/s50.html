    e.style.opacity = p.toFixed(3);
    e.style.transform = "translate(" + f2(x - w) + "px," + f2(y + 24 * (1 - p)) + "px)";
  }

  function desenharP1(t) {
    var pt = eb(seg(t, T.traco, T.tracoDur));
    tracar("mar", 560, clamp(pt * 2, 0, 1)); tracar("base", 2880, pt);
    tracar("enc", LEN_ENC, pt); tracar("sEnc", LEN_ENC, pt);
    var on = E("ondas"); if (on) on.setAttribute("opacity", eo(seg(t, 0.15, 0.35)).toFixed(3));
    var pi = E("pista"); if (pi) pi.setAttribute("opacity", eo(seg(t, 0.30, 0.3)).toFixed(3));
    var gh = E("guiaHwy"); if (gh) gh.setAttribute("opacity", eo(seg(t, T.textos, 0.3)).toFixed(3));
    // a lupa
    circulo("circPeq", CP, eo(seg(t, T.circPeq, 0.15)));
    var tg = E("tangentes"); if (tg) { var Lt = Math.hypot(TAN[0][1][0] - TAN[0][0][0], TAN[0][1][1] - TAN[0][0][1]);
      tg.style.strokeDasharray = f1(Lt) + " " + f1(Lt); tg.style.strokeDashoffset = f1(-Lt * (1 - eo(seg(t, T.tang, 0.15))));
      tg.setAttribute("opacity", t >= T.tang ? "1" : "0"); }
    circulo("circGrande", CG, eb(seg(t, T.circGr, T.circGrDur)));
    var det = E("detalhe"); if (det) det.setAttribute("opacity", eo(seg(t, T.circGr + 0.05, 0.25)).toFixed(3));
    // a massa desliza (Δ morro abaixo)
    var dl = delta(t), mx = -dl * DX, my = -dl * DY;
    var topo = [], fundo = [];
    for (var xi = 0; xi <= XI_TOPO; xi += 10) topo.push(P(xi, 0));
    for (var k = RUPT.length - 1; k >= 0; k--) fundo.push(P(RUPT[k], zRuptura(RUPT[k])));
    var mov = function (ps) { return ps.map(function (p) { return [p[0] + mx, p[1] + my]; }); };
    var mm = E("detMassa"); if (mm) mm.setAttribute("d", d(mov(topo.concat(fundo))) + " Z");
    var mt = E("detMassaTopo"); if (mt) mt.setAttribute("d", d(mov(topo)));
    var es = E("detEscarpa"); if (es) es.setAttribute("opacity", dl > 0.5 ? "1" : "0.0");
    // as barras: furando (reta, presa à cabeça que anda com a massa); presas (a parte da massa segue a massa; a do chão fica; dobra no plano)
    BARRAS.forEach(function (b, i) {
      var pb = E("barra" + i), pl = E("placa" + i); if (!pb || !pl) return;
      if (t < b.t0) { pb.setAttribute("opacity", "0"); pl.setAttribute("opacity", "0"); return; }
      pb.setAttribute("opacity", "1"); pl.setAttribute("opacity", "1");
      var cab, pts;
      if (t < b.t1) {
        var dd = delta(t), c = P(b.xi - dd, 0), L = LBAR * eo(seg(t, b.t0, T.furo));
        cab = c; pts = [c, [c[0] + L * BX, c[1] + L * BY]];
      } else {
        var dlt = delta(t) - b.d1, ox = -dlt * DX, oy = -dlt * DY;
        cab = [b.cab[0] + ox, b.cab[1] + oy];
        pts = [cab, [b.k0[0] + ox, b.k0[1] + oy], b.k0, b.ponta];
      }
      pb.setAttribute("d", d(pts));
      var hx = -BY * 22, hy = BX * 22;   // a placa: um traço curto perpendicular à barra, na cabeça
      pl.setAttribute("d", "M" + f1(cab[0] - hx) + "," + f1(cab[1] - hy) + " L" + f1(cab[0] + hx) + "," + f1(cab[1] + hy));
    });
    // os textos do P1
    solto("legIlus", t, T.textos, 236, 1700, false);
    solto("eixoHwy", t, T.textos, (PISTA[0] + PISTA[1]) / 2, PRAT_Y + 160, true);
    solto("cotaBarras", t, T.cota, CG.x + CG.r + 70, CG.y - CG.r + 60, false);
    var luz = E("luz"); if (luz && t < T.corte) { luz.style.setProperty("--luz-x", (CG.x + 140) + "px"); luz.style.setProperty("--luz-y", (CG.y + 140) + "px"); }
  }

  // ═══ P2–P3 · AS FOTOS IMPRESSAS ("a mão que arruma"; o pouso e a sombra solta são os do Atlântico s17, aprovados) ═══
  var FOTO1 = { w: 1388, h: 1060.5, cx: 1290, cy: 800, rot: -1.5, rot0: -2.0 };
  var FOTO2 = { w: 1388, h: 1060.5, cx: 2616, cy: 1290, rot: 1.8, rot0: 2.5 };
  var ALVO1 = { x: 1300, y: 680 }, ALVO2 = { x: 2736, y: 1180 };   // onde a luz pousa (o assunto de cada foto: a placa e os carros; a encosta e a estrada)
  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + f2(cx - w / 2) + "px," + f2(cy - h / 2) + "px) rotate(" + rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  function pousoFoto(t, t0, F_) {   // desce 240 px, escala 0,72 → 1,03 até 0,33 s e assenta 1,00 até 0,55 s; a inclinação chega
    var p = eo(seg(t, t0, 0.33)), q = eo(seg(t, t0 + 0.33, 0.22)), pt = eo(seg(t, t0, 0.55));
    return { op: t >= t0 ? 1 : 0, dy: 240 * (1 - pt), k: t < t0 + 0.33 ? lerp(0.72, 1.03, p) : lerp(1.03, 1.00, q), p: pt, rot: lerp(F_.rot0, F_.rot, pt) };
  }
  function sombra(el, g, s) {   // desfoque fixo; só transform e opacity (no ar +64 px, 1,05, 0,35; assentada +12 px, 1,00, 0,80)
    if (!el) return;
    var sy = lerp(64, 12, s.p), sk = lerp(1.05, 1.00, s.p), so = lerp(0.35, 0.80, s.p) * s.op;
    por(el, g.cx, g.cy - s.dy + sy, g.w, g.h, s.rot, sk * s.k, so);
  }
  function objeto(idG, idS, F_, s) { sombra(E(idS), F_, s); por(E(idG), F_.cx, F_.cy - s.dy, F_.w, F_.h, s.rot, s.k, s.op); }
  function fita(el, t, t0, lado) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3)); el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + f1((1 - p) * -40) + "px) rotate(" + (lado === "e" ? -6 : 5) + "deg) scale(" + (1 + (1 - p) * 0.08).toFixed(4) + ")";
  }
  function pilula(id, t, t0, t1, x, y) {   // entra em 300 ms (opacidade + 24 px de subida); sai em 300 ms (opacidade + 24 px para baixo)
    var e = E(id); if (!e) return;
    var p = eo(seg(t, t0, 0.3)), q = (t1 == null) ? 0 : eo(seg(t, t1, 0.3));
    e.style.opacity = (p * (1 - q)).toFixed(3);
    e.style.transform = "translate(" + f1(x) + "px," + f1(y + (1 - p) * 24 + q * 24) + "px)";
  }
  function desenharP23(t) {
    var a = pousoFoto(t, T.f1, FOTO1), b = pousoFoto(t, T.f2, FOTO2);
    objeto("f1", "f1Sombra", FOTO1, a);
    fita(E("f1Fe"), t, T.f1 + 0.30, "e"); fita(E("f1Fd"), t, T.f1 + 0.42, "d");
    objeto("f2", "f2Sombra", FOTO2, b);
    fita(E("f2Fe"), t, T.f2 + 0.30, "e"); fita(E("f2Fd"), t, T.f2 + 0.42, "d");
    // os textos da mesa (no mundo da mesa, dentro da câmera; parados depois de entrar)
    pilula("rot1", t, T.rot1, T.rot1Sai, FOTO1.cx - FOTO1.w / 2 + 30, FOTO1.cy + FOTO1.h / 2 + 34);
    var cr = E("cotaReab"), wcr = cr ? cr.offsetWidth : 0;
    pilula("cotaReab", t, T.cotaReab, null, Math.min(2060, 3540 - wcr), 250);
    var r2 = E("rot2"), wr2 = r2 ? r2.offsetWidth : 0;
    pilula("rot2", t, T.rot2, null, FOTO2.cx - FOTO2.w / 2 - 60 - wr2, FOTO1.cy + FOTO1.h / 2 + 70);
    // a luz: atrás da 1ª (seguindo o pouso), e em 'months' vai para a 2ª: "a antiga fica, a luz escolhe" (120 ms atrás)
    var tl = Math.max(0, t - 0.12), aa = pousoFoto(tl, T.f1, FOTO1), bb = pousoFoto(tl, T.f2, FOTO2), u = eb(seg(tl, T.luz2, T.luzDur));
    var lx = lerp(ALVO1.x, ALVO2.x, u), ly = lerp(ALVO1.y - aa.dy, ALVO2.y - bb.dy, u);
    var luz = E("luz"); if (luz) { luz.style.setProperty("--luz-x", f1(lx + 140) + "px"); luz.style.setProperty("--luz-y", f1(ly + 140) + "px"); }
  }

  // ── a câmera da mesa: o push-in do RIG contínuo pelos dois regimes, parado de 5,05 a 5,30 e de 11,816 ao fim; a deriva; o still a 0,6 ──
  function escalaCam(t) { return 1 + 0.0024 * (Math.min(t, T.repouso1) + Math.max(0, Math.min(t, T.repouso2) - T.corte)); }
  function camera(t) {
    var c = E("cam"), s = escalaCam(t), dx = 6 * Math.sin(t * 0.23), dy = 4.8 * Math.sin(t * 0.17);
    if (c) c.style.transform = "scale(" + s.toFixed(5) + ") translate(" + f2(dx) + "px," + f2(dy) + "px)";
    var st = E("still"); if (st) st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ") translate(" + f2(dx * 0.6) + "px," + f2(dy * 0.6) + "px)";
  }
  function cred(id, t, t0) { var e = E(id); if (e) e.style.opacity = eo(seg(t, t0, 0.3)).toFixed(3); }

  function cena(t) {
    camera(t);
    var p1 = E("p1"), naP1 = t < T.corte;
    if (p1) p1.style.visibility = naP1 ? "visible" : "hidden";
    if (naP1) desenharP1(t);
    desenharP23(t);
    cred("credFonte", t, T.credFonte);
    var cf = E("credFoto"); if (cf) cf.style.opacity = t >= T.f1 ? "1" : "0";   // o crédito da foto: no 1º quadro da foto (identidade §4.2)
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  // só conferência: o estado da física (a prova do contato vem do DOM e dos quadros, não daqui)
  window.__s50fisica = function (t) {
    t = clamp(+t || 0, 0, DUR);
    return { delta_px: +delta(t).toFixed(3), parada_s: +PARADA.toFixed(4), delta_fim_px: +DELTA_FIM.toFixed(2),
      barras: BARRAS.map(function (b) { return { t0: +b.t0.toFixed(3), presa: +b.t1.toFixed(3), dobra_px: +Math.max(0, delta(t) - b.d1).toFixed(2), ate_plano_px: +b.lk.toFixed(1) }; }) };
  };
  window.__renderAt(0);
})();
</script>
