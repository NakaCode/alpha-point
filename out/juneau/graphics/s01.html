    el.style.transform = "translateY(" + ((1 - op) * 24).toFixed(1) + "px)";   // 300 ms: opacidade + 24 px (§4.4)
  }
  function credito(el, texto, op) {
    if (!el) return;
    op = clamp(op, 0, 1);
    if (el.textContent !== texto) el.textContent = texto;
    el.hidden = op <= 0;
    el.style.opacity = op.toFixed(3);
  }

  // ── o quadro ────────────────────────────────────────────────────────────────────────────────────────────────
  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas (3,567 = 107/30)
    var p1 = t < CENA.corte;
    // o mapa e o voo (depois do corte o mapa fica escondido, parado no último quadro do voo)
    var m = E("map"); if (m) m.style.visibility = p1 ? "visible" : "hidden";
    var rg = E("reg3"); if (rg) rg.style.visibility = p1 ? "hidden" : "visible";
    if (mapaCarregado) {
      map.jumpTo(cameraAt(Math.min(t, CENA.corte)));
      if (map.terrain && map.transform.elevation !== 0) map.transform.elevation = 0;
      if (map.terrain && map.terrain.exaggeration !== CENA.exagero) map.terrain.exaggeration = CENA.exagero;
      if (map.terrain && map.terrain.sourceCache && typeof map.terrain.sourceCache.freeRtt === "function") { map.terrain.sourceCache.freeRtt(); map.triggerRepaint(); }
    }
    // o rótulo Juneau e o ponto, presos ao chão (o ponto projetado depois do jumpTo do quadro)
    var rj = E("rJuneau"), pj = E("pontoJuneau");
    // 5c: a troca do Lucas de 02/10, completa: o rótulo Juneau (e o ponto dele) sai quando o placar entra (3,967, em
    // 300 ms), para o YES e o placar não se lerem como o voto de Juneau; o lugar volta com "Juneau, Alaska" no clipe
    var opJ = p1 && mapaCarregado ? 1 - eo(seg(t, CENA.placar, 0.3)) : 0;
    if (opJ > 0 && JUNEAU) {
      var q = map.project(JUNEAU), h = rj.offsetHeight || 176;
      rj.style.transform = "translate(" + (q.x + CENA.rotulo.dx).toFixed(2) + "px," + (q.y + CENA.rotulo.dy - h / 2).toFixed(2) + "px)";
      if (pj) { pj.setAttribute("cx", q.x.toFixed(2)); pj.setAttribute("cy", q.y.toFixed(2)); }
    }
    rj.style.opacity = opJ.toFixed(3);
    if (pj) pj.setAttribute("opacity", opJ.toFixed(3));
    pintarTextoLiso();
    // a troca do Lucas (02/10): a data sai quando o carimbo bate (3,567–3,867)
    rotulo(E("rData"), p1 ? Math.min(eo(seg(t, CENA.data, 0.3)), 1 - eb(seg(t, CENA.yes, 0.3))) : 0);
    rotulo(E("placar"), p1 ? eo(seg(t, CENA.placar, 0.3)) : 0);
    // o carimbo: bate em "approved" (1,55 → 0,97 em 70 % da batida, → 1 no resto; opacidade 0 → 1 na primeira metade),
    // fica, e sobre o clipe desbota 1 s e some
    var pp = seg(t, CENA.yes, CENA.yesDur), s, op;
    if (pp < 0.7) { var k = eo(pp / 0.7); s = lerp(1.55, 0.97, k); op = clamp(pp / 0.35, 0, 1); }
    else { s = lerp(0.97, 1, (pp - 0.7) / 0.3); op = 1; }
    if (t >= CENA.corte - CENA.yesSome) op = Math.min(op, 1 - seg(t, CENA.corte - CENA.yesSome, CENA.yesSome));
    if (t >= CENA.corte) op = 0;
    var c = E("carimbo");
    if (c) {
      var w = c.offsetWidth || 0, hh = c.offsetHeight || 0;
      c.style.opacity = op.toFixed(3);
      c.style.transform = "rotate(-7deg) scale(" + s.toFixed(4) + ") translate(" + (-w / 2).toFixed(1) + "px," + (-hh / 2).toFixed(1) + "px)";
    }
    // b2: o rótulo do clipe
    rotulo(E("rLugar3"), p1 ? 0 : eo(seg(t, CENA.corte, 0.3)));
    // o placar centrado em x 1.920
    var pl = E("placar"); if (pl) pl.style.left = (-(pl.offsetWidth || 0) / 2).toFixed(1) + "px";
    // os créditos: a fonte do placar (3,967 → corte) e a MapTiler (0 → corte)
    var opMapa = p1 ? 1 : 0, opFonte = p1 ? eo(seg(t, CENA.placar, 0.3)) : 0;
    credito(E("credMapa"), TEXTOS.credMapa, opMapa);
    credito(E("credFonte"), TEXTOS.credFonte, opFonte);
    var creds = E("creds"), opCreds = Math.max(opMapa, opFonte);
    if (creds) { creds.classList.toggle("vazio", opCreds <= 0); creds.style.opacity = opCreds.toFixed(3); }
    // o clipe: o quadro do clipe que este t pede (a 1,0×, quadro a quadro, sem laço)
    var kq = CENA.clipeQuadro0 + Math.max(0, Math.round((t - CENA.corte) * 30));
    return (Math.min(kq, 339) + 0.5) / 30;   // o meio do quadro: 11,3167 no último, o mesmo que s03 reabre
  }
  window.__renderAt = function (t) {
    var alvo;
    try { alvo = cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; return Promise.resolve(); }   // nunca lança
    return R.seekTo(E("clipe"), alvo).then(function () { return true; }, function () { return true; });
  };

  // ── a espera do mapa: a base E o relevo, e um nível de tile resolvido (s44: "A ÚLTIMA ATUALIZAÇÃO DOS TILES") ───
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}

  function barrarTileComErro() {

    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          if (!map.isSourceLoaded("base") || !map.isSourceLoaded("dem") || !map.getTerrain()) return false;
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && forcadas < 2) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.jumpTo({ center: map.getCenter() }); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo; se repetir, confira a conexão.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  window.__fotosProntas = R.prontas();
  window.__videoPronto = new Promise(function (res) {
    var v = E("clipe");
    if (!v) return res(true);
    if (v.readyState >= 2) return res(true);
    v.addEventListener("loadeddata", function () { res(true); }, { once: true });
    v.addEventListener("error", function () { res(true); }, { once: true });
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { try { pintarTextoLiso(); } catch (e) {} });

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__fotosProntas.then(function () { return window.__renderAt(0); });
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
  window.__renderAt(0);
})();
</script>
