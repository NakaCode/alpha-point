<!--
  CANAL ALPHA POINT — JUNEAU, CENA s03 (18,133 → 26,167 s do master; 8,034 s; quadros 544 → 785 a 30 fps).
  "You can't drive to Juneau from the rest of the continent. Its roads run about 43 miles north, to Cascade
  Point, and stop."  Mapista, 30/09/2026: piloto do passo art, fora da ordem da linha (o Juneau está em research).

  Nasceu de `preparar-cena.mjs juneau --molde=s03` (molde src/mapa/moldes/mapa-base.html da pré-v1, commit
  7ab9543), com o que o canal muda no molde tirado do exemplar out/prova-mapa/graphics/landsat-juneau.html.
  O que manda em cada coisa:
    · o QUE vai à tela e a grafia: out/juneau/textos-tela.json (s03);
    · o TEMPO de cada texto e o exige de cada beat: out/juneau/regencia.json (s03), no relógio do words.json;
    · a direção: out/juneau/conceito-visual.json (s03); a marca: marca/identidade.md §4–§7 e marca/tokens.css.

  O que esta cena muda no molde, e por quê:
    · A BASE é o perfil do canal (canal.json › mapa.perfil: "maptiler"), sem o __BASE_CANAL do exemplar (aquele
      era o Landsat do teste). A chave nunca está aqui: o render a injeta em window.__chaves.
    · SEM RELEVO: o molde liga o terrain-rgb-v2 sempre que o perfil tem DEM; aqui não (CENA.relevo = false). O
      relevo do Juneau só está liberado em s44 (identidade §6, "O gasto do Juneau, liberado"), e a frase não
      argumenta com a vertical (ofício §5). A espera de cada quadro deixa de esperar o DEM.
    · O TRATAMENTO da base (identidade §6): brilho 65 %, saturação 70 %, na pintura da camada; sem o véu do molde.
    · A ABERTURA: o último quadro do clipe aéreo de s01 p3 (o MESMO arquivo, ../_media/footage/s01/, aprovado
      pelo conferente para s01 p3, com o reuso em s03 declarado no espelho › s03 › _ancoragem) aparece em tela
      cheia e encolhe até o ponto de Juneau em 1,5 s. O quadro sai do vídeo UMA vez, para um <canvas>, e o
      <video> é descartado: a cena não cria arquivo derivado do clipe, e o render não espera um vídeo parado a
      cada quadro. Clipe que não carrega é ERRO da cena, não abertura sem ele.
    · A DIVISA: só as arestas que o Canadá e os EUA dividem no recorte panhandle-juneau (Natural Earth, tol 0),
      no estilo da identidade §6, "A divisa mais grossa" (branco 70 %, 5 px, sobre contorno escuro 60 %, 12 px),
      com os valores lidos só dos tokens (--fronteira-*).
      É tratamento da base, como o satélite: não conta como elemento (§4.2). As bordas do recorte não se desenham.
    · A MALHA DO CONTINENTE (Natural Earth ne_10m_roads, sem balsas) se acende em --rede-cor (= --contraparte)
      vindo do Canadá: uma frente que fecha sobre Juneau e para na ponta mais perto dela (Haines). Ela nunca chega a
      Juneau: a cena confere a distância mínima da malha no carregamento. A LEGENDA DAS CORES, no canto de cima à
      direita, diz o que cada linha é: Border (1,433 s), Roads (1,813 s) e Juneau's roads (3,833 s); sai inteira de
      5,267 a 5,567 s, antes de Cascade Point.
    · A ESTRADA de Juneau (OSM, Alaska Route 7, 67,48 km) se desenha em --destaque, de Juneau para o norte, em
      sincronia com "forty-three miles north"; o rótulo ABOUT 43 MILES entra quando ela chega ao meio (4,465 s).
    · O ANEL de Cascade Point (identidade §4.4) e os rótulos em pílula (§4.1), ancorados por projeção.
    · Os CRÉDITOS na faixa (§4.2): a linha da MapTiler o tempo todo e "Source: Alaska DOT&PF and FHWA, 2018"
      enquanto ABOUT 43 MILES está no ar, empilhados, 76 px, de x = 200 até antes de x = 1720.
    · A câmera final é a CÂMERA NOMEADA "Juneau–estrada–anel" (o último viewport), que s44 p1 e s59 p2 reabrem
      pelos números: lng -134.9510, lat 58.7560, zoom 8.72, bearing 0, pitch 0, no palco 3840×2160 (3ª versão;
      antes, lat 58.8424).

  2ª versão (30/09/2026, depois do 1º render, das 21:33, e da conferência dos quadros pelo ofício §7):
    · a malha do continente engrossou (6 → 11 px, contorno --rotulo de 24 px): no 1º render ela era um fio de 3 px no
      1080p e sumia na neve, e o objeto do beat 1 ("a estrada não chega") não se lia;
    · a estrada de Juneau engrossou junto (10 → 14 px, sombra de 26 px a 85 %), para seguir acima da malha;
    · a linha da MapTiler só entra no primeiro quadro em que aparece mapa: no 1º render ela estava sobre o quadro
      aéreo em tela cheia, em t = 0;
    · a divisa ficou como a identidade §6 mandava então (3 px a 35 % sobre 7 px a 45 %). No 1º render ela está
      desenhada, mas é um fio que não se vê nesta escala; engrossá-la mudava um valor da marca (decisão do Lucas).

  3ª versão (30/09/2026, depois da escolha do Lucas: "a proposta é melhor, mas está sobrepondo o texto"):
    · a divisa é a "mais grossa" da identidade §6 (5 px a 70 % sobre 12 px a 60 %), lida dos tokens, que a Sala de
      controle já mudou; os valores de reserva do tok() seguem os mesmos números;
    · NENHUMA PÍLULA SOBRE UMA LINHA (identidade §6, "Nenhum rótulo sobre a divisa"): ABOUT 43 MILES estava sobre a
      divisa. As posições novas foram medidas sem tile, quadro a quadro (242 quadros), da caixa inteira de cada pílula
      à divisa, à malha e à estrada, menos a meia espessura do traço mais largo de cada uma (12, 24 e 26 px):
        – a câmera desceu 100 px na tela nos dois viewports (mesmo zoom e giro), e Juneau subiu junto: o rótulo dele
          foi para baixo do ponto, porque à direita a divisa passa a ~400 px e à esquerda a estrada o cruzaria;
        – UNITED STATES foi para a terra dos EUA a sudoeste (Chichagof, perto de Cross Sound), longe da divisa;
        – CANADA desceu um pouco ([-133.16, 59.04]);
        – ABOUT 43 MILES ancora no meio da estrada e fica à esquerda dela, longe da divisa;
        – Cascade Point e os créditos já estavam livres e não mudaram.

  4ª versão (30/09/2026, 23:4x, a opção D do Lucas: "D, cor e o nome ROADS (Recomendado)"; identidade §6, "Estrada
  não se confunde com fronteira"). Ele viu o quadro de 0:03: "O que é estrada e o que é fronteira acabou por não ficar
  claro":
    · a malha passa de --neutro a --rede-cor (= --contraparte); o contorno escuro de 24 px continua. A fronteira fica
      sendo a única linha branca, entre UNITED STATES e CANADA;
    · a pílula ROADS ([-133.04, 59.54], na terra do Canadá, junto da malha e longe da divisa) entra em "continent"
      (1,813 s), com a malha já acesa ali, e se apaga em 300 ms a partir de 3,833 s, quando a estrada de Juneau começa:
      o quadro nunca passa de 6 elementos;
    · ABOUT 43 MILES e a linha da fonte passam de 3,567 s ("about") a 4,465 s, quando a estrada chega ao meio, onde a
      régua se ancora ("miles", 4,384–4,717 s): o rótulo de uma linha só entra com a linha;
    · as folgas foram medidas de novo sem tile, nos 242 quadros (relato do mapista de 30/09/2026).

  5ª versão (01/10/2026, 00:3x, a B do Lucas: "2. Mas menor", e logo depois "Perdão, na verdade o tamanho está bom.
  Estava ampliado"; identidade §6, "A legenda das cores, no lugar do nome na linha"). Ele propôs, depois de ver o
  ROADS: "Acho que talvez ao invés de 'ROADS' e etc, poderíamos ter um guia de o que cada cor representa, algo
  discreto":
    · sai a pílula ROADS; entra a legenda das cores (div#legenda), presa à tela no canto de cima à direita, com uma
      amostra de cada linha da cena e uma palavra: Border, Roads e Juneau's roads, cada uma com a sua linha;
    · ela conta como um elemento e sai inteira de 5,267 a 5,567 s, antes de Cascade Point: o item laranja fica 1,43 s
      inteiro no ar (3,833 → 5,267), menos que os 2,0 s de texto no ar, por escolha do Lucas (a opção dizia isso);
    · a malha em --rede-cor, ABOUT 43 MILES em 4,465 s e a linha da fonte continuam como na 4ª versão.
-->

<script>
(function () {
  "use strict";

  // ═══ CONFIGURAÇÃO DA CENA ═══════════════════════════════════════════════════════════════════════
  // Tempos em segundos DESTA cena (0 = 18,133 s do master), do words.json, no quadro seguinte ao início da
  // palavra (a regência os quantiza assim): 'Juneau' 18,914 → 0,8 · 'rest' 19,538 → 1,433 · 'continent' 19,946 →
  // 1,813 (o item Roads da legenda; o início exato da palavra) · 'about' 21,69 → 3,567 (a régua entrava aqui até a
  // 4ª versão) ·
  // 'forty-three' 21,943 → 3,833 · 'miles' 22,517 → 4,384 (a estrada chega ao meio em 4,465, e a régua entra aí) ·
  // 'north,' acaba em 23,23 → 5,097 · 'Cascade' 23,669 → 5,567 · 'stop.' 25,026 → 6,9.
  var CENA = {
    duracao: 8.034,                                  // espelho.json › s03 › dur
    largura: 3840, altura: 2160,                     // o palco; nunca mude (o zoom depende dele)
    perfil: "maptiler",                              // a base do vídeo inteiro (canal.json › mapa.perfil)
    relevo: false,                                   // relevo só em s44 (identidade §6)
    // A câmera anda o tempo todo (camera-mapa.js): sai larga, girada 10°, com a malha do Canadá no alto, e chega
    // à câmera nomeada "Juneau–estrada–anel" (o 2º viewport), norte para cima, com Juneau, a estrada, Cascade
    // Point, Haines e Skagway no quadro: o vão do Lynn Canal entre a ponta da estrada e a da malha.
    viewports: [
      // 3ª versão: os dois centros 100 px abaixo do que eram (mesmo zoom e giro): Juneau sobe 100 px na tela e
      // cabe o rótulo dele embaixo do ponto, longe da divisa (a leste) e da estrada (a oés-noroeste)
      { lng: -134.2884, lat: 58.8364, zoom: 8.30, bearing: 10, pitch: 0 },
      { lng: -134.9510, lat: 58.7560, zoom: 8.72, bearing: 0,  pitch: 0 }    // "Juneau–estrada–anel"
    ],
    bearingLoop: null,
    cameraAbre: 0.16, cameraFecha: 0.20,
    // a abertura: o último quadro (o 340º, 11,300–11,333 s) do clipe de s01 p3, que encolhe até o ponto de Juneau
    aereo: { src: "../_media/footage/s01/juneau-aereo-gastineau.mp4", duracaoArquivo: 11.3333, quadro: 11.3167,
             encolhe: 1.5, escalaFinal: 0.012, some: [1.25, 0.25] },
    fronteira: { geo: "panhandle-juneau", a: "US1", b: "CAN" },
    // a malha do continente: frente que fecha sobre Juneau, de 360 km até a ponta mais perto (Haines), com saída
    // suave; só as linhas que tocam a janela da cena
    rede: { geo: "rede-rodoviaria-continente", entra: 1.15, dura: 1.35, raioIni: 360, janela: [-141, 56, -127, 63], minimo_km: 50 },
    estrada: { geo: "estrada-juneau-cascade", entra: 3.833, dura: 1.264 },
    juneau: { geo: "cidades-ne", nome: "Juneau", entra: 0.8 },
    anel: { geo: "cascade-point", entra: 5.567, pulsos: [5.567, 6.9], pulso: 1.2 },
    regua: { fracao: 0.50 },                         // a âncora de ABOUT 43 MILES: o meio da estrada
    // rótulos: âncora na coordenada; lado = de que lado do ponto a pílula fica; dx/dy em px do palco. As âncoras de
    // país foram conferidas dentro do polígono do país no panhandle-juneau (ponto no polígono).
    // NENHUMA PÍLULA SOBRE UMA LINHA DO MAPA (identidade §6, Lucas, 30/09/2026): cada posição foi medida contra a
    // divisa, a malha e a estrada (as partes já acesas), quadro a quadro, nos 242 quadros da câmera, com a caixa
    // inteira da pílula e a meia espessura do traço mais largo de cada linha. A menor folga é de 34 px (Juneau ×
    // estrada); a tabela está no relato do mapista de 30/09/2026.
    rotulos: [
      { id: "rotJuneau",  ref: "juneau",  lado: "centro",   dx: 0,    dy: 140, entra: 0.8 },   // embaixo do ponto
      { id: "rotEUA",     lnglat: [-136.68, 58.24], lado: "centro", dx: 0, dy: 0, entra: 1.433 },   // a sudoeste, longe da divisa
      { id: "rotCanada",  lnglat: [-133.16, 59.04], lado: "centro", dx: 0, dy: 0, entra: 1.433 },
      // a régua entra quando a estrada chega ao meio, onde ela se ancora (em "miles", 4,384–4,717 s), e não em
      // "about": o rótulo de uma linha só entra com a linha (identidade §6)
      { id: "rotRegua",   ref: "regua",   lado: "esquerda", dx: -130, dy: 0,   entra: 4.465 },   // a oeste do meio da estrada
      { id: "rotCascade", ref: "anel",    lado: "esquerda", dx: -64,  dy: 0,   entra: 5.567 }
    ],
    creditos: { mapa: "© MapTiler © OpenStreetMap contributors", fonteEntra: 4.465, base: 52, vao: 8, faixa: 1880 },
    // a LEGENDA DAS CORES (identidade §6, "A legenda das cores, no lugar do nome na linha", Lucas, 01/10/2026: a B):
    // presa à tela no canto de cima à direita (top 160, right 200), fora de toda linha em todo o movimento da câmera;
    // cada item entra como rótulo junto com a sua linha (Border com os países, Roads em "continent", com a malha já
    // na tela, e Juneau's roads com a estrada); a caixa cresce uma linha por item. Ela conta como UM elemento e sai
    // inteira em 300 ms, de 5,267 a 5,567 s: no quadro de 5,567 s ela já está a zero, e Cascade Point (o anel e o
    // nome) entra no seguinte, sem o quadro passar de 6. É o mais tarde que o teto deixa. linha, vao e respiro são
    // os do CSS de #legenda. Grafia proposta; a final é do redator-de-tela.
    legenda: { itens: [{ id: "legBorder", entra: 1.433 }, { id: "legRoads", entra: 1.813 }, { id: "legJuneau", entra: 3.833 }],
               sai: 5.267, linha: 101, vao: 12, respiro: 16 }

    if (st === 429) return "limitou as requisições (HTTP 429)" + n + ". Espere e renderize de novo.";
    if (st >= 500) return "está com erro no servidor (HTTP " + st + ")" + n + ". Tente de novo mais tarde.";
    if (st) return "respondeu HTTP " + st + ".";
    return "não respondeu (sem internet? servidor fora do ar? firewall?)" + n + ".";
  }
  map.on("error", function (ev) {
    window.__errosMapa++;
    var err = (ev && ev.error) || {};
    var msg = String(err.message || "");
    var deRede = err.status || err.url || (ev && ev.tile) || /fetch|network|failed to load|load failed|cors/i.test(msg);
    if (!deRede) return falhar("o MapLibre acusou erro na cena: " + (msg || "sem descrição") + ". Confira o bloco CENA (ids de camada/fonte, valores).");
    var fonte = ev && ev.sourceId ? " (fonte '" + ev.sourceId + "')" : (mapaCarregado ? "" : " (o estilo do mapa)");
    falhar("a base '" + P.nome + "'" + fonte + " " + motivoRede(err, msg) + (err.url ? " URL: " + String(err.url).split("?")[0] : "") +
      (msg && !err.status && err.falha !== "corrompido" && err.falha !== "tempo" && !/could not be decoded|could not load image/i.test(msg) ? " — " + msg : ""));
  });

  var mapaCarregado = false;
  map.on("load", function () {
    try {
      // a divisa (identidade §6, "A divisa mais grossa", Lucas, 30/09/2026): branco a 70 %, 5 px, sobre contorno
      // escuro a 60 %, 12 px. Os valores vêm SÓ dos tokens; o segundo argumento do tok() é a reserva, com os mesmos
      // números, para o caso de o tokens.css não carregar
      map.addSource("fronteira", { type: "geojson", data: FRONTEIRA });
      map.addLayer({ id: "fronteira-contorno", type: "line", source: "fronteira", layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": tok("--fronteira-contorno-cor", "rgba(11,15,20,0.60)"),
                 "line-width": parseFloat(tok("--fronteira-contorno-espessura", "12")) } });
      map.addLayer({ id: "fronteira", type: "line", source: "fronteira", layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": tok("--fronteira-cor", "rgba(255,255,255,0.70)"),
                 "line-width": parseFloat(tok("--fronteira-espessura", "5")) } });
      // a malha do continente: --rede-cor (= --contraparte), 11 px, sobre o contorno da pílula (--rotulo, 24 px).
      // A cor é a regra "Estrada não se confunde com fronteira" (identidade §6, Lucas, 30/09/2026, opção D): a
      // fronteira é a única linha branca, e linha de mapa não vai em --neutro. No 1º render (6 px sobre contorno a
      // 45 %) ela virava um fio de 3 px no 1080p e sumia na neve; a medida de 11 px foi provada sobre os quadros do
      // 1º render, desenhada por cima deles e reduzida a 1080p, sem pedido de tile.
      map.addSource("rede", { type: "geojson", data: redeAte(CENA.rede.raioIni) });
      map.addLayer({ id: "rede-contorno", type: "line", source: "rede", layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": tok("--rotulo", "rgba(11,15,20,0.88)"), "line-width": 24, "line-opacity": 0 } });
      map.addLayer({ id: "rede", type: "line", source: "rede", layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": tok("--rede-cor", "#2EC4B6"), "line-width": 11, "line-opacity": 0 } });
      // a estrada de Juneau, a protagonista: --destaque, 14 px, sobre uma sombra escura de 26 px (acima da malha
      // na hierarquia: mais grossa e na cor do protagonista)
      map.addSource("estrada", { type: "geojson", data: trechoDaEstrada(0) });
      map.addLayer({ id: "estrada-sombra", type: "line", source: "estrada", layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": tok("--rotulo", "rgba(11,15,20,0.88)"), "line-width": 26, "line-opacity": 0, "line-blur": 2 } });
      map.addLayer({ id: "estrada", type: "line", source: "estrada", layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": tok("--destaque", "#F5A524"), "line-width": 14, "line-opacity": 0 } });
    } catch (e) { return falhar("não consegui desenhar a divisa, a malha ou a estrada: " + e.message); }
    mapaCarregado = true;
    map.once("idle", function () { if (!window.__erroCena) resolverPronto(true); });
  });

  // ── overlay ancorado por projeção ─────────────────────────────────────────────────────────────
  // rótulo ao lado do ponto; entra com opacidade + 24 px de subida em 300 ms, ease-out (identidade §4.4)
  function placeRotulo(r, entrada) {
    var el = E(r.id); if (!el || !r.p) return;
    var p = map.project(r.p);
    var tx = r.lado === "direita" ? "0%" : r.lado === "esquerda" ? "-100%" : "-50%";
    el.style.left = (p.x + (r.dx || 0)).toFixed(1) + "px";
    el.style.top = (p.y + (r.dy || 0)).toFixed(1) + "px";
    el.style.opacity = entrada.toFixed(3);
    el.style.transform = "translate(" + tx + ",-50%) translateY(" + ((1 - entrada) * 24).toFixed(1) + "px)";
  }

  var ultimoRaio = null, ultimaFracao = null;
  function aplicar(t) {
    if (!mapaCarregado) return;
    map.jumpTo(cameraAt(t));

    // a malha: frente de raioIni até a ponta mais perto de Juneau, com saída suave (para perto de Haines)
    var Rf = REDE.dmin - 0.5;
    var R = CENA.rede.raioIni + (Rf - CENA.rede.raioIni) * eo(seg(t, CENA.rede.entra, CENA.rede.dura));
    R = +R.toFixed(2);
    if (R !== ultimoRaio) { var sr = map.getSource("rede"); if (sr) sr.setData(redeAte(R)); ultimoRaio = R; }
    var vr = +eo(seg(t, CENA.rede.entra, 0.3)).toFixed(3);
    map.setPaintProperty("rede-contorno", "line-opacity", vr);
    map.setPaintProperty("rede", "line-opacity", vr);

    // a estrada de Juneau: cresce de Juneau a Cascade Point em sincronia com "forty-three miles north,"
    var fe = +eio(seg(t, CENA.estrada.entra, CENA.estrada.dura)).toFixed(4);
    if (fe !== ultimaFracao) { var se = map.getSource("estrada"); if (se) se.setData(trechoDaEstrada(fe)); ultimaFracao = fe; }
    var ve = t >= CENA.estrada.entra ? 1 : 0;
    map.setPaintProperty("estrada-sombra", "line-opacity", 0.85 * ve);
    map.setPaintProperty("estrada", "line-opacity", ve);

    // rótulos
    CENA.rotulos.forEach(function (r) { placeRotulo(r, eo(seg(t, r.entra, 0.3))); });

    // a legenda das cores: a caixa aparece com o 1º item e sai inteira em 300 ms; cada item seguinte entra como
    // rótulo (opacidade + 24 px de subida em 300 ms, ease-out) enquanto a caixa cresce a linha dele
    var Lg = CENA.legenda, cxL = E("legenda");
    if (cxL) {
      var hL = 2 * Lg.respiro + Lg.linha;
      Lg.itens.forEach(function (it, i) {
        var v = eo(seg(t, it.entra, 0.3)), el = E(it.id);
        if (i > 0) hL += (Lg.linha + Lg.vao) * v;
        if (el) {
          el.style.opacity = (i === 0 ? 1 : v).toFixed(3);   // o 1º aparece com a caixa (a opacidade é dela)
          el.style.transform = "translateY(" + ((1 - v) * 24).toFixed(1) + "px)";
        }
      });
      cxL.style.height = hL.toFixed(1) + "px";
      cxL.style.opacity = (eo(seg(t, Lg.itens[0].entra, 0.3)) * (1 - eio(seg(t, Lg.sai, 0.3)))).toFixed(3);
    }

    // o ponto de Juneau
    var pj = map.project(PONTO_JUNEAU), dotJ = E("pontoJuneau");
    if (dotJ) {
      dotJ.setAttribute("cx", pj.x.toFixed(1)); dotJ.setAttribute("cy", pj.y.toFixed(1));
      dotJ.setAttribute("opacity", eo(seg(t, CENA.juneau.entra, 0.3)).toFixed(3));
    }

    // o anel de Cascade Point: entra em 300 ms; cada pulso vai de escala 1 → 1,8 e opacidade 1 → 0 em 1,2 s.
    // Dois pulsos: o 1º quando o anel chega ('Cascade'), o 2º em 'stop.' (a cena acaba 1,13 s depois dele).
    var pa = map.project(PONTO_ANEL), g = E("anel");
    if (g) {
      g.setAttribute("transform", "translate(" + pa.x.toFixed(1) + " " + pa.y.toFixed(1) + ")");
      g.setAttribute("opacity", eo(seg(t, CENA.anel.entra, 0.3)).toFixed(3));
      CENA.anel.pulsos.forEach(function (t0, k) {
        var u = (t - t0) / CENA.anel.pulso, c = E("anelPulso" + (k + 1));
        if (!c) return;
        var vivo = u >= 0 && u < 1;
        c.setAttribute("r", (28 * (1 + 0.8 * (vivo ? u : 0))).toFixed(2));
        c.setAttribute("opacity", vivo ? (1 - u).toFixed(3) : "0");
      });
    }

    // a abertura: o quadro aéreo encolhe do quadro inteiro até o ponto de Juneau (que anda com a câmera)
    var A = CENA.aereo, cv = E("aereo"), mapaVisivel = true;
    if (cv) {
      var op = 1 - seg(t, A.some[0], A.some[1]);
      if (!aereoDesenhado || op <= 0) cv.style.visibility = "hidden";
      else {
        var u = eio(seg(t, 0, A.encolhe)), s = 1 - u * (1 - A.escalaFinal);
        var cx = 1920 + (pj.x - 1920) * u, cy = 1080 + (pj.y - 1080) * u, w = 3840 * s, h = 2160 * s;
        cv.style.visibility = "visible";
        cv.style.left = (cx - w / 2).toFixed(2) + "px"; cv.style.top = (cy - h / 2).toFixed(2) + "px";
        cv.style.width = w.toFixed(2) + "px"; cv.style.height = h.toFixed(2) + "px";
        cv.style.opacity = op.toFixed(3);
        // o mapa aparece no primeiro quadro em que o quadro aéreo deixa meio pixel de borda, ou começa a sumir
        var folga = Math.max(cx - w / 2, cy - h / 2, 3840 - (cx + w / 2), 2160 - (cy + h / 2));
        mapaVisivel = op < 1 || folga > 0.5;
      }
    }

    // o crédito de mapa: do primeiro ao último quadro em que o mapa aparece (identidade §6). Sobre o quadro aéreo
    // em tela cheia, antes do mapa, ele não vai (o clipe é do Envato: sem crédito na tela, identidade §7).
    var c1 = E("credito"), cf = E("creditoFonte");
    if (c1) c1.style.visibility = mapaVisivel ? "visible" : "hidden";
    // a linha da fonte, empilhada sobre a da MapTiler, enquanto ABOUT 43 MILES está no ar
    if (c1 && cf) {
      cf.style.bottom = (CENA.creditos.base + c1.offsetHeight + CENA.creditos.vao) + "px";
      cf.style.opacity = eo(seg(t, CENA.creditos.fonteEntra, 0.3)).toFixed(3);
    }
  }

  // ── o contrato de captura ───────────────────────────────────────────────────────────────────
  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // NUNCA lança
  };

  // espera de um nível de tile só na tela (molde): conta só os tiles que vão ser desenhados
  function nivelUnico() {
    try {
      if (map.getTerrain() || map.getPitch() > 1) return true;
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      var cache = sc.base; if (!cache) return true;
      var ids = cache.getRenderableIds ? cache.getRenderableIds() : Object.keys(cache._tiles || {});
      var tiles = ids.map(function (id) { return cache._tiles[id]; }).filter(Boolean);
      if (!tiles.length) return false;
      if (tiles.some(function (x) { return x.state === "loading"; })) return false;
      var niveis = new Set(tiles.map(function (x) { return x.tileID && x.tileID.canonical && x.tileID.canonical.z; }));
      return niveis.size <= 1;
    } catch (e) { return true; }
  }
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) {
        var ts = (sc[id] && sc[id]._tiles) || {};
        for (var k in ts) if (ts[k] && ts[k].state === "errored") return id;
      }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou (HTTP 404 ou resposta inválida). O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          // a malha e a estrada mudam por setData no quadro: a foto só sai com a forma deste t
          if (!map.isSourceLoaded("fronteira") || !map.isSourceLoaded("rede") || !map.isSourceLoaded("estrada")) return false;
          if (!map.isSourceLoaded("base")) return false;
          if (CENA.relevo && P.dem && (!map.isSourceLoaded("dem") || !map.getTerrain())) return false;
          return nivelUnico();
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0;
      (function tick() {
        barrarTileComErro();
        seguidas = pronto() ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo; se repetir, confira a conexão.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  // prévia: auto-loop só quando pedido (#preview). A captura nunca é a prévia: __prepararCaptura cancela o
  // loop e espera o quadro aéreo (o render espera esta Promise até 90 s).
  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return aereoPronto.then(function () { window.__renderAt(0); return true; });
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
</body>
</html>
