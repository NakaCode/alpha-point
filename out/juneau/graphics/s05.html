/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.

(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.

    if (!el) return; o = o || {};
    const s = (o.base ?? 1.02) + (o.zoom ?? 0.0024) * t;

  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }

    if (!cv || !cv.getContext) return; o = o || {};

    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));
    const img = ctx.createImageData(w, h), d = img.data, a = o.alfa ?? 22;

    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");

    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e

    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;

    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");

    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);

      credFonte: "Source: Alaska Division of Elections, 1982",        // textos-tela › _creditos s05 (o card e a fala)

    },
    // os tempos (locais, −34,667), da regência s05 e do words.json
    t: {
      nome: 0.733,                 // "Harris,"
      cargo: 1.433,                // "chaired"
      ano: 5.033,                  // "nineteen"
      cartao: 6.706, cartaoDur: 0.5,   // "wrote," (41,373): o cartão da fala pousa
      fala1: 7.133,                // "is
      fala2: 9.4,                  // "that"
      pulsos: [0.3, 6.373]         // o anel: na entrada e em "there," (41,04)
    },
    // o inset: parado; a câmera põe Juneau no ponto local (1260, 840), na coluna que o cartão não cobre
    inset: { zoom: 7.4, juneauEm: [1260, 840], juneau: { geo: "cidades-ne", nome: "Juneau" }, anel: { entra: 0.0, pulso: 1.2 } },
    // o cartão da fala: 2800 × (medido), em (200, 530), 0,8°
    cartao: { x: 200, y: 530, w: 2800, rot: 0.8 },
    luz: [880, 380]                // a luz da mesa, atrás do card de Harris
  };
  // ═════════════════════════════════════════════════════════════════════════════════════════════════
  var DUR = 11.733;   // o número escrito: o qc-janela lê `var DUR = <número>` no texto
  window.__duracao = DUR;
  var TX = CENA.textos;
  E("nome").textContent = TX.nome; E("cargoTxt").textContent = TX.cargo; E("cargoAno").textContent = TX.cargoAno;

  window.__avisos = window.__avisos || [];

  // ── erro legível: nunca um quadro cego calado (molde) ─────────────────────────────────────────
  window.__renderAt = function () {};
  window.__prepararCaptura = function () {};
  window.__aguardarMapa = function () { return Promise.resolve(true); };
  var resolverPronto, rejeitarPronto;
  window.__ready = new Promise(function (res, rej) { resolverPronto = res; rejeitarPronto = rej; });
  window.__ready.catch(function () { /* o erro vive em __erroCena; o render confere */ });

  }
  if (DUR !== CENA.duracao) falhar("a duração escrita (" + DUR + " s) não é a do bloco CENA (" + CENA.duracao + " s).");

  // ── o que a cena precisa ter recebido ───────────────────────────────────────────────────────
  var P = window.__REGIE_MAPA;
  if (typeof maplibregl === "undefined") return falhar("não carregou ../_media/_vendor/maplibre-gl.js. Rode: node <motor>/src/mapa/preparar-cena.mjs <proj>");
  if (!P) return falhar("sem perfil de base (window.__REGIE_MAPA). Rode: node <motor>/src/mapa/preparar-cena.mjs <proj>");
  if (P.nome !== CENA.perfil) return falhar("a base carregada é '" + P.nome + "', e o vídeo inteiro usa '" + CENA.perfil + "' (canal.json › mapa.perfil).");
  if (P.tipo !== "raster") return falhar("o perfil '" + P.nome + "' não é raster; esta cena desenha sobre satélite.");
  var chave = null;
  if (P.credencial) {
    chave = (window.__chaves || {})[P.credencial] || null;
    if (!chave) return falhar("a base '" + P.nome + "' precisa da chave " + P.credencial + ", que o render da Régie injeta na hora. " +

  function geo(slug) {

    if (!g) falhar("a geometria '" + slug + "' não foi carregada: falta <script src=\"../_media/geo/" + slug + ".js\"> ou o arquivo.");

  }

  var PONTO_JUNEAU = pontoDe(CENA.inset.juneau);
  if (window.__erroCena) return;

  // ── crédito na tela: a base (pelo perfil) + toda geometria cuja licença exige (molde) ─────────────────
  var creditoTexto = (function () {

    if (P.atribuicao && P.atribuicao.exigida) {

    var geos = window.__GEO || {}, meta = window.__GEO_META || {};
    var slugs = Object.keys(geos);
    for (var i = 0; i < slugs.length; i++) {

      if (!m) { falhar("a geometria '" + slugs[i] + "' foi carregada sem procedência (fonte/licença)."); return ""; }
      if (!m.exige_credito) continue;
      var t = m.credito_tela || (m.fonte && m.licenca ? "Geometria: " + m.fonte + " (" + m.licenca + ")" : "");

  var comChave = function (u) { return chave ? u.split("{chave}").join(encodeURIComponent(chave)) : u; };
  function estilo() {

    return { version: 8, sources: fontes, layers: [{ id: "base", type: "raster", source: "base",

  }

  }

    var st = err.status, n = err.tentativas > 1 ? " (" + err.tentativas + " tentativas)" : "";
    if (err.falha === "corrompido" || /could not be decoded|could not load image|tile corrompido/i.test(msg)) {

    if (st === 401 || st === 403) return "recusou o acesso (HTTP " + st + "). Confira a chave " + (P.credencial || "") + " e o plano do dono.";
    if (st === 429) return "limitou as requisições (HTTP 429)" + n + ". Espere e renderize de novo.";

    falhar("a base '" + P.nome + "'" + fonte + " " + motivoRede(err, msg) + (err.url ? " URL: " + String(err.url).split("?")[0] : "") +
      (msg && !err.status && err.falha !== "corrompido" && err.falha !== "tempo" && !/could not be decoded|could not load image/i.test(msg) ? " — " + msg : ""));
  });

  map.on("load", function () {

  function medir() { cartaoH = E("fala").offsetHeight || cartaoH; }
  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = clamp(op, 0, 1).toFixed(3);

    if (!el) return;
    op = clamp(op, 0, 1);
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translateY(" + ((1 - op) * 24).toFixed(1) + "px)";   // rótulo: 300 ms, opacidade + 24 px (§4.4)
  }
  function credito(el, texto, op) {
    if (!el) return;
    op = clamp(op, 0, 1);
    if (el.textContent !== texto) el.textContent = texto;

    cam.style.setProperty("--luz-x", CENA.luz[0] + "px");
    cam.style.setProperty("--luz-y", CENA.luz[1] + "px");

    rotulo(E("nome"), eo(seg(t, T.nome, 0.3)));
    rotulo(E("cargo"), eo(seg(t, T.cargo, 0.3)));
    E("cargoAno").style.opacity = eo(seg(t, T.ano, 0.3)).toFixed(3);

    E("fala1").style.opacity = eo(seg(t, T.fala1, 0.3)).toFixed(3);
