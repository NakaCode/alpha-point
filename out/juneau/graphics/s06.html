/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.

  // Câmera: push-in contínuo + deriva senoidal. Nada congela.

    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()

    op = clamp(op, 0, 1);
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translateY(" + ((1 - op) * 24).toFixed(1) + "px)";   // rótulo: 300 ms, opacidade + 24 px (§4.4)
  }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    var b1 = t < T.corte;

    // ── b1: a mesa com o cartão comprido; o pan corre por dentro do recorte ──
    var cam = E("cam");
    cam.style.visibility = b1 ? "visible" : "hidden";
    R.camera(cam, t, { base: 1.0 });   // base 1,0: a de 1,02 do RIG empurrava a margem de 200 px
    por(E("p1"), P1.cx, P1.cy, P1.w, P1.h, P1.rot);
    var x0 = lerp(T.panX0, T.panX1, clamp(t, 0, T.corte) / T.corte);
    E("img1").style.left = (-x0 * P1.escala).toFixed(2) + "px";
    cam.style.setProperty("--luz-x", P1.cx.toFixed(1) + "px");   // a luz atrás do cartão, que não se move
    cam.style.setProperty("--luz-y", P1.cy.toFixed(1) + "px");
    rotulo(E("rLugar1"), b1 ? eo(seg(t, 0, 0.3)) : 0);
    rotulo(E("aviso1"), b1 ? eo(seg(t, 0, 0.3)) : 0);

    // ── b2: Juneau City em tela cheia, parada; o 1880 em "The" ──
    E("reg2").style.visibility = b1 ? "hidden" : "visible";
    rotulo(E("rLugar2"), b1 ? 0 : eo(seg(t, T.corte, 0.3)));
    rotulo(E("aviso2"), b1 ? 0 : eo(seg(t, T.corte, 0.3)));
    var opData = b1 ? 0 : eo(seg(t, T.data, 0.3));
    rotulo(E("rData"), opData);
    // o crédito do 1880, enquanto ele está no ar
    var c = E("credFonte");
    creditoTexto(c, TEXTOS.credFonte);
    c.hidden = opData <= 0; c.style.opacity = opData.toFixed(3);
    E("creds").classList.toggle("vazio", opData <= 0);
    E("creds").style.opacity = opData.toFixed(3);   // a pílula acende junto com a linha
  }
  // o crédito longo quebra em duas linhas (identidade §4.2, nunca encolhe), mas nunca no meio do último trecho:
  // o último trecho depois de ", " ou " · " não se parte
  function creditoTexto(el, texto) {
    if (el.getAttribute("data-texto") === texto) return;
    el.setAttribute("data-texto", texto); el.textContent = "";
    var i = Math.max(texto.lastIndexOf(", "), texto.lastIndexOf(" · "));
    if (i < 0) { el.textContent = texto; return; }
    var corte = i + (texto.charAt(i) === "," ? 2 : 3);
    el.appendChild(document.createTextNode(texto.slice(0, corte)));
    var s = document.createElement("span"); s.style.whiteSpace = "nowrap"; s.textContent = texto.slice(corte);
    el.appendChild(s);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
})();
</script>
