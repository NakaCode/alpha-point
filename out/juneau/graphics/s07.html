<script>
/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de
   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();

(function () {

  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.

  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }

  }

  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.

    for (const k in p) {

      else document.documentElement.style.setProperty("--" + k, String(p[k]));

  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {

    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0

    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });

    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }

})();

    var rs = E("rotSitkaFoto"), vs = eo(seg(t, T.rotSitkaFoto, 0.3)) * (1 - seg(t, T.mapa, 0.3));
    if (rs) { rs.style.opacity = vs.toFixed(3); rs.style.transform = "translateY(" + ((1 - eo(seg(t, T.rotSitkaFoto, 0.3))) * 24).toFixed(1) + "px)"; }

    // a luz da mesa: atrás da página real, depois da recriação (1,4–2,0 s), depois da foto (7,733–8,033 s)
    var lx = lerp(cx00, B.c[0], u), ly = lerp(cy00, B.c[1], u), w2 = eo(seg(t, T.pousaFoto, 0.3));
    lx = lerp(lx, Fo.c[0], w2); ly = lerp(ly, Fo.c[1] + 240 * (1 - pf), w2);
    cam.style.setProperty("--luz-x", lx.toFixed(1) + "px"); cam.style.setProperty("--luz-y", ly.toFixed(1) + "px");

    // ── b3: os pontos e os nomes no mapa ──
    var pj = map.project(CID.Juneau);
    var dS = E("pontoSitka"), dJ = E("pontoJuneau");
    dS.setAttribute("cx", ps.x.toFixed(1)); dS.setAttribute("cy", ps.y.toFixed(1));
    dS.setAttribute("opacity", eo(seg(t, T.rotSitka, 0.3)).toFixed(3));
    dJ.setAttribute("cx", pj.x.toFixed(1)); dJ.setAttribute("cy", pj.y.toFixed(1));
    dJ.setAttribute("opacity", eo(seg(t, T.rotJuneau, 0.3)).toFixed(3));
    CENA.rotulos.forEach(function (r) {
      var v = eo(seg(t, r.entra, 0.3)) * (r.sai ? 1 - seg(t, r.sai, 0.3) : 1);
      placeRotulo(r, t < r.entra ? 0 : v, eo(seg(t, r.entra, 0.3)));
    });

    // ── b4: as folhas de 1912 caem sobre o mapa (a real à direita, a recriação à esquerda, sobre Juneau) ──
    var cam2 = E("cam2"), t2 = Math.max(0, t - T.cai12);
    R.camera(cam2, t2, { base: 1.0 });
    var G = CENA.pag12, d12 = pagina("pag12", G, G.k), p12 = eo(seg(t, T.cai12, T.caiDur));
    // a real cai do canto de cima à direita (a origem): cresce para a esquerda, nunca para fora da margem
    por(E("pag12"), G.topoDir[0] - d12.w / 2, G.topoDir[1] + d12.h / 2, d12.w, d12.h, lerp(2.4, G.rot, p12), 1 + 0.05 * (1 - p12),
        t < T.cai12 ? 0 : seg(t, T.cai12, 0.15), "100% 0%");
    fita(E("pag12fe"), t, T.fita12, -38); fita(E("pag12fd"), t, T.fita12 + 0.12, 38);
    var H = CENA.rec12pos, p2r = eo(seg(t, T.caiRec12, T.caiDur));
    // a recriação cai do meio do topo (a origem): o topo fica abaixo do 1906, que ainda está no ar
    por(E("rec12"), H.topoCentro[0], H.topoCentro[1] + F12.h / 2, F12.w, F12.h, lerp(-2.0, H.rot, p2r), 1 + 0.05 * (1 - p2r),
        t < T.caiRec12 ? 0 : seg(t, T.caiRec12, 0.15), "50% 0%");
    fita(E("rec12fe"), t, T.fitaRec12, -38); fita(E("rec12fd"), t, T.fitaRec12 + 0.12, 38);
    E("ano1912").style.opacity = eo(seg(t, T.ano1912, 0.3)).toFixed(3);
    grifar(F12, t);

    // o crédito de mapa: do primeiro quadro com mapa (o corte, 10,567 s) ao último
    var c1 = E("credito"); if (c1) c1.style.visibility = naMesa ? "hidden" : "visible";
  }

  // ── o contrato de captura ───────────────────────────────────────────────────────────────────
  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // NUNCA lança
  };

  // espera de um nível de tile só na tela (molde): conta só os tiles que vão ser desenhados
  function nivelUnico() {
    try {
      if (map.getTerrain() || map.getPitch() > 1) return true;
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      var cache = sc.base; if (!cache) return true;
      var ids = cache.getRenderableIds ? cache.getRenderableIds() : Object.keys(cache._tiles || {});
      var tiles = ids.map(function (id) { return cache._tiles[id]; }).filter(Boolean);
      if (!tiles.length) return false;
      if (tiles.some(function (x) { return x.state === "loading"; })) return false;
      var niveis = new Set(tiles.map(function (x) { return x.tileID && x.tileID.canonical && x.tileID.canonical.z; }));
      return niveis.size <= 1;
    } catch (e) { return true; }
  }
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) {
        var ts = (sc[id] && sc[id]._tiles) || {};
        for (var k in ts) if (ts[k] && ts[k].state === "errored") return id;
      }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou (HTTP 404 ou resposta inválida). O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          if (!map.isSourceLoaded("fronteira") || !map.isSourceLoaded("base")) return false;
          if (CENA.relevo && P.dem && (!map.isSourceLoaded("dem") || !map.getTerrain())) return false;
          return nivelUnico();
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0;
      (function tick() {
        barrarTileComErro();
        seguidas = pronto() ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo; se repetir, confira a conexão.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  // as imagens e as fontes da marca (o RIG espera "Marca"/"MarcaSec"); a Courier Prime da folha ("MarcaDoc") também
  var docPronta = Promise.all(["400 86px MarcaDoc", "700 84px MarcaDoc"].map(function (f) {
    return document.fonts.load(f).then(function (l) {
      if (!l || !l.length) (window.__fontesFaltando = window.__fontesFaltando || []).push("MarcaDoc " + f.split(" ")[0] + ": não carregou");
    }, function () { (window.__fontesFaltando = window.__fontesFaltando || []).push("MarcaDoc " + f.split(" ")[0] + ": erro"); });
  }));
  window.__fotosProntas = R.prontas().then(function () { return docPronta; }).then(function () { return true; });

  // prévia: auto-loop só quando pedido (#preview). A captura nunca é a prévia.
  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__fotosProntas.then(function () { window.__renderAt(0); return true; });
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
