    } catch (e) { return falhar("não consegui desenhar a divisa, a malha ou a estrada: " + e.message); }
    mapaCarregado = true;
    map.once("idle", function () { if (!window.__erroCena) resolverPronto(true); });
  });

  // ── as peças ────────────────────────────────────────────────────────────────────────────────────
  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = cl(op, 0, 1).toFixed(3);
  }
  // a fita cola: desce CENA.p1.fitas.cai de CENA.p1.fitas.escala e assenta em 300 ms (o "cola" da prancha)
  function fita(el, t, t0, rot) {
    if (!el) return;
    var FT = CENA.p1.fitas, p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * -FT.cai).toFixed(1) + "px) rotate(" + rot + "deg) scale(" + (1 + (1 - p) * (FT.escala - 1)).toFixed(4) + ")";
  }
  // texto fixo: entra com opacidade + 24 px de subida em 300 ms (ease-out) e sai só com a opacidade (identidade §4.4)
  function textoFixo(id, t) {
    var c = CENA.textosFixos[id], el = E(id); if (!el) return;
    var ent = eo(seg(t, c.entra, 0.3)), op = ent;
    if (c.sai !== undefined) op *= 1 - seg(t, c.sai, c.saiDur);
    if (c.ate !== undefined && t >= c.ate) op = 0;

    if (c.centro) { el.style.left = c.centro[0] + "px"; el.style.top = c.centro[1] + "px"; el.style.transform = "translate(-50%,-50%) translateY(" + ((1 - ent) * 24).toFixed(1) + "px)"; }
    else if (c.dir) { el.style.left = c.dir[0] + "px"; el.style.top = c.dir[1] + "px"; el.style.transform = "translate(-100%,0) translateY(" + ((1 - ent) * 24).toFixed(1) + "px)"; }
    else el.style.transform = "translateY(" + ((1 - ent) * 24).toFixed(1) + "px)";
    el.style.opacity = op.toFixed(3);
  }
  function placeRotulo(r, op, entrada) {
    var el = E(r.id); if (!el || !r.p) return;
    var p = map.project(r.p);
    var tx = r.lado === "direita" ? "0%" : r.lado === "esquerda" ? "-100%" : "-50%";
    el.style.left = (p.x + (r.dx || 0)).toFixed(1) + "px";
    el.style.top = (p.y + (r.dy || 0)).toFixed(1) + "px";
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translate(" + tx + ",-50%) translateY(" + ((1 - entrada) * 24).toFixed(1) + "px)";
  }

  var ultimaFracao = null, ultimoRaio = null;
  function aplicar(t) {
    if (!mapaCarregado) return;
    map.jumpTo(cameraAt(t));
    var pA = map.project(CID.A), pF = map.project(CID.F), pJ = map.project(CID.J);

    // ── os pontos: Juneau em --destaque desde o começo; Anchorage e Fairbanks se acendem sem nome ──
    [["pontoAnchorage", pA, CENA.pontos.AF], ["pontoFairbanks", pF, CENA.pontos.AF], ["pontoJuneau", pJ, CENA.pontos.J]].forEach(function (x) {
      var d = E(x[0]); d.setAttribute("cx", x[1].x.toFixed(1)); d.setAttribute("cy", x[1].y.toFixed(1));
      d.setAttribute("opacity", (x[2] <= 0 ? 1 : eo(seg(t, x[2], 0.3))).toFixed(3));
    });
    // ── os nomes do mapa ──
    CENA.rotulos.forEach(function (r) {
      var ent = eo(seg(t, r.entra, 0.3)), op = t < r.entra ? 0 : ent * (r.sai ? 1 - seg(t, r.sai, 0.3) : 1);
      placeRotulo(r, op, ent);
    });

    // ── b2: a de 1915 sobe do ponto de Anchorage e para impressa; recolhe a ele por baixo da Ladd Field ──
    var Q = CENA.p1, u1 = eo(seg(t, Q.sobe, Q.sobeDur)), q1 = eb(seg(t, Q.recolhe, Q.recolheDur));
    var x1 = lerp(lerp(pA.x, Q.c[0], u1), pA.x, q1), y1 = lerp(lerp(pA.y, Q.c[1], u1), pA.y, q1);
    var s1 = lerp(lerp(0.012, 1, u1), 0.012, q1);
    por(E("p1"), x1, y1, Q.w, Q.h, lerp(lerp(0, Q.rot, u1), 0, q1), s1, t < Q.sobe || t >= Q.recolhe + Q.recolheDur ? 0 : seg(t, Q.sobe, 0.12));
    fita(E("p1fe"), t, Q.fita, Q.fitas.rot[0]); fita(E("p1fd"), t, Q.fita + 0.12, Q.fitas.rot[1]);

    // ── b3: a Ladd Field sobe do ponto de Fairbanks para a tela cheia (opaca desde o 1º quadro); b4: encolhe a ele ──
    var Q2 = CENA.p2, u2 = eo(seg(t, Q2.sobe, Q2.sobeDur)), m2 = eb(seg(t, Q2.encolhe, Q2.encolheDur));
    var S2 = lerp(Q2.F * u2, 0.012, m2), x2 = lerp(lerp(pF.x, 1920, u2), pF.x, m2), y2 = lerp(lerp(pF.y, 1080, u2), pF.y, m2);
    var op2 = t < Q2.sobe ? 0 : 1 - seg(t, Q2.encolhe + Q2.encolheDur - 0.25, 0.25);
    por(E("p2"), x2, y2, Q2.pw + 96, Q2.janelaH + 96, 0, S2, op2);
    var kb = 1 + 0.02 * Math.max(0, t - Q2.sobe), im2 = E("p2img");   // Ken Burns 1,00 → 1,12 em 6 s (§4.4), como na s09
    im2.style.transform = "scale(" + kb.toFixed(5) + ")";
    im2.style.transformOrigin = (Q2.px + Q2.pw / 2).toFixed(1) + "px " + (Q2.py + Q2.janelaY + Q2.janelaH / 2).toFixed(1) + "px";

    // ── b5: a obra de 1942 em tela cheia, de corte seco a corte seco ──
    var Q3 = CENA.p3, f42 = E("foto42"), im3 = E("p3img"), noAr42 = t >= Q3.de && t < Q3.ate;
    f42.style.visibility = noAr42 ? "visible" : "hidden";
    var kb3 = 1 + 0.02 * Math.max(0, t - Q3.de), esc = Q3.escala * kb3;   // Ken Burns: chega a 1,316× (teto 1,4×)
    im3.style.width = (Q3.arquivo[0] * esc).toFixed(1) + "px"; im3.style.height = (Q3.arquivo[1] * esc).toFixed(1) + "px";
    im3.style.left = (1920 - Q3.arquivo[0] * esc / 2).toFixed(1) + "px";
    im3.style.top = (1080 - (Q3.janelaY + 1699 / 2) * esc).toFixed(1) + "px";

    // ── os textos fixos ──
    Object.keys(CENA.textosFixos).forEach(function (id) { textoFixo(id, t); });

    // ── b6: a estrada e a malha ──
    var ES = CENA.estrada, fe = +eb(seg(t, ES.entra, ES.dura)).toFixed(4);
    if (fe !== ultimaFracao) { var se = map.getSource("estrada"); if (se) se.setData(trechoDaEstrada(fe)); ultimaFracao = fe; }
    var some = 1 - seg(t, ES.some[0], ES.some[1]), ve = t >= ES.entra ? some : 0;
    map.setPaintProperty("estrada-contorno", "line-opacity", ve); map.setPaintProperty("estrada", "line-opacity", ve);
    var MA = CENA.malha, Rk = +(MALHA.dmax * eo(seg(t, MA.entra, MA.dura))).toFixed(1);
    if (Rk !== ultimoRaio) { var sm = map.getSource("malha"); if (sm) sm.setData(malhaAte(Rk)); ultimoRaio = Rk; }
    var vm = t >= MA.entra ? some : 0;
    map.setPaintProperty("malha-contorno", "line-opacity", vm); map.setPaintProperty("malha", "line-opacity", vm);

    // ── a legenda das cores: entra inteira (Border e Roads) com a estrada e sai nos últimos 300 ms do fade das linhas ──
    var lg = E("legenda"); if (lg) lg.style.opacity = (eo(seg(t, CENA.legenda.entra, 0.3)) * (1 - eb(seg(t, CENA.legenda.sai, 0.3)))).toFixed(3);

    // ── b7–b8: o pictograma ──
    var pc = E("picto"); if (pc) pc.style.opacity = (t < PC.entra ? 0 : eo(seg(t, PC.entra, 0.3))).toFixed(3);
    var L = acesas(t); for (var i = 0; i < figuras.length; i++) figuras[i].setAttribute("opacity", L[i].toFixed(3));
    var me = E("pictoMetade"); if (me) me.setAttribute("opacity", (0.55 * eo(seg(t, PC.luz1960[0], 0.3))).toFixed(3));

    // ── os créditos: o da MapTiler enquanto o mapa aparece (some sob as fotos em tela cheia); o da fonte enquanto os
    //    textos dela estão no ar, empilhado sobre o da MapTiler ──
    var cheia = (t >= Q2.sobe + Q2.sobeDur && t < Q2.encolhe) || noAr42;
    var c1 = E("credito"), cf = E("creditoFonte");
    if (c1) c1.style.visibility = cheia ? "hidden" : "visible";
    if (c1 && cf) {
      cf.style.bottom = (CENA.creditos.base + c1.offsetHeight + CENA.creditos.vao) + "px";
      var vf = 0; CENA.creditos.fonte.forEach(function (j) { vf = Math.max(vf, eo(seg(t, j[0], 0.3)) * (1 - seg(t, j[1], 0.3)) * (t >= j[0] ? 1 : 0)); });
      cf.style.opacity = vf.toFixed(3);
    }
  }

  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }
  };

  function nivelUnico() {
    // pronto quando nenhum tile da base está carregando e os níveis à vista são no máximo dois, vizinhos (pedido do Claude
    // central, 01/10/2026): perto da fronteira de meio nível, com os tiles que os quadros anteriores deixaram no cache, o
    // MapLibre cobre a tela com dois níveis vizinhos já carregados e não sai disso sozinho (s08, quadro 42: 24 tiles do
    // nível 7 e 5 do 8, todos carregados, por 12 s). O pai borrado no lugar do filho que ainda carrega continua barrado:
    // esse filho está "loading" no cache, e aí não está pronto
    try {
      if (map.getTerrain() || map.getPitch() > 1) return true;
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      var cache = sc.base; if (!cache) return true;
      var todos = cache._tiles || {};
      for (var k in todos) { var st = todos[k] && todos[k].state; if (st === "loading" || st === "reloading") return false; }
      var ids = cache.getRenderableIds ? cache.getRenderableIds() : Object.keys(todos);
      var zs = ids.map(function (id) { var x = todos[id]; return x && x.tileID && x.tileID.canonical ? x.tileID.canonical.z : null; })
        .filter(function (z) { return z !== null; });
      if (!zs.length) return false;
      return Math.max.apply(null, zs) - Math.min.apply(null, zs) <= 1;
    } catch (e) { return true; }
  }
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) {
        var ts = (sc[id] && sc[id]._tiles) || {};
        for (var k in ts) if (ts[k] && ts[k].state === "errored") return id;
      }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou (HTTP 404 ou resposta inválida). O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          // a estrada e a malha mudam por setData no quadro: a foto só sai com a forma deste t
          if (!map.isSourceLoaded("fronteira") || !map.isSourceLoaded("malha") || !map.isSourceLoaded("estrada")) return false;
          if (!map.isSourceLoaded("base")) return false;
          if (CENA.relevo && P.dem && (!map.isSourceLoaded("dem") || !map.getTerrain())) return false;
          return nivelUnico();
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0;
      (function tick() {
        barrarTileComErro();
        seguidas = pronto() ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo; se repetir, confira a conexão.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  window.__fotosProntas = R.prontas().then(function () { return true; });

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__fotosProntas.then(function () { window.__renderAt(0); return true; });
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
