  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();
</script>
<script>
(function () {
  "use strict";
  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo, eb = R.eb;
  var E = function (id) { return document.getElementById(id); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var DUR = 7.067;
  window.__duracao = DUR;

  // ── os tempos (locais, −78,1), do words.json e da regência s08#2–#4 ──
  var T = {
    pousa: 0.00, pousaDur: 0.55,          // a foto de 1915 pousa na mesa até "railroad" acabar (0,55)
    fita1: 0.45,                          // a fita cola logo depois
    r1914: 0.033,                         // "A" (78,13 s): o 1914 e a fonte entram
    a1915: 0.20,                          // o aviso do ano entra com a foto
    corte: 2.733, troca: 0.30,            // o fim de s08#2: a troca de 300 ms (2,733–3,033)
    sai1914: 2.567, sai1914Dur: 0.25,     // o 1914 e a fonte saem antes do corte (2,567–2,817): a Ladd Field, que sobe opaca por cima, só
                                          // alcança a faixa de crédito em 2,85 s, e a fonte já se foi (ofício §5: o que entra por cima manda o que estava sair antes)
    laddTx: 3.033,                        // "Ladd Field" e "Photo from 1943", quando ela enche o quadro
    went: 4.822, recolheDur: 0.60,        // "went" (82,922 s): a Ladd Field recolhe para a mesa
    fita2: 5.30
  };

  // ── a geometria das duas fotos ──
  var PAD = 48;
  // p1: recorte 2750×1265 (2500×1150 a 1,1×); grupo 2846×1361; pousa em (1713, 900), −1,5°: x 273→3153, y 202→1598
  var P1 = { w: 2846, h: 1361, cx: 1713, cy: 900, rot: -1.5 };
  // p2: a imagem dentro do cartão tem 3664×2816 (do arquivo 4488×3537: x 392→4056, y 456→3262); a mesa mostra 3664×2690
  //     (y 456→3146): os 106 px de pátio do rodapé, com a linha datilografada "(G177 A33-6039E-LF)(7-9-43)", ficam fora.
  //     tela cheia: janela 16:9 de 3664×2061 começando 400 px abaixo do topo da imagem (fica a cauda, a torre e a fila;
  //     corta céu e pátio), a 3840/3664 = 1,048×, centrada no palco.
  //     mesa: a imagem (3664×2690) a 0,5×, centrada em (2590, 950), +1,3°: x 1650→3530, y 253→1647, fora do canto reservado.
  var P2 = { pw: 3664, ph: 2690, px: 392, py: 456, janelaH: 2061, janelaY: 400, F: 3840 / 3664,
             mesaS: 0.5, mesaCx: 2590, mesaCy: 950, mesaRot: 1.3 };

  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.width = w.toFixed(1) + "px"; el.style.height = h.toFixed(1) + "px";
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  function rotulo(el, op, x, y) {
    if (!el) return;
    el.style.opacity = clamp(op, 0, 1).toFixed(3);
    // rótulo entra em 300 ms: opacidade + 24 px de subida (identidade §4.4)
    if (x !== undefined) { el.style.left = x.toFixed(1) + "px"; el.style.top = y.toFixed(1) + "px"; }
    el.style.transform = "translateY(" + ((1 - clamp(op, 0, 1)) * 24).toFixed(1) + "px)";
  }
  function fita(el, t, t0) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    // cola: desce 40 px e assenta; a rotação própria da fita fica no atributo style de cada uma (re-escrita aqui)
    var rot = el.id === "p1fe" || el.id === "p2fe" ? -4 : 4;
    el.style.transform = "translateY(" + ((1 - p) * -40).toFixed(1) + "px) rotate(" + rot + "deg) scale(" + (1 + (1 - p) * 0.08).toFixed(4) + ")";
  }

  function cena(t) {
    // a câmera: push-in contínuo + deriva (RIG.camera), sobre a mesa inteira
    R.camera(E("cam"), t, { base: 1.0 });   // base 1,0: a de 1,02 do RIG empurrava o que está a x = 200 para x = 159 na tela

    // ── p1: a foto de 1915 pousa, fica, e recolhe na troca ──
    var p = eo(seg(t, T.pousa, T.pousaDur));                 // 0 → 1: pousa
    var q = seg(t, T.corte, T.troca); q = q * q;              // 0 → 1: recolhe (ease-in)
    var op1 = seg(t, T.pousa, 0.22) * (1 - q);
    por(E("p1"), P1.cx, P1.cy + 240 * (1 - p), P1.w, P1.h, lerp(-2, P1.rot, p), (0.72 + 0.28 * p) * (1 - 0.12 * q), op1);   // inclinação de −2° a −1,5°: nunca passa dos 2° da identidade §5; a pousada vem da subida e da escala
    fita(E("p1fe"), t, T.fita1); fita(E("p1fd"), t, T.fita1 + 0.12);

    // o 1914 (em "A"), o aviso de 1915 e a fonte: entram, ficam, saem na troca
    var sai1 = 1 - seg(t, T.corte, T.troca);              // o aviso sai com a foto (abaixo da Ladd Field)
    var sai14 = 1 - seg(t, T.sai1914, T.sai1914Dur);      // o 1914 e a fonte saem antes
    rotulo(E("r1914"), eo(seg(t, T.r1914, 0.3)) * sai14);
    rotulo(E("a1915"), eo(seg(t, T.a1915, 0.3)) * sai1);
    var cred = E("cred"); if (cred) cred.style.opacity = (seg(t, T.r1914, 0.3) * sai14).toFixed(3);

    // ── p2: a Ladd Field sobe para a tela cheia na troca, e em "went" recolhe para a mesa ──
    var u = eo(seg(t, T.corte, T.troca));                     // 0 → 1: sobe
    var m = eb(seg(t, T.went, T.recolheDur));                 // 0 → 1: recolhe para a mesa
    var H = lerp(P2.janelaH, P2.ph, m);                       // a altura do recorte: da janela 16:9 à imagem inteira
    var janY = lerp(P2.janelaY, 0, m);                        // o topo da janela dentro da imagem
    var S = lerp(P2.F * u, P2.mesaS, m);                     // sobe de um PONTO (escala 0) à tela cheia, opaca: cobre, nunca se mistura
    var cx = lerp(1920, P2.mesaCx, m), cy = lerp(1080, P2.mesaCy, m), rot = lerp(0, P2.mesaRot, m);
    // a luz da mesa (identidade §5): centrada atrás da foto que está na mesa, e anda com ela. Na de 1915, desce com ela na
    // pousada; na troca (0,3 s, enquanto a Ladd Field sobe de um ponto) vai do centro da de 1915 ao da Ladd Field, com o
    // mesmo ease-out da subida; em tela cheia não aparece (a foto cobre tudo); em "went" recolhe com a Ladd Field até a mesa.
    var lx = lerp(P1.cx, cx, u), ly = lerp(P1.cy + 240 * (1 - p), cy, u);
    var cam = E("cam");
    if (cam) { cam.style.setProperty("--luz-x", lx.toFixed(1) + "px"); cam.style.setProperty("--luz-y", ly.toFixed(1) + "px"); }
    // (as pílulas "Ladd Field" e "Photo from 1943" estão fora da câmera; a foto, dentro: a diferença é o push-in de até 1,7 %)
    var op2 = t >= T.corte ? 1 : 0;                         // opaca desde o primeiro quadro: nada da foto de 1915 aparece através dela
    por(E("p2"), cx, cy, P2.pw + 2 * PAD, H + 2 * PAD, rot, S, op2);
    var r2 = E("p2r"); if (r2) r2.style.height = H.toFixed(1) + "px";
    // Ken Burns na tela cheia (1,00 → 1,12 em 6 s, linear, §4.4), desfeito ao pousar na mesa
    var kb = lerp(1 + 0.02 * Math.max(0, t - T.corte), 1, m);
    var im = E("p2img");
    if (im) { im.style.top = (-(P2.py + janY)).toFixed(1) + "px"; im.style.transform = "scale(" + kb.toFixed(5) + ")";
              im.style.transformOrigin = (P2.px + P2.pw / 2).toFixed(1) + "px " + (P2.py + janY + H / 2).toFixed(1) + "px"; }
    var mold = E("p2m"); if (mold) mold.style.opacity = eo(seg(t, T.went + 0.22, 0.3)).toFixed(3);
    fita(E("p2fe"), t, T.fita2); fita(E("p2fd"), t, T.fita2 + 0.12);

    // "Ladd Field" e "Photo from 1943": entram em 3,033 e, em "went", vão com a foto para a mesa, fora dela
    var opL = eo(seg(t, T.laddTx, 0.3));
    rotulo(E("rladd"), opL, lerp(200, 900, m), lerp(1380, 780, m));
    rotulo(E("a1943"), opL, lerp(200, 900, m), lerp(1600, 1000, m));
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança: uma exceção mataria a captura
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
})();
</script>
