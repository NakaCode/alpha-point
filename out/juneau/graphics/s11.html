  var COL = [
    { id: "c1", cx: 764,  cy: 1040, rot: -0.8 },   // correção do render (01/10/2026): 264→1.264 (girado, 255 ≥ 254 sob a câmera a 1,029)
    { id: "c2", cx: 1920, cy: 1040, rot: 0.6 },
    { id: "c3", cx: 3070, cy: 1040, rot: -0.4 }    // idem: 2.570→3.570 (girado, 3.579 ≤ 3.586)
  ];
  var W = 1000, H = 1240;

  function por(el, cx, cy, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + (cx - W / 2).toFixed(2) + "px," + (cy - H / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  function rotulo(el, op) {
    if (!el) return;
    op = clamp(op, 0, 1);
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translateY(" + ((1 - op) * 24).toFixed(1) + "px)";   // rótulo: 300 ms, opacidade + 24 px (§4.4)
  }
  // o carimbo bate: escala 1,55 → 0,97 em 70 % da batida e → 1 no resto; opacidade 0 → 1 na primeira metade
  function carimbo(el, t, t0) {
    if (!el) return;
    var p = seg(t, t0, T.batida), s, op;
    if (p < 0.7) { var q = eo(p / 0.7); s = lerp(1.55, 0.97, q); op = clamp(p / 0.35, 0, 1); }
    else { s = lerp(0.97, 1, (p - 0.7) / 0.3); op = 1; }
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translateX(-50%) rotate(-7deg) scale(" + s.toFixed(4) + ")";
  }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    R.camera(E("cam"), t, { base: 1.0 });   // a câmera do RIG: nada congela (base 1,0 pela margem de 200 px)

    // ── 1960 e 1962: a cédula cai de cima, com o ano; o carimbo bate e o placar entra, tudo na palavra que o diz ──
    [[COL[0], T.c1], [COL[1], T.c2]].forEach(function (par, i) {
      var c = par[0], t0 = par[1], n = i + 1;
      var p = eo(seg(t, t0, T.caiDur));
      por(E(c.id), c.cx, c.cy - 260 * (1 - p), lerp(c.rot - 2, c.rot, p), 1.06 - 0.06 * p, seg(t, t0, 0.15));
      E("ano" + n).style.opacity = seg(t, t0, 0.15).toFixed(3);
      carimbo(E("car" + n), t, t0);
      rotulo(E("pl" + n), eo(seg(t, t0, 0.3)));
    });

    // ── 1974: a cédula sobe de baixo do quadro em "August"; o YES e o placar em "approved"; as mãos a empurram ──
    var c3 = COL[2];
    var u = eo(seg(t, T.sobe, T.sobeDur));                       // 0 → 1: sobe de baixo do quadro
    var e = eb(seg(t, T.empurra, T.empurraDur)) * T.palmo;       // 0 → 200: o palmo que as mãos empurram
    var cy3 = lerp(2300, c3.cy, u) - e;
    por(E("c3"), c3.cx, cy3, lerp(c3.rot - 1.5, c3.rot, u), 1, t >= T.sobe ? 1 : 0);
    E("ano3").style.opacity = t >= T.sobe ? "1" : "0";
    carimbo(E("car3"), t, T.c3);
    rotulo(E("pl3"), eo(seg(t, T.c3, 0.3)));
    // as mãos: sobem de baixo do quadro (0,4 s) até a borda de baixo da cédula, e sobem o palmo com ela
    var m = eo(seg(t, T.maos, T.maosDur));
    var maos = E("maos");
    maos.style.opacity = (t >= T.maos ? 1 : 0).toFixed(0);
    maos.style.transform = "translateY(" + ((1 - m) * 620 - e).toFixed(2) + "px)";

    // ── o crédito, do primeiro placar ao fim ──
    var cr = E("credFonte"), op = eo(seg(t, T.c1, 0.3));
    creditoTexto(cr, TEXTOS.credFonte);
    cr.hidden = op <= 0; cr.style.opacity = op.toFixed(3);
  }
  // o crédito longo quebra em duas linhas (identidade §4.2, nunca encolhe), mas nunca no meio do último trecho
  // (", 1960–1974" quebrava no travessão): o último trecho depois de ", " ou " · " não se parte
  function creditoTexto(el, texto) {
    if (el.getAttribute("data-texto") === texto) return;
    el.setAttribute("data-texto", texto); el.textContent = "";
    var i = Math.max(texto.lastIndexOf(", "), texto.lastIndexOf(" · "));
    if (i < 0) { el.textContent = texto; return; }
    var corte = i + (texto.charAt(i) === "," ? 2 : 3);
    el.appendChild(document.createTextNode(texto.slice(0, corte)));
    var s = document.createElement("span"); s.style.whiteSpace = "nowrap"; s.textContent = texto.slice(corte);
    el.appendChild(s);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
})();
</script>
</body>
</html>
