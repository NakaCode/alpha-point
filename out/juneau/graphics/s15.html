/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de
   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();
   Lei: a cena é função pura de t. Nada aqui lê relógio, sorteia ou anda sozinho. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};
    const s = (o.base ?? 1.02) + (o.zoom ?? 0.0024) * t;
    const x = (o.ax ?? 6) * Math.sin(t * 0.23), y = (o.ay ?? 4.8) * Math.sin(t * 0.17);

  function seekTo(v, tt) {

    if (Math.abs(v.currentTime - tt) < 1e-4 && !v.seeking) return Promise.resolve();
    return new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.addEventListener("error", r, { once: true }); v.currentTime = tt; });
  }
  // Grão: ruído de semente fixa por quadro (mulberry32). Mesmo t, mesmo grão.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  function grao(cv, t, o) {
    if (!cv || !cv.getContext) return; o = o || {};
    const ctx = cv.getContext("2d"), w = cv.width, h = cv.height;
    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));
    const img = ctx.createImageData(w, h), d = img.data, a = o.alfa ?? 22;
    for (let i = 0; i < d.length; i += 4) { const v = (sorte() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }
    ctx.putImageData(img, 0, 0);
  }
  // Paleta por vídeo: OBJETO de papéis {acento:"#…"}, montado pelo editor-de-arte. O espelho.paleta é
  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }
  function cor(v) { return typeof CSS !== "undefined" && CSS.supports ? CSS.supports("color", v) : /^#[0-9a-f]{3,8}$|^(rgb|hsl)a?\(/i.test(v); }

    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));

  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {

    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()

      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });

    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);

        paint: { "line-color": tok("--contraparte", "#2EC4B6"), "line-width": 6, "line-opacity": 0 } });
      // a estrada: --rede-cor 11 px sobre o contorno --rotulo de 24 px (a s03)
      map.addSource("estrada", { type: "geojson", data: { type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: ate(0) } } });
      map.addLayer({ id: "estrada-contorno", type: "line", source: "estrada", layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": tok("--rotulo", "rgba(11,15,20,0.88)"), "line-width": 24, "line-opacity": 0 } });
      map.addLayer({ id: "estrada", type: "line", source: "estrada", layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": tok("--rede-cor", "#2EC4B6"), "line-width": 11, "line-opacity": 0 } });
    } catch (e) { return falhar("não consegui desenhar o vale, o sítio ou a estrada: " + e.message); }
    mapaCarregado = true;
    map.once("idle", function () { if (!window.__erroCena) resolverPronto(true); });
  });

  // ── as peças ────────────────────────────────────────────────────────────────────────────────────
  // o que entra em 0 já está inteiro no 1º quadro (a regência: "from the first frame"); o resto, 300 ms de ease-out
  function entrada(t, t0) { return t0 <= 0 ? 1 : t < t0 ? 0 : eo(seg(t, t0, 0.3)); }
  function placeRotulo(r, op, ent) {
    var el = E(r.id); if (!el || !r.p) return;
    var p = map.project(r.p);
    var tx = r.lado === "direita" ? "0%" : r.lado === "esquerda" ? "-100%" : "-50%";
    el.style.left = (p.x + (r.dx || 0)).toFixed(1) + "px";
    el.style.top = (p.y + (r.dy || 0)).toFixed(1) + "px";
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translate(" + tx + ",-50%) translateY(" + ((1 - ent) * 24).toFixed(1) + "px)";
  }

  var ultimaFracao = null;
  function aplicar(t) {
    if (!mapaCarregado) return;
    map.jumpTo(cameraAt(t));
    var Q = {}; ["L", "Y", "W", "S"].forEach(function (k) { Q[k] = map.project(PT[k]); });

    // ── as linhas e o vale ──
    map.setPaintProperty("sitio", "line-opacity", 1);
    var B = CENA.borough;
    map.setPaintProperty("borough", "fill-opacity", +(B.opacidade * eo(seg(t, B.entra, B.dura))).toFixed(4));
    // a estrada se desenha de Anchorage com rampa suave (eb): chega ao meio no meio do tempo, em "miles" (13,067)
    var ES = CENA.estrada, fe = +eb(seg(t, ES.entra, ES.dura)).toFixed(4);
    if (fe !== ultimaFracao) { var se = map.getSource("estrada"); if (se) se.setData({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: ate(fe) } }); ultimaFracao = fe; }
    var ve = t >= ES.entra ? 1 : 0;
    map.setPaintProperty("estrada-contorno", "line-opacity", ve); map.setPaintProperty("estrada", "line-opacity", ve);

    // ── os pontos: Larson Lake e Mount Yenlo desde o 1º quadro, até "lay"; a vila com o nome ──
    var sai = 1 - seg(t, CENA.locaisSaem, 0.3), ab = 1;
    [["pontoL", "L", ab * sai], ["pontoY", "Y", ab * sai], ["pontoW", "W", entrada(t, CENA.vila)]].forEach(function (x) {
      var d = E(x[0]); d.setAttribute("cx", Q[x[1]].x.toFixed(1)); d.setAttribute("cy", Q[x[1]].y.toFixed(1)); d.setAttribute("opacity", x[2].toFixed(3));
    });
    // ── o anel no sítio: entra em "winner," e pulsa duas vezes (a 2ª em "Willow,") ──
    var g = E("anel"), A_ = CENA.anel;
    g.setAttribute("opacity", entrada(t, A_.entra).toFixed(3));
    ["anelFixo", "anelPulso1", "anelPulso2"].forEach(function (id) { var c = E(id); c.setAttribute("cx", Q.S.x.toFixed(1)); c.setAttribute("cy", Q.S.y.toFixed(1)); });
    A_.pulsos.forEach(function (t0_, k) {
      var u = (t - t0_) / A_.pulso, c = E("anelPulso" + (k + 1));
      if (u < 0 || u > 1) { c.setAttribute("opacity", "0"); return; }
      c.setAttribute("r", (28 * (1 + 0.8 * u)).toFixed(2)); c.setAttribute("opacity", (1 - u).toFixed(3));
    });

    // ── a seta curta, da vila ao anel, em "five" ──
    var S_ = CENA.seta, ps = eo(seg(t, S_.entra, S_.dura)), dx = Q.S.x - Q.W.x, dy = Q.S.y - Q.W.y, L_ = Math.hypot(dx, dy) || 1;
    var ux = dx / L_, uy = dy / L_, x1 = Q.W.x + ux * S_.recuoVila, y1 = Q.W.y + uy * S_.recuoVila;
    var xf = Q.S.x - ux * S_.recuoAnel, yf = Q.S.y - uy * S_.recuoAnel, x2 = lerp(x1, xf, ps), y2 = lerp(y1, yf, ps);
    var hb = Math.max(0, Math.hypot(x2 - x1, y2 - y1) - S_.ponta);   // a haste para na base da ponta
    E("seta").setAttribute("opacity", t < S_.entra ? "0" : "1");
    var sl = E("setaLinha"); sl.setAttribute("x1", x1.toFixed(1)); sl.setAttribute("y1", y1.toFixed(1));
    sl.setAttribute("x2", (x1 + ux * hb).toFixed(1)); sl.setAttribute("y2", (y1 + uy * hb).toFixed(1));
    var bx = x2 - ux * S_.ponta, by = y2 - uy * S_.ponta, nx = -uy * S_.ponta * 0.55, ny = ux * S_.ponta * 0.55;
    E("setaPonta").setAttribute("points", x2.toFixed(1) + "," + y2.toFixed(1) + " " + (bx + nx).toFixed(1) + "," + (by + ny).toFixed(1) + " " + (bx - nx).toFixed(1) + "," + (by - ny).toFixed(1));

    // ── os rótulos ──
    CENA.rotulos.forEach(function (r) {
      var ent = entrada(t, r.entra), op = ent * (r.sai ? 1 - seg(t, r.sai, 0.3) : 1);
      placeRotulo(r, op, ent);
    });

    // ── a legenda das cores: a caixa aparece com o 1º item e sai inteira; cada item seguinte faz a caixa crescer ──
    var Lg = CENA.legenda, cxL = E("legenda"), hL = 2 * Lg.respiro + Lg.linha;
    Lg.itens.forEach(function (it, i) {
      var v = entrada(t, it.entra), el = E(it.id);
      if (i > 0) hL += (Lg.linha + Lg.vao) * v;
      el.style.opacity = (i === 0 ? 1 : v).toFixed(3);
      el.style.transform = "translateY(" + ((1 - v) * 24).toFixed(1) + "px)";
    });
    cxL.style.height = hL.toFixed(1) + "px";
    cxL.style.opacity = (entrada(t, Lg.itens[0].entra) * (1 - eb(seg(t, Lg.sai, 0.3)))).toFixed(3);

    // ── os créditos: o da MapTiler a cena toda; o da fonte enquanto o placar e a régua estão no ar ──
    var c1 = E("credito"), cf = E("creditoFonte");
    if (c1 && cf) {
      cf.style.bottom = (CENA.creditos.base + c1.offsetHeight + CENA.creditos.vao) + "px";
      var vf = 0; CENA.creditos.fonte.forEach(function (j) { vf = Math.max(vf, entrada(t, j[0]) * (1 - seg(t, j[1], 0.3))); });
      cf.style.opacity = vf.toFixed(3);
    }
  }

  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }
  };

  function nivelUnico() {
    try {
      if (map.getTerrain() || map.getPitch() > 1) return true;
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      var cache = sc.base; if (!cache) return true;
      var ids = cache.getRenderableIds ? cache.getRenderableIds() : Object.keys(cache._tiles || {});
      var tiles = ids.map(function (id) { return cache._tiles[id]; }).filter(Boolean);
      if (!tiles.length) return false;
      if (tiles.some(function (x) { return x.state === "loading"; })) return false;
      var niveis = new Set(tiles.map(function (x) { return x.tileID && x.tileID.canonical && x.tileID.canonical.z; }));
      return niveis.size <= 1;
    } catch (e) { return true; }
  }
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) {
        var ts = (sc[id] && sc[id]._tiles) || {};
        for (var k in ts) if (ts[k] && ts[k].state === "errored") return id;
      }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou (HTTP 404 ou resposta inválida). O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          // a estrada muda por setData no quadro: a foto só sai com a forma deste t
          if (!map.isSourceLoaded("sitio") || !map.isSourceLoaded("borough") || !map.isSourceLoaded("estrada")) return false;
          if (!map.isSourceLoaded("base")) return false;
          if (CENA.relevo && P.dem && (!map.isSourceLoaded("dem") || !map.getTerrain())) return false;
          return nivelUnico();
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0;
      (function tick() {
        barrarTileComErro();
        seguidas = pronto() ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo; se repetir, confira a conexão.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  window.__fotosProntas = R.prontas().then(function () { return true; });

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__fotosProntas.then(function () { window.__renderAt(0); return true; });
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
