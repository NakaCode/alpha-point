    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();
</script>
<script>
(function () {
  "use strict";
  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo;
  var E = function (id) { return document.getElementById(id); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var DUR = 12.133;
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia é a do textos-tela.json do disco) ═══════════════════════════
  var TEXTOS = {
    lugar1:    "Fairbanks, Alaska",                                     // textos-tela.json › rotulos_dado s16 (a foto do p1)
    aviso1:    "Photo from 1973",                                       // textos-tela.json › _avisos_de_ano s16 (p1)
    credFoto1: "Dennis Cowals / National Archives",                     // textos-tela.json › _creditos s16 (p1, exceção do DOCUMERICA)
    data:      "EARLY 1977",                                            // textos-tela.json › rotulos_dado s16 (rótulo de data)
    lugar2:    "Fairbanks, Alaska",                                     // textos-tela.json › rotulos_dado s16 (a foto do p2)
    aviso2:    "Photo from 1972",                                       // textos-tela.json › _avisos_de_ano s16 (p2)
    credFoto2: "Piergiuliano Chesi / Wikimedia Commons · CC BY 3.0",    // textos-tela.json › _creditos s16 (p2)
    credFonte: "Source: Alaska Division of Elections, 1978",            // textos-tela.json › _creditos s16 (EARLY 1977 e FRANK)
    sigla:     "FRANK",                                                 // textos-tela.json › rotulos_dado s16 (herói); uma letra por span
    expansao:  "Frustrated, Responsible Alaskans Needing Knowledge"     // textos-tela.json › rotulos_dado s16 (legenda, um nome só)
  };
  // ═══════════════════════════════════════════════════════════════════════════════════════════════════════
  E("rLugar1").textContent = TEXTOS.lugar1; E("aviso1").textContent = TEXTOS.aviso1;
  E("rData").textContent = TEXTOS.data; E("rLugar2").textContent = TEXTOS.lugar2; E("aviso2").textContent = TEXTOS.aviso2;
  var LETRAS = ["lF", "lR", "lA", "lN", "lK"];
  LETRAS.forEach(function (id, i) { E(id).textContent = TEXTOS.sigla.charAt(i); });
  // a expansão: cada palavra com a inicial num span .ini (a inicial engrossa quando a voz diz a palavra)
  (function () {
    var ex = E("expansao"); ex.textContent = "";
    TEXTOS.expansao.split(" ").forEach(function (pal, i) {
      if (i) ex.appendChild(document.createTextNode(" "));
      var ini = document.createElement("span"); ini.className = "ini"; ini.id = "ini" + i; ini.textContent = pal.charAt(0);
      ex.appendChild(ini); ex.appendChild(document.createTextNode(pal.slice(1)));
    });
  })();

  // ── os tempos (locais, −160,067), da regência s16 e do words.json ──
  var T = {
    corte1: 99 / 30,             // 3,300: "In" (a mesa; a foto de 1972 pousa)
    corte2: 212 / 30,            // 7,067: "its" (a PRANCHA)
    kb: 0.12 / 6,                // Ken Burns do b1: 1,00 → 1,12 em 6 s, linear
    data: 3.433,                 // "early" (163,5): EARLY 1977
    pousaDur: 0.6, fita: 0.45,   // a foto pousa em 0,6 s; a fita cola 0,45 s depois do corte (a segunda, 0,12 s depois)
    expansao: 8.533,             // "Frustrated": a linha inteira
    letras: [8.533, 9.3, 9.733, 10.433, 10.767],   // F, R, A, N, K: cada letra acende com a palavra dela
    acende: 0.3
  };
  // p2: grupo 2284×1635, centrado em (2480, 1010), +1,2°: x 1338→3622, y 192→1828 (os cantos girados, 168 e 1851)
  var P2 = { w: 2021, h: 1450, cx: 2470, cy: 970, rot: 1.2 };   // correção 2 do render (01/10/2026): a foto a 0,95× (1.925 × 1.354), o grupo em x 1.460→3.481 e y 245→1.695 (girado 1,2°: 1.444→3.496, 224→1.716): a pílula de lugar (até x 1.317) fora da foto, e a foto acima do canto e dentro das margens sob a câmera (1,0291)
  var LUZ_FRANK = { x: 1920, y: 940 };

  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  function rotulo(el, op) {
    if (!el) return;
    op = clamp(op, 0, 1);
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translateY(" + ((1 - op) * 24).toFixed(1) + "px)";   // rótulo: 300 ms, opacidade + 24 px (§4.4)
  }
  function fita(el, t, t0, rot) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * -40).toFixed(1) + "px) rotate(" + rot + "deg) scale(" + (1 + (1 - p) * 0.08).toFixed(4) + ")";
  }
  function credito(el, texto, op, reservar) {
    creditoTexto(el, texto);
    el.hidden = !reservar && op <= 0;   // com reservar, a linha ocupa o lugar dela mesmo apagada: a outra não salta (roupa §4, 01/10/2026)
    el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    var b1 = t < T.corte1, b2 = !b1 && t < T.corte2, b3 = t >= T.corte2;

    // ── b1: Fairbanks 1973 em tela cheia, com o Ken Burns ──
    E("reg1").style.visibility = b1 ? "visible" : "hidden";
    E("img1").style.transform = "scale(" + (1 + T.kb * clamp(t, 0, T.corte1)).toFixed(5) + ")";
    rotulo(E("rLugar1"), b1 ? eo(seg(t, 0, 0.3)) : 0);
    rotulo(E("aviso1"), b1 ? eo(seg(t, 0, 0.3)) : 0);

    // ── b2: a mesa, e a foto de 1972 que pousa impressa; os rótulos na coluna da esquerda ──
    var cam = E("cam");
    cam.style.visibility = b1 ? "hidden" : "visible";
    R.camera(cam, t, { base: 1.0 });   // base 1,0: a de 1,02 do RIG empurrava a margem de 200 px
    var p = eo(seg(t, T.corte1, T.pousaDur));
    var op2 = b2 ? seg(t, T.corte1, 0.22) : 0;
    por(E("p2"), P2.cx, P2.cy + 240 * (1 - p), P2.w, P2.h, lerp(-2, P2.rot, p), 0.72 + 0.28 * p, op2);
    fita(E("p2fe"), t, T.corte1 + T.fita, -4); fita(E("p2fd"), t, T.corte1 + T.fita + 0.12, 4);
    rotulo(E("rData"), b2 ? eo(seg(t, T.data, 0.3)) : 0);
    rotulo(E("rLugar2"), b2 ? eo(seg(t, T.corte1, 0.3)) : 0);
    rotulo(E("aviso2"), b2 ? eo(seg(t, T.corte1, 0.3)) : 0);

    // ── b3: a PRANCHA: FRANK desde o corte; a linha inteira em "Frustrated"; cada letra acende com a palavra dela ──
    var frank = E("frank"), ex = E("expansao");
    frank.style.opacity = b3 ? "1" : "0";
    LETRAS.forEach(function (id, i) {
      var k = eo(seg(t, T.letras[i], T.acende));
      E(id).style.opacity = lerp(0.45, 1, k).toFixed(3);
      var ini = E("ini" + i); if (ini) ini.style.fontWeight = Math.round(lerp(500, 700, k)).toString();
    });
    rotulo(ex, b3 ? eo(seg(t, T.expansao, 0.3)) : 0);

    // a luz da mesa: atrás da foto impressa (descendo com ela na pousada) e, no b3, atrás do FRANK
    if (b3) { cam.style.setProperty("--luz-x", LUZ_FRANK.x + "px"); cam.style.setProperty("--luz-y", LUZ_FRANK.y + "px"); }
    else { cam.style.setProperty("--luz-x", P2.cx.toFixed(1) + "px"); cam.style.setProperty("--luz-y", (P2.cy + 240 * (1 - p)).toFixed(1) + "px"); }

    // ── os créditos: a foto de 1973 na pílula (b1); a de 1972 e a fonte soltas na mesa (b2); só a fonte (b3) ──
    var opFoto = b1 ? eo(seg(t, 0, 0.3)) : (b2 ? eo(seg(t, T.corte1, 0.3)) : 0);
    var opFonte = b1 ? 0 : eo(seg(t, T.data, 0.3));
    credito(E("credFoto"), b1 ? TEXTOS.credFoto1 : TEXTOS.credFoto2, opFoto, !b1);   // da mesa em diante as duas linhas têm lugar fixo: a da foto fica (apagada) no b3
    credito(E("credFonte"), TEXTOS.credFonte, opFonte, !b1);                      // e a da fonte já ocupa o lugar antes de acender em "early"
    E("creds").classList.toggle("caixa", b1);
    E("creds").style.opacity = Math.max(opFoto, opFonte).toFixed(3);   // a pílula acende junto com a primeira linha
  }
  // o crédito longo quebra em duas linhas (identidade §4.2, nunca encolhe), mas nunca no meio do último trecho
  function creditoTexto(el, texto) {
    if (el.getAttribute("data-texto") === texto) return;
    el.setAttribute("data-texto", texto); el.textContent = "";
    var i = Math.max(texto.lastIndexOf(", "), texto.lastIndexOf(" · "));
    if (i < 0) { el.textContent = texto; return; }
    var corte = i + (texto.charAt(i) === "," ? 2 : 3);
    el.appendChild(document.createTextNode(texto.slice(0, corte)));
    var s = document.createElement("span"); s.style.whiteSpace = "nowrap"; s.textContent = texto.slice(corte);
    el.appendChild(s);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
})();
</script>
