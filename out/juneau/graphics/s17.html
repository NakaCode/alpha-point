  })();

  function rotulo(el, op) {
    if (!el) return;
    op = clamp(op, 0, 1);
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translateY(" + ((1 - op) * 24).toFixed(1) + "px)";   // rótulo: 300 ms, opacidade + 24 px (§4.4)
  }
  // o carimbo bate: escala 1,55 → 0,97 em 70 % da batida e → 1 no resto; opacidade 0 → 1 na primeira metade
  function carimbo(el, t, t0) {
    var p = seg(t, t0, T.batida), s, op;
    if (p < 0.7) { var q = eo(p / 0.7); s = lerp(1.55, 0.97, q); op = clamp(p / 0.35, 0, 1); }
    else { s = lerp(0.97, 1, (p - 0.7) / 0.3); op = 1; }
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translate(-50%,-50%) rotate(-7deg) scale(" + s.toFixed(4) + ")";
  }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    var cam = E("cam");
    R.camera(cam, t, { base: 1.0 });   // a câmera do RIG: nada congela

    // ── b1: o bloco e a barreira em "state"; a cédula cai e o carimbo bate em "approved"; BONDS e a barreira abre ──
    rotulo(E("bloco"), eo(seg(t, T.state, 0.3)));
    var ab = seg(t, T.bonds, T.abreDur);                                   // 0 → 1: a barreira se desfaz
    var bar = E("barreira");
    bar.style.opacity = (eo(seg(t, T.state, 0.3)) * (1 - ab)).toFixed(3);
    bar.setAttribute("transform", "translate(1680 860) scale(1 " + (1 + 0.35 * ab).toFixed(3) + ") translate(-1680 -860)");
    var p = eo(seg(t, T.approved, T.caiDur));
    var ced = E("cedula");
    ced.style.opacity = seg(t, T.approved, 0.15).toFixed(3);
    ced.style.transform = "translate(" + (CED.cx - CED.w / 2).toFixed(2) + "px," + (CED.cy - CED.h / 2 - 260 * (1 - p)).toFixed(2) + "px) rotate(" +
      lerp(CED.rot - 2, CED.rot, p).toFixed(3) + "deg) scale(" + (1.06 - 0.06 * p).toFixed(5) + ")";
    carimbo(E("carimbo"), t, T.approved);
    rotulo(E("bonds"), eo(seg(t, T.bonds, 0.3)));
    rotulo(E("rThrough"), eo(seg(t, T.through, 0.3)));

    // ── b2: BOND; a linha do tempo se estende; o dinheiro entra em "borrows"; os traços de pagamento, ano a ano ──
    rotulo(E("rBond"), eo(seg(t, T.bond, 0.3)));
    var li = eb(seg(t, T.bond, T.linhaDur));
    E("tempo").setAttribute("x2", (LINHA.x0 + (LINHA.x1 - LINHA.x0) * li).toFixed(1));
    E("tempo").style.opacity = (t >= T.bond ? 1 : 0).toFixed(0);
    var m = eo(seg(t, T.borrows, 0.3)), moeda = E("moeda");
    moeda.style.opacity = m.toFixed(3);
    moeda.style.transform = "translateY(" + ((1 - m) * 24).toFixed(1) + "px) scale(" + (0.8 + 0.2 * m).toFixed(3) + ")";
    for (var i = 0; i < N_TIQUES; i++) {
      var ti = T.pays + (T.years - T.pays) * (i / (N_TIQUES - 1));
      E("tq" + i).style.opacity = eo(seg(t, ti, 0.2)).toFixed(3);
    }
    // a luz da mesa: no centro do mecanismo, e desliza para trás da linha do tempo em "bond"
    var u = eb(seg(t, T.bond, T.luzDur));
    cam.style.setProperty("--luz-x", lerp(2200, 1920, u).toFixed(1) + "px");
    cam.style.setProperty("--luz-y", lerp(900, 1600, u).toFixed(1) + "px");

    // ── o crédito, de "state" ao fim ──
    var cr = E("credFonte"), op = eo(seg(t, T.state, 0.3));
    if (cr.textContent !== TEXTOS.credFonte) cr.textContent = TEXTOS.credFonte;
    cr.hidden = op <= 0; cr.style.opacity = op.toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
})();
</script>
</body>
</html>
