  function telaDoCam(px, py, t) {
    var s = 1.0 + 0.0024 * t, dx = 6 * Math.sin(t * 0.23), dy = 4.8 * Math.sin(t * 0.17);
    return { x: 1920 + s * (px - 1920 + dx), y: 1080 + s * (py - 1080 + dy), s: s };
  }
  // o centro da fatia no papel, em #cam, com a inclinação da folha (0,8°) e o topo da folha no quadro do corte
  function centroFatiaNoCam(topo) {
    var cx = 1520, cy = 1030;   // o centro do grupo, local (3.040 × 2.060; era 1.000 com a folha de 2.000)
    var rx = FATIA.localX + FATIA.w / 2 - cx, ry = FATIA.localY + FATIA.h / 2 - cy;
    var a = FOLHA.rot * Math.PI / 180, c = Math.cos(a), sn = Math.sin(a);
    return { x: 340 + cx + rx * c - ry * sn, y: topo + cy + rx * sn + ry * c };   // 340 = o left do #grupo (era 400)
  }
  function rotulo(el, op) {
    op = clamp(op, 0, 1);
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translateY(" + ((1 - op) * 24).toFixed(1) + "px)";   // rótulo: 300 ms, opacidade + 24 px (§4.4)
  }
  function credito(el, texto, op) {
    creditoTexto(el, texto);
    op = clamp(op, 0, 1);
    el.hidden = false;
    if (!el.dataset.h) { el.style.maxHeight = "none"; el.dataset.h = String(el.offsetHeight || 84); }   // a altura natural da linha, medida uma vez
    el.style.maxHeight = (parseFloat(el.dataset.h) * op).toFixed(1) + "px";   // a linha cresce com o fade: a outra não salta
    el.style.opacity = op.toFixed(3);
  }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    var papel = t < T.corte;
    var cam = E("cam");
    cam.style.visibility = papel ? "visible" : "hidden";
    R.camera(cam, t, { base: 1.0 });

    // ── a folha: parada no b1; o rolo sobe no b2; afunda 24 px quando o herói pousa ──
    var d = eb(seg(t, T.desce, T.desceDur));
    var p = eo(seg(t, T.heroi, T.pousaDur));
    var topo = lerp(FOLHA.topo1, FOLHA.topo2, d) + 24 * p;
    E("grupo").style.transform = "translateY(" + topo.toFixed(2) + "px) rotate(" + FOLHA.rot + "deg)";
    E("sombraForte").style.opacity = p.toFixed(3);

    // ── b1: NOVEMBER 1982 em "November"; o grifo em "could" ──
    E("ano").style.opacity = eo(seg(t, T.ano, 0.3)).toFixed(3);
    E("grifoMay").style.backgroundSize = (100 * eo(seg(t, T.grifo, T.grifoDur))).toFixed(2) + "% 100%";

    // ── b2: o herói pousa abaixo da pergunta (a câmera o segue); THROUGH 1994 ──
    var h = E("heroi");
    h.style.opacity = seg(t, T.heroi, 0.15).toFixed(3);
    h.style.transform = "translateY(" + (-60 * (1 - p)).toFixed(1) + "px) scale(" + lerp(1.15, 1, p).toFixed(4) + ")";
    var th = E("through");
    th.style.opacity = (eo(seg(t, T.through, 0.3)) * (1 - eo(seg(t, T.throughFim, 0.3)))).toFixed(3);
    th.style.transform = "translateY(" + ((1 - eo(seg(t, T.through, 0.3))) * 24).toFixed(1) + "px)";

    // ── b3: a barra do total abre; a fatia cresce com o rótulo ──
    var b = eo(seg(t, T.barra, T.barraDur)), f = eo(seg(t, T.fatia, T.fatiaDur));
    E("barra").style.transform = "scaleX(" + b.toFixed(4) + ")";
    E("fatia").style.transform = "scaleX(" + f.toFixed(4) + ")";
    rotulo(E("fatiaRot"), eo(seg(t, T.fatia, 0.3)));

    // a luz da mesa: atrás da pergunta; desce com a câmera (e com o herói) para trás dele; vai à barra no b3
    cam.style.setProperty("--luz-x", "1920px");
    cam.style.setProperty("--luz-y", lerp(lerp(LUZ.y1, LUZ.y2, d), LUZ.y3, eo(seg(t, T.barra, 0.5))).toFixed(1) + "px");

    // ── b4: a foto em tela cheia; a fatia desliza do papel para a foto; o rótulo vira pílula ──
    E("reg4").style.visibility = papel ? "hidden" : "visible";
    E("img4").style.transform = "scale(" + (1 + T.kb * clamp(t - T.corte, 0, DUR - T.corte)).toFixed(5) + ")";
    var ff = E("fatiaFoto");
    if (papel) { ff.style.opacity = "0"; }
    else {
      var q = eb(seg(t, T.corte, T.deslizaDur));
      var c0 = centroFatiaNoCam(FOLHA.topo2 + 24), p0 = telaDoCam(c0.x, c0.y, T.corte);   // onde a fatia estava no papel, no quadro do corte
      var x1 = FATIA.fimX + FATIA.w / 2, y1 = FATIA.fimY + FATIA.h / 2;
      var cx = lerp(p0.x, x1, q), cy = lerp(p0.y, y1, q), s = lerp(p0.s, 1, q), rot = lerp(FOLHA.rot, 0, q);
      ff.style.opacity = "1";
      ff.style.transform = "translate(" + (cx - FATIA.w / 2).toFixed(2) + "px," + (cy - FATIA.h / 2).toFixed(2) + "px) rotate(" + rot.toFixed(3) + "deg) scale(" + s.toFixed(4) + ")";
    }
    rotulo(E("rFatia"), papel ? 0 : eo(seg(t, T.corte + 0.6, 0.3)));   // quando a fatia já pousou (0,6 s): a pílula entra abaixo dela
    rotulo(E("rLugar"), papel ? 0 : eo(seg(t, T.corte, 0.3)));   // no corte, junto com o aviso do ano (Claude central, 01/10/2026: 2,266 s no ar); a fatia passa por cima
    rotulo(E("aviso4"), papel ? 0 : eo(seg(t, T.corte, 0.3)));

    // ── os créditos: a fonte a cena toda; a foto desde o corte ──
    var opS = eo(seg(t, 0, 0.3)), opF = papel ? 0 : eo(seg(t, T.corte, 0.3));
    credito(E("credFonte"), TEXTOS.credFonte, opS);
    credito(E("credFoto"), TEXTOS.credFoto, opF);
    E("creds").style.opacity = Math.max(opS, opF).toFixed(3);
  }
  // o crédito longo quebra em duas linhas (identidade §4.2, nunca encolhe), mas nunca no meio do último trecho
  // REVISÃO DE ESPECTADOR, 4 (02/10/2026): a pílula abraça o texto. A montagem é a de antes (o texto e o último trecho num
  // span nowrap, para "CC BY-SA 4.0" não se partir). Se, medido com a fonte carregada e o elemento desenhado, o último
  // trecho desceu de linha, entra um <br> antes dele e o bloco vira nowrap: a quebra passa a ser À MÃO, no último " · "
  // (sem " · ", no último "; " ou ", "; a cena pode ditar outra), nunca no meio de um nome ("Wikimedia Commons" fica
  // junto), e a largura da pílula vira a da linha mais longa, não a máxima da faixa. Decidido uma vez por texto, sem
  // elemento de texto novo (o <br> não tem texto) e com o mesmo textContent do textos-tela.json.
  function creditoTexto(el, texto, quebra) {
    if (!el) return;
    var novo = el.getAttribute("data-texto") !== texto;
    if (!novo && el.getAttribute("data-quebra")) return;               // já decidido para este texto
    el.setAttribute("data-texto", texto); el.removeAttribute("data-quebra"); el.style.whiteSpace = "";
    var i = quebra ? texto.indexOf(quebra) : -1, n = 1;                 // a quebra dita pela cena: antes da palavra
    if (i < 0) { i = texto.lastIndexOf(" · "); n = 3; }
    if (i < 0) { i = texto.lastIndexOf("; "); n = 2; }
    if (i < 0) { i = texto.lastIndexOf(", "); n = 2; }
    el.textContent = "";
    if (i < 0) { el.textContent = texto; el.setAttribute("data-quebra", "nao"); return; }
    var corte = i + n;                                                   // o separador e o espaço ficam na 1ª parte
    el.appendChild(document.createTextNode(texto.slice(0, corte)));
    var s = document.createElement("span"); s.style.whiteSpace = "nowrap"; s.textContent = texto.slice(corte); el.appendChild(s);
    if (el.offsetParent === null || !(document.fonts && document.fonts.status === "loaded")) return;   // mede num quadro seguinte
    var re = el.getBoundingClientRect(), rs = s.getBoundingClientRect();
    if (rs.top - re.top > 0.4 * rs.height) {                             // o último trecho desceu: a quebra à mão
      el.insertBefore(document.createElement("br"), s); el.style.whiteSpace = "nowrap";
      el.setAttribute("data-quebra", "sim");
    } else el.setAttribute("data-quebra", "nao");
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () {
    if (!document.fonts) return true;
    return Promise.all([
      document.fonts.load('400 86px "MarcaDoc"').then(function (f) { if (!f.length) window.__fontesFaltando.push("MarcaDoc 400 (Courier Prime da folha)"); }, function () { window.__fontesFaltando.push("MarcaDoc 400 (Courier Prime da folha)"); }),
      document.fonts.load('700 84px "MarcaDoc"').then(function (f) { if (!f.length) window.__fontesFaltando.push("MarcaDoc 700 (Courier Prime da folha)"); }, function () { window.__fontesFaltando.push("MarcaDoc 700 (Courier Prime da folha)"); })
    ]).then(function () { return true; });
  });
  window.__renderAt(0);
})();
</script>
