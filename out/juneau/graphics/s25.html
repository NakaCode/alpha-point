/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.

    else { s = lerp(0.97, 1, (p - 0.7) / 0.3); op = 1; }
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translate(-50%,-50%) rotate(-7deg) scale(" + (0.5 * s).toFixed(4) + ")";
  }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    var cam = E("cam");
    R.camera(cam, t, { base: 1.0 });

    // ── b1: o card de Harris pela esquerda; a fala sobe dele ──
    rotulo(E("nome1"), eo(seg(t, T.nome1, 0.3)), -120);
    rotulo(E("cargo1"), eo(seg(t, T.cargo1, 0.3)), -120);
    var p = eo(seg(t, T.fala, T.falaDur));
    por(E("falaCard"), FALA.x + FALA.w / 2, FALA.y + FALA.h / 2 + 180 * (1 - p), FALA.w, FALA.h, lerp(-3, FALA.rot, p), 0.94 + 0.06 * p, seg(t, T.fala, 0.2));

    // ── b2: o card de Clark pela direita; a linha; a mini-cédula cai; o NO bate ──
    rotulo(E("nome2"), eo(seg(t, T.nome2, 0.3)), 120);
    rotulo(E("cargo2"), eo(seg(t, T.cargo2, 0.3)), 120);
    E("linha").style.transform = "scaleX(" + eb(seg(t, T.linha, T.linhaDur)).toFixed(4) + ")";
    var c = eo(seg(t, T.cedula, T.caiDur)), ced = E("cedula");
    por(ced, CED.cx, CED.cy - 220 * (1 - c), CED.w, CED.h, lerp(CED.rot - 2, CED.rot, c), 1.06 - 0.06 * c, seg(t, T.cedula, 0.15));
    carimbo(E("carimbo"), t, T.carimbo);

    // a luz: atrás do card de Harris; desliza para o meio, atrás da linha, quando Clark entra
    var u = eb(seg(t, T.corte, 0.3));
    cam.style.setProperty("--luz-x", lerp(LUZ1.x, LUZ2.x, u).toFixed(1) + "px");
    cam.style.setProperty("--luz-y", lerp(LUZ1.y, LUZ2.y, u).toFixed(1) + "px");

    // ── o crédito, a cena toda ──
    var cr = E("credFonte"), op = eo(seg(t, T.nome1, 0.3));
    if (cr.textContent !== TEXTOS.credFonte) cr.textContent = TEXTOS.credFonte;
    cr.hidden = op <= 0; cr.style.opacity = op.toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
})();
</script>
