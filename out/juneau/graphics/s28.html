  E("vinteOito").textContent = TEXTOS.vinteOito; E("oitocentos").textContent = TEXTOS.oitocentos;

  // os 28 pictogramas: uma bola de futebol americano sem marca, 7 × 4
  var N = 28, BOLAS = [];
  (function () {
    var svg = E("bolas"), ns = "http://www.w3.org/2000/svg";
    for (var i = 0; i < N; i++) {

      var g = document.createElementNS(ns, "g"); g.setAttribute("class", "bola"); g.setAttribute("id", "b" + i);
      var el = document.createElementNS(ns, "ellipse");

  // ── os tempos (locais, −283,367), da regência s28 e do words.json ──
  var T = {
    vinteOito: 1.467, vinteOitoFim: 3.467, passo: 0.025,   // "twenty-eight" (284,833): os 28 e o 28, até 3,467
    corte1: 94 / 30,                                       // 3,133: "three" (o estádio)
    corte2: 217 / 30,                                      // 7,233: "The" (a camiseta)
    kb: 0.12 / 6,
    pousaDur: 0.6, fita: 0.45,
    that: 7.933, balancaDur: 0.5                           // "that" (291,3): o $800 MILLION e a balança
  };
  var P3 = { w: 1536, h: 1362, cx: 2600, cy: 950, rot: 1.0 };   // y 269→1.631; as fitas de y 227 para baixo: sob a câmera (1,0239 no fim) nada passa da margem de cima
  var BAL = { x0: 700, y0: 1380, x1: 2600, y1: 1710 };

  function por(el, cx, cy, w, h, rot, s, op) {
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";

  }
  function rotulo(el, op) {
    op = clamp(op, 0, 1);
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translateY(" + ((1 - op) * 24).toFixed(1) + "px)";
  }
  function fita(el, t, t0, rot) {
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * -40).toFixed(1) + "px) rotate(" + rot + "deg) scale(" + (1 + (1 - p) * 0.08).toFixed(4) + ")";
  }
  function credito(el, texto, op) {
    if (el.textContent !== texto) el.textContent = texto;
    op = clamp(op, 0, 1);
    el.hidden = false;
    if (!el.dataset.h) { el.style.maxHeight = "none"; el.dataset.h = String(el.offsetHeight || 84); }   // a altura natural da linha, medida uma vez
    el.style.maxHeight = (parseFloat(el.dataset.h) * op).toFixed(1) + "px";   // a linha cresce com o fade: a outra não salta
    el.style.opacity = op.toFixed(3);
  }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    var b1 = t < T.corte1, b2 = !b1 && t < T.corte2, b3 = t >= T.corte2;

    // ── b1: os 28 pictogramas, um a um, e o 28 ──
    E("papel").style.visibility = b1 ? "visible" : "hidden";
    for (var i = 0; i < N; i++) {
      var p = eo(seg(t, T.vinteOito + i * T.passo, 0.25));
      BOLAS[i].style.opacity = p.toFixed(3);
      BOLAS[i].style.transform = "scale(" + (0.6 + 0.4 * p).toFixed(3) + ")";
    }
    var v = E("vinteOito"), opV = eo(seg(t, T.vinteOito, 0.3)) * (t < T.vinteOitoFim ? 1 : 0);
    v.classList.toggle("caixa", !b1);   // sobre o estádio, numa pílula (número sobre registro)
    rotulo(v, opV);

    // ── b2: o estádio em tela cheia, com Ken Burns leve ──
    E("reg2").style.visibility = b2 ? "visible" : "hidden";
    E("img2").style.transform = "scale(" + (1 + T.kb * clamp(t - T.corte1, 0, T.corte2 - T.corte1)).toFixed(5) + ")";

    // ── b3: a mesa, a camiseta impressa que pousa, o $800 MILLION e a balança ──
    var cam = E("cam");
    cam.style.visibility = b3 ? "visible" : "hidden";
    R.camera(cam, t, { base: 1.0 });
    var q = eo(seg(t, T.corte2, T.pousaDur));
    por(E("p3"), P3.cx, P3.cy + 240 * (1 - q), P3.w, P3.h, lerp(-2, P3.rot, q), 0.72 + 0.28 * q, b3 ? seg(t, T.corte2, 0.22) : 0);
    fita(E("p3fe"), t, T.corte2 + T.fita, -4); fita(E("p3fd"), t, T.corte2 + T.fita + 0.12, 4);
    rotulo(E("oitocentos"), eo(seg(t, T.that, 0.3)));
    var b = eb(seg(t, T.that, T.balancaDur));
    E("trav").setAttribute("x2", lerp(BAL.x0, BAL.x1, b).toFixed(1)); E("trav").setAttribute("y2", lerp(BAL.y0, BAL.y1, b).toFixed(1));
    E("trav").style.opacity = (b > 0 ? 1 : 0).toFixed(0);
    E("fioE").style.opacity = eo(seg(t, T.that, 0.2)).toFixed(3);
    E("fioD").style.opacity = eo(seg(t, T.that + T.balancaDur - 0.1, 0.2)).toFixed(3);
    E("fulcro").style.opacity = eo(seg(t, T.that + 0.2, 0.2)).toFixed(3);
    cam.style.setProperty("--luz-x", P3.cx + "px"); cam.style.setProperty("--luz-y", (P3.cy + 240 * (1 - q)).toFixed(1) + "px");

    // ── os créditos: a fonte do anúncio no b1 (sobre o papel) e nos 0,33 s do 28 sobre o estádio (pílula), e de "that"; a foto da camiseta desde o corte ──
    var creds = E("creds");
    creds.classList.toggle("papel", b1); creds.classList.toggle("caixa", b2 && t < T.vinteOitoFim);
    var opFonte = b1 ? eo(seg(t, 0, 0.3)) : (b2 ? (t < T.vinteOitoFim ? 1 : 0) : eo(seg(t, T.that, 0.3)));
    var opFoto = b3 ? eo(seg(t, T.corte2, 0.3)) : 0;
    credito(E("credFoto"), TEXTOS.credFoto, opFoto);
    credito(E("credFonte"), TEXTOS.credFonte, opFonte);
    creds.style.opacity = Math.max(opFonte, opFoto).toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
})();
