    clausula:  "If a majority votes NO, laws and initiatives relating to capital relocation and indemnification are repealed.",   // textos-tela.json › rotulos_dado s32 (a frase da própria cédula, p. 88; o grifo em "ballot's")

    intro:     "If the ballot proposition is rejected by a majority of those voting on the proposition, then the Capital remains in Juneau and the following laws are repealed:",   // textos-tela.json › rotulos_dado s32 (o literal da p. 89; cada lei numa linha, abaixo)
    leis: [                                                 // textos-tela.json › rotulos_dado s32 (o mesmo literal: as quatro leis, cada uma numa linha, riscadas com a voz)
      "the Capital Relocation Initiative;",
      "the “FRANK Initiative” as amended;",
      "the laws establishing the New Capital Site Planning Commission;",
      "and the Relocation Indemnification Act."
    ],
    carimbo:   "YES",                                       // textos-tela.json › rotulos_dado s32 (o carimbo de s01, pequeno)
    credFonte: "Source: Alaska Division of Elections, 1982" // textos-tela.json › _creditos s32 (a folha)
  };
  // ═══════════════════════════════════════════════════════════════════════════════════════════════════════
  E("cab").textContent = TEXTOS.cabecalho; E("resumo").textContent = TEXTOS.resumo; E("carTxt").textContent = TEXTOS.carimbo;
  (function () {
    var c = E("clausula"); c.textContent = "";
    var g = document.createElement("span"); g.className = "grifo"; g.id = "grifoClausula"; g.textContent = TEXTOS.clausula; c.appendChild(g);
    var l = E("lista"); l.textContent = "";
    l.appendChild(document.createTextNode(TEXTOS.intro));
    TEXTOS.leis.forEach(function (lei, i) {
      l.appendChild(document.createTextNode("\n    "));
      var s = document.createElement("span"); s.className = "lei"; s.id = "lei" + i; s.textContent = lei; l.appendChild(s);
    });
  })();

  // ── os tempos (locais, −332,5), da regência s32 e do words.json ──
  var T = {
    grifo: 0.233, grifoDur: 0.55,       // "ballot's" (332,733): o grifo na frase da cédula
    desce: 1.6, desceDur: 1.5,          // a câmera desce ao resumo da p. 89 (o rolo sobe 860 px)
    tique: 3.6,                         // "repealed" (336,1): a caneta toca o papel
    riscos: [5.467, 7.2, 7.433, 7.6],   // "from" (337,967) · "to" (339,7) · "Frank" (339,933) · 7,6: cada lei, linha a linha
    riscoDur: 0.25,
    yes: 5.667, batida: 0.38,           // "nineteen" (338,167): o YES pequeno
    yesRisco: 7.767                     // "initiative." (340,267): o risco no YES
  };
  var FOLHA = { topo1: 300, topo2: -560, rot: 0.8 };
  var LUZ = { y1: 300 + 510, y2: -560 + 1740 };   // atrás da frase da cédula; depois atrás das leis

  var tiquePronto = false;
  function medir() {
    var l0 = E("lei0"); if (!l0 || !l0.offsetTop) return;
    E("tique").style.top = (l0.offsetTop + 60).toFixed(0) + "px";   // na linha da primeira lei (offsetTop é relativo à folha)
    tiquePronto = true;
  }
  function carimbo(el, t, t0) {
    var p = seg(t, t0, T.batida), s, op;
    if (p < 0.7) { var q = eo(p / 0.7); s = lerp(1.55, 0.97, q); op = clamp(p / 0.35, 0, 1); }
    else { s = lerp(0.97, 1, (p - 0.7) / 0.3); op = 1; }
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translate(-50%,-50%) rotate(-7deg) scale(" + (0.5 * s).toFixed(4) + ")";
  }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    if (!tiquePronto) medir();
    var cam = E("cam");
    R.camera(cam, t, { base: 1.0 });

    // ── a folha: parada; o rolo sobe ao resumo; treme 2 px a cada risco ──
    var d = eb(seg(t, T.desce, T.desceDur));
    var treme = 0;
    T.riscos.concat([T.yesRisco]).forEach(function (t0) { treme += 2 * Math.sin(Math.PI * seg(t, t0, 0.13)); });
    E("grupo").style.transform = "translate(" + treme.toFixed(2) + "px," + lerp(FOLHA.topo1, FOLHA.topo2, d).toFixed(2) + "px) rotate(" + FOLHA.rot + "deg)";

    // ── b1: o grifo na frase da cédula; a caneta toca o papel em "repealed" ──
    E("grifoClausula").style.backgroundSize = (100 * eo(seg(t, T.grifo, T.grifoDur))).toFixed(2) + "% 100%";
    E("tique").style.transform = "scaleX(" + eo(seg(t, T.tique, 0.2)).toFixed(4) + ")";

    // ── b2: o risco atravessa cada lei com a voz; o YES pequeno entra e recebe o risco por último ──
    T.riscos.forEach(function (t0, i) {
      E("lei" + i).style.backgroundSize = (100 * eo(seg(t, t0, T.riscoDur))).toFixed(2) + "% 10px";
    });
    carimbo(E("carimbo"), t, T.yes);
    E("riscoYes").style.transform = "scaleX(" + eo(seg(t, T.yesRisco, T.riscoDur)).toFixed(4) + ") rotate(-4deg)";

    // a luz: atrás da frase da cédula, e desce com a câmera até as leis
    cam.style.setProperty("--luz-x", "1920px");
    cam.style.setProperty("--luz-y", lerp(LUZ.y1, LUZ.y2, d).toFixed(1) + "px");

    // ── o crédito, a cena toda ──
    var c = E("credFonte"), opC = eo(seg(t, 0, 0.3));
    if (c.textContent !== TEXTOS.credFonte) c.textContent = TEXTOS.credFonte;
    c.hidden = false; c.style.opacity = opC.toFixed(3);
    E("creds").style.opacity = opC.toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { medir(); window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () {
    if (!document.fonts) return true;
    return Promise.all([
      document.fonts.load('400 86px "MarcaDoc"').then(function (f) { if (!f.length) window.__fontesFaltando.push("MarcaDoc 400 (Courier Prime da folha)"); }, function () { window.__fontesFaltando.push("MarcaDoc 400 (Courier Prime da folha)"); }),
      document.fonts.load('700 84px "MarcaDoc"').then(function (f) { if (!f.length) window.__fontesFaltando.push("MarcaDoc 700 (Courier Prime da folha)"); }, function () { window.__fontesFaltando.push("MarcaDoc 700 (Courier Prime da folha)"); })
    ]).then(function () { medir(); return true; });
  });
  window.__renderAt(0);
})();
</script>
