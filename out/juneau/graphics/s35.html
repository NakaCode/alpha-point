/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.

    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;

    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");

  var DUR = 16.7;
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia é a do textos-tela.json do disco) ═══════════════════════════
  var TEXTOS = {
    nearly:    "NEARLY 55% NO",                                    // textos-tela.json › rotulos_dado s35 (o placar com o hedge da voz)
    rLugar:    "Wasilla, Alaska",                                  // textos-tela.json › rotulos_dado s35 (lugar_registro, pelo lugar_na_origem)
    aviso:     "Photo from 2010",                                  // textos-tela.json › _avisos_de_ano s35
    linha1:    "CHANGE OF CAPITAL TO WASILLA",                     // textos-tela.json › rotulos_dado s35 (a linha da cédula: o título oficial inteiro)
    cifrao:    "$",                                                // textos-tela.json › rotulos_dado s35 (a linha do preço vazia, o motivo de s02)
    carNao:    "NO",                                               // textos-tela.json › rotulos_dado s35 (o carimbo)
    linha2:    "RIGHT TO KNOW, VOTE - MOVE COSTS",                 // textos-tela.json › rotulos_dado s35 (a 2ª linha: o título oficial da No. 5)
    carSim:    "YES",                                              // textos-tela.json › rotulos_dado s35 (o carimbo, maior que o NO)
    placar:    "159,781 to 46,665",                                // textos-tela.json › rotulos_dado s35 (o placar, o vencedor primeiro)
    credFoto:  "Murray Foubister / Wikimedia Commons · CC BY-SA 2.0",   // textos-tela.json › _creditos s35 (a foto do p1)
    credFonte: "Source: Alaska Division of Elections, 1994"        // textos-tela.json › _creditos s35 (os placares e a cédula)
  };
  // ═══════════════════════════════════════════════════════════════════════════════════════════════════════
  E("nearly").textContent = TEXTOS.nearly; E("rLugar").textContent = TEXTOS.rLugar; E("aviso").textContent = TEXTOS.aviso;
  E("linha1").textContent = TEXTOS.linha1; E("cifrao").textContent = TEXTOS.cifrao; E("carNaoTxt").textContent = TEXTOS.carNao;
  E("linha2").textContent = TEXTOS.linha2; E("carSimTxt").textContent = TEXTOS.carSim; E("placar").textContent = TEXTOS.placar;

  // ── os tempos (locais, −363,1), da regência s35 e do words.json ──
  var T = {
    nearly: 2.1,                        // "nearly" (365,2): NEARLY 55% NO sobre a foto
    corte: 167 / 30,                    // 5,567: "It" (a cédula sobre o papel)
    kb: 0.12 / 6,
    caiDur: 0.45,                       // a cédula cai e assenta
    lost: 5.7, batida: 0.38,            // "lost" (368,8): o NO bate na linha de Wasilla
    right: 12.667,                      // "right" (375,767): a 2ª linha da cédula
    it: 14.6                            // "It" (377,7): o YES, maior, e o placar
  };
  var CED = { w: 2700, h: 1480, cx: 1640, cy: 1070, rot: -0.6 };   // x 290→2.990, y 330→1.810 (era cx 1.550, x 200→2.900: a borda girada chegava a x 120 sob a câmera do fim; correção do render, 01/10/2026)

  // o carimbo bate: escala 1,55 → 0,97 em 70 % da batida e → 1 no resto; opacidade 0 → 1 na primeira metade
  function carimbo(el, t, t0, k) {
    var p = seg(t, t0, T.batida), s, op;
    if (p < 0.7) { var q = eo(p / 0.7); s = lerp(1.55, 0.97, q); op = clamp(p / 0.35, 0, 1); }
    else { s = lerp(0.97, 1, (p - 0.7) / 0.3); op = 1; }
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translate(-50%,-50%) rotate(-7deg) scale(" + (k * s).toFixed(4) + ")";
  }
  function rotulo(el, op) {
    op = clamp(op, 0, 1);
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translateY(" + ((1 - op) * 24).toFixed(1) + "px)";   // rótulo: 300 ms, opacidade + 24 px (§4.4)
  }
  function credito(el, texto, op) {
    if (el.getAttribute("data-texto") !== texto) {   // o último trecho (" · CC BY…") não se parte entre linhas
      el.setAttribute("data-texto", texto); el.textContent = "";
      var i = texto.lastIndexOf(" · ");
      if (i < 0) el.textContent = texto;
      else { el.appendChild(document.createTextNode(texto.slice(0, i))); var s = document.createElement("span"); s.style.whiteSpace = "nowrap"; s.textContent = texto.slice(i); el.appendChild(s); }
    }
    el.hidden = op <= 0; el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    var b1 = t < T.corte;

    // ── b1: Wasilla em tela cheia, Ken Burns; os rótulos; NEARLY 55% NO em "nearly" ──
    E("reg1").style.visibility = b1 ? "visible" : "hidden";
    E("img1").style.transform = "scale(" + (1 + T.kb * clamp(t, 0, T.corte)).toFixed(5) + ")";
    rotulo(E("rLugar"), b1 ? eo(seg(t, 0, 0.3)) : 0);
    rotulo(E("aviso"), b1 ? eo(seg(t, 0, 0.3)) : 0);
    rotulo(E("nearly"), b1 ? eo(seg(t, T.nearly, 0.3)) : 0);

    // ── b2–b4: a cédula de 1994 cai; NO em "lost"; a 2ª linha em "right"; YES e o placar em "It" ──
    E("papel").style.visibility = b1 ? "hidden" : "visible";
    var cam = E("cam");
    R.camera(cam, t, { base: 1.0 });
    var c = eo(seg(t, T.corte, T.caiDur)), ced = E("cedula");
    ced.style.opacity = (b1 ? 0 : seg(t, T.corte, 0.15)).toFixed(3);
    ced.style.transform = "translate(" + (CED.cx - CED.w / 2).toFixed(2) + "px," + (CED.cy - CED.h / 2 - 100 * (1 - c)).toFixed(2) + "px) rotate(" +
      lerp(CED.rot - 1, CED.rot, c).toFixed(3) + "deg) scale(" + (1.02 - 0.02 * c).toFixed(5) + ")";   // a queda de 100 px, a 1,02× e com 1° a mais, como a s20 (eram 260 px, 1,06× e 2°: o canto entrava na margem de cima; correção do render, 01/10/2026)
    E("linha1").style.opacity = b1 ? "0" : "1"; E("cifrao").style.opacity = b1 ? "0" : "1";
    carimbo(E("carNao"), t, T.lost, 0.6);   // 0,6× em left 2.470 (era 1× em 2.380, com o N sobre o A de WASILLA): sem tocar letra, e menor que o YES a 1,25× (correção do render, 01/10/2026)
    rotulo(E("linha2"), eo(seg(t, T.right, 0.3)));
    rotulo(E("placar"), eo(seg(t, T.it, 0.3)));
    carimbo(E("carSim"), t, T.it, 1.25);

    // ── os créditos: na pílula sobre a foto (os dois); sobre o papel, só a Divisão, em --tinta-escura ──
    var creds = E("creds");
    creds.classList.toggle("caixa", b1); creds.classList.toggle("papel", !b1);
    var op = eo(seg(t, 0, 0.3));
    credito(E("credFoto"), TEXTOS.credFoto, b1 ? op : 0);
    credito(E("credFonte"), TEXTOS.credFonte, op);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
})();
</script>
</body>
</html>
