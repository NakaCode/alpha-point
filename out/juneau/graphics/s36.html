  function medir() {
    var g2 = E("g2"), folha = E("folha"), cam = E("cam"), grupo = E("grupo");
    if (!g2 || !g2.getClientRects().length) return;
    var tc = cam.style.transform, tg = grupo.style.transform;        // mede sem a câmera e sem a inclinação
    cam.style.transform = "none"; grupo.style.transform = "none";
    var rs = g2.getClientRects(), r = rs[rs.length - 1], f = folha.getBoundingClientRect();
    cam.style.transform = tc; grupo.style.transform = tg;
    if (!r || !r.width) return;
    var left = r.left - f.left, top = r.bottom - f.top + 10, w = r.width;   // 10 px abaixo da caixa de conteúdo da linha: as descendentes ficam a 8 px ou mais dos traços (01/10/2026)
    var svg = E("regua"), ns = "http://www.w3.org/2000/svg";
    while (svg.firstChild) svg.removeChild(svg.firstChild); TICKS = [];
    for (var i = 0; i < N; i++) {
      var k = document.createElementNS(ns, "rect");
      k.setAttribute("x", (left + (i + 0.5) * w / N - 3).toFixed(1)); k.setAttribute("y", top.toFixed(1));
      k.setAttribute("width", "6"); k.setAttribute("height", "24"); k.setAttribute("rx", "2");
      svg.appendChild(k); TICKS.push(k);
    }
    medido = true;
  }
  function carimbo(el, t, t0, k) {
    var p = seg(t, t0, T.batida), s, op;
    if (p < 0.7) { var q = eo(p / 0.7); s = lerp(1.55, 0.97, q); op = clamp(p / 0.35, 0, 1); }
    else { s = lerp(0.97, 1, (p - 0.7) / 0.3); op = 1; }
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translate(-50%,-50%) rotate(-7deg) scale(" + (k * s).toFixed(4) + ")";
  }
  function rotulo(el, op) {
    op = clamp(op, 0, 1);
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translateY(" + ((1 - op) * 24).toFixed(1) + "px)";
  }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    if (!medido) medir();
    var cam = E("cam");
    R.camera(cam, t, { base: 1.0 });

    // ── b1: a folha sai da gaveta pela ranhura e se assenta ──
    var p = eo(seg(t, T.sai, T.saiDur));
    var y = lerp(FOLHA.y0, FOLHA.y1, p), rot = lerp(FOLHA.rot0, FOLHA.rot1, p);
    E("grupo").style.transform = "translate(0px," + (y - 240).toFixed(2) + "px) rotate(" + rot.toFixed(3) + "deg)";
    carimbo(E("carimbo"), t, T.still, 0.6);
    rotulo(E("asof"), eo(seg(t, T.still, 0.3)));

    // ── b2: o grifo anda com a voz; o "twelve" se imprime; a régua de 12 traços ──
    E("g1").style.backgroundSize = (100 * seg(t, T.only, T.onlyDur)).toFixed(2) + "% 100%";
    E("g2").style.backgroundSize = (100 * eo(seg(t, T.twelve, T.grifo2Dur))).toFixed(2) + "% 100%";
    E("doze").style.opacity = eo(seg(t, T.twelve, 0.2)).toFixed(3);
    for (var i = 0; i < TICKS.length; i++) TICKS[i].style.opacity = eo(seg(t, T.twelve + 0.1 + i * 0.04, 0.2)).toFixed(3);

    // a luz: atrás da folha, da ranhura ao centro
    cam.style.setProperty("--luz-x", "1920px");
    cam.style.setProperty("--luz-y", lerp(300, 900, p).toFixed(1) + "px");

    // ── o crédito, a cena toda ──
    var c = E("credFonte"), opC = eo(seg(t, 0, 0.3));
    if (c.textContent !== TEXTOS.credFonte) c.textContent = TEXTOS.credFonte;
    c.hidden = false; c.style.opacity = opC.toFixed(3);
    E("creds").style.opacity = opC.toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { medir(); window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () {
    if (!document.fonts) return true;
    return Promise.all([
      document.fonts.load('400 86px "MarcaDoc"').then(function (f) { if (!f.length) window.__fontesFaltando.push("MarcaDoc 400 (Courier Prime da folha)"); }, function () { window.__fontesFaltando.push("MarcaDoc 400 (Courier Prime da folha)"); }),
      document.fonts.load('700 84px "MarcaDoc"').then(function (f) { if (!f.length) window.__fontesFaltando.push("MarcaDoc 700 (Courier Prime da folha)"); }, function () { window.__fontesFaltando.push("MarcaDoc 700 (Courier Prime da folha)"); })
    ]).then(function () { medido = false; medir(); return true; });
  });
  window.__renderAt(0);
})();
