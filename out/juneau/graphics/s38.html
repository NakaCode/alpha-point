  function paleta(p) {
    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));
    }
  }
  // Prontidão: <img>, <image> de SVG e TODAS as faces "Marca"/"MarcaSec". Nunca rejeita: o que falhou
  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();
</script>
<script>
(function () {
  "use strict";
  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo;
  var E = function (id) { return document.getElementById(id); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var DUR = 9.566;
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia é a do textos-tela.json do disco) ═══════════════════════════
  var TEXTOS = {
    fitas:     ["social", "economic", "environmental"],            // textos-tela.json › rotulos_dado s38 (as três legendas, AS 44.06.055)
    credFonte: "Source: Alaska State Legislature, 2026"            // textos-tela.json › _creditos s38 (a comissão e os três custos)
  };
  // ═══════════════════════════════════════════════════════════════════════════════════════════════════════
  E("f0").textContent = TEXTOS.fitas[0]; E("f1").textContent = TEXTOS.fitas[1]; E("f2").textContent = TEXTOS.fitas[2];

  // as nove cadeiras, em roda de raio 745 a partir de −70°, a cada 40° (era 780 até 02/10/2026: com a aproximação da câmera
  // a roda encostaria na margem de cima e na faixa do crédito; REVISÃO DE ESPECTADOR, 3, no cabeçalho)
  var N = 9, CAD = [], CX = 1920, CY = 1000, RAIO = 745;
  (function () {
    var svg = E("roda"), ns = "http://www.w3.org/2000/svg";
    for (var i = 0; i < N; i++) {
      var a = (-70 + i * 40) * Math.PI / 180;
      var c = document.createElementNS(ns, "circle"); c.setAttribute("class", "cadeira"); c.setAttribute("id", "cad" + i);
      c.setAttribute("cx", (CX + RAIO * Math.cos(a)).toFixed(1)); c.setAttribute("cy", (CY + RAIO * Math.sin(a)).toFixed(1)); c.setAttribute("r", "80");
      svg.appendChild(c); CAD.push(c);
    }
  })();

  // ── os tempos (locais, −398,467), da regência s38 e do words.json ──
  var T = {
    nine: 0.877, passo: 0.06,            // "nine-member" (399,344): as cadeiras se acendem, uma a uma
    fitas: [3.762, 4.318, 5.019],        // "social," · "economic" · "environmental"
    fitaDur: 0.35,                       // (o recibo em "The", 6,813, saiu em 02/10/2026: REVISÃO DE ESPECTADOR, no cabeçalho)
    push: 5.019 + 0.35, pushRampa: 1.0, pushV: 0.004   // a aproximação da câmera: do fim da entrada de "environmental" (5,369) ao
                                         // último quadro, velocidade de 0 a 0,4 %/s em 1,0 s, depois constante (REVISÃO DE ESPECTADOR, 3)
  };

  // ── a câmera (REVISÃO DE ESPECTADOR, 3): a deriva do RIG composta com uma aproximação presa ao centro da calculadora ──
  // RIG.camera(cam, t, {base: 1.0}) escreve "scale(s) translate(x, y)" com s = 1,0 + 0,0024 t, x = 6 sin 0,23t, y = 4,8 sin 0,17t
  // e a origem no centro do quadro O (1.920/1.080). Escalar ESSE quadro por k em torno do centro da calculadora C (1.920/1.000)
  // é, com a mesma origem, "translate((C − O)(1 − k)) scale(k s) translate(x, y)". Com k = 1 (até 5,369) sai o transform do RIG.
  var CALC = { x: 1920, y: 1000 };   // o centro da calculadora (left 1.640 + 280, top 620 + 380): a luz e o centro da aproximação
  function pushIn(t) {
    var u = t - T.push; if (u <= 0) return 1;
    var r = T.pushRampa;
    return 1 + T.pushV * (u < r ? u * u / (2 * r) : r / 2 + (u - r));   // rampa quadrática: a velocidade parte de 0 (a da deriva segue), sem tranco
  }
  function camera(el, t) {
    if (!el) return;
    var s = 1.0 + 0.0024 * t, x = 6 * Math.sin(t * 0.23), y = 4.8 * Math.sin(t * 0.17);
    var k = pushIn(t), ay = (CALC.y - 1080) * (1 - k);
    el.style.transform = "translate(0px," + ay.toFixed(3) + "px) scale(" + (k * s).toFixed(5) + ") translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
  }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    var cam = E("cam");
    camera(cam, t);

    // a calculadora, desde o primeiro quadro
    E("calc").style.opacity = eo(seg(t, 0, 0.3)).toFixed(3);

    // ── b1: as nove cadeiras se acendem em roda; as fitas entram na conta ──
    for (var i = 0; i < N; i++) {
      var p = eo(seg(t, T.nine + i * T.passo, 0.25));
      CAD[i].style.opacity = p.toFixed(3);
      CAD[i].style.transform = "scale(" + (0.6 + 0.4 * p).toFixed(3) + ")";
    }
    for (var k = 0; k < 3; k++) {
      var q = eo(seg(t, T.fitas[k], T.fitaDur)), f = E("f" + k);
      f.style.opacity = q.toFixed(3);
      f.style.transform = "translateX(" + ((1 - q) * 360).toFixed(1) + "px) rotate(" + lerp(2, -0.6 + k * 0.5, q).toFixed(2) + "deg)";
    }

    // ── b2 (6,8→9,566): nada entra nem sai; o que acompanha a fala é a aproximação da câmera (camera(), acima), de 5,369 ao
    //    último quadro. O recibo em branco que subia aqui saiu em 02/10/2026 (REVISÃO DE ESPECTADOR, no cabeçalho). ──

    // a luz: atrás da calculadora, parada (e a aproximação é presa ao mesmo ponto)
    cam.style.setProperty("--luz-x", CALC.x + "px"); cam.style.setProperty("--luz-y", CALC.y + "px");

    // ── o crédito, de "nine-member" ao fim ──
    var c = E("credFonte"), opC = eo(seg(t, T.nine, 0.3));
    if (c.textContent !== TEXTOS.credFonte) c.textContent = TEXTOS.credFonte;
    c.hidden = opC <= 0; c.style.opacity = opC.toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
})();
</script>
