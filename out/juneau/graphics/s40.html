        <p class="corpo" id="titulo" data-qc-fonte-livre="folha de documento: Courier Prime (--fonte-doc), identidade §3 e §5"></p>
        <div class="quebra"></div>
        <p class="corpo" id="sec" data-qc-fonte-livre="folha de documento: Courier Prime (--fonte-doc), identidade §3 e §5"></p>
      </div>

  <div id="creds" class="caixa">

<script>
/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de
   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();
   Lei: a cena é função pura de t. Nada aqui lê relógio, sorteia ou anda sozinho. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};
    const s = (o.base ?? 1.02) + (o.zoom ?? 0.0024) * t;
    const x = (o.ax ?? 6) * Math.sin(t * 0.23), y = (o.ay ?? 4.8) * Math.sin(t * 0.17);
    el.style.transform = "scale(" + s.toFixed(5) + ") translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
  }
  // Vídeo por f(t): posiciona e espera o "seeked". Na galeria (__PREVIEW) não mexe.
  function seekTo(v, tt) {
    if (!v || window.__PREVIEW || v.readyState < 1) return Promise.resolve();
    const d = v.duration; if (d > 0 && isFinite(d)) tt = clamp(tt, 0, Math.max(0, d - 0.001));
    if (Math.abs(v.currentTime - tt) < 1e-4 && !v.seeking) return Promise.resolve();
    return new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.addEventListener("error", r, { once: true }); v.currentTime = tt; });
  }
  // Grão: ruído de semente fixa por quadro (mulberry32). Mesmo t, mesmo grão.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  function grao(cv, t, o) {
    if (!cv || !cv.getContext) return; o = o || {};
    const ctx = cv.getContext("2d"), w = cv.width, h = cv.height;
    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));
    const img = ctx.createImageData(w, h), d = img.data, a = o.alfa ?? 22;
    for (let i = 0; i < d.length; i += 4) { const v = (sorte() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }
    ctx.putImageData(img, 0, 0);
  }
  // Paleta por vídeo: OBJETO de papéis {acento:"#…"}, montado pelo editor-de-arte. O espelho.paleta é
  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }
  function cor(v) { return typeof CSS !== "undefined" && CSS.supports ? CSS.supports("color", v) : /^#[0-9a-f]{3,8}$|^(rgb|hsl)a?\(/i.test(v); }
  function paleta(p) {
    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));
    }
  }
  // Prontidão: <img>, <image> de SVG e TODAS as faces "Marca"/"MarcaSec". Nunca rejeita: o que falhou
  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();
</script>
<script>
(function () {
  "use strict";
  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo, eb = R.eb;
  var E = function (id) { return document.getElementById(id); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var DUR = 13.334;
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia é a do textos-tela.json do disco) ═══════════════════════════
  var TEXTOS = {
    rLugar:    "Anchorage, Alaska",                                // textos-tela.json › rotulos_dado s40 (lugar_registro, pelo lugar_na_origem)
    cabecalho: "HOUSE BILL NO. 3 · 2025",                          // textos-tela.json › rotulos_dado s40 (o cabeçalho da folha)
    titulo:    "“An Act relating to convening the legislature in Anchorage; …”",   // textos-tela.json › rotulos_dado s40 (o começo literal do título)
    secAntes:  "* Sec. 16. ",                                      // textos-tela.json › rotulos_dado s40 (a seção literal, com o "* " do original)
    secGrifo:  "AS 44.06.050, 44.06.055, and 44.06.060 are repealed",   // o grifo (textos-tela › _grifo)
    secDepois: ".",
    asof:      "AS OF SEPTEMBER 2026",                             // textos-tela.json › rotulos_dado s40 (a etiqueta da gaveta; volátil)
    credFonte: "Source: Alaska State Legislature, 2026"            // textos-tela.json › _creditos s40 (a folha e AS OF SEPTEMBER 2026)
  };
  // ═══════════════════════════════════════════════════════════════════════════════════════════════════════
  E("rLugar").textContent = TEXTOS.rLugar; E("cab").textContent = TEXTOS.cabecalho; E("titulo").textContent = TEXTOS.titulo;
  E("asof").textContent = TEXTOS.asof;
  (function () {
    var s = E("sec"); s.textContent = "";
    s.appendChild(document.createTextNode(TEXTOS.secAntes));
    var g = document.createElement("span"); g.className = "grifo"; g.id = "g"; g.textContent = TEXTOS.secGrifo; s.appendChild(g);
    s.appendChild(document.createTextNode(TEXTOS.secDepois));
  })();

  // ── os tempos (locais, −418,433), da regência s40 e do words.json ──
  var T = {
    lugar: 3.467,                       // "Anchorage" (421,9): o rótulo espera a voz
    folha: 4.327, desceDur: 0.9,        // "proposed" (422,76): a folha desce sobre o clipe
    grifo: 4.795, grifoDur: 0.55,       // "repealing" (423,228)
    corte: 266 / 30,                    // 8,867: "As" (o clipe acaba; a base troca para a mesa)
    gaveta: 8.9, gavetaDur: 3.697,      // "As" (427,33): AS OF SEPTEMBER 2026; a folha desce para dentro da gaveta até o fim de "committee" (12,597; REVISÃO DO LUCAS)
    deslizaDur: 0.6,                    // o deslize lateral e o endireitamento, separados da descida (8,9→9,5; conferente da maquete)
    clipeQuadro0: 14                    // o ponto de entrada no clipe (0,467 s): 14 + 266 = 280 ≤ 294
  };
  // a folha pousa em y 400 (b2) e, no b3, desce até y 1.076: ficam 641 px dela acima da ranhura (y 1.717), o cabeçalho, o fio e o
  // título; a borda da gaveta cai no vão entre o título e a quebra. xFim −90: centrada na gaveta (x 1.350→3.350)
  var FOLHA = { yAlto: -1400, y1: 400, yGaveta: 1717 - 641, rot: 0.8, xFim: -90 };
  var LUZ = { x: 2270, x2: 2350, y1: 1050, y2: 1400 };   // a luz anda com a folha até a gaveta
  var SEGUE = { x: -430, y: -420 };                       // a câmera acompanha a folha (o conjunto termina no centro do quadro)
  var SOMBRA = { off1: 40, blur1: 110, off2: 22, blur2: 40 };   // a sombra aperta enquanto a folha entra na ranhura (cabe na gaveta)

  function rotulo(el, op) {
    op = clamp(op, 0, 1);
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translateY(" + ((1 - op) * 24).toFixed(1) + "px)";
  }
  function asof(el, op) {
    op = clamp(op, 0, 1);
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translate(-50%," + ((1 - op) * 24).toFixed(1) + "px)";
  }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    var b3 = t >= T.corte;

    // ── b1–b2: o clipe em tela cheia; o rótulo de lugar em "Anchorage", até o clipe acabar ──
    E("reg").style.visibility = b3 ? "hidden" : "visible";
    rotulo(E("rLugar"), b3 ? 0 : eo(seg(t, T.lugar, 0.3)));

    // ── b3: a mesa, a gaveta e a etiqueta ──
    var cam = E("cam"), ran = E("ranhura");
    cam.style.visibility = b3 ? "visible" : "hidden";
    // a câmera do RIG recomeça no corte (t − T.corte: escala 1 e deriva 0 em 8,867; 1,0107 no fim): a folha não se move no
    // corte. A ranhura leva a MESMA transformação da mesa e da gaveta (o recorte coincide com o traço em todo quadro); em
    // b1–b2 os dois ficam na identidade (a folha rasteriza do mesmo jeito dos dois lados do corte)
    var tc = b3 ? t - T.corte : 0;
    R.camera(cam, tc, { base: 1.0 }); R.camera(ran, tc, { base: 1.0 });
    // REVISÃO DO LUCAS (02/10/2026, "6 C"): a câmera ACOMPANHA a folha até a gaveta: a mesa, a gaveta e a ranhura andam
    // juntas (−430/−420 px, eb, o relógio da descida), por fora do avanço do RIG; no corte (g = 0) nada se move
    var g = b3 ? eb(seg(t, T.gaveta, T.gavetaDur)) : 0;
    var segue = "translate(" + (SEGUE.x * g).toFixed(2) + "px," + (SEGUE.y * g).toFixed(2) + "px) ";
    cam.style.transform = segue + cam.style.transform; ran.style.transform = segue + ran.style.transform;
    asof(E("asof"), b3 ? eo(seg(t, T.gaveta, 0.3)) : 0);

    // ── a folha: desce sobre o clipe em "proposed"; no b3 desce para dentro da gaveta de baixo pela ranhura de cima e PARA
    //    com o cabeçalho, o fio e o título à vista. O deslize lateral e o endireitamento têm curva própria, curta (0,6 s) ──
    var d = eo(seg(t, T.folha, T.desceDur)), gx = b3 ? eo(seg(t, T.gaveta, T.deslizaDur)) : 0;
    var y = t < T.folha ? FOLHA.yAlto : lerp(FOLHA.yAlto, FOLHA.y1, d);
    if (b3) y = lerp(FOLHA.y1, FOLHA.yGaveta, g);
    var x = lerp(0, FOLHA.xFim, gx), rr = b3 ? lerp(FOLHA.rot, 0, gx) : lerp(FOLHA.rot - 1.6, FOLHA.rot, d);
    ran.style.clipPath = b3 ? "inset(0 0 443px 0)" : "none";   // o recorte no topo do traço de cima da gaveta (y 2.160 − 443 = 1.717), nas coordenadas da câmera
    E("grupo").style.visibility = t < T.folha ? "hidden" : "visible";   // a folha estacionada acima do quadro fica escondida até a descida (qc-fora-do-quadro, nasceuFora; correção do render, 01/10/2026)
    E("grupo").style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) rotate(" + rr.toFixed(3) + "deg)";
    // o grifo varre em "repealing" (b2) e APAGA no corte (8,867→9,167), ficando apagado no b3 (REVISÃO DO LUCAS)
    E("g").style.backgroundSize = (100 * eo(seg(t, T.grifo, T.grifoDur)) * (1 - (b3 ? eo(seg(t, T.corte, 0.3)) : 0))).toFixed(2) + "% 100%";
    // a sombra aperta com a descida: a folha deita na ranhura, e a sombra cabe nas laterais da gaveta (1.303→3.397)
    var so = E("sombra");
    if (so) so.style.boxShadow = "0 6px 10px color-mix(in srgb, var(--tinta-escura) 35%, transparent), 0 " +
      lerp(SOMBRA.off1, SOMBRA.off2, g).toFixed(1) + "px " + lerp(SOMBRA.blur1, SOMBRA.blur2, g).toFixed(1) +
      "px color-mix(in srgb, var(--tinta-escura) 55%, transparent)";
    cam.style.setProperty("--luz-x", lerp(LUZ.x, LUZ.x2, g).toFixed(1) + "px");
    cam.style.setProperty("--luz-y", lerp(LUZ.y1, LUZ.y2, g).toFixed(1) + "px");

    // ── o crédito: de "proposed" ao fim; na pílula sobre o clipe, solto na mesa ──
    var creds = E("creds"), c = E("credFonte"), opC = eo(seg(t, T.folha, 0.3));
    creds.classList.toggle("caixa", !b3);
    if (c.textContent !== TEXTOS.credFonte) c.textContent = TEXTOS.credFonte;
    c.hidden = opC <= 0; c.style.opacity = opC.toFixed(3); creds.style.opacity = opC.toFixed(3);

    // ── o clipe: o quadro que este t pede (a 1,0×, quadro a quadro, sem laço); no b3 fica no último ──
    var k = T.clipeQuadro0 + Math.round(clamp(t, 0, T.corte) * 30);
    return (Math.min(k, 294) + 0.5) / 30;   // o meio do quadro
  }

  window.__renderAt = function (t) {
    var alvo;
    try { alvo = cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; return Promise.resolve(); }   // nunca lança
    return R.seekTo(E("clipe"), alvo).then(function () { return true; }, function () { return true; });
  };
  window.__prepararCaptura = function () { return window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () {
    if (!document.fonts) return true;
    return Promise.all([
      document.fonts.load('400 86px "MarcaDoc"').then(function (f) { if (!f.length) window.__fontesFaltando.push("MarcaDoc 400 (Courier Prime da folha)"); }, function () { window.__fontesFaltando.push("MarcaDoc 400 (Courier Prime da folha)"); }),
      document.fonts.load('700 84px "MarcaDoc"').then(function (f) { if (!f.length) window.__fontesFaltando.push("MarcaDoc 700 (Courier Prime da folha)"); }, function () { window.__fontesFaltando.push("MarcaDoc 700 (Courier Prime da folha)"); })
    ]).then(function () { return true; });
  });
  // o clipe: o primeiro quadro carregado antes da captura (o render espera esta promessa); arquivo que não carrega
  // é reprovado pelo verificador de mídia do render (readyState 0), não aqui
  window.__videoPronto = new Promise(function (res) {
    var v = E("clipe");
    if (!v) return res(true);
    if (v.readyState >= 2) return res(true);
    v.addEventListener("loadeddata", function () { res(true); }, { once: true });
    v.addEventListener("error", function () { res(true); }, { once: true });
  });
  window.__renderAt(0);
})();
</script>
