  Columbia, the Canadian province next door. That leaves two corridors: the Taku River valley to the east, and Lynn Canal
  to the north. British Columbia said in nineteen ninety-three and two thousand three it wasn't interested in the Taku.
  Lynn Canal is a long fjord between steep mountains, not a dug canal. Any road north would have to reach Haines or
  Skagway, at the top of that fjord. From there, the roads out cross into Canada and meet the Alaska Highway in the Yukon."
  Mapista, 01/10/2026, passo art (lote 3). O ÚNICO RELEVO DO VÍDEO (Lucas, 28/09/2026: "Sim, e com relevo 3D no campo de
  gelo"; identidade §6, "O gasto do Juneau, liberado").

  O RELEVO, MEDIDO NO DEM DA CENA (terrain-rgb-v2 da MapTiler, z9, ~79 m por pixel; 10 tiles pedidos em 01/10, 07:24): a
  parede leste do Lynn Canal sobe de 1.200 a 1.500 m a 2–3 km da costa (inclinação média de 21° a 34° nos primeiros 2 km,
  a 58,90–59,00° N); o canal tem ~10 km de largura; o campo de gelo tem cota mediana de 1.366 m (p90 1.822, máx. 2.236).
  O exagero de trabalho é 1,5 (as encostas de 21–34° se leem a 30–45°, de pé sem caricatura); a inclinação, 50° no palco
  do gelo e dos corredores e 58° no mergulho (a 58° o quadro não chega à divisa perto de Skagway, que passaria sob a
  legenda). O centro da câmera fica congelado na cota 0 (o MapLibre o poria sobre o relevo a cada quadro, e o quadro
  pularia ao passar por cristas); map.project usa o relevo, e os rótulos ficam presos ao chão. Provado nesta máquina em
  01/10/2026, num quadro de conferência em 14,0 s (quadro.mjs com a pré-carga do canal): o relevo sobe, os corredores e a
  estrada caem sobre ele, e o anel e as pílulas ficam a ~2 px de onde o ensaio a seco os pôs.

  OS CORREDORES (identidade §6; espelho › s44 › _esquema): tracejados, saem do texto da fonte e do ponto de partida real,
  sem decalcar a Figure 2-1 do estudo. O do Taku sai do fim da Thane Road (thane-road-fim, OSM) pela água que o DEM mostra
  (cota ≤ 1 m, longe da margem) ao Taku Inlet (o ponto do GNIS) e à foz do rio, e sobe o vale pelo rio-taku-osm até 50 km
  da foz (23 km além da divisa); a parte pela água é um caminho de menor custo sobre o DEM, sem ponto intermediário
  inventado (CENA.corredores.agua). O do Lynn Canal sai do anel de Cascade Point pela margem leste, em terra, colado à água
  e evitando subir (caminho de menor custo sobre o DEM: cota mediana 69 m), até logo ao norte do delta do Katzehin, o fim
  que a fonte nomeia ("just north of the Katzehin River delta", FSEIS 2018, ES-4.3; CENA.corredores.lynn).

  inclinação do mergulho, a parte longe afina com a perspectiva, como o chão, e a mediana fica em 8 a 12 px, sem salto.

  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          if (!map.isSourceLoaded("base") || !map.isSourceLoaded("fronteira") || !map.isSourceLoaded("estrada")) return false;
          if (map.getTerrain() && !map.isSourceLoaded("dem")) return false;   // o relevo, quando ligado
          return nivelUnico();
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        // A ÚLTIMA ATUALIZAÇÃO DOS TILES (cabeçalho): com os tiles carregados, o mapa se atualiza mais duas vezes no mesmo
        // lugar, cada uma com a pintura dela (a 1ª pinta os tiles que acabaram de chegar; a 2ª tira os filhos que o
        // MapLibre guardou para o esmaecimento deles), e de novo, até 6, enquanto a conferência não fechar; ela só conta
        // depois da 2ª. Começa pelo carregado, não pela conferência: os filhos guardados dão dois níveis à vista, e o
        // nivelUnico, abaixo, não fecharia nunca. E recomeça do zero quando um tile volta a carregar: a 1ª podia sair antes
        // de o quadro pedir os tiles dele, e aí só uma caía depois deles
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.jumpTo({ center: map.getCenter() }); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo; se repetir, confira a conexão.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  window.__fotosProntas = R.prontas().then(function () {
    return (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () { conferirCaixas(); return true; });
  });

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__fotosProntas.then(function () { window.__renderAt(0); return true; });
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
