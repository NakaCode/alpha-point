    pende: 5.08, pendeDur: 0.5          // "seventy-nine" (523,18): o travessão pende, o ponteiro sai do centro
  };
  var BAL = { px: 1920, py: 760, meio: 1100, fio: 380, prato: 720, ang: 4 };   // 4°: esquema, não escala de votos

  function rotulo(el, op) {
    op = clamp(op, 0, 1);
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translateY(" + ((1 - op) * 24).toFixed(1) + "px)";   // rótulo: 300 ms, opacidade + 24 px (§4.4)
  }
  function placar(el, cx, top, op) {
    el.style.left = cx.toFixed(1) + "px"; el.style.top = top.toFixed(1) + "px";
    el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  function prato(fio1, fio2, bandeja, xe, ye, queda) {
    var yb = ye + BAL.fio - queda;
    fio1.setAttribute("x1", xe); fio1.setAttribute("y1", ye); fio1.setAttribute("x2", xe - BAL.prato / 2 + 60); fio1.setAttribute("y2", yb);
    fio2.setAttribute("x1", xe); fio2.setAttribute("y1", ye); fio2.setAttribute("x2", xe + BAL.prato / 2 - 60); fio2.setAttribute("y2", yb);
    bandeja.setAttribute("x", xe - BAL.prato / 2); bandeja.setAttribute("y", yb);
    return yb;
  }
  // REVISÃO DE ESPECTADOR, 4 (02/10/2026): a pílula abraça o texto. A montagem é a de antes (o texto e o último trecho num
  // span nowrap, para "CC BY-SA 4.0" não se partir). Se, medido com a fonte carregada e o elemento desenhado, o último
  // trecho desceu de linha, entra um <br> antes dele e o bloco vira nowrap: a quebra passa a ser À MÃO, no último " · "
  // (sem " · ", no último "; " ou ", "; a cena pode ditar outra), nunca no meio de um nome ("Wikimedia Commons" fica
  // junto), e a largura da pílula vira a da linha mais longa, não a máxima da faixa. Decidido uma vez por texto, sem
  // elemento de texto novo (o <br> não tem texto) e com o mesmo textContent do textos-tela.json.
  function creditoTexto(el, texto, quebra) {
    if (!el) return;
    var novo = el.getAttribute("data-texto") !== texto;
    if (!novo && el.getAttribute("data-quebra")) return;               // já decidido para este texto
    el.setAttribute("data-texto", texto); el.removeAttribute("data-quebra"); el.style.whiteSpace = "";
    var i = quebra ? texto.indexOf(quebra) : -1, n = 1;                 // a quebra dita pela cena: antes da palavra
    if (i < 0) { i = texto.lastIndexOf(" · "); n = 3; }
    if (i < 0) { i = texto.lastIndexOf("; "); n = 2; }
    if (i < 0) { i = texto.lastIndexOf(", "); n = 2; }
    el.textContent = "";
    if (i < 0) { el.textContent = texto; el.setAttribute("data-quebra", "nao"); return; }
    var corte = i + n;                                                   // o separador e o espaço ficam na 1ª parte
    el.appendChild(document.createTextNode(texto.slice(0, corte)));
    var s = document.createElement("span"); s.style.whiteSpace = "nowrap"; s.textContent = texto.slice(corte); el.appendChild(s);
    if (el.offsetParent === null || !(document.fonts && document.fonts.status === "loaded")) return;   // mede num quadro seguinte
    var re = el.getBoundingClientRect(), rs = s.getBoundingClientRect();
    if (rs.top - re.top > 0.4 * rs.height) {                             // o último trecho desceu: a quebra à mão
      el.insertBefore(document.createElement("br"), s); el.style.whiteSpace = "nowrap";
      el.setAttribute("data-quebra", "sim");
    } else el.setAttribute("data-quebra", "nao");
  }
  function credito(el, texto, op) {
    creditoTexto(el, texto);
    el.hidden = op <= 0; el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    var b1 = t < T.corte;

    // ── b1: Juneau em 1997, tela cheia, Ken Burns; os rótulos desde o primeiro quadro ──
    E("reg1").style.visibility = b1 ? "visible" : "hidden";
    E("img1").style.transform = "scale(" + (1 + T.kb * clamp(t, 0, T.corte)).toFixed(5) + ")";
    rotulo(E("rLugar"), b1 ? eo(seg(t, 0, 0.3)) : 0);
    rotulo(E("aviso"), b1 ? eo(seg(t, 0, 0.3)) : 0);
    rotulo(E("data"), eo(seg(t, 0, 0.3)));   // OCTOBER 2000 atravessa o corte

    // ── b2: a balança sobre o papel; os pratos pousam em "Better"; pende em "seventy-nine" ──
    E("papel").style.visibility = b1 ? "hidden" : "visible";
    var cam = E("cam");
    R.camera(cam, t, { base: 1.0 });
    var bal = E("balanca");
    bal.style.opacity = (b1 ? 0 : seg(t, T.better, 0.3)).toFixed(3);
    var queda = 80 * (1 - eo(seg(t, T.better, T.pousaDur)));            // os pratos descem 80 px até pousar
    var a = BAL.ang * eo(seg(t, T.pende, T.pendeDur));                   // graus: o lado da balsa (esquerda) desce
    var rad = a * Math.PI / 180, dy = BAL.meio * Math.sin(rad), dx = BAL.meio * (1 - Math.cos(rad));
    E("travessao").setAttribute("transform", "rotate(" + (-a).toFixed(3) + " " + BAL.px + " " + BAL.py + ")");
    var ybE = prato(E("fE1"), E("fE2"), E("bE"), BAL.px - BAL.meio + dx, BAL.py + dy, queda);
    var ybD = prato(E("fD1"), E("fD2"), E("bD"), BAL.px + BAL.meio - dx, BAL.py - dy, queda);
    var opP = b1 ? 0 : eo(seg(t, T.placar, 0.3));
    placar(E("placarE"), BAL.px - BAL.meio + dx, ybE + 60, opP);   // abaixo da bandeja: os fios não cruzam o texto
    placar(E("placarD"), BAL.px + BAL.meio - dx, ybD + 60, opP);

    // ── os créditos: na pílula sobre a foto; sobre o papel, só a fonte do placar, em --tinta-escura ──
    var creds = E("creds");
    creds.classList.toggle("caixa", b1); creds.classList.toggle("papel", !b1);
    credito(E("credFoto"), TEXTOS.credFoto, b1 ? eo(seg(t, 0, 0.3)) : 0);
    credito(E("credFonte"), TEXTOS.credFonte, b1 ? 0 : eo(seg(t, T.better, 0.3)));
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
})();
</script>
