    var s = eo(seg(t, T.sai, T.saiDur));
    E("icoRoad").setAttribute("transform", "translate(" + (720 * s).toFixed(1) + " 0)");   // 160 px do ícone = 160 unidades
    E("icoRoad").style.opacity = (1 - seg(t, T.sai + 0.15, T.saiDur - 0.15)).toFixed(3);

    // ── b3: a linha de s54 volta pequena, ao lado das fichas ──
    ficha(E("mini"), MINI, 0.8, t, T.mini);

    // a luz: atrás do retrato; em 6,933 desliza para trás das fichas
    var l = eo(seg(t, T.luz, T.luzDur));
    cam.style.setProperty("--luz-x", lerp(LUZ.x1, LUZ.x2, l).toFixed(1) + "px"); cam.style.setProperty("--luz-y", lerp(LUZ.y1, LUZ.y2, l).toFixed(1) + "px");

    // ── os créditos: a FSEIS, de DECEMBER 2016 ao fim, embaixo, no lugar dela (o textos-tela diz que cobre NO ACTION e o comunicado);
    //    a série do petróleo ACIMA dela, de "He" (9,847) ao fim, enquanto a linha pequena está no ar: o lugar das duas é reservado
    //    desde o primeiro quadro (a de cima fica no layout a 0 até acender), e a de baixo não salta (roupa §4; 01/10/2026) ──
    var c = E("credFonte"), opC = eo(seg(t, T.data, 0.3));
    creditoSemPartir(c, TEXTOS.credFonte);
    c.hidden = opC <= 0; c.style.opacity = opC.toFixed(3);
    var c2 = E("credSerie"), opC2 = eo(seg(t, T.mini, 0.3));
    creditoSemPartir(c2, TEXTOS.credSerie);
    c2.hidden = false; c2.style.opacity = opC2.toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
})();
</script>
