/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.

(function () {

    corte: 67 / 30,                            // 2,233: "still" (o DADO sobre o papel)
    aros: 2.233, aroPasso: 0.04,               // os nove círculos, um a cada 40 ms
    data: 3.367,                               // "January" (581,5): JANUARY 2017
    six: 5.217, sixPasso: 0.05, encheDur: 0.22 // "six" (583,35): seis se enchem, um a cada 50 ms
  };
  // ── LAYOUT da foto impressa (REVISÃO DO LUCAS, 02/10/2026: a foto inteira): arquivo 2048×1089 a 1,2×, moldura 48 px, −1,2° ──
  var ARQ = { w: 2048, h: 1089 }, ESC = 1.2, MOLD = 48, ROT = -1.2, PE_MAX = 1866;   // o canto mais baixo da moldura fica em y 1.866 (< 1.880)
  var IW = Math.round(ARQ.w * ESC), IH = Math.round(ARQ.h * ESC);                   // 2458 × 1307
  var FW = IW + 2 * MOLD, FH = IH + 2 * MOLD;                                        // 2554 × 1403
  var SN = Math.sin(ROT * Math.PI / 180), CS = Math.cos(ROT * Math.PI / 180);
  // a −1,2° o canto de baixo à esquerda é o ponto mais baixo da moldura: o centro vertical sai dele
  var CY = PE_MAX - (-FW / 2) * SN - (FH / 2) * CS;                                  // ≈ 1.138
  // a fita esquerda (left −60, top −14, 460 × 150, girada −4°) é o ponto mais alto à esquerda; a pílula fica 40 px acima dela
  var topoFita = CY + (394 - FW / 2) * SN + (-30 - FH / 2) * CS;                     // ≈ 425
  var PIL_H = 189;                                                                   // 128 px × 1,1 + 2 × 24 de respiro
  var PIL = { left: Math.round(1920 - FW / 2), top: Math.round(topoFita - 40 - PIL_H) };   // ≈ 643 / 196 (abaixo da margem de 160)
  var FOTO = { w: FW, h: FH, cx: 1920, cy: CY, rot: ROT };
  var LUZ = { x: 1920, y: Math.round(CY) };
  (function () {
    var f = E("foto"); if (!f) return;
    f.style.width = FW + "px"; f.style.height = FH + "px";
    var r = f.querySelector(".recorte"); if (r) { r.style.width = IW + "px"; r.style.height = IH + "px"; }
    var im = f.querySelector(".recorte img"); if (im) { im.style.width = IW + "px"; im.style.height = IH + "px"; }
    var fd = E("fitaD"); if (fd) fd.style.left = (FW - 400) + "px";
    var p = E("rLugar"); if (p) { p.style.left = PIL.left + "px"; p.style.top = PIL.top + "px"; }
  })();

  function por(el, cx, cy, w, h, rot, s, op) {
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  function rotulo(el, op) {
    op = clamp(op, 0, 1);
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translateY(" + ((1 - op) * 24).toFixed(1) + "px)";   // rótulo: 300 ms, opacidade + 24 px (§4.4)
  }
  function fita(el, t, t0, rot) {
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * -20).toFixed(1) + "px) rotate(" + rot + "deg) scale(" + (1 + (1 - p) * 0.08).toFixed(4) + ")";   // −20 (era −40): a fita não encosta na pílula em 0,5 s (REVISÃO DO LUCAS)
  }
  function credito(el, texto, op) {
    if (el.textContent !== texto) el.textContent = texto;
    el.hidden = op <= 0; el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    var b1 = t < T.corte;

    // ── b1: a mesa; a foto da sessão impressa pousa; o rótulo desde o primeiro quadro ──
    var cam = E("cam");
    cam.style.visibility = b1 ? "visible" : "hidden";
    R.camera(cam, t, { base: 1.0 });
    var q = eo(seg(t, T.pousa, T.pousaDur));
    // REVISÃO DO LUCAS: a foto inteira entra no próprio lugar (sem o deslize de 240 px de baixo: o pé nunca entra na faixa do
    // crédito) e a inclinação de entrada começa em −2°, dentro dos 2° da foto impressa (identidade §5)
    por(E("foto"), FOTO.cx, FOTO.cy, FOTO.w, FOTO.h, lerp(-2.0, FOTO.rot, q), 0.8 + 0.2 * q, seg(t, T.pousa, 0.22));
    fita(E("fitaE"), t, T.pousa + T.fita, -4); fita(E("fitaD"), t, T.pousa + T.fita + 0.12, 4);
    rotulo(E("rLugar"), b1 ? eo(seg(t, 0, 0.3)) : 0);
    cam.style.setProperty("--luz-x", LUZ.x + "px"); cam.style.setProperty("--luz-y", LUZ.y + "px");

    // ── b2: os nove círculos; JANUARY 2017 em "January"; seis se enchem em "six" ──
    E("papel").style.visibility = b1 ? "hidden" : "visible";
    R.camera(E("cam2"), t, { base: 1.0 });
    for (var i = 0; i < 9; i++) {
      var a = b1 ? 0 : eo(seg(t, T.aros + i * T.aroPasso, 0.3));
      AROS[i].style.opacity = a.toFixed(3);
      AROS[i].setAttribute("r", (110 * (0.8 + 0.2 * a)).toFixed(2));
      var f = (b1 || i >= 6) ? 0 : eo(seg(t, T.six + i * T.sixPasso, T.encheDur));
      CHEIOS[i].setAttribute("r", (110 * f).toFixed(2));
    }
    rotulo(E("data"), b1 ? 0 : eo(seg(t, T.data, 0.3)));

    // ── os créditos: solto na mesa no b1; sobre o papel no b2 ──
    E("creds").classList.toggle("papel", !b1);
    credito(E("credFoto"), TEXTOS.credFoto, b1 ? eo(seg(t, 0, 0.3)) : 0);
    credito(E("credFonte"), TEXTOS.credFonte, b1 ? 0 : eo(seg(t, T.corte, 0.3)));
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
})();
</script>
</body>
