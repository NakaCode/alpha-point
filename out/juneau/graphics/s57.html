      for (i = n - 8; i >= Math.max(8, n - 64); i--) if (b[i] === 0x49 && b[i + 1] === 0x45 && b[i + 2] === 0x4E && b[i + 3] === 0x44) return null;
      return "PNG cortado (" + n + " bytes, sem o bloco IEND)";
    }
    if (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46) {
      var decl = (b[4] | (b[5] << 8) | (b[6] << 16) | (b[7] << 24)) >>> 0;
      return decl + 8 <= n ? null : "WebP cortado (" + n + " de " + (decl + 8) + " bytes)";
    }
    return null;
  }
  function erroCorpo(msg, url, st) {
    var e = new Error("tile corrompido: " + msg); e.falha = "corrompido"; e.url = url; e.statusCorpo = st; return e;
  }
  function buscarComRetentativa(params, abortar) {
    var url = params.url.replace(/^regie\+/, "");
    var tentativa = 0;
    var ehImagem = params.type === "image";
    function uma() {
      var ctl = new AbortController(), estourou = false;
      var cancelar = function () { ctl.abort(); };
      var externo = abortar && abortar.signal;
      if (externo) { if (externo.aborted) ctl.abort(); else externo.addEventListener("abort", cancelar); }
      var relogio = setTimeout(function () { estourou = true; ctl.abort(); }, PRAZO_TENTATIVA);
      var soltar = function () { clearTimeout(relogio); if (externo) externo.removeEventListener("abort", cancelar); };
      return fetch(url, { signal: ctl.signal }).then(function (r) {
        if (!r.ok) {
          var e = new Error("AJAXError: HTTP " + r.status + " (" + r.status + "): " + url); e.status = r.status; e.url = url; e.falha = "http";
          throw e;
        }
        if (params.type === "json") return r.text().then(function (t) {
          try { return JSON.parse(t); } catch (x) { throw erroCorpo("JSON ilegível (" + t.length + " caracteres)", url, r.status); }
        });
        return r.arrayBuffer().then(function (buf) {
          if (!ehImagem) return buf;
          var defeito = defeitoDaImagem(buf);
          if (defeito) throw erroCorpo(defeito, url, r.status);
          return createImageBitmap(new Blob([buf])).then(null, function (x) {
            throw erroCorpo("a imagem não decodifica (" + buf.byteLength + " bytes: " + ((x && x.message) || "sem descrição") + ")", url, r.status);
          });
        });
      }).then(function (data) { soltar(); return { data: data }; }, function (e) {
        soltar();
        if (e && e.name === "AbortError" && !estourou) throw e;
        if (estourou) { e = new Error("sem resposta em " + PRAZO_TENTATIVA / 1000 + " s"); e.falha = "tempo"; }
        if (!e || typeof e !== "object") e = new Error(String(e));
        var st = e.status;
        if (!e.falha) e.falha = st ? "http" : "rede";
        var passageira = e.falha !== "http" || st === 429 || st >= 500;
        try { e.url = url; e.tentativas = tentativa + 1; } catch (x) {}
        if (!passageira || ++tentativa >= ESPERAS.length) throw e;
        window.__retentativasMapa++;
        window.__retentativasMapaPorFalha[e.falha] = (window.__retentativasMapaPorFalha[e.falha] || 0) + 1;
        return new Promise(function (res) { setTimeout(res, ESPERAS[tentativa]); }).then(uma);
      });
    }
    return uma();
  }
  maplibregl.addProtocol("regie+https", buscarComRetentativa);
  maplibregl.addProtocol("regie+http", buscarComRetentativa);
  var pelaRegie = function (url) { return /^https?:\/\//.test(url) ? { url: "regie+" + url } : undefined; };

  // a câmera do inset, PARADA e calculada antes do mapa nascer (Web Mercator, mundo de 512 · 2^z px, como o MapLibre):
  // o zoom pela distância Juneau–Skagway em pixels, e o centro que põe Juneau no ponto local juneauEm. Nenhum jumpTo
  // depois: um salto de zoom deixava dois níveis de tile na tela e a espera de nível único nunca fechava.
  function mercPx(ll, z) {
    var w = 512 * Math.pow(2, z), s = Math.sin(ll[1] * Math.PI / 180);
    return [(ll[0] + 180) / 360 * w, (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * w];
  }
  function mercInv(px, z) {
    var w = 512 * Math.pow(2, z), n = Math.PI - 2 * Math.PI * px[1] / w;
    return [px[0] / w * 360 - 180, 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)))];
  }
  var pj0 = mercPx(PONTO_JUNEAU, 0), ps0 = mercPx(PONTO_SKAGWAY, 0);
  var d0 = Math.hypot(ps0[0] - pj0[0], ps0[1] - pj0[1]);
  var d1 = Math.hypot(I.skagwayEm[0] - I.juneauEm[0], I.skagwayEm[1] - I.juneauEm[1]);
  var ZOOM = Math.log2(d1 / d0);
  var pjz = mercPx(PONTO_JUNEAU, ZOOM);
  var CENTRO = mercInv([pjz[0] - (I.juneauEm[0] - 960), pjz[1] - (I.juneauEm[1] - 540)], ZOOM);

  var map;
  try {
    map = new maplibregl.Map({
      container: "map", interactive: false, preserveDrawingBuffer: true, fadeDuration: 0,
      maxTileCacheSize: 4096, attributionControl: false, maxPitch: 85, transformRequest: pelaRegie,
      style: estilo(), center: CENTRO, zoom: ZOOM, bearing: 0, pitch: 0
    });
  } catch (e) {
    return falhar("o MapLibre não subiu (" + (e && e.message) + "). Sem WebGL no navegador não há mapa: confira a placa de vídeo/driver ou o Chrome usado pelo render.");
  }
  window.map = map;

  // ── FAIL-CLOSED: tile que não chega é ERRO, não quadro cego (molde) ─────────────────────────────
  window.__errosMapa = 0;
  function motivoRede(err, msg) {
    var st = err.status, n = err.tentativas > 1 ? " (" + err.tentativas + " tentativas)" : "";
    if (err.falha === "corrompido" || /could not be decoded|could not load image|tile corrompido/i.test(msg)) {
      return "mandou tile CORROMPIDO" + n + ": a resposta chegou, mas a imagem veio cortada ou ilegível (" +
        String(msg).replace(/^tile corrompido: /, "") + "). Não é falta de internet: o servidor ou a conexão estão cortando " +
        "respostas. Renderize de novo.";
    }
    if (err.falha === "tempo") return "não respondeu em " + PRAZO_TENTATIVA / 1000 + " s" + n + " (internet lenta ou servidor sobrecarregado). Renderize de novo.";
    if (st === 401 || st === 403) return "recusou o acesso (HTTP " + st + "). Confira a chave " + (P.credencial || "") + " e o plano do dono.";
    if (st === 429) return "limitou as requisições (HTTP 429)" + n + ". Espere e renderize de novo.";
    if (st >= 500) return "está com erro no servidor (HTTP " + st + ")" + n + ". Tente de novo mais tarde.";
    if (st) return "respondeu HTTP " + st + ".";
    return "não respondeu (sem internet? servidor fora do ar? firewall?)" + n + ".";
  }
  map.on("error", function (ev) {
    window.__errosMapa++;
    var err = (ev && ev.error) || {};
    var msg = String(err.message || "");
    var deRede = err.status || err.url || (ev && ev.tile) || /fetch|network|failed to load|load failed|cors/i.test(msg);
    if (!deRede) return falhar("o MapLibre acusou erro na cena: " + (msg || "sem descrição") + ". Confira o bloco CENA (ids de camada/fonte, valores).");
    var fonte = ev && ev.sourceId ? " (fonte '" + ev.sourceId + "')" : (mapaCarregado ? "" : " (o estilo do mapa)");
    falhar("a base '" + P.nome + "'" + fonte + " " + motivoRede(err, msg) + (err.url ? " URL: " + String(err.url).split("?")[0] : "") +
      (msg && !err.status && err.falha !== "corrompido" && err.falha !== "tempo" && !/could not be decoded|could not load image/i.test(msg) ? " — " + msg : ""));
  });

  // as linhas de s50, projetadas uma vez quando o mapa nasce (a câmera não se move)
  var mapaCarregado = false;
  function caminho(coords) {
    var d = "";
    for (var i = 0; i < coords.length; i++) { var p = map.project(coords[i]); d += (i ? " L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1); }
    return d;
  }
  map.on("load", function () {
    try {
      var pj = map.project(PONTO_JUNEAU);
      if (Math.hypot(pj.x - I.juneauEm[0], pj.y - I.juneauEm[1]) > 3)
        window.__avisos.push("s57: Juneau caiu em (" + pj.x.toFixed(1) + ", " + pj.y.toFixed(1) + ") no inset, e não em (" + I.juneauEm.join(", ") + ")");
      var dE = caminho(ESTRADA), dP = caminho(PROPOSTA), dB = caminho(BALSA);
      E("estradaC").setAttribute("d", dE); E("estradaN").setAttribute("d", dE);
      E("propostaC").setAttribute("d", dP); E("propostaN").setAttribute("d", dP);
      E("balsaC").setAttribute("d", dB); E("balsaN").setAttribute("d", dB);
    } catch (e) { return falhar("não consegui posicionar a câmera do inset: " + e.message); }
    mapaCarregado = true;
    map.once("idle", function () { if (!window.__erroCena) resolverPronto(true); });
  });

  // ── o retrato, o card, o cartão e os textos ─────────────────────────────────────────────────
  var T = CENA.t, POLA = CENA.pola, C = CENA.cartao, L = CENA.luz;
  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  function rotulo(el, op) {
    if (!el) return;
    op = clamp(op, 0, 1);
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translateY(" + ((1 - op) * 24).toFixed(1) + "px)";   // rótulo: 300 ms, opacidade + 24 px (§4.4)
  }
  function etiqueta(el, op, dim) {   // centrada no fim do ramo (translateX −50 %), com a subida do rótulo e o esmaecer
    if (!el) return;
    op = clamp(op, 0, 1);
    el.style.opacity = (op * dim).toFixed(3);
    el.style.transform = "translate(-50%," + ((1 - op) * 24).toFixed(1) + "px)";
  }
  function fita(el, t, t0, rot) {
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * -40).toFixed(1) + "px) rotate(" + rot + "deg) scale(" + (1 + (1 - p) * 0.08).toFixed(4) + ")";
  }
  function traco(el, p) {   // desenha o caminho (pathLength="1") de 0 a p
    el.style.strokeDasharray = "1 1";
    el.style.strokeDashoffset = (1 - clamp(p, 0, 1)).toFixed(4);
    el.style.opacity = p > 0 ? "1" : "0";
  }
  function credito(el, texto, op) {
    if (!el) return;
    op = clamp(op, 0, 1);
    if (el.textContent !== texto) el.textContent = texto;
    el.hidden = false;   // as duas linhas ocupam o lugar delas desde o começo: o crédito não salta (roupa §4)
    el.style.opacity = op.toFixed(3);
  }

  function aplicar(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    var cam = E("cam");
    R.camera(cam, t, { base: 1.0 });   // a câmera do RIG sobre a mesa inteira (inset incluso); base 1,0 pela margem
    // a luz: atrás do retrato; vai para trás do cartão em "It"
    var pl = eo(seg(t, T.cartao, 0.3));
    cam.style.setProperty("--luz-x", lerp(L.x1, L.x2, pl).toFixed(1) + "px");
    cam.style.setProperty("--luz-y", lerp(L.y1, L.y2, pl).toFixed(1) + "px");

    // ── b1: o retrato impresso pousa; o cargo em "Assembly"; o nome em "Maria" ──
    var q = eo(seg(t, T.pousa, T.pousaDur));
    por(E("pola"), POLA.cx, POLA.cy + 240 * (1 - q), POLA.w, POLA.h, lerp(-4, POLA.rot, q), 0.72 + 0.28 * q, seg(t, T.pousa, 0.22));
    fita(E("fita"), t, T.pousa + T.fita, -4);
    rotulo(E("cargo"), eo(seg(t, T.cargo, 0.3)));
    rotulo(E("nome"), eo(seg(t, T.nome, 0.3)));

    // ── b2: o cartão pousa em "It"; a estrada se desenha; em "but" para num cais ──
    var p = eo(seg(t, T.cartao, T.cartaoDur));
    por(E("cartao"), C.x + C.w / 2, C.y + C.h / 2 + 180 * (1 - p), C.w, C.h, lerp(-3, C.rot, p), 0.94 + 0.06 * p, seg(t, T.cartao, 0.2));
    var recuo = eo(seg(t, T.but, 0.4));                      // o tronco recua do garfo (620) até o cais (790): de 1 a 0,667
    traco(E("tronco"), eo(seg(t, T.tronco, T.troncoDur)) * lerp(1, 0.6667, recuo));
    var some = 1 - eo(seg(t, T.but, 0.3));
    traco(E("ramoSkagway"), eo(seg(t, T.skagway, T.skagwayDur)) * some);
    traco(E("ramoHaines"), eo(seg(t, T.haines, T.hainesDur)) * some);
    var dim = lerp(1, 0.55, eo(seg(t, T.but, 0.3)));
    etiqueta(E("etqSkagway"), eo(seg(t, T.etqSkagway, 0.3)), dim);
    etiqueta(E("etqHaines"), eo(seg(t, T.etqHaines, 0.3)), dim);
    var pc = eo(seg(t, T.cais, 0.3)), cais = E("cais");
    cais.setAttribute("opacity", pc.toFixed(3));
    cais.setAttribute("transform", "translate(700 790) scale(" + (0.8 + 0.2 * pc).toFixed(4) + ") translate(-700 -790)");
    var pb = eo(seg(t, T.balsa, 0.3));
    E("balsaSkagway").style.opacity = (0.75 * pb).toFixed(3); E("balsaHaines").style.opacity = (0.75 * pb).toFixed(3);

    // os créditos: a fonte do card (de "Assembly" ao corte) em cima, a linha do mapa (a cena toda) embaixo
    credito(E("credFonte"), TX.credFonte, eo(seg(t, T.cargo, 0.3)));
    credito(E("credMapa"), TX.credMapa, 1);
  }

  // ── o contrato de captura ───────────────────────────────────────────────────────────────────
  window.__renderAt = function (t) {
    try { aplicar(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // NUNCA lança
  };

  // espera de um nível de tile só na tela (molde): conta só os tiles que vão ser desenhados
  function nivelUnico() {
    try {
      if (map.getTerrain() || map.getPitch() > 1) return true;
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      var cache = sc.base; if (!cache) return true;
      var ids = cache.getRenderableIds ? cache.getRenderableIds() : Object.keys(cache._tiles || {});
      var tiles = ids.map(function (id) { return cache._tiles[id]; }).filter(Boolean);
      if (!tiles.length) return false;
      if (tiles.some(function (x) { return x.state === "loading"; })) return false;
      var niveis = new Set(tiles.map(function (x) { return x.tileID && x.tileID.canonical && x.tileID.canonical.z; }));
      return niveis.size <= 1;
    } catch (e) { return true; }
  }
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) {
        var ts = (sc[id] && sc[id]._tiles) || {};
        for (var k in ts) if (ts[k] && ts[k].state === "errored") return id;
      }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou (HTTP 404 ou resposta inválida). O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          if (!map.isSourceLoaded("base")) return false;
          return nivelUnico();
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0;
      (function tick() {
        barrarTileComErro();
        seguidas = pronto() ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo; se repetir, confira a conexão.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  // prévia: auto-loop só quando pedido (#preview). A captura nunca é a prévia: __prepararCaptura cancela o loop,
  // espera o mapa e as fotos e põe o quadro 0 (o render espera esta Promise até 90 s).
  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__fotosProntas = R.prontas();
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return Promise.all([window.__ready, window.__fotosProntas]).then(function () { window.__renderAt(0); return true; });
  };
  window.__ready.then(function () {
    window.__fotosProntas.then(function () { window.__renderAt(0); });
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
</body>
</html>
