    pousa: 0.033, pousaDur: 0.6, fita: 0.45,   // a página pousa desde o primeiro quadro
    grifoFR: 1.7, grifoFRDur: 0.7,     // "final" (597,007): o grifo na frase da decisão
    data: 2.233, dataFim: 4.233,       // "June" (597,564): JUNE 2018, até 4,233
    rod: 3.5, rodDur: 0.5,             // "In" (598,85): a folha do ROD cai por cima
    g1: 8.233, g1Dur: 0.8,             // "state's" (603,543)
    g2: 9.733, g2Dur: 0.8,             // "public" (605,056)
    treme: 9.733, tremeDur: 1.0        // a folha treme 2 px por 1 s
  };
  var FR = { cx: 1890, cy: 1000, w: 2970, h: 1500, rot: -0.6 };
  var ROD = { cx: 1890, cy: 1120, w: 2900, h: 1800, rot: 0.8 };
  var LUZ = { x1: 1890, y1: 1000, x2: 1890, y2: 1120 };
  var GR = [90, 1320, 398];   // os três retângulos do grifo, na ordem da leitura (comprimento 1.808)

  function por(el, cx, cy, w, h, rot, s, op, dx) {
    el.style.transform = "translate(" + (cx - w / 2 + (dx || 0)).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  function rotulo(el, op) {
    op = clamp(op, 0, 1);
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translateY(" + ((1 - op) * 24).toFixed(1) + "px)";
  }
  function fita(el, t, t0, rot) {
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * -40).toFixed(1) + "px) rotate(" + rot + "deg) scale(" + (1 + (1 - p) * 0.08).toFixed(4) + ")";
  }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    var cam = E("cam");
    R.camera(cam, t, { base: 1.0 });

    // ── b1: a página do Federal Register pousa, colada com fita; o grifo na frase; JUNE 2018 ──
    var q = eo(seg(t, T.pousa, T.pousaDur));
    por(E("fr"), FR.cx, FR.cy + 240 * (1 - q), FR.w, FR.h, lerp(-3, FR.rot, q), 0.72 + 0.28 * q, seg(t, T.pousa, 0.22));
    fita(E("fita1"), t, T.pousa + T.fita, -4);
    fita(E("fita2"), t, T.pousa + T.fita + 0.08, 3);
    var L = (GR[0] + GR[1] + GR[2]) * eo(seg(t, T.grifoFR, T.grifoFRDur));
    E("gr1").setAttribute("width", clamp(L, 0, GR[0]).toFixed(1));
    E("gr2").setAttribute("width", clamp(L - GR[0], 0, GR[1]).toFixed(1));
    E("gr3").setAttribute("width", clamp(L - GR[0] - GR[1], 0, GR[2]).toFixed(1));
    rotulo(E("data"), eo(win(t, T.data, 0.3, T.dataFim, 0.3)));

    // ── b2–b4: a folha do ROD cai por cima; os grifos; a folha treme em "public" ──
    var p = eo(seg(t, T.rod, T.rodDur));
    var tr = seg(t, T.treme, T.tremeDur);
    var dx = tr > 0 && tr < 1 ? 2 * Math.sin((t - T.treme) * 2 * Math.PI * 14) * (1 - seg(t, T.treme + T.tremeDur - 0.2, 0.2)) : 0;
    por(E("rod"), ROD.cx, ROD.cy - 160 * (1 - p), ROD.w, ROD.h, lerp(-1.5, ROD.rot, p), 1.06 - 0.06 * p, seg(t, T.rod, 0.2), dx);
    E("g1").style.backgroundSize = (100 * seg(t, T.g1, T.g1Dur)).toFixed(2) + "% 100%";
    E("g2").style.backgroundSize = (100 * seg(t, T.g2, T.g2Dur)).toFixed(2) + "% 100%";

    // a luz: atrás da página; vai para trás da folha em "In"
    var pl = eo(seg(t, T.rod, 0.3));
    cam.style.setProperty("--luz-x", lerp(LUZ.x1, LUZ.x2, pl).toFixed(1) + "px");
    cam.style.setProperty("--luz-y", lerp(LUZ.y1, LUZ.y2, pl).toFixed(1) + "px");

    // ── o crédito, a cena toda ──
    var c = E("credFonte"), opC = eo(seg(t, 0, 0.3));
    if (c.textContent !== TEXTOS.credFonte) c.textContent = TEXTOS.credFonte;
    c.hidden = false; c.style.opacity = opC.toFixed(3);
    E("creds").style.opacity = opC.toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () {
    if (!document.fonts) return true;
    return Promise.all([
      document.fonts.load('400 86px "MarcaDoc"').then(function (f) { if (!f.length) window.__fontesFaltando.push("MarcaDoc 400 (Courier Prime da folha)"); }, function () { window.__fontesFaltando.push("MarcaDoc 400 (Courier Prime da folha)"); }),
      document.fonts.load('700 84px "MarcaDoc"').then(function (f) { if (!f.length) window.__fontesFaltando.push("MarcaDoc 700 (Courier Prime da folha)"); }, function () { window.__fontesFaltando.push("MarcaDoc 700 (Courier Prime da folha)"); })
    ]).then(function () { return true; });
  });
  window.__renderAt(0);
})();
