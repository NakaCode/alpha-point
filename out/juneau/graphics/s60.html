    // ── b1: o YES bate na cédula; 1974 ──
    var pulso = 1 + 0.05 * Math.sin(Math.PI * seg(t, T.pulso, 0.3));
    carimbo(E("yes"), t, T.yes, 1.0, pulso);
    rotulo(E("ano"), eo(win(t, T.ano, 0.3, T.anoFim, 0.3)));

    // ── b2: a faixa do cabeçalho vira (a frente encolhe até a dobra, o verso desdobra) ──
    var pv = seg(t, T.vira, T.viraDur), sy = Math.abs(1 - 2 * pv);
    E("cabFlip").setAttribute("transform", "translate(0 445) scale(1 " + sy.toFixed(4) + ") translate(0 -445)");
    var frente = pv < 0.5 ? 1 : 0;
    E("cabFrente").setAttribute("opacity", frente); E("cabLinhas").setAttribute("opacity", frente); E("cabVerso").setAttribute("opacity", 1 - frente);

    // ── b3–b5: as duas perguntas, as duas linhas, os dois NO ──
    rotulo(E("q1"), eo(seg(t, T.q1, 0.3)));
    rotulo(E("q2"), eo(seg(t, T.q2, 0.3)));
    rotulo(E("l78"), eo(seg(t, T.linhas, 0.3)));
    rotulo(E("l82"), eo(seg(t, T.linhas + 0.08, 0.3)));
    carimbo(E("no1"), t, T.no, 0.6);
    carimbo(E("no2"), t, T.no + 0.12, 0.6);

    // ── o crédito, a cena toda ──
    var c = E("credFonte"), opC = eo(seg(t, 0, 0.3));
    if (c.textContent !== TEXTOS.credFonte) c.textContent = TEXTOS.credFonte;
    c.hidden = false; c.style.opacity = opC.toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
})();
