  // Paleta por vídeo: OBJETO de papéis {acento:"#…"}, montado pelo editor-de-arte. O espelho.paleta é
  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }
  function cor(v) { return typeof CSS !== "undefined" && CSS.supports ? CSS.supports("color", v) : /^#[0-9a-f]{3,8}$|^(rgb|hsl)a?\(/i.test(v); }
  function paleta(p) {
    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));
    }
  }
  // Prontidão: <img>, <image> de SVG e TODAS as faces "Marca"/"MarcaSec". Nunca rejeita: o que falhou
  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();
</script>
<script>
(function () {
  "use strict";
  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo, eb = R.eb;
  var E = function (id) { return document.getElementById(id); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var DUR = 17.367;
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia é a do textos-tela.json do disco, 03/10/2026) ═══════════════════════════
  var TEXTOS = {
    yes:   "YES",                                                // textos-tela.json › rotulos_dado s60 (o carimbo de s01)
    ano74: "1974",                                               // idem (o ano da 1ª estação)
    q1:    "WHETHER TO MOVE",                                    // idem (sem "?")
    q2:    "HOW MUCH",                                           // idem
    ano78: "1978",                                               // idem (o ano da 2ª estação, abaixo do eixo)
    v78:   "UP TO $966 MILLION",                                 // idem (o valor da 2ª estação, acima do eixo; legenda)
    ano82: "1982",                                               // idem (o ano da 3ª estação)
    v82:   "ABOUT $2.8 BILLION",                                 // idem (o valor da 3ª estação; legenda)
    no:    "NO",                                                 // idem (os dois carimbos)
    credFonte: "Source: Alaska Division of Elections, 1974–1982" // textos-tela.json › _creditos s60
  };
  // ═══════════════════════════════════════════════════════════════════════════════════════════════════════
  E("yesTxt").textContent = TEXTOS.yes; E("ano74").textContent = TEXTOS.ano74; E("q1").textContent = TEXTOS.q1; E("q2").textContent = TEXTOS.q2;
  E("ano78").textContent = TEXTOS.ano78; E("v78").textContent = TEXTOS.v78; E("ano82").textContent = TEXTOS.ano82; E("v82").textContent = TEXTOS.v82;
  E("no1Txt").textContent = TEXTOS.no; E("no2Txt").textContent = TEXTOS.no;

  // ── os tempos (locais, −615,7), da regência s60 (03/10/2026) e do words.json ──
  var T = {
    yes: 0.9, batida: 0.38,        // "yes" (616,6): o YES bate (era "that", 0,7)
    ano: 1.6,                      // "nineteen" (617,276): 1974, até o corte
    anda: 3.8,                     // "changed." (619,47): o eixo começa a se desenhar e a câmera a deslizar
    q1: 6.8,                       // "whether" (622,48)
    pulso: 8.785,                  // "yes." (624,485): o YES reafirma
    q2: 10.4,                      // "how" (626,08)
    both: 11.733,                  // "Both" (627,43): as duas estações, os anos e os valores
    no: 14.467                     // "no," (630,145): os dois carimbos NO (o 2º 120 ms depois)
  };
  // a linha do tempo, em coordenadas da folha
  // x0: a ponta do eixo em t = 0 (5ª leva C, 04/10/2026): o eixo já vem de fora do quadro (x1 = −400) e a ponta anda de 700 ao
  // tique de 1974 em "yes" (0 → 0,9 s, ease-out): a linha do tempo chega ao voto no instante em que a voz o nomeia, e o primeiro
  // quadro não é só um tique com um toco de 160 px
  var L = { y: 1150, x0: 700, x74: 1100, x78: 2050, x82: 3000, fim: 3200 };
  var VEL = (L.x82 - L.x74) / (T.both - T.anda);   // 239,5 px/s: a ponta do eixo chega a 1982 em "Both"
  // a câmera: fechada em 1974 (escala 1,28 → 1,30; deslocamento +343: o tique em x ≈ 1.300 da tela), desliza até "Both"
  // (1,0; +141) e deriva para a direita até o corte (−141: 282 px em 5,63 s, ≥ 50 px/s)
  var CAM = { s0: 1.28, s1: 1.30, tx0: 343, tx1: 141, tx2: -141, ty: 160 };

  function carimbo(el, t, t0, k, extra) {
    var p = seg(t, t0, T.batida), s, op;
    if (p < 0.7) { var q = eo(p / 0.7); s = lerp(1.55, 0.97, q); op = clamp(p / 0.35, 0, 1); }
    else { s = lerp(0.97, 1, (p - 0.7) / 0.3); op = 1; }
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translate(-50%,-50%) rotate(-7deg) scale(" + (k * s * (extra || 1)).toFixed(4) + ")";
  }
  function rotulo(el, op) {   // centrado na estação (left = x da estação): 300 ms, opacidade + 24 px (§4.4)
    op = clamp(op, 0, 1);
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translate(-50%," + ((1 - op) * 24).toFixed(1) + "px)";
  }
  function creditoSemPartir(el, texto) {   // o intervalo de anos (AAAA–AAAA) vai num span nowrap: a quebra de linha não o parte (01/10/2026)
    if (el.textContent === texto) return;
    while (el.firstChild) el.removeChild(el.firstChild);
    var m = /^([\s\S]*?)(\d{4}–\d{4})([\s\S]*)$/.exec(texto);
    if (!m) { el.textContent = texto; return; }
    el.appendChild(document.createTextNode(m[1]));
    var s = document.createElement("span"); s.className = "intervalo"; s.textContent = m[2]; el.appendChild(s);
    if (m[3]) el.appendChild(document.createTextNode(m[3]));
  }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    var cam = E("cam");

    // ── a câmera anda pela linha: nunca parada ──
    var pFech = seg(t, 0, T.anda);                                  // 0 → 3,8: aproximação mínima em 1974
    var pDesl = eb(seg(t, T.anda, T.both - T.anda));                // 3,8 → 11,733: desliza com a ponta do eixo
    var pDer = seg(t, T.both, DUR - T.both);                        // 11,733 → corte: deriva constante para a direita
    var s = lerp(lerp(CAM.s0, CAM.s1, pFech), 1.0, pDesl);
    var tx = lerp(lerp(CAM.tx0, CAM.tx0 + (CAM.s1 - CAM.s0) * 0, pFech), CAM.tx1, pDesl) + (CAM.tx2 - CAM.tx1) * pDer;
    var dx = 6 * Math.sin(t * 0.23), dy = 4.8 * Math.sin(t * 0.17);   // a deriva senoidal do RIG (RIG.camera), sem o zoom dele
    cam.style.transform = "scale(" + s.toFixed(5) + ") translate(" + (tx + dx).toFixed(2) + "px," + (CAM.ty + dy).toFixed(2) + "px)";

    // ── o eixo chega ao tique de 1974 em "yes" (de x 700, ease-out; 5ª leva C), se desenha de 1974 para a direita em "changed.",
    //    chega a 1982 em "Both" e acaba em aberto ──
    var ponta = t < T.yes ? lerp(L.x0, L.x74, eo(seg(t, 0, T.yes))) : clamp(L.x74 + VEL * (t - T.anda), L.x74, L.fim);
    E("eixo").setAttribute("x2", ponta.toFixed(1));
    var est = ponta >= L.x78 - 0.5 && t >= T.both - 0.001 ? 1 : 0;   // as estações de 1978 e 1982 só existem com os anos, em "Both"
    E("tq78").setAttribute("opacity", est); E("tq82").setAttribute("opacity", est);

    // ── b1: o YES bate em "yes"; 1974 em "nineteen" e fica ──
    var pulso = 1 + 0.05 * Math.sin(Math.PI * seg(t, T.pulso, 0.3));
    carimbo(E("yes"), t, T.yes, 1.0, pulso);
    rotulo(E("ano74"), eo(seg(t, T.ano, 0.3)));

    // ── b3–b4: as duas perguntas ──
    rotulo(E("q1"), eo(seg(t, T.q1, 0.3)));
    rotulo(E("q2"), eo(seg(t, T.q2, 0.3)));

    // ── b5: as duas estações, os anos e os valores em "Both"; os dois NO em "no," ──
    var b = eo(seg(t, T.both, 0.3));
    rotulo(E("ano78"), b); rotulo(E("v78"), b); rotulo(E("ano82"), b); rotulo(E("v82"), b);
    carimbo(E("no1"), t, T.no, 0.6);
    carimbo(E("no2"), t, T.no + 0.12, 0.6);

    // ── o crédito, a cena toda ──
    var c = E("credFonte"), opC = eo(seg(t, 0, 0.3));
    creditoSemPartir(c, TEXTOS.credFonte);   // 1974–1982 junto, na segunda linha
    c.hidden = false; c.style.opacity = opC.toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
})();
</script>
