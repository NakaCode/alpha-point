  CANAL ALPHA POINT — LOS ANGELES (vídeo 2), CENA s03 (20,733 → 48,267 s do master; 27,534 s).
  "Now look at the city's outline. To reach that water, Los Angeles runs south through a strip about half a mile wide,
  for about nine miles, between its neighbors. In nineteen oh-six, it stopped at the edge of two other cities, short of
  the water. Until nineteen oh-nine, Los Angeles had no coastline of its own. So why is Los Angeles shaped like this?
  You're at Alpha Point, and this is where the story of the strip that took Los Angeles to its port begins."
  Mapista, 07/10/2026: piloto do passo art.

  Nasceu de `preparar-cena.mjs los-angeles --molde=s03` (molde src/mapa/moldes/mapa-base.html da pré-v1, commit 7ab9543).
  O corpo segue a cena de mapa de referência do canal, a s03 do Juneau (identidade §6), com os blocos dela copiados sem
  mudança: a rede com nova tentativa, o fail-closed, o texto liso dos rótulos, a base lisa (moving: true), o estilo sem
  transição e a espera dos tiles com as duas atualizações finais.
  O que manda em cada coisa:
    · o QUE vai à tela e a grafia: out/los-angeles/textos-tela.json (s03; sha1 d9ef161097b1), lista fechada;
    · o TEMPO e o exige de cada beat: out/los-angeles/regencia.json (s03), no relógio do words.json;
    · a direção: out/los-angeles/conceito-visual.json (s03); a marca: marca/identidade.md §4–§7 e marca/tokens.css.

  O que a cena faz:
    · BASE: perfil do canal (maptiler), SEM relevo (vídeo 2 liberado sem relevo, identidade §6). Tratamento C na pintura
      da camada (r4b: brilho máx. 0,92, saturação 0, contraste 0,25; Lucas, 09/10/2026), sem véu.
    · CÂMERA em pernas presas às palavras (não o camera-mapa uniforme: a regência pede seis quadros em sequência):
      viagens de 1,1 a 2,6 s pela curva de van Wijk (a do camera-mapa.js, com rampa suave nas pontas da perna) e, entre
      elas, deriva linear lenta (aproximação e passo de lado). Por cima de tudo, um giro contínuo de −3° a +3° do
      primeiro ao último quadro: o mapa nunca para (identidade §5, "Mapa nunca fica parado"; ofício §6b).
    · TEXTO: os nove textos da s03 do textos-tela.json, nenhum outro. Quando dois têm o mesmo t0, entram um por vez, na
      palavra que os diz (ofício §9).
    · INCERTEZA DE HAMLIN, o critério do vídeo 2 (Lucas, 07/10/2026: "A câmera nunca chega tão perto que 200 m apareçam
      (na escala da cidade, é menos que a espessura da linha)"; sessão central, 07/10/2026): na aproximação máxima sobre um
      contorno de Hamlin, a incerteza declarada no lugar cabe dentro da espessura do traço, em px do 4K. Aqui tudo o que é
      de Hamlin e aparece perto fica ao sul de 33,86 N (±200 m), e o traço mais fino de Hamlin na tela é a divisa de San
      Pedro (o token da fronteira: 12 px de contorno escuro). Então, com contorno de Hamlin visível, zoom ≤ 11,90:
      65.083 m ÷ 2^11,90 = 17,0 m/px no palco (em 33,75 N), 200 m = 11,8 px ≤ 12 px. O contorno de 1906 tem 14 px (6 de
      --tinta sobre 14 de --rotulo) e o de Wilmington, 14 (5 de --contraparte sobre 14). Ao norte de 33,86 N (±50 m = 3 px)
      a conta fecha em qualquer zoom desta cena. Sem a palavra "Approximate".
    · A DIVISA DE SAN PEDRO (san-pedro-1909-divisa-hamlin) entra, linha aberta, no estilo da fronteira (tokens
      --fronteira-*): é a "boundary lines of San Pedro City as established by an election held October 22, 1906" (LA0008;
      laudo fatos-tela, X03), a linha que a faixa encontrou em 1906, e não pede linha de ano (sessão central, 07/10/2026).
      Só os trechos "oeste_e_norte_com_a_faixa" e "com_wilmington" (as linhas 0 e 1 do arquivo): o trecho
      "leste_terminal_island" (a linha 2, de 33,7729 a 33,7448 N, em −118,25) cairia dentro do quadro e fica de fora,
      pela incerteza do sudeste da folha (pauta-geo.md, "Achado que toca a 1ª rodada").
    · O ANEL COM HALO ESCURO (intencional; sessão central, 07/10/2026): o porto fica DENTRO do contorno aceso, e o anel
      de --destaque sobre o --destaque a 85 % não se lia. Cada traço do anel (o fixo e os dois pulsos) leva por baixo um
      halo --rotulo de 30 px (10 px de cada lado do traço de 10). É acréscimo de legibilidade, não outro anel: tamanho,
      traço, cor e pulso são os da identidade §4.4.
  RODADA r4 (mapista, lote M1, 08/10/2026), da revisão de espectador e do conceito r4:
    · R1.2: a câmera FICA no trecho fino (B0→B1, deriva) enquanto as cotas estão no ar; tique, comprimento e as duas cotas

      200 m em 12,1 dão 13,4 px (o critério de Hamlin, acima). O '1906' entra em 10,40 s, ainda em 'oh-six' (10,037–10,557).
    · R1.3: a pílula 'San Pedro' sai do ponto GNIS para a DIREITA (dx 60, dy 120), do lado de dentro da divisa, sobre a
      cidade e os cais (antes caía sobre Palos Verdes e o mar).
    · _anel: o anel no porto continua sem pílula; quem o nomeia é a frase 'to its port' (26,277 s), com o anel no ar.
      Nenhuma palavra 'Approximate' na tela.
  RODADA r4b (mapista, lote MA, 09/10/2026):
    · o contraste C do satélite e a água escura (agua-osm-la, --agua-base #00050c), que a s03 não tinha;

    · s03-san-pedro-sem-area, pelo reforço de San Pedro (Lucas, 09/10: "Manter a linha, com reforço"): a divisa a 9 px sobre
      18 px de 11,557 s até a pílula sair; a pílula no ar até a câmera seguir (14,45 s), no mar ao sul da costa de San Pedro,
      presa por guia curta com ponto a um lugar dentro da divisa (a terra de San Pedro tem ~70 px e não cabe a pílula).

      map.addLayer({ id: "wilm-sob", type: "line", source: "wilm", layout: linhaContorno,

      map.addSource("sanpedro", { type: "geojson", data: SANPEDRO });

        paint: { "line-color": tok("--fronteira-cor", "rgba(255,255,255,0.70)"), "line-width": CENA.sanPedro.linha,

  var fmt = function (p) { return p.x.toFixed(2) + " " + p.y.toFixed(2); };

  }

  function aplicar(t) {
    if (!mapaCarregado) return;
    map.jumpTo(cameraAt(t));

    camadas("hoje", opHoje(t));
    camadas("c1906", opJanela(t, CENA.c1906.entra, CENA.c1906.sai));
    camadas("wilm", opJanela(t, CENA.wilm.entra, CENA.wilm.sai));
    var vsp = opJanela(t, CENA.sanPedro.entra, CENA.sanPedro.sai);
    opac("sp-sob", "line-opacity", vsp); opac("sp-linha", "line-opacity", vsp);
    // r4b: a guia curta com ponto, da pílula 'San Pedro' (no mar) ao lugar dentro da divisa; entra e sai com a pílula
    var gs = E("guiaSP"), rSP = CENA.rotulos.filter(function (r) { return r.id === "rotSanPedro"; })[0];
    if (gs && rSP) {

      var pp = map.project(rSP.p), yTopo = pp.y + rSP.dy - 88 + (1 - vg) * 24;   // o topo da pílula (176 px de altura)
      // a guia desce em diagonal para leste, para longe da divisa (que chega à costa logo a oeste do ponto)
      var dG = "M " + pp.x.toFixed(2) + " " + pp.y.toFixed(2) + " L " + (pp.x + rSP.gx).toFixed(2) + " " + yTopo.toFixed(2);
      var a1 = E("guiaSPSob"), a2 = E("guiaSPSobre"), a3 = E("guiaSPPonto");
      if (a1) a1.setAttribute("d", dG); if (a2) a2.setAttribute("d", dG);

    }

    // o tique: cresce do meio para as margens, com os batentes
    var T = CENA.tique, ut = eo(seg(t, T.entra, T.dura)), gT = E("tique");
    if (gT) {
      var a = map.project(TIQUE[0]), b = map.project(TIQUE[1]), m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      var a2 = { x: m.x + (a.x - m.x) * ut, y: m.y + (a.y - m.y) * ut }, b2 = { x: m.x + (b.x - m.x) * ut, y: m.y + (b.y - m.y) * ut };

      var d = "M " + fmt(a2) + " L " + fmt(b2);

        " M " + (b.x + px).toFixed(2) + " " + (b.y + py).toFixed(2) + " L " + (b.x - px).toFixed(2) + " " + (b.y - py).toFixed(2);

    if (gC) {

      lg.style.opacity = vl.toFixed(3);
      lg.style.transform = "translateY(" + ((1 - eo(seg(t, CENA.legenda.entra, 0.3))) * 24).toFixed(1) + "px)";

    var pa = map.project(PONTO_ANEL), g = E("anel");

      g.setAttribute("opacity", eo(seg(t, CENA.anel.entra, 0.3)).toFixed(3));

        var u = (t - t0) / CENA.anel.pulso, c = E("anelPulso" + (k + 1));

  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // NUNCA lança
  };

  // da fronteira de meio nível, com os tiles que os quadros anteriores deixaram no cache, o MapLibre pode cobrir a tela
  // com dois níveis vizinhos já carregados e não sair disso sozinho. O pai borrado no lugar do filho que ainda carrega

        .filter(function (z) { return z !== null; });
