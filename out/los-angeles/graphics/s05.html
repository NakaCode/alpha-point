CANAL ALPHA POINT — LOS ANGELES (vídeo 2), CENA s05 (52,8 → 86,1 s do master; 33,3 s).
  "Los Angeles became a city in April eighteen fifty, about twenty-eight square miles around the old Plaza. From the Plaza,
  the nearest open beach is about fourteen miles away. Wilmington, where the harbor is today, is about nineteen. And the
  coast it faced had no harbor. In eighteen eighty-six, Colonel Mendell of the Army Corps of Engineers wrote that the only
  deep-water harbors in California were San Francisco and San Diego. San Pedro Bay, in between, was an open anchorage,
  exposed to the southeast and south, where the winter storms came from."
  Mapista, lote M1, 07/10/2026. Nasceu de preparar-cena.mjs los-angeles --molde=s05 (molde mapa-base.html da pré-v1,
  commit 7ab9543); o corpo comum (rede, fail-closed, base lisa, crédito montado do perfil, texto liso, espera dos tiles) é
  o do piloto s03 deste vídeo, sem mudança. Gerado por out/los-angeles/_tmp/art/lote-m1/gerar.mjs (o HTML é autocontido).

  O que manda: o QUE vai à tela e a grafia, out/los-angeles/textos-tela.json (s05; sha1 d9ef161097b1), lista fechada; o
  TEMPO e o exige, out/los-angeles/regencia.json (s05), no relógio do words.json; a direção, conceito-visual.json (s05);
  a marca, marca/identidade.md §4–§7 e marca/tokens.css.

  O que a cena faz (um palco só, a câmera anda; o mapa nunca para: giro contínuo de −2° a +2° por cima de tudo):
    · p1 (0–6,13): o quadrado de 1850 (la-1850-hamlin) com o contorno desde o 1º quadro e o preenchimento --destaque a 85 %
      em 'eighteen' (500 ms); a cota '1850 · ABOUT 28 SQ MI' em 'twenty-eight', com a linha de fonte 'Source: Los Angeles
      County annexation records' enquanto ela está no ar; em 'square' o anel na Plaza (NRHP) e a pílula 'The Plaza' fora do
      polígono, com uma guia curta, e logo abaixo dela a MINIATURA do estereograma de c. 1880 (metade esquerda do cartão,
      identidade §5 'Nome de lugar com a foto'), com 'Photo from about 1880' na margem; saem antes de 6,133 s (a janela
      do veredito: 55,8–58,933 do master).
    · p2–p3 (6,13–14,75): a câmera abre até caber a praia e Wilmington; uma régua por vez (espelho): Plaza → praia aberta
      mais próxima (TIGER, praia-aberta-mais-proxima-tiger), com 'nearest open beach' na ponta e 'ABOUT 14 MILES' em
      'fourteen'; depois Plaza → Wilmington (GNIS), com a pílula 'Wilmington' e 'ABOUT 19 MILES' em 'nineteen'. A régua é a
      linha de cota do piloto (escura, --rotulo, com batentes), com um fio claro por baixo para ler sobre a cidade: não é
      branca, porque a fronteira é a única linha branca (identidade §6).
    · p4–p5 (14,75–26,4): a câmera abre à costa do sul da Califórnia e à Califórnia inteira (california-cb500k, 1:500.000:
      só esta câmera larga), com a divisa no estilo da fronteira e o nome 'CALIFORNIA' dentro (o tratamento do nome sobre o
      mapa, §4.1); o quadrado de 1850 vira um ponto laranja; em 'San Francisco' e 'San Diego' o anel em cada porto (GNIS)
      com a pílula, e o item da legenda 'deep-water harbors, per Mendell, 1886' (o anel como amostra).
    · p6 (26,4–33,3): a câmera volta a San Pedro Bay (a cidade de 1850 no alto, terra adentro); 'San Pedro Bay' (que já entra
      na voz, em 'San' 25,74, ainda na Califórnia inteira, presa ao lugar acima e à direita, e desce com a câmera) e, em
      'southeast' e 'south', duas setas em --tensao (risco, nunca a cor de um lado) entram do mar para a baía, com o item
      'winter storms' na legenda das cores.
  INCERTEZA DE HAMLIN: só o quadrado de 1850 é de Hamlin, e ele fica todo ao norte de 33,86 N (±50 m). Traço mais fino de
  Hamlin no quadro: o contorno de 1850 (6 px de --tinta sobre 14 px de --rotulo = 14 px). Zoom máximo da cena: 12,50 (em
  34,05 N, 65.083 × cos 34,05 / cos 33,75 ÷ 2^12,5 = 11,2 m/px: 50 m = 4,5 px ≤ 14 px). Sem a palavra "Approximate".
  ELEMENTOS (identidade §4.2): p1 até 5 (polígono, cota, anel+pílula, miniatura; a guia é da pílula); p2/p3 até 6 no
  instante da troca de régua (10,3–10,85); p5 5 (CALIFORNIA, ponto de 1850, 2 anéis com pílula, legenda); p6 5.

    box.style.height = alt + "px";
    box.style.opacity = (algum * vsai).toFixed(3);
    box.style.visibility = algum * vsai > 0 ? "visible" : "hidden";
  }

  // ── os créditos: o da MapTiler inteiro desde o primeiro quadro de mapa; as linhas de fonte, empilhadas acima,
  //    entram em 300 ms com o asset ou o número e saem com ele ───────────────────────────────────────
  function aplicarCreditos(t) {
    var c = E("credito");
    if (c) { var vm = t >= (CENA.creditos.mapaDesde || 0) ? 1 : 0; c.style.opacity = vm; c.style.visibility = vm ? "visible" : "hidden"; }
    (CENA.creditos.extra || []).forEach(function (x) {
      var el = E(x.id); if (!el) return;
      var v = eo(seg(t, x.entra, 0.3)) * (x.sai != null ? 1 - eio(seg(t, x.sai, 0.3)) : 1);
      el.style.opacity = v.toFixed(3); el.style.visibility = v > 0 ? "visible" : "hidden";
    });
  }

  function aplicar(t) {
    if (!mapaCarregado) return;
    map.jumpTo(cameraAt(t));
    aplicarCena(t);
    aplicarRotulos(t);
    (CENA.minis || []).forEach(function (M) { aplicarMini(M, t); });
    aplicarLegenda(t);
    aplicarCreditos(t);
    pintarTextoLiso();
  }
  (CENA.minis || []).forEach(montarMini);
  if (window.__erroCena) return;

  window.__renderAt = function (t) {
    var tt = cl(+t || 0, 0, DUR), extra = null;
    try { aplicar(tt); if (typeof depoisDoQuadro === "function") extra = depoisDoQuadro(tt); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // NUNCA lança
    return extra && typeof extra.then === "function" ? extra.then(function () { return true; }, function () { return true; }) : undefined;
  };

  // pronto quando nenhum tile da base está carregando e os níveis à vista são no máximo dois, vizinhos (s42/s03)
  function nivelUnico() {
    try {
      if (map.getTerrain() || map.getPitch() > 1) return true;
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      var cache = sc.base; if (!cache) return true;
      var todos = cache._tiles || {};
      for (var k in todos) { var st = todos[k] && todos[k].state; if (st === "loading" || st === "reloading") return false; }
      var ids = cache.getRenderableIds ? cache.getRenderableIds() : Object.keys(todos);
      var zs = ids.map(function (id) { var x = todos[id]; return x && x.tileID && x.tileID.canonical ? x.tileID.canonical.z : null; })
        .filter(function (z) { return z !== null; });
      if (!zs.length) return false;
      return Math.max.apply(null, zs) - Math.min.apply(null, zs) <= 1;
    } catch (e) { return true; }
  }
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) {
        var ts = (sc[id] && sc[id]._tiles) || {};
        for (var k in ts) if (ts[k] && ts[k].state === "errored") return id;
      }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou (HTTP 404 ou resposta inválida). O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          // getSource antes de isSourceLoaded: este, numa fonte que ainda não existe (antes do load), dispara o evento de erro do
          // MapLibre ("There is no source with ID"), que a cena trata como erro (o medir-margens o achou na s05, 08/10)
          for (var i = 0; i < CENA.fontes.length; i++) if (!map.getSource(CENA.fontes[i]) || !map.isSourceLoaded(CENA.fontes[i])) return false;
          if (!map.getSource("base") || !map.isSourceLoaded("base")) return false;
          return nivelUnico();
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.jumpTo({ center: map.getCenter() }); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo; se repetir, confira a conexão.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});

})();
</script>
