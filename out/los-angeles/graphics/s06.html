      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));

  }

  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {

    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));

    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;

    });

    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);

<script>
(function () {

  var TEXTOS = {
    nome:  "RICHARD HENRY DANA JR.",                                                        // cards_pessoa s06 › _na_tela.nome (4 palavras: inteiro)
    cargo: "Sailor on the brig Pilgrim (1835)",                                             // cards_pessoa s06 › _na_tela.cargo
    aviso: "Portrait from 1842",                                                            // _textos_por_cena s06 › aviso_ano
    cred:  "Source: Richard Henry Dana Jr., Two Years Before the Mast (1895 edition)"       // _textos_por_cena s06 › credito (t0 4,667)
  };
  // o grifo_na_pagina s06 ("We all agreed that it was the worst place we had seen yet, especially for getting off hides")
  // é texto IMPRESSO na página, listado para conferência: a tela não o escreve, o marca-texto o varre (abaixo, GRIFO).
  // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
  E("nome").textContent = TEXTOS.nome; E("cargo").textContent = TEXTOS.cargo;
  E("aviso").textContent = TEXTOS.aviso; E("cred").textContent = TEXTOS.cred;

  // ── os tempos (locais, −86,1), do words.json e da regência s06 ──
  var T = {
    pousaRet: 0.00, pousaRetDur: 0.55,   // o retrato pousa (identidade §4.4: 0,72 → 1,03 até 0,33 s; assenta até 0,55)
    fitaRet: 0.45,                       // as fitas colam (a 2ª 120 ms depois)
    aviso: 0.70, nome: 0.70, cargo: 0.82,// 150 ms depois do assentamento; o cargo 120 ms depois do nome
    pousaPag: 4.667, pousaPagDur: 0.80,  // "and" (90,77 s): a página pousa (a folha: 0,80 s, assenta em 0,56–0,80)
    fitaPag: 5.35,
    cred: 4.667,                         // o crédito acende com a página (textos-tela: t0 4,667)
    camPara: 5.42,                       // o push-in para 0,25 s antes de "the" (5,67)
    repouso: DUR - 0.25
  };
  // o GRIFO: três pedaços presos à voz; cada pedaço é uma lista de trechos [x0, x1, y0, y1] em px do ARQUIVO (2133 × 3590),
  // medidos na grade de 100 px (out/los-angeles/_tmp/art/piloto/olhar/p109-trecho.png), varridos em ordem de leitura.
  var GRIFO = [
    { t0: 5.67, t1: 6.54, trechos: [[1386, 1770, 2130, 2184], [203, 938, 2204, 2266]] },   // "We all agreed" + "that it was the worst place" ← "the worst place"
    { t0: 6.62, t1: 7.26, trechos: [[991, 1471, 2204, 2266]] },                            // "we had seen yet,"                             ← "they had seen"
    { t0: 7.34, t1: 8.26, trechos: [[1503, 1770, 2204, 2266], [203, 800, 2280, 2340]] }    // "especially" + "for getting off hides"         ← "for loading hides"
  ];
  var K_PAG = 0.6282;   // a página: 1340 / 2133

  // ── a geometria dos grupos ──
  var RET = { w: 1020, h: 1166, cx: 830, cy: 833, rot: -1.0 };      // o cartão girado: x 302→1360, y 232→1434
  var PAG = { w: 1340, h: 1517, cx: 2900, cy: 1020, rot: 1.2 };     // a página girada: x 2198→3602, y 234→1806

  // os retângulos do grifo, criados uma vez
  var grifoEls = [];
  (function () {
    var g = E("grifos"); if (!g) return;
    GRIFO.forEach(function (p, i) {
      p.trechos.forEach(function (r, j) {
        var d = document.createElement("div"); d.className = "grifo";
        d.style.left = (r[0] * K_PAG).toFixed(1) + "px"; d.style.top = (r[2] * K_PAG).toFixed(1) + "px";
        d.style.width = ((r[1] - r[0]) * K_PAG).toFixed(1) + "px"; d.style.height = ((r[3] - r[2]) * K_PAG).toFixed(1) + "px";
        d.style.transform = "scaleX(0)";
        g.appendChild(d); grifoEls.push({ el: d, p: i, j: j, w: r[1] - r[0] });
      });
    });
  })();

  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  // o pouso da FOTO (identidade §4.4): desce 240 px em eo; escala 0,72 → 1,03 até 0,33 s e assenta 1,03 → 1,00 até 0,55 s
  function pousoFoto(t, t0, dur) {
    var p = eo(seg(t, t0, dur)), q1 = eo(seg(t, t0, 0.33)), q2 = eo(seg(t, t0 + 0.33, dur - 0.33));
    return { op: t >= t0 ? 1 : 0, dy: 240 * (1 - p), k: q2 > 0 ? lerp(1.03, 1.00, q2) : lerp(0.72, 1.03, q1), p: p };
  }
  // o pouso da FOLHA (identidade §4.4): desce 420 px em 0,80 s, girando de −1,5° a +rot, e assenta 1,03 → 1,00 em 0,56–0,80 s
  function pousoFolha(t, t0, dur) {
    var p = eo(seg(t, t0, dur)), q2 = eo(seg(t, t0 + 0.56, dur - 0.56));
    return { op: t >= t0 ? 1 : 0, dy: 420 * (1 - p), k: lerp(1.03, 1.00, q2), p: p };
  }
  // a sombra solta: no ar +64 px / 1,05 / 0,35; assentada +12 px / 1,00 / 0,80 (tokens "A mão que arruma")
  function sombra(el, g, s, rot) {
    if (!el) return;
    var sy = lerp(64, 12, s.p), sk = lerp(1.05, 1.00, s.p), so = lerp(0.35, 0.80, s.p) * s.op;
    por(el, g.cx, g.cy - s.dy + sy, g.w, g.h, rot, sk, so);
  }
  // o texto: 300 ms, opacidade + 24 px de subida (identidade §4.4)
  function texto(el, t, t0) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * 24).toFixed(1) + "px)";
  }
  function fita(el, t, t0) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    var rot = el.id === "retFe" || el.id === "pagFe" ? -5 : 4;
    el.style.transform = "translateY(" + ((1 - p) * -40).toFixed(1) + "px) rotate(" + rot + "deg) scale(" + (1 + (1 - p) * 0.08).toFixed(4) + ")";
  }
  // o objeto principal da luz: o centro do retrato em p1; da página em p2 (eb 0,6 s), 120 ms atrás
  function alvoLuz(t) {
    var u = eb(seg(t, T.pousaPag, 0.6));
    return { x: lerp(RET.cx, PAG.cx, u), y: lerp(RET.cy, PAG.cy, u) };
  }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    var cam = E("cam"), st = E("still");

    var s = 1 + 0.0024 * Math.min(t, T.camPara), dx = 6 * Math.sin(t * 0.23), dy = 4.8 * Math.sin(t * 0.17);
    if (cam) cam.style.transform = "scale(" + s.toFixed(5) + ") translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
    // o still acompanha a câmera a --mesa-satelite-paralaxe (0,6)

    var rotRet = lerp(-2, RET.rot, a.p);

    fita(E("retFe"), t, T.fitaRet); fita(E("retFd"), t, T.fitaRet + 0.12);

    texto(E("nome"), t, T.nome);
    texto(E("cargo"), t, T.cargo);

    // ── p2: a página pousa à direita; o grifo varre a passagem com a voz ──
    var b = pousoFolha(t, T.pousaPag, T.pousaPagDur);
    var rotPag = lerp(-1.5, PAG.rot, b.p);
    sombra(E("pagSombra"), PAG, b, rotPag);
    por(E("pag"), PAG.cx, PAG.cy - b.dy, PAG.w, PAG.h, rotPag, b.k, b.op);
    fita(E("pagFe"), t, T.fitaPag); fita(E("pagFd"), t, T.fitaPag + 0.12);
    GRIFO.forEach(function (p, i) {
      var f = seg(t, p.t0, p.t1 - p.t0);                  // 0 → 1 ao longo do pedaço, no tempo da voz
      var total = p.trechos.reduce(function (acc, r) { return acc + (r[1] - r[0]); }, 0), feito = f * total, acum = 0;
      grifoEls.forEach(function (ge) {
        if (ge.p !== i) return;
        var frac = clamp((feito - acum) / ge.w, 0, 1); acum += ge.w;
        ge.el.style.transform = "scaleX(" + frac.toFixed(4) + ")";
      });
    });
    // o crédito, solto na mesa, fora da câmera: acende com a página (300 ms)
    var c = E("cred"); if (c) c.style.opacity = eo(seg(t, T.cred, 0.3)).toFixed(3);
  }

    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança: uma exceção mataria a captura
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
})();
