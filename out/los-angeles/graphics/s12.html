<!--
CANAL ALPHA POINT — LOS ANGELES (vídeo 2), CENA s12 (149,2 → 171,6 s do master; 22,4 s). PICO do 2º degrau.
  "It was a jetty, a wall of timber and rock more than a mile long, from Rattlesnake Island to Deadman's Island. It closed
  the shallows between the islands, so the ebb tide, the water draining out of the estuary, had one channel left. Squeezed
  into one channel, it dug. By eighteen eighty-one, the bar had ten feet at low tide. By eighteen eighty-eight, eleven."
  Mapista, lote M1, 07/10/2026. Nasceu de preparar-cena.mjs los-angeles --molde=s12; o corpo comum é o do piloto s03 deste
  vídeo, sem mudança (gerado por out/los-angeles/_tmp/art/lote-m1/gerar.mjs; o HTML é autocontido).
  O que manda: textos-tela.json (s12; sha1 d9ef161097b1); regencia.json (s12); conceito-visual.json (s12); a marca.

  O que a cena faz (um palco só: a boca do estuário, como s07 acabou, por reaparição declarada; o mapa nunca para: giro de
  −1,5° a +1,5°, aproximação no molhe, um recuo curto para caber a boca e a volta à barra):
    · p1 (0–6,73): em 'jetty' o molhe (molhe-1871-usgs1896, o molhe como a folha do USGS de 1896 o mostra, não o projeto de
      1871) se desenha de Rattlesnake Island a Deadman's Island em --rede-cor (= --contraparte: linha que não é a
      protagonista), 18 px sobre 36 px de --rotulo; 'MORE THAN A MILE' na voz ('more', 2,67 s; até 4,40); o item da legenda das
      cores 'jetty, 1871' entra com a linha. Em 'from' a pílula 'Rattlesnake Island' e logo depois 'Deadman's Island', com
      uma guia curta até o ponto da folha de 1896, e a MINIATURA da foto de c. 1910 (de s11; veredito aprovado para s12,
      janela 153,2–155,933 do master) com 'Photo from about 1910'; saem antes de 6,733 s.
    · p2 (6,73–13,8): ESQUEMA DECLARADO sobre a água real: os rasos entre as ilhas, a leste do molhe, em hachura que se
      fecha em 'closed' ('shallows closed (schematic)'); em 'ebb' três linhas finas de vazante em --tinta (com setas) saem
      do estuário: duas param no molhe, uma desce pelo canal a oeste dele ('ebb tide (schematic)'); em 'channel' só a do
      canal fica.
    · p3 (13,8–16,63): em 'Squeezed' a linha do canal engrossa (10 → 14 px) e em 'dug' a hachura da barra se parte do
      centro para as bordas (600 ms).
    · p4 (16,63–22,4): o MEDIDOR (o mesmo de s07, no mesmo lugar) volta, com 'at low tide' (textos-tela s07: "fica com ele
      em s12 e s32"); em 'ten' a água sobe a 10 e entra '10 FT (1881)'; o '11 FT (1888)' entra em 'eighteen' de 1888
      (20,4 s), para ficar 2,0 s no ar antes do corte, e a água sobe a 11 em 'eleven'.
    A vazante, os rasos e a barra são esquema (seta e hachura apontam; não afirmam traçado: ofício §6c). Ninguém filmou a
    barra de 1880.
  INCERTEZA: o molhe e os dois pontos são as camadas CORRIGIDAS (molhe-1871-usgs1896-corrigido e
  pontos-historicos-usgs-corrigidos, ±50 m; a folha de 1896 errava ~272 m: _pesquisa/geo-folhas-usgs-relato.md). Os desenhos
  esquemáticos presos a eles (os rasos, as três vazantes e a barra) andaram o mesmo deslocamento (+0,00216° lng, +0,001667°
  lat). O traço mais fino é o molhe, 36 px no total: ±50 m cabem até ~1,39 m/px (zoom ~15,5). Zoom máximo desta cena: 13,20
  (6,9 m/px: 50 m = 7 px). Nada de Hamlin.
  ELEMENTOS: p1 até 5 (molhe, legenda, 2 pílulas, miniatura; a cota sai antes das pílulas); p2/p3 até 5; p4 5 (molhe,
  barra, medidor, 2 cotas: a legenda das cores, os rasos e a vazante saem antes do medidor).
  CRÉDITOS: '© MapTiler © OpenStreetMap contributors' a 56 px a cena toda (data-qc-credito="mapa" só nele). O conceito pede
  'Source: Chief of Engineers, 1881–1888' com os números, mas a linha não está no textos-tela (lista fechada): não vai. A
  foto é domínio público (identidade §7): sem crédito.

  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou (HTTP 404 ou resposta inválida). O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          // getSource antes de isSourceLoaded: este, numa fonte que ainda não existe (antes do load), dispara o evento de erro do
          // MapLibre ("There is no source with ID"), que a cena trata como erro (o medir-margens o achou na s05, 08/10)
          for (var i = 0; i < CENA.fontes.length; i++) if (!map.getSource(CENA.fontes[i]) || !map.isSourceLoaded(CENA.fontes[i])) return false;
          if (!map.getSource("base") || !map.isSourceLoaded("base")) return false;
          return nivelUnico();
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.jumpTo({ center: map.getCenter() }); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo; se repetir, confira a conexão.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});

})();
</script>
