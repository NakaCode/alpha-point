      dentro da faixa 12–14) — "Movimento estilizado pedido pelo editor → curvas dirigidas explicitamente, preservação dos
      contatos" (estudo-dinamica-objetos/ESTUDO.md, §8) e "Uma trajetória controlada pode ter suavização"
      (movimento-fisica.md:19). A velocidade no repouso é zero por construção (eo: a derivada 3(1−p)² é 0 em p = 1); sem
      rebote, sem balanço que não amortece ("Use limiar de repouso declarado, evitando vibração infinita",
      movimento-fisica.md:39). O conceito dizia "ease-in": um casco que desce para a sua linha de flutuação desacelera
      (o empuxo cresce com a imersão); vence a física e o repouso (roupa §5), declarado;
    · o contato é a LINHA D'ÁGUA: o casco cruza a água no lugar físico (o nível em que a parte submersa mede o calado), e a
      oclusão é a da água (a parte submersa tracejada): "oclusão certa, um executor por transformação" (roupa §5). A
      água é um reservatório parado: nenhuma onda, espuma ou respingo acrescentado ("Não acrescente espuma ou respingos
      aleatórios para disfarçar esse limite", estudo-agua-interacao/ESTUDO.md);
    · um executor por transformação: a posição do casco sai de UMA função pura de t (calado(t)) que escreve UM transform;
      o pouso do desenho, de outra; a sombra, de outra; nada depende da ordem de visita (SKILL.md, "Executar";
      movimento-fisica.md, "Entrega e inspeção");
    · a forma: "Bloqueie em caixas, cilindros e planos" e "Se só o rótulo revela o objeto, faltam características
      estruturais" (ilustracao/knowledge/ilustracao/CONSTRUCAO.md, "Silhueta, volume e perspectiva"): a seção mestra se

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 3840px; height: 2160px; overflow: hidden; background: var(--fundo); }
  #palco { position: relative; width: 3840px; height: 2160px; overflow: hidden; background: var(--fundo);
    font-family: var(--fonte); color: var(--tinta); font-weight: var(--peso-texto); -webkit-font-smoothing: antialiased; }

  /* A MESA DO VÍDEO 2 (tokens.css, "A MESA DO VÍDEO 2 EM DIANTE"): o still por baixo da câmera, 56 px além do palco */
  #still { position: absolute; left: calc(-1 * var(--mesa-satelite-margem)); top: calc(-1 * var(--mesa-satelite-margem));
    width: calc(3840px + 2 * var(--mesa-satelite-margem)); height: calc(2160px + 2 * var(--mesa-satelite-margem));
    opacity: var(--mesa-satelite-opacidade); transform-origin: 50% 50%; pointer-events: none; }
  /* a câmera (os movimentos curtos entre beats + a deriva do RIG) e a luz como véu, atrás do objeto principal */
  #cam { position: absolute; inset: 0; width: 3840px; height: 2160px; transform-origin: 50% 50%;
    background: radial-gradient(ellipse var(--mesa-luz-tamanho) at var(--luz-x, 50%) var(--luz-y, 50%),
      var(--mesa-luz-veu-centro) 0%, transparent var(--mesa-luz-meio)); }
  /* o feltro, 160 px maior que o quadro (a câmera nunca descobre a borda), a 50 % sobre o satélite */
  #mesa { position: absolute; left: -160px; top: -160px; width: 4160px; height: 2480px; pointer-events: none;
    background-image: var(--mesa-feltro); background-size: var(--mesa-feltro-tamanho); opacity: var(--mesa-satelite-feltro); }

  /* todo objeto da mesa é um GRUPO posto pelo __renderAt por translate/rotate/scale (origem no centro) */
  .grupo { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; opacity: 0; }
  /* A SOMBRA SOLTA (identidade §4.4): irmão com a silhueta do objeto, desfoque FIXO; só transform e opacity animam */
  .sombra-solta { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; opacity: 0; background: var(--tinta-escura);
    filter: blur(28px); }
  /* A PÁGINA REAL (identidade §5): o recorte do scan, de bordas retas, sem redesenho; o grifo é uma camada por cima do
     texto impresso, em --grifo-cor com multiply (o marca-texto), palavra a palavra com a voz */
  .pagina .papel { position: absolute; inset: 0; overflow: hidden; background: var(--papel); }
  .pagina .papel img { position: absolute; left: 0; top: 0; display: block; }
  .grifo { position: absolute; background: var(--grifo-cor); mix-blend-mode: multiply; transform-origin: 0 50%; }
  /* a fita, como na prancha: translúcida, dentes nas pontas, leve sombra; o tom vem do --papel */
  .fita { position: absolute; width: 440px; height: 140px; background: color-mix(in srgb, var(--papel) 62%, transparent);
    box-shadow: 0 4px 12px color-mix(in srgb, var(--tinta-escura) 18%, transparent);
    clip-path: polygon(0 8%, 4% 0, 8% 10%, 12% 0, 100% 0, 96% 12%, 100% 25%, 96% 40%, 100% 55%, 96% 70%, 100% 86%, 97% 100%, 0 100%, 4% 88%, 0 72%, 4% 56%, 0 40%, 4% 24%);
    transform-origin: 50% 50%; opacity: 0; }

  /* O DESENHO: um SVG do tamanho do palco; o grupo do desenho e o casco são postos por transform no __renderAt.
     TRAÇO DE ENGENHEIRO (identidade §5): linha --tinta de 6 px, sem preenchimento; aresta escondida tracejada e mais fina;
     a sombra é o traço grosso escuro atrás das linhas (desfoque fixo; só transform e opacity animam) */
  #desenho { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; overflow: visible; }
