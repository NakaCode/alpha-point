<!--
CANAL ALPHA POINT — LOS ANGELES (vídeo 2), CENA s14 (200,267 → 228,9 s do master; 28,633 s).
  "So that is what his never measured: not the bay, the estuary. In eighteen ninety-seven, the federal board that chose the
  harbor's site would define a deep-water harbor as one for ships drawing at least thirty feet. A ceiling of twenty feet, in
  a trade that was heading for thirty. The same letter pointed next door. San Pedro Bay, Mendell wrote, was "worthy of
  improvement," though he questioned whether an artificial harbor there was worth it, and he asked for a survey."
  Mapista, lote M1, 07/10/2026. Nasceu de preparar-cena.mjs los-angeles --molde=s14; o corpo comum é o do piloto s03 deste
  vídeo, sem mudança (gerado por out/los-angeles/_tmp/art/lote-m1/gerar.mjs; o HTML é autocontido).
  O que manda: textos-tela.json (s14; sha1 d9ef161097b1); regencia.json (s14); conceito-visual.json (s14); a marca.

  O que a cena faz (um palco só: reabre a boca do estuário de s12, por reaparição declarada, e passa à baía ao lado; o
  mapa nunca para: giro de −1,5° a +1,5°, recuo lento, a viagem e a aproximação até o corte):
    · p1 (0–5,1): em 'bay' a pílula 'San Pedro Bay' sobre o mar aberto, sem tinta (a baía não tem polígono: a pílula basta);
      em 'estuary' a pílula 'Wilmington estuary', com a guia curta até onde as folhas de 1896 põem o estuário.
    · p2 (5,1–13,17): o MEDIDOR volta à barra (o de s07 e s12), agora sem água, só com as marcas: a tracejada do teto de
      Mendell em 18 e em 20 pés, com '18 OR 20 FT AT HIGH WATER', desde 5,1 s; em 'deep-water' a marca cheia de 30 pés em
      --neutro, com 'definition of the 1897 federal board'; em 'thirty' a cota 'DEEP-WATER: AT LEAST 30 FT' (o número na
      palavra).
    · p3 (13,17–16,93): o vão entre 20 e 30 se hachura no medidor em 'heading for thirty' (linha, não tinta: o traço de
      engenheiro), sem --tensao.
    · p4 (16,93–19,2): o medidor e os rótulos saem (300 ms) e a câmera desliza 2 s para a baía ao lado.
    · p5 (19,2–28,63): em 'worthy' o cartão de papel da fala citada ('“worthy of improvement”', --papel, Inter 700 a 260 px,
      com 'Mendell, 1886' na margem) pousa sobre o mar, com o assentamento e a sombra solta da "mão que arruma"
      (identidade §4.4) e fica parado enquanto se lê; a câmera continua a aproximar por baixo dele; em 'it,' a linha de
      sondagem tracejada (--rede-cor) cruza a baía duas vezes, com 'the survey he asked for'.
  ⚠ NÃO DESENHADO, devolvido ao Claude central: o contorno esquemático do estuário e a legenda "1890s outline (schematic)"
  (o mesmo bloqueio de s07 e s10: não há a geometria do estuário de época em _media/geo/). O conceito pinta o estuário em
  --contraparte a 35 %: sem a geometria, a pílula com a guia aponta o lugar sem afirmar forma.
  A linha de sondagem é gesto declarado sobre o mar (o levantamento pedido), não traçado de feição.
  INCERTEZA: nada de Hamlin nem traço das folhas de 1896 nesta cena (a barra é o ponto esquemático de s07); o palco da boca
  fica no teto do palco (≤ 13,20). Zoom máximo: 13,20.
  ELEMENTOS: p1 2; p2 até 5 (pílula da baía, medidor, as 3 cotas; a pílula do estuário sai em 9,0); p5 até 4 (pílula da
  baía, cartão com a atribuição, sondagem, legenda). Blocos: o cartão da fala (1).
  CRÉDITO: '© MapTiler © OpenStreetMap contributors' a 56 px a cena toda (data-qc-credito="mapa" só nele). O conceito pede
  linhas 'Source: Chief of Engineers, 1888' e 'Source: Senate Doc. 18, 1897' com os números, mas elas não estão no
  textos-tela (lista fechada): não vão.
  RODADA r4 (mapista, lote M2, 08/10/2026; relato em out/los-angeles/_tmp/art-r4/m2/relato.md):
    · A ÁGUA ESCURA (identidade §6; Lucas, 08/10/2026): agua-osm-la, opaca, em --agua-base, 2ª camada do estilo(), acima do
      satélite e abaixo de tudo o que a cena desenha. O crédito não muda.
    · O medidor chega LIDO (conceito › _medidor; T370): a marca cinza de 11 pés com '11 FT (1888)' em --neutro desde 5,12;
      a marca e o rótulo cinzas saem em 13,56 (300 ms), antes de '18 OR 20 FT' entrar no mesmo lugar. Os números 10–60 já
      estavam (T386).
    · R3.3: 'definition of the 1897 federal board' entra com 'DEEP-WATER: AT LEAST 30 FT', num bloco só, em 'thirty' (12,023);
      '18 OR 20 FT AT HIGH WATER' entra em 'twenty' (13,863). As tracejadas de 18 e 20 continuam desde 5,12.
    · R3.4: a hachura 20–30 entra em 'in' (14,743) e FICA até a saída do medidor (16,63), como o conceito pede.
-->

        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo; se repetir, confira a conexão.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});

})();
</script>
