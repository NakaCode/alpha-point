      s = lerp(s, m.s, p); cx = lerp(cx, m.cx, p); cy = lerp(cy, m.cy, p);
    }
    return { s: s, cx: cx, cy: cy };
  }
  // os GRIFOS: as caixas de cada palavra impressa, em px do ARQUIVO (medidas na grade: olhar/z-p2124-prop.jpg, z-p2126-this.jpg)
  // p. 2124, linha A (y 2822→2866): "…it is proposed to construct a"; linha B (y 2870→2914): "breakwater, the position of which is indicated on the map."
  function reparte(caixas, t0, t1) {   // reparte t0→t1 entre as caixas pela largura de cada uma
    var total = caixas.reduce(function (acc, c) { return acc + (c[1] - c[0]); }, 0), acum = 0;
    return caixas.map(function (c) {
      var a = acum / total; acum += c[1] - c[0]; var b = acum / total;
      return { x0: c[0], x1: c[1], y0: c[2], y1: c[3], t0: lerp(t0, t1, a), t1: lerp(t0, t1, b) };
    });
  }
  var G1 = []
    .concat(reparte([[1110, 1140, 2822, 2866], [1165, 1195, 2822, 2866], [1225, 1420, 2822, 2866], [1455, 1505, 2822, 2866], [1540, 1760, 2822, 2866], [1790, 1812, 2822, 2866]], 2.855, 3.56))   // it is proposed to construct a ← "design for a"
    .concat(reparte([[130, 410, 2870, 2914]], 3.56, 4.14))                                                                                                                                   // breakwater, ← "breakwater,"
    .concat(reparte([[435, 500, 2870, 2914], [535, 725, 2870, 2914], [755, 800, 2870, 2914], [830, 950, 2870, 2914], [980, 1015, 2870, 2914], [1045, 1260, 2870, 2914], [1290, 1340, 2870, 2914], [1370, 1435, 2870, 2914], [1465, 1565, 2870, 2914]], 4.14, 4.50));   // the position of which is indicated on the map.
  // p. 2126 (y 1378→1426): "This project appears to be well conceived." ← a folha assentada (7,633) até 8,30, com "endorsed it."
  var G2 = reparte([[223, 313, 1378, 1426], [323, 460, 1378, 1426], [473, 627, 1378, 1426], [640, 680, 1378, 1426], [700, 743, 1378, 1426], [757, 847, 1378, 1426], [867, 1233, 1378, 1426]], 7.633, 8.30);
  var GR1 = criarGrifos("grifos1", G1, K, P1.x0, P1.y0), GR2 = criarGrifos("grifos2", G2, K, P2.x0, P2.y0);

  // os braços: o comprimento de cada linha (para o dash-offset), medido uma vez
  var LIN = {};
  ["a1", "vao", "a2", "sA1", "sA2"].forEach(function (id) {
    var l = E(id); if (!l) return;
    var dx = +l.getAttribute("x2") - +l.getAttribute("x1"), dy = +l.getAttribute("y2") - +l.getAttribute("y1");
    LIN[id] = Math.sqrt(dx * dx + dy * dy);
  });
  function desenhaLinha(id, p, tracejada) {
    var l = E(id); if (!l || LIN[id] === undefined) return;
    var L = LIN[id];
    if (tracejada) { l.style.strokeDasharray = "22 16"; l.style.strokeDashoffset = "0"; l.style.opacity = (0.55 * p).toFixed(3); }   // o vão tracejado: aparece em opacidade (o dash-offset quebraria o tracejado)
    else { l.style.strokeDasharray = L.toFixed(1) + " " + L.toFixed(1); l.style.strokeDashoffset = (L * (1 - p)).toFixed(1); }
  }
  function alvoLuz(t) {
    var u = eb(seg(t, T.pousaEsb, 0.6)), v = eb(seg(t, T.pousaP2, 0.6));
    return { x: lerp(lerp(P1.cx, ESB.cx, u), P2.cx, v), y: lerp(lerp(P1.cy, ESB.cy, u), P2.cy, v) };
  }

  function cena(t) {
    t = t + 0.0005;
    window.__tAtual = t;
    var c = cam(t); aplicarCamera(c.s, c.cx, c.cy, 1);
    var Lz = alvoLuz(t - 0.12); luz(Lz.x, Lz.y);

    // p1: a p. 2124 pousa e fica; o rótulo e a legenda entram e saem; o grifo da frase do projeto
    var a = pousoFolha(t, T.pousaP1, T.pousaDur), rot1 = lerp(-1.5, P1.rot, a.p);
    sombra(E("p1Sombra"), P1, a, rot1);
    por(E("p1"), P1.cx, P1.cy - a.dy, P1.w, P1.h, rot1, a.k, a.op);
    fita(E("p1Fe"), t, T.fitaP1); fita(E("p1Fd"), t, T.fitaP1 + 0.12);
    texto(E("data"), t, T.data, T.saiData);
    texto(E("survey"), t, T.survey, T.saiData);
    grifar(GR1, t);

    // p2: o esboço pousa; os braços se desenham; a cota e as legendas
    var d = pousoDes(t, T.pousaEsb, T.pousaEsbDur), esb = E("esb");
    if (esb) {
      esb.setAttribute("opacity", d.op);
      esb.setAttribute("transform", "translate(" + ESB.cx + "," + (ESB.cy - d.dy) + ") scale(" + d.k.toFixed(5) + ") translate(" + (-ESB.cx) + "," + (-ESB.cy) + ")");
    }
    var sy = lerp(64, 12, d.p), sk = lerp(1.05, 1.00, d.p), so = lerp(0.35, 0.80, d.p);
    var sg = E("esbSombra");
    if (sg) { sg.setAttribute("opacity", so.toFixed(3)); sg.setAttribute("transform", "translate(" + ESB.cx + "," + (ESB.cy + sy) + ") scale(" + sk.toFixed(5) + ") translate(" + (-ESB.cx) + "," + (-ESB.cy) + ")"); }
    var p1 = eo(seg(t, T.a1[0], T.a1[1] - T.a1[0])), pv = seg(t, T.vao[0], T.vao[1] - T.vao[0]), p2 = eo(seg(t, T.a2[0], T.a2[1] - T.a2[0]));
    desenhaLinha("a1", p1); desenhaLinha("sA1", p1); desenhaLinha("vao", pv, true); desenhaLinha("a2", p2); desenhaLinha("sA2", p2);
    // os tiques de B, C e D aparecem quando o traço chega a eles
    var tq = { tqA: d.op, tqB: p1 >= 0.999 ? 1 : 0, tqC: pv >= 0.999 ? 1 : 0, tqD: p2 >= 0.999 ? 1 : 0 };
    for (var k in tq) { var e = E(k); if (e) e.setAttribute("opacity", tq[k]); }
    texto(E("esboco"), t, T.esboco, T.saiEsboco);
    texto(E("cota"), t, T.cota);
    texto(E("muro"), t, T.muro);

    // p3: a p. 2126 pousa por cima da margem da p. 2124; o grifo do endosso
    var b = pousoFolha(t, T.pousaP2, T.pousaDur), rot2 = lerp(-1.5, P2.rot, b.p);
    sombra(E("p2Sombra"), P2, b, rot2);
    por(E("p2"), P2.cx, P2.cy - b.dy, P2.w, P2.h, rot2, b.k, b.op);
    fita(E("p2Fe"), t, T.fitaP2); fita(E("p2Fd"), t, T.fitaP2 + 0.12);
    grifar(GR2, t);

    var cr = E("cred"); if (cr) cr.style.opacity = eo(seg(t, T.cred, 0.3)).toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança: uma exceção mataria a captura
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
  // O GANCHO DE MEDIDA (só leitura; a prova vem do DOM, não da fórmula): os comprimentos dos braços e do vão em t, medidos pela
  // getBoundingClientRect dos tiques (os centros), em px de tela e em pés (÷ 0,17 px/pé ÷ a escala da câmera)
  window.__s15peca = function (t) {
    t = clamp(+t || 0, 0, DUR); window.__renderAt(t);
    function ctr(id) { var r = E(id).getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
    function dist(a, b) { return Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)); }
    var A = ctr("tqA"), B = ctr("tqB"), C = ctr("tqC"), D = ctr("tqD"), c = cam(t), k = 0.17 * c.s;
    return { t: t, bracoOestePx: dist(A, B), bracoOesteFt: dist(A, B) / k, vaoPx: dist(B, C), vaoFt: dist(B, C) / k,
             bracoLestePx: dist(C, D), bracoLesteFt: dist(C, D) / k, escalaCamera: c.s };
  };
})();
