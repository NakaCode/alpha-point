    var b = pousoFoto(t, T.pousaRet, T.pousaDur), rotR = lerp(-2, RET.rot, b.p);
    sombra(E("retSombra"), RET, b, rotR);
    por(E("ret"), RET.cx, RET.cy - b.dy, RET.w, RET.h, rotR, b.k, b.op);
    fita(E("retFe"), t, T.fitaRet, "e"); fita(E("retFd"), t, T.fitaRet + 0.12, "d");
    texto(E("aviso"), t, T.aviso);
    texto(E("nome"), t, T.nome);
    texto(E("cargo"), t, T.cargo);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança: uma exceção mataria a captura
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
})();
</script>
