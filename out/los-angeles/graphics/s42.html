  //    fração do token vai na opacidade) ───────────────────────────────────────────────────────────────
  var FONTES = [];
  var semTransicao = { duration: 0, delay: 0 };
  var linhaJunta = { "line-join": "round", "line-cap": "round" };
  var FR = {};
  function fonte(id, dado) { map.addSource(id, { type: "geojson", data: dado }); FONTES.push(id); }
  function poly(id, dado, o) {
    o = o || {};
    fonte(id, dado);
    FR[id] = o.fracao != null ? o.fracao : 0.85;
    map.addLayer({ id: id + "-fill", type: "fill", source: id,
      paint: { "fill-color": tok(o.cor || "--destaque", o.corFb || "#F5A524"), "fill-opacity": 0, "fill-opacity-transition": semTransicao } }, o.antes);
    map.addLayer({ id: id + "-sob", type: "line", source: id, layout: linhaJunta,
      paint: { "line-color": tok("--rotulo", "rgba(11,15,20,0.88)"), "line-width": o.sobW || 14, "line-opacity": 0, "line-opacity-transition": semTransicao } }, o.antes);
    map.addLayer({ id: id + "-linha", type: "line", source: id, layout: linhaJunta,
      paint: { "line-color": tok(o.linha || "--tinta", o.linhaFb || "#F4F1EA"), "line-width": o.linhaW || 6, "line-opacity": 0, "line-opacity-transition": semTransicao } }, o.antes);
  }
  // linha no estilo da fronteira (tokens --fronteira-*): a única linha branca do mapa
  function linhaFronteira(id, dado, antes) {
    fonte(id, dado);
    map.addLayer({ id: id + "-sob", type: "line", source: id, layout: linhaJunta,
      paint: { "line-color": tok("--fronteira-contorno-cor", "rgba(11,15,20,0.60)"), "line-width": parseFloat(tok("--fronteira-contorno-espessura", "12")),
               "line-opacity": 0, "line-opacity-transition": semTransicao } }, antes);
    map.addLayer({ id: id + "-linha", type: "line", source: id, layout: linhaJunta,
      paint: { "line-color": tok("--fronteira-cor", "rgba(255,255,255,0.70)"), "line-width": parseFloat(tok("--fronteira-espessura", "5")),
               "line-opacity": 0, "line-opacity-transition": semTransicao } }, antes);
  }
  // linha numa cor de papel, sobre o contorno escuro
  function linhaCor(id, dado, cor, corFb, w, sobW, antes, tracejo) {
    fonte(id, dado);
    map.addLayer({ id: id + "-sob", type: "line", source: id, layout: linhaJunta,
      paint: { "line-color": tok("--rotulo", "rgba(11,15,20,0.88)"), "line-width": sobW, "line-opacity": 0, "line-opacity-transition": semTransicao } }, antes);
    var pint = { "line-color": tok(cor, corFb), "line-width": w, "line-opacity": 0, "line-opacity-transition": semTransicao };
    if (tracejo) pint["line-dasharray"] = tracejo;

  var opAntes = {};
  function opac(id, prop, v) { v = +(+v).toFixed(3); var k = id + "|" + prop; if (opAntes[k] === v) return; map.setPaintProperty(id, prop, v); opAntes[k] = v; }
  function pintura(id, prop, v) { var k = id + "|" + prop; if (opAntes[k] === v) return; map.setPaintProperty(id, prop, v); opAntes[k] = v; }
  function setPoly(id, vFill, vLinha) {
    opac(id + "-fill", "fill-opacity", vFill * FR[id]);
    var vl = vLinha == null ? vFill : vLinha;
    opac(id + "-sob", "line-opacity", vl); opac(id + "-linha", "line-opacity", vl);
  }
  function setLinha(id, v) { opac(id + "-sob", "line-opacity", v); opac(id + "-linha", "line-opacity", v); }
  var dadoAntes = {};
  function setDado(id, chaveDado, dado) { if (dadoAntes[id] === chaveDado) return; map.getSource(id).setData(dado); dadoAntes[id] = chaveDado; }

  var mapaCarregado = false;
  map.on("load", function () {
    try { cenaCarregar(); } catch (e) { return falhar("não consegui desenhar as camadas: " + e.message); }
    mapaCarregado = true;
    map.once("idle", function () { if (!window.__erroCena) resolverPronto(true); });
  });

  // ── rótulos: entram em 300 ms (opacidade + 24 px de subida, ease-out) e saem em 300 ms; o pulso é um aro --tinta que
  //    cresce e some em 0,6 s em volta da pílula (sem mexer no texto: o texto fica parado enquanto se lê) ──────────
  function aro(t, pulsos) {
    var s = "";
    (pulsos || []).forEach(function (t0) {
      var u = (t - t0) / 0.6;
      if (u >= 0 && u < 1) s = "0 0 0 " + (6 + 22 * eo(u)).toFixed(1) + "px color-mix(in srgb, var(--tinta) " + Math.round((1 - u) * 85) + "%, transparent)";
    });
    return s;
  }
  function placeRotulo(r, t) {
    var el = E(r.id); if (!el) return;
    var entrada = eo(seg(t, r.entra, 0.3)) * (r.sai != null ? 1 - eio(seg(t, r.sai, 0.3)) : 1);
    var x, y;
    if (r.tela) { x = r.tela[0]; y = r.tela[1]; }
    else { var p = map.project(r.p); x = p.x; y = p.y; }
    var tx = r.lado === "direita" ? "0%" : r.lado === "esquerda" ? "-100%" : "-50%";
    var ty = r.vert === "cima" ? "-100%" : r.vert === "baixo" ? "0%" : "-50%";
    el.style.opacity = entrada.toFixed(3);
    el.style.transform = "translate(" + (x + (r.dx || 0)).toFixed(3) + "px," + (y + (r.dy || 0)).toFixed(3) + "px) translate(" + tx +
      "," + ty + ") translateY(" + ((1 - eo(seg(t, r.entra, 0.3))) * 24).toFixed(2) + "px)";
    if (r.pulsos) el.style.boxShadow = aro(t, r.pulsos);
  }
  // ── O TEXTO LISO (cabeçalho): o texto dos rótulos de classe liso, pintado em #tintaRotulos na posição exata do DOM ──
  // O Chrome põe a linha de base de todo texto reto em pixel inteiro na vertical (no HTML, no SVG e no fillText do
  // canvas); a pílula anda lisa pelo transform, e o texto não andava com ela. Aqui ele é desenhado em 4× (nesse tamanho
  // o Chrome desenha o glifo como forma, na posição exata) e reduzido em duas metades, na grade: cada pixel é a média
  // exata do bloco 4 × 4 dele
  var TL = { x4: document.createElement("canvas"), x2: document.createElement("canvas") };
  function opacidadeEfetiva(el) {
    var o = 1;
    for (var n = el; n && n.nodeType === 1; n = n.parentElement) {

  }
  function pintarTextoLiso() {
    var cv = E("tintaRotulos"); if (!cv) return;
    var g = cv.getContext("2d"), cr = cv.getBoundingClientRect(), k = cr.width / cv.width || 1;
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.clearRect(0, 0, cv.width, cv.height);
    var els = document.querySelectorAll(".rotulo.liso");
    for (var i = 0; i < els.length; i++) {
      var el = els[i], tn = el.firstChild, op = opacidadeEfetiva(el);
      if (el.childNodes.length !== 1 || !tn || tn.nodeType !== 3) { falhar("o rótulo " + el.id + " não é um texto só: o texto liso não o pintaria."); return; }

      var cs = getComputedStyle(el), fs = parseFloat(cs.fontSize), ls = parseFloat(cs.letterSpacing) || 0;
      var fonte = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
      var rg = document.createRange(); rg.selectNodeContents(el); var rr = rg.getBoundingClientRect();
      var g4 = TL.x4.getContext("2d"); g4.font = fonte; g4.letterSpacing = ls + "px";
      var m = g4.measureText(tn.data), A = m.fontBoundingBoxAscent, D = m.fontBoundingBoxDescent;
      // a linha de base: no DOM, a caixa do texto começa A acima dela
      var bx = (rr.left - cr.left) / k, by = (rr.top - cr.top) / k + A, pad = Math.ceil(fs * 0.5);
      var x0 = Math.floor(bx) - pad, y0 = Math.floor(by - A) - pad;
      var W = Math.ceil(m.width + Math.abs(ls)) + 2 * pad + 1, H = Math.ceil(A + D) + 2 * pad + 1;
      if (x0 > cv.width || y0 > cv.height || x0 + W < 0 || y0 + H < 0) continue;
      if (TL.x4.width < W * 4 || TL.x4.height < H * 4) { TL.x4.width = Math.max(TL.x4.width, W * 4); TL.x4.height = Math.max(TL.x4.height, H * 4); }
      if (TL.x2.width < W * 2 || TL.x2.height < H * 2) { TL.x2.width = Math.max(TL.x2.width, W * 2); TL.x2.height = Math.max(TL.x2.height, H * 2); }
      g4 = TL.x4.getContext("2d"); g4.setTransform(1, 0, 0, 1, 0, 0); g4.clearRect(0, 0, W * 4, H * 4);
      g4.setTransform(4, 0, 0, 4, 0, 0); g4.font = fonte; g4.letterSpacing = ls + "px"; g4.fillStyle = cs.color;
      g4.textBaseline = "alphabetic"; g4.textAlign = "left"; g4.fillText(tn.data, bx - x0, by - y0);
      var g2 = TL.x2.getContext("2d"); g2.setTransform(1, 0, 0, 1, 0, 0); g2.clearRect(0, 0, W * 2, H * 2);
      g2.imageSmoothingEnabled = true; g2.imageSmoothingQuality = "low"; g2.drawImage(TL.x4, 0, 0, W * 4, H * 4, 0, 0, W * 2, H * 2);
      g.globalAlpha = op; g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "low";

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { try { pintarTextoLiso(); } catch (e) {} });

  // ── o ANEL (identidade §4.4): 56 px, traço 10 em --destaque, dois pulsos 1 → 1,8 e 1 → 0 em 1,2 s, e para; com o halo
  //    --rotulo de 30 px por baixo de cada traço (o da s03: o anel laranja se lê sobre o laranja) ─────────────────
  var SVGNS = "http://www.w3.org/2000/svg";
  (CENA.aneis || []).forEach(function (a) {
    var ov = E("ov"), g = document.createElementNS(SVGNS, "g");
    g.setAttribute("id", a.id); g.setAttribute("class", "anel"); g.setAttribute("opacity", "0");
    function circ(cls, w) { var c = document.createElementNS(SVGNS, "circle"); c.setAttribute("cx", "0"); c.setAttribute("cy", "0"); c.setAttribute("r", "28"); c.setAttribute("stroke-width", w); if (cls) c.setAttribute("class", cls); return c; }
    for (var k = 1; k <= 2; k++) { var gp = document.createElementNS(SVGNS, "g"); gp.setAttribute("id", a.id + "P" + k); gp.setAttribute("opacity", "0"); gp.appendChild(circ("halo", 30)); gp.appendChild(circ(null, 10)); g.appendChild(gp); }
    g.appendChild(circ("halo", 30)); g.appendChild(circ(null, 10));
    ov.appendChild(g);
  });
  function aplicarAneis(t) {
    (CENA.aneis || []).forEach(function (a) {
      var g = E(a.id); if (!g) return;
      var pa = map.project(a.p);
      g.setAttribute("transform", "translate(" + pa.x.toFixed(2) + " " + pa.y.toFixed(2) + ")");
      var v = eo(seg(t, a.entra, 0.3)) * (a.sai != null ? 1 - eio(seg(t, a.sai, 0.3)) : 1);
      g.setAttribute("opacity", v.toFixed(3));
      a.pulsos.forEach(function (t0, k) {
        var u = (t - t0) / 1.2, c = E(a.id + "P" + (k + 1));
        if (!c) return;
        var vivo = u >= 0 && u < 1;
        c.setAttribute("transform", "scale(" + (1 + 0.8 * (vivo ? u : 0)).toFixed(4) + ")");
        c.setAttribute("opacity", vivo ? (1 - u).toFixed(3) : "0");
      });
    });
  }
  // as janelas de elementos fixos na tela (legenda das cores, fontes de dado): 300 ms de entrada e de saída
  function janelaEl(id, t, entra, sai, sobe) {
    var el = E(id); if (!el) return;
    var v = eo(seg(t, entra, 0.3)) * (sai != null ? 1 - eio(seg(t, sai, 0.3)) : 1);
    el.style.opacity = v.toFixed(3);
    if (sobe !== false) el.style.transform = "translateY(" + ((1 - eo(seg(t, entra, 0.3))) * 24).toFixed(1) + "px)";
  }
  var fmt = function (p) { return p.x.toFixed(2) + " " + p.y.toFixed(2); };
  function seta(a, b, tam) {   // a ponta de seta em a, apontando para longe de b
    var dx = a.x - b.x, dy = a.y - b.y, n = Math.hypot(dx, dy) || 1; dx /= n; dy /= n;
    var px = -dy, py = dx;
    return " M " + (a.x - dx * tam + px * tam * 0.6).toFixed(2) + " " + (a.y - dy * tam + py * tam * 0.6).toFixed(2) +
      " L " + fmt(a) + " L " + (a.x - dx * tam - px * tam * 0.6).toFixed(2) + " " + (a.y - dy * tam - py * tam * 0.6).toFixed(2);
  }
  // o tique de largura entre dois pontos (cresce do meio para as pontas, com os batentes)
  function tiqueD(A, B, ut) {
    var a = map.project(A), b = map.project(B), m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    var a2 = { x: m.x + (a.x - m.x) * ut, y: m.y + (a.y - m.y) * ut }, b2 = { x: m.x + (b.x - m.x) * ut, y: m.y + (b.y - m.y) * ut };
    var dx = b.x - a.x, dy = b.y - a.y, n = Math.hypot(dx, dy) || 1, px = -dy / n * 34, py = dx / n * 34;
    var d = "M " + fmt(a2) + " L " + fmt(b2);
    if (ut >= 1) d += " M " + (a.x + px).toFixed(2) + " " + (a.y + py).toFixed(2) + " L " + (a.x - px).toFixed(2) + " " + (a.y - py).toFixed(2) +
      " M " + (b.x + px).toFixed(2) + " " + (b.y + py).toFixed(2) + " L " + (b.x - px).toFixed(2) + " " + (b.y - py).toFixed(2);
    return d;
  }
  // a linha de medida que corre por uma polilinha (lnglat), com setas nas pontas
  function medidaD(pontos, uc) {
    var n2 = pontos.length - 1, alvo = uc * n2, i0 = Math.floor(alvo), f = alvo - i0, pts = [];
    for (var i = 0; i <= Math.min(i0, n2); i++) pts.push(map.project(pontos[i]));
    if (i0 < n2 && f > 0) { var p = pontos[i0], q = pontos[i0 + 1]; pts.push(map.project([p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f])); }
    if (pts.length < 2) return "";
    var d = "M " + pts.map(fmt).join(" L ") + seta(pts[0], pts[1], 40);
    if (uc >= 1) d += seta(pts[pts.length - 1], pts[pts.length - 2], 40);
    return d;
  }

  function aplicar(t) {
    if (!mapaCarregado) return;
    map.jumpTo(cameraAt(t));
    var cr = E("credito");
    if (cr && CENA.creditoMapa) cr.style.visibility = (t >= CENA.creditoMapa[0] - 1e-6 && t <= CENA.creditoMapa[1] + 1e-6) ? "visible" : "hidden";
    (CENA.fontes || []).forEach(function (f) { janelaEl(f.id, t, f.entra, f.sai, false); });
    cenaAplicar(t);
    aplicarAneis(t);
    (CENA.rotulos || []).forEach(function (r) { placeRotulo(r, t); });
    pintarTextoLiso();
  }

  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }   // NUNCA lança
  };

  // pronto quando nenhum tile da base está carregando e os níveis à vista são no máximo dois, vizinhos (o da s03)
  function nivelUnico() {
    try {
      if (map.getTerrain() || map.getPitch() > 1) return true;

    } catch (e) { return true; }
  }
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};

        var ts = (sc[id] && sc[id]._tiles) || {};
        for (var k in ts) if (ts[k] && ts[k].state === "errored") return id;
      }

    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou (HTTP 404 ou resposta inválida). O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) if (!map.isSourceLoaded(FONTES[i])) return false;
          if (!map.isSourceLoaded("base")) return false;
          return nivelUnico();
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.jumpTo({ center: map.getCenter() }); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo; se repetir, confira a conexão.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    window.__renderAt(0);
    return true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
