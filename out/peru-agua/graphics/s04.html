<!--
  CANAL ALPHA POINT — PERU (vídeo 4, peru-agua), CENA s04 (+ s05) (34,067 → 53,067 s do master; 19,0 s).
  Mapista, lote M4 da tarefa peru-agua-arte-12, 22/10/2026. Construída do zero sobre o motor da s51 (M6 da arte-1), com os remendos
  marcados "arte-12" (a duração literal; a viagem "saida" fica sem uso aqui).
  "And more than half of the water Lima stores for the dry season sits in lakes on the other side of the line. That water reaches the
  city through a single tunnel, built in the early nineteen sixties. So why do most Peruvians live on the dry side of that line?
  You're at Alpha Point, and this is where the story of Peru's water divide begins."
  O que manda: textos-tela.json (2f748bfc…) no QUE e na grafia; regencia.json (460eb6e1…, s04, 4 beats) no TEMPO e no exige; a marca.

  MAPA PLANO sobre a MapTiler (tratamento C), sem relevo; mapa seguido de mapa, uma viagem só (Lima → as lagoas → o túnel → o Peru
  inteiro); o giro contínuo de −1° a +1° do 1º ao último quadro. A LINHA (divisoria-continental-peru, as 3 feições) em --tinta 6 px
  sobre 12 px escuros, acesa do 1º ao último quadro: a mesma da s01, da s06, da s39 e da s51.
    · b0 0–5,7: Lima (o ponto do Natural Earth, 'Lima' do 1º quadro a 3,666), a linha e a serra no quadro (z 9,75); em 0,9–3,4 a
      câmera sobe a encosta e passa a linha (van Wijk, 2,5 s, cúbica) até as lagoas, no lado amazônico (z 9,9), e continua a
      aproximação lenta até 5,7 (z 10,8). Em "half" (0,566) o cartão 'STORAGE CAPACITY FOR LIMA (2007)' + 'MORE THAN HALF ·
      AMAZON SIDE' (o herói a 260 px, o piso, em 3 linhas: em 2 linhas o cartão tem 1.770 px e não cabe longe da linha e da costa)
      no alto à direita, com 'Source: SEDAPAL, 2007' na faixa, até 5,7. Em "lakes" (3,667) as 4 lagoas do OSM
      (lagoas-marcapomacocha-antacoto) acendem uma a uma, de oeste para leste, em --contraparte, SEM nome (textos-tela).
      Nenhum Mantaro, nenhum volume desenhado.
    · b1 5,7–10,533: 1,5 s (cúbica) até a crista sobre o canal e o túnel (z 11,3 → 11,42). Em "single" (7,433) o traçado do OSM
      (tunel-transandino: o canal Marcapomacocha–Cuevas e o túnel Cuevas–Milloc) se desenha em --destaque 10 px sobre 22 px
      escuros, da lagoa ao lado do Pacífico, em 1,4 s; o ANEL (56 px, traço 10, --destaque) aparece quando o traço chega ao
      cruzamento com a linha (−76,3348 / −11,5415) e pulsa duas vezes (1,2 s cada) e para. 'A SINGLE TUNNEL · EARLY 1960s' em
      "early" (8,866), o herói a 260 px em 3 linhas, com 'Sources: SENAMHI (Peru), 2016; Defensoría del Pueblo (Peru), 2025' na
      faixa, até 10,867.
    · b2 10,533–14,067: o recuo do anel ao Peru inteiro (van Wijk, 2,767 s, cúbica); o anel sai em 10,6 (300 ms); os dois lados
      entram nas cores deles (vertente-pacifico --destaque 85 %, vertente-atlantico --contraparte 35 %) e a divisa do país;
      nenhum número novo.
    · b3 14,067–19,0 (a vinheta): o Peru inteiro, a câmera recuando devagar (z 5,95 → 5,80), sem rótulo, sem anel, sem número; só o
      crédito de mapa, fora da área livre (x 1316–2556, y 640–1552; o corredor da queda; a diagonal ao canto).
  CRÉDITOS (56 px): '© MapTiler © OpenStreetMap contributors' do 1º ao último quadro (cobre o OSM das lagoas e do túnel);
  'Source: SEDAPAL, 2007' 0,566–5,7; 'Sources: SENAMHI (Peru), 2016; Defensoría del Pueblo (Peru), 2025' 8,866–10,867.
  ELEMENTOS (máx.): b0 = linha, Lima (ponto + pílula), cartão, lagoas (4); b1 = linha, lagoas, traçado + anel, cartão (4);
  b2/b3 = linha, 2 lados (3).
  CONSERTO peru-agua-arte-15 (espectador r2, mantidos[0]): o traçado do túnel (a camada 'rota', com o contorno escuro) esmaece
  de 10,6 a 10,9 s, junto com o anel; antes ficava com opacidade 1 até o fim, um resto na área livre da vinheta. Nada mais mudou.
  CONSERTO peru-agua-arte-17 (M-A, 23/10/2026; as escolhas do Lucas de 23/10 sobre a linha do tempo; regência direcao-23 4ea3b5b0,
  textos-tela texto-17 53943561):
    · A ÁGUA (identidade §2, "A água é azul, e corre"; a prova aprovada pelo Lucas às 03:1x): as 4 lagoas passam de --contraparte a
      --agua, PARADAS, com o preenchimento a 0,58 (o Lucas: 55–60 %) e o contorno --agua sobre o escuro; o traçado do canal e do
      túnel passa de --destaque a --agua, com a CORRENTEZA no ritmo de base (o bloco da referência do EO-A, copiado inteiro, com o
      adaptador do M-A ao MapLibre: a cor de cada pedaço da linha), da lagoa Marcapomacocha a Milloc (leste → oeste), a escala do
      traçado z 11,36. O anel continua --destaque (é a marca do cruzamento, não água).
    · A LARGURA DE LONGE (o acréscimo da Sala, 03:3x): abaixo do zoom 11, a água vai a 12 px sobre 24 escuros; de 11,25 para cima,
      as larguras de perto (o traçado 10/22, o contorno das lagoas 6/14); uma rampa linear entre os dois, pelo zoom da câmera, sem
      salto. As lagoas, vistas a z 9,9–10,8, ficam no piso; o traçado (z 11,3–11,42) fica nas de perto e engrossa no recuo.
    · A PERGUNTA DO GANCHO (identidade §4.1; textos-tela, papel 'pergunta'): "Why do most / Peruvians live / on the dry side?" em
      Barlow Condensed 800 a 176 px (a linha mais larga mede 1.048 px), --tinta, sem caixa, alinhada à esquerda em x 200, de y 1290
      a ~1840 (acima da faixa do crédito); entra em 11,1 (300 ms, +24 px) e começa a sair em 13,6 (300 ms, fora em 13,9).
      LIMITAÇÃO (vai à Sala): em 11,1 a câmera ainda está perto da crista (z 11,2), e o canto de baixo à esquerda é terra (o lado
      seco, que acende de 10,9 a 11,7); a costa só cruza a caixa da pergunta em ~11,85 (medido pela câmera da cena, perg04.mjs). Por
      isso a pergunta leva o tratamento do nome sobre o mapa (identidade §4.1): o contorno de 14 px em --rotulo por fora da letra
      (paint-order) e a sombra suave dos tokens, que a deixam legível sobre o laranja nesses ~0,75 s; de ~11,9 em diante ela fica
      sobre o mar escuro. Nenhum tempo de texto mudou.
    · RODADA 2 (M-A): os pedaços da linha passaram a ponta REDONDA (a reta abria fendas nas emendas e picotava os rios de várias
      partes) e só aparecem com opacidade 1; o rio de fundo escurece pela COR (misturada ao escuro do contorno, com a correnteza viva)
      e, nos esmaecimentos de entrada e saída, uma linha lisa em --agua (sem correnteza) assume só enquanto eles duram.
-->

<script>
(function () {
  "use strict";
  // ═══ A CORRENTEZA — o modelo das cenas de água do vídeo (peru-agua-arte-17; identidade §2; regência › _agua_direcao_23) ═══
  // O QUE É: um trecho MAIS CLARO da própria linha da água (--agua-luz sobre --agua) que desce no sentido da água e se repete.
  //   É a COR da linha que muda, peça a peça (a linha é desenhada em pedaços curtos, cada um com a mistura opaca das duas cores):
  //   luz na linha, nunca partícula, nunca brilho por cima, nunca alfa (pedaços com alfa somariam contas nas pontas redondas).
  // ONDE MORA A LUZ: no CHÃO, não na tela. A posição é medida em km ao longo do rio (de montante = 0 até a foz) e anda a uma
  //   velocidade em km/s; com a câmera que aproxima ou recua, a luz continua presa à água, como a linha.
  // OS PARÂMETROS são dados em px de TELA na escala de referência (zoomRef, latRef: o zoom médio da cena) e convertidos a km uma
  //   vez, por kmPorPx(). Para outra cena: troque zoomRef/latRef pelo zoom médio e a latitude dela, e escolha o ritmo.
  // O RITMO (regência › _agua_direcao_23 › correnteza[].ritmo): LENTA = o rio baixo (espaçada: trecho curto); CHEIA = o rio cheio
  //   (rápida e cheia: trecho longo); BASE = "nem o lento do rio baixo da s37 nem o rápido da cheia da s38", para as cenas sem nível
  //   dito. O período (de um começo de luz ao próximo) é o MESMO nos três ritmos: só a velocidade e o comprimento do trecho mudam,
  //   e assim a troca de ritmo no meio da cena (a s38 em "runs") não faz a luz pular.
  // FASE 2 (peru-agua-arte-17, 23/10/2026, os ajustes do Lucas tirados da prova): o --agua-luz passou a quase branco (só no
  //   tokens.css: a cena lê o token), e o trecho claro ficou mais longo para se ler no celular na linha fina do rio baixo (LENTA 280 →
  //   380 px; BASE 380 → 450; CHEIA 550 → 600). A luz continua opaca, a cor da própria linha: brilho máximo 1, sem alfa.
  var CORRENTEZA = {
    zoomRef: 13.4, latRef: -12.02,   // a escala em que os px abaixo valem (a s37/s38: o zoom médio do plano, no centro de Lima)
    periodoPx: 1100,                 // de um trecho claro ao seguinte, em px de tela na escala de referência
    LENTA: { velPx: 220, luzPx: 380 },   // px/s e px de trecho claro: o rio baixo (s37, e a s38 antes de "runs")
    BASE:  { velPx: 420, luzPx: 450 },   // o ritmo de base (as cenas sem nível dito; não usado aqui, é a referência da fase 2)
    CHEIA: { velPx: 720, luzPx: 600 },   // o rio cheio (a s38 depois de "runs")
    subida: 0.45,                    // a fração do trecho em que a luz cresce (a cauda, rio acima)
    frente: 0.15,                    // a fração final em que ela cai (a frente, rio abaixo: curta, a luz "aponta" para o mar);
                                     // no meio, a luz inteira (o patamar), para o trecho se ler numa linha fina de 6 px
    passoPx: 12                      // o tamanho máximo de cada pedaço de linha, em px de tela (a luz fica lisa, sem degrau)
  };
  // metros de chão por px de tela no MapLibre (ladrilho de 512 px), no zoom z e na latitude lat
  function kmPorPx(z, lat) { return 40075.016686 * Math.cos(lat * Math.PI / 180) / (512 * Math.pow(2, z)); }
  // a velocidade (km/s), o período (km) e o comprimento do trecho claro (fração do período) de um ritmo
  function ritmoEmKm(r) {
    var k = kmPorPx(CORRENTEZA.zoomRef, CORRENTEZA.latRef);
    return { vel: r.velPx * k, periodo: CORRENTEZA.periodoPx * k, luz: r.luzPx / CORRENTEZA.periodoPx };
  }
  // a integral de 0 a t do smoothstep que vai de 0 a 1 entre t0 e t0 + d (em segundos): quanto tempo "de cheia" já correu.
  // A posição da luz é a integral da velocidade: assim a troca de ritmo acelera a luz, nunca a teletransporta.
  function integralSuave(t, t0, d) {
    if (t <= t0) return 0;
    if (t >= t0 + d) return d / 2 + (t - t0 - d);
    var p = (t - t0) / d; return d * (p * p * p - p * p * p * p / 2);
  }
  // o brilho (0 a 1) da correnteza no km do rio, com a luz já andada S (km) e o trecho claro de fração luz do período (km):
  // a cauda cresce devagar rio acima, o meio fica aceso, e a frente cai rápido rio abaixo (a luz "aponta" para o mar)
  function brilhoCorrenteza(km, S, periodo, luz) {
    var u = (km - S) / periodo; u = u - Math.floor(u);
    if (u >= luz) return 0;
    var x = u / luz, y = Math.min(1, x / CORRENTEZA.subida, (1 - x) / CORRENTEZA.frente);
    return y * y * (3 - 2 * y);
  }
  // a cor opaca da linha com o brilho b: a mistura de --agua (b = 0) e --agua-luz (b = 1), em rgb
  function corDaAgua(cores, b) {
    var a = cores.agua, l = cores.luz;
    return "rgb(" + Math.round(a[0] + (l[0] - a[0]) * b) + "," + Math.round(a[1] + (l[1] - a[1]) * b) + "," + Math.round(a[2] + (l[2] - a[2]) * b) + ")";
  }
  function rgbDe(css) { var m = /rgba?\(([^)]*)\)/.exec(css || ""); return m ? m[1].split(",").slice(0, 3).map(Number) : [0, 0, 0]; }
  // ═══ fim do bloco da correnteza ═══
  // ═══ M-A (peru-agua-arte-17): A ÁGUA NAS CAMADAS DO MAPLIBRE — a correnteza da referência e a largura pelo zoom ═══
  // O bloco "A CORRENTEZA" (acima, copiado inteiro da referência do EO-A) dá o brilho; aqui ele vira a COR de cada pedaço de
  // uma camada de linha do MapLibre: a linha da água vai em pedaços curtos (até CORRENTEZA.passoPx de tela na escala do
  // elemento), e cada pedaço leva a propriedade "b" (o brilho), que a cor interpola de --agua (0) a --agua-luz (1). É a cor
  // opaca da própria linha: sem alfa, sem camada por cima, sem partícula. Vale igual no mapa plano e no relevo (a camada é
  // drapejada como as outras).
  // A ESCALA: cada elemento de água tem a sua (zoomRef, latRef = o zoom e a latitude em que ELE é visto), porque a mesma cena
  //   passa por escalas muito diferentes (a gota da s06 desce o Rímac a z ~10 e o Amazonas a z ~4,5); os px da referência
  //   valem na escala de cada um.
  // LONGE (zoom < 11; acréscimo da Sala, 23/10/2026): o trecho claro cobre no máximo 1/3 do rio (luz ≤ L/3, por rio), e o
  //   período é no mínimo 3 × a luz. A LARGURA: abaixo do zoom 11, o piso de 12 px de --agua sobre 24 px de escuro (o token
  //   escuro que a cena já usa sob a linha); de 11,25 para cima, as larguras de perto; entre os dois, uma rampa linear.
  var AGUA_PISO = { w: 12, sob: 24, z0: 10.75, z1: 11.25 };

    var pLin = { "line-color": tok(o.cor || "--fronteira-cor", "rgba(255,255,255,0.70)"), "line-width": o.w || 5, "line-opacity": 0, "line-opacity-transition": semTransicao };
    if (o.dash) { pLin["line-dasharray"] = o.dash; pSob["line-dasharray"] = o.dash; }
    if (o.sob !== 0) map.addLayer({ id: id + "-sob", type: "line", source: id, layout: o.cap ? { "line-join": "round", "line-cap": o.cap } : linhaContorno, paint: pSob }, antes);
    map.addLayer({ id: id + "-linha", type: "line", source: id, layout: o.cap ? { "line-join": "round", "line-cap": o.cap } : linhaContorno, paint: pLin }, antes);
  };
  var opAntes = {};
  function opac(id, prop, v) { v = +(+v).toFixed(3); var k = id + "|" + prop; if (opAntes[k] === v) return; if (map.getLayer(id)) map.setPaintProperty(id, prop, v); opAntes[k] = v; }
  API.opac = opac;
  // a opacidade de um território: v para o contorno, v × fração (× realce) para o preenchimento
  API.terr = function (id, v, fill) {
    opac(id + "-fill", "fill-opacity", (fill == null ? v * FRACAO[id] : fill));
    opac(id + "-sob", "line-opacity", v);
    opac(id + "-linha", "line-opacity", v);
  };
  API.lin = function (id, v) { if (map.getLayer(id + "-sob")) opac(id + "-sob", "line-opacity", v); opac(id + "-linha", "line-opacity", v); };
  API.fontes = FONTES;
  // linha numa cor de papel sobre o contorno escuro (a "linha" protagonista; o traço cresce por setDado)
  API.linhaCor = function (id, data, o, antes) {
    map.addSource(id, { type: "geojson", data: data }); FONTES.push(id);
    map.addLayer({ id: id + "-sob", type: "line", source: id, layout: linhaContorno,
      paint: { "line-color": tok("--rotulo", "rgba(11,15,20,0.88)"), "line-width": o.sob || 22, "line-opacity": 0, "line-opacity-transition": semTransicao } }, antes);
    map.addLayer({ id: id + "-linha", type: "line", source: id, layout: linhaContorno,
      paint: { "line-color": tok(o.cor || "--destaque", "#F5A524"), "line-width": o.w || 10, "line-opacity": 0, "line-opacity-transition": semTransicao } }, antes);
  };
  var dadoAntes = {};
  API.setDado = function (id, chaveDado, dado) { if (dadoAntes[id] === chaveDado) return; var f = map.getSource(id); if (f) f.setData(dado); dadoAntes[id] = chaveDado; };
  API.largura = function (id, w, sob) {
    var k1 = id + "-linha|w", k2 = id + "-sob|w"; w = +(+w).toFixed(2); sob = +(+sob).toFixed(2);
    if (opAntes[k1] !== w && map.getLayer(id + "-linha")) { map.setPaintProperty(id + "-linha", "line-width", w); opAntes[k1] = w; }
    if (opAntes[k2] !== sob && map.getLayer(id + "-sob")) { map.setPaintProperty(id + "-sob", "line-width", sob); opAntes[k2] = sob; }
  };


  // ── o objeto que pousa e levanta (identidade §4.4, "a mão que arruma"): a foto impressa desce 240 px, de −2° à
  //    inclinação final, escala 0,72 → 1,03 até 0,33 s e assenta em 1,00 até 0,55 s; a sombra solta (+64 → +12 px, 1,05 → 1,
  //    0,35 → 0,80); o levantar em 350 ms (1,00 → 1,04, ease-in cúbico; opacidade a zero nos últimos 200 ms) ──────────
  API.objeto = function (id, idSombra, t, o) {
    var el = E(id), sb = idSombra ? E(idSombra) : null; if (!el) return 0;
    var rot = o.rot == null ? -1.5 : o.rot, vis = 0, esc = 1, dy = 0, r = rot, sTy = 12, sEsc = 1, sOp = 0.8;
    if (t >= o.pouso) {
      var u = t - o.pouso, a = eo(u / 0.55);
      vis = cl(u / 0.2, 0, 1);
      esc = u < 0.33 ? 0.72 + 0.31 * eo(u / 0.33) : 1.03 - 0.03 * eo((u - 0.33) / 0.22);
      dy = -(o.queda == null ? 240 : o.queda) * (1 - a);   // a queda: 240 px (identidade §4.4); menos, onde a margem não deixa r = -2 + (rot + 2) * a;
      sTy = 64 - 52 * a; sEsc = 1.05 - 0.05 * a; sOp = 0.35 + 0.45 * a;
      if (o.levanta != null && t >= o.levanta) {
        var w = cl((t - o.levanta) / 0.35, 0, 1), k = w * w * w;
        esc = 1 + 0.04 * k; sTy = 12 + 52 * k; sOp = 0.8 - 0.45 * k;
        vis = 1 - cl((t - o.levanta - 0.15) / 0.2, 0, 1);
      }
    }
    var tr = "translate(" + o.x.toFixed(2) + "px," + (o.y + dy).toFixed(2) + "px) rotate(" + r.toFixed(3) + "deg) scale(" + esc.toFixed(4) + ")";
    el.style.transform = tr; el.style.opacity = vis.toFixed(3);
    if (sb) {
      sb.style.width = el.offsetWidth + "px"; sb.style.height = el.offsetHeight + "px";
      sb.style.transform = "translate(" + o.x.toFixed(2) + "px," + (o.y + dy + sTy).toFixed(2) + "px) rotate(" + r.toFixed(3) + "deg) scale(" + (esc * sEsc).toFixed(4) + ")";
      sb.style.opacity = (vis * sOp).toFixed(3);
    }
    return vis;
  };

  var mapaCarregado = false;
  map.on("load", function () {
    try { SCENE.camadas(map, API); } catch (e) { return falhar("não consegui desenhar as camadas: " + e.message); }
    mapaCarregado = true;
    map.once("idle", function () { if (!window.__erroCena) resolverPronto(true); });
  });

  // ── rótulos ancorados por projeção, em screen-space (s03) ─────────────────────────────────────────
  function placeRotulo(r, entrada, t) {
    var el = E(r.id); if (!el) return;
    var p = r.tela ? { x: r.tela[0], y: r.tela[1] } : map.project(r.p);
    if (r.mover) { var m = r.mover(t, p); p = m || p; }
    var tx = r.lado === "direita" ? "0%" : r.lado === "esquerda" ? "-100%" : "-50%";
    var ty = r.vert === "cima" ? "-100%" : r.vert === "baixo" ? "0%" : "-50%";
    el.style.opacity = entrada.toFixed(3);
    el.style.transform = "translate(" + (p.x + (r.dx || 0)).toFixed(3) + "px," + (p.y + (r.dy || 0)).toFixed(3) + "px) translate(" + tx +
      "," + ty + ") translateY(" + ((1 - Math.min(entrada, r._sub == null ? entrada : r._sub)) * 24).toFixed(2) + "px)";
  }
  API.project = function (ll) { return map.project(ll); };
  // ── O TEXTO LISO (s03): o texto dos rótulos de classe liso, pintado em #tintaRotulos na posição exata do DOM ──
  var TL = { x4: document.createElement("canvas"), x2: document.createElement("canvas") };
  function opacidadeEfetiva(el) {
    var o = 1;
    for (var n = el; n && n.nodeType === 1; n = n.parentElement) {
      var s = getComputedStyle(n);
      if (s.display === "none" || s.visibility === "hidden") return 0;
      o *= parseFloat(s.opacity);
    }
    return o;
  }
  function pintarTextoLiso() {
    var cv = E("tintaRotulos"); if (!cv) return;
    var g = cv.getContext("2d"), cr = cv.getBoundingClientRect(), k = cr.width / cv.width || 1;
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.clearRect(0, 0, cv.width, cv.height);
    var els = document.querySelectorAll(".rotulo.liso");
    for (var i = 0; i < els.length; i++) {
      var el = els[i], tn = el.firstChild, op = opacidadeEfetiva(el);
      if (el.childNodes.length !== 1 || !tn || tn.nodeType !== 3) { falhar("o rótulo " + el.id + " não é um texto só: o texto liso não o pintaria."); return; }
      if (!(op > 0) || !tn.data) continue;
      var cs = getComputedStyle(el), fs = parseFloat(cs.fontSize), ls = parseFloat(cs.letterSpacing) || 0;
      var fonte = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
      var rg = document.createRange(); rg.selectNodeContents(el); var rr = rg.getBoundingClientRect();
      var g4 = TL.x4.getContext("2d"); g4.font = fonte; g4.letterSpacing = ls + "px";
      var m = g4.measureText(tn.data), A = m.fontBoundingBoxAscent, D = m.fontBoundingBoxDescent;
      var bx = (rr.left - cr.left) / k, by = (rr.top - cr.top) / k + A, pad = Math.ceil(fs * 0.5);
      var x0 = Math.floor(bx) - pad, y0 = Math.floor(by - A) - pad;
      var W = Math.ceil(m.width + Math.abs(ls)) + 2 * pad + 1, H = Math.ceil(A + D) + 2 * pad + 1;
      if (x0 > cv.width || y0 > cv.height || x0 + W < 0 || y0 + H < 0) continue;
      if (TL.x4.width < W * 4 || TL.x4.height < H * 4) { TL.x4.width = Math.max(TL.x4.width, W * 4); TL.x4.height = Math.max(TL.x4.height, H * 4); }
      if (TL.x2.width < W * 2 || TL.x2.height < H * 2) { TL.x2.width = Math.max(TL.x2.width, W * 2); TL.x2.height = Math.max(TL.x2.height, H * 2); }
      g4 = TL.x4.getContext("2d"); g4.setTransform(1, 0, 0, 1, 0, 0); g4.clearRect(0, 0, W * 4, H * 4);
      g4.setTransform(4, 0, 0, 4, 0, 0); g4.font = fonte; g4.letterSpacing = ls + "px"; g4.fillStyle = cs.color;
      g4.textBaseline = "alphabetic"; g4.textAlign = "left"; g4.fillText(tn.data, bx - x0, by - y0);
      var g2 = TL.x2.getContext("2d"); g2.setTransform(1, 0, 0, 1, 0, 0); g2.clearRect(0, 0, W * 2, H * 2);
      g2.imageSmoothingEnabled = true; g2.imageSmoothingQuality = "low"; g2.drawImage(TL.x4, 0, 0, W * 4, H * 4, 0, 0, W * 2, H * 2);
      g.globalAlpha = op; g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "low";
      g.drawImage(TL.x2, 0, 0, W * 2, H * 2, x0, y0, W, H);
    }
    g.globalAlpha = 1;
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { try { pintarTextoLiso(); } catch (e) {} });

  // ── os créditos: o de mapa inteiro desde o 1º quadro de mapa (sem entrada); os outros entram em 300 ms e empilham
  //    acima dele, na faixa abaixo de y = 1880 ──────────────────────────────────────────────────────────
  function creditos(t) {
    var base = 52;
    (CENA.creditos || []).forEach(function (c) {
      var el = E(c.id); if (!el) return;
      var v = c.janelas ? (c.janelas.some(function (j) { return t >= j[0] && t < j[1]; }) ? 1 : 0)   // M3
        : c.mapa ? ((t >= (c.entra || 0)) && (c.sai == null || t < c.sai) ? 1 : 0) : janela(t, c.entra, c.sai);
      el.style.opacity = v.toFixed(3);
      el.style.bottom = base + "px";
      if (v > 0) base += el.offsetHeight + 10;   // M2: o crédito que não está no quadro não ocupa lugar na pilha
    });
  }

  // ── a legenda das cores (não usada nestas duas cenas; fica do motor) ──────────────────────────────
  function legendaCores(t) {
    var lg = E("legenda"); if (!lg || !CENA.legenda) return;
    var L = CENA.legenda, v = 0, sub = 1;
    (L.janelas || [[L.entra, L.sai]]).forEach(function (j) {
      var x = janela(t, j[0], j[1]);
      if (x > v) { v = x; sub = eo(seg(t, j[0], 0.3)); }
    });
    lg.style.opacity = v.toFixed(3);
    lg.style.transform = "translateY(" + ((1 - sub) * 24).toFixed(1) + "px)";
  }

  // ── os anéis (identidade §4.4): 56 px, traço de 10 em --destaque, com o halo escuro da s03; dois pulsos e para ──
  function anelQuadro(t) {
    (CENA.aneis || []).forEach(function (a) {
      var g = E(a.id); if (!g) return;
      var pa = map.project(a.p);
      g.setAttribute("transform", "translate(" + pa.x.toFixed(2) + " " + pa.y.toFixed(2) + ")");
      g.setAttribute("opacity", janela(t, a.entra, a.sai).toFixed(3));
      (a.pulsos || []).forEach(function (t0, k) {
        var u = (t - t0) / 1.2, c = E(a.id + "P" + (k + 1));
        if (!c) return;
        var vivo = u >= 0 && u < 1;
        c.setAttribute("transform", "scale(" + (1 + (a.amp || 0.8) * (vivo ? u : 0)).toFixed(4) + ")");
        c.setAttribute("opacity", vivo ? (1 - u).toFixed(3) : "0");
      });
    });
  }

  function aplicar(t) {
    if (!mapaCarregado) return;
    map.jumpTo(cameraAt(t));
    SCENE.quadro(t, API);
    (CENA.rotulos || []).forEach(function (r) {
      var v = r.op ? r.op(t) : janela(t, r.entra, r.sai, r.dIn, r.dOut);
      r._sub = r.entra != null ? eo(seg(t, r.entra, r.dIn == null ? 0.3 : r.dIn)) : 1;
      placeRotulo(r, v, t);
    });
    if (SCENE.depois) SCENE.depois(t, API);
    pintarTextoLiso();
    legendaCores(t);
    anelQuadro(t);
    creditos(t);
    if (SCENE.fim) SCENE.fim(t, API);   // M6: o que vem depois dos créditos (o escurecer da tela final)
  }

  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // NUNCA lança
  };

  // pronto quando nenhum tile da base está carregando e os níveis à vista são no máximo dois, vizinhos (s03)
  function nivelUnico() {
    try {
      if (map.getTerrain() || map.getPitch() > 1) return true;
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      var cache = sc.base; if (!cache) return true;
      var todos = cache._tiles || {};
      for (var k in todos) { var st = todos[k] && todos[k].state; if (st === "loading" || st === "reloading") return false; }
      var ids = cache.getRenderableIds ? cache.getRenderableIds() : Object.keys(todos);
      var zs = ids.map(function (id) { var x = todos[id]; return x && x.tileID && x.tileID.canonical ? x.tileID.canonical.z : null; })
        .filter(function (z) { return z !== null; });
      if (!zs.length) return false;
      return Math.max.apply(null, zs) - Math.min.apply(null, zs) <= 1;
    } catch (e) { return true; }
  }
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) {
        var ts = (sc[id] && sc[id]._tiles) || {};
        for (var k in ts) if (ts[k] && ts[k].state === "errored") return id;
      }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou (HTTP 404 ou resposta inválida). O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) if (!map.isSourceLoaded(FONTES[i])) return false;
          if (!map.isSourceLoaded("base")) return false;
          if (CENA.agua && (!map.getSource("aguaBase") || !map.isSourceLoaded("aguaBase"))) return false;
          return nivelUnico();
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.jumpTo({ center: map.getCenter() }); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo; se repetir, confira a conexão.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    window.__renderAt(0);
    return true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
</body>
