<script>
(function () {
  "use strict";
  // ═══ A CORRENTEZA — o modelo das cenas de água do vídeo (peru-agua-arte-17; identidade §2; regência › _agua_direcao_23) ═══
  // O QUE É: um trecho MAIS CLARO da própria linha da água (--agua-luz sobre --agua) que desce no sentido da água e se repete.
  //   É a COR da linha que muda, peça a peça (a linha é desenhada em pedaços curtos, cada um com a mistura opaca das duas cores):
  //   luz na linha, nunca partícula, nunca brilho por cima, nunca alfa (pedaços com alfa somariam contas nas pontas redondas).
  // ONDE MORA A LUZ: no CHÃO, não na tela. A posição é medida em km ao longo do rio (de montante = 0 até a foz) e anda a uma
  //   velocidade em km/s; com a câmera que aproxima ou recua, a luz continua presa à água, como a linha.
  // OS PARÂMETROS são dados em px de TELA na escala de referência (zoomRef, latRef: o zoom médio da cena) e convertidos a km uma
  //   vez, por kmPorPx(). Para outra cena: troque zoomRef/latRef pelo zoom médio e a latitude dela, e escolha o ritmo.
  // O RITMO (regência › _agua_direcao_23 › correnteza[].ritmo): LENTA = o rio baixo (espaçada: trecho curto); CHEIA = o rio cheio
  //   (rápida e cheia: trecho longo); BASE = "nem o lento do rio baixo da s37 nem o rápido da cheia da s38", para as cenas sem nível
  //   dito. O período (de um começo de luz ao próximo) é o MESMO nos três ritmos: só a velocidade e o comprimento do trecho mudam,
  //   e assim a troca de ritmo no meio da cena (a s38 em "runs") não faz a luz pular.
  // FASE 2 (peru-agua-arte-17, 23/10/2026, os ajustes do Lucas tirados da prova): o --agua-luz passou a quase branco (só no
  //   tokens.css: a cena lê o token), e o trecho claro ficou mais longo para se ler no celular na linha fina do rio baixo (LENTA 280 →
  //   380 px; BASE 380 → 450; CHEIA 550 → 600). A luz continua opaca, a cor da própria linha: brilho máximo 1, sem alfa.
  var CORRENTEZA = {
    zoomRef: 13.4, latRef: -12.02,   // a escala em que os px abaixo valem (a s37/s38: o zoom médio do plano, no centro de Lima)
    periodoPx: 1100,                 // de um trecho claro ao seguinte, em px de tela na escala de referência
    LENTA: { velPx: 220, luzPx: 380 },   // px/s e px de trecho claro: o rio baixo (s37, e a s38 antes de "runs")
    BASE:  { velPx: 420, luzPx: 450 },   // o ritmo de base (as cenas sem nível dito; não usado aqui, é a referência da fase 2)
    CHEIA: { velPx: 720, luzPx: 600 },   // o rio cheio (a s38 depois de "runs")
    subida: 0.45,                    // a fração do trecho em que a luz cresce (a cauda, rio acima)
    frente: 0.15,                    // a fração final em que ela cai (a frente, rio abaixo: curta, a luz "aponta" para o mar);
                                     // no meio, a luz inteira (o patamar), para o trecho se ler numa linha fina de 6 px
    passoPx: 12                      // o tamanho máximo de cada pedaço de linha, em px de tela (a luz fica lisa, sem degrau)
  };
  // metros de chão por px de tela no MapLibre (ladrilho de 512 px), no zoom z e na latitude lat
  function kmPorPx(z, lat) { return 40075.016686 * Math.cos(lat * Math.PI / 180) / (512 * Math.pow(2, z)); }
  // a velocidade (km/s), o período (km) e o comprimento do trecho claro (fração do período) de um ritmo
  function ritmoEmKm(r) {
    var k = kmPorPx(CORRENTEZA.zoomRef, CORRENTEZA.latRef);
    return { vel: r.velPx * k, periodo: CORRENTEZA.periodoPx * k, luz: r.luzPx / CORRENTEZA.periodoPx };
  }
  // a integral de 0 a t do smoothstep que vai de 0 a 1 entre t0 e t0 + d (em segundos): quanto tempo "de cheia" já correu.
  // A posição da luz é a integral da velocidade: assim a troca de ritmo acelera a luz, nunca a teletransporta.
  function integralSuave(t, t0, d) {
    if (t <= t0) return 0;
    if (t >= t0 + d) return d / 2 + (t - t0 - d);
    var p = (t - t0) / d; return d * (p * p * p - p * p * p * p / 2);
  }
  // o brilho (0 a 1) da correnteza no km do rio, com a luz já andada S (km) e o trecho claro de fração luz do período (km):
  // a cauda cresce devagar rio acima, o meio fica aceso, e a frente cai rápido rio abaixo (a luz "aponta" para o mar)
  function brilhoCorrenteza(km, S, periodo, luz) {
    var u = (km - S) / periodo; u = u - Math.floor(u);
    if (u >= luz) return 0;
    var x = u / luz, y = Math.min(1, x / CORRENTEZA.subida, (1 - x) / CORRENTEZA.frente);
    return y * y * (3 - 2 * y);
  }
  // a cor opaca da linha com o brilho b: a mistura de --agua (b = 0) e --agua-luz (b = 1), em rgb
  function corDaAgua(cores, b) {
    var a = cores.agua, l = cores.luz;
    return "rgb(" + Math.round(a[0] + (l[0] - a[0]) * b) + "," + Math.round(a[1] + (l[1] - a[1]) * b) + "," + Math.round(a[2] + (l[2] - a[2]) * b) + ")";
  }
  function rgbDe(css) { var m = /rgba?\(([^)]*)\)/.exec(css || ""); return m ? m[1].split(",").slice(0, 3).map(Number) : [0, 0, 0]; }

  ROT[0].ll = LINHA_PRINC[maisPerto(LINHA_PRINC, [-76.55, -11.05])];   // a pílula à esquerda da linha (o lado do Pacífico), ao norte da gota: à direita ela encostava na margem

  function aplicarRotulos(t) {
    ROT.forEach(function (r) {

      var vin = eo(seg(t, r.entra, 0.3)), vout = r.sai != null ? 1 - eio(seg(t, r.sai, 0.3)) : 1;
      var v = vin * vout;

  // ── a miniatura: logo abaixo da pílula 'Lake Titicaca (Puno)', borda direita alinhada; a foto só encolhe ──

  // pílula entra em 12,8. Até 12,8 ela fica parada na tela, no lugar em que a pílula estará em 12,8 (a câmera ainda volta ao sul
  // até 13,07, e o lago chega por baixo dela); de 12,8 em diante segue a pílula, presa ao mapa (contínuo em 12,8)
  var MINI = { id: "miniPuno", sob: "rotPuno", natural: [8593, 4322], recorte: [900, 50, 6800, 4232], foto: [900, 560], borda: 16, vao: 18,
    pousa: 12.1, assenta: 12.65, preso: 12.8, sai: 14.8 };
  (function montarMini(M) {
    var el = E(M.id), jan = el && el.querySelector(".janela"), im = el && el.querySelector("img");
    if (!el || !jan || !im) return falhar("a miniatura não está no palco.");
    var esc = M.foto[0] / M.recorte[2];
    if (Math.abs(M.foto[1] / M.recorte[3] - esc) > 0.01) return falhar("a miniatura distorceria a foto.");
    if (esc > 1) return falhar("a miniatura ampliaria a foto.");

  function caixaPill(r) {   // a caixa da pílula na câmera atual, sem a subida de entrada

  }
  function aplicarMini(t) {
    var el = E(MINI.id), r = rot(MINI.sob); if (!el || !r) return;

  // ── a gota e as duas metades (SVG, presas ao ponto da linha) ──
  function aplicarGota(t) {

    var vo = (t >= G.parte ? 1 : 0) * (1 - seg(t, G.oeste[0] + G.oeste[1], 0.3));

  // ── os traços: só sobre a geometria real ──

      " M " + (a.x + px).toFixed(2) + " " + (a.y + py).toFixed(2) + " L " + (a.x - px).toFixed(2) + " " + (a.y - py).toFixed(2);
    if (f >= 1) d += " M " + (b.x + px).toFixed(2) + " " + (b.y + py).toFixed(2) + " L " + (b.x - px).toFixed(2) + " " + (b.y - py).toFixed(2);
    E("reguaSob").setAttribute("d", d); E("reguaLinha").setAttribute("d", d);
    g.setAttribute("opacity", eo(seg(t, R.entra, 0.15)).toFixed(3));
    window.__regua = { a: [a.x, a.y], b: [b.x, b.y] };
  }
  // a cota fica logo acima da ponta de cima da régua, onde ela toca a linha (sem encostar nela)
  rot("rotCota").telaFn = function () {
    var a = map.project(LIMA), b = map.project(ALVO);
    return [b.x + CENA_COTA.dx, b.y + CENA_COTA.dy];
  };
  var CENA_COTA = { dx: 0, dy: -170 };   // logo acima da ponta da régua, sobre o lado amazônico: os rios do lado seco não passam ali

  function aplicarCena(t) {
    var ex = exageroAt(t);
    if (map.terrain) map.terrain.exaggeration = ex;
    map._elevationFreeze = true;
    window.__exagero = ex;
    opac("titicaca", "fill-opacity", CENA.titicaca.opacidade * eo(seg(t, CENA.titicaca.entra, 0.5)) * (1 - seg(t, CENA.titicaca.sai, 0.5)));
    opac("limaReg", "fill-opacity", CENA.limaReg.opacidade * eo(seg(t, CENA.limaReg.entra, 0.5)) * (1 - seg(t, CENA.limaReg.sai, 0.3)));
    // peru-agua-arte-8: a divisória engrossa com a inclinação (a crista deita no relevo e encurta com a distância): de 6/12 px a
    // pitch 0 até 12/20 px a 58°, pela inclinação da câmera em t (volta a 6/12 se o pitch cair)
    var fp = cl(cameraAt(t).pitch / CENA.divGrossa.pitch, 0, 1);
    opac("div", "line-width", CENA.divGrossa.linha[0] + (CENA.divGrossa.linha[1] - CENA.divGrossa.linha[0]) * fp);
    opac("div-sob", "line-width", CENA.divGrossa.sob[0] + (CENA.divGrossa.sob[1] - CENA.divGrossa.sob[0]) * fp);
    var vr = eo(seg(t, CENA.rios.entra, 0.5));

  function aplicarCreditos(t) {

      var el = E(x[0]); if (!el) return;

  };

  function tileComErro() {

      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }

    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou. O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  // pronto: os tiles da base E do relevo carregados, o terreno ligado, o mapa parado (contrato do mapista §3)
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < CENA.fontes.length; i++) if (!map.getSource(CENA.fontes[i]) || !map.isSourceLoaded(CENA.fontes[i])) return false;
          if (!map.getSource("base") || !map.isSourceLoaded("base")) return false;
          if (!map.getSource("dem") || !map.isSourceLoaded("dem") || !map.getTerrain()) return false;
          return true;
        } catch (e) { return false; }
      };
