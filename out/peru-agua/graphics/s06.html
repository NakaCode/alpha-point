CANAL ALPHA POINT — PERU (vídeo 4), CENA s06 (+s07) (53,067 → 82,167 s do master; 29,1 s). O run s06+s07, sem corte.

  side runs into rivers that reach the Amazon, and then the Atlantic. A small part of the south drains into Lake Titicaca
  instead. In Peru, the divide runs along the western range of the Andes, through the Lima region itself. From downtown
  Lima, it is less than seventy miles away. On the dry side, dozens of short, steep rivers drop from the mountains to the sea."
  Mapista, lote M1 (tarefa peru-agua-arte-1), 22/10/2026: cena NOVA, construída do zero sobre o corpo das cenas de mapa do
  vídeo 3 (zona-do-canal s08: o fail-closed, a câmera, os créditos). O que manda: textos-tela.json (s06) no QUE e na grafia;
  regencia.json (s06, com os beats de s07) no TEMPO e no exige; o conceito (s06, s07 e o fluxo) na direção; a marca
  (identidade §4–§6, tokens.css).

  A BASE: MapTiler satellite-v2 + terrain-rgb-v2 (canal.json › mapa.perfil), no tratamento C (identidade §6). O RELEVO 3D
  ligado desde o 1º quadro, a exagero 0 e câmera a pitch 0 até 'In Peru' (14,82 s); na viagem de 3 s ao Lima region a
  câmera inclina a 58° e o exagero sobe a 2,4 (relevo liberado: Lucas, 21/10/2026, 23:1x, "Sim e pode usar relevo quando
  necessário"). O centro da câmera fica congelado na cota 0 (_elevationFreeze, como a s44 do Juneau), e a textura das linhas
  sobre o relevo se refaz a cada quadro (freeRtt), para a espessura não saltar.

  A LINHA: divisoria-continental-peru (HydroBASINS v1, as 3 feições), a MESMA no vídeo inteiro, acesa do 1º ao último quadro,
  em --tinta 6 px sobre o contorno escuro da fronteira (12 px). Camada do MapLibre: deita no relevo.

  O que a cena faz (o mapa nunca para: o bearing anda do 1º ao último quadro, −2° → 62°):
    · b0 (0–2,633): o Peru central de cima, aproximação lenta; 'CONTINENTAL DIVIDE' em 'continental' (0,9).
    · b1 (2,633–6,1): a gota (traço --tinta 6 px, sem preenchimento) cai sobre a linha no ponto da linha mais perto da
      nascente do Rímac (vértice 1005, a 0,8 km dela), em 'Rain'; parte-se em duas em 'falls'; a metade oeste desce o
      Rímac real (rio-rimac, OSM) até o mar de 'drains' (4,27) a 'Pacific.' (5,07), deixando o traço em --destaque
      (o lado seco); 'PACIFIC' em 'Pacific.'.
    · b2 (6,1–11,067): a metade leste afunda no lado amazônico em 'Rain' (6,1–6,7) e os rios reais da vertente do
      Atlântico se desenham em --contraparte (amazonas-ate-o-atlantico, Natural Earth): o Ucayali (do vértice mais perto
      da gota, o 107, rio abaixo) e o Marañón (da nascente) até a confluência, e o Amazonas, mais grosso, até a foz em
      'Atlantic.' (10,05). A câmera abre ao continente em 2,5 s (6,4–8,9, cúbica, van Wijk). 'Amazon' (o rio) em 8,833;
      'ATLANTIC' em 10,033. A gota NÃO desenha caminho fora da geometria: entre a linha e os rios ela é só a gota que
      afunda (pictograma), nunca um traço (ofício §6c).
    · b3 (11,067–14,8): a câmera volta ao sul em 2 s (11,07–13,07); em 'Lake' (12,833) a bacia do Titicaca
      (vertente-titicaca) acende em --neutro a 50 % com 'LAKE TITICACA BASIN', e a miniatura do lago real (Delso, 2015;
      aprovada para esta frase) pousa sob a pílula 'Lake Titicaca (Puno)'; o crédito da foto na faixa.
    · b4 (14,8–20,433, s07): em 'In Peru' (14,82) viagem de 3 s (cúbica) do Titicaca à região de Lima, a câmera inclinando
      a 58° com o relevo subindo: a cordilheira ocidental de pé, a linha na crista. 'LIMA REGION' (departamento-lima, só o
      nome e o chão a 25 % de --neutro) de 18,733 a 20,433.
    · b5 (20,433–23,9, s07): a régua reta (--tinta 6 px, traço de engenheiro, com as duas pontas) sobe de Lima
      (pontos-fontes › campo-de-marte) ao ponto da linha mais perto dela (−76,3492 / −11,5410; 95,6 km = 59,4 mi pelo
      cálculo desta cena; a pauta mediu 59,5) de 'From' a 21,9; 'LESS THAN 70 MILES' em 'seventy' (22,3), ao lado da régua,
      e o crédito 'Straight line, measured by Alpha Point'. A régua sozinha: nenhuma sobreposição de escala (Sala, decisão 4).
    · b6 (23,9–29,1, s07): em 'dozens' (25,0) os rios curtos da vertente do Pacífico (rios-vertente-pacifico, OSM) acendem
      em --destaque em 500 ms, o Rímac mais grosso com o nome. Nenhuma viagem entre 'seventy' e 'dozens': só a órbita.
  ELEMENTOS (teto 6): b0 = linha + pílula (2); b1 = linha, gota/traço (1), CONTINENTAL DIVIDE, PACIFIC (4); b2 = linha,
  traços (1), PACIFIC, Amazon, ATLANTIC (5); b3 = linha, bacia, 2 pílulas, miniatura (5); b4 = linha, região + nome (3);
  b5/b6 = linha, régua, Lima, a cota, os rios, Rímac (6, de 25,0 ao fim; o Rímac é rio da mesma camada).

  // ── a gota e as duas metades (SVG, presas ao ponto da linha) ──

  // ── os traços: só sobre a geometria real ──
  var ultimo = {};

    var fa = seg(t, T.amazonas[0], T.amazonas[1]); fa = fa * fa * (3 - 2 * fa) * 0.5 + fa * 0.5;

  // ── a régua: de Lima ao ponto da linha, reta na tela, com as duas pontas ──
  function aplicarRegua(t) {
    var R = CENA.regua, g = E("regua"); if (!g) return;
    var f = eio(seg(t, R.entra, R.sobe));
    if (f <= 0) { g.setAttribute("opacity", "0"); return; }
    var a = map.project(LIMA), b = map.project(ALVO);
    var x = a.x + (b.x - a.x) * f, y = a.y + (b.y - a.y) * f;

          if (!map.getSource("base") || !map.isSourceLoaded("base")) return false;
