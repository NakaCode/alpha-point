<script>
(function () {
  "use strict";
  // ═══ A CORRENTEZA — o modelo das cenas de água do vídeo (peru-agua-arte-17; identidade §2; regência › _agua_direcao_23) ═══
  // O QUE É: um trecho MAIS CLARO da própria linha da água (--agua-luz sobre --agua) que desce no sentido da água e se repete.
  //   É a COR da linha que muda, peça a peça (a linha é desenhada em pedaços curtos, cada um com a mistura opaca das duas cores):
  //   luz na linha, nunca partícula, nunca brilho por cima, nunca alfa (pedaços com alfa somariam contas nas pontas redondas).
  // ONDE MORA A LUZ: no CHÃO, não na tela. A posição é medida em km ao longo do rio (de montante = 0 até a foz) e anda a uma
  //   velocidade em km/s; com a câmera que aproxima ou recua, a luz continua presa à água, como a linha.
  // OS PARÂMETROS são dados em px de TELA na escala de referência (zoomRef, latRef: o zoom médio da cena) e convertidos a km uma
  //   vez, por kmPorPx(). Para outra cena: troque zoomRef/latRef pelo zoom médio e a latitude dela, e escolha o ritmo.
  // O RITMO (regência › _agua_direcao_23 › correnteza[].ritmo): LENTA = o rio baixo (espaçada: trecho curto); CHEIA = o rio cheio
  //   (rápida e cheia: trecho longo); BASE = "nem o lento do rio baixo da s37 nem o rápido da cheia da s38", para as cenas sem nível
  //   dito. O período (de um começo de luz ao próximo) é o MESMO nos três ritmos: só a velocidade e o comprimento do trecho mudam,
  //   e assim a troca de ritmo no meio da cena (a s38 em "runs") não faz a luz pular.
  // FASE 2 (peru-agua-arte-17, 23/10/2026, os ajustes do Lucas tirados da prova): o --agua-luz passou a quase branco (só no
  //   tokens.css: a cena lê o token), e o trecho claro ficou mais longo para se ler no celular na linha fina do rio baixo (LENTA 280 →
  //   380 px; BASE 380 → 450; CHEIA 550 → 600). A luz continua opaca, a cor da própria linha: brilho máximo 1, sem alfa.
  var CORRENTEZA = {
    zoomRef: 13.4, latRef: -12.02,   // a escala em que os px abaixo valem (a s37/s38: o zoom médio do plano, no centro de Lima)
    periodoPx: 1100,                 // de um trecho claro ao seguinte, em px de tela na escala de referência
    LENTA: { velPx: 220, luzPx: 380 },   // px/s e px de trecho claro: o rio baixo (s37, e a s38 antes de "runs")
    BASE:  { velPx: 420, luzPx: 450 },   // o ritmo de base (as cenas sem nível dito; não usado aqui, é a referência da fase 2)
    CHEIA: { velPx: 720, luzPx: 600 },   // o rio cheio (a s38 depois de "runs")
    subida: 0.45,                    // a fração do trecho em que a luz cresce (a cauda, rio acima)
    frente: 0.15,                    // a fração final em que ela cai (a frente, rio abaixo: curta, a luz "aponta" para o mar);
                                     // no meio, a luz inteira (o patamar), para o trecho se ler numa linha fina de 6 px
    passoPx: 12                      // o tamanho máximo de cada pedaço de linha, em px de tela (a luz fica lisa, sem degrau)
  };
  // metros de chão por px de tela no MapLibre (ladrilho de 512 px), no zoom z e na latitude lat
  function kmPorPx(z, lat) { return 40075.016686 * Math.cos(lat * Math.PI / 180) / (512 * Math.pow(2, z)); }
  // a velocidade (km/s), o período (km) e o comprimento do trecho claro (fração do período) de um ritmo
  function ritmoEmKm(r) {
    var k = kmPorPx(CORRENTEZA.zoomRef, CORRENTEZA.latRef);
    return { vel: r.velPx * k, periodo: CORRENTEZA.periodoPx * k, luz: r.luzPx / CORRENTEZA.periodoPx };
  }
  // a integral de 0 a t do smoothstep que vai de 0 a 1 entre t0 e t0 + d (em segundos): quanto tempo "de cheia" já correu.
  // A posição da luz é a integral da velocidade: assim a troca de ritmo acelera a luz, nunca a teletransporta.
  function integralSuave(t, t0, d) {
    if (t <= t0) return 0;
    if (t >= t0 + d) return d / 2 + (t - t0 - d);
    var p = (t - t0) / d; return d * (p * p * p - p * p * p * p / 2);
  }
  // o brilho (0 a 1) da correnteza no km do rio, com a luz já andada S (km) e o trecho claro de fração luz do período (km):
  // a cauda cresce devagar rio acima, o meio fica aceso, e a frente cai rápido rio abaixo (a luz "aponta" para o mar)
  function brilhoCorrenteza(km, S, periodo, luz) {
    var u = (km - S) / periodo; u = u - Math.floor(u);
    if (u >= luz) return 0;
    var x = u / luz, y = Math.min(1, x / CORRENTEZA.subida, (1 - x) / CORRENTEZA.frente);
    return y * y * (3 - 2 * y);
  }
  // a cor opaca da linha com o brilho b: a mistura de --agua (b = 0) e --agua-luz (b = 1), em rgb
  function corDaAgua(cores, b) {
    var a = cores.agua, l = cores.luz;
    return "rgb(" + Math.round(a[0] + (l[0] - a[0]) * b) + "," + Math.round(a[1] + (l[1] - a[1]) * b) + "," + Math.round(a[2] + (l[2] - a[2]) * b) + ")";
  }
  function rgbDe(css) { var m = /rgba?\(([^)]*)\)/.exec(css || ""); return m ? m[1].split(",").slice(0, 3).map(Number) : [0, 0, 0]; }
  // ═══ fim do bloco da correnteza ═══
  // ═══ M-A (peru-agua-arte-17): A ÁGUA NAS CAMADAS DO MAPLIBRE — a correnteza da referência e a largura pelo zoom ═══
  // O bloco "A CORRENTEZA" (acima, copiado inteiro da referência do EO-A) dá o brilho; aqui ele vira a COR de cada pedaço de
  // uma camada de linha do MapLibre: a linha da água vai em pedaços curtos (até CORRENTEZA.passoPx de tela na escala do
  // elemento), e cada pedaço leva a propriedade "b" (o brilho), que a cor interpola de --agua (0) a --agua-luz (1). É a cor
  // opaca da própria linha: sem alfa, sem camada por cima, sem partícula. Vale igual no mapa plano e no relevo (a camada é
  // drapejada como as outras).
  // A ESCALA: cada elemento de água tem a sua (zoomRef, latRef = o zoom e a latitude em que ELE é visto), porque a mesma cena
  //   passa por escalas muito diferentes (a gota da s06 desce o Rímac a z ~10 e o Amazonas a z ~4,5); os px da referência
  //   valem na escala de cada um.
  // LONGE (zoom < 11; acréscimo da Sala, 23/10/2026): o trecho claro cobre no máximo 1/3 do rio (luz ≤ L/3, por rio), e o
  //   período é no mínimo 3 × a luz. A LARGURA: abaixo do zoom 11, o piso de 12 px de --agua sobre 24 px de escuro (o token
  //   escuro que a cena já usa sob a linha); de 11,25 para cima, as larguras de perto; entre os dois, uma rampa linear.
  var AGUA_PISO = { w: 12, sob: 24, z0: 10.75, z1: 11.25 };
  function aguaLargura(perto, piso) {
    var lo = Math.max(perto, piso);
    return lo === perto ? perto : ["interpolate", ["linear"], ["zoom"], AGUA_PISO.z0, lo, AGUA_PISO.z1, perto];
  }
  function aguaKm(a, b) {
    var R = 6371.0088, f1 = a[1] * Math.PI / 180, f2 = b[1] * Math.PI / 180, df = f2 - f1, dl = (b[0] - a[0]) * Math.PI / 180;
    var h = Math.sin(df / 2) * Math.sin(df / 2) + Math.cos(f1) * Math.cos(f2) * Math.sin(dl / 2) * Math.sin(dl / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  // rios: lista de linhas ([lng, lat], ...), cada uma JÁ no sentido da água (de montante à foz).
  // o: { ritmo: "BASE" | "LENTA" | "CHEIA", zoomRef, latRef, longe: bool, T0: o tempo em que a 1ª luz sai da nascente,
  //      fase: bool (rios de uma mesma camada saem defasados, para não correrem em uníssono) }
  function aguaCriar(rios, o) {
    var R = CORRENTEZA[o.ritmo || "BASE"], k = kmPorPx(o.zoomRef, o.latRef), passo = CORRENTEZA.passoPx * k;
    var obj = { o: o, vel: R.velPx * k, rios: [], pecas: [] };
    rios.forEach(function (c, i) {
      if (!c || c.length < 2) return;
      var acc = [0];
      for (var j = 1; j < c.length; j++) acc.push(acc[j - 1] + aguaKm(c[j - 1], c[j]));
      var L = acc[acc.length - 1], luz = R.luzPx * k, per = CORRENTEZA.periodoPx * k;
      // longe: o período do rio é L / n (n trechos inteiros cabem nele, cada um ≥ max(período, 3 × luz)), e assim nenhuma janela
      // do rio inteiro tem mais que 1/3 de luz, seja qual for a fase
      if (o.longe) { luz = Math.min(luz, L / 3); per = L / Math.max(1, Math.floor(L / Math.max(per, 3 * luz))); }
      var ri = { i: i, c: c, acc: acc, L: L, luz: luz, per: per, fase: o.fase ? ((i * 0.6180339887) % 1) * per : 0, kc: 0 };
      obj.rios.push(ri);
      var n = Math.max(1, Math.ceil(L / passo));
      for (var p = 0; p < n; p++) obj.pecas.push({ r: ri, k0: L * p / n, k1: L * (p + 1) / n });

    var u = cl((t - L.t0) / (L.t1 - L.t0), 0, 1), a = PT[L.de], b = PT[L.para];
    var ma = merc(a.lng, a.lat), mb = merc(b.lng, b.lat);
    return { center: [a.lng + (b.lng - a.lng) * u, unmercLat(ma[1] + (mb[1] - ma[1]) * u)], zoom: a.zoom + (b.zoom - a.zoom) * u,
      bearing: a.bearing + (b.bearing - a.bearing) * u, pitch: a.pitch + (b.pitch - a.pitch) * u };
  }
  window.__cameraAt = cameraAt;
  var exageroAt = function (t) { return CENA.exag * (1 - eio(seg(t, CENA.pernas[0].t0, CENA.pernas[0].t1 - CENA.pernas[0].t0))); };

  var c0 = cameraAt(0);
  var map;
  try {
    map = new maplibregl.Map({
      container: "map", interactive: false, preserveDrawingBuffer: true, fadeDuration: 0,
      maxTileCacheSize: 4096, attributionControl: false, maxPitch: 85, transformRequest: pelaRegie,
      style: estilo(), center: c0.center, zoom: c0.zoom, bearing: c0.bearing, pitch: c0.pitch
    });
  } catch (e) {
    return falhar("o MapLibre não subiu (" + (e && e.message) + "). Sem WebGL no navegador não há mapa.");
  }
  window.map = map;
  // A BASE ANDA LISA (s03 do Juneau; = s06): toda pintura vai como "em movimento"
  (function () {
    var pt = map.painter, pintar = pt && pt.render;
    if (typeof pintar !== "function") return falhar("o MapLibre desta cena não tem painter.render: a base andaria em degraus de 1 px.");
    pt.render = function (estiloMapa, opcoes) { return pintar.call(this, estiloMapa, Object.assign({}, opcoes, { moving: true })); };
  })();

  // ── FAIL-CLOSED: tile que não chega é ERRO, não quadro preto (molde) ─────────────────────────────
  window.__errosMapa = 0;
  function motivoRede(err, msg) {
    var st = err.status, n = err.tentativas > 1 ? " (" + err.tentativas + " tentativas)" : "";
    if (err.falha === "corrompido" || /could not be decoded|could not load image|tile corrompido/i.test(msg))
      return "mandou tile CORROMPIDO" + n + " (" + String(msg).replace(/^tile corrompido: /, "") + "). Renderize de novo.";
    if (err.falha === "tempo") return "não respondeu em " + PRAZO_TENTATIVA / 1000 + " s" + n + ". Renderize de novo.";
    if (st === 401 || st === 403) return "recusou o acesso (HTTP " + st + "). Confira a chave " + (P.credencial || "") + " e o plano do dono.";
    if (st === 429) return "limitou as requisições (HTTP 429)" + n + ". Espere e renderize de novo.";
    if (st >= 500) return "está com erro no servidor (HTTP " + st + ")" + n + ". Tente de novo mais tarde.";
    if (st) return "respondeu HTTP " + st + ".";
    return "não respondeu (sem internet? servidor fora do ar? firewall?)" + n + ".";
  }
  var mapaCarregado = false;
  map.on("error", function (ev) {
    window.__errosMapa++;
    var err = (ev && ev.error) || {};
    var msg = String(err.message || "");
    var deRede = err.status || err.url || (ev && ev.tile) || /fetch|network|failed to load|load failed|cors/i.test(msg);
    if (!deRede) return falhar("o MapLibre acusou erro na cena: " + (msg || "sem descrição") + ".");
    var fonte = ev && ev.sourceId ? " (fonte '" + ev.sourceId + "')" : (mapaCarregado ? "" : " (o estilo do mapa)");
    falhar("a base '" + P.nome + "'" + fonte + " " + motivoRede(err, msg) + (err.url ? " URL: " + String(err.url).split("?")[0] : ""));
  });
  map.on("load", function () {
    try { map.setTerrain({ source: "dem", exaggeration: exageroAt(0) }); } catch (e) { return falhar("não consegui ligar o relevo: " + e.message); }
    mapaCarregado = true;
    map.once("idle", function () { if (!window.__erroCena) resolverPronto(true); });
  });

  // ── rótulos: âncora no mapa (lnglat) ou na tela; entram em 300 ms (opacidade + 24 px de subida); os do mapa saem no corte ──
  var ROT = [
    { id: "rotLoreto",  ll: [-75.40, -3.50], entra: 4.867, sai: CENA.corte },          // dentro do polígono, longe da borda e do Amazonas (52 px no pior lado)
    { id: "rotCota",    tela: [3580, 220], lado: "esquerda", vert: "topo", entra: 7.866, sai: CENA.corte },   // no alto, sobre a mata sem rio
    { id: "legCota",    sob: "rotCota", lado: "esquerda", entra: 7.866, sai: CENA.corte },
    { id: "rotIquitos", tela: null, lado: "direita", entra: 10.667, sai: null }          // sobre o rio, à direita da cidade (o clipe)
  ];
  // o 'Iquitos' acompanha a cidade no clipe (a câmera do drone sobe: a cidade desce ~22 px por segundo no quadro 4K, medido nos quadros
  // de 6,8, 9,5 e 12,1 s do clipe)
  ROT[3].telaFn = function (t) { return [1500, 650 + (tClipe(t) - 6.8) * 22.6]; };
  function rot(id) { return ROT.filter(function (r) { return r.id === id; })[0]; }
  function naArea(l, tp, w, h) {   // distância (px) da caixa à área segura; o canto 400 × 400 conta (= s06)
    var r = l + w, b = tp + h;
    return Math.min(l - 200, 3640 - r, tp - 160, 1880 - b, Math.max(3440 - r, 1760 - b));
  }
  function aplicarRotulos(t) {
    ROT.forEach(function (r) {
      var el = E(r.id); if (!el) return;
      var vin = eo(seg(t, r.entra, 0.3)), vout = r.sai != null ? (t >= r.sai ? 0 : 1) : 1;   // os do mapa saem no corte seco
      var v = vin * vout;
      if (v <= 0) { el.style.opacity = "0"; el.style.visibility = "hidden"; r._v = 0; return; }
      var x, y, w = el.offsetWidth, h = el.offsetHeight, fx = r.lado === "direita" ? 0 : r.lado === "esquerda" ? 1 : 0.5, l, tp;
      if (r.sob) {   // a legenda logo abaixo da cota, alinhada à direita dela
        var c = rot(r.sob); if (!c || c._l == null) return;
        l = c._l + c._w - w; tp = c._t + c._h + 16;
      } else {
        if (r.telaFn) { var tf = r.telaFn(t); x = tf[0]; y = tf[1]; }
        else if (r.tela) { x = r.tela[0]; y = r.tela[1]; }
        else { var p = map.project(r.ll); x = p.x; y = p.y; }
        l = x - w * fx; tp = (r.vert === "topo" ? y : y - h / 2) + (1 - vin) * 24;
      }
      v *= cl(naArea(l, tp, w, h) / 60, 0, 1);
      el.style.opacity = v.toFixed(3);
      el.style.visibility = v > 0 ? "visible" : "hidden";
      el.style.transform = "translate(" + l.toFixed(2) + "px," + tp.toFixed(2) + "px)";
      r._v = v; r._l = l; r._t = tp; r._w = w; r._h = h;
    });
  }

  // ── as silhuetas: traço do canal (--tinta 6 px, sem preenchimento; a figura da s30), UM grupo de 6, espalhado por Loreto
  //    (pés presos ao mapa); pousam uma a uma: descem 48 px e amortecem ──
  var FIG = [   // os pés (lng, lat), longe da borda, do Amazonas e da pílula (conta desta cena, câmera do b1)
    [-74.307, -5.330], [-74.856, -2.426], [-76.614, -5.057], [-73.923, -6.260], [-75.790, -5.768], [-74.856, -6.805]
  ];
  var NS = "http://www.w3.org/2000/svg";
  (function () {
    var g = E("figs"); if (!g) return falhar("as silhuetas não estão no palco.");
    FIG.forEach(function (f, i) {
      var gr = document.createElementNS(NS, "g"); gr.setAttribute("id", "fig" + i); gr.setAttribute("opacity", "0");
      ["tr-sob", "tr"].forEach(function (k) {
        var pth = document.createElementNS(NS, "path"); pth.setAttribute("class", k); gr.appendChild(pth);
        var c = document.createElementNS(NS, "circle"); c.setAttribute("class", k); gr.appendChild(c);
      });
      g.appendChild(gr);
    });
  })();
  function corpo(s) {   // pés em (0,0); a figura da s30 em escala s (o traço continua 6 px)
    var q = function (v) { return (v * s).toFixed(1); };
    return "M0," + q(-168) + " L0," + q(-80) + " M" + q(-40) + "," + q(-102) + " L0," + q(-144) + " L" + q(40) + "," + q(-102) +
      " M" + q(-30) + ",0 L0," + q(-80) + " L" + q(30) + ",0";
  }
  function aplicarFiguras(t) {
    var F = CENA.figuras, d = corpo(F.esc), on = t < CENA.corte;
    FIG.forEach(function (f, i) {
      var gr = E("fig" + i); if (!gr) return;
      var u = seg(t, F.entra + F.passo * i, F.dura), v = on ? eo(seg(t, F.entra + F.passo * i, 0.2)) : 0;
      var p = map.project(f), y = p.y - 48 * (1 - eo(u));
      gr.setAttribute("opacity", v.toFixed(3));
      gr.setAttribute("transform", "translate(" + p.x.toFixed(2) + " " + y.toFixed(2) + ")");
      var ps = gr.querySelectorAll("path"), cs = gr.querySelectorAll("circle");
      for (var j = 0; j < ps.length; j++) ps[j].setAttribute("d", d);
      for (j = 0; j < cs.length; j++) { cs[j].setAttribute("cx", "0"); cs[j].setAttribute("cy", (-196 * F.esc).toFixed(1)); cs[j].setAttribute("r", (24 * F.esc).toFixed(1)); }
    });
  }

  var ultimo = {};
  function dados(id, fc, k) { if (ultimo[id] === k) return; var s = map.getSource(id); if (s) s.setData(fc); ultimo[id] = k; }
  var opAntes = {};
  function opac(id, prop, v) { v = +(+v).toFixed(3); var k = id + "|" + prop; if (opAntes[k] === v) return; map.setPaintProperty(id, prop, v); opAntes[k] = v; }

  function aplicarCena(t) {
    var ex = exageroAt(t);
    if (map.terrain) map.terrain.exaggeration = ex;
    map._elevationFreeze = true;
    window.__exagero = ex;
    var baixa = 1 - eio(seg(t, CENA.baixam[0], CENA.baixam[1]));   // em 'Loreto,': a linha e os afluentes baixam; o Amazonas fica
    // a divisória: a regra da s06 (afina com a inclinação), acesa na viagem ('the other side'); baixa em 'Loreto,'
    var fp = cl(cameraAt(t).pitch / CENA.divGrossa.pitch, 0, 1);
    opac("div", "line-width", CENA.divGrossa.linha[0] + (CENA.divGrossa.linha[1] - CENA.divGrossa.linha[0]) * fp);
    opac("div-sob", "line-width", CENA.divGrossa.sob[0] + (CENA.divGrossa.sob[1] - CENA.divGrossa.sob[0]) * fp);
    // arte-18: a trava da luz mede a zona pela largura do contorno da divisória neste quadro
    var sobW = CENA.divGrossa.sob[0] + (CENA.divGrossa.sob[1] - CENA.divGrossa.sob[0]) * fp;
    Object.keys(AG).forEach(function (k) { if (AG[k].trava) AG[k].trava.divSob = sobW; });
    opac("div", "line-opacity", baixa); opac("div-sob", "line-opacity", baixa);
    // o lado do Pacífico esmaece no começo da viagem (de como a s08 o deixa: os rios a 35 %, o Rímac cheio)
    var ps = 1 - eio(seg(t, CENA.pacificoSai[0], CENA.pacificoSai[1]));
    aguaVer(map, AG.rios, ps, 0.75); aguaVer(map, AG.rimac, ps, 1);   // arte-17 (r2): como a s08 os deixa (arte-18: a 75 %), e saem pela linha lisa
    if (ps > 0) { aguaQuadro(map, AG.rios, INSEC + t, null); aguaQuadro(map, AG.rimac, INSEC + t, null); }   // arte-17: o tempo do master
    // os afluentes do Atlântico, um a um, da nascente à foz; o Amazonas por último, de oeste a leste
    // arte-17: em pedaços, com a correnteza; cada afluente cresce no tempo dele (a mesma conta de antes)
    var A = CENA.afluentes;
    if (baixa > 0) aguaQuadro(map, AG.atl, t, function (ri, i) { return eio(seg(t, A.t0 + A.passo * AFL_K[i], A.dura)) * ri.L; });
    var fa = eio(seg(t, CENA.amazonas[0], CENA.amazonas[1]));
    if (t < CENA.corte) aguaQuadro(map, AG.amz, t, function (ri) { return fa * ri.L; });
    aguaVer(map, AG.atl, baixa, 1);   // arte-17 (r2)
    // Loreto: em 'Loreto,', o polígono em --contraparte a 35 % (500 ms) e o contorno
    var vl = eo(seg(t, CENA.loreto.entra, 0.5));
    opac("loreto", "fill-opacity", CENA.loreto.fill * vl);
    opac("loreto-linha", "line-opacity", vl); opac("loreto-sob", "line-opacity", vl);
  }

  function aplicarCreditos(t) {
    var mapa = t < CENA.corte;
    var c = E("credito"); if (c) { c.style.opacity = mapa ? "1" : "0"; c.style.visibility = mapa ? "visible" : "hidden"; }
    [["credInei", 7.866, CENA.corte], ["credHarvard", 14.0, null]].forEach(function (x) {
      var el = E(x[0]); if (!el) return;
      var v = eo(seg(t, x[1], 0.3)) * (x[2] != null && t >= x[2] ? 0 : 1);
      el.style.opacity = v.toFixed(3); el.style.visibility = v > 0 ? "visible" : "hidden";
    });
  }

  function aplicar(t) {
    var pr = aplicarClipe(t);
    if (!mapaCarregado) return pr;
    if (!map.getTerrain()) map.setTerrain({ source: "dem", exaggeration: exageroAt(t) });
    map.jumpTo(cameraAt(t));
    if (map.terrain && map.transform.elevation !== 0) map.transform.elevation = 0;
    aplicarCena(t);
    aplicarRotulos(t);
    aplicarFiguras(t);
    aplicarCreditos(t);
    // A ESPESSURA DAS LINHAS SOBRE O RELEVO (= s06): a textura das linhas sobre o relevo se refaz em todo quadro
    if (map.terrain) {
      var tsc = map.terrain.sourceCache;
      if (!tsc || typeof tsc.freeRtt !== "function") { falhar("o MapLibre desta cena não tem terrain.sourceCache.freeRtt."); return pr; }
      tsc.freeRtt(); map.triggerRepaint();
    }
    return pr;
  }

  window.__renderAt = function (t) {
    try { return aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); return Promise.resolve(); }
  };

  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou. O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  // pronto: os tiles da base E do relevo carregados, o terreno ligado, o mapa parado (contrato do mapista §3)
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < CENA.fontes.length; i++) if (!map.getSource(CENA.fontes[i]) || !map.isSourceLoaded(CENA.fontes[i])) return false;
          if (!map.getSource("base") || !map.isSourceLoaded("base")) return false;
          if (!map.getSource("dem") || !map.isSourceLoaded("dem") || !map.getTerrain()) return false;
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});

})();

</script>
