/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de

(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};
    const s = (o.base ?? 1.02) + (o.zoom ?? 0.0024) * t;
    const x = (o.ax ?? 6) * Math.sin(t * 0.23), y = (o.ay ?? 4.8) * Math.sin(t * 0.17);

  }
  // Vídeo por f(t): posiciona e espera o "seeked". Na galeria (__PREVIEW) não mexe.
  function seekTo(v, tt) {
    if (!v || window.__PREVIEW || v.readyState < 1) return Promise.resolve();
    const d = v.duration; if (d > 0 && isFinite(d)) tt = clamp(tt, 0, Math.max(0, d - 0.001));

    return new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.addEventListener("error", r, { once: true }); v.currentTime = tt; });
  }
  // Grão: ruído de semente fixa por quadro (mulberry32). Mesmo t, mesmo grão.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  function grao(cv, t, o) {
    if (!cv || !cv.getContext) return; o = o || {};
    const ctx = cv.getContext("2d"), w = cv.width, h = cv.height;
    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));
    const img = ctx.createImageData(w, h), d = img.data, a = o.alfa ?? 22;
    for (let i = 0; i < d.length; i += 4) { const v = (sorte() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }

  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.

  function paleta(p) {

    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {

      else document.documentElement.style.setProperty("--" + k, String(p[k]));

  // vai para window.__fontesFaltando, que o render lê e reprova.

    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).

      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);

    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");

    var lin = "";
    if (h > 0.5) {
      vis = "M" + x0 + "," + YF + " L" + x1 + "," + YF + " L" + (x1 + bx) + "," + (YF + by) + " L" + (x1 + bx) + "," + f2(yt + by) +
        " L" + (x0 + bx) + "," + f2(yt + by) + " L" + x0 + "," + f2(yt) + " Z" +
        " M" + x0 + "," + f2(yt) + " L" + x1 + "," + f2(yt) + " L" + (x1 + bx) + "," + f2(yt + by) +
        " M" + x1 + "," + YF + " L" + x1 + "," + f2(yt);
      oc += " M" + (x0 + bx) + "," + (YF + by) + " L" + (x0 + bx) + "," + f2(yt + by);
      for (var y = YF - PASSO; y > yt + 0.5; y -= PASSO) {
        if (y < -200) break;   // fora do quadro, não desenha
        lin += "M" + (x0 + 14) + "," + y + " L" + x1 + "," + y + " L" + (x1 + bx) + "," + (y + by) + " ";
      }
    }
    return { vis: vis, oc: oc, lin: lin, som: "M" + x0 + "," + YF + " L" + x1 + "," + YF + " L" + (x1 + bx) + "," + (YF + by) +
      (h > 0.5 ? " L" + (x1 + bx) + "," + f2(yt + by) + " M" + x0 + "," + YF + " L" + x0 + "," + f2(yt) : "") };
  }

  // a figura: uma pessoa de pé, vista de frente, ~7,5 cabeças (760 px), em contorno; cabeça é a elipse do SVG
  var CORPO = "M1718,902 L1720,926 Q1790,930 1808,955 L1826,1080 L1834,1215 Q1836,1262 1818,1268 Q1802,1266 1800,1220 " +
    "L1792,1100 L1786,1010 L1782,1120 Q1788,1170 1784,1200 L1770,1400 L1758,1530 L1790,1548 Q1796,1560 1780,1560 L1714,1560 " +
    "L1714,1520 L1712,1400 L1704,1215 Q1700,1205 1696,1215 L1688,1400 L1686,1520 L1686,1560 L1620,1560 Q1604,1560 1610,1548 " +
    "L1642,1530 L1630,1400 L1616,1200 Q1612,1170 1618,1120 L1614,1010 L1608,1100 L1600,1220 Q1598,1266 1582,1268 " +
    "Q1564,1262 1566,1215 L1574,1080 L1592,955 Q1610,930 1680,926 L1682,902";
  var corpo = E("corpo"), cabeca = E("cabeca"), somFig = E("somFig");
  if (corpo) corpo.setAttribute("d", CORPO);
  if (somFig) somFig.setAttribute("d", CORPO + " M1742,852 A42,50 0 1 1 1658,852 A42,50 0 1 1 1742,852");
  var LEN_CORPO = 0, LEN_CAB = 0;
  try { LEN_CORPO = corpo.getTotalLength(); LEN_CAB = cabeca.getTotalLength(); } catch (e) {}

  // o chão: linha de terra com a hachura curta do desenho técnico, de x 560 a 3060
  (function () {
    var c = E("chao"), h = E("hachura"); if (c) c.setAttribute("d", "M560," + YF + " L3060," + YF);
    var d = ""; for (var x = 580; x <= 3040; x += 48) d += "M" + x + "," + (YF + 8) + " L" + (x - 26) + "," + (YF + 40) + " ";
    if (h) h.setAttribute("d", d);
  })();
  // as linhas de referência (aux, pontilhadas): o joelho (do Pacífico à figura) e a cabeça (da figura ao Amazonas)
  if (E("refJoelho")) E("refJoelho").setAttribute("d", "M" + (XP + W + DX + 20) + "," + (YF - HP) + " L1690," + (YF - HP));
  if (E("refCabeca")) E("refCabeca").setAttribute("d", "M1760,800 L" + (XA + W + DX + 40) + ",800");

  // o TEXTO: entra em 300 ms (opacidade + 24 px de subida, ease-out; o herói também 1,04 → 1,00). (x, y) = canto ou centro
  function texto(id, t, tin, x, y, alinha, esc) {
    var e = E(id); if (!e) return;
    var pi = eo(seg(t, tin, 0.3)), w = e.offsetWidth, h = e.offsetHeight, k = esc ? lerp(1.04, 1.00, pi) : 1;
    var x0 = alinha === "centro" ? x - w / 2 : x;
    e.style.opacity = pi.toFixed(3);
    e.style.transform = "translate(" + f2(x0) + "px," + f2(y - h / 2 + 24 * (1 - pi)) + "px) scale(" + k.toFixed(4) + ")";
  }
  function credito(id, t, tin) { var e = E(id); if (e) e.style.opacity = eo(seg(t, tin, 0.3)).toFixed(3); }
  // a CÂMERA: push-in contínuo (0,0024/s, base 1,0) que PARA 250 ms antes do corte; a deriva do RIG segue; o still a 0,6
  function camera(t) {
    var c = E("cam"), s = 1 + 0.0024 * Math.min(t, T.repouso), dx = 6 * Math.sin(t * 0.23), dy = 4.8 * Math.sin(t * 0.17);
    if (c) c.style.transform = "scale(" + s.toFixed(5) + ") translate(" + f2(dx) + "px," + f2(dy) + "px)";
    var st = E("still"); if (st) st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ") translate(" + f2(dx * 0.6) + "px," + f2(dy * 0.6) + "px)";
  }

  function pinta(idv, ido, idl, ids, c) {
    var a = E(idv), b = E(ido), l = E(idl), s = E(ids);
    if (a) a.setAttribute("d", c.vis); if (b) b.setAttribute("d", c.oc); if (l) l.setAttribute("d", c.lin); if (s) s.setAttribute("d", c.som);
  }

  function cena(t) {
    t = t + 0.0005;
    camera(t);
    // a figura se desenha (o traço corre) em "Per person"
    var pf = eo(seg(t, T.fig, 0.6));
    if (corpo && LEN_CORPO) { corpo.style.strokeDasharray = LEN_CORPO.toFixed(1); corpo.style.strokeDashoffset = (LEN_CORPO * (1 - pf)).toFixed(1); }
    if (cabeca && LEN_CAB) { cabeca.style.strokeDasharray = LEN_CAB.toFixed(1); cabeca.style.strokeDashoffset = (LEN_CAB * (1 - pf)).toFixed(1); }
    if (somFig) somFig.style.opacity = pf.toFixed(3);
    var gS = E("gSom");
    // os dois recipientes, cada um com o seu controlador de altura
    pinta("visP", "ocP", "linP", "somP", caixa(XP, hP(t)));
    pinta("visA", "ocA", "linA", "somA", caixa(XA, hA(t)));
    // as referências entram com a figura
    var rj = E("refJoelho"), rc = E("refCabeca");
    if (rj) rj.style.opacity = (0.45 * eo(seg(t, T.fimP - 0.2, 0.3))).toFixed(3);
    if (rc) rc.style.opacity = (0.45 * eo(seg(t, 0.4, 0.3))).toFixed(3);
    // os textos
    texto("titulo", t, 0, 240, 250, "esquerda", false);
    texto("rotP", t, 0, XP + (W + DX) / 2, 1665, "centro", false);
    texto("rotA", t, 0, XA + (W + DX) / 2, 1665, "centro", false);
    texto("heroi", t, T.heroi, 232, 520, "esquerda", true);
    credito("cred1", t, T.cred);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  // O GANCHO DE MEDIDA (só leitura, do DOM): as alturas na tela das duas caixas e a do joelho da figura
  window.__s11peca = function (t) {
    t = clamp(+t || 0, 0, DUR); window.__renderAt(t);
    var p = E("visP").getBBox(), a = E("visA").getBBox(), f = E("corpo").getBBox();
    return { t: t, hP: hP(t), hA: hA(t), caixaP: [p.y, p.height], caixaA: [a.y, a.height], figura: [f.y, f.height] };
  };
  window.__renderAt(0);
})();
</script>
