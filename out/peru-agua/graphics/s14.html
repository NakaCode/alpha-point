/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.

(function () {

    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0

    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()

    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");

    var h = "";
    for (var i = 1; i < COSTA.length; i++) {
      var a = COSTA[i - 1], b = COSTA[i], L = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.floor(L / 46);
      for (var k2 = 1; k2 <= n; k2++) {
        var x = a[0] + (b[0] - a[0]) * k2 / (n + 1), y = a[1] + (b[1] - a[1]) * k2 / (n + 1);
        h += "M" + f2(x) + "," + f2(y + 10) + " l-24,30 ";
      }
    }
    E("costaHach").setAttribute("d", h);
    // o recorte do ar: tudo acima do mar e do perfil da costa
    E("clipArPath").setAttribute("d", "M-200,-200 L4100,-200 L4100,940 L3960,940 " +
      COSTA.slice(1).reverse().map(function (p) { return "L" + p[0] + "," + p[1]; }).join(" ") + " L-200," + YMAR + " Z");
  })();

  // ── o ar frio: 4 linhas tracejadas rentes ao mar, até a encosta ──
  var FRIO = [1440, 1400, 1360, 1320].map(function (y) {
    return el("path", "ar-frio", { d: "M-100," + y + " L" + f2(costaX(y) - 16) + "," + y }, E("gFrio"));
  });

  // ── a tampa: laje de 60 px, topo em YR no repouso; a ponta direita é cortada pela encosta ──
  var ESP = 60, YR = 1080, Y0 = 640, OMEGA = 7;
  function yTampa(t) {
    if (t < T.tampaDesce) return Y0;
    var u = t - T.tampaDesce, f = (1 + OMEGA * u) * Math.exp(-OMEGA * u), y = YR + (Y0 - YR) * f;
    return Math.abs(y - YR) < 0.5 ? YR : y;   // limiar de repouso declarado (0,5 px)
  }
  function dTampa(y) {
    var xt = costaX(y), xb = costaX(y + ESP);
    if (y + ESP < 940) { xt = 3960; xb = 3960; }   // no alto, acima do morro: sai pela direita
    return "M-100," + f2(y) + " L" + f2(xt) + "," + f2(y) + " M-100," + f2(y + ESP) + " L" + f2(xb) + "," + f2(y + ESP);
  }

  // ── as setas do ar que afunda: do H até a tampa (leem yTampa) ──
  var SETAS_X = [1100, 1400, 1700];
  function dSetas(t) {
    var p = eo(seg(t, T.setas, 0.5)), yT = yTampa(t) - 24, y0 = 470, d = "";
    var yp = lerp(y0, Math.max(y0 + 20, Math.min(yT, 620)), p);
    if (t >= T.tampaDesce) yp = yT;
    if (p <= 0) return "";
    SETAS_X.forEach(function (x, k) {
      var xs = x + (k - 1) * 0;   // reto, para baixo
      d += "M" + xs + "," + y0 + " L" + xs + "," + f2(yp) + " M" + (xs - 26) + "," + f2(yp - 30) + " L" + xs + "," + f2(yp) + " L" + (xs + 26) + "," + f2(yp - 30) + " ";
    });
    return d;
  }

  // ── a umidade: 8 fios do mar e da encosta até o fundo da tampa; cada um vira um véu horizontal ──
  var FIOS = [380, 740, 1100, 1460, 1820, 2180, 2540, 2960].map(function (x, i) {
    var base = YMAR - 46;
    if (x >= 2740) base = (function () { for (var y = 1480; y > 900; y -= 2) if (costaX(y) >= x) return y - 30; return 1300; })();
    return { x: x, base: base, t0: T.fios + i * 0.12, fase: i * 1.7,
      fio: el("path", "ar-umid", { d: "" }, E("gUmid")), veu: el("path", "ar-umid", { d: "" }, E("gUmid")),
      veu2: el("path", "ar-umid", { d: "" }, E("gUmid")) };
  });
  var YTOPO = YR + ESP + 6;   // o fundo da tampa + 6 px: onde o fio para
  function fioPath(F, yTop) {
    var d = "M" + f2(F.x + 14 * Math.sin(F.base / 40 + F.fase)) + "," + f2(F.base);
    for (var y = F.base - 12; y >= yTop; y -= 12) d += " L" + f2(F.x + 14 * Math.sin(y / 40 + F.fase)) + "," + f2(y);
    return d;
  }
  function veuPath(xc, y, meia, fase) {
    if (meia < 2) return "";
    var d = "", x0 = xc - meia, x1 = xc + meia;
    d = "M" + f2(x0) + "," + f2(y + 8 * Math.sin(x0 / 60 + fase));
    for (var x = x0 + 16; x <= x1; x += 16) d += " L" + f2(x) + "," + f2(y + 8 * Math.sin(x / 60 + fase));
    return d;
  }
  function umidade(t) {
    FIOS.forEach(function (F) {
      var p = eo(seg(t, F.t0, 1.0));                         // sobe desacelerando e PARA sob a tampa
      var yTop = lerp(F.base, YTOPO, p);
      var v = eo(seg(t, F.t0 + 0.85, 0.9));                  // o véu abre quando o fio encosta
      var saida = seg(t, T.fiosSaem, 0.6);
      F.fio.setAttribute("d", p > 0 ? fioPath(F, yTop) : "");
      F.fio.style.opacity = (0.75 * (p > 0 ? 1 : 0) * (1 - saida)).toFixed(3);
      F.veu.setAttribute("d", veuPath(F.x, YTOPO + 14, 230 * v, F.fase));
      F.veu2.setAttribute("d", veuPath(F.x, YTOPO + 48, 190 * v, F.fase + 2));
      F.veu.style.opacity = (0.8 * v).toFixed(3); F.veu2.style.opacity = (0.55 * v).toFixed(3);
    });
  }

  function texto(id, t, tin, cx, cy) {
    var e = E(id); if (!e) return;
    var pi = eo(seg(t, tin, 0.3)), w = e.offsetWidth, h = e.offsetHeight;
    e.style.opacity = pi.toFixed(3);
    e.style.transform = "translate(" + f2(cx - w / 2) + "px," + f2(cy - h / 2 + 24 * (1 - pi)) + "px)";
  }
  function camera(t) {
    var c = E("cam"), s = 1 + 0.0024 * Math.min(t, T.repouso), dx = 6 * Math.sin(t * 0.23), dy = 4.8 * Math.sin(t * 0.17);
    if (c) c.style.transform = "scale(" + s.toFixed(5) + ") translate(" + f2(dx) + "px," + f2(dy) + "px)";
    var st = E("still"); if (st) st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ") translate(" + f2(dx * 0.6) + "px," + f2(dy * 0.6) + "px)";
  }

  function cena(t) {
    t = t + 0.0005;
    camera(t);
    // o ar frio se adensa em "The cold sea chills": de 1 a 4 linhas, o traço fecha
    var pf = eo(seg(t, T.frio, 1.0));
    FRIO.forEach(function (p, k) {
      var on = k === 0 ? 1 : eo(seg(t, T.frio + 0.2 * k, 0.4));
      var tr = lerp(40, 16, pf), vz = lerp(30, 12, pf);
      p.style.strokeDasharray = f2(tr) + " " + f2(vz);
      p.style.opacity = (on * lerp(0.45, 0.7, pf)).toFixed(3);
    });
    // a tampa: aparece abaixo das setas e desce até assentar
    var y = yTampa(t), ap = eo(seg(t, T.tampaAparece, 0.3));
    E("tampa").setAttribute("d", dTampa(y));
    E("tampaMeio").setAttribute("d", "M-100," + f2(y + ESP / 2) + " L" + f2(costaX(y + ESP / 2) - 10) + "," + f2(y + ESP / 2));
    E("gTampa").style.opacity = ap.toFixed(3);
    E("somTampa").setAttribute("d", ap > 0 ? dTampa(y) : "");
    // as setas
    E("setas").setAttribute("d", dSetas(t));
    E("gSetas").style.opacity = (1 - seg(t, T.setasSaem, 0.3)).toFixed(3);
    // o H: do 1º quadro; sai em "Under that lid"
    E("H").style.opacity = (1 - eo(seg(t, T.beat2, 0.3))).toFixed(3);
    umidade(t);
    texto("rotFrio", t, T.rotFrio, 1400, 1745);
    texto("rotTampa", t, T.rotTampa, 1400, 975);
    var c = E("cred1"); if (c) c.style.opacity = eo(seg(t, 0, 0.3)).toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  // O GANCHO DE MEDIDA (só leitura, do DOM): a tampa na tela e a ponta mais alta da umidade (não pode passar do fundo da tampa)
  window.__s14peca = function (t) {
    t = clamp(+t || 0, 0, DUR); window.__renderAt(t);
    var tb = E("tampa").getBBox(), topo = 1e9;
    FIOS.forEach(function (F) { var b = F.fio.getBBox(); if (b.height > 0) topo = Math.min(topo, b.y); });
    return { t: t, tampaTopo: tb.y, tampaFundo: tb.y + tb.height, umidadeTopo: topo === 1e9 ? null : topo };
  };
  window.__renderAt(0);
})();
</script>
</body>
