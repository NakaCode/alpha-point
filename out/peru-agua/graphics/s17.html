<script>

    tCota: "0.3 INCHES (8 mm)",                               // cota, 1,9–4,966 (em "third"; a mesma forma da s03)
    tLeg: "OF RAIN A YEAR",                                   // legenda, 1,9–4,966, sob a cota
    tAnot: "ALMOST ALL OF IT DRIZZLE",                        // legenda, 2,966–4,966 (0,22 s antes de "almost")
    credDado: "Source: SENAMHI (Peru), 1981–2010 average",    // credito, 1,9–4,966, com o número
    rLima: "Lima",                                            // rotulo, 5,266–10,133 (a pílula do clipe; a origem é La Molina)
    c1: "“one of the largest\ncities in the world\nlocated in a desert”",   // citacao, 6,666–10,133 (em "one"; 11 palavras)
    lTrad: "Translated from Spanish",                         // legenda, 6,666–10,133, sob a citação

  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" + rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";

  var C1 = { w: 2584, h: 900, cx: 232 + 1292, cy: 420 + 450, rot: 0.5 };

      var dx = 6 * Math.sin(td * 0.23), dy = 4.8 * Math.sin(td * 0.17);
      cam.style.transform = "scale(" + s.toFixed(5) + ") translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
    }

    corre("chao", t, 0.02, 0.5); corre("hachura", t, 0.2, 0.6);
    corre("corpo", t, 0.1, 1.0); corre("somCorpo", t, 0.1, 1.0);

    var q = eo(seg(t, T.cota, 0.3)), ya = Y0 - AGUA * q;
    var ag = E("agua"); if (ag) { ag.setAttribute("cy", ya.toFixed(1)); ag.style.opacity = t >= T.cota ? "1" : "0"; }
    var rc = E("aguaRect"); if (rc) rc.setAttribute("y", (ya + 1).toFixed(1));
    var ct = E("cota"); if (ct) { ct.setAttribute("d", "M 1190 " + ya.toFixed(1) + " L 1420 " + ya.toFixed(1) + " L 1420 1060 L 1500 1060"); }
    corre("cota", t, T.cota + 0.1, 0.4);
    var tt = t + 0.0005;

    texto(E("tLeg"), tt, T.cota, T.corte);
    texto(E("tAnot"), tt, T.anot, T.corte);
    texto(E("credDado"), tt, T.cota, T.corte);

    var d = E("dado"), so = E("sobre"), v = E("v");
    if (d) d.style.display = b1 ? "none" : "block";
    if (so) so.style.display = b1 ? "block" : "none";
    if (v) v.style.display = b1 ? "block" : "none";

    texto(E("lTrad"), tt, T.cit, DUR + 1);
