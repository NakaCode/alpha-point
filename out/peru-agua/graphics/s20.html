(function () {

  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico

  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.

  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }

  // vai para window.__fontesFaltando, que o render lê e reprova.

    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()

    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);

    // (da s20 do vídeo 3, linhas 477–502, sem mudança)
  // ── FAIL-CLOSED: tile que não chega é ERRO, não quadro preto (molde; s03) ─────────────────────────
  window.__errosMapa = 0;
  function motivoRede(err, msg) {
    var st = err.status, n = err.tentativas > 1 ? " (" + err.tentativas + " tentativas)" : "";
    if (err.falha === "corrompido" || /could not be decoded|could not load image|tile corrompido/i.test(msg)) {
      return "mandou tile CORROMPIDO" + n + ": a resposta chegou, mas a imagem veio cortada ou ilegível (" +
        String(msg).replace(/^tile corrompido: /, "") + "). Não é falta de internet: o servidor ou a conexão estão cortando " +
        "respostas. Renderize de novo.";
    }
    if (err.falha === "tempo") return "não respondeu em " + PRAZO_TENTATIVA / 1000 + " s" + n + " (internet lenta ou servidor sobrecarregado). Renderize de novo.";
    if (st === 401 || st === 403) return "recusou o acesso (HTTP " + st + "). Confira a chave " + (P.credencial || "") + " e o plano do dono.";
    if (st === 429) return "limitou as requisições (HTTP 429)" + n + ". Espere e renderize de novo.";
    if (st >= 500) return "está com erro no servidor (HTTP " + st + ")" + n + ". Tente de novo mais tarde.";
    if (st) return "respondeu HTTP " + st + ".";
    return "não respondeu (sem internet? servidor fora do ar? firewall?)" + n + ".";
  }
  map.on("error", function (ev) {
    window.__errosMapa++;
    var err = (ev && ev.error) || {};
    var msg = String(err.message || "");
    var deRede = err.status || err.url || (ev && ev.tile) || /fetch|network|failed to load|load failed|cors/i.test(msg);
    if (!deRede) return falhar("o MapLibre acusou erro na cena: " + (msg || "sem descrição") + ". Confira o bloco CENA (ids de camada/fonte, valores).");
    var fonte = ev && ev.sourceId ? " (fonte '" + ev.sourceId + "')" : (mapaCarregado ? "" : " (o estilo do mapa)");
    falhar("a base '" + P.nome + "'" + fonte + " " + motivoRede(err, msg) + (err.url ? " URL: " + String(err.url).split("?")[0] : "") +
      (msg && !err.status && err.falha !== "corrompido" && err.falha !== "tempo" && !/could not be decoded|could not load image/i.test(msg) ? " — " + msg : ""));
  });

    map.on("load", function () { mapaCarregado = true; map.once("idle", function () { if (!window.__erroCena) resolverPronto(true); }); });

    // (da s20 do vídeo 3, linhas 711–772, sem mudança)
  // pronto quando nenhum tile da base está carregando e os níveis à vista são no máximo dois, vizinhos (s03)
  function nivelUnico() {
    try {
      if (map.getTerrain() || map.getPitch() > 1) return true;
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      var cache = sc.base; if (!cache) return true;
      var todos = cache._tiles || {};
      for (var k in todos) { var st = todos[k] && todos[k].state; if (st === "loading" || st === "reloading") return false; }
      var ids = cache.getRenderableIds ? cache.getRenderableIds() : Object.keys(todos);
      var zs = ids.map(function (id) { var x = todos[id]; return x && x.tileID && x.tileID.canonical ? x.tileID.canonical.z : null; })
        .filter(function (z) { return z !== null; });
      if (!zs.length) return false;
      return Math.max.apply(null, zs) - Math.min.apply(null, zs) <= 1;
    } catch (e) { return true; }
  }
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) {
        var ts = (sc[id] && sc[id]._tiles) || {};
        for (var k in ts) if (ts[k] && ts[k].state === "errored") return id;
      }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou (HTTP 404 ou resposta inválida). O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) if (!map.isSourceLoaded(FONTES[i])) return false;
          if (!map.isSourceLoaded("base")) return false;
          if (CENA.agua && (!map.getSource("aguaBase") || !map.isSourceLoaded("aguaBase"))) return false;
          return nivelUnico();
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.jumpTo({ center: map.getCenter() }); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo; se repetir, confira a conexão.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };
  })();

  var ultimoRio = null;
  function mapaQuadro(t) {
    var vm = E("vistaMesa"), mp = E("map"), noMapa = t < T.mesa;
    if (vm) vm.style.opacity = noMapa ? "0" : "1";
    if (mp) mp.style.opacity = noMapa ? "1" : "0";
    if (map && mapaCarregado) {
      map.jumpTo(cameraAt(Math.min(t, T.mesa)));
      var f = eb(seg(t, T.rio, T.rioDur)), k = f.toFixed(4);
      if (k !== ultimoRio) { var s = map.getSource("rim"); if (s) s.setData(f > 0 ? trechoAte(f) : { type: "FeatureCollection", features: [] }); ultimoRio = k; }
    }
    // os créditos: no mapa, em pílula, o da MapTiler embaixo e o da ANA acima; na mesa, o da ANA no mesmo pé
    var cm = E("crMapa"), cf = E("crFonte"), base = 24;
    if (cm) { cm.style.opacity = noMapa ? "1" : "0"; cm.style.bottom = base + "px"; base += cm.offsetHeight + 10; }
    if (cf) { cf.style.opacity = noMapa ? "1" : "0"; cf.style.bottom = base + "px"; }
  }

  function cena(t) {
    t = t + 0.0005;
    mapaQuadro(t);
    if (t >= T.mesa) mesaQuadro(t);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }
  };
  var capturando = false;
  window.__prepararCaptura = function () { capturando = true; window.__renderAt(0); return true; };
  posTextos();
  window.__fotosProntas = R.prontas().then(function () { try { posTextos(); } catch (e) {} window.__renderAt(0); return true; });
  window.__ready.then(function () { window.__renderAt(0); }, function () {});
  // O GANCHO DE MEDIDA (só leitura, do DOM): o canto de baixo à esquerda da metade da direita, na tela, contra a linha da queda
  window.__s20peca = function (t) {
    t = clamp(+t || 0, 0, DUR); window.__renderAt(t);
    var k = E("rCanto").getBoundingClientRect(), cam = E("cam").getBoundingClientRect();
    var sx = cam.width / 3840, xm = (k.left + k.width / 2 - cam.left) / sx, ym = (k.top + k.height / 2 - cam.top) / sx;
    return { t: t, canto: [xm, ym], quedaNoX: yQueda(xm), folga: ym - yQueda(xm), s: sR(t) };
  };
  window.__renderAt(0);
})();
