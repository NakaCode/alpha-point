        paint: { "raster-brightness-max": 0.92, "raster-saturation": 0, "raster-contrast": 0.25, "raster-fade-duration": 0 } },   // identidade §6, o tratamento C
      { id: "div-sob", type: "line", source: "div", layout: lc, paint: { "line-color": COR.sob, "line-width": 12 } },
      { id: "div", type: "line", source: "div", layout: lc, paint: { "line-color": COR.tinta, "line-width": 6 } },
      // a rota: --destaque 6 px tracejada (o esquema), sobre o contorno escuro de 16 px
      { id: "rota-sob", type: "line", source: "rota", layout: lc, paint: { "line-color": COR.sob, "line-width": 16, "line-opacity": 1 } },
      { id: "rota", type: "line", source: "rota", layout: lb, paint: { "line-color": COR.destaque, "line-width": 6, "line-dasharray": [2.6, 1.8], "line-opacity": 1 } }
    ];
    return { version: 8, transition: { duration: 0, delay: 0 }, sources: fontes, layers: camadas };
  }

  // ── rede com nova tentativa: falha passageira não derruba a cena inteira (molde, sem mudança) ────────
  window.__retentativasMapa = 0;
  window.__retentativasMapaPorFalha = { corrompido: 0, tempo: 0, rede: 0, http: 0 };
  var ESPERAS = [0, 1000, 3000, 6000, 10000];
  var PRAZO_TENTATIVA = 30000;
  function defeitoDaImagem(buf) {
    var b = new Uint8Array(buf), n = b.length, i;
    if (n < 8) return n ? "resposta de " + n + " bytes" : "resposta vazia";
    if (b[0] === 0xFF && b[1] === 0xD8) {
      for (i = n - 2; i >= Math.max(2, n - 64); i--) if (b[i] === 0xFF && b[i + 1] === 0xD9) return null;
      return "JPEG cortado (" + n + " bytes, sem o marcador final FF D9)";
    }
    if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) {
      for (i = n - 8; i >= Math.max(8, n - 64); i--) if (b[i] === 0x49 && b[i + 1] === 0x45 && b[i + 2] === 0x4E && b[i + 3] === 0x44) return null;
      return "PNG cortado (" + n + " bytes, sem o bloco IEND)";
    }
    if (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46) {
      var decl = (b[4] | (b[5] << 8) | (b[6] << 16) | (b[7] << 24)) >>> 0;
      return decl + 8 <= n ? null : "WebP cortado (" + n + " de " + (decl + 8) + " bytes)";
    }
    return null;
  }
  function erroCorpo(msg, url, st) { var e = new Error("tile corrompido: " + msg); e.falha = "corrompido"; e.url = url; e.statusCorpo = st; return e; }
  function buscarComRetentativa(params, abortar) {
    var url = params.url.replace(/^regie\+/, "");
    var tentativa = 0;
    var ehImagem = params.type === "image";
    function uma() {
      var ctl = new AbortController(), estourou = false;
      var cancelar = function () { ctl.abort(); };
      var externo = abortar && abortar.signal;
      if (externo) { if (externo.aborted) ctl.abort(); else externo.addEventListener("abort", cancelar); }
      var relogio = setTimeout(function () { estourou = true; ctl.abort(); }, PRAZO_TENTATIVA);
      var soltar = function () { clearTimeout(relogio); if (externo) externo.removeEventListener("abort", cancelar); };
      return fetch(url, { signal: ctl.signal }).then(function (r) {
        if (!r.ok) { var e = new Error("AJAXError: HTTP " + r.status + " (" + r.status + "): " + url); e.status = r.status; e.url = url; e.falha = "http"; throw e; }
        if (params.type === "json") return r.text().then(function (t) { try { return JSON.parse(t); } catch (x) { throw erroCorpo("JSON ilegível (" + t.length + " caracteres)", url, r.status); } });
        return r.arrayBuffer().then(function (buf) {
          if (!ehImagem) return buf;
          var defeito = defeitoDaImagem(buf);
          if (defeito) throw erroCorpo(defeito, url, r.status);
          return createImageBitmap(new Blob([buf])).then(null, function (x) {
            throw erroCorpo("a imagem não decodifica (" + buf.byteLength + " bytes: " + ((x && x.message) || "sem descrição") + ")", url, r.status);
          });
        });
      }).then(function (data) { soltar(); return { data: data }; }, function (e) {
        soltar();
        if (e && e.name === "AbortError" && !estourou) throw e;
        if (estourou) { e = new Error("sem resposta em " + PRAZO_TENTATIVA / 1000 + " s"); e.falha = "tempo"; }
        if (!e || typeof e !== "object") e = new Error(String(e));
        var st = e.status;
        if (!e.falha) e.falha = st ? "http" : "rede";
        var passageira = e.falha !== "http" || st === 429 || st >= 500;
        try { e.url = url; e.tentativas = tentativa + 1; } catch (x) {}
        if (!passageira || ++tentativa >= ESPERAS.length) throw e;
        window.__retentativasMapa++;
        window.__retentativasMapaPorFalha[e.falha] = (window.__retentativasMapaPorFalha[e.falha] || 0) + 1;
        return new Promise(function (res) { setTimeout(res, ESPERAS[tentativa]); }).then(uma);
      });
    }
    return uma();
  }
  maplibregl.addProtocol("regie+https", buscarComRetentativa);
  maplibregl.addProtocol("regie+http", buscarComRetentativa);
  var pelaRegie = function (url) { return /^https?:\/\//.test(url) ? { url: "regie+" + url } : undefined; };

  // ── a câmera: antes do corte, parada em M0 (por baixo da mesa, os tiles prontos); de 4,0 a 8,166 a deriva M0 → M1 ──
  var PT = CENA.pontos;
  var merc = function (lng, lat) { var s = Math.sin(lat * Math.PI / 180); return [lng, 0.5 * Math.log((1 + s) / (1 - s))]; };
  var unmercLat = function (y) { return (2 * Math.atan(Math.exp(y)) - Math.PI / 2) * 180 / Math.PI; };
  function cameraAt(t) {
    var L = CENA.pernas[0];
    var u = cl((t - L.t0) / (L.t1 - L.t0), 0, 1), a = PT[L.de], b = PT[L.para];
    var ma = merc(a.lng, a.lat), mb = merc(b.lng, b.lat);
    return { center: [a.lng + (b.lng - a.lng) * u, unmercLat(ma[1] + (mb[1] - ma[1]) * u)], zoom: a.zoom + (b.zoom - a.zoom) * u,
      bearing: a.bearing + (b.bearing - a.bearing) * u, pitch: a.pitch + (b.pitch - a.pitch) * u };
  }
  window.__cameraAt = cameraAt;

  var c0 = cameraAt(0);
  var map;
  try {
    map = new maplibregl.Map({
      container: "map", interactive: false, preserveDrawingBuffer: true, fadeDuration: 0,
      maxTileCacheSize: 4096, attributionControl: false, maxPitch: 85, transformRequest: pelaRegie,
      style: estilo(), center: c0.center, zoom: c0.zoom, bearing: c0.bearing, pitch: c0.pitch
    });
  } catch (e) {
    return falhar("o MapLibre não subiu (" + (e && e.message) + "). Sem WebGL no navegador não há mapa.");
  }
  window.map = map;
  (function () {
    var pt = map.painter, pintar = pt && pt.render;
    if (typeof pintar !== "function") return falhar("o MapLibre desta cena não tem painter.render: a base andaria em degraus de 1 px.");
    pt.render = function (estiloMapa, opcoes) { return pintar.call(this, estiloMapa, Object.assign({}, opcoes, { moving: true })); };
  })();

  // ── FAIL-CLOSED: tile que não chega é ERRO, não quadro preto (molde) ──
  window.__errosMapa = 0;
  function motivoRede(err, msg) {
    var st = err.status, n = err.tentativas > 1 ? " (" + err.tentativas + " tentativas)" : "";
    if (err.falha === "corrompido" || /could not be decoded|could not load image|tile corrompido/i.test(msg))
      return "mandou tile CORROMPIDO" + n + " (" + String(msg).replace(/^tile corrompido: /, "") + "). Renderize de novo.";
    if (err.falha === "tempo") return "não respondeu em " + PRAZO_TENTATIVA / 1000 + " s" + n + ". Renderize de novo.";
    if (st === 401 || st === 403) return "recusou o acesso (HTTP " + st + "). Confira a chave " + (P.credencial || "") + " e o plano do dono.";
    if (st === 429) return "limitou as requisições (HTTP 429)" + n + ". Espere e renderize de novo.";
    if (st >= 500) return "está com erro no servidor (HTTP " + st + ")" + n + ". Tente de novo mais tarde.";
    if (st) return "respondeu HTTP " + st + ".";
    return "não respondeu (sem internet? servidor fora do ar? firewall?)" + n + ".";
  }
  var mapaCarregado = false;
  map.on("error", function (ev) {
    window.__errosMapa++;
    var err = (ev && ev.error) || {};
    var msg = String(err.message || "");
    var deRede = err.status || err.url || (ev && ev.tile) || /fetch|network|failed to load|load failed|cors/i.test(msg);
    if (!deRede) return falhar("o MapLibre acusou erro na cena: " + (msg || "sem descrição") + ".");
    var fonte = ev && ev.sourceId ? " (fonte '" + ev.sourceId + "')" : (mapaCarregado ? "" : " (o estilo do mapa)");
    falhar("a base '" + P.nome + "'" + fonte + " " + motivoRede(err, msg) + (err.url ? " URL: " + String(err.url).split("?")[0] : ""));
  });
  map.on("load", function () {
    try { map.setTerrain({ source: "dem", exaggeration: CENA.exag }); } catch (e) { return falhar("não consegui ligar o relevo: " + e.message); }
    mapaCarregado = true;
    map.once("idle", function () { if (!window.__erroCena) resolverPronto(true); });
  });

  // ── rótulos presos ao mapa (map.project lê o relevo no MapLibre 4.7.1): entram em 300 ms (opacidade + 24 px); o que a câmera levasse
  //    para perto da margem, da faixa do crédito ou do canto reservado esmaece antes (60 px) ──
  var ROT = [
    { id: "rotJauja", ll: JAUJA, lado: "direita", dx: 96, dy: 0, entra: CENA.anel.entra, sai: null },
    { id: "legRota",  ll: LEG_LL, lado: "esquerda", dx: -120, dy: 0, entra: CENA.legenda.entra, sai: null }   // à esquerda da seta: a divisória passa à direita e abaixo
  ];
  function naArea(l, tp, w, h) {
    var r = l + w, b = tp + h;
    return Math.min(l - 200, 3640 - r, tp - 160, 1880 - b, Math.max(3440 - r, 1760 - b));
  }
  function aplicarRotulos(t) {
    ROT.forEach(function (r) {
      var el = E(r.id); if (!el) return;
      var vin = eo(seg(t, r.entra, 0.3)), vout = r.sai != null ? 1 - eio(seg(t, r.sai, 0.3)) : 1;
      var v = vin * vout;
      if (v <= 0 || t < CORTE) { el.style.opacity = "0"; el.style.visibility = "hidden"; r._v = 0; return; }
      var p = map.project(r.ll), x = p.x + (r.dx || 0), y = p.y + (r.dy || 0);
      var w = el.offsetWidth, h = el.offsetHeight;
      var fx = r.lado === "direita" ? 0 : r.lado === "esquerda" ? 1 : 0.5;
      var l = x - w * fx, tp = y - h / 2 + (1 - vin) * 24;
      v *= cl(naArea(l, tp, w, h) / 60, 0, 1);
      el.style.opacity = v.toFixed(3);
      el.style.visibility = v > 0 ? "visible" : "hidden";
      el.style.transform = "translate(" + l.toFixed(2) + "px," + tp.toFixed(2) + "px)";
      r._v = v; r._l = l; r._t = tp; r._w = w; r._h = h;
    });
  }
  // ── o anel no ponto de Jauja: entra em 300 ms; o pulso 1 → 1,8 e 1 → 0 em 1,2 s, duas vezes, e para (identidade §4.4) ──
  function aplicarAnel(t) {
    var a = E("anel"), p1 = E("pulso1"), p2 = E("pulso2"); if (!a) return;
    var t0 = CENA.anel.entra, v = t < CORTE ? 0 : eo(seg(t, t0, 0.3));
    var p = map.project(JAUJA), D = 56;
    [a, p1, p2].forEach(function (el, i) {
      if (!el) return;
      var k = 1, op = v;
      if (i > 0) { var u = (t - t0 - (i - 1) * 1.2) / 1.2; if (u < 0 || u >= 1 || t < CORTE) { el.style.opacity = "0"; el.style.visibility = "hidden"; return; } k = lerp(1, 1.8, u); op = (1 - u) * v; }
      el.style.opacity = op.toFixed(3); el.style.visibility = op > 0 ? "visible" : "hidden";
      el.style.transform = "translate(" + (p.x - D / 2).toFixed(2) + "px," + (p.y - D / 2).toFixed(2) + "px) scale(" + k.toFixed(4) + ")";
    });
  }
  // ── a rota: só o trecho desenhado até t (setData), e a ponta aberta no fim (SVG, orientada pelo último segmento) ──
  var ultimo = {};
  function dados(id, fc, k) { if (ultimo[id] === k) return; var s = map.getSource(id); if (s) s.setData(fc); ultimo[id] = k; }
  function aplicarRota(t) {
    var Rt = CENA.rota.desenha, f = t < CORTE ? 0 : eio(seg(t, Rt[0], Rt[1]));
    var tr = f > 0 ? trecho(ROTA, LR, f) : null;
    dados("rota", tr ? fcLinhas([tr]) : fcVazia, f.toFixed(4));
    var g = E("pontaG"); if (!g) return;
    if (!tr || f < 0.985) { g.setAttribute("opacity", "0"); return; }
    var a = map.project(tr[tr.length - 2]), b = map.project(tr[tr.length - 1]);
    var dx = b.x - a.x, dy = b.y - a.y, n = Math.hypot(dx, dy) || 1; dx /= n; dy /= n;
    var L = 74, A = 0.62;   // a ponta aberta em "V": dois traços de 74 px, abertos 36° de cada lado
    var ux = -dx * Math.cos(A) + dy * Math.sin(A), uy = -dy * Math.cos(A) - dx * Math.sin(A);
    var vx = -dx * Math.cos(A) - dy * Math.sin(A), vy = -dy * Math.cos(A) + dx * Math.sin(A);
    var d = "M " + (b.x + ux * L).toFixed(2) + " " + (b.y + uy * L).toFixed(2) + " L " + b.x.toFixed(2) + " " + b.y.toFixed(2) + " L " + (b.x + vx * L).toFixed(2) + " " + (b.y + vy * L).toFixed(2);
    E("pontaSob").setAttribute("d", d); E("ponta").setAttribute("d", d);
    g.setAttribute("opacity", eo(seg(f, 0.985, 0.015)).toFixed(3));
  }
  function aplicarCreditoMapa(t) {
    var c = E("credito"); if (!c) return;
    var v = t >= CORTE;   // inteiro no 1º quadro de mapa, até o último (identidade §4.2)
    c.style.opacity = v ? "1" : "0"; c.style.visibility = v ? "visible" : "hidden";
  }
  function aplicarMapa(t) {
    if (!mapaCarregado) return;
    if (!map.getTerrain()) map.setTerrain({ source: "dem", exaggeration: CENA.exag });
    map.jumpTo(cameraAt(t));
    map._elevationFreeze = true;
    if (map.terrain && map.transform.elevation !== 0) map.transform.elevation = 0;
    window.__exagero = CENA.exag;
    aplicarRota(t);
    aplicarRotulos(t);
    aplicarAnel(t);
    aplicarCreditoMapa(t);
    if (map.terrain) {
      var tsc = map.terrain.sourceCache;
      if (!tsc || typeof tsc.freeRtt !== "function") return falhar("o MapLibre desta cena não tem terrain.sourceCache.freeRtt.");
      tsc.freeRtt(); map.triggerRepaint();
    }
  }

  window.__renderAt = function (t) {
    t = cl(+t || 0, 0, DUR);
    try { cenaMesa(t); } catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = "mesa: " + String(e && e.message); }
    try { aplicarMapa(t); } catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = "mapa: " + String(e && e.message); }
  };

  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou. O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < CENA.fontes.length; i++) if (!map.getSource(CENA.fontes[i]) || !map.isSourceLoaded(CENA.fontes[i])) return false;
          if (!map.getSource("base") || !map.isSourceLoaded("base")) return false;
          if (!map.getSource("dem") || !map.isSourceLoaded("dem") || !map.getTerrain()) return false;
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__renderAt(0);
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});

})();
</script>
</body>
</html>
