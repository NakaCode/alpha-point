    map.addSource(id, { type: "geojson", data: data }); FONTES.push(id);
    map.addLayer({ id: id + "-sob", type: "line", source: id, layout: linhaContorno,
      paint: { "line-color": tok("--rotulo", "rgba(11,15,20,0.88)"), "line-width": o.sob || 22, "line-opacity": 0, "line-opacity-transition": semTransicao } }, antes);
    map.addLayer({ id: id + "-linha", type: "line", source: id, layout: linhaContorno,
      paint: { "line-color": tok(o.cor || "--destaque", "#F5A524"), "line-width": o.w || 10, "line-opacity": 0, "line-opacity-transition": semTransicao } }, antes);
  };
  var dadoAntes = {};
  API.setDado = function (id, chaveDado, dado) { if (dadoAntes[id] === chaveDado) return; var f = map.getSource(id); if (f) f.setData(dado); dadoAntes[id] = chaveDado; };
  API.largura = function (id, w, sob) {
    var k1 = id + "-linha|w", k2 = id + "-sob|w"; w = +(+w).toFixed(2); sob = +(+sob).toFixed(2);
    if (opAntes[k1] !== w && map.getLayer(id + "-linha")) { map.setPaintProperty(id + "-linha", "line-width", w); opAntes[k1] = w; }
    if (opAntes[k2] !== sob && map.getLayer(id + "-sob")) { map.setPaintProperty(id + "-sob", "line-width", sob); opAntes[k2] = sob; }
  };


  // ── o objeto que pousa e levanta (identidade §4.4, "a mão que arruma"): a foto impressa desce 240 px, de −2° à
  //    inclinação final, escala 0,72 → 1,03 até 0,33 s e assenta em 1,00 até 0,55 s; a sombra solta (+64 → +12 px, 1,05 → 1,
  //    0,35 → 0,80); o levantar em 350 ms (1,00 → 1,04, ease-in cúbico; opacidade a zero nos últimos 200 ms) ──────────
  API.objeto = function (id, idSombra, t, o) {
    var el = E(id), sb = idSombra ? E(idSombra) : null; if (!el) return 0;
    var rot = o.rot == null ? -1.5 : o.rot, vis = 0, esc = 1, dy = 0, r = rot, sTy = 12, sEsc = 1, sOp = 0.8;
    if (t >= o.pouso) {
      var u = t - o.pouso, a = eo(u / 0.55);
      vis = cl(u / 0.2, 0, 1);
      esc = u < 0.33 ? 0.72 + 0.31 * eo(u / 0.33) : 1.03 - 0.03 * eo((u - 0.33) / 0.22);
      dy = -(o.queda == null ? 240 : o.queda) * (1 - a);   // a queda: 240 px (identidade §4.4); menos, onde a margem não deixa r = -2 + (rot + 2) * a;
      sTy = 64 - 52 * a; sEsc = 1.05 - 0.05 * a; sOp = 0.35 + 0.45 * a;
      if (o.levanta != null && t >= o.levanta) {
        var w = cl((t - o.levanta) / 0.35, 0, 1), k = w * w * w;
        esc = 1 + 0.04 * k; sTy = 12 + 52 * k; sOp = 0.8 - 0.45 * k;
        vis = 1 - cl((t - o.levanta - 0.15) / 0.2, 0, 1);
      }
    }
    var tr = "translate(" + o.x.toFixed(2) + "px," + (o.y + dy).toFixed(2) + "px) rotate(" + r.toFixed(3) + "deg) scale(" + esc.toFixed(4) + ")";
    el.style.transform = tr; el.style.opacity = vis.toFixed(3);
    if (sb) {
      sb.style.width = el.offsetWidth + "px"; sb.style.height = el.offsetHeight + "px";
      sb.style.transform = "translate(" + o.x.toFixed(2) + "px," + (o.y + dy + sTy).toFixed(2) + "px) rotate(" + r.toFixed(3) + "deg) scale(" + (esc * sEsc).toFixed(4) + ")";
      sb.style.opacity = (vis * sOp).toFixed(3);
    }
    return vis;
  };

  var mapaCarregado = false;
  map.on("load", function () {
    try { SCENE.camadas(map, API); } catch (e) { return falhar("não consegui desenhar as camadas: " + e.message); }
    mapaCarregado = true;
    map.once("idle", function () { if (!window.__erroCena) resolverPronto(true); });
  });

  // ── rótulos ancorados por projeção, em screen-space (s03) ─────────────────────────────────────────
  function placeRotulo(r, entrada, t) {
    var el = E(r.id); if (!el) return;
    var p = r.tela ? { x: r.tela[0], y: r.tela[1] } : map.project(r.p);
    if (r.mover) { var m = r.mover(t, p); p = m || p; }
    var tx = r.lado === "direita" ? "0%" : r.lado === "esquerda" ? "-100%" : "-50%";
    var ty = r.vert === "cima" ? "-100%" : r.vert === "baixo" ? "0%" : "-50%";
    el.style.opacity = entrada.toFixed(3);
    el.style.transform = "translate(" + (p.x + (r.dx || 0)).toFixed(3) + "px," + (p.y + (r.dy || 0)).toFixed(3) + "px) translate(" + tx +
      "," + ty + ") translateY(" + ((1 - Math.min(entrada, r._sub == null ? entrada : r._sub)) * 24).toFixed(2) + "px)";
  }
  API.project = function (ll) { return map.project(ll); };
  // ── O TEXTO LISO (s03): o texto dos rótulos de classe liso, pintado em #tintaRotulos na posição exata do DOM ──
  var TL = { x4: document.createElement("canvas"), x2: document.createElement("canvas") };
  function opacidadeEfetiva(el) {
    var o = 1;
    for (var n = el; n && n.nodeType === 1; n = n.parentElement) {
      var s = getComputedStyle(n);
      if (s.display === "none" || s.visibility === "hidden") return 0;
      o *= parseFloat(s.opacity);
    }
    return o;
  }
  function pintarTextoLiso() {
    var cv = E("tintaRotulos"); if (!cv) return;
    var g = cv.getContext("2d"), cr = cv.getBoundingClientRect(), k = cr.width / cv.width || 1;
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.clearRect(0, 0, cv.width, cv.height);
    var els = document.querySelectorAll(".rotulo.liso");
    for (var i = 0; i < els.length; i++) {
      var el = els[i], tn = el.firstChild, op = opacidadeEfetiva(el);
      if (el.childNodes.length !== 1 || !tn || tn.nodeType !== 3) { falhar("o rótulo " + el.id + " não é um texto só: o texto liso não o pintaria."); return; }
      if (!(op > 0) || !tn.data) continue;
      var cs = getComputedStyle(el), fs = parseFloat(cs.fontSize), ls = parseFloat(cs.letterSpacing) || 0;
      var fonte = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
      var rg = document.createRange(); rg.selectNodeContents(el); var rr = rg.getBoundingClientRect();
      var g4 = TL.x4.getContext("2d"); g4.font = fonte; g4.letterSpacing = ls + "px";
      var m = g4.measureText(tn.data), A = m.fontBoundingBoxAscent, D = m.fontBoundingBoxDescent;
      var bx = (rr.left - cr.left) / k, by = (rr.top - cr.top) / k + A, pad = Math.ceil(fs * 0.5);
      var x0 = Math.floor(bx) - pad, y0 = Math.floor(by - A) - pad;
      var W = Math.ceil(m.width + Math.abs(ls)) + 2 * pad + 1, H = Math.ceil(A + D) + 2 * pad + 1;
      if (x0 > cv.width || y0 > cv.height || x0 + W < 0 || y0 + H < 0) continue;
      if (TL.x4.width < W * 4 || TL.x4.height < H * 4) { TL.x4.width = Math.max(TL.x4.width, W * 4); TL.x4.height = Math.max(TL.x4.height, H * 4); }
      if (TL.x2.width < W * 2 || TL.x2.height < H * 2) { TL.x2.width = Math.max(TL.x2.width, W * 2); TL.x2.height = Math.max(TL.x2.height, H * 2); }
      g4 = TL.x4.getContext("2d"); g4.setTransform(1, 0, 0, 1, 0, 0); g4.clearRect(0, 0, W * 4, H * 4);
      g4.setTransform(4, 0, 0, 4, 0, 0); g4.font = fonte; g4.letterSpacing = ls + "px"; g4.fillStyle = cs.color;
      g4.textBaseline = "alphabetic"; g4.textAlign = "left"; g4.fillText(tn.data, bx - x0, by - y0);
      var g2 = TL.x2.getContext("2d"); g2.setTransform(1, 0, 0, 1, 0, 0); g2.clearRect(0, 0, W * 2, H * 2);
      g2.imageSmoothingEnabled = true; g2.imageSmoothingQuality = "low"; g2.drawImage(TL.x4, 0, 0, W * 4, H * 4, 0, 0, W * 2, H * 2);
      g.globalAlpha = op; g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "low";
      g.drawImage(TL.x2, 0, 0, W * 2, H * 2, x0, y0, W, H);
    }
    g.globalAlpha = 1;
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { try { pintarTextoLiso(); } catch (e) {} });

  // ── os créditos: o de mapa inteiro desde o 1º quadro de mapa (sem entrada); os outros entram em 300 ms e empilham
  //    acima dele, na faixa abaixo de y = 1880 ──────────────────────────────────────────────────────────
  function creditos(t) {
    var base = 52;
    (CENA.creditos || []).forEach(function (c) {
      var el = E(c.id); if (!el) return;
      var v = c.janelas ? (c.janelas.some(function (j) { return t >= j[0] && t < j[1]; }) ? 1 : 0)   // M3
        : c.mapa ? ((t >= (c.entra || 0)) && (c.sai == null || t < c.sai) ? 1 : 0) : janela(t, c.entra, c.sai);
      el.style.opacity = v.toFixed(3);
      el.style.bottom = base + "px";
      if (v > 0) base += el.offsetHeight + 10;   // M2: o crédito que não está no quadro não ocupa lugar na pilha
    });
  }

  // ── a legenda das cores (não usada nestas duas cenas; fica do motor) ──────────────────────────────
  function legendaCores(t) {
    var lg = E("legenda"); if (!lg || !CENA.legenda) return;
    var L = CENA.legenda, v = 0, sub = 1;
    (L.janelas || [[L.entra, L.sai]]).forEach(function (j) {
      var x = janela(t, j[0], j[1]);
      if (x > v) { v = x; sub = eo(seg(t, j[0], 0.3)); }
    });
    lg.style.opacity = v.toFixed(3);
    lg.style.transform = "translateY(" + ((1 - sub) * 24).toFixed(1) + "px)";
  }

  // ── os anéis (identidade §4.4): 56 px, traço de 10 em --destaque, com o halo escuro da s03; dois pulsos e para ──
  function anelQuadro(t) {
    (CENA.aneis || []).forEach(function (a) {
      var g = E(a.id); if (!g) return;
      var pa = map.project(a.p);
      g.setAttribute("transform", "translate(" + pa.x.toFixed(2) + " " + pa.y.toFixed(2) + ")");
      g.setAttribute("opacity", janela(t, a.entra, a.sai).toFixed(3));
      (a.pulsos || []).forEach(function (t0, k) {
        var u = (t - t0) / 1.2, c = E(a.id + "P" + (k + 1));
        if (!c) return;
        var vivo = u >= 0 && u < 1;
        c.setAttribute("transform", "scale(" + (1 + 0.8 * (vivo ? u : 0)).toFixed(4) + ")");
        c.setAttribute("opacity", vivo ? (1 - u).toFixed(3) : "0");
      });
    });
  }

  function aplicar(t) {
    if (!mapaCarregado) return;
    map.jumpTo(cameraAt(t));
    SCENE.quadro(t, API);
    (CENA.rotulos || []).forEach(function (r) {
      var v = r.op ? r.op(t) : janela(t, r.entra, r.sai, r.dIn, r.dOut);
      r._sub = r.entra != null ? eo(seg(t, r.entra, r.dIn == null ? 0.3 : r.dIn)) : 1;
      placeRotulo(r, v, t);
    });
    if (SCENE.depois) SCENE.depois(t, API);
    pintarTextoLiso();
    legendaCores(t);
    anelQuadro(t);
    creditos(t);
  }

  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // NUNCA lança
  };

  // pronto quando nenhum tile da base está carregando e os níveis à vista são no máximo dois, vizinhos (s03)
  function nivelUnico() {
    try {
      if (map.getTerrain() || map.getPitch() > 1) return true;
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      var cache = sc.base; if (!cache) return true;
      var todos = cache._tiles || {};
      for (var k in todos) { var st = todos[k] && todos[k].state; if (st === "loading" || st === "reloading") return false; }
      var ids = cache.getRenderableIds ? cache.getRenderableIds() : Object.keys(todos);
      var zs = ids.map(function (id) { var x = todos[id]; return x && x.tileID && x.tileID.canonical ? x.tileID.canonical.z : null; })
        .filter(function (z) { return z !== null; });
      if (!zs.length) return false;
      return Math.max.apply(null, zs) - Math.min.apply(null, zs) <= 1;
    } catch (e) { return true; }
  }
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) {
        var ts = (sc[id] && sc[id]._tiles) || {};
        for (var k in ts) if (ts[k] && ts[k].state === "errored") return id;
      }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou (HTTP 404 ou resposta inválida). O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) if (!map.isSourceLoaded(FONTES[i])) return false;
          if (!map.isSourceLoaded("base")) return false;
          if (CENA.agua && (!map.getSource("aguaBase") || !map.isSourceLoaded("aguaBase"))) return false;
          return nivelUnico();
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.jumpTo({ center: map.getCenter() }); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo; se repetir, confira a conexão.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    window.__renderAt(0);
    return true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
</body>
</html>
