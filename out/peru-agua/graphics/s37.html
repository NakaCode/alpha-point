      var k0 = RIO_KM[j - 1], k1 = RIO_KM[j], e = engrosso((k0 + k1) / 2);
      ctx.lineWidth = RIM.fino + (RIM.grosso - RIM.fino) * e;
      var n = Math.max(1, Math.ceil(Math.sqrt((q.x - a.x) * (q.x - a.x) + (q.y - a.y) * (q.y - a.y)) / CORRENTEZA.passoPx));
      for (var s = 0; s < n; s++) {

  }
  // a pílula 'Rímac': presa ao vértice-âncora, acima do rio; o mesmo lugar e o mesmo tamanho dos dois lados do corte
  function porPilulaRimac(el, sobe) {
    if (!el || !map || !RIO_C) return;
    var p = map.project(RIO_C[RIM.ancora]);
    el.style.transform = "translate(" + (p.x - el.offsetWidth / 2).toFixed(2) + "px," + (p.y + RIM.pilulaDy - el.offsetHeight / 2 + (sobe || 0)).toFixed(2) + "px)";
  }

  window.__fotosProntas = true;
  if (prepararRio()) iniciarMapa({ geos: ["rio-rimac"], fontes: {}, camadas: [], c0: cameraRimac(IN), creditoMapa: TEXTOS.crMapa });

  function entra(el, t, t0, base) {   // 300 ms, opacidade + 24 px de subida (identidade §4.4)
    var q = eo(seg(t, t0, 0.3)); if (el) el.style.opacity = q.toFixed(3); return 24 * (1 - q);
  }
  function cena(t) {
    t = t + 0.0005;
    if (map && mapaCarregado) map.jumpTo(cameraRimac(IN + t));
    // FINO o tempo todo nesta cena, com a correnteza LENTA (o rio baixo) no tempo absoluto (atravessa o corte para a s38)
    if (mapaCarregado) desenharRio(E("rio"), function () { return 0; }, 1, correntezaRimac(IN + t, null));
    var rr = E("rotRimac"); var dy = entra(rr, t, T.rimac); porPilulaRimac(rr, dy);
    var lm = E("legMes"); var dl = entra(lm, t, T.mes); if (lm) lm.style.transform = "translate(200px," + f2(160 + dl) + "px)";
    // os créditos: o de mapa do 1º ao último quadro; a fonte entra em "runs" e empilha acima dele
    var cm = E("crMapa"), cf = E("crFonte"), base = 52;
    if (cm) { cm.style.opacity = "1"; cm.style.bottom = base + "px"; base += cm.offsetHeight + 10; }
    if (cf) { cf.style.opacity = eo(seg(t, T.mes, 0.3)).toFixed(3); cf.style.bottom = base + "px"; }
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); return true; };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  window.__ready.then(function () { window.__renderAt(0); }, function () {});
  // O GANCHO DE MEDIDA da passagem s37 → s38 (só leitura, do DOM): a caixa da pílula e a câmera no instante t
  window.__passagem = function (t) {
    t = clamp(+t || 0, 0, DUR); window.__renderAt(t);
    var r = E("rotRimac").getBoundingClientRect(), c = map ? map.getCenter() : null;
    return { t: t, T: IN + t, pilula: [r.left, r.top, r.width, r.height], centro: c ? [c.lng, c.lat] : null, zoom: map ? map.getZoom() : null };
  };
  window.__renderAt(0);
})();
