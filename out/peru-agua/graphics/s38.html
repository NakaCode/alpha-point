  function desenharRio(cv, engrosso, opac) {
    if (!cv || !map || !RIO_C) return;
    var ctx = cv.getContext("2d"); ctx.clearRect(0, 0, cv.width, cv.height);
    if (opac <= 0) return;
    if (!COR_RIO) {
      var sob = corDe("--fronteira-contorno-cor"), m = /rgba?\(([^)]*)\)/.exec(sob), v = m ? m[1].split(",").map(Number) : [0, 0, 0, 0.6];
      COR_RIO = { sob: "rgb(" + v[0] + "," + v[1] + "," + v[2] + ")", sobAlfa: v.length > 3 ? v[3] : 1, linha: corDe("--destaque") };
      BUF_RIO = document.createElement("canvas"); BUF_RIO.width = cv.width; BUF_RIO.height = cv.height;
    }
    var P = RIO_C.map(function (c) { return map.project(c); });
    function tracar(c2, cor, w0, w1) {
      c2.strokeStyle = cor; c2.lineCap = "round"; c2.lineJoin = "round";
      for (var i = 1; i < P.length; i++) {
        var a = P[i - 1], q = P[i];
        if ((a.x < -200 && q.x < -200) || (a.x > 4040 && q.x > 4040) || (a.y < -200 && q.y < -200) || (a.y > 2360 && q.y > 2360)) continue;
        var e = engrosso((RIO_KM[i - 1] + RIO_KM[i]) / 2);
        c2.lineWidth = w0 + (w1 - w0) * e;
        c2.beginPath(); c2.moveTo(a.x, a.y); c2.lineTo(q.x, q.y); c2.stroke();
      }
    }
    var b = BUF_RIO.getContext("2d"); b.clearRect(0, 0, BUF_RIO.width, BUF_RIO.height);
    tracar(b, COR_RIO.sob, RIM.finoSob, RIM.grossoSob);
    ctx.globalAlpha = COR_RIO.sobAlfa * opac; ctx.drawImage(BUF_RIO, 0, 0);
    ctx.globalAlpha = opac; tracar(ctx, COR_RIO.linha, RIM.fino, RIM.grosso);
    ctx.globalAlpha = 1;
  }
  // a pílula 'Rímac': presa ao vértice-âncora, acima do rio; o mesmo lugar e o mesmo tamanho dos dois lados do corte
  function porPilulaRimac(el, sobe) {
    if (!el || !map || !RIO_C) return;
    var p = map.project(RIO_C[RIM.ancora]);
    el.style.transform = "translate(" + (p.x - el.offsetWidth / 2).toFixed(2) + "px," + (p.y + RIM.pilulaDy - el.offsetHeight / 2 + (sobe || 0)).toFixed(2) + "px)";
  }

  // ═══ b0: a cheia que desce o rio (o engrossar) ═══
  var KM_A = null, KM_B = null;
  function engrossoEm(t) {
    return function (km) {
      var tc = km <= KM_A ? T.cheia : (km >= KM_B ? T.cheiaFim : lerp(T.cheia, T.cheiaFim, (km - KM_A) / (KM_B - KM_A)));
      var p = seg(t, tc, T.cheiaSobe); return p * p * (3 - 2 * p);
    };
  }

  // ═══ b2: as lagoas ═══
  var LAG = { c: [-76.312, -11.392], z0: 12.95, z1: 13.30, b0: -1.5, b1: 1.5 };
  function cameraLagoas(t) {
    var u = clamp((t - T.lagoas) / (DUR - T.lagoas), 0, 1);
    return { center: LAG.c, zoom: lerp(LAG.z0, LAG.z1, u), bearing: lerp(LAG.b0, LAG.b1, u), pitch: 0 };
  }
  var MARCA_ANC = null;   // o lado leste da lagoa de Marcapomacocha, na latitude média dela
  var COR = null;
  window.__fotosProntas = true;
  (function () {
    if (!prepararRio()) return;
    KM_A = RIO_KM[425]; KM_B = RIO_KM[492];
    var L = geo("lagoas-marcapomacocha-antacoto"); if (!L) return;
    var mp = (L.features || []).filter(function (f) { return f.properties && f.properties.osm_name === "Marcapomacocha"; })[0];
    if (!mp) return falhar("a lagoa Marcapomacocha não está em lagoas-marcapomacocha-antacoto.");
    var anel = mp.geometry.coordinates[0], lon = -999, lat = 0;
    anel.forEach(function (c) { if (c[0] > lon) lon = c[0]; lat += c[1] / anel.length; });
    MARCA_ANC = [lon, lat];
    COR = { contra: corDe("--contraparte"), sob: corDe("--fronteira-contorno-cor") };
    iniciarMapa({ geos: ["rio-rimac", "lagoas-marcapomacocha-antacoto"], fontes: { lagoas: L },
      camadas: [
        { id: "lag-fill", type: "fill", source: "lagoas", paint: { "fill-color": COR.contra, "fill-opacity": 0 } },
        { id: "lag-sob", type: "line", source: "lagoas", layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": COR.sob, "line-width": 14, "line-opacity": 0 } },
        { id: "lag-lin", type: "line", source: "lagoas", layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": COR.contra, "line-width": 6, "line-opacity": 0 } }
      ], c0: cameraRimac(IN), creditoMapa: TEXTOS.crMapa });
  })();
  var opAntes = {};
  function opac(id, prop, v) { var k = id + prop; if (opAntes[k] === v || !map || !map.getLayer(id)) return; map.setPaintProperty(id, prop, v); opAntes[k] = v; }

  // ═══ b1: a mesa ═══
  var BY = 1500, W = 480, DX = 150, DY = -90, KQ = 35;   // a base, a frente, a profundidade, px por m³/s
  var XA = 760, XB = 1640;                                  // o canto esquerdo da frente de cada coluna
  function prisma(x, h) {
    var y = BY - h;
    var vis = "M" + x + "," + BY + " L" + (x + W) + "," + BY + " L" + (x + W) + "," + f2(y) + " L" + x + "," + f2(y) + " Z" +
      " M" + x + "," + f2(y) + " L" + (x + DX) + "," + f2(y + DY) + " L" + (x + W + DX) + "," + f2(y + DY) + " L" + (x + W) + "," + f2(y) +
      " M" + (x + W + DX) + "," + f2(y + DY) + " L" + (x + W + DX) + "," + (BY + DY) + " L" + (x + W) + "," + BY;
    var oc = "M" + x + "," + BY + " L" + (x + DX) + "," + (BY + DY) + " L" + (x + W + DX) + "," + (BY + DY) +
      " M" + (x + DX) + "," + (BY + DY) + " L" + (x + DX) + "," + f2(y + DY);
    return { vis: vis, oc: oc };
  }
  // a altura da coluna da direita: pousa a 30 e cai pela recessão (dois reservatórios em série, amortecimento crítico)
  function alturaB(t) {
    var hA = 30 * KQ, hB = 7.8 * KQ;
    if (t <= T.cai) return hA;
    var x = (t - T.cai) / T.tau, r = (hA - hB) * (1 + x) * Math.exp(-x);
    return r < 0.5 ? hB : hB + r;   // repouso declarado: < 0,5 px
  }
  // o POUSO de uma peça (0,45 s: desce 60 px, 1,06 → 1,03 → 1,00; a sombra solta encolhe), como a s41
  function pouso(t, t0) {
    var p = eo(seg(t, t0, 0.30)), q1 = eo(seg(t, t0, 0.25)), q2 = eo(seg(t, t0 + 0.25, 0.20));
    return { op: t < t0 ? 0 : eo(seg(t, t0, 0.12)), dy: -60 * (1 - p), k: t < t0 + 0.25 ? lerp(1.06, 1.03, q1) : lerp(1.03, 1.00, q2), ar: 1 - eo(seg(t, t0, 0.45)) };
  }
  function coluna(pref, x, h, t, t0) {
    var P = pouso(t, t0), g = E("col" + pref); if (!g) return;
    var cx = x + (W + DX) / 2, cy = BY - h / 2;
    g.setAttribute("transform", "translate(0," + f2(P.dy) + ") translate(" + f2(cx) + "," + f2(cy) + ") scale(" + P.k.toFixed(5) + ") translate(" + f2(-cx) + "," + f2(-cy) + ")");
    g.setAttribute("opacity", P.op.toFixed(3));
    var pr = prisma(x, h);
    E("col" + pref + "vis").setAttribute("d", pr.vis); E("col" + pref + "oc").setAttribute("d", pr.oc);
    var s = E("col" + pref + "som"); s.setAttribute("d", pr.vis);
    s.setAttribute("transform", "translate(0," + f2(lerp(12, 64, P.ar)) + ")"); s.setAttribute("opacity", (lerp(0.8, 0.35, P.ar) * 0.6).toFixed(3));
  }
  function texto(el, t, t0, x, y) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translate(" + f2(x) + "px," + f2(y + (1 - p) * 24) + "px)";
  }
  function centroX(el, cx) { return el ? cx - el.offsetWidth / 2 : 0; }
  function luz(x, y) { var l = E("luz"); if (!l) return; l.style.setProperty("--luz-x", (x + 140).toFixed(1) + "px"); l.style.setProperty("--luz-y", (y + 140).toFixed(1) + "px"); }
  function mesaQuadro(t) {
    var tm = t - T.mesa;
    var c = E("cam"), s = 1 + 0.0024 * tm, dx = 6 * Math.sin(tm * 0.23), dy = 4.8 * Math.sin(tm * 0.17);
    if (c) c.style.transform = "scale(" + s.toFixed(5) + ") translate(" + f2(dx) + "px," + f2(dy) + "px)";
    var st = E("still"); if (st) st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ") translate(" + f2(dx * 0.6) + "px," + f2(dy * 0.6) + "px)";
    luz(1520, 1060);
    coluna("A", XA, 30 * KQ, t, T.colA);
    coluna("B", XB, alturaB(t), t, T.colB);
    var tt = E("legTitulo"), rd = E("rotDez"), rm = E("rotMai"), hq = E("heroiQuarto");
    texto(tt, t, T.mesa, XA, 200);
    texto(rd, t, T.colA, centroX(rd, XA + W / 2), BY + 50);
    texto(rm, t, T.colB, centroX(rm, XB + W / 2), BY + 50);
    texto(hq, t, T.quarto, XB - 120, 400);
    var cd = E("credDef"); if (cd) cd.style.opacity = eo(seg(t, T.mesa, 0.3)).toFixed(3);
  }

  function cena(t) {
    t = t + 0.0005;
    var b0 = t < T.mesa, b1 = !b0 && t < T.lagoas, b2 = t >= T.lagoas;
    var vm = E("vistaMesa"), mp = E("map");
    if (vm) vm.style.opacity = b1 ? "1" : "0";
    if (mp) mp.style.opacity = b1 ? "0" : "1";
    // a câmera do mapa: o Rímac no b0; as lagoas no b2 (e paradas no enquadramento de 9,4 durante a mesa, para pedir os tiles)
    if (map && mapaCarregado) map.jumpTo(b0 ? cameraRimac(IN + t) : cameraLagoas(Math.max(t, T.lagoas)));
    if (mapaCarregado) desenharRio(E("rio"), engrossoEm(t), b0 ? 1 : 0);
    var rr = E("rotRimac"); if (rr) { rr.style.opacity = b0 ? "1" : "0"; if (b0) porPilulaRimac(rr, 0); }
    var lm = E("legMes"); if (lm) { var q = b0 ? eo(seg(t, T.mes, 0.3)) : 0; lm.style.opacity = q.toFixed(3); lm.style.transform = "translate(200px," + f2(160 + 24 * (1 - q)) + "px)"; }
    // b2: as lagoas acendem em 500 ms; a pílula e a legenda
    var fl = b2 ? eo(seg(t, T.lagoas, 0.5)) : 0;
    opac("lag-fill", "fill-opacity", +(0.35 * fl).toFixed(3)); opac("lag-sob", "line-opacity", +fl.toFixed(3)); opac("lag-lin", "line-opacity", +fl.toFixed(3));
    var rl = E("rotLaguna");
    if (rl) {
      if (b2 && map && mapaCarregado && MARCA_ANC) {
        var p = map.project(MARCA_ANC), qq = eo(seg(t, T.laguna, 0.3));
        rl.style.opacity = qq.toFixed(3);
        rl.style.transform = "translate(" + f2(p.x + 90) + "px," + f2(p.y - rl.offsetHeight / 2 + 24 * (1 - qq)) + "px)";
      } else rl.style.opacity = "0";
    }
    var ls = E("legSedapal"); if (ls) { var qs = b2 ? eo(seg(t, T.sedapal, 0.3)) : 0; ls.style.opacity = qs.toFixed(3); ls.style.transform = "translate(200px," + f2(160 + 24 * (1 - qs)) + "px)"; }
    if (b1) mesaQuadro(t);
    var cm = E("crMapa"); if (cm) { cm.style.opacity = b1 ? "0" : "1"; cm.style.bottom = "52px"; }
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); return true; };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  window.__ready.then(function () { window.__renderAt(0); }, function () {});
  // O GANCHO DE MEDIDA da passagem s37 → s38 (só leitura, do DOM): a caixa da pílula e a câmera no instante t
  window.__passagem = function (t) {
    t = clamp(+t || 0, 0, DUR); window.__renderAt(t);
    var r = E("rotRimac").getBoundingClientRect(), c = map ? map.getCenter() : null;
    return { t: t, T: IN + t, pilula: [r.left, r.top, r.width, r.height], centro: c ? [c.lng, c.lat] : null, zoom: map ? map.getZoom() : null };
  };
  // a altura medida da coluna da direita, do DOM (a caixa do traço visível), para provar o repouso e a razão
  window.__s38coluna = function (t) {
    t = clamp(+t || 0, 0, DUR); window.__renderAt(t);
    var a = E("colAvis").getBBox(), b = E("colBvis").getBBox();
    return { t: t, alturaA: a.height, alturaB: b.height, razaoFrente: (b.height + DY) / (a.height + DY) };
  };
  window.__renderAt(0);
})();
</script>
