    if (st) return "respondeu HTTP " + st + ".";
    return "não respondeu (sem internet? servidor fora do ar? firewall?)" + n + ".";
  }
  var mapaCarregado = false;
  map.on("error", function (ev) {
    window.__errosMapa++;
    var err = (ev && ev.error) || {};
    var msg = String(err.message || "");
    var deRede = err.status || err.url || (ev && ev.tile) || /fetch|network|failed to load|load failed|cors/i.test(msg);
    if (!deRede) return falhar("o MapLibre acusou erro na cena: " + (msg || "sem descrição") + ".");
    var fonte = ev && ev.sourceId ? " (fonte '" + ev.sourceId + "')" : (mapaCarregado ? "" : " (o estilo do mapa)");
    falhar("a base '" + P.nome + "'" + fonte + " " + motivoRede(err, msg) + (err.url ? " URL: " + String(err.url).split("?")[0] : ""));
  });
  map.on("load", function () {
    try { map.setTerrain({ source: "dem", exaggeration: 0 }); } catch (e) { return falhar("não consegui ligar o relevo: " + e.message); }
    mapaCarregado = true;
    map.once("idle", function () { if (!window.__erroCena) resolverPronto(true); });
  });

  // ── as camadas do mapa: só sobre a geometria real ──
  var ultimo = {};
  function dados(id, fc, k) { if (ultimo[id] === k) return; var s = map.getSource(id); if (s) s.setData(fc); ultimo[id] = k; }
  var opAntes = {};
  function opac(id, prop, v) { v = +(+v).toFixed(3); var k = id + "|" + prop; if (opAntes[k] === v) return; map.setPaintProperty(id, prop, v); opAntes[k] = v; }

  // ── o mapa num quadro: câmera, relevo (exagero e a cota do centro, _elevationFreeze), camadas, e a textura das linhas
  //    sobre o relevo refeita a cada quadro (freeRtt, s44 do Juneau, como a s39) ──
  function mapaQuadro(t) {
    if (!mapaCarregado) return;
    var ex = exageroAt(t);
    if (!map.getTerrain()) map.setTerrain({ source: "dem", exaggeration: ex });
    map.jumpTo(cameraAt(t));
    if (map.terrain) map.terrain.exaggeration = ex;
    map._elevationFreeze = true;
    window.__exagero = ex;
    var ce = cotaAt(t) * ex;
    if (map.terrain && map.transform.elevation !== ce) map.transform.elevation = ce;
    camadasMapa(t);
    if (map.terrain) {
      var tsc = map.terrain.sourceCache;
      if (!tsc || typeof tsc.freeRtt !== "function") return falhar("o MapLibre desta cena não tem terrain.sourceCache.freeRtt.");
      tsc.freeRtt(); map.triggerRepaint();
    }
  }

    // (copiado sem mudança da s39 deste vídeo, sha1 c6a5f6eee701…, linhas 845–889)
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou. O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  // pronto: os tiles da base E do relevo carregados, o terreno ligado, o mapa parado (contrato do mapista §3)
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < CENA.fontes.length; i++) if (!map.getSource(CENA.fontes[i]) || !map.isSourceLoaded(CENA.fontes[i])) return false;
          if (!map.getSource("base") || !map.isSourceLoaded("base")) return false;
          if (!map.getSource("dem") || !map.isSourceLoaded("dem") || !map.getTerrain()) return false;
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  // ── os rótulos do mapa (screen-space, mapista §7): âncora no mapa (ll, projetada a cada quadro) ou fixa na tela (tela); entram em
  //    300 ms (opacidade + 24 px de subida) e terminam de sair no t1 do textos-tela ("corte" = inteiros até o corte); o que a câmera
  //    leva para perto da margem, da faixa do crédito ou do canto reservado esmaece (60 px), como na s39 ──
  function naArea(l, tp, w, h) {   // distância (px) da caixa à área segura; o canto 400 × 400 conta
    var r = l + w, b = tp + h;
    return Math.min(l - 200, 3640 - r, tp - 160, 1880 - b, Math.max(3440 - r, 1760 - b));
  }
  function rotulosMapa(t) {
    ROT.forEach(function (r) {
      var el = E(r.id); if (!el) return;
      var dentro = t >= r.entra && (r.sai == null || t < r.sai);
      var vin = r.entraCorte ? 1 : eo(seg(t, r.entra, 0.3));
      var vout = r.sai != null && !r.saiCorte ? 1 - eio(seg(t, r.sai - 0.3, 0.3)) : 1;
      var v = dentro ? vin * vout : 0;
      if (v <= 0 || !mapaCarregado) { el.style.opacity = "0"; el.style.visibility = "hidden"; r._v = 0; return; }
      var x, y;
      if (r.tela) { x = r.tela[0]; y = r.tela[1]; }
      else { var p = map.project(r.ll); x = p.x; y = p.y; }
      x += r.dx || 0; y += r.dy || 0;
      var w = el.offsetWidth, h = el.offsetHeight;
      var fx = r.lado === "direita" ? 0 : r.lado === "esquerda" ? 1 : 0.5;
      var l = x - w * fx, tp = y - h / 2 + (1 - vin) * 24;
      v *= cl(naArea(l, tp, w, h) / 60, 0, 1);
      el.style.opacity = v.toFixed(3);
      el.style.visibility = v > 0 ? "visible" : "hidden";
      el.style.transform = "translate(" + l.toFixed(2) + "px," + tp.toFixed(2) + "px)";
      r._v = v; r._l = l; r._t = tp; r._w = w; r._h = h;
    });
  }

  // ═══ A MESA (identidade §5, satélite sob a luz; §4.4, "a mão que arruma") ═══════════════════════════════════════
  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" + rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = cl(op, 0, 1).toFixed(3);
  }
  // o pouso do CARD (o objeto da mesa, como a s46): desce 240 px, escala 0,72 → 1,03 até 0,33 s e ASSENTA 1,03 → 1,00 até 0,55 s
  // (220 ms, --mov-assentamento), uma vez, sem voltar
  function pousoCard(t, t0) {
    var p = eo(seg(t, t0, 0.33)), q = eo(seg(t, t0 + 0.33, 0.22)), pt = eo(seg(t, t0, 0.55));
    return { op: t >= t0 ? 1 : 0, dy: 240 * (1 - pt), k: t < t0 + 0.33 ? lerp(0.72, 1.03, p) : lerp(1.03, 1.00, q), p: pt };
  }
  // a SOMBRA SOLTA do objeto: no ar +64 px, 1,05, 0,35; assentada +12 px, 1,00, 0,80 (só transform e opacity)
  function sombra(el, g, s, rot) {
    if (!el) return;
    var sy = lerp(64, 12, s.p), sk = lerp(1.05, 1.00, s.p), so = lerp(0.35, 0.80, s.p) * s.op;
    por(el, g.cx, g.cy - s.dy + sy, g.w, g.h, rot, sk * s.k, so);
  }
  // o texto que entra (300 ms, opacidade + 24 px de subida) e sai (300 ms, terminando em tSai)
  function textoMesa(el, t, t0, tSai) {
    if (!el) return 0;
    var p = eo(seg(t, t0, 0.3)), q = tSai != null ? eio(seg(t, tSai - 0.3, 0.3)) : 0;
    el.style.opacity = (p * (1 - q)).toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * 24 + q * 24).toFixed(1) + "px)";
    return p * (1 - q);
  }
  // a CÂMERA da mesa: em cada trecho, o push-in do RIG (0,0024/s) a partir da escala do trecho, até "para"; a deriva do RIG por
  // cima (±6 / ±4,8 px); o still acompanha a --mesa-satelite-paralaxe (0,6). Origem no centro do palco.
  function escalaMesa(t) {
    var s = 1, M = CENA.mesaCam;
    for (var i = 0; i < M.length; i++) if (t >= M[i].t0) s = M[i].s0 + 0.0024 * (Math.min(t, M[i].para) - M[i].t0);
    return s;
  }
  function cameraMesa(t) {
    var c = E("cam"), td = Math.min(t, DUR - 0.25);
    var s = escalaMesa(t), dx = 6 * Math.sin(td * 0.23), dy = 4.8 * Math.sin(td * 0.17);
    if (c) c.style.transform = "scale(" + s.toFixed(5) + ") translate(" + f2(dx) + "px," + f2(dy) + "px)";
    var st = E("still"); if (st) st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ") translate(" + f2(dx * 0.6) + "px," + f2(dy * 0.6) + "px)";
  }
  // a LUZ: o véu da mesa segue o centro do objeto principal com 120 ms de atraso (--mov-luz-atraso); a cena dá o alvo
  function luzEm(x, y) { var l = E("luz"); if (!l) return; l.style.setProperty("--luz-x", (x + 140).toFixed(1) + "px"); l.style.setProperty("--luz-y", (y + 140).toFixed(1) + "px"); }
  function naMesa(t) { for (var i = 0; i < CENA.mesas.length; i++) if (t >= CENA.mesas[i][0] && t < CENA.mesas[i][1]) return true; return false; }
  // a vista: a mesa e o mapa trocam por CORTE SECO (troca de regime, identidade §4.4)
  function vista(t) {
    var m = naMesa(t), vm = E("vistaMesa"), mp = E("map"), ov = E("ov"), rt = E("rotulos");
    if (vm) vm.style.opacity = m ? "1" : "0";
    if (mp) mp.style.opacity = m ? "0" : "1";
    if (ov) ov.style.opacity = m ? "0" : "1";
    if (rt) rt.style.opacity = m ? "0" : "1";
    return m;
  }
  // os CRÉDITOS: cada linha na sua vaga fixa, com as janelas do textos-tela. Cada janela é [a, b, entra, sai]: "corte" = inteira
  // desde o 1º quadro (o crédito de mapa, que a licença pede em todo quadro de mapa, e o que atravessa um corte) ou até o último;
  // "fade" = 300 ms (entra em a; termina de sair em b). b null = até o fim da cena.
  function creditos(t) {
    CRED.forEach(function (x) {
      var el = E(x.id); if (!el) return;
      var v = 0;
      for (var i = 0; i < x.jan.length; i++) {
        var J = x.jan[i], a = J[0], b = J[1];
        if (t < a || (b != null && t >= b)) continue;
        var vi = (J[2] === "fade" ? eo(seg(t, a, 0.3)) : 1) * (b != null && J[3] === "fade" ? 1 - eio(seg(t, b - 0.3, 0.3)) : 1);
        v = Math.max(v, vi);
      }
      el.style.opacity = v.toFixed(3); el.style.visibility = v > 0 ? "visible" : "hidden";
    });
  }

  // ═══ O CARD SEM FOTO (b1): a pílula do nome no meio da mesa, o cargo logo abaixo, alinhado à esquerda dela ═══
  var CARD = { t0: 7.7, cargo: 7.833, topo: 860, w: 0, h: 0, cx: 1920, cy: 1000 }, SOMB = { w: 0, h: 0, cx: 1920, cy: 0 };
  var medidoCard = false;
  function medirCard() {
    var nm = E("nome"), cg = E("cargo"), g = E("card"), sh = E("cardSombra");
    if (!nm || !cg || !g || nm.offsetWidth < 10) return;
    var wn = nm.offsetWidth, hn = nm.offsetHeight;
    cg.style.top = (hn + 24) + "px";
    CARD.w = Math.max(wn, cg.offsetWidth); CARD.h = hn + 24 + cg.offsetHeight;
    g.style.width = CARD.w + "px"; g.style.height = CARD.h + "px";
    var x0 = 1920 - wn / 2;                                  // a pílula centrada no palco; o cargo começa na borda dela
    CARD.cx = x0 + CARD.w / 2; CARD.cy = CARD.topo + CARD.h / 2;
    SOMB.w = wn; SOMB.h = hn; SOMB.cx = 1920; SOMB.cy = CARD.topo + hn / 2;
    if (sh) { sh.style.width = wn + "px"; sh.style.height = hn + "px"; }
    window.__s48card = { pilula: [x0, CARD.topo, wn, hn], cargo: [x0, CARD.topo + hn + 24, cg.offsetWidth, cg.offsetHeight] };
    medidoCard = true;
  }
  function mesaQuadro(t) {
    if (!medidoCard) medirCard();
    cameraMesa(t);
    var a = pousoCard(t, CARD.t0);
    sombra(E("cardSombra"), SOMB, a, 0);
    por(E("card"), CARD.cx, CARD.cy - a.dy, CARD.w, CARD.h, 0, a.k, a.op);
    textoMesa(E("cargo"), t, CARD.cargo);
    var tl = t - 0.12, al = pousoCard(tl, CARD.t0);                       // a luz, 120 ms atrás do centro do card
    luzEm(SOMB.cx, tl < CARD.t0 ? 1080 : SOMB.cy - al.dy + 60);
  }

  function quadro(t) {
    t = t + 0.0005;
    var m = vista(t);
    mapaQuadro(t);
    rotulosMapa(t);
    if (m) mesaQuadro(t);
    creditos(t);
  }
  window.__fotosProntas = R.prontas().then(function () { medidoCard = false; medirCard(); return true; });

  window.__renderAt = function (t) {
    try { quadro(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }
  };
  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});

})();
</script>
</body>
