<!--
  CANAL ALPHA POINT — cena de TESTE da base Landsat (25/09/2026), feita do molde mapa-base.html da pré-v1
  (preparar-cena.mjs prova-mapa --molde=landsat-juneau). Ilustra a frase 10 do roteiro de Juneau:
  "Its roads run about 43 miles north, to Cascade Point, and stop."

  O que o canal mudou no molde, e por quê:
    · A BASE: os perfis da pré-v1 (aberto, vetorial, maptiler) não têm Landsat, e perfis.json é do motor
      (não se edita). O canal escolheu Landsat (identidade §6: domínio público, regional). Então a cena lê
      window.__BASE_CANAL (../_media/base/<nome>.js, gravado pelo canal com a procedência) e, se ele existe,
      usa-o NO LUGAR do perfil: uma fonte "image" do MapLibre, já em Web Mercator, sem rede. Sem ele, vale o
      perfil do molde, como antes. Todo o resto do molde (erro legível, nova tentativa, espera de tiles,
      contrato de captura) ficou igual.
    · O TRATAMENTO da base (identidade §6): brilho a 65 % e saturação a 70 %, na pintura da camada.
    · O CRÉDITO no tamanho e lugar da identidade §4.1/§4.2 (76 px, x = 200, faixa y > 1880), com pílula e cor
      dos tokens. Landsat e Natural Earth são domínio público: sem linha na tela (§7). A estrada e Cascade Point
      são OSM: ODbL. O bloco da DESCRIÇÃO está em ../_pesquisa/base-landsat.json (o _creditos-mapa.md que o
      preparar-cena grava só conhece os perfis da pré-v1; o base-landsat.py o regrava certo).
    · Sem o véu (#scrim) do molde: a identidade não tem degradê.
    · A divisa com o contorno escuro por baixo (§6, decisão do Lucas em 25/09/2026: sem ele sumia no gelo).
    · Rótulo na pílula da marca (§4.1), anel da assinatura (§4.4), estrada que se desenha. A divisa e CANADA
      saem quando a estrada chega à metade: nunca mais que 5 elementos juntos (§4.2).
    · A espera de cada quadro também aguarda a estrada (setData) e a divisa.
-->
<!-- base do canal: a imagem Landsat georreferenciada e a procedência dela -->
<script src="../_media/base/landsat-juneau.js"></script>
<!--
  MOLDE DE CENA DE MAPA — Régie (src/mapa/moldes/mapa-base.html).

  De onde veio: o contrato de captura do mapista (agent-core/agentes/mapista/CONTRATO.md §3-§5), a
  espera por "um nível de tile só" de top10-estudio/experimento/camera-mapa/lab.html:216-262, e o
  overlay ancorado por projeção de knowledge/dourados/eua-china/mapa-taiwan-atrito.html:117-151
  (placeChip, pathFromMulti) — commit 4afda124. O que mudou em relação a eles:
    · a base NÃO está escrita aqui: vem do perfil do canal (window.__REGIE_MAPA), e a chave, quando
      o perfil pede, vem de window.__chaves, que o render injeta na hora. Nenhuma chave neste arquivo;
    · o motor e a câmera vêm de ../_media/_vendor/ (preparar-cena.mjs), não do CDN;
    · a geometria vem de ../_media/geo/<slug>.js (gravado pelas ferramentas src/geo/*), não colada;
    · a cena publica window.map (qc-mapa-movimento.mjs:51 exige; os dourados usavam "let map");
    · erro de configuração não vira quadro cinza: vira window.__erroCena + faixa vermelha na tela;
    · o crédito da base e da geometria que exige crédito é montado sozinho a partir do perfil e da
      procedência (docs/CREDITO-DE-MAPA.md §6: 46 px, pílula, canto inferior esquerdo, a cena toda);
    · tile que não chega (sem internet, HTTP 429/5xx, servidor fora do ar) ou chega CORROMPIDO (status
      200 com a imagem cortada) é tentado de novo e, se não passar, é ERRO da cena — não quadro preto
      com status "ok": na dúvida, a cena barra (fail-closed);
    · a fonte é a da MARCA do canal (var(--fonte) de ../../../marca/tokens.css), nunca uma família
      cravada: "Helvetica Neue" nem existe no Windows e o _audit-til reprovava toda cena de mapa;
    · palco 4K nativo (3840×2160): o render tira 1080p com DPR 0,5 e 4K com --4k.
  Exemplo incluído: IMAGEM SOBRE REGIÃO — chip ancorado por projeção e foto recortada no formato
  do território (SVG clipPath do polígono projetado, refeito a cada quadro).

  COMO USAR (o mapista):
    1. node <motor>/src/geo/geo-pais-completo.mjs <proj> --a3=BRA --pt=Brasil      (a geometria)
    2. node <motor>/src/mapa/preparar-cena.mjs <proj> --molde=<id-da-cena>         (vendor + perfil + esta cópia)
    3. edite SÓ o bloco CENA abaixo (e o CSS de marca): tempos do words.json, viewports, slugs, foto.
    4. confira os quadros de início, meio e fim — renderizados, não imaginados.

  CONTRATO (inviolável — é o que o render captura):
    window.__duracao, window.__renderAt(t) (determinístico, nunca lança), window.__ready (Promise),
    window.__prepararCaptura(), window.__aguardarMapa() (Promise; espera tiles E relevo),
    window.__fotosProntas (Promise das imagens), window.map. Proibido: relógio real e sorteio no
    quadro, animação CSS por keyframes, e mover a câmera com as animações por relógio do MapLibre
    (use jumpTo com a posição calculada de t).
-->

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 3840px; height: 2160px; overflow: hidden; background: #05080D; }
  #palco { position: relative; width: 3840px; height: 2160px; overflow: hidden; background: #05080D;

  #map { position: absolute; inset: 0; }
  /* canal: sem o véu (#scrim) do molde. A identidade não tem degradê (tokens: --degrade: none) e o escurecimento

  svg#ov { position: absolute; inset: 0; width: 3840px; height: 2160px; pointer-events: none; }
  /* opacidade da foto e da borda vai por ATRIBUTO no JS: CSS de folha de estilo vence
     presentation-attribute e travaria o valor (lição do dourado mapa-taiwan-atrito.html:30-31). */
  #fotoBorda { fill: none; stroke: #EDE6D6; stroke-width: 6; stroke-linejoin: round; }
  #rotulos { position: absolute; inset: 0; pointer-events: none; }
  /* canal: o RÓTULO da marca (identidade §3 e §4.1) — pílula --rotulo, cantos 12, respiro 24 × 40,
     Inter 700 a 128 px em --tinta. Cidade e lugar: caixa normal, tracking 0. País: CAIXA ALTA, +0.04em. */
  .rotulo { position: absolute; left: 0; top: 0; opacity: 0; white-space: nowrap;
    background: var(--rotulo); border-radius: var(--cantos);
    padding: var(--rotulo-respiro-y) var(--rotulo-respiro-x);
    font-family: var(--fonte); font-weight: var(--peso-rotulo); font-size: var(--fs-rotulo); line-height: 1;
    letter-spacing: 0; color: var(--tinta); }
  .rotulo.pais { text-transform: uppercase; letter-spacing: var(--tracking-lugar); }
  #anel circle { fill: none; stroke: var(--destaque); }
  #pontoJuneau { fill: var(--tinta); stroke: var(--rotulo); stroke-width: 6; }
  /* CRÉDITO DE MAPA — docs/CREDITO-DE-MAPA.md §6.2-§6.4. Nenhuma licença fixa tamanho; 46 px no 4K
     = 23 pt no 1080p = o mínimo da Apple para TV. NUNCA abaixo de 40 px. Branco 90% sobre pílula
     preta 60%: contraste >= 5:1 até sobre neve (o #C9D6E8 com sombra dava 1,47:1 sobre branco).
     Canto inferior esquerdo, dentro da área segura (--safe-x 154 / --safe-y 86 dos tokens), visível
     do primeiro ao último quadro. Quebra em duas linhas em vez de sair do quadro. Não baixe as
     opacidades: texto 85% + pílula 55% já cai para 3,95:1 sobre branco.
     A família vai em declaração PRÓPRIA, nunca dentro do atalho `font:`: var() inválido (canal sem
     marca/tokens.css) invalida a declaração inteira, e o atalho levaria junto o tamanho — medido: o
     crédito caía para 16 px. Assim, sem a marca, só a família cai (e o _audit-til acusa FORA-DA-MARCA). */
  /* canal: tamanho e lugar da identidade §4.1/§4.2 — 76 px, começa em x = 200 e acaba antes de x = 1720,
     dentro da faixa y > 1880. Pílula e cor pelos tokens: --rotulo (mais escura que a do molde: sobre neve o
     contraste fica ~8:1), cantos --cantos, texto --sec (a --tinta a 80 %, que os tokens dão ao crédito).
     O respiro é menor que o do rótulo para a pílula caber na faixa (topo em ~1935). */
  #credito { position: absolute; left: var(--credito-x); bottom: 100px; max-width: 1520px; z-index: 50;
    font: 500 76px/1.2 sans-serif; font-family: var(--fonte); letter-spacing: 0;
    color: var(--sec); background: var(--rotulo); padding: 12px 24px; border-radius: var(--cantos); }
  #credito[hidden] { display: none; }
  #erroCena { position: absolute; left: 0; right: 0; top: 0; padding: 48px 96px; background: #B00020; color: #fff;
    font-size: 56px; font-weight: 800; line-height: 1.25; white-space: pre-wrap; z-index: 99; }
  #erroCena[hidden] { display: none; }
</style>

<div id="palco">

  <svg id="ov" viewBox="0 0 3840 2160" width="3840" height="2160" xmlns="http://www.w3.org/2000/svg">

      <circle id="anelPulso2" cx="0" cy="0" r="28" stroke-width="10" opacity="0"/>

<script>
(function () {
  "use strict";

  // ═══ CONFIGURAÇÃO DA CENA — o mapista edita SÓ este bloco (e o CSS de marca acima) ═══════════
  // Tempos em segundos DESTA cena (0 = inSec do segmento), tirados do words.json (word-lock).
  var CENA = {
    duracao: 7.0,                                   // teste: a frase 10 dura ~7 s na narração
    largura: 3840, altura: 2160,                    // o palco; nunca mude (o zoom depende dele)
    // Viewports são pontos de PASSAGEM: a câmera anda o tempo todo (render/camera-mapa.js).
    // Um empurrão lento para o Lynn Canal, norte para cima, sem inclinação (a base não tem relevo 3D).
    viewports: [
      { lng: -134.50, lat: 58.50, zoom: 9.75, bearing: 0, pitch: 0 },
      { lng: -134.55, lat: 58.52, zoom: 10.05, bearing: 0, pitch: 0 }
    ],
    bearingLoop: null,
    cameraAbre: 0.16, cameraFecha: 0.20,
    baseCanal: "landsat-juneau",                    // canal: exige a base Landsat; sem ela, a cena barra
    territorio: null,
    fotoRegiao: null,
    // canal: o que a cena desenha (geometria real; slugs de ../_media/geo/)
    // "from the rest of the continent": a divisa e CANADA ficam na primeira metade e saem quando a estrada
    // chega à metade, antes do anel. Assim nunca há mais que 5 elementos juntos (identidade §4.2: alvo 4 a 5).
    fronteira: { geo: "panhandle-juneau", pais: "CAN", entra: 0.3, dura: 0.5, sai: 2.9 },   // a divisa com o Canadá
    estrada: { geo: "estrada-juneau-cascade", entra: 1.3, dura: 2.5 },             // Juneau → Cascade Point
    // rótulos: âncora na coordenada; lado = de que lado do ponto a pílula fica; dx/dy em px do palco
    rotulos: [
      { id: "rotCanada",  lnglat: [-133.65, 58.80], lado: "centro",   dx: 0,   dy: 0,  entra: 0.6, sai: 2.9 },   // dentro do Canadá (conferido no polígono do NE)
      { id: "rotJuneau",  geo: "cidades-ne", nome: "Juneau", lado: "direita", dx: 44, dy: 0, entra: 0.9 },
      { id: "rotCascade", geo: "cascade-point", lado: "esquerda", dx: -64, dy: 0, entra: 3.9 }
    ],
    anel: { geo: "cascade-point", entra: 3.8 }      // o ponto que importa: onde a estrada para
  };
  // ═══════════════════════════════════════════════════════════════════════════════════════════

  var DUR = CENA.duracao;
  window.__duracao = DUR;
  var E = function (id) { return document.getElementById(id); };
  var cl = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  var eo = function (t) { t = cl(t, 0, 1); return 1 - Math.pow(1 - t, 3); };
  var seg = function (t, a, d) { return cl((t - a) / d, 0, 1); };

  // ── erro legível: nunca um quadro cinza calado ─────────────────────────────────────────────
  // Ganchos inofensivos desde a primeira linha: se a cena parar num erro de configuração, o
  // render ainda encontra as funções, lê __erroCena e para com a mensagem — não com um TypeError.
  window.__renderAt = function () {};
  window.__prepararCaptura = function () {};
  window.__aguardarMapa = function () { return Promise.resolve(true); };
  var resolverPronto, rejeitarPronto;
  window.__ready = new Promise(function (res, rej) { resolverPronto = res; rejeitarPronto = rej; });
  window.__ready.catch(function () { /* o erro vive em __erroCena; o render confere */ });
  function falhar(msg) {
    if (window.__erroCena) return;
    window.__erroCena = msg;
    var el = E("erroCena"); if (el) { el.textContent = "CENA COM ERRO — " + msg; el.hidden = false; }
    try { console.error("[cena de mapa] " + msg); } catch (e) {}
    rejeitarPronto(new Error(msg));
  }

  // ── imagens: __fotosProntas é a Promise que o render espera (e encadeia) ────────────────────
  var fotoHref = CENA.fotoRegiao && CENA.fotoRegiao.img;
  window.__fotosProntas = !fotoHref ? Promise.resolve(true) : new Promise(function (res) {
    var im = new Image();
    im.onload = function () {
      var fi = E("fotoImg"); if (fi) fi.setAttribute("href", fotoHref);
      (im.decode ? im.decode() : Promise.resolve()).then(function () { res(true); }, function () { res(true); });
    };
    // imagem que não carrega é ERRO, não "pronto" (REND-09 do estúdio: mídia quebrada passava calada)
    im.onerror = function () { falhar("a imagem " + fotoHref + " não carregou (arquivo ausente ou caminho errado)."); res(true); };
    im.src = fotoHref;
  });

  // ── o que a cena precisa ter recebido ───────────────────────────────────────────────────────
  // canal: a base do canal (Landsat local) vale no lugar do perfil da pré-v1, quando existe (ver o topo)
  var P = window.__BASE_CANAL || window.__REGIE_MAPA;
  if (CENA.baseCanal && !window.__BASE_CANAL)
    return falhar("a cena pede a base do canal '" + CENA.baseCanal + "' e ela não carregou (../_media/base/" + CENA.baseCanal + ".js). " +
      "Sem ela, a cena cairia no perfil da pré-v1 sem avisar. Refaça com: python out/prova-mapa/_pesquisa/base-landsat.py");
  if (CENA.baseCanal && window.__BASE_CANAL.nome !== CENA.baseCanal)
    return falhar("a base do canal carregada é '" + window.__BASE_CANAL.nome + "', e a cena pede '" + CENA.baseCanal + "'.");
  if (window.__BASE_CANAL && !(window.__BASE_CANAL.imagem && window.__BASE_CANAL.imagem.arquivo &&
      window.__BASE_CANAL.imagem.coordinates && window.__BASE_CANAL.imagem.coordinates.length === 4))
    return falhar("a base do canal '" + window.__BASE_CANAL.nome + "' não diz a imagem e os 4 cantos (imagem.arquivo, imagem.coordinates).");
  if (typeof maplibregl === "undefined") return falhar("não carregou ../_media/_vendor/maplibre-gl.js. Rode: node <motor>/src/mapa/preparar-cena.mjs <proj>");
  if (typeof criarCameraMapa !== "function") return falhar("não carregou ../_media/_vendor/camera-mapa.js. Rode: node <motor>/src/mapa/preparar-cena.mjs <proj>");
  if (!P) return falhar("sem perfil de base (window.__REGIE_MAPA). Rode: node <motor>/src/mapa/preparar-cena.mjs <proj>");
  var chave = null;
  if (P.credencial) {
    chave = (window.__chaves || {})[P.credencial] || null;
    if (!chave) return falhar("a base '" + P.nome + "' precisa da chave " + P.credencial + ", que o render da Régie injeta na hora. " +
      "Aberta direto no navegador a cena não tem a chave: use o render/prévia da Régie, ou troque o perfil do canal.");
  }
  function geo(slug) {
    var g = (window.__GEO || {})[slug];
    if (!g) falhar("a geometria '" + slug + "' não foi carregada: falta <script src=\"../_media/geo/" + slug + ".js\"> ou o arquivo. Gere com as ferramentas src/geo/*.");
    return g;
  }
  var TERR = CENA.territorio ? geo(CENA.territorio.geo) : null;
  var FOTO_GEO = CENA.fotoRegiao ? geo(CENA.fotoRegiao.geo) : null;
  if (window.__erroCena) return;

  // ── canal: a geometria que esta cena desenha, tirada dos arquivos (nada à mão) ─────────────────
  var tok = function (nome, padrao) { return getComputedStyle(document.documentElement).getPropertyValue(nome).trim() || padrao; };
  var TINTA = tok("--tinta", "#F4F1EA");
  var FRONTEIRA = (function () {
    var fc = geo(CENA.fronteira.geo); if (!fc) return null;
    var f = (fc.features || []).filter(function (x) { return x.properties && x.properties.SOV_A3 === CENA.fronteira.pais; });
    if (!f.length) falhar("o recorte '" + CENA.fronteira.geo + "' não tem o país " + CENA.fronteira.pais + ".");
    return { type: "FeatureCollection", features: f };
  })();
  var ESTRADA = (function () {
    var fc = geo(CENA.estrada.geo); if (!fc) return null;
    var g = fc.features && fc.features[0] && fc.features[0].geometry;
    if (!g || g.type !== "LineString") { falhar("a estrada '" + CENA.estrada.geo + "' não é uma LineString."); return null; }
    // comprimento acumulado em Mercator (o que a tela vê), para a estrada crescer a velocidade constante
    var m = function (p) { var s = Math.sin(p[1] * Math.PI / 180); return [p[0] / 360, 0.5 * Math.log((1 + s) / (1 - s)) / (2 * Math.PI)]; };
    var acum = [0], q0 = m(g.coordinates[0]);
    for (var i = 1; i < g.coordinates.length; i++) {
      var q = m(g.coordinates[i]); acum.push(acum[i - 1] + Math.hypot(q[0] - q0[0], q[1] - q0[1])); q0 = q;
    }
    return { pts: g.coordinates, acum: acum, total: acum[acum.length - 1] };
  })();
  function trechoDaEstrada(f) {
    var E_ = ESTRADA, alvo = cl(f, 0, 1) * E_.total, pts = [E_.pts[0]];
    for (var i = 1; i < E_.pts.length; i++) {
      if (E_.acum[i] <= alvo) { pts.push(E_.pts[i]); continue; }
      var a = E_.acum[i - 1], k = (alvo - a) / ((E_.acum[i] - a) || 1), p = E_.pts[i - 1], q = E_.pts[i];
      pts.push([p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k]);
      break;
    }
    if (pts.length < 2) pts.push(pts[0]);
    return { type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: pts } };
  }
  function pontoDe(r) {
    if (r.lnglat) return r.lnglat;
    var fc = geo(r.geo); if (!fc) return null;
    var f = (fc.features || []).filter(function (x) { return !r.nome || (x.properties && x.properties.name === r.nome); })[0];
    if (!f || !f.geometry || f.geometry.type !== "Point") { falhar("não achei o ponto " + (r.nome || r.geo) + " em '" + r.geo + "'."); return null; }
    return f.geometry.coordinates;
  }
  CENA.rotulos.forEach(function (r) { r.p = pontoDe(r); });
  var PONTO_ANEL = pontoDe(CENA.anel);
  var PONTO_JUNEAU = pontoDe({ geo: "cidades-ne", nome: "Juneau" });
  if (window.__erroCena) return;

  // ── crédito na tela: base (pelo perfil) + toda geometria cuja licença exige ────────────────────
  // A MESMA regra de src/mapa/credito.mjs (creditoTela): cada invólucro ../_media/geo/<slug>.js traz
  // o `credito_tela` já calculado pela ferramenta; aqui só se junta, sem repetir "OpenStreetMap".
  // Fail-closed: geometria carregada SEM procedência, ou que exige crédito sem dizer o texto, para
  // a cena — nunca vai ao ar sem o crédito que a licença pede. Natural Earth: nenhuma linha.
  var creditoTexto = (function () {

    var vf = +(eo(seg(t, CENA.fronteira.entra, CENA.fronteira.dura)) * saida(CENA.fronteira)).toFixed(3);
    map.setPaintProperty("fronteira-contorno", "line-opacity", vf);
    map.setPaintProperty("fronteira", "line-opacity", vf);
    var src = map.getSource("estrada");
    if (src) src.setData(trechoDaEstrada(eio(seg(t, CENA.estrada.entra, CENA.estrada.dura))));
    CENA.rotulos.forEach(function (r) { placeRotulo(r, eo(seg(t, r.entra, 0.3)), saida(r)); });
    var pj = map.project(PONTO_JUNEAU), dotJ = E("pontoJuneau");
    var rj = CENA.rotulos.filter(function (r) { return r.id === "rotJuneau"; })[0];
    dotJ.setAttribute("cx", pj.x.toFixed(1)); dotJ.setAttribute("cy", pj.y.toFixed(1));
    dotJ.setAttribute("opacity", eo(seg(t, rj.entra, 0.3)).toFixed(3));
    // o anel: entra em 300 ms; o pulso vai de escala 1 → 1,8 e opacidade 1 → 0 em 1,2 s, duas vezes, e para
    var pa = map.project(PONTO_ANEL), g = E("anel");
    g.setAttribute("transform", "translate(" + pa.x.toFixed(1) + " " + pa.y.toFixed(1) + ")");
    g.setAttribute("opacity", eo(seg(t, CENA.anel.entra, 0.3)).toFixed(3));
    [0, 1].forEach(function (k) {
      var u = (t - CENA.anel.entra - k * 1.2) / 1.2, c = E("anelPulso" + (k + 1));
      var vivo = u >= 0 && u < 1;
      c.setAttribute("r", (28 * (1 + 0.8 * (vivo ? u : 0))).toFixed(2));
      c.setAttribute("opacity", vivo ? (1 - u).toFixed(3) : "0");
    });
    var F = CENA.fotoRegiao;
    if (F && FOTO_POLIS.length) {
      var r = pathFromMulti(FOTO_POLIS), fv = eo(seg(t, F.entra, F.dura));
      var cp = E("recortePath"); if (cp) cp.setAttribute("d", r.d);
      var fi = E("fotoImg");
      if (fi) { fi.setAttribute("x", r.x.toFixed(1)); fi.setAttribute("y", r.y.toFixed(1)); fi.setAttribute("width", r.w.toFixed(1)); fi.setAttribute("height", r.h.toFixed(1)); }
      var fb = E("fotoBorda"); if (fb) { fb.setAttribute("d", r.d); fb.setAttribute("stroke-opacity", (fv * (F.borda || 0)).toFixed(3)); }
      var fg = E("fotoRegiao"); if (fg) fg.setAttribute("opacity", (fv * F.opacidade).toFixed(3));
    }
  }

  // ── o contrato de captura ───────────────────────────────────────────────────────────────────
  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // NUNCA lança: exceção mataria a cena inteira
  };

  // A ESPERA QUE IMPORTA: UM NÍVEL DE TILE SÓ NA TELA (lab.html:235-251). areTilesLoaded()
  // responde "tudo carregado" enquanto a tela é um MOSAICO de dois níveis — parte esticada (borrada),
  // parte nítida — e o olho lê como "um pouquinho, mais um pouquinho".
  //
  // ⚠ AJUSTADO NO PORTE (23/09/2026, medido na Régie com o perfil "aberto"): o critério do lab
  // (todos os tiles do cache num nível só) NUNCA fica verdadeiro com relevo ligado — o MapLibre
  // pede níveis diferentes por distância, e o cache guardava z3, z4 e z5 mesmo com pitch 0. Cada
  // quadro pagava o teto inteiro (12,3 s medidos; 240 quadros = 49 min só de espera). Agora:
  //   · conta só os tiles que VÃO SER DESENHADOS (getRenderableIds), não o cache inteiro;
  //   · com relevo ou inclinação, vários níveis na tela é o normal (perto nítido, longe grosso),
  //     então ali a espera é "tudo carregado e estável", sem exigir nível único.
  function nivelUnico() {
    try {
      if (map.getTerrain() || map.getPitch() > 1) return true;
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      var cache = sc.base; if (!cache) return true;
      var ids = cache.getRenderableIds ? cache.getRenderableIds() : Object.keys(cache._tiles || {});
      var tiles = ids.map(function (id) { return cache._tiles[id]; }).filter(Boolean);
      if (!tiles.length) return false;
      if (tiles.some(function (x) { return x.state === "loading"; })) return false;
      var niveis = new Set(tiles.map(function (x) { return x.tileID && x.tileID.canonical && x.tileID.canonical.z; }));
      return niveis.size <= 1;
    } catch (e) { return true; }
  }
  // Tile que FALHOU fica no cache com estado "errored" e nunca é pedido de novo: o quadro sai com o
  // buraco preto. O 404 de tile raster nem dispara 'error' (o MapLibre só atualiza), então a espera
  // confere o estado de cada tile de cada fonte.
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) {
        var ts = (sc[id] && sc[id]._tiles) || {};
        for (var k in ts) if (ts[k] && ts[k].state === "errored") return id;
      }
    } catch (e) { /* estrutura interna mudou: a checagem de 'error' e o teto continuam valendo */ }
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou (HTTP 404 ou resposta inválida). O quadro sairia com buraco.");
    return !!ruim;
  }
  // vigia desde o começo: sem ela, o 404 só aparecia na espera do 1º quadro, depois de o render
  // esperar 20 s por um __ready que nunca chega (o 'idle' não vem com tile errado na tela)
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  // tiles da base E o relevo (mapista/CONTRATO.md §3), com teto: tile que não chega não trava o
  // render para sempre (o estúdio mediu 11 min parados sem log em verticais/_comum.mjs:76-90) — e
  // o teto esgotado é ERRO (antes só somava em __esperasEsgotadas, que ninguém lia, e o quadro saía
  // incompleto). 90 s por quadro: a prova ao vivo de 23/09/2026 mediu até 35 s num quadro de salto
  // (SwiftShader + rede), e o render corta cada comando em 120 s (PRAZO_QUADRO_MS).
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          // canal: a estrada muda por setData a cada quadro; sem esta espera, a foto podia sair com a estrada
          // do quadro anterior (a revisão mediu a fonte ainda carregando logo depois de todo __renderAt)
          if (!map.isSourceLoaded("estrada") || !map.isSourceLoaded("fronteira")) return false;
          if (P.tipo === "raster") {
            if (!map.isSourceLoaded("base")) return false;
            if (P.dem && (!map.isSourceLoaded("dem") || !map.getTerrain())) return false;
            return nivelUnico();
          }
          return map.loaded();
        } catch (e) { return false; }   // na dúvida, NÃO está pronto (o teto decide, e barra)
      };
      // "pronto" duas verificações seguidas: um instante verdadeiro entre dois pedidos de tile não conta
      var t0 = performance.now(), seguidas = 0;
      (function tick() {
        barrarTileComErro();
        seguidas = pronto() ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Internet lenta ou servidor sobrecarregado: renderize de novo; se repetir, confira a conexão.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  // prévia: auto-loop só quando pedido (galeria liga __PREVIEW; à mão, abra com #preview na URL).
  // A captura NUNCA é a prévia: o render nasce com __PREVIEW=false e __prepararCaptura cancela o loop.
  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    window.__renderAt(0);
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
