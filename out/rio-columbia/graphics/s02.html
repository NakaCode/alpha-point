    var vin = t0 === null ? 1 : eo(seg(t, t0, 0.3));
    var vout = t1 === null ? 1 : 1 - eio(seg(t, t1 - 0.3, 0.3));
    return { v: vin * vout, sobe: (1 - vin) * 24 };
  }
  function rotuloEm(id, pt, lado, gap, t, t0, t1, dy) {
    var el = E(id); if (!el) return;
    var vt = vidaTexto(t, t0, t1);
    if (vt.v <= 0 || !pt) { mostrar(el, 0, 0, 0); return; }
    var w = el.offsetWidth, h = el.offsetHeight, l, tp;
    if (lado === "esq") { l = pt.x - gap - w; tp = pt.y - h / 2; }
    else if (lado === "dir") { l = pt.x + gap; tp = pt.y - h / 2; }
    else if (lado === "cima") { l = pt.x - w / 2; tp = pt.y - gap - h; }
    else { l = pt.x - w / 2; tp = pt.y + gap; }
    tp += (dy || 0) + vt.sobe;
    mostrar(el, vt.v * cl(naArea(l, tp, w, h) / 30, 0, 1), l, tp);
  }
  // o texto fixo na tela (pílula de número, legenda, pergunta): a caixa em (l, tp), com a mesma vida
  function fixoEm(id, l, tp, t, t0, t1) {
    var el = E(id); if (!el) return;
    var vt = vidaTexto(t, t0, t1);
    mostrar(el, vt.v, l, tp + vt.sobe);
  }

  // ── os créditos: o de mapa INTEIRO do 1º ao último quadro (identidade §4.2); os outros no nível 1, logo acima, cada um no tempo do
  //    seu asset (entra em 300 ms, ou inteiro no 1º quadro quando o asset já abre a cena) ──
  function aplicarCreditos(t) {
    var m = E("credMapa"); if (m) { m.style.opacity = "1"; m.style.visibility = "visible"; }
    var hM = m ? m.offsetHeight : 89;
    (CREDITOS || []).forEach(function (c) {
      var el = E(c.id); if (!el) return;
      var vin = c.inteiro ? (t >= c.t0 ? 1 : 0) : eo(seg(t, c.t0, 0.3));
      var vout = c.t1 === null ? 1 : 1 - eio(seg(t, c.t1 - (c.sai || 0.3), c.sai || 0.3));
      var v = vin * vout;
      el.style.bottom = (24 + hM + 6) + "px";
      el.style.opacity = v.toFixed(3); el.style.visibility = v > 0.001 ? "visible" : "hidden";
    });
  }

  var visAntes = {};
  function visivel(id, sim) { var v = sim ? "visible" : "none"; if (visAntes[id] === v) return; map.setLayoutProperty(id, "visibility", v); visAntes[id] = v; }
  var opAntes = {};
  function opac(id, prop, v) { v = +(+v).toFixed(3); var k = id + "|" + prop; if (opAntes[k] === v) return; map.setPaintProperty(id, prop, v); opAntes[k] = v; }

  criarAnel("anel");
  var lerp = function (a, b, u) { return a + (b - a) * u; };
  function aplicarFoto(t) {
    var F = CENA.foto, mol = E("moldura"), jan = E("janela"), img = E("fotoImg"), av = E("aviso");
    var pL = map.project(CENA.lower);
    var mb = { x: pL.x - F.vao - F.mini[0], y: pL.y - F.mini[1] / 2, w: F.mini[0], h: F.mini[1], b: F.borda };
    var u = eio(seg(t, F.encolhe[0], F.encolhe[1])), S = F.S;
    var r = { x: lerp(S.x, mb.x, u), y: lerp(S.y, mb.y, u), w: lerp(S.w, mb.w, u), h: lerp(S.h, mb.h, u), b: lerp(S.b, mb.b, u) };
    var c = eio(seg(t, F.ponto[0], F.ponto[1]));   // some no ponto: encolhe até o Lower Arrow
    r = { x: lerp(r.x, pL.x, c), y: lerp(r.y, pL.y, c), w: r.w * (1 - c), h: r.h * (1 - c), b: r.b * (1 - c) };
    var v = 1 - eio(seg(t, F.some[0], F.some[1]));
    if (v <= 0.001 || r.w < 2) { mol.style.visibility = "hidden"; }
    else {
      var k = r.w / F.caixa[2];
      mol.style.visibility = "visible"; mol.style.opacity = v.toFixed(3);
      mol.style.padding = r.b.toFixed(2) + "px";
      mol.style.transform = "translate(" + (r.x - r.b).toFixed(2) + "px," + (r.y - r.b).toFixed(2) + "px)";
      jan.style.width = r.w.toFixed(2) + "px"; jan.style.height = r.h.toFixed(2) + "px";
      img.style.width = (F.w * k).toFixed(2) + "px"; img.style.height = (F.h * k).toFixed(2) + "px";
      img.style.transform = "translate(" + (-F.caixa[0] * k).toFixed(2) + "px," + (-F.caixa[1] * k).toFixed(2) + "px)";
    }
    // o aviso do ano: do lugar da s01 (borda direita 3146, centro 248) para a esquerda da miniatura; sai com ela
    var w = av.offsetWidth, h = av.offsetHeight;
    var x0 = CENA.avisoS01.dir - w, y0 = CENA.avisoS01.cy - h / 2;
    var x1 = r.x - r.b - 16 - w, y1 = r.y + r.h / 2 - h / 2;   // à esquerda da miniatura, no meio dela (em cima, cruzava o rótulo do lago na subida)
    var xa = lerp(x0, x1, u), ya = lerp(y0, y1, u);
    av.style.opacity = v.toFixed(3); av.style.visibility = v > 0.001 ? "visible" : "hidden";
    av.style.transform = "translate(" + xa.toFixed(2) + "px," + ya.toFixed(2) + "px)";
  }
  function rotuloCentro(id, pt, t, t0, t1) {
    var el = E(id); if (!el) return;
    var vt = vidaTexto(t, t0, t1);
    if (vt.v <= 0 || !pt) { mostrar(el, 0, 0, 0); return; }
    var w = el.offsetWidth, h = el.offsetHeight, l = pt.x - w / 2, tp = pt.y - h / 2 + vt.sobe;
    mostrar(el, vt.v * cl(naArea(l, tp, w, h) / 30, 0, 1), l, tp);
  }
  var gradAntes = {};
  function gradiente(id, expr, chave) { if (gradAntes[id] === chave) return; map.setPaintProperty(id, "line-gradient", expr); gradAntes[id] = chave; }
  function aplicarCena(t) {
    var T = CENA.t;
    // a fronteira: o traço de oeste para leste em 'on', e a saída quando os nomes já saíram
    var ff = eio(seg(t, T.fronteira[0], T.fronteira[1]));
    var kf = ff.toFixed(3);
    gradiente("fr-sob", gradFronteira([11, 15, 20, 0.6], ff), kf);
    gradiente("fr", gradFronteira([255, 255, 255, 0.7], ff), kf);
    var vfr = 1 - eio(seg(t, T.frSai[0], T.frSai[1]));
    opac("fr-sob", "line-opacity", vfr); opac("fr", "line-opacity", vfr);
    visivel("fr-sob", ff > 0 && vfr > 0.001); visivel("fr", ff > 0 && vfr > 0.001);
    // o rio: o traço da nascente à foz em 'Columbia', com a correnteza no tempo do vídeo
    var fr = eo(seg(t, T.rio[0], T.rio[1]));
    visivel("rio", fr > 0); visivel("rio-sob", fr > 0);
    if (fr > 0) gradiente("rio", gradRio(T0V + t, fr), (T0V + t).toFixed(4) + "|" + fr.toFixed(4));
    opac("rio-sob", "line-opacity", 0.6 * fr);
    // o lago aceso em 'emptied' (--territorio-cor: --destaque a 85 %; contorno --tinta 6 px sobre o contorno escuro)
    opac("lago-agua", "fill-opacity", 0.7 * eo(seg(t, T.arrow, 0.5)) * (1 - eo(seg(t, T.lago[0], T.lago[1]))));   // o lago em --agua desde 'Arrow'
    var vl = eo(seg(t, T.lago[0], T.lago[1]));
    opac("lago", "fill-opacity", 0.85 * vl); opac("lago-linha", "line-opacity", vl); opac("lago-sob", "line-opacity", 0.6 * vl);
    // o anel na barragem: entra com o lago e pulsa duas vezes
    aplicarAnel("anel", CENA.barragem, t, T.lago[0], null, T.pulsos);
    aplicarFoto(t);
    rotuloEm("rotArrow", map.project(CENA.arrowAnc), "esq", 70, t, T.arrow, null, 0);
    rotuloCentro("rotCan", map.project(CENA.can), t, T.nomes[0], T.nomes[1]);
    rotuloCentro("rotEua", map.project(CENA.eua), t, T.nomes[0], T.nomes[1]);
    fixoEm("rotBC", 200, 200, t, T.bc, null);
    var lg = E("legenda"); fixoEm("legenda", 200, 1856 - (lg ? lg.offsetHeight : 124), t, T.legenda, null);
  }

  function aplicar(t) {
    if (!mapaCarregado) return;
    // o relevo liga a partir de TERRENO_DESDE (s08: 0,2 s, pitch 0,5°, exagero 0,003): com ele ligado e o pitch 0, o MapLibre escolhia
    // outro nível de tile no canto do quadro, e o 1º quadro da s08 não casava com o último da s07
    var querRelevo = TERRENO && t >= (typeof TERRENO_DESDE === "number" ? TERRENO_DESDE : 0);
    if (querRelevo && !map.getTerrain()) map.setTerrain({ source: "dem", exaggeration: 0 });
    if (TERRENO && !querRelevo && map.getTerrain()) map.setTerrain(null);
    window.__relevoLigado = querRelevo;
    var cam = cameraAt(t);
    map.jumpTo(cam);
    if (querRelevo) {
      // o centro da câmera fica na cota 0 (a s44 do Juneau; Peru s06): a câmera é a mesma em todo render, com ou sem o relevo pronto
      map._elevationFreeze = true;
      if (map.terrain && map.transform.elevation !== 0) map.transform.elevation = 0;
      var ex = exageroAt(t);
      if (map.terrain && Math.abs(map.terrain.exaggeration - ex) > 1e-4) map.terrain.exaggeration = ex;
      window.__exagero = ex;
    }
    if (typeof NIVEL_ALTO === "function") {
      var na = cl(NIVEL_ALTO(t), 0, 1); window.__nivelAlto = na;
      opac("baseAlto", "raster-opacity", na);
      visivel("baseAlto", na > 0.001); visivel("base", na < 0.999);
    }
    aplicarCena(t, cam);
    aplicarCreditos(t);
    if (querRelevo && map.terrain) {
      // A ESPESSURA DAS LINHAS SOBRE O RELEVO (s44 do Juneau): a textura das linhas se refaz em todo quadro, no zoom dele
      var tsc = map.terrain.sourceCache;
      if (!tsc || typeof tsc.freeRtt !== "function") return falhar("o MapLibre desta cena não tem terrain.sourceCache.freeRtt.");
      tsc.freeRtt(); map.triggerRepaint();
    }
  }

  window.__renderAt = function (t) {
    try { aplicar(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }
  };

  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou. O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  // pronto: os tiles do satélite, as fontes da cena e (com relevo) o DEM carregados, o terreno ligado, o mapa parado, dois quadros pintados
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!mapaCarregado || !map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) if (!map.getSource(FONTES[i]) || !map.isSourceLoaded(FONTES[i])) return false;
          if (!map.getSource("base") || !map.isSourceLoaded("base")) return false;
          if (window.__relevoLigado && (!map.getSource("dem") || !map.isSourceLoaded("dem") || !map.getTerrain())) return false;
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = mapaCarregado && map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
</body>
