    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).

  var E = function (id) { return document.getElementById(id); };
  var f2 = function (v) { return (+v).toFixed(2); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };

  var DUR = 4.733;
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia é do redator-de-tela: textos-tela.json › _textos_por_cena s08) ═══
  var TEXTOS = {
    titulo: "INTERIM DEAL",                                             // [26] rotulo, 0,100 · o título das três fatias
    anos:   "2025 · 2026 · 2027",                                       // [27] eixo, 1,033 · entram com o "2027" da voz (32,78 s)
    cota:   "LAST FLOOD SEASON IT CAN COVER · SPRING 2027",             // [28] cota, 1,033 · em "twenty twenty-seven," (F007)
    cred1:  "Source: U.S. diplomatic note to Canada, Nov. 22, 2024"     // [29] credito, 0,100 (F007)
  };
  // ═════════════════════════════════════════════════════════════════════════════════════════════════════════════
  Object.keys(TEXTOS).forEach(function (k) { var e = E(k); if (e) e.textContent = TEXTOS[k]; });

  // os tempos (locais, −31,767), do words.json, dos textos de tela e do conceito
  var T = {
    titulo: 0.100, cred: 0.100,
    luz: [0.00, 0.35, 0.70], luzDur: 0.30,   // a luz conta as três: 0,35 s cada; pousa em 2027 em "twenty-seven," (1,013)
    camFim: 0.713,                           // a câmera para 0,3 s antes de "twenty-seven,"
    anos: 1.033, cota: 1.033,                // "twenty-seven," (32,78 s)
    unless: 2.003, frenteDur: 0.70, apagaFim: 3.20,   // "unless": a linha vira pontilhado (a frente, 0,7 s) e se apaga para a direita (1,2 s)
    repouso: DUR - 0.25
  };

  // ════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
  // A RÉGUA DO TEMPO (peça 3 do conceito) · NASCE AQUI (s08) e volta em s29, s31, s33, s34, s57, s58 e s59.
  // Para reusar: copie este bloco INTEIRO (de "A RÉGUA DO TEMPO" até "FIM DA RÉGUA DO TEMPO"), o CSS .ar, .ar-fina, .sombra-linha,
  // .hachura e .ponto, e o <svg id="desenho"> com <defs id="reguaDefs"> e <g id="regua">. Mude só a VISTA (abaixo) e o que a sua
  // cena acende. Tudo é função de t; nada lê relógio.
  //
  // A ESCALA VERDADEIRA (o arco do conceito): o eixo em y 1180, de x 400 a x 3440; 1964 em x 520, 2024 em x 2600 (34,667 px por
  // ano); 2025, 2026 e 2027 são três fatias de 34,667 px (até x 2704); 2029 em x 2773,3. A vista inteira é reguaVista(REGUA.inteira).
  // A PONTA EM ×8 (s08, s58, s59): 2024 em x 1505 → as fatias com 277,33 px (2025: x 1505–1782,3; 2026: 1782,3–2059,7; 2027:
  // 2059,7–2337), 2029 em x 2891,7; a banda das fatias em y 1080–1280, centrada no eixo.
  // A altura da banda é da vista (não escala com o tempo): na ponta ×8 são 200 px.
  var REGUA = {
    yEixo: 1180,                                              // o eixo da régua, no palco (o mesmo em toda vista)
    x0: 400, x1: 3440,                                        // as pontas do eixo na escala verdadeira
    pxAno: (2600 - 520) / 60,                                 // 34,667 px por ano, na escala verdadeira
    inteira: { k: 1, anoRef: 1964, xRef: 520, y0: 1150, y1: 1210 },    // a régua inteira (a banda de 60 px é sugestão: nenhuma cena deste lote a usa)
    ponta:   { k: 8, anoRef: 2024, xRef: 1505, y0: 1080, y1: 1280 },   // só a ponta, em ×8 (o enquadramento de s08)
    traco: 6,                                                 // --linha-espessura: o traço de engenheiro
    cotaFina: 3,                                              // a linha de cota e a de chamada
    sombra: { larg: 16, dy: 12, op: 0.8 },                    // a sombra solta do traço: cópia em --tinta-escura, sem desfoque
    hachura: { passo: 48, traco: 4, folga: 3 },               // a hachura da FAIXA do corte (peça 1): linhas x + y = c a cada 48 px, 4 px, --destaque
    pontilhado: { passo: 34, raio: 4 }                        // o trecho sem data: pontos de 8 px a cada 34 px
  };
  // a vista: x(ano) no palco. v = { k, anoRef, xRef, y0, y1 }
  function reguaVista(v) {
    var px = REGUA.pxAno * v.k;
    return { k: v.k, pxAno: px, y0: v.y0, y1: v.y1, yEixo: REGUA.yEixo, x: function (ano) { return v.xRef + (ano - v.anoRef) * px; } };
  }
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, pai) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) if (Object.prototype.hasOwnProperty.call(attrs, k)) e.setAttribute(k, attrs[k]);
    if (pai) pai.appendChild(e);
    return e;
  }
  // o contorno de um grupo de fatias vizinhas (anos = [2025, 2026, 2027]: cada fatia vai de x(ano − 1) a x(ano)): o retângulo e as divisas
  function reguaFatiasD(V, anos) {
    var xa = V.x(anos[0] - 1), xb = V.x(anos[anos.length - 1]);
    var d = "M" + f2(xa) + "," + V.y0 + " H" + f2(xb) + " V" + V.y1 + " H" + f2(xa) + " Z";
    for (var i = 0; i < anos.length - 1; i++) d += " M" + f2(V.x(anos[i])) + "," + V.y0 + " V" + V.y1;
    return d;
  }
  // a hachura de UMA fatia (ou de um bloco, de anoA a anoB): devolve { g, clip }: g é o grupo (a opacidade = o brilho) e clip é o
  // <rect> do recorte (a largura = a frente que corre da esquerda para a direita). id = sufixo único no arquivo.
  function reguaHachura(V, anoA, anoB, id, pai, defs) {

    var cp = el("clipPath", { id: "reguaClip" + id }, defs);

  function reguaPontos(V, xa, xb, pai) {
    var P = REGUA.pontilhado, lista = [];
    for (var x = xa - P.passo; x <= xb; x += P.passo) lista.push({ x0: x, e: el("circle", { class: "ponto", cx: f2(x), cy: V.yEixo, r: P.raio, opacity: 0 }, pai) });
    return lista;
  }
  // ── a montagem desta cena (a ponta em ×8; o que cada cena monta com as funções acima é dela) ──
  var V = reguaVista(REGUA.ponta);
  var ANOS = [2025, 2026, 2027];
  var XA = V.x(2024), XB = V.x(2027), X_ESQ = -200, X_DIR = 4040;   // o eixo sai pelo quadro dos dois lados
  var gRegua = E("regua"), defs = E("reguaDefs");
  var PECAS = { hach: [], pontos: [] };
  if (gRegua && defs) {
    var S = REGUA.sombra;
    // 1) as sombras soltas do traço (por baixo de tudo): o eixo à esquerda, as fatias e o eixo à direita (este dentro do recorte da frente)
    var gS = el("g", { transform: "translate(0," + S.dy + ")", opacity: S.op }, gRegua);
    el("path", { class: "sombra-linha", d: "M" + X_ESQ + "," + V.yEixo + " H" + f2(XA) }, gS);
    el("path", { class: "sombra-linha", d: reguaFatiasD(V, ANOS) }, gS);
    var cpF = el("clipPath", { id: "reguaClipFrente" }, defs);
    PECAS.frente = el("rect", { x: f2(XB), y: V.yEixo - 60, width: X_DIR - XB, height: 120 + S.dy }, cpF);
    var gDirS = el("g", { "clip-path": "url(#reguaClipFrente)" }, gS);
    el("path", { class: "sombra-linha", d: "M" + f2(XB) + "," + V.yEixo + " H" + X_DIR }, gDirS);
    // 2) a hachura de cada fatia (a cor do espaço), por baixo do traço
    ANOS.forEach(function (ano, i) { PECAS.hach.push(reguaHachura(V, ano - 1, ano, "F" + i, gRegua, defs)); });
    // 3) o eixo: à esquerda das fatias (sai pelo quadro) e à direita (cheio até "unless"; depois, a frente o troca por pontos)
    el("path", { class: "ar", d: "M" + X_ESQ + "," + V.yEixo + " H" + f2(XA) }, gRegua);
    var gDir = el("g", { "clip-path": "url(#reguaClipFrente)" }, gRegua);
    el("path", { class: "ar", d: "M" + f2(XB) + "," + V.yEixo + " H" + X_DIR }, gDir);
    PECAS.pontos = reguaPontos(V, XB + 30, X_DIR, gRegua);
    // 4) as três fatias: o traço
    el("path", { class: "ar", d: reguaFatiasD(V, ANOS) }, gRegua);
    // 5) a linha de cota do título (abraça as três fatias) e a linha de chamada da cota (desce da beira da 3ª fatia)
    PECAS.cotaTitulo = el("path", { class: "ar-fina", opacity: 0,
      d: "M" + f2(XA) + ",1012 V1048 M" + f2(XA) + ",1030 H" + f2(XB) + " M" + f2(XB) + ",1012 V1048" }, gRegua);
    PECAS.chamada = el("line", { class: "ar-fina", x1: f2(XB), y1: V.y1 + 24, x2: f2(XB), y2: V.y1 + 24, opacity: 0 }, gRegua);
  }
  // FIM DA RÉGUA DO TEMPO (peça 3)
  // ════════════════════════════════════════════════════════════════════════════════════════════════════════════════════

  // ── a geometria dos textos (no palco, com a câmera em 1,00) ──
  var G = {
    tituloCx: (XA + XB) / 2, tituloY: 858,          // "INTERIM DEAL": 128 px, centrado sobre as três fatias (a base em ~986; a linha de cota em 1030)
    anosCx: (XA + XB) / 2, anosY: 1316,             // os anos: 84 px, sob as fatias
    cotaCx: XB, cotaY: 1492, chamadaFim: 1476,      // a cota: centrada na beira da 3ª fatia; a linha de chamada desce até 1476
    origem: { x: (V.x(2026) + V.x(2027)) / 2, y: V.yEixo }   // o centro da 3ª fatia: a origem da câmera
  };
  var CENTROS = ANOS.map(function (ano) { return (V.x(ano - 1) + V.x(ano)) / 2; });

  // os anos: UM texto ("2025 · 2026 · 2027"), com o espaço entre palavras ajustado para cada ano cair no centro da sua fatia e
  // cada "·" sob uma divisa. A medida é a do Chrome (a largura de "2025" e a da linha inteira), depois de as faces carregarem.
  function ajustarAnos() {
    var e = E("anos"); if (!e) return false;
    e.style.wordSpacing = "0px";
    var r = document.createRange(), no = e.firstChild; if (!no) return false;
    r.setStart(no, 0); r.setEnd(no, 4); var w4 = r.getBoundingClientRect().width;
    r.selectNodeContents(e); var w0 = r.getBoundingClientRect().width;
    var cam = E("cam"), k = 1;
    if (cam) { var m = cam.style.transform.match(/scale\(([\d.]+)\)/); if (m) k = +m[1] || 1; }
    w4 /= k; w0 /= k;                                 // as medidas vêm sob a câmera: desfaz a escala dela
    if (!(w4 > 0 && w0 > 0)) return false;
    var alvo = 2 * V.pxAno + w4;                      // do começo do 1º ano ao fim do 3º, com os centros a uma fatia um do outro
    e.style.wordSpacing = f2((alvo - w0) / 4) + "px"; // a linha tem 4 espaços
    return true;
  }

  // o TEXTO: entra em 300 ms (opacidade + 24 px de subida, ease-out) e fica PARADO; centrado em cx, topo em y; o número que a voz diz
  // também com a escala 1,04 → 1,00 (identidade §4.4)
  function texto(id, t, tin, cx, y, numero) {
    var e = E(id); if (!e) return;
    var pi = eo(seg(t, tin, 0.3));
    e.style.opacity = pi.toFixed(3);
    e.style.transform = "translate(" + f2(cx) + "px," + f2(y + 24 * (1 - pi)) + "px) translateX(-50%)" + (numero ? " scale(" + (1.04 - 0.04 * pi).toFixed(4) + ")" : "");
  }
  function credito(id, t, tin) { var e = E(id); if (e) e.style.opacity = eo(seg(t, tin, 0.3)).toFixed(3); }

  // a CÂMERA: empurra para a 3ª fatia (1,00 → 1,045, ease-out, até 0,713) e PARA; a deriva do RIG segue e congela nos últimos 250 ms;
  // o still acompanha a 0,6, com a mesma origem
  function camera(t) {
    var s = 1 + 0.045 * eo(seg(t, 0, T.camFim)), td = Math.min(t, T.repouso);
    var dx = 6 * Math.sin(td * 0.23), dy = 4.8 * Math.sin(td * 0.17), ox = G.origem.x, oy = G.origem.y;
    var c = E("cam");
    if (c) { c.style.transformOrigin = f2(ox) + "px " + f2(oy) + "px"; c.style.transform = "scale(" + s.toFixed(5) + ") translate(" + f2(dx) + "px," + f2(dy) + "px)"; }
    var st = E("still");
    if (st) { st.style.transformOrigin = f2(ox + 56) + "px " + f2(oy + 56) + "px"; st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ") translate(" + f2(dx * 0.6) + "px," + f2(dy * 0.6) + "px)"; }
  }
  // a LUZ da mesa: atrás da fatia da vez (passa de uma para a outra em 0,25 s, eb), 120 ms atrás (--mov-luz-atraso)
  function alvoLuz(t) {
    return CENTROS[0] + (CENTROS[1] - CENTROS[0]) * eb(seg(t, T.luz[1] - 0.05, 0.25)) + (CENTROS[2] - CENTROS[1]) * eb(seg(t, T.luz[2] - 0.05, 0.25));
  }

  function cena(t) {
    camera(t);
    var lz = E("luz"); if (lz) { lz.style.setProperty("--luz-x", f2(alvoLuz(t - 0.12) + 140) + "px"); lz.style.setProperty("--luz-y", (V.yEixo + 140) + "px"); }
    // a luz conta as três: a hachura corre em cada fatia; quando a seguinte acende, a anterior cai a 45 %; a 3ª fica inteira
    PECAS.hach.forEach(function (h, i) {
      var frente = eo(seg(t, T.luz[i], T.luzDur));
      var cai = i < 2 ? 0.55 * eb(seg(t, T.luz[i + 1], T.luzDur)) : 0;
      reguaAcender(h, frente, t >= T.luz[i] ? 1 - cai : 0);
    });
    // "unless": a frente corre da beira da 3ª fatia para a direita; à esquerda dela, pontos; à direita, o eixo cheio
    var pf = eb(seg(t, T.unless, T.frenteDur)), frenteX = lerp(XB, X_DIR, pf);
    if (PECAS.frente) { PECAS.frente.setAttribute("x", f2(frenteX)); PECAS.frente.setAttribute("width", f2(Math.max(0, X_DIR - frenteX))); }
    // o pontilhado se apaga para a direita: o comprimento visível cai do quadro inteiro a 620 px (de "unless" a 3,2 s), e os pontos
    // escorrem devagar para a direita (14 px/s, até o repouso)
    var pa = eb(seg(t, T.unless, T.apagaFim - T.unless)), comp = lerp(X_DIR - XB, 620, pa);
    var anda = 14 * clamp(Math.min(t, T.repouso) - T.unless, 0, 1e9);
    PECAS.pontos.forEach(function (p) {
      var x = p.x0 + anda, u = (x - XB) / comp;
      var op = t < T.unless ? 0 : (x <= frenteX ? 1 : 0) * clamp((x - XB - 8) / 18, 0, 1) * clamp(1 - u, 0, 1);
      p.e.setAttribute("cx", f2(x));
      p.e.setAttribute("opacity", op.toFixed(3));
    });

    texto("titulo", t, T.titulo, G.tituloCx, G.tituloY);
    if (PECAS.cotaTitulo) PECAS.cotaTitulo.setAttribute("opacity", eo(seg(t, T.titulo, 0.3)).toFixed(3));
    texto("anos", t, T.anos, G.anosCx, G.anosY);
    texto("cota", t, T.cota, G.cotaCx, G.cotaY, true);
    if (PECAS.chamada) {
      var pc = eo(seg(t, T.cota, 0.3));

  }

    try { if (!ajustarAnos()) window.__erroCena = "os anos da régua não puderam ser medidos"; } catch (e) { window.__erroCena = "ajustarAnos: " + e; }

  window.__regua = { x2024: XA, x2025: V.x(2025), x2026: V.x(2026), x2027: XB, x2029: V.x(2029), y0: V.y0, y1: V.y1, yEixo: V.yEixo, pxAno: V.pxAno };

})();
