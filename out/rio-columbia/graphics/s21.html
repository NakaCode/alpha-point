    });

    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();
</script>
<script>
(function () {
  "use strict";

  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo, eb = R.eb;
  var E = function (id) { return document.getElementById(id); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var SVGNS = "http://www.w3.org/2000/svg";

  var DUR = 9.167;
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia final é do redator-de-tela: textos-tela.json › _textos_por_cena s21) ═══
  var TEXTOS = {
    anoMeses: "JAN FEB MAR APR MAY JUN JUL AUG SEP OCT NOV DEC",                    // [101] eixo, 0–9,167 (um texto só; cada mês sob a sua coluna)
    legenda: "BEFORE THE BIG STORAGE DAMS · 1938–1967",                             // [102] legenda, 0–9,167 (com a voz que a diz)
    cota: "JUNE ≈ 10× FEBRUARY",                                                    // [103] cota, 4,033–9,167 (em "ten"; 10,4×, F029)
    vJun: "JUNE ≈ 217,000 CFS",                                                     // [104] cota, 5,467–9,167 (em "June"; 216,620 cfs)
    vFev: "FEBRUARY ≈ 21,000 CFS",                                                  // [105] cota, 6,100–9,167 (em "February."; 20,832 cfs)
    cred1: "Alpha Point calculation (Water Survey of Canada).",                     // [106] credito, 0–9,167: uma linha
    cred2: "Contains information licensed under the\nOpen Government Licence – Canada."   // [107] credito, 0–9,167: duas linhas (a quebra do redator)
  };
  Object.keys(TEXTOS).forEach(function (k) { var e = E(k); if (e) e.textContent = TEXTOS[k]; });

  // ═════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
  // PEÇA 6 · O ANO DO RIO (nasce na s17; volta aqui e em s47: este bloco é CÓPIA do da s17, sem mudança). Tudo o que diz ONDE
  // a peça fica está no objeto ANO.
  //   - as 12 colunas: as médias mensais do Columbia em Birchbank, British Columbia, 1938–1967, em m³/s (Water Survey of Canada,
  //     estação 08NE049; out/rio-columbia/_dados/tabela-ano-do-rio-birchbank.csv, a coluna antes_1938_1967_m3s, de Jan a Dec);
  //   - a escala: o mês mais cheio (junho, 6.134,0 m³/s) tem ANO.hmax px; os outros, na proporção (fevereiro: 96,17 px);
  //   - a coluna i: x de anoX(i) a anoX(i) + ANO.larg; o topo em ANO.base − anoH(i); o centro em anoCx(i);
  //   - o eixo dos meses: UM <text> (o texto do redator, um nó só), com o x de cada letra posto pelo script para cada mês
  //     ficar centrado na sua coluna (anoMesesLayout, depois de a fonte carregar); a linha de base do texto em ANO.mesesBase;
  //   - a tinta de cada mês: o degradê #anoMesesTinta, 12 passos sem transição, --tinta-escura a 60 % ou a 100 % (anoMes);
  //   - a legenda do gráfico: <div id="legenda">, centrada em x 1920, o topo em ANO.legTopo (84 px);
  //   - a linha de base: de ANO.x0 − 40 a ANO.x1 + 40, logo abaixo das colunas.
  var ANO = {
    x0: 640, x1: 3200,          // a faixa das 12 colunas (conceito, arco (6))
    base: 1560,                 // o y da base das colunas
    hmax: 1000,                 // a altura do mês mais cheio: o topo de junho em y 560
    larg: 160,                  // a largura de cada coluna
    mesesBase: 1664,            // a linha de base do texto do eixo (as maiúsculas de 84 px ficam em y ~1603 → 1664)
    legTopo: 1716,              // o topo da caixa da legenda (a letra em y ~1731 → ~1795)
    antes: [595.4, 589.9, 620.4, 1017.1, 3254.3, 6134.0, 4916.3, 2735.3, 1609.7, 1206.7, 918.2, 709.6]   // m³/s, Jan → Dec, 1938–1967
  };
  ANO.passo = (ANO.x1 - ANO.x0) / 12;                    // 213,33 px de coluna a coluna (o vão entre duas é passo − larg = 53,33 px)
  ANO.pico = Math.max.apply(null, ANO.antes);            // junho
  function anoX(i) { return ANO.x0 + i * ANO.passo + (ANO.passo - ANO.larg) / 2; }   // a borda esquerda da coluna i (0 = Jan)
  function anoCx(i) { return anoX(i) + ANO.larg / 2; }                               // o centro da coluna i
  function anoH(i) { return ANO.hmax * ANO.antes[i] / ANO.pico; }                    // a altura da coluna i, em px
  var anoCols = [], anoStops = [], anoMesesOk = false;
  (function anoMonta() {
    var g = E("anoCols"), gr = E("anoMesesTinta"), i, k, r, s;
    for (i = 0; i < 12; i++) {
      if (g) {
        r = document.createElementNS(SVGNS, "rect"); r.setAttribute("class", "ano-col"); r.id = "anoCol" + i;
        r.setAttribute("width", ANO.larg); r.setAttribute("x", anoX(i).toFixed(2)); r.setAttribute("y", ANO.base); r.setAttribute("height", 0);
        g.appendChild(r); anoCols.push(r);
      }
      if (gr) for (k = 0; k < 2; k++) {
        s = document.createElementNS(SVGNS, "stop"); s.setAttribute("offset", ((i + k) / 12).toFixed(5));
        s.style.stopColor = "var(--tinta-escura)"; s.style.stopOpacity = "0.6"; gr.appendChild(s); anoStops.push(s);
      }
    }
    if (gr) { gr.setAttribute("x1", ANO.x0); gr.setAttribute("x2", ANO.x1); }
    var b = E("anoBase"); if (b) b.setAttribute("d", "M " + (ANO.x0 - 40) + " " + (ANO.base + 3) + " L " + (ANO.x1 + 40) + " " + (ANO.base + 3));
    var m = E("anoMeses"); if (m) m.setAttribute("y", ANO.mesesBase);
    var l = E("legenda"); if (l) l.style.top = ANO.legTopo + "px";
  })();
  // o eixo dos meses: cada mês (3 letras) centrado na sua coluna. A medida é a do Chrome (getStartPositionOfChar e
  // getSubStringLength, com a fonte da marca já carregada); o x de cada letra guarda o avanço natural dentro do mês.
  function anoMesesLayout() {
    var tx = E("anoMeses"); if (!tx || !tx.getStartPositionOfChar) return false;
    if (!document.fonts || !document.fonts.check('500 84px "Marca"')) return false;
    var n = tx.getNumberOfChars(); if (n !== 47) return false;
    tx.setAttribute("x", "0");
    var nat = [], xs = [], i, m, k;
    for (i = 0; i < n; i++) nat.push(tx.getStartPositionOfChar(i).x);
    for (m = 0; m < 12; m++) {
      var a = m * 4, w = tx.getSubStringLength(a, 3), esq = anoCx(m) - w / 2;
      for (k = 0; k < 3; k++) xs[a + k] = esq + (nat[a + k] - nat[a]);
      if (m < 11) xs[a + 3] = esq + w;   // o espaço entre dois meses (não desenha nada)
    }
    tx.setAttribute("x", xs.map(function (v) { return v.toFixed(2); }).join(" "));
    tx.style.opacity = "";
    anoMesesOk = true;
    return true;
  }
  // o estado da coluna i: g = quanto cresceu (0 → 1), a = quanto acendeu (0 = --neutro → 1 = --tinta-escura), op = a opacidade,
  // dx = o deslocamento em x. O único executor da coluna: a borda de baixo fica sempre em ANO.base.
  function anoColuna(i, g, a, op, dx) {
    var r = anoCols[i]; if (!r) return;
    var h = Math.max(0, anoH(i) * g);
    r.setAttribute("x", (anoX(i) + (dx || 0)).toFixed(2));
    r.setAttribute("y", (ANO.base - h).toFixed(2));
    r.setAttribute("height", h.toFixed(2));
    r.style.fill = a > 0 ? "color-mix(in srgb, var(--tinta-escura) " + (a * 100).toFixed(1) + "%, var(--neutro))" : "";
    r.style.opacity = op.toFixed(3);
  }
  // a tinta do nome do mês i no eixo: 60 % (eixo) → 100 % (o mês falado)
  function anoMes(i, a) {
    var o = (0.6 + 0.4 * a).toFixed(3);
    if (anoStops[2 * i]) anoStops[2 * i].style.stopOpacity = o;
    if (anoStops[2 * i + 1]) anoStops[2 * i + 1].style.stopOpacity = o;
  }
  // ═══════════════════════════════════════════════ fim da PEÇA 6 ═══════════════════════════════════════════════════════

  // o texto: entra em 300 ms (opacidade + 24 px de subida, eo); o número que a voz diz, com a escala 1,04 → 1,00 (identidade §4.4).
  // tx = o deslocamento fixo em x ("-50%": centrado no left)
  function texto(el, t, t0, numero, tx) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translate(" + (tx || "0px") + "," + ((1 - p) * 24).toFixed(1) + "px)" + (numero ? " scale(" + (1.04 - 0.04 * p).toFixed(4) + ")" : "");
  }

  // ── os tempos (locais, −193,100), do words.json, dos textos de tela e da regência s21 ──
  var JUN = 5, FEV = 1;
  var T = {
    leg: 0.00,                          // [102]: do 1º quadro, com "Before the big storage dams"
    cam: 1.90, camDur: 1.80,            // o push-in curto (1,00 → 1,015, eb); para em 3,70, 0,33 s antes de "ten"
    cota: 4.033,                        // [103]: em "ten" (4,025), no t0 do redator
    junAcende: 5.440, vJun: 5.467,      // "June": a coluna acende na palavra; [104] no t0 do redator
    fevAcende: 6.080, vFev: 6.100,      // "February.": a coluna acende na palavra; [105] no t0 do redator
    nivel: 6.15, nivelDur: 0.30,        // a linha de nível corre do toco de fevereiro à coluna de junho
    pilha: 6.45, pilhaPasso: 0.06,      // os dez cortes, de baixo para cima (0,6 s)
    cheia: 8.155, cheiaDur: 0.45,       // "floods.": a ponta passa da linha de cima (+160 px, eo)
    cred: 0.00
  };
  // ── a geometria do que é só desta cena ──
  var TOPO = ANO.base - ANO.hmax;                                   // y 560: a linha de cima do gráfico = a altura de junho
  var HFEV = anoH(FEV);                                             // 96,17 px: o bloco de fevereiro
  var CHEIA = 160;                                                  // quanto a ponta passa da linha (conceito s21: +160 px)
  var COL = { x: 232, cota: 184, vJun: TOPO + 25, vFev: 820 };      // a coluna de textos, à esquerda de junho: a borda esquerda e o topo de cada um
  (function () {
    var e = E("cota"); if (e) { e.style.left = COL.x + "px"; e.style.top = COL.cota + "px"; }
    e = E("vJun"); if (e) { e.style.left = COL.x + "px"; e.style.top = COL.vJun + "px"; }
    e = E("vFev"); if (e) { e.style.left = COL.x + "px"; e.style.top = COL.vFev + "px"; }
    e = E("topo"); if (e) e.setAttribute("d", "M " + (ANO.x0 - 40) + " " + TOPO + " L " + (ANO.x1 + 40) + " " + TOPO);
    // o fio do valor de fevereiro: do pé do rótulo (124 px × 1,1 = 136 px de caixa) ao topo do toco
    e = E("fioFev"); if (e) e.setAttribute("d", "M " + anoCx(FEV).toFixed(2) + " " + (COL.vFev + 136 + 14) + " L " + anoCx(FEV).toFixed(2) + " " + (ANO.base - HFEV - 12).toFixed(2));
    // os dez cortes da pilha: k = 1…10, cada um a k × HFEV da base, na coluna de junho
    var g = E("pilha"); if (g) for (var k = 1; k <= 10; k++) {
      var p = document.createElementNS(SVGNS, "path"); p.setAttribute("class", "s21-corte"); p.id = "corte" + k;
      var y = (ANO.base - k * HFEV).toFixed(2);
      p.setAttribute("d", "M " + (anoX(JUN) - 1).toFixed(2) + " " + y + " L " + (anoX(JUN) + ANO.larg + 1).toFixed(2) + " " + y);
      p.style.opacity = "0"; g.appendChild(p);
    }
    e = E("cheia"); if (e) { e.setAttribute("x", anoX(JUN).toFixed(2)); e.setAttribute("width", ANO.larg); }
  })();

  function cena(t) {
    t = t + 0.0005;
    // a câmera: um push-in curto e para; a deriva do RIG (±6 / ±4,8 px) congela nos últimos 250 ms
    var cam = E("cam");
    if (cam) {
      var s = 1 + 0.015 * eb(seg(t, T.cam, T.camDur)), td = Math.min(t, DUR - 0.25);
      var dx = 6 * Math.sin(td * 0.23), dy = 4.8 * Math.sin(td * 0.17);
      cam.style.transform = "scale(" + s.toFixed(5) + ") translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
    }
    if (!anoMesesOk) anoMesesLayout();
    // PEÇA 6: as colunas já crescidas; junho e fevereiro acendem na palavra
    var aJun = eo(seg(t, T.junAcende, 0.3)), aFev = eo(seg(t, T.fevAcende, 0.3));
    for (var i = 0; i < 12; i++) {
      var a = i === JUN ? aJun : i === FEV ? aFev : 0;
      anoColuna(i, 1, a, 1, 0);
      anoMes(i, a);
    }
    // a linha de nível: do topo do toco de fevereiro até a coluna de junho, por trás das colunas
    var nv = E("nivel");
    if (nv) {
      var pn = eo(seg(t, T.nivel, T.nivelDur)), yn = (ANO.base - HFEV).toFixed(2), xa = anoX(FEV) + ANO.larg, xb = anoX(JUN);
      nv.setAttribute("d", "M " + xa.toFixed(2) + " " + yn + " L " + lerp(xa, xb, pn).toFixed(2) + " " + yn);
      nv.style.opacity = t >= T.nivel ? "1" : "0";
    }
    // a pilha: os dez cortes, de baixo para cima
    for (var k = 1; k <= 10; k++) {
      var c = E("corte" + k); if (c) c.style.opacity = eo(seg(t, T.pilha + (k - 1) * T.pilhaPasso, 0.10)).toFixed(3);
    }
    // a ponta que passa da linha de cima (--tensao): presa ao topo da coluna, cresce para cima
    var ch = E("cheia");
    if (ch) {
      var hc = CHEIA * eo(seg(t, T.cheia, T.cheiaDur));
      ch.setAttribute("y", (TOPO - hc).toFixed(2)); ch.setAttribute("height", hc.toFixed(2));
    }
    // o fio do valor de fevereiro entra com o rótulo
    var ff = E("fioFev"); if (ff) ff.style.opacity = eo(seg(t, T.vFev, 0.3)).toFixed(3);
    texto(E("legenda"), t, T.leg, false, "-50%");
    texto(E("cota"), t, T.cota, true);
    texto(E("vJun"), t, T.vJun, true);
    texto(E("vFev"), t, T.vFev, true);
    texto(E("cred1"), t, T.cred);
    texto(E("cred2"), t, T.cred);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () {
    try { if (!anoMesesLayout()) window.__erroCena = "o eixo dos meses não pôde ser medido (a fonte da marca não carregou?)"; }
    catch (e) { window.__erroCena = "anoMesesLayout: " + e; }
    window.__renderAt(0); return true;
  });
  window.__renderAt(0);

})();
</script>
