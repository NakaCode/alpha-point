  function rotuloEm(id, pt, lado, gap, t, t0, t1, dy) {
    var el = E(id); if (!el) return;
    var vt = vidaTexto(t, t0, t1);
    if (vt.v <= 0 || !pt) { mostrar(el, 0, 0, 0); return; }
    var w = el.offsetWidth, h = el.offsetHeight, l, tp;
    if (lado === "esq") { l = pt.x - gap - w; tp = pt.y - h / 2; }
    else if (lado === "dir") { l = pt.x + gap; tp = pt.y - h / 2; }
    else if (lado === "cima") { l = pt.x - w / 2; tp = pt.y - gap - h; }
    else { l = pt.x - w / 2; tp = pt.y + gap; }
    tp += (dy || 0) + vt.sobe;
    mostrar(el, vt.v * cl(naArea(l, tp, w, h) / 30, 0, 1), l, tp);
  }
  // o texto fixo na tela (pílula de número, legenda, pergunta): a caixa em (l, tp), com a mesma vida
  function fixoEm(id, l, tp, t, t0, t1) {
    var el = E(id); if (!el) return;
    var vt = vidaTexto(t, t0, t1);
    mostrar(el, vt.v, l, tp + vt.sobe);
  }

  // ── os créditos: o de mapa INTEIRO do 1º ao último quadro (identidade §4.2); os outros no nível 1, logo acima, cada um no tempo do
  //    seu asset (entra em 300 ms, ou inteiro no 1º quadro quando o asset já abre a cena) ──
  function aplicarCreditos(t) {
    var m = E("credMapa"), vm = 1;
    if (typeof CRED_MAPA_VIS === "function") vm = CRED_MAPA_VIS(t) ? 1 : 0;   // M2: o crédito de mapa inteiro em todo quadro com mapa, e só nele
    else vm = ((typeof CRED_MAPA_DESDE === "number" && t < CRED_MAPA_DESDE) || (typeof CRED_MAPA_ATE === "number" && t >= CRED_MAPA_ATE)) ? 0 : 1;
    if (m) { m.style.opacity = String(vm); m.style.visibility = vm ? "visible" : "hidden"; }
    var hM = m && vm ? m.offsetHeight + 6 : 0;   // M2: sem o de mapa, o crédito de cima desce à faixa de baixo
    (CREDITOS || []).forEach(function (c) {
      var el = E(c.id); if (!el) return;
      var vin = c.inteiro ? (t >= c.t0 ? 1 : 0) : eo(seg(t, c.t0, 0.3));
      var vout = c.t1 === null ? 1 : 1 - eio(seg(t, c.t1 - (c.sai || 0.3), c.sai || 0.3));
      var v = vin * vout;
      el.style.bottom = (24 + hM) + "px";
      el.style.opacity = v.toFixed(3); el.style.visibility = v > 0.001 ? "visible" : "hidden";
    });
  }

  var opAntes = {};
  function opac(id, prop, v) { v = +(+v).toFixed(3); var k = id + "|" + prop; if (opAntes[k] === v) return; map.setPaintProperty(id, prop, v); opAntes[k] = v; }

  // ── P1: A FOTO IMPRESSA NA MESA M-FOZ (identidade §4.4, "A mão que arruma") ──
  var FOTO = { cx: 1920, cy: 1000, w: 1072, h: 839, mold: 20 };   // 800 × 626 a 1,34×, a moldura em --tinta
  function pouso(t) {   // a foto pousa (desce 240 px, −2° → −1,5°, 0,72 → 1,03 até 0,33 s, assenta em 1,00 até 0,55 s)
    var u = t - CENA.pousa;
    if (u < 0) return { op: 0, dy: -240, k: 0.72, rot: -2, p: 0 };
    var k = u < 0.33 ? 0.72 + (1.03 - 0.72) * eo(u / 0.33) : 1.03 - 0.03 * eo((u - 0.33) / 0.22);
    return { op: 1, dy: -240 * (1 - eo(u / 0.45)), k: k, rot: -2 + 0.5 * eo(u / 0.55), p: eo(u / 0.55) };
  }
  function empurrao(t) { return 1 + 0.04 * eio(seg(t, CENA.empurra[0], CENA.empurra[1] - CENA.empurra[0])); }
  function deriva(t) { var td = Math.min(t, CENA.empurra[1]); return [6 * Math.sin(td * 0.23), 4.8 * Math.sin(td * 0.17)]; }
  function camMesa(k, d) { var o = [FOTO.cx, FOTO.cy];
    return "translate(" + (o[0] + d[0]).toFixed(2) + "px," + (o[1] + d[1]).toFixed(2) + "px) scale(" + k.toFixed(5) + ") translate(" + (-o[0]) + "px," + (-o[1]) + "px)"; }
  function aplicarMesa(t) {
    var me = E("mesa"); if (!me) return;
    var vm = t < CENA.corte ? 1 : 0;
    me.style.visibility = vm ? "visible" : "hidden";
    if (!vm) { var r0 = E("rotMesa"); if (r0) mostrar(r0, 0, 0, 0); return; }
    var k = empurrao(t), d = deriva(t), kp = 1 + 0.6 * (k - 1);
    var st = E("still"); if (st) st.style.transform = camMesa(kp, [d[0] * 0.6, d[1] * 0.6]);
    var cm = E("mesaCam"); if (cm) cm.style.transform = camMesa(k, d);
    var a = pouso(t), fo = E("impressa"), so = E("sombra");
    var tr = "translate(" + (FOTO.cx - FOTO.w / 2 - FOTO.mold).toFixed(2) + "px," + (FOTO.cy - FOTO.h / 2 - FOTO.mold + a.dy).toFixed(2) + "px) rotate(" + a.rot.toFixed(3) + "deg) scale(" + a.k.toFixed(4) + ")";
    if (fo) { fo.style.opacity = String(a.op); fo.style.transform = tr; }
    if (so) { var sy = 64 + (12 - 64) * a.p, sk = 1.05 + (1 - 1.05) * a.p, sop = (0.35 + (0.80 - 0.35) * a.p) * a.op;
      so.style.opacity = sop.toFixed(3);
      so.style.transform = "translate(" + (FOTO.cx - FOTO.w / 2 - FOTO.mold).toFixed(2) + "px," + (FOTO.cy - FOTO.h / 2 - FOTO.mold + a.dy + sy).toFixed(2) + "px) rotate(" + a.rot.toFixed(3) + "deg) scale(" + (a.k * sk).toFixed(4) + ")"; }

    var rm = E("rotMesa");
    if (rm) fixoEm("rotMesa", FOTO.cx - FOTO.w / 2 - FOTO.mold, 512 - rm.offsetHeight, t, CENA.rotMesa[0], null);
  }
  // ── P2: a mesma foto, da caixa do último quadro da mesa até a miniatura presa a Vanport ──
  var MINI = { w: 360, h: 282, mold: 6, dx: -80, dy: -100 };   // a borda direita (com a moldura) 80 px antes do ponto; o alto 100 px acima
  function aplicarFotoMapa(t, pV) {
    var el = E("fotoMapa"); if (!el) return;
    if (t < CENA.corte) { el.style.visibility = "hidden"; return; }
    var u = eo(seg(t, CENA.encolhe[0], CENA.encolhe[1]));
    var k0 = empurrao(CENA.corte), d0 = deriva(CENA.corte);
    var w0 = FOTO.w * k0, h0 = FOTO.h * k0, m0 = FOTO.mold * k0, c0 = [FOTO.cx + d0[0], FOTO.cy + d0[1]];
    var c1 = [pV[0] + MINI.dx - MINI.w / 2 - MINI.mold, pV[1] + MINI.dy + MINI.h / 2 + MINI.mold];
    var w = w0 + (MINI.w - w0) * u, h = h0 + (MINI.h - h0) * u, m = m0 + (MINI.mold - m0) * u;

  // A LUZ DE CORRENTE (identidade §2; a peça do M2: traço 70, vão 230, 110 px/s rio abaixo, a fase no relógio do VÍDEO), sobre o Columbia

  function caminho(pts, cam) {

  function aplicarCorrente(t, cam, v) {

    opac("col", "line-opacity", vl); opac("borda", "line-opacity", vl); opac("borda-sob", "line-opacity", vl);
    aplicarCorrente(t, cam, vl);

    var pT = prj(DJ.TRAIL, cam), pV = prj(DJ.VAN, cam), pP = prj(DJ.POR, cam);

    var mb = aplicarFotoMapa(t, pV), hs = E("haste");
    if (hs) { var vh = t >= C.corte ? eo(seg(t, C.haste, 0.3)) : 0; hs.setAttribute("opacity", vh.toFixed(3));

      hs.setAttribute("x2", (pV[0] + MINI.dx).toFixed(1)); hs.setAttribute("y2", (pV[1] + MINI.dy + MINI.h / 2 + MINI.mold).toFixed(1)); }
    // Trail: o ponto em 'Trail,'; o rótulo à direita, a borda de baixo 8 px abaixo do ponto (acima da fronteira, 32 px abaixo dele)
    pinoEm("ptTrail", pT, eo(seg(t, C.trail, 0.3)));
    var rt = E("rotTrail"); if (rt) caixaEm("rotTrail", pT[0] + 60, pT[1] + 8 - rt.offsetHeight, t, C.rotTrail, null);
    // Vanport: o rótulo embaixo da miniatura, alinhado à borda direita dela
    var rv = E("rotVan"); if (rv) caixaEm("rotVan", pV[0] + MINI.dx - rv.offsetWidth, pV[1] + 200, t, C.rotVan, null);
    // Portland: o ponto e o rótulo à direita e abaixo dele, abaixo da linha do rio
    pinoEm("ptPor", pP, eo(seg(t, C.portland, 0.3)));
    caixaEm("rotPor", pP[0] + 40, pV[1] + 65, t, C.portland, null);
    return Promise.resolve();
  }

  // OS CRÉDITOS (identidade §4.1/§4.2; o do M3): o de mapa embaixo, do 1º ao último quadro com mapa; os outros empilhados acima dele,
  // na ordem da lista (de baixo para cima), cada um no tempo do seu asset
  function aplicarCreditos(t) {
    var m = E("credMapa"), vm = CRED_MAPA_VIS(t) ? 1 : 0;
    if (m) { m.style.opacity = String(vm); m.style.visibility = vm ? "visible" : "hidden"; m.style.bottom = "24px"; }
    var y = 24 + (m && vm ? m.offsetHeight + 6 : 0);
    (CREDITOS || []).forEach(function (c) {
      var el = E(c.id); if (!el) return;
      var vin = c.inteiro ? (t >= c.t0 ? 1 : 0) : eo(seg(t, c.t0, 0.3));
      var vout = c.t1 === null ? 1 : 1 - eio(seg(t, c.t1 - (c.sai || 0.3), c.sai || 0.3));
      var v = (c.t1 !== null && t >= c.t1) ? 0 : vin * vout;
      el.style.bottom = y + "px";
      el.style.opacity = v.toFixed(3); el.style.visibility = v > 0.001 ? "visible" : "hidden";

  }

  function aplicar(t) {
    if (!mapaCarregado) return Promise.resolve();
    // o relevo liga a partir de TERRENO_DESDE (s08: 0,2 s, pitch 0,5°, exagero 0,003): com ele ligado e o pitch 0, o MapLibre escolhia
    // outro nível de tile no canto do quadro, e o 1º quadro da s08 não casava com o último da s07

    if (querRelevo && !map.getTerrain()) map.setTerrain({ source: "dem", exaggeration: 0 });
    if (TERRENO && !querRelevo && map.getTerrain()) map.setTerrain(null);

    var cam = cameraAt(t);
    map.jumpTo(cam);
    if (typeof ALTA_AT === "function") {   // o satélite por trecho: a camada alta por cima; a de teto some quando a alta cobre tudo
      var al = cl(ALTA_AT(t), 0, 1); window.__nivelAlta = al;
      var visA = al > 0 ? "visible" : "none", visB = al < 1 ? "visible" : "none";
      if (map.getLayoutProperty("baseAlta", "visibility") !== visA) map.setLayoutProperty("baseAlta", "visibility", visA);
      if (map.getLayoutProperty("base", "visibility") !== visB) map.setLayoutProperty("base", "visibility", visB);
      opac("baseAlta", "raster-opacity", al);
    }
    if (querRelevo) {
      // o centro da câmera fica na cota 0 (a s44 do Juneau; Peru s06): a câmera é a mesma em todo render, com ou sem o relevo pronto
      map._elevationFreeze = true;
      if (map.terrain && map.transform.elevation !== 0) map.transform.elevation = 0;
      var ex = exageroAt(t);
      if (map.terrain && Math.abs(map.terrain.exaggeration - ex) > 1e-4) map.terrain.exaggeration = ex;
      window.__exagero = ex;
    }
    var volta = aplicarCena(t, cam);   // M9: a promessa da cena (o vídeo posicionado), que o render espera
    aplicarCreditos(t);
    if (querRelevo && map.terrain) {
      // A ESPESSURA DAS LINHAS SOBRE O RELEVO (s44 do Juneau): a textura das linhas se refaz em todo quadro, no zoom dele
      var tsc = map.terrain.sourceCache;
      if (!tsc || typeof tsc.freeRtt !== "function") { falhar("o MapLibre desta cena não tem terrain.sourceCache.freeRtt."); return volta; }
      tsc.freeRtt(); map.triggerRepaint();
    }
    return volta;
  }

  // a prova do trecho de perto (retomada-teto.md, item 1): o menor nível de tile do satélite que a câmera de t pede (os tiles que cobrem o
  // quadro, com o relevo), sem esperar tile nenhum
  window.__zMinNaTela = function (t) {
    try {
      if (typeof t === "number") window.__renderAt(t);
      var ts = map.transform.coveringTiles({ tileSize: P.base.tileSize, minzoom: 0, maxzoom: P.base.maxzoom, roundZoom: true, reparseOverscaled: true, terrain: map.terrain || null });
      var m = 99; ts.forEach(function (id) { m = Math.min(m, id.canonical.z); }); return { zmin: m, n: ts.length };
    } catch (e) { return { erro: String(e && e.message) }; }
  };
  window.__renderAt = function (t) {
    try { return aplicar(cl(+t || 0, 0, DUR)) || Promise.resolve(); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); return Promise.resolve(); }
  };

  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}

  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou. O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  // pronto: os tiles do satélite, as fontes da cena e (com relevo) o DEM carregados, o terreno ligado, o mapa parado, dois quadros pintados
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!mapaCarregado || !map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) if (!map.getSource(FONTES[i]) || !map.isSourceLoaded(FONTES[i])) return false;
          var usaB = map.getLayoutProperty("base", "visibility") !== "none", usaA = map.getLayer("baseAlta") && map.getLayoutProperty("baseAlta", "visibility") !== "none";
          if (usaB && (!map.getSource("base") || !map.isSourceLoaded("base"))) return false;
          if (usaA && (!map.getSource("baseAlta") || !map.isSourceLoaded("baseAlta"))) return false;
          if (window.__relevoLigado && (!map.getSource("dem") || !map.isSourceLoaded("dem") || !map.getTerrain())) return false;
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = mapaCarregado && map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }

        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";

    capturando = true;

})();
