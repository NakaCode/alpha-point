  function motivoRede(err, msg) {
    var st = err.status, n = err.tentativas > 1 ? " (" + err.tentativas + " tentativas)" : "";
    if (err.falha === "corrompido" || /could not be decoded|could not load image|tile corrompido/i.test(msg))
      return "mandou tile CORROMPIDO" + n + " (" + String(msg).replace(/^tile corrompido: /, "") + "). Renderize de novo.";
    if (err.falha === "tempo") return "não respondeu em " + PRAZO_TENTATIVA / 1000 + " s" + n + ". Renderize de novo.";
    if (st === 401 || st === 403) return "recusou o acesso (HTTP " + st + "). Confira a chave " + (P.credencial || "") + " e o plano do dono.";
    if (st === 429) return "limitou as requisições (HTTP 429)" + n + ". Espere e renderize de novo.";
    if (st >= 500) return "está com erro no servidor (HTTP " + st + ")" + n + ". Tente de novo mais tarde.";
    if (st) return "respondeu HTTP " + st + ".";
    return "não respondeu (sem internet? servidor fora do ar? firewall?)" + n + ".";
  }
  var mapaCarregado = false;
  map.on("error", function (ev) {
    window.__errosMapa++;
    var err = (ev && ev.error) || {};
    var msg = String(err.message || "");
    var deRede = err.status || err.url || (ev && ev.tile) || /fetch|network|failed to load|load failed|cors/i.test(msg);
    if (!deRede) return falhar("o MapLibre acusou erro na cena: " + (msg || "sem descrição") + ".");
    var fonte = ev && ev.sourceId ? " (fonte '" + ev.sourceId + "')" : (mapaCarregado ? "" : " (o estilo do mapa)");
    falhar("a base '" + P.nome + "'" + fonte + " " + motivoRede(err, msg) + (err.url ? " URL: " + String(err.url).split("?")[0] : ""));
  });
  map.on("load", function () {
    mapaCarregado = true;
    map.once("idle", function () {
      var f = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      f.then(function () { if (!window.__erroCena) resolverPronto(true); });
    });
  });

  // ── o desenho sobre o mapa (o da s22): a luz de corrente, a cheia de Trail a Vanport, os pontos, os rótulos e as pílulas ──
  var CORRENTE = { traco: 70, vao: 230, vel: 110 };
  function caminho(pts) {
    var d = "", i, p;
    for (i = 0; i < pts.length; i++) { p = map.project(pts[i]); d += (i ? "L" : "M") + p.x.toFixed(1) + "," + p.y.toFixed(1); }
    return d;
  }
  function caixa(el, l, tp, t, t0) {
    if (!el) return;
    var v = eo(seg(t, t0, 0.3));
    el.style.opacity = v.toFixed(3); el.style.visibility = v > 0.001 ? "visible" : "hidden";
    el.style.transform = "translate(" + l.toFixed(2) + "px," + (tp + (1 - v) * 24).toFixed(2) + "px)";
  }
  function pino(id, p, v) {
    var g = E(id); if (!g) return;
    g.setAttribute("opacity", String(v)); g.setAttribute("transform", "translate(" + p.x.toFixed(1) + "," + p.y.toFixed(1) + ")");
  }
  function aplicarMapa(t, noMapa) {
    var v = noMapa ? 1 : 0, lz = E("luzCol"), ch = E("cheia"), cs = E("cheiaSob");
    if (lz) lz.setAttribute("opacity", (0.85 * v).toFixed(3));
    if (ch) ch.setAttribute("opacity", String(v));
    if (cs) cs.setAttribute("opacity", (0.6 * v).toFixed(3));
    var pT = map.project(TRAIL), pV = map.project(VAN);
    pino("ptTrail", pT, v); pino("ptVan", pV, v);
    var rt = E("rotTrail"), rv = E("rotVan"), pm = E("pilMortos"), pd = E("pilDesab");
    if (!noMapa) {
      [rt, rv, pm, pd].forEach(function (el) { if (el) { el.style.opacity = "0"; el.style.visibility = "hidden"; } });
      return;
    }
    // a luz de corrente desce o rio no relógio do vídeo; a cheia é a linha do rio de Trail a Vanport
    var per = CORRENTE.traco + CORRENTE.vao;
    if (lz) { lz.setAttribute("d", caminho(COL)); lz.setAttribute("stroke-dasharray", CORRENTE.traco + " " + CORRENTE.vao);
      lz.setAttribute("stroke-dashoffset", (-(((T0V + t) * CORRENTE.vel) % per)).toFixed(1)); }
    var d = caminho(CHEIA);
    if (ch) ch.setAttribute("d", d);
    if (cs) cs.setAttribute("d", d);
    // Trail: o rótulo à direita do ponto, a borda de baixo 8 px abaixo dele (acima da fronteira): o lugar da s22
    if (rt) caixa(rt, pT.x + 60, pT.y + 8 - rt.offsetHeight, t, T.rotMapa);
    // Vanport: o rótulo embaixo e à esquerda do ponto (a borda direita 40 px antes dele)
    if (rv) caixa(rv, pV.x - 40 - rv.offsetWidth, pV.y + 36, t, T.rotMapa);
    // as duas pílulas de dado: fixas na tela, a leste do rio, ao lado do meio do trecho da cheia (abaixo da curva de y 668–773, que
    // chega a x 1905 e fica 56 px acima da 1ª pílula; dali para baixo o rio fica a oeste de x 1757)
    caixa(pm, 1880, 840, t, T.mortos);
    caixa(pd, 1880, 1206, t, T.desab);
  }
  function aplicarCreditos(t) {
    var u = E("credUsgs"), m = E("credMapa"), noMapa = t >= CORTE;
    if (u) { var vu = eo(seg(t, T.credUsgs, 0.3)); u.style.opacity = vu.toFixed(3); u.style.visibility = vu > 0.001 ? "visible" : "hidden";
      u.classList.toggle("pil", noMapa); }
    if (m) { m.style.opacity = noMapa ? "1" : "0"; m.style.visibility = noMapa ? "visible" : "hidden"; }
  }

  function aplicar(t) {
    if (!mapaCarregado) return;
    t = t + 0.0005;
    map.jumpTo(cameraAt(t));
    var noMapa = t >= CORTE, me = E("mesaCena");
    if (me) me.style.display = noMapa ? "none" : "block";
    if (!noMapa) aplicarMesa(t);
    aplicarMapa(t, noMapa);
    aplicarCreditos(t);
  }
  window.__renderAt = function (t) {
    try { aplicar(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }
  };

    function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou. O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          for (var i = 0; i < FONTES.length; i++) if (!map.getSource(FONTES[i]) || !map.isSourceLoaded(FONTES[i])) return false;
          return true;
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
</script>
</body>
