/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de
   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro

   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();
   Lei: a cena é função pura de t. Nada aqui lê relógio, sorteia ou anda sozinho. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};
    const s = (o.base ?? 1.02) + (o.zoom ?? 0.0024) * t;
    const x = (o.ax ?? 6) * Math.sin(t * 0.23), y = (o.ay ?? 4.8) * Math.sin(t * 0.17);
    el.style.transform = "scale(" + s.toFixed(5) + ") translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";

  // Vídeo por f(t): posiciona e espera o "seeked". Na galeria (__PREVIEW) não mexe.
  function seekTo(v, tt) {
    if (!v || window.__PREVIEW || v.readyState < 1) return Promise.resolve();
    const d = v.duration; if (d > 0 && isFinite(d)) tt = clamp(tt, 0, Math.max(0, d - 0.001));
    if (Math.abs(v.currentTime - tt) < 1e-4 && !v.seeking) return Promise.resolve();
    return new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.addEventListener("error", r, { once: true }); v.currentTime = tt; });
  }
  // Grão: ruído de semente fixa por quadro (mulberry32). Mesmo t, mesmo grão.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  function grao(cv, t, o) {
    if (!cv || !cv.getContext) return; o = o || {};
    const ctx = cv.getContext("2d"), w = cv.width, h = cv.height;
    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));
    const img = ctx.createImageData(w, h), d = img.data, a = o.alfa ?? 22;
    for (let i = 0; i < d.length; i += 4) { const v = (sorte() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }

  }

  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }
  function cor(v) { return typeof CSS !== "undefined" && CSS.supports ? CSS.supports("color", v) : /^#[0-9a-f]{3,8}$|^(rgb|hsl)a?\(/i.test(v); }

    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));
    }
  }
  // Prontidão: <img>, <image> de SVG e TODAS as faces "Marca"/"MarcaSec". Nunca rejeita: o que falhou
  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");

    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }

})();

  // ═════════════════════════════════════════════════════════════════════════════════════════════════════════════
  Object.keys(TEXTOS).forEach(function (k) { var e = E(k); if (e) e.textContent = TEXTOS[k]; });

  var T = {
    push: [0, 1.55],                       // a câmera empurra para a faixa e para antes do carimbo
    naoEscala: [0.167, 3.967],
    carimbo: [1.833, 3.967],               // os t0/t1 do redator
    p2: 3.967, encolhe: 0.50, morfo: 0.60, // 'The': o corte encolhe; a tira se estica
    eixo: [4.25, 0.55], contorno: [4.35, 0.30],
    bloco1: 4.000, bloco2: 5.567, cred: 4.000,
    pavio: [5.297, 6.562],                 // 'those' → 'out.': a faísca corre os 60 anos
    pulso: 0.322,                          // o pulso da ponta, de 'out.' até 6,884 (o repouso de 250 ms antes do corte)
    push2: [4.6, 6.884],
    luzAtraso: 0.12
  };

  // ════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
  // A RÉGUA DO TEMPO (peça 3 do conceito) · NASCE AQUI (s08) e volta em s29, s31, s33, s34, s57, s58 e s59.
  // Para reusar: copie este bloco INTEIRO (de "A RÉGUA DO TEMPO" até "FIM DA RÉGUA DO TEMPO"), o CSS .ar, .ar-fina, .sombra-linha,
  // .hachura e .ponto, e o <svg id="desenho"> com <defs id="reguaDefs"> e <g id="regua">. Mude só a VISTA (abaixo) e o que a sua
  // cena acende. Tudo é função de t; nada lê relógio.
  //
  // A ESCALA VERDADEIRA (o arco do conceito): o eixo em y 1180, de x 400 a x 3440; 1964 em x 520, 2024 em x 2600 (34,667 px por
  // ano); 2025, 2026 e 2027 são três fatias de 34,667 px (até x 2704); 2029 em x 2773,3. A vista inteira é reguaVista(REGUA.inteira).
  // A PONTA EM ×8 (s08, s58, s59): 2024 em x 1505 → as fatias com 277,33 px (2025: x 1505–1782,3; 2026: 1782,3–2059,7; 2027:
  // 2059,7–2337), 2029 em x 2891,7; a banda das fatias em y 1080–1280, centrada no eixo.
  // A altura da banda é da vista (não escala com o tempo): na ponta ×8 são 200 px.
  var REGUA = {
    yEixo: 1180,                                              // o eixo da régua, no palco (o mesmo em toda vista)
    x0: 400, x1: 3440,                                        // as pontas do eixo na escala verdadeira
    pxAno: (2600 - 520) / 60,                                 // 34,667 px por ano, na escala verdadeira
    inteira: { k: 1, anoRef: 1964, xRef: 520, y0: 1150, y1: 1210 },    // a régua inteira (a banda de 60 px é sugestão: nenhuma cena deste lote a usa)
    ponta:   { k: 8, anoRef: 2024, xRef: 1505, y0: 1080, y1: 1280 },   // só a ponta, em ×8 (o enquadramento de s08)
    traco: 6,                                                 // --linha-espessura: o traço de engenheiro
    cotaFina: 3,                                              // a linha de cota e a de chamada
    sombra: { larg: 16, dy: 12, op: 0.8 },                    // a sombra solta do traço: cópia em --tinta-escura, sem desfoque
    hachura: { passo: 48, traco: 4, folga: 3 },               // a hachura da FAIXA do corte (peça 1): linhas x + y = c a cada 48 px, 4 px, --destaque
    pontilhado: { passo: 34, raio: 4 }                        // o trecho sem data: pontos de 8 px a cada 34 px
  };
  // a vista: x(ano) no palco. v = { k, anoRef, xRef, y0, y1 }
  function reguaVista(v) {
    var px = REGUA.pxAno * v.k;
    return { k: v.k, pxAno: px, y0: v.y0, y1: v.y1, yEixo: REGUA.yEixo, x: function (ano) { return v.xRef + (ano - v.anoRef) * px; } };
  }
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, pai) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) if (Object.prototype.hasOwnProperty.call(attrs, k)) e.setAttribute(k, attrs[k]);
    if (pai) pai.appendChild(e);
    return e;
  }
  // o contorno de um grupo de fatias vizinhas (anos = [2025, 2026, 2027]: cada fatia vai de x(ano − 1) a x(ano)): o retângulo e as divisas
  function reguaFatiasD(V, anos) {
    var xa = V.x(anos[0] - 1), xb = V.x(anos[anos.length - 1]);
    var d = "M" + f2(xa) + "," + V.y0 + " H" + f2(xb) + " V" + V.y1 + " H" + f2(xa) + " Z";
    for (var i = 0; i < anos.length - 1; i++) d += " M" + f2(V.x(anos[i])) + "," + V.y0 + " V" + V.y1;
    return d;
  }
  // a hachura de UMA fatia (ou de um bloco, de anoA a anoB): devolve { g, clip }: g é o grupo (a opacidade = o brilho) e clip é o
  // <rect> do recorte (a largura = a frente que corre da esquerda para a direita). id = sufixo único no arquivo.
  function reguaHachura(V, anoA, anoB, id, pai, defs) {
    var H = REGUA.hachura, xa = V.x(anoA) + H.folga, xb = V.x(anoB) - H.folga, ya = V.y0 + H.folga, yb = V.y1 - H.folga;
    var cp = el("clipPath", { id: "reguaClip" + id }, defs);
    var rc = el("rect", { x: f2(xa), y: ya, width: 0, height: yb - ya }, cp);
    var g = el("g", { "clip-path": "url(#reguaClip" + id + ")", opacity: 0 }, pai);
    // linhas x + y = c (sobem para a direita), em múltiplos do passo: as fatias vizinhas emendam a hachura sem degrau
    for (var c = Math.ceil((xa + ya) / H.passo) * H.passo; c <= xb + yb; c += H.passo) {
      el("line", { class: "hachura", x1: f2(c - ya), y1: ya, x2: f2(c - yb), y2: yb }, g);
    }
    return { g: g, clip: rc, xa: xa, larg: xb - xa };
  }
  function reguaAcender(h, frente, brilho) {   // frente 0..1 (a hachura correndo), brilho 0..1
    if (!h) return;
    h.clip.setAttribute("width", f2(h.larg * clamp(frente, 0, 1)));
    h.g.setAttribute("opacity", clamp(brilho, 0, 1).toFixed(3));
  }
  // o pontilhado (o trecho sem data): pontos de xa até xb, cada um com a opacidade dele
  function reguaPontos(V, xa, xb, pai) {
    var P = REGUA.pontilhado, lista = [];
    for (var x = xa - P.passo; x <= xb; x += P.passo) lista.push({ x0: x, e: el("circle", { class: "ponto", cx: f2(x), cy: V.yEixo, r: P.raio, opacity: 0 }, pai) });
    return lista;
  }

  // ── a montagem desta cena ──
  // A VISTA INTEIRA (escala verdadeira): 1964 em x 520, 2024 em x 2600; a banda de 120 px (decisão desta cena, no cabeçalho)
  var VISTA_INTEIRA = { k: 1, anoRef: 1964, xRef: 520, y0: 1120, y1: 1240 };
  var V = reguaVista(VISTA_INTEIRA);
  var X64 = V.x(1964), X24 = V.x(2024);
  var NS = "http://www.w3.org/2000/svg";
  var gRegua = E("regua"), gTopo = E("reguaTopo");
  var P = {};
  if (gRegua && gTopo) {
    var S = REGUA.sombra;
    var gS = el("g", { transform: "translate(0," + S.dy + ")", opacity: S.op }, gRegua);
    var dEixoE = "M" + REGUA.x0 + "," + V.yEixo + " H" + f2(X64), dEixoD = "M" + f2(X24) + "," + V.yEixo + " H" + REGUA.x1;
    var dBloco = "M" + f2(X64) + "," + V.y0 + " H" + f2(X24) + " V" + V.y1 + " H" + f2(X64) + " Z";
    P.sEixoE = el("path", { class: "sombra-linha", d: dEixoE, pathLength: 1000 }, gS);
    P.sEixoD = el("path", { class: "sombra-linha", d: dEixoD, pathLength: 1000 }, gS);
    P.sBloco = el("path", { class: "sombra-linha", d: dBloco, opacity: 0 }, gS);
    P.eixoE = el("path", { class: "ar", d: dEixoE, pathLength: 1000 }, gTopo);
    P.eixoD = el("path", { class: "ar", d: dEixoD, pathLength: 1000 }, gTopo);
    P.bloco = el("path", { class: "ar", d: dBloco, opacity: 0 }, gTopo);
    // a linha de cota que abraça os 60 anos, ABAIXO do bloco (y 1290), com as duas pernas: a do traço de engenheiro, 3 px
    P.cota = el("path", { class: "ar-fina", opacity: 0, d: "M" + f2(X64) + ",1272 V1308 M" + f2(X64) + ",1290 H" + f2(X24) + " M" + f2(X24) + ",1272 V1308" }, gTopo);
    // a ponta de 2024: o traço que acende, o pulso e a faísca (o brilho é traço duplicado, nunca filtro)
    // (var() não vale em atributo de apresentação do SVG: a cor vai ao style)
    var cor = function (e, o) { for (var k in o) e.style.setProperty(k, o[k]); return e; };
    P.ponta = cor(el("line", { x1: f2(X24), y1: V.y0 - 34, x2: f2(X24), y2: V.y1 + 34, "stroke-width": 10, opacity: 0 }, gTopo), { stroke: "var(--destaque)" });
    P.pulso = cor(el("circle", { cx: f2(X24), cy: V.yEixo, r: 30, "stroke-width": 8, opacity: 0 }, gTopo), { fill: "none", stroke: "var(--destaque)" });
    P.faiscaHalo = cor(el("circle", { cx: f2(X64), cy: V.yEixo, r: 36, opacity: 0 }, gTopo), { fill: "var(--destaque)" });
    P.faisca = cor(el("circle", { cx: f2(X64), cy: V.yEixo, r: 15, "stroke-width": 6, opacity: 0 }, gTopo), { fill: "var(--tinta)", stroke: "var(--destaque)" });
    [P.eixoE, P.eixoD, P.sEixoE, P.sEixoD].forEach(function (p) { p.setAttribute("stroke-dasharray", "1000 1000"); p.setAttribute("stroke-dashoffset", "1000"); });
  }
  // A TIRA: as linhas da hachura (x + y = c, passo 48: as mesmas da faixa e do bloco), duas cópias: a viva e a queimada (o pavio)
  (function () {
    var H = REGUA.hachura, ya = 480, yb = 1320;
    ["tiraViva", "tiraQueimada"].forEach(function (id) {
      var g = E(id); if (!g) return;
      for (var c = Math.floor((200 + ya) / H.passo) * H.passo; c <= 3500 + yb; c += H.passo) {
        el("line", { class: "hachura", x1: f2(c - ya), y1: ya, x2: f2(c - yb), y2: yb }, g);
      }
    });
  })();

  var C = CORTE.montar(E("gCorte"));
  var FX = CORTE.faixaPts();                                   // (810, 860) (3000, 860) (3000, 1040) (1373, 1040)
  var FB = REGUA.hachura.folga;
  var BLOCO_PTS = [[X64 + FB, V.y0 + FB], [X24 - FB, V.y0 + FB], [X24 - FB, V.y1 - FB], [X64 + FB, V.y1 - FB]];
  var MINI = { s: 0.4, x: 260, y: 220 };                         // o corte pequeno: a caixa (520, 560) vai a (260, 220)
  var MINI_T = { x: MINI.x - 520 * MINI.s, y: MINI.y - 560 * MINI.s };
  var LUZ_FAIXA = { x: 2190, y: 950 }, LUZ_REGUA = { x: (X64 + X24) / 2, y: V.yEixo };
  var CARIMBO_C = { x: 2190, y: 950 };

  function cameraEscala(t) {
    var s = 1 + 0.015 * eo(seg(t, T.push[0], T.push[1] - T.push[0]));
    return s + 0.007 * eb(seg(t, T.push2[0], T.push2[1] - T.push2[0]));
  }
  function camera(t) {
    var s = cameraEscala(t);
    var c = E("cam"); if (c) c.style.transform = "scale(" + s.toFixed(5) + ")";
    var st = E("still"); if (st) st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ")";
  }
  function corteT(t) {                                          // o corte encolhe para o alto à esquerda
    var u = eb(seg(t, T.p2, T.encolhe));
    return { s: lerp(1, MINI.s, u), x: lerp(0, MINI_T.x, u), y: lerp(0, MINI_T.y, u), u: u };
  }
  function luz(t) {
    var p = eb(seg(t - T.luzAtraso, T.p2, T.morfo));
    var x = lerp(LUZ_FAIXA.x, LUZ_REGUA.x, p), y = lerp(LUZ_FAIXA.y, LUZ_REGUA.y, p);
    var lz = E("luz"); if (lz) { lz.style.setProperty("--luz-x", (x + 400).toFixed(1) + "px"); lz.style.setProperty("--luz-y", (y + 400).toFixed(1) + "px"); }
  }
  // a vida de um texto: entra em 300 ms (opacidade + 24 px de subida, ease-out), sai em 300 ms até t1
  function vida(t, t0, t1) {
    var vin = eo(seg(t, t0, 0.3)), vout = t1 == null ? 1 : 1 - eb(seg(t, t1 - 0.3, 0.3));
    return { v: vin * vout, sobe: 24 * (1 - vin) };
  }
  function texto(id, t, t0, t1, x, y) {
    var e = E(id); if (!e) return;
    var vd = vida(t, t0, t1);
    e.style.opacity = vd.v.toFixed(3);
    e.style.visibility = vd.v > 0.001 ? "visible" : "hidden";
    if (x != null) e.style.transform = "translate(" + f2(x) + "px," + f2(y + vd.sobe) + "px)";
    else e.style.transform = "translateY(" + f2(vd.sobe) + "px)";
  }
  function carimbo(t) {
    var e = E("carimbo"); if (!e) return;
    var a = seg(t, T.carimbo[0], 0.3), v = clamp((t - T.carimbo[0]) / 0.09, 0, 1) * (1 - eb(seg(t, T.carimbo[1] - 0.3, 0.3)));
    var k = t < T.carimbo[0] ? 1.04 : 1.04 - 0.04 * eo(a);       // bate: 1,04 → 1,00 em 300 ms
    e.style.opacity = v.toFixed(3); e.style.visibility = v > 0.001 ? "visible" : "hidden";
    var w = e.offsetWidth, h = e.offsetHeight;
    e.style.transform = "translate(" + f2(CARIMBO_C.x - w / 2) + "px," + f2(CARIMBO_C.y - h / 2) + "px) rotate(-2.5deg) scale(" + k.toFixed(4) + ")";
  }
  function tira(t) {
    var g = E("gTira"), poly = E("tiraPoly"); if (!g || !poly) return;
    if (t < T.p2) { g.setAttribute("opacity", "0"); return; }
    var ct = corteT(t), m = eb(seg(t, T.p2, T.morfo));
    var pts = FX.map(function (p, i) {
      var a = [ct.x + ct.s * p[0], ct.y + ct.s * p[1]], b = BLOCO_PTS[i];
      return f2(lerp(a[0], b[0], m)) + "," + f2(lerp(a[1], b[1], m));
    }).join(" ");
    poly.setAttribute("points", pts);
    g.setAttribute("opacity", "1");
    // o pavio: o que a faísca já passou fica queimado (a 40 %)
    var xf = faiscaX(t);
    var q = E("queimadoRect"), vv = E("vivoRect");
    if (q) q.setAttribute("width", f2(Math.max(0, xf)));
    if (vv) { vv.setAttribute("x", f2(xf)); vv.setAttribute("width", f2(Math.max(0, 3840 - xf))); }
  }
  function faiscaX(t) {                                          // a passo constante (o pavio queima igual), 1964 → 2024
    if (t < T.pavio[0]) return -10;
    return lerp(X64, X24, seg(t, T.pavio[0], T.pavio[1] - T.pavio[0]));
  }
  function regua(t) {
    var pe = seg(t, T.eixo[0], T.eixo[1]), pe2 = pe < 0.5 ? 2 * pe * pe : 1 - Math.pow(-2 * pe + 2, 2) / 2;
    var off = f2(1000 * (1 - pe2));
    [P.eixoE, P.eixoD, P.sEixoE, P.sEixoD].forEach(function (p) { if (p) p.setAttribute("stroke-dashoffset", off); });
    var vc = eo(seg(t, T.contorno[0], T.contorno[1]));
    if (P.bloco) P.bloco.setAttribute("opacity", vc.toFixed(3));
    if (P.sBloco) P.sBloco.setAttribute("opacity", vc.toFixed(3));
    if (P.cota) P.cota.setAttribute("opacity", eo(seg(t, T.bloco1, 0.3)).toFixed(3));
    // a faísca: aparece em 1964 em 'those', corre, e para acesa na ponta
    var xf = faiscaX(t), vf = eo(seg(t, T.pavio[0], 0.15));
    if (P.faisca) { P.faisca.setAttribute("cx", f2(Math.max(X64, xf))); P.faisca.setAttribute("opacity", vf.toFixed(3)); }
    if (P.faiscaHalo) { P.faiscaHalo.setAttribute("cx", f2(Math.max(X64, xf))); P.faiscaHalo.setAttribute("opacity", (0.35 * vf).toFixed(3)); }
    var ac = eo(seg(t, T.pavio[1], 0.12));
    if (P.ponta) P.ponta.setAttribute("opacity", ac.toFixed(3));
    var u = (t - T.pavio[1]) / T.pulso, vivo = u >= 0 && u < 1, eu = eo(clamp(u, 0, 1));
    if (P.pulso) { P.pulso.setAttribute("r", f2(30 + 70 * eu)); P.pulso.setAttribute("opacity", vivo ? (0.9 * (1 - eu)).toFixed(3) : "0"); }
  }

  function cena(t) {
    camera(t);
    luz(t);
    var ct = corteT(t), gt = E("gCorteT");
    if (gt) gt.setAttribute("transform", "translate(" + f2(ct.x) + "," + f2(ct.y) + ") scale(" + ct.s.toFixed(5) + ")");
    if (C) C.estado({
      traco: 1, nivel: CORTE.NIVEL.RESERVADO, marcaCheio: 1,
      hachura: 1, hachuraAlfa: 1 - 0.65 * eb(seg(t, T.p2, T.morfo)),   // a tira sai da faixa; fica o rastro a 35 %
      pulso: 0, rioFase: 110 * t
    });
    carimbo(t);
    tira(t);
    regua(t);
    texto("naoEscala", t, T.naoEscala[0], T.naoEscala[1], 520, 1540);
    // o bloco s29-regua: centrado sob o bloco dos 60 anos, logo abaixo da linha de cota (nada do corte que encolhe nem da tira passa ali)
    var bl = E("bloco");
    if (bl) { var w = bl.offsetWidth, h = bl.offsetHeight; bl.style.transform = "translate(" + f2((X64 + X24) / 2 - w / 2) + "px," + f2(1336) + "px)"; }
    texto("bloco1", t, T.bloco1, null);
    texto("bloco2", t, T.bloco2, null);
    var cr = E("cred1"); if (cr) cr.style.opacity = eo(seg(t, T.cred, 0.3)).toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__s29estado = function (t) {   // só conferência (a prova vem dos quadros)
    t = clamp(+t || 0, 0, DUR);
    return { camera_escala: +cameraEscala(t).toFixed(5), corte: corteT(t), faisca_x: +faiscaX(t).toFixed(1) };
  };
  window.__renderAt(0);
})();
</script>
