    var dEixoE = "M" + REGUA.x0 + "," + V.yEixo + " H" + f2(X64), dEixoD = "M" + f2(X24) + "," + V.yEixo + " H" + REGUA.x1;
    var dBloco = "M" + f2(X64) + "," + V.y0 + " H" + f2(X24) + " V" + V.y1 + " H" + f2(X64) + " Z";
    el("path", { class: "sombra-linha", d: dEixoE }, gS);
    el("path", { class: "sombra-linha", d: dEixoD }, gS);
    el("path", { class: "sombra-linha", d: dBloco }, gS);
    // a hachura do bloco dos 60 anos, duas cópias: a de fundo (a 45 %) e a acesa (a frente da luz, de 1964 a 2024)
    P.hFundo = reguaHachura(V, 1964, 2024, "Fundo", gRegua, defs);
    P.hLuz = reguaHachura(V, 1964, 2024, "Luz", gRegua, defs);
    el("path", { class: "ar", d: dEixoE }, gTopo);
    el("path", { class: "ar", d: dEixoD }, gTopo);
    el("path", { class: "ar", d: dBloco }, gTopo);
    P.cota = el("path", { class: "ar-fina", opacity: 0,
      d: "M" + f2(X64) + "," + (EST.cotaY - 18) + " V" + (EST.cotaY + 18) + " M" + f2(X64) + "," + EST.cotaY + " H" + f2(X24) + " M" + f2(X24) + "," + (EST.cotaY - 18) + " V" + (EST.cotaY + 18) }, gTopo);

    // 2) O LADRILHO DA HACHURA (a origem do grupo é o canto de cima, à esquerda): a sombra solta, a hachura (as mesmas linhas x + y = c,
    //    passo 48, 4 px, --destaque, com a folga de 3 px) e o contorno de 6 px
    var L = EST.ladrilho, H = REGUA.hachura;
    P.ladrilho = el("g", { opacity: 0 }, gEst);
    el("rect", { class: "sombra-linha", x: 0, y: 0, width: L.w, height: L.h, transform: "translate(0," + S.dy + ")", opacity: S.op }, P.ladrilho);
    var cpL = el("clipPath", { id: "clipLadrilho" }, defs);
    el("rect", { x: H.folga, y: H.folga, width: L.w - 2 * H.folga, height: L.h - 2 * H.folga }, cpL);
    var gLH = el("g", { "clip-path": "url(#clipLadrilho)" }, P.ladrilho);
    for (var c = H.passo; c <= L.w + L.h; c += H.passo) el("line", { class: "hachura", x1: c - H.folga, y1: H.folga, x2: c - (L.h - H.folga), y2: L.h - H.folga }, gLH);
    el("rect", { class: "ar", x: 0, y: 0, width: L.w, height: L.h }, P.ladrilho);

    // 3) AS CÉDULAS (a peça 5; a cédula do vídeo, consertos-1): 4 em fila; a origem do grupo é a ponta esquerda da fila, no centro da
    //    altura. q leva os px do quadro aos do desenho. O corpo é desenhado meia borda para dentro: a medida por fora, com a borda, é
    //    120 × 64 no quadro. A sombra solta é a cópia em --tinta-escura, 15 px abaixo (como antes).
    var N = EST.nota, q = 1 / CAM_FIM, nw = N.w * q, nh = N.h * q, nb = N.borda * q;
    P.notas = el("g", { opacity: 0 }, gEst);
    for (var i = 0; i < N.n; i++) {
      var gn = el("g", { transform: "translate(" + f2((N.w / 2 + i * N.passo) * q) + ",0)" }, P.notas);
      el("rect", { class: "nota-sombra", x: f2(-nw / 2), y: f2(-nh / 2 + N.sombraDy), width: f2(nw), height: f2(nh), rx: f2(N.canto * q), opacity: 0.8 }, gn);
      el("rect", { class: "nota-corpo", x: f2(-(nw - nb) / 2), y: f2(-(nh - nb) / 2), width: f2(nw - nb), height: f2(nh - nb),
        rx: f2((N.canto - N.borda / 2) * q), "stroke-width": f2(nb) }, gn);
      // o cifrão: a forma em milésimos de em, levada ao tamanho de 44 px do quadro e centrada na cédula (o centro da tinta no centro)
      el("path", { class: "nota-cifrao", d: PICTO.cifraoD, "fill-rule": "evenodd", transform: "scale(" + (N.cifrao * q / 1000).toFixed(6) + ")" }, gn);
    }

    // 4) A ÁGUA (a linha em --agua com a luz de corrente) e O FIO (--tinta): a origem de cada grupo é a ponta esquerda da linha
    P.agua = el("g", { opacity: 0 }, gEst);
    cor(el("line", { class: "peca-sombra", x1: 0, y1: S.dy, x2: EST.linha, y2: S.dy, "stroke-width": 28, opacity: S.op }, P.agua), {});
    el("line", { class: "agua-linha", x1: 0, y1: 0, x2: EST.linha, y2: 0 }, P.agua);
    P.aguaLuz = el("line", { class: "agua-luz", x1: 0, y1: 0, x2: EST.linha, y2: 0,
      "stroke-dasharray": EST.corrente.traco + " " + (EST.corrente.periodo - EST.corrente.traco) }, P.agua);
    P.fio = el("g", { opacity: 0 }, gEst);
    el("line", { class: "peca-sombra", x1: 0, y1: S.dy, x2: EST.linha, y2: S.dy, "stroke-width": 23, opacity: S.op }, P.fio);
    el("line", { class: "fio-linha", x1: 0, y1: 0, x2: EST.linha, y2: 0 }, P.fio);
  }

  // o curso de cada peça (o x da ponta esquerda): de um fim de curso ao outro (as pontas do bloco)
  var CURSO = {
    ladrilho: [X64, X24 - EST.ladrilho.w],        // → : de 1964 a 2024
    notas:    [X24 - EST.notasLarg, X64],         // ← : de 2024 a 1964
    agua:     [X64, X24 - EST.linha],             // →
    fio:      [X24 - EST.linha, X64]              // ←
  };
  function curso(nome, u) { return lerp(CURSO[nome][0], CURSO[nome][1], u); }
  function fracaoCima(t) { return eb(seg(t, T.cima[0], T.cima[1])); }
  function fracaoBaixo(t) { return eb(seg(t, T.baixo[0], T.baixo[1])); }

  var TROCAS_PE = 860;                            // o pé do bloco das duas trocas (o mesmo de antes; o bloco cresce para cima)
  function camEscala(t) { return 1 + (CAM_FIM - 1) * eo(seg(t, 0, T.camFim)); }
  function camera(t) {
    var s = camEscala(t);
    var c = E("cam"); if (c) c.style.transform = "scale(" + s.toFixed(5) + ")";
    var st = E("still"); if (st) st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ")";
  }
  // o TEXTO: entra em 300 ms (opacidade + 24 px de subida, ease-out) e fica PARADO (fora da câmera)
  function vida(t, t0) { var v = eo(seg(t, t0, 0.3)); return { v: v, sobe: 24 * (1 - v) }; }
  function peca(g, x, y, op) { if (g) { g.setAttribute("transform", "translate(" + f2(x) + "," + f2(y) + ")"); g.setAttribute("opacity", op.toFixed(3)); } }

  function cena(t) {
    camera(t);
    // a luz percorre os sessenta anos: a cópia de fundo a 45 %, a acesa atrás da frente (a passo constante)
    reguaAcender(P.hFundo, 1, 0.45);
    reguaAcender(P.hLuz, seg(t, T.luz[0], T.luz[1] - T.luz[0]), 1);
    if (P.cota) P.cota.setAttribute("opacity", eo(seg(t, T.anos, 0.3)).toFixed(3));
    // a esteira de cima: o ladrilho → e as notas ←
    var u1 = fracaoCima(t), v1 = eo(seg(t, T.cima[0], 0.2));
    peca(P.ladrilho, curso("ladrilho", u1), EST.yLadrilho, v1);
    peca(P.notas, curso("notas", u1), EST.yNotas, v1);
    // a esteira de baixo: a água → (com a luz de corrente andando dentro dela) e o fio ←
    var u2 = fracaoBaixo(t), v2 = eo(seg(t, T.baixo[0], 0.2));
    peca(P.agua, curso("agua", u2), EST.yAgua, v2);
    peca(P.fio, curso("fio", u2), EST.yFio, v2);
    if (P.aguaLuz) {
      var fase = EST.corrente.vel * clamp(Math.min(t, T.repouso) - T.baixo[0], 0, 1e9);
      P.aguaLuz.setAttribute("stroke-dashoffset", f2(EST.corrente.traco - (fase % EST.corrente.periodo)));
    }
    // os textos, fora da câmera: o bloco das duas trocas (centrado em x 1560, com o PÉ em y 860: de y 468 a 860) e os anos sob a
    // linha de cota
    var bl = E("trocas");
    if (bl) bl.style.transform = "translate(" + f2(XM - bl.offsetWidth / 2) + "px," + f2(TROCAS_PE - bl.offsetHeight) + "px)";
    var a = E("troca1"), b = E("troca2"), va = vida(t, T.troca1), vb = vida(t, T.troca2);
    if (a) { a.style.opacity = va.v.toFixed(3); a.style.transform = "translateY(" + f2(va.sobe) + "px)"; }
    if (b) { b.style.opacity = vb.v.toFixed(3); b.style.transform = "translateY(" + f2(vb.sobe) + "px)"; }
    var an = E("anos"), vn = vida(t, T.anos);
    if (an) { an.style.opacity = vn.v.toFixed(3); an.style.transform = "translate(" + f2(XM - an.offsetWidth / 2) + "px," + f2(1478 + vn.sobe) + "px)"; }
    var cr = E("cred1"); if (cr) cr.style.opacity = eo(seg(t, T.cred, 0.3)).toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  // só conferência (a prova vem dos quadros): a escala da câmera e o x da ponta esquerda de cada peça
  window.__s31estado = function (t) {
    t = clamp(+t || 0, 0, DUR);
    var u1 = fracaoCima(t), u2 = fracaoBaixo(t);
    return { camera_escala: +camEscala(t).toFixed(5), ladrilho_x: +curso("ladrilho", u1).toFixed(1), notas_x: +curso("notas", u1).toFixed(1),
      agua_x: +curso("agua", u2).toFixed(1), fio_x: +curso("fio", u2).toFixed(1), x1964: X64, x2024: X24 };
  };
  window.__renderAt(0);
})();
</script>
