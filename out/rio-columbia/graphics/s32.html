    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();
</script>
<script>
(function () {
  "use strict";
  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo;
  var E = function (id) { return document.getElementById(id); };
  var f2 = function (v) { return (+v).toFixed(2); };

  var DUR = 8.066;
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia é do redator-de-tela: textos-tela.json › _textos_por_cena s32, caminho "sem_caca") ═══
  var TEXTOS = {
    rotLago: "Upper Arrow Lake",                               // [178] rotulo, 0,167–8,066 · nunca "south of Nakusp" (item 75)
    aviso:   "Photo from 2004",                                // [179] aviso_ano, 0,167–8,066 (data_na_origem: 11 August 2004)
    cred1:   "Kevstan / Wikimedia Commons · CC BY-SA 3.0"      // [180] credito, 0,000–8,066 (1 linha, 1.261 px)
  };
  // ═════════════════════════════════════════════════════════════════════════════════════════════════════════════
  Object.keys(TEXTOS).forEach(function (k) { var e = E(k); if (e) e.textContent = TEXTOS[k]; });

  // os tempos (locais, −361,167), dos textos de tela e do conceito
  var T = { cred: 0.0, rotulo: 0.167, aviso: 0.167, camFim: DUR - 0.25, repouso: DUR - 0.25 };

  // ── A FOTO IMPRESSA: a geometria (no palco, com a câmera em 1,00) ──
  // o arquivo (2272 × 1704) a K = 1840 / 2272; o recorte x 0–2272, y 320–1598 → a janela de 1840 × 1035; a moldura de 20 px por fora
  var ARQ = { w: 2272, h: 1704, y0: 320, y1: 1598 };
  var FOTO = { w: 1840, borda: 20, cx: 1196, cy: 786, rot: -0.8 };
  FOTO.k = FOTO.w / ARQ.w;                               // 0,8099 do arquivo
  FOTO.h = (ARQ.y1 - ARQ.y0) * FOTO.k;                   // 1035
  FOTO.W = FOTO.w + 2 * FOTO.borda; FOTO.H = FOTO.h + 2 * FOTO.borda;   // 1880 × 1075
  var FITA = { w: 400, h: 116, xLocal: -280, desce: 6, rot: -4 };       // uma fita no alto (a prancha da marca: uma tira, −4°), montada na borda de cima
  var VALE = { x: 1080, y: 705 };                        // o vão entre as serras, ao fundo (px do arquivo): o rumo do empurrão
  var EMP = 0.04;                                        // o empurrão do RIG: 1,00 → 1,04 (a regência)
  var ROTULO = { x: 2360, y: 236 }, AVISO = { x: 2360, y: 432 };   // sobre a mesa, à direita da foto, no terço de cima

  function girar(x, y, graus) { var a = graus * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; }
  // a origem da câmera: o vão, no palco (o ponto do arquivo → a janela → o giro da foto)
  var ORIGEM = (function () {
    var lx = VALE.x * FOTO.k - FOTO.w / 2, ly = (VALE.y - ARQ.y0) * FOTO.k - FOTO.h / 2, g = girar(lx, ly, FOTO.rot);
    return { x: FOTO.cx + g[0], y: FOTO.cy + g[1] };
  })();

  function montar() {
    var base = "translate(" + f2(FOTO.cx - FOTO.W / 2) + "px," + f2(FOTO.cy - FOTO.H / 2) + "px) rotate(" + FOTO.rot + "deg)";
    var m = E("moldura"), so = E("fotoSombra"), im = E("fotoImg"), fi = E("fita1"), lz = E("luz");
    if (m) { m.style.width = f2(FOTO.W) + "px"; m.style.height = f2(FOTO.H) + "px"; m.style.transform = base; }
    // a sombra solta ASSENTADA: +12 px, escala 1,00, opacidade 0,80 (a foto já está na mesa no 1º quadro)
    if (so) { so.style.width = f2(FOTO.W) + "px"; so.style.height = f2(FOTO.H) + "px"; so.style.transform = "translateY(12px) " + base; }
    if (im) { im.style.width = f2(ARQ.w * FOTO.k) + "px"; im.style.height = f2(ARQ.h * FOTO.k) + "px"; im.style.transform = "translateY(" + f2(-ARQ.y0 * FOTO.k) + "px)"; }
    if (fi) {   // a fita: o centro dela sobre a borda de cima da moldura (6 px para dentro), no ponto local (−280, −H/2)
      var p = girar(FITA.xLocal, -FOTO.H / 2 + FITA.desce, FOTO.rot);
      fi.style.width = FITA.w + "px"; fi.style.height = FITA.h + "px";
      fi.style.transform = "translate(" + f2(FOTO.cx + p[0] - FITA.w / 2) + "px," + f2(FOTO.cy + p[1] - FITA.h / 2) + "px) rotate(" + FITA.rot + "deg)";
    }
    if (lz) { lz.style.setProperty("--luz-x", f2(FOTO.cx + 140) + "px"); lz.style.setProperty("--luz-y", f2(FOTO.cy + 140) + "px"); }
  }

  // o TEXTO fixo no palco: entra em 300 ms (opacidade + 24 px de subida, ease-out) e fica PARADO
  function texto(id, t, tin, x, y) {
    var e = E(id); if (!e) return;
    var pi = eo(seg(t, tin, 0.3));
    e.style.opacity = pi.toFixed(3);
    e.style.transform = "translate(" + f2(x) + "px," + f2(y + 24 * (1 - pi)) + "px)";
  }
  function credito(id, t, tin) { var e = E(id); if (e) e.style.opacity = eo(seg(t, tin, 0.3)).toFixed(3); }

  // a CÂMERA: o empurrão do RIG rumo ao vale, 1,00 → 1,04, a velocidade constante, freando nos últimos 15 % (para em DUR − 0,25); a
  // deriva do RIG segue e congela no repouso; o still acompanha a 0,6, com a mesma origem
  function percurso(p) { var a = 0.85, v = 2 / (1 + a); return p <= a ? v * p : v * a + v * (p - a) - v * (p - a) * (p - a) / (2 * (1 - a)); }
  function camera(t) {
    var s = 1 + EMP * percurso(clamp(t / T.camFim, 0, 1)), td = Math.min(t, T.repouso);
    var dx = 6 * Math.sin(td * 0.23), dy = 4.8 * Math.sin(td * 0.17), ox = ORIGEM.x, oy = ORIGEM.y;
    var c = E("cam");
    if (c) { c.style.transformOrigin = f2(ox) + "px " + f2(oy) + "px"; c.style.transform = "scale(" + s.toFixed(5) + ") translate(" + f2(dx) + "px," + f2(dy) + "px)"; }
    var st = E("still");
    if (st) { st.style.transformOrigin = f2(ox + 56) + "px " + f2(oy + 56) + "px"; st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ") translate(" + f2(dx * 0.6) + "px," + f2(dy * 0.6) + "px)"; }
  }

  function cena(t) {
    camera(t);
    texto("rotLago", t, T.rotulo, ROTULO.x, ROTULO.y);
    texto("aviso", t, T.aviso, AVISO.x, AVISO.y);
    credito("cred1", t, T.cred);
  }

  montar();
  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  // só conferência: a geometria da foto (a prova vem dos quadros e do DOM, não daqui)
  window.__foto = { k: FOTO.k, w: FOTO.w, h: FOTO.h, cx: FOTO.cx, cy: FOTO.cy, origem: ORIGEM, produtoMax: FOTO.k * (1 + EMP) };
  window.__renderAt(0);
})();
</script>
