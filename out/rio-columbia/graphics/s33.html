<script>

    p2: 5.533, encolhe: 0.50, morfo: 0.60,
    eixo: [5.85, 0.55], contorno: [6.10, 0.30],
    frente: 6.367, cred: 6.367, acende: [6.622, 0.40],

  // ════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
  // A RÉGUA DO TEMPO (peça 3 do conceito) · NASCE AQUI (s08) e volta em s29, s31, s33, s34, s57, s58 e s59.

  //
  // A ESCALA VERDADEIRA (o arco do conceito): o eixo em y 1180, de x 400 a x 3440; 1964 em x 520, 2024 em x 2600 (34,667 px por
  // ano); 2025, 2026 e 2027 são três fatias de 34,667 px (até x 2704); 2029 em x 2773,3. A vista inteira é reguaVista(REGUA.inteira).
  // A PONTA EM ×8 (s08, s58, s59): 2024 em x 1505 → as fatias com 277,33 px (2025: x 1505–1782,3; 2026: 1782,3–2059,7; 2027:

  var REGUA = {

    x0: 400, x1: 3440,                                        // as pontas do eixo na escala verdadeira
    pxAno: (2600 - 520) / 60,                                 // 34,667 px por ano, na escala verdadeira
    inteira: { k: 1, anoRef: 1964, xRef: 520, y0: 1150, y1: 1210 },    // a régua inteira (a banda de 60 px é sugestão: nenhuma cena deste lote a usa)
    ponta:   { k: 8, anoRef: 2024, xRef: 1505, y0: 1080, y1: 1280 },   // só a ponta, em ×8 (o enquadramento de s08)
    traco: 6,                                                 // --linha-espessura: o traço de engenheiro
    cotaFina: 3,                                              // a linha de cota e a de chamada

    hachura: { passo: 48, traco: 4, folga: 3 },               // a hachura da FAIXA do corte (peça 1): linhas x + y = c a cada 48 px, 4 px, --destaque
    pontilhado: { passo: 34, raio: 4 }                        // o trecho sem data: pontos de 8 px a cada 34 px
  };
  // a vista: x(ano) no palco. v = { k, anoRef, xRef, y0, y1 }
  function reguaVista(v) {
    var px = REGUA.pxAno * v.k;
    return { k: v.k, pxAno: px, y0: v.y0, y1: v.y1, yEixo: REGUA.yEixo, x: function (ano) { return v.xRef + (ano - v.anoRef) * px; } };
  }
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, pai) {

    for (var k in attrs) if (Object.prototype.hasOwnProperty.call(attrs, k)) e.setAttribute(k, attrs[k]);

  }
  // o contorno de um grupo de fatias vizinhas (anos = [2025, 2026, 2027]: cada fatia vai de x(ano − 1) a x(ano)): o retângulo e as divisas
  function reguaFatiasD(V, anos) {
    var xa = V.x(anos[0] - 1), xb = V.x(anos[anos.length - 1]);
    var d = "M" + f2(xa) + "," + V.y0 + " H" + f2(xb) + " V" + V.y1 + " H" + f2(xa) + " Z";
    for (var i = 0; i < anos.length - 1; i++) d += " M" + f2(V.x(anos[i])) + "," + V.y0 + " V" + V.y1;

  }
  // a hachura de UMA fatia (ou de um bloco, de anoA a anoB): devolve { g, clip }: g é o grupo (a opacidade = o brilho) e clip é o
  // <rect> do recorte (a largura = a frente que corre da esquerda para a direita). id = sufixo único no arquivo.
  function reguaHachura(V, anoA, anoB, id, pai, defs) {
    var H = REGUA.hachura, xa = V.x(anoA) + H.folga, xb = V.x(anoB) - H.folga, ya = V.y0 + H.folga, yb = V.y1 - H.folga;
    var cp = el("clipPath", { id: "reguaClip" + id }, defs);

    var g = el("g", { "clip-path": "url(#reguaClip" + id + ")", opacity: 0 }, pai);
    // linhas x + y = c (sobem para a direita), em múltiplos do passo: as fatias vizinhas emendam a hachura sem degrau
    for (var c = Math.ceil((xa + ya) / H.passo) * H.passo; c <= xb + yb; c += H.passo) {

    }
    return { g: g, clip: rc, xa: xa, larg: xb - xa };
  }
  function reguaAcender(h, frente, brilho) {   // frente 0..1 (a hachura correndo), brilho 0..1
    if (!h) return;
    h.clip.setAttribute("width", f2(h.larg * clamp(frente, 0, 1)));
    h.g.setAttribute("opacity", clamp(brilho, 0, 1).toFixed(3));
  }
  // o pontilhado (o trecho sem data): pontos de xa até xb, cada um com a opacidade dele
  function reguaPontos(V, xa, xb, pai) {
    var P = REGUA.pontilhado, lista = [];
    for (var x = xa - P.passo; x <= xb; x += P.passo) lista.push({ x0: x, e: el("circle", { class: "ponto", cx: f2(x), cy: V.yEixo, r: P.raio, opacity: 0 }, pai) });
    return lista;
  }

  // ── a montagem desta cena: A VISTA INTEIRA da s29 ──
  var VISTA_INTEIRA = { k: 1, anoRef: 1964, xRef: 520, y0: 1120, y1: 1240 };
  var V = reguaVista(VISTA_INTEIRA);
  var X64 = V.x(1964), X24 = V.x(2024), X27 = V.x(2027);
  var ANOS = [2025, 2026, 2027];
  var cor = function (e, o) { if (e) for (var k in o) e.style.setProperty(k, o[k]); return e; };
  var gRegua = E("regua"), gTopo = E("reguaTopo"), defs = E("reguaDefs");
  var P = { hach: [] };
  if (gRegua && gTopo && defs) {
    var S = REGUA.sombra;
    var gS = el("g", { transform: "translate(0," + S.dy + ")", opacity: S.op }, gRegua);
    var dEixoE = "M" + REGUA.x0 + "," + V.yEixo + " H" + f2(X64), dEixoD = "M" + f2(X24) + "," + V.yEixo + " H" + REGUA.x1;
    var dBloco = "M" + f2(X64) + "," + V.y0 + " H" + f2(X24) + " V" + V.y1 + " H" + f2(X64) + " Z";
    P.sEixoE = el("path", { class: "sombra-linha", d: dEixoE, pathLength: 1000 }, gS);
    P.sEixoD = el("path", { class: "sombra-linha", d: dEixoD, pathLength: 1000 }, gS);
    P.sBloco = el("path", { class: "sombra-linha", d: dBloco, opacity: 0 }, gS);
    P.sFatias = el("path", { class: "sombra-linha", d: reguaFatiasD(V, ANOS), opacity: 0 }, gS);
    P.eixoE = el("path", { class: "ar", d: dEixoE, pathLength: 1000 }, gTopo);
    P.eixoD = el("path", { class: "ar", d: dEixoD, pathLength: 1000 }, gTopo);
    // as três fatias: a hachura de cada uma (a peça 3), por baixo do traço delas
    ANOS.forEach(function (ano, i) { P.hach.push(reguaHachura(V, ano - 1, ano, "F" + i, gTopo, defs)); });
    P.fatias = el("path", { class: "ar", d: reguaFatiasD(V, ANOS), opacity: 0 }, gTopo);
    P.bloco = el("path", { class: "ar", d: dBloco, opacity: 0 }, gTopo);
    P.ponta = cor(el("line", { x1: f2(X24), y1: V.y0, x2: f2(X24), y2: V.y1, "stroke-width": 6, opacity: 0 }, gTopo), { stroke: "var(--neutro)" });
    [P.eixoE, P.eixoD, P.sEixoE, P.sEixoD].forEach(function (p) { p.setAttribute("stroke-dasharray", "1000 1000"); p.setAttribute("stroke-dashoffset", "1000"); });
  }
  (function () {   // a hachura da tira (x + y = c, passo 48: a mesma da faixa e do bloco)
    var H = REGUA.hachura, ya = 480, yb = 1320, g = E("tiraLinhas"); if (!g) return;
    for (var c = Math.floor((200 + ya) / H.passo) * H.passo; c <= 3500 + yb; c += H.passo) el("line", { class: "hachura", x1: f2(c - ya), y1: ya, x2: f2(c - yb), y2: yb }, g);
  })();

  var C = CORTE.montar(E("gCorte"));
  var FX = CORTE.faixaPts();
  var FB = REGUA.hachura.folga;
  var BLOCO_PTS = [[X64 + FB, V.y0 + FB], [X24 - FB, V.y0 + FB], [X24 - FB, V.y1 - FB], [X64 + FB, V.y1 - FB]];
  var MINI = { s: 0.4, x: 260, y: 220 };
  var MINI_T = { x: MINI.x - 520 * MINI.s, y: MINI.y - 560 * MINI.s };
  var ETIQ_FAIXA = { x: 1800, y: 950 };                                   // onde a etiqueta gruda na faixa (altura cheia)
  // o mesmo ponto no bloco (a morfose é bilinear nos quatro cantos): na altura do meio, a fração em x entre a encosta e a barragem
  var UX = (ETIQ_FAIXA.x - CORTE.xChao(ETIQ_FAIXA.y)) / (CORTE.G.barragem.montante - CORTE.xChao(ETIQ_FAIXA.y));
  var ETIQ_BLOCO = { x: X64 + UX * (X24 - X64), y: V.yEixo };
  var ORIG = { x: 2039, y: 946 };
  var LUZ = { corte: { x: 2020, y: 1120 }, faixa: { x: 2190, y: 950 }, regua: { x: (X64 + X27) / 2, y: V.yEixo } };

  function cameraEscala(t) {
    return 1 + 0.020 * eo(seg(t, T.push[0], T.push[1] - T.push[0])) + 0.010 * eb(seg(t, T.push2[0], T.push2[1] - T.push2[0]));
  }
  function naTela(p, s) { return { x: ORIG.x + (p.x - ORIG.x) * s, y: ORIG.y + (p.y - ORIG.y) * s }; }
  function camera(t) {
    var s = cameraEscala(t);
    var c = E("cam"); if (c) c.style.transform = "scale(" + s.toFixed(5) + ")";
    var st = E("still"); if (st) st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ")";
  }
  function corteT(t) {
    var u = eb(seg(t, T.p2, T.encolhe));
    return { s: lerp(1, MINI.s, u), x: lerp(0, MINI_T.x, u), y: lerp(0, MINI_T.y, u), u: u };
  }
  function morfo(t) { return eb(seg(t, T.p2, T.morfo)); }
  function luz(t) {
    var tl = t - T.luzAtraso, a = eo(seg(tl, T.hachura[0], T.hachura[1])), b = morfo(tl), x, y;
    x = lerp(lerp(LUZ.corte.x, LUZ.faixa.x, a), LUZ.regua.x, b); y = lerp(lerp(LUZ.corte.y, LUZ.faixa.y, a), LUZ.regua.y, b);
    var lz = E("luz"); if (lz) { lz.style.setProperty("--luz-x", (x + 400).toFixed(1) + "px"); lz.style.setProperty("--luz-y", (y + 400).toFixed(1) + "px"); }
  }
  function vida(t, t0, t1) {
    var vin = eo(seg(t, t0, 0.3)), vout = t1 == null ? 1 : 1 - eb(seg(t, t1 - 0.3, 0.3));
    return { v: vin * vout, sobe: 24 * (1 - vin) };
  }
  function texto(id, t, t0, t1, x, y) {
    var e = E(id); if (!e) return;
    var vd = vida(t, t0, t1);
    e.style.opacity = vd.v.toFixed(3);
    e.style.visibility = vd.v > 0.001 ? "visible" : "hidden";
    e.style.transform = "translate(" + f2(x) + "px," + f2(y + vd.sobe) + "px)";
  }
  // A ETIQUETA: a mão que arruma (chega de 70 px acima, assenta 1,03 → 1,00 nos últimos 220 ms; sombra solta +64 → +12 px, 1,05 → 1,00,
  // 0,35 → 0,80) e, em 'misses', a metade esquerda descola: cai a 40 % e pende 9° pelo canto de cima da dobra (eo, sem rebote)
  function etiqueta(t) {
    var e = E("etiq"), mo = E("etiqMolde"); if (!e || !mo) return;
    var w = mo.offsetWidth, h = mo.offsetHeight;
    [["etiqE"], ["etiqD"], ["etiqSombraE"], ["etiqSombraD"]].forEach(function (x) { var q = E(x[0]); if (q) { q.style.width = w + "px"; q.style.height = h + "px"; } });
    e.style.width = w + "px"; e.style.height = h + "px";
    var u = seg(t, T.etiq, T.etiqQueda), uq = eo(u), va = clamp((t - T.etiq) / 0.12, 0, 1);
    e.style.opacity = va.toFixed(3); e.style.visibility = va > 0.001 ? "visible" : "hidden";
    if (va <= 0) return;
    var m = morfo(t), ct = corteT(t);
    // o ponto da faixa levado pelo corte que encolhe, depois pela morfose ao ponto do bloco
    var pf = { x: ct.x + ct.s * ETIQ_FAIXA.x, y: ct.y + ct.s * ETIQ_FAIXA.y };
    var cx = lerp(pf.x, ETIQ_BLOCO.x, m), cy = lerp(pf.y, ETIQ_BLOCO.y, m) - 70 * (1 - uq);
    var k = u < 1 - 0.22 / T.etiqQueda ? 1.03 : 1.03 - 0.03 * eo(seg(t, T.etiq + T.etiqQueda - 0.22, 0.22));
    e.style.transform = "translate(" + f2(cx - w / 2) + "px," + f2(cy - h / 2) + "px) rotate(2deg) scale(" + k.toFixed(4) + ")";
    var ar = uq, dy = lerp(64, 12, ar), sc = lerp(1.05, 1.0, ar), op = lerp(0.35, 0.80, ar);
    var d = eo(seg(t, T.descola[0], T.descola[1])), ang = -9 * d;
    var sE = E("etiqSombraE"), sD = E("etiqSombraD"), hE = E("etiqE");
    if (sD) { sD.style.opacity = op.toFixed(3); sD.style.transform = "translateY(" + f2(dy) + "px) scale(" + sc.toFixed(4) + ")"; }
    if (sE) { sE.style.opacity = (op * (1 - 0.35 * d)).toFixed(3); sE.style.transform = "translateY(" + f2(dy + 14 * d) + "px) scale(" + sc.toFixed(4) + ") rotate(" + ang.toFixed(3) + "deg)"; }
    if (hE) { hE.style.opacity = (1 - 0.6 * d).toFixed(3); hE.style.transform = "rotate(" + ang.toFixed(3) + "deg)"; }
  }
  function tira(t) {
    var g = E("gTira"), poly = E("tiraPoly"); if (!g || !poly) return;
    if (t < T.p2) { g.setAttribute("opacity", "0"); return; }
    var ct = corteT(t), m = morfo(t);
    poly.setAttribute("points", FX.map(function (p, i) {
      var a = [ct.x + ct.s * p[0], ct.y + ct.s * p[1]], b = BLOCO_PTS[i];
      return f2(lerp(a[0], b[0], m)) + "," + f2(lerp(a[1], b[1], m));
    }).join(" "));
    // a tira sai da faixa inteira (1), fica "desenrolada" a 50 %, acende em 'decades' (100 %) e se apaga em 'out,' (40 %)
    var a = lerp(1, 0.5, m);
    a = lerp(a, 1, eo(seg(t, T.acende[0], T.acende[1])));
    a = lerp(a, 0.4, eo(seg(t, T.apaga[0], T.apaga[1])));
    g.setAttribute("opacity", a.toFixed(3));
  }
  function regua(t) {
    var pe = seg(t, T.eixo[0], T.eixo[1]), pe2 = pe < 0.5 ? 2 * pe * pe : 1 - Math.pow(-2 * pe + 2, 2) / 2;
    var off = f2(1000 * (1 - pe2));
    [P.eixoE, P.eixoD, P.sEixoE, P.sEixoD].forEach(function (p) { if (p) p.setAttribute("stroke-dashoffset", off); });
    var vc = eo(seg(t, T.contorno[0], T.contorno[1]));
    if (P.bloco) P.bloco.setAttribute("opacity", vc.toFixed(3));
    if (P.sBloco) P.sBloco.setAttribute("opacity", vc.toFixed(3));
    if (P.ponta) P.ponta.setAttribute("opacity", eo(seg(t, T.apaga[0], T.apaga[1])).toFixed(3));   // a ponta de 2024 escurece
    var vf = eo(seg(t, T.fatias[0], 0.25));
    if (P.fatias) P.fatias.setAttribute("opacity", vf.toFixed(3));
    if (P.sFatias) P.sFatias.setAttribute("opacity", vf.toFixed(3));
    P.hach.forEach(function (h, i) { reguaAcender(h, eo(seg(t, T.fatias[i], T.fatiaDur)), 1); });
  }

  function cena(t) {
    camera(t);
    luz(t);
    var s = cameraEscala(t), ct = corteT(t), gt = E("gCorteT");
    if (gt) {
      gt.setAttribute("transform", "translate(" + f2(ct.x) + "," + f2(ct.y) + ") scale(" + ct.s.toFixed(5) + ")");
      gt.setAttribute("opacity", (1 - eb(seg(t, T.miniSai[0], T.miniSai[1]))).toFixed(3));
    }
    if (C) C.estado({
      traco: 1, nivel: CORTE.NIVEL.RESERVADO, marcaCheio: 1,
      hachura: eo(seg(t, T.hachura[0], T.hachura[1])),
      hachuraAlfa: 1 - 0.65 * morfo(t),
      pulso: 0, rioFase: 110 * t
    });
    tira(t);
    regua(t);
    etiqueta(t);
    texto("naoEscala", t, T.naoEscala[0], T.naoEscala[1], 520, 1540);
    // "$37.6M A YEAR": acima da faixa, à direita (a escala da câmera parada em 3,0 s: 1,020)
    var pg = E("pago"), s1 = cameraEscala(T.pago[0]);
    if (pg) { var pc = naTela({ x: 2440, y: 860 }, s1); texto("pago", t, T.pago[0], T.pago[1], pc.x - pg.offsetWidth / 2, pc.y - 44 - pg.offsetHeight); }
    // as cotas da régua, postas pela escala da câmera no instante em que entram, e paradas
    var fr = E("frente"), sf = cameraEscala(T.frente), pfr = naTela({ x: (X64 + X24) / 2, y: V.y0 }, sf);
    if (fr) texto("frente", t, T.frente, null, pfr.x - fr.offsetWidth / 2, pfr.y - 58 - fr.offsetHeight);
    var an = E("anos"), sa = cameraEscala(T.anos), pan = naTela({ x: (X24 + X27) / 2, y: V.y1 }, sa);
    if (an) texto("anos", t, T.anos, null, pan.x - an.offsetWidth / 2, pan.y + 44);
    var ta = E("todoAno"), pta = naTela({ x: REGUA.x1, y: V.y1 }, sa);
    if (ta && an) texto("todoAno", t, T.todoAno, null, pta.x - ta.offsetWidth, pan.y + 44 + an.offsetHeight + 18);
    var cr = E("cred1"); if (cr) cr.style.opacity = eo(seg(t, T.cred, 0.3)).toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__s33estado = function (t) {   // só conferência (a prova vem dos quadros)
    t = clamp(+t || 0, 0, DUR);
    return { camera_escala: +cameraEscala(t).toFixed(5), corte: corteT(t), morfo: +morfo(t).toFixed(3), etiq_bloco: ETIQ_BLOCO };
  };
  window.__renderAt(0);
})();
</script>
