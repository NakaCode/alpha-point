    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()

  var los = el("path", { d: dLos, fill: "none", stroke: "var(--tinta)", "stroke-width": 6, "stroke-linejoin": "round", pathLength: 1000, opacity: 0 }, gA);

  var frente = el("line", { x1: 0, y1: 0, x2: 0, y2: 0, stroke: "var(--agua-luz)", "stroke-width": 6, "stroke-linecap": "round", opacity: 0 }, gA);

  // ── O DETALHE (o canto da direita, ampliado 24×) ──
  var DET = { cx: 3000, cy: 1200, r: 380, M: 24, canto: [2880, 1246] };
  var esp = PE_PX * DET.M;                                   // 92,9 px: a lâmina no detalhe (24×)
  var G0 = DET.canto, W0 = [G0[0], G0[1] - esp];
  var DL = [-Math.cos(Math.PI / 6), Math.sin(Math.PI / 6)], UL = [-Math.cos(Math.PI / 6), -Math.sin(Math.PI / 6)], LEN = 900;
  function mais(a, d, k) { return [a[0] + d[0] * k, a[1] + d[1] * k]; }
  var marcaC = el("circle", { cx: PT.Rr[0], cy: PT.Rr[1], r: 34, fill: "none", stroke: "var(--tinta)", "stroke-width": 4, pathLength: 1000, opacity: 0 }, gD);
  var chamada = el("line", { x1: PT.Rr[0] + 34, y1: PT.Rr[1], x2: DET.cx - DET.r, y2: DET.cy, stroke: "var(--tinta)", "stroke-width": 4, pathLength: 1000, opacity: 0 }, gD);
  var circ = el("circle", { cx: DET.cx, cy: DET.cy, r: DET.r, fill: "none", stroke: "var(--tinta)", "stroke-width": 6, pathLength: 1000, opacity: 0 }, gD);
  var gIn = el("g", { "clip-path": "url(#clipIris)" }, gD);
  // a água no detalhe: a face da frente (entre o chão e o topo, ao longo do lado da frente) e a de cima (à esquerda do canto)
  el("polygon", { points: pts([W0, mais(W0, UL, LEN), mais(mais(W0, UL, LEN), [-1, 0], 900), mais(mais(G0, DL, LEN), [-1, 0], 900), mais(G0, DL, LEN), G0]),
    fill: "var(--agua)", "fill-opacity": "0.35" }, gIn);
  el("line", { x1: G0[0], y1: G0[1], x2: f1(mais(G0, UL, LEN)[0]), y2: f1(mais(G0, UL, LEN)[1]), stroke: "var(--tinta)", "stroke-width": 4, "stroke-dasharray": "22 16" }, gIn);  // a aresta de trás, escondida sob a água
  el("line", { x1: G0[0], y1: G0[1], x2: f1(mais(G0, DL, LEN)[0]), y2: f1(mais(G0, DL, LEN)[1]), stroke: "var(--tinta)", "stroke-width": 6 }, gIn);              // o chão, lado da frente
  el("polyline", { points: pts([mais(W0, DL, LEN), W0, mais(W0, UL, LEN)]), fill: "none", stroke: "var(--agua)", "stroke-width": 6, "stroke-linejoin": "miter" }, gIn); // o topo da água
  el("line", { x1: W0[0], y1: f1(W0[1]), x2: G0[0], y2: G0[1], stroke: "var(--agua)", "stroke-width": 6 }, gIn);                                                    // a aresta vertical da lâmina
  // a cota vertical: as linhas de chamada para a direita, a linha de cota com as duas setas
  var xc = G0[0] + 76;
  el("line", { x1: G0[0] + 12, y1: f1(W0[1]), x2: xc + 24, y2: f1(W0[1]), stroke: "var(--tinta)", "stroke-width": 3 }, gIn);
  el("line", { x1: G0[0] + 12, y1: G0[1], x2: xc + 24, y2: G0[1], stroke: "var(--tinta)", "stroke-width": 3 }, gIn);
  el("line", { x1: xc, y1: f1(W0[1] + 4), x2: xc, y2: G0[1] - 4, stroke: "var(--tinta)", "stroke-width": 3 }, gIn);
  el("polygon", { points: pts([[xc, W0[1] + 2], [xc - 10, W0[1] + 22], [xc + 10, W0[1] + 22]]), fill: "var(--tinta)" }, gIn);
  el("polygon", { points: pts([[xc, G0[1] - 2], [xc - 10, G0[1] - 22], [xc + 10, G0[1] - 22]]), fill: "var(--tinta)" }, gIn);
  var COTA_PE = { x: xc + 44, cy: (W0[1] + G0[1]) / 2 };

  function tracoPor(e, p, op) { e.setAttribute("stroke-dasharray", "1000 1000"); e.setAttribute("stroke-dashoffset", f1(1000 * (1 - p))); e.setAttribute("opacity", p > 0 ? (op == null ? 1 : op) : 0); }

  function acre(t) {
    var p = eo(seg(t, T.traco, T.tracoDur));   // eo: no 1º quadro o traço já correu 31 % (o corte seco não cai numa mesa vazia)
    tracoPor(los, p); tracoPor(sLos, p, 0.8);
    // a lâmina: cobre u ∈ [0, q] (do lado de trás à esquerda, T–L, ao lado da frente à direita, R–B), 1 pé acima do chão
    var q = eo(seg(t, T.lamina, T.laminaDur)), up = PE_PX;
    if (q <= 0) { agua.setAttribute("points", ""); borda.setAttribute("opacity", 0); frente.setAttribute("opacity", 0); return; }
    var a = P(0, 0), b = P(q, 0), c = P(q, 1), d = P(0, 1);
    function sobe(p) { return [p[0], p[1] - up]; }
    agua.setAttribute("points", pts([sobe(a), sobe(b), sobe(c), sobe(d)]));
    // a borda da água sobre os lados da frente já cobertos (L–B e B–R) e a frente que anda (na espessura verdadeira)
    var bb = [sobe(d), sobe(c)];
    if (q >= 1) bb = [sobe(PT.L), sobe(PT.B), sobe(PT.Rr)];
    borda.setAttribute("points", pts(bb)); borda.setAttribute("opacity", 1);
    var fo = q < 1 ? 1 : 1 - seg(t, T.lamina + T.laminaDur, 0.3);
    frente.setAttribute("x1", f1(b[0])); frente.setAttribute("y1", f1(b[1] - up)); frente.setAttribute("x2", f1(c[0])); frente.setAttribute("y2", f1(c[1] - up));
    frente.setAttribute("opacity", fo.toFixed(3));
  }
  function detalhe(t) {
    // o círculo pequeno e a chamada se riscam (0,12 s cada, em escada); a lente abre do centro: o contorno e o recorte com o mesmo raio
    var p = eo(seg(t, T.detalhe, 0.12)), pc = eo(seg(t, T.detalhe + 0.05, 0.12)), pi = eo(seg(t, T.detalhe, T.irisDur));
    tracoPor(marcaC, p); tracoPor(chamada, pc);
    circ.removeAttribute("stroke-dasharray"); circ.setAttribute("r", f1(DET.r * pi)); circ.setAttribute("opacity", pi > 0 ? 1 : 0);
    var ic = E("irisC"); if (ic) { ic.setAttribute("cx", DET.cx); ic.setAttribute("cy", DET.cy); ic.setAttribute("r", f1(Math.max(0, DET.r * pi - 3))); }
  }
  // o TEXTO: entra em 300 ms (opacidade + 24 px de subida, eo) e fica PARADO; ancorado no canto de cima à esquerda (x, y) ou girado
  function texto(id, t, tin, x, y, rot, escala) {
    var e = E(id); if (!e) return;
    var p = eo(seg(t, tin, 0.3));
    e.style.opacity = p.toFixed(3);
    e.style.transform = "translate(" + f2(x) + "px," + f2(y + 24 * (1 - p)) + "px)" + (rot ? " rotate(" + rot + "deg)" : "") +
      (escala ? " scale(" + (1.04 - 0.04 * p).toFixed(4) + ")" : "");
  }
  function cotaAcre(t) {   // deitada ao longo do lado da frente à direita (−30°), por fora, centrada no meio do lado
    var e = E("cotaAcre"); if (!e) return;
    var m = [(PT.B[0] + PT.Rr[0]) / 2, (PT.B[1] + PT.Rr[1]) / 2], n = [Math.sin(Math.PI / 6), Math.cos(Math.PI / 6)], off = 86;
    var cx = m[0] + n[0] * off, cy = m[1] + n[1] * off, w = e.offsetWidth, h = e.offsetHeight;
    var p = eo(seg(t, T.acre, 0.3)), dy = 24 * (1 - p);
    e.style.transformOrigin = "50% 50%";
    e.style.opacity = p.toFixed(3);
    e.style.transform = "translate(" + f2(cx - w / 2 + n[0] * dy) + "px," + f2(cy - h / 2 + n[1] * dy) + "px) rotate(-30deg)";
  }
  function camera(t) {
    var s = 1 + 0.0024 * Math.min(t, T.camPara), dx = 6 * Math.sin(t * 0.23), dy = 4.8 * Math.sin(t * 0.17);
    var c = E("cam"); if (c) c.style.transform = "scale(" + s.toFixed(5) + ") translate(" + f2(dx) + "px," + f2(dy) + "px)";
    var st = E("still"); if (st) st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ") translate(" + f2(dx * 0.6) + "px," + f2(dy * 0.6) + "px)";
  }
  function luz() { var lz = E("luz"); if (lz) { lz.style.setProperty("--luz-x", (ACRE.cx + 200) + "px"); lz.style.setProperty("--luz-y", (ACRE.cy + 200) + "px"); } }

  function cena(t) {
    camera(t); luz();
    acre(t); detalhe(t);
    texto("titulo", t, T.titulo, 520, 212, 0, true);
    cotaAcre(t);
    var pe = E("cotaPe"); texto("cotaPe", t, T.pe, COTA_PE.x, COTA_PE.cy - (pe ? pe.offsetHeight / 2 : 42));
    var cr = E("cred1"); if (cr) cr.style.opacity = eo(seg(t, T.cred, 0.3)).toFixed(3);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  // só conferência: a espessura de um pé no desenho e no detalhe
  window.__s39medidas = { pe_px: +PE_PX.toFixed(3), pe_detalhe_px: +esp.toFixed(2), lado_proj_px: +LADO_PROJ.toFixed(1) };
  window.__renderAt(0);
})();
