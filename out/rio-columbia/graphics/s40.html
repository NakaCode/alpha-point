      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");

    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).

      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });

    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();

<script>
(function () {
  "use strict";

  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo, eb = R.eb;
  var E = function (id) { return document.getElementById(id); };

  var DUR = 8.6;   // espelho.json › s40 › dur, literal

  var TEXTOS = {
    legenda: "PUBLIC LAW 118-272 · SEC. 1152"   // [229] legenda, 0,100–8,600: fora da página real
  };
  // [230] grifo_na_pagina "operations that the Government of Canada may not be obligated to provide": o trecho que o marca-texto varre
  // nos pixels do recorte (linhas 5, 6 e 7 do parágrafo), 3,400–8,600.
  (function () { for (var k in TEXTOS) { var e = E(k); if (e) e.textContent = TEXTOS[k]; } })();

  // ── os tempos (locais, −485,533), do words.json, dos textos de tela e da regência s40 ──
  var T = {
    pousa: 0.00, pousaDur: 0.80, desce: 190, fita: 0.70,
    legenda: 0.100,                    // "law" (485,63 s)
    sobe: 1.392, sobeDur: 0.33, assenta: 0.22,   // "includes,": a ampliação sobe do parágrafo (0,33 s) e assenta (0,22 s) até 1,942
    camIni: 0.80, camFim: 3.05,        // o push-in do RIG (1,00 → 1,02) para 0,35 s antes de "operations" (3,397)
    luzLinha: 2.95,                    // a luz desce às linhas do grifo (0,5 s)
    retoma: 7.35, retomaFim: 8.35,     // a retomada (1,02 → 1,03), depois do grifo; termina 250 ms antes do corte
    repouso: DUR - 0.25
  };

  // ── a geometria ──
  // a página: 2550 × 3300 (o arquivo), desenhada a KP no espaço da câmera
  var KP = 0.49;
  var PG = { w: 2550, h: 3300, cx: 2330, cy: 1030, rot: -1.0, rot0: -1.8 };
  // a ampliação: o recorte (3292 × 1284) a S; a janela x JX0 → JX1, y JY0 → JY1 do recorte; moldura de 44 px
  var S = 1.22, JX0 = 150, JY0 = 571, MOLD = 44;
  var AM = { w: 3258, h: 902, cx: 1920, cy: 1000, rot: 0.5 };
  // o recorte cobre, na página, x 437,5 → 2083,5 e y 615,5 → 1257,5 (medido: o recorte é a página a 2×; _tmp/arte-1/EF5/medir_recorte.py)
  var REC = { x0: 437.5, y0: 615.5 };
  // onde o parágrafo da janela está na página pousada (o centro dele, no espaço da câmera): a ampliação nasce ali, em registro
  var NASCE = (function () {
    var px = REC.x0 + (JX0 + 3170 / S / 2) / 2, py = REC.y0 + (JY0 + 814 / S / 2) / 2;   // o centro da janela, em px da página
    var dx = (px - PG.w / 2) * KP, dy = (py - PG.h / 2) * KP, a = PG.rot * Math.PI / 180;
    return { cx: PG.cx + dx * Math.cos(a) - dy * Math.sin(a), cy: PG.cy + dx * Math.sin(a) + dy * Math.cos(a), k: (KP / 2) / S };
  })();

  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  // a chegada da página (identidade §4.4, "A mão que arruma": 0,80 s em eo; ASSENTA 1,03 → 1,00 em 0,56–0,80 s, uma vez)
  function pousoFolha(t) {
    var p = eo(seg(t, T.pousa, T.pousaDur)), q = eo(seg(t, T.pousa + 0.56, T.pousaDur - 0.56));
    return { op: t >= T.pousa ? 1 : 0, dy: T.desce * (1 - p), k: lerp(1.03, 1.00, q), p: p, rot: lerp(PG.rot0, PG.rot, p) };
  }
  // a subida da ampliação: nasce em registro com o parágrafo (NASCE) e cresce em 0,33 s (eo) até 1,03; assenta 1,03 → 1,00 em 0,22 s
  function subir(t) {
    var p = eo(seg(t, T.sobe, T.sobeDur)), q = eo(seg(t, T.sobe + T.sobeDur, T.assenta)), pt = eo(seg(t, T.sobe, T.sobeDur + T.assenta));
    var k = t < T.sobe + T.sobeDur ? lerp(NASCE.k, 1.03, p) : lerp(1.03, 1.00, q);
    return { op: t >= T.sobe ? 1 : 0, k: k, p: pt, cx: lerp(NASCE.cx, AM.cx, p), cy: lerp(NASCE.cy, AM.cy, p), rot: lerp(PG.rot, AM.rot, p) };
  }
  // a sombra solta: no ar +64 px / 1,05 / 0,35; assentada +12 px / 1,00 / 0,80 (só transform e opacity)
  function sombra(el, w, h, cx, cy, rot, k, p, op, f) {
    if (!el) return;
    var sy = lerp(64, 12, p) * (f || 1), sk = lerp(1.05, 1.00, p), so = lerp(0.35, 0.80, p) * op;
    por(el, cx, cy + sy, w, h, rot, sk * k, so);
  }
  // o texto: entra em 300 ms (opacidade + 24 px de subida, eo)
  function texto(el, t, t0) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * 24).toFixed(1) + "px)";
  }
  function fita(el, t, t0, lado) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    var rot = (lado === "e" ? -5 : 4);
    el.style.transform = "translateY(" + ((1 - p) * -80).toFixed(1) + "px) rotate(" + rot + "deg) scale(" + (1 + (1 - p) * 0.08).toFixed(4) + ")";
  }
  // a câmera: o push-in do RIG (1,00 → 1,02 → 1,03) sobre o centro + a deriva (±6 / ±4,8 px), que congela nos últimos 250 ms; o still a 0,6
  function escalaCam(t) {
    return 1 + 0.02 * eb(seg(t, T.camIni, T.camFim - T.camIni)) + 0.01 * eb(seg(t, T.retoma, T.retomaFim - T.retoma));
  }
  function aplicarCamera(t, luz) {
    var camEl = E("cam"), st = E("still"), s = escalaCam(t);
    var td = Math.min(t, T.repouso);
    var dx = 6 * Math.sin(td * 0.23), dy = 4.8 * Math.sin(td * 0.17);
    if (camEl) camEl.style.transform = "scale(" + s.toFixed(5) + ") translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
    if (st) { var PAR = 0.6, ss = 1 + (s - 1) * PAR; st.style.transform = "scale(" + ss.toFixed(5) + ") translate(" + (dx * PAR).toFixed(2) + "px," + (dy * PAR).toFixed(2) + "px)"; }
    if (camEl && luz) { camEl.style.setProperty("--luz-x", luz.x.toFixed(1) + "px"); camEl.style.setProperty("--luz-y", luz.y.toFixed(1) + "px"); }
  }

  // ═══ O GRIFO sobre os pixels do recorte (medidos: _tmp/arte-1/EF5/medir_recorte.py; x e y em px do recorte) ═══
  // cada trecho: a linha (y0 → y1), o x de começo e de fim, e os marcos [t, x] por onde a frente passa (o começo e o fim de cada palavra
  // no tempo da voz). As palavras, da medida: linha 5 "… oper-" 2507–2695; linha 6 "ations 221–448 · that 496–655 · the 701–821 ·
  // Government 871–1344 · of 1392–1466 · Canada 1505–1796 · may 1843–2005 · not 2051–2171 · be 2217–2300 · obligated 2349–2697";
  // linha 7 "to 218–287 · provide 331–613".
  var GRIFOS = [
    { y0: 914, y1: 992, x0: 2507, x1: 2695, m: [[3.397, 2507], [3.70, 2695]] },                                   // "oper-"
    { y0: 998, y1: 1076, x0: 221, x1: 2697, m: [[3.74, 221], [4.087, 448], [4.167, 496], [4.247, 655], [4.287, 701], [4.327, 821],
        [4.407, 871], [4.727, 1344], [4.807, 1392], [4.887, 1466], [4.967, 1505], [5.367, 1796], [5.447, 1843], [5.607, 2005],
        [5.687, 2051], [5.847, 2171], [5.927, 2217], [6.007, 2300], [6.087, 2349], [6.567, 2697]] },              // "ations … obligated"
    { y0: 1081, y1: 1159, x0: 218, x1: 613, m: [[6.647, 218], [6.76, 287], [6.842, 331], [7.227, 613]] }          // "to provide"
  ];
  (function () {
    var g = E("amGrifos"); if (!g) return;
    GRIFOS.forEach(function (it) {
      var d = document.createElement("div"); d.className = "grifo";
      d.style.left = ((it.x0 - JX0) * S - 8).toFixed(1) + "px"; d.style.top = ((it.y0 + 2 - JY0) * S).toFixed(1) + "px";
      d.style.width = ((it.x1 - it.x0) * S + 16).toFixed(1) + "px"; d.style.height = ((it.y1 - it.y0 - 2) * S).toFixed(1) + "px";
      d.style.transform = "scaleX(0)"; g.appendChild(d); it.el = d;
    });
  })();
  function fracao(it, t) {
    var m = it.m; if (t <= m[0][0]) return 0; if (t >= m[m.length - 1][0]) return 1;
    for (var i = 1; i < m.length; i++) if (t <= m[i][0]) {
      var x = lerp(m[i - 1][1], m[i][1], (t - m[i - 1][0]) / (m[i][0] - m[i - 1][0]));
      return clamp((x - it.x0) / (it.x1 - it.x0), 0, 1);
    }
    return 1;
  }

  var LINHA_Y = AM.cy - AM.h / 2 + MOLD + ((998 + 1076) / 2 - JY0) * S;
  function alvoLuz(t) {
    var a = pousoFolha(t), u = eb(seg(t, T.sobe, 0.6)), v = eb(seg(t, T.luzLinha, 0.5));
    return { x: lerp(PG.cx, AM.cx, u), y: lerp(lerp(PG.cy - a.dy, AM.cy, u), LINHA_Y, v) };
  }

  function cena(t) {
    t = t + 0.0005;
    aplicarCamera(t, alvoLuz(t - 0.12));
    // a página
    var a = pousoFolha(t);
    sombra(E("pgSombra"), PG.w, PG.h, PG.cx, PG.cy - a.dy, a.rot, a.k * KP, a.p, a.op, 1);
    por(E("pg"), PG.cx, PG.cy - a.dy, PG.w, PG.h, a.rot, a.k * KP, a.op);
    fita(E("pgFe"), t, T.fita, "e"); fita(E("pgFd"), t, T.fita + 0.12, "d");

    por(E("am"), b.cx, b.cy, AM.w, AM.h, b.rot, b.k, b.op);

})();
