   much room kept empty for the flood, every year of the deal, whatever the treaty does or doesn't require."
  Técnica MISTA num arquivo (item 64 do para-passos: o dono é o mapista, pelo modo do arquivo): satélite → desenho. Mapista, lote M6
  (tarefa rio-columbia-arte-1, 13/11/2026): cena NOVA, gerada por out/rio-columbia/_tmp/arte-1/M6/gerar41.py.

  _animacao_fora_do_opus[1]: aqui, pelo mapista); conceito-visual.json bf511817 (s41; o arco, peças 1 e 8); o espelho 3de8e7ad; o
  para-passos 265ac78a (itens 30, 46, 64 e os gerais 56, 74, 80, 81, 82).
  NENHUM TILE: o P1 é o par Landsat local (sem a base da MapTiler por baixo), e o P2 é desenho sobre a mesa. Por isso o crédito do P1 é
  "© OpenStreetMap contributors" (o contorno do lago e o rio são do OSM), a forma que o próprio textos-tela dá na nota do [232] ("se o
  mapista não usar base da MapTiler sob o par Landsat, só '© OpenStreetMap contributors'").

    para ABRIL: a margem clara de chão aparece em volta do canal. O CONTORNO DO LAGO CHEIO (lago-arrow, OSM, simplificado a 1 px; M6/
    prep6.py) entra em --destaque fino (5 px, com o halo escuro) junto com a cena de abril: a faixa de chão fica entre o traço e a água.
    Em 'downstream' (2,782) A LUZ DE CORRENTE (--agua-luz, a mesma da identidade §2) desce o lago pela linha do Columbia (OSM), recortada
    no contorno do lago (só sobre a água do lago), 700 px/s, e sai pelo pé do quadro: a viagem até as usinas americanas não cabe em 4,7 s,
    e a água que sai do quadro a diz (decisão declarada do conceito).
    "Satellite views: July 11 and April 14, 2024" [231] (legenda, 84 px) em 0,167, ao pé do quadro À DIREITA (à esquerda ela cobriria o

    público; a descrição leva "Landsat imagery courtesy of the U.S. Geological Survey").
  b1 / P2 (4,733–14,267): corte seco para A PEÇA 1, O CORTE DO LAGO (o bloco da s03, sem mudar nada), sobre a mesa M-VALE

<script>
/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de
   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();
   Lei: a cena é função pura de t. Nada aqui lê relógio, sorteia ou anda sozinho. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.

    function tracoParte(par, k) {
      var p = k <= par[2] ? 0 : k >= par[3] ? 1 : (k - par[2]) / (par[3] - par[2]);
      p = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;   // a pena acelera e assenta (quadrática de entrada e saída)
      var off = f1(1000 * (1 - p));

      par[1].setAttribute("stroke-dasharray", "1000 1000"); par[1].setAttribute("stroke-dashoffset", off);

    }

      partes.gC.setAttribute("opacity", f1(pc));
      var pr = k <= 0.88 ? 0 : k >= 1 ? 1 : (k - 0.88) / 0.12;
      partes.rioT.setAttribute("opacity", pr.toFixed(3)); partes.rioL.setAttribute("opacity", pr.toFixed(3)); partes.rioLuz.setAttribute("opacity", pr.toFixed(3));
      // a água: o triângulo entre o chão, a face da barragem e o nível
      var y = s.nivel == null ? NIVEL.RESERVADO : s.nivel, bm = b.montante;
      if (y >= b.base - 0.5) { partes.agua.setAttribute("points", ""); partes.sup.setAttribute("opacity", 0); partes.gSim.setAttribute("opacity", 0); }
      else {
        var xe = xChao(y);
        partes.agua.setAttribute("points", pts([[xe, y], [bm, y], [bm, b.base]]));
        partes.sup.setAttribute("x1", f1(xe)); partes.sup.setAttribute("x2", bm); partes.sup.setAttribute("y1", f1(y)); partes.sup.setAttribute("y2", f1(y));
        partes.sup.setAttribute("opacity", 1);
        var d = b.base - y, ps = d <= 80 ? 0 : d >= 180 ? 1 : (d - 80) / 100;   // o ▽ só quando a lâmina já é larga
        partes.gSim.setAttribute("opacity", ps.toFixed(3));
        partes.gSim.setAttribute("transform", "translate(" + G.simbolo.x + "," + f1(y) + ")");
      }
      partes.marca.setAttribute("opacity", (0.7 * clamp01(s.marcaCheio || 0)).toFixed(3));
      // a hachura: a frente corre de x 810 (a encosta) a x 3000 (a barragem)
      var h = clamp01(s.hachura || 0), x0 = xChao(NIVEL.CHEIO) - 60;
      partes.revela.setAttribute("width", f1((bm + 60 - x0) * h));
      var pu = clamp01(s.pulso || 0), puOn = pu > 0 && pu < 1;
      var largura = G.hachura.traco + (puOn ? 3 * Math.sin(Math.PI * Math.min(1, pu * 2)) : 0);
      partes.gL.setAttribute("stroke-width", largura.toFixed(2));
      partes.gH0.setAttribute("opacity", (s.hachuraAlfa == null ? 1 : clamp01(s.hachuraAlfa)).toFixed(3));
      var e = 1 - Math.pow(1 - pu, 3);
      partes.pulso.setAttribute("opacity", puOn ? (0.85 * (1 - pu)).toFixed(3) : 0);
      var ks = (1 + 0.06 * e).toFixed(4);   // o contorno se abre em torno do centroide da faixa
      partes.pulso.setAttribute("transform", "translate(" + FAIXA_C.x + "," + FAIXA_C.y + ") scale(" + ks + ") translate(" + (-FAIXA_C.x) + "," + (-FAIXA_C.y) + ")");
      // a luz de corrente: a fase vem da cena (já integra a vazão)
      partes.rioLuz.setAttribute("stroke-dashoffset", f1(-((s.rioFase || 0) % 180)));
    }
    function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
    return { estado: estado, partes: partes };
  }
  return { G: G, NIVEL: NIVEL, FAIXA_C: FAIXA_C, xChao: xChao, yChao: yChao, yTerreno: yTerreno, faixaPts: faixaPts, nivelPorVolume: nivelPorVolume, montar: montar };
})();
/* ═══════════════ PEÇA 1 · O CORTE DO LAGO — FIM DO BLOCO ═══════════════ */
</script>
<script>
(function () {
  "use strict";

  var E = function (id) { return document.getElementById(id); };
  var eio = function (x) { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  var DUR = 14.267;   // espelho.json › s41 › dur, literal (roupa §8)
  window.__duracao = DUR;
  function falhar(m) { window.__erroCena = m; var el = E("erroCena"); if (el) { el.textContent = "CENA COM ERRO — " + m; el.hidden = false; } }

  // ═══ TEMPOS (0 = 494,133 s do master; words.json): 'drops' 0,392 · 'downstream' 2,782 · 'power.' 3,742 · 'What' 4,737 ·
  //   'guarantee:' 6,617 · 'kept' 8,552 · 'empty' 8,857 · 'every' 10,077 · 'require.' 13,452 ═══
  var T = { corte: 4.733, legPar: 0.167, cruza: [0.392, 1.2], luz: 2.782, naoEscala: 4.9, moldura: [6.617, 0.6], hachura: [6.617, 0.5],
            kept: 8.567, respira: 10.077, camFim: 10.077 };

  // ═══ O PAR LANDSAT (a peça 8, o modo PAR da s16): as duas cenas do mesmo recorte, empilhadas, a 1:1; a deriva é uma só, linear no P1;
  //   em s41 a ordem é JULHO → ABRIL (do cheio ao baixo), e o recorte é o de PERTO (4000 × 2249) ═══
  var PAR = {
    baixo: "pico", cima: "fundo",                     // 11/07/2024 (Landsat 9) por baixo; 14/04/2024 (Landsat 8) por cima, que cruza
    png: [4000, 2249],
    de: [56, 12], ate: [72, 52],                       // a deriva: 16 px a leste e 40 ao sul (o sentido da água), dentro da folga do PNG
    cruza: T.cruza                                     // 'drops': o cruzamento de 1,2 s
  };
  function parAt(t) {
    var u = seg(t, 0, T.corte);
    return { x: -(PAR.de[0] + (PAR.ate[0] - PAR.de[0]) * u), y: -(PAR.de[1] + (PAR.ate[1] - PAR.de[1]) * u), cima: eio(seg(t, PAR.cruza[0], PAR.cruza[1])) };
  }
  var LUZ = { vel: 700, periodo: 600 };

  // ═══ O CORTE (a peça 1, o bloco da s03 sem mudança) ═══
  var N = CORTE.NIVEL, FC = CORTE.FAIXA_C, C = CORTE.montar(E("gCorte"));
  (function () { var m = E("moldura"); if (m) m.setAttribute("points", CORTE.faixaPts().map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ")); })();
  var S0 = 0.97;
  // o nível respira em torno de BAIXO (±24 px no y), pelo VOLUME (a física do bloco): o volume oscila entre o de y 1196 e o de y 1244
  function nivel(t) {
    if (t < T.respira) return N.BAIXO;
    var a = eo(seg(t, T.respira, 0.6)), s = Math.sin(2 * Math.PI * (t - T.respira) / 2.4);
    var p = 0.5 + 0.5 * s * a;   // 0 → o volume de y 1244; 1 → o de y 1196
    return CORTE.nivelPorVolume(N.BAIXO + 24 * a, N.BAIXO - 24 * a, p);
  }
  function rioFase(t) { return 110 * t + 90 * (t < T.respira ? 0 : (1 - Math.cos(2 * Math.PI * (t - T.respira) / 2.4)) * eo(seg(t, T.respira, 0.6))); }
  function camera(t) {
    var s = S0 + (1 - S0) * eb(seg(t, T.corte, T.camFim - T.corte));
    var c = E("cam"); if (c) c.style.transform = "scale(" + s.toFixed(5) + ")";
    var st = E("still"); if (st) st.style.transform = "scale(" + (1 + (s / S0 - 1) * 0.6).toFixed(5) + ")";
  }
  function mostra(id, v, x, y) {
    var e = E(id); if (!e) return;
    e.style.opacity = v.toFixed(3); e.style.visibility = v > 0.001 ? "visible" : "hidden";
    if (x != null) e.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
  }
  function texto(id, t, t0, t1, x, y) {   // entra em 300 ms (opacidade + 24 px de subida); fica parado
    var p = eo(seg(t, t0, 0.3)) * (t1 != null && t >= t1 ? 0 : 1);
    mostra(id, p, x, y + 24 * (1 - eo(seg(t, t0, 0.3))));
  }

  function cena(t) {
    var p1 = t < T.corte;
    var b1 = E("p1"), b2 = E("p2");
    if (b1) b1.style.visibility = p1 ? "visible" : "hidden";
    if (b2) b2.style.visibility = p1 ? "hidden" : "visible";
    // P1: o par
    var p = parAt(t), box = E("parBox");
    if (box) box.style.transform = "translate(" + p.x.toFixed(2) + "px," + p.y.toFixed(2) + "px)";
    var cima = E(PAR.cima); if (cima) cima.style.opacity = p.cima.toFixed(4);
    var ct = E("contorno"); if (ct) ct.setAttribute("opacity", p.cima.toFixed(3));
    var vl = eo(seg(t, T.luz, 0.3)), lz = E("luzLago");
    if (lz) {
      lz.setAttribute("opacity", (0.85 * vl).toFixed(3));
      var off = (-(LUZ.vel * Math.max(0, t - T.luz)) % LUZ.periodo).toFixed(1);
      ["luzBrilho", "luzNucleo"].forEach(function (id) { var el = E(id); if (el) el.setAttribute("stroke-dashoffset", off); });
    }
    var lp = E("legPar");
    if (lp) texto("legPar", t, T.legPar, T.corte, 3640 - lp.offsetWidth, 1740 - lp.offsetHeight);
    mostra("credOsm", p1 ? 1 : 0);
    // P2: o corte

    var lu = E("luz"); if (lu) { lu.style.setProperty("--luz-x", (FC.x + 400) + "px"); lu.style.setProperty("--luz-y", (FC.y + 400) + "px"); }

    var m = E("moldura"), um = eio(seg(t, T.moldura[0], T.moldura[1]));
    if (m) { m.setAttribute("opacity", um > 0 ? "1" : "0"); m.setAttribute("stroke-dashoffset", (1000 * (1 - um)).toFixed(1)); }
    if (!p1) {
      texto("naoEscala", t, T.naoEscala, null, 520, 1540);
      var k = E("kept"); if (k) texto("kept", t, T.kept, null, 1905 - k.offsetWidth / 2, 820 - k.offsetHeight);
      var cl_ = E("credLei"), v = eo(seg(t, T.kept, 0.3)); if (cl_) { cl_.style.opacity = v.toFixed(3); cl_.style.visibility = v > 0.001 ? "visible" : "hidden"; }
    } else { mostra("naoEscala", 0); mostra("kept", 0); mostra("credLei", 0); }
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }   // nunca lança

    var a = E("pico"), b = E("fundo");
    if (!a || !b || a.naturalWidth !== PAR.png[0] || b.naturalWidth !== PAR.png[0] || a.naturalHeight !== PAR.png[1] || b.naturalHeight !== PAR.png[1])

    window.__renderAt(0); return true;
  });
  window.__renderAt(0);
})();
