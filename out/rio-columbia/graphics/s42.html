<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 3840px; height: 2160px; overflow: hidden; background: var(--papel); }
  /* DADO sobre --papel (identidade §5): sem still, sem luz, sem feltro; o papel é o palco inteiro, e a câmera move o conjunto */
  #palco { position: relative; width: 3840px; height: 2160px; overflow: hidden; background: var(--papel);

  #cam { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; transform-origin: 0 0; }

  /* ═══ PEÇA 4 · AS TRENAS (o estilo; a geometria está no módulo TRENA do script). Nasce na s42; a s56 copia este bloco ═══
     Traço de engenheiro sobre o --papel: só linha em --tinta-escura, sem cor de lado; o trilho (o eixo) em --eixo-cor. O único
     preenchimento é o próprio --papel, que faz a OCLUSÃO (a fita passa por cima do trilho; o corpo esconde a fita recolhida). */
  #trenas { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; overflow: visible; }
  .tr-trilho { fill: none; stroke: var(--eixo-cor); stroke-width: 4px; }                    /* o trilho graduado: --tinta-escura a 60 % */
  .tr-marca { stroke: var(--eixo-cor); stroke-width: 4px; }                                  /* a graduação do trilho */
  .tr-fita-corpo { fill: var(--papel); stroke: none; }                                       /* a fita tapa o trilho por onde passa */
  .tr-linha { fill: none; stroke: var(--tinta-escura); stroke-width: var(--linha-espessura); stroke-linecap: butt; }
  .tr-torcao { fill: none; stroke: var(--tinta-escura); stroke-width: var(--linha-espessura); stroke-linecap: round; }   /* as bordas da torção, na boca do estojo */
  .tr-grad { stroke: var(--tinta-escura); stroke-width: 5px; }                               /* a graduação impressa na fita */
  .tr-hach { stroke: var(--tinta-escura); stroke-width: 5px; }                               /* a hachura do intervalo, a 45° */
  .tr-media { fill: var(--tinta-escura); stroke: none; }                                     /* a média da impressão (a mesma tinta, espalhada), com a fita em movimento rápido; a opacidade vem do script */
  .tr-cheio { fill: var(--tinta-escura); stroke: none; }                                     /* o gancho da ponta e a marca do piso do intervalo */
  .tr-corpo { fill: var(--papel); stroke: var(--tinta-escura); stroke-width: var(--linha-espessura); stroke-linejoin: round; }
  .tr-oculto { fill: none; stroke: var(--eixo-cor); stroke-width: 4px; stroke-dasharray: 12 10; }   /* aresta escondida: a bobina, tracejada */
  .tr-fino { fill: none; stroke: var(--tinta-escura); stroke-width: 4px; stroke-linecap: round; }
  /* ═══ fim do estilo da PEÇA 4 ═══ */

  /* as cotas, soltas sobre o papel, em --tinta-escura (identidade §2: texto sobre --papel); sem pílula: papel não é mapa nem registro.

     Peso: 700 em toda linha que traz quantia ou unidade; 500 na linha que só atribui (o dono com a data). */
  .cota { position: absolute; left: 0; top: 0; white-space: nowrap; font-family: var(--fonte); color: var(--tinta-escura);
