  }

  // ═══ O BALANÇO (o pêndulo amortecido, resposta a impulso): θ(τ) = A·e^(−βτ)·sen(ωτ), em graus ═══
  var PEND = { w: 2 * Math.PI / 0.85, b: 0.55, A1: 1.30, A2: 1.50 };

  // o LEVANTAR (identidade §4.4): 350 ms, escala 1,00 → 1,04 em p³, a sombra de +12/0,80 a +64/0,35, a opacidade cai nos últimos 200 ms

  // a matriz de cada página (no mundo): o arame, o lugar dela, o balanço em torno da argola e o levantar em torno do meio dela
  function matPagina(i, t) {
    var lv = levantar(i, t), th = anguloPagina(i, t);
    var m = mm(tr(X0 + i * C7.passo, Y0), rot(th, C7.pagW / 2, 0));
    if (lv.k !== 1) m = mm(m, esc(lv.k, C7.pagW / 2, C7.gancho + C7.pagH / 2));
    return { m: m, lv: lv, th: th };
  }

  // ═══ AS LETRAS DOS MESES: um nó só; cada letra no lugar dela na página dela, girando com ela ═══
  var MESES = E("meses"), TEXTO = MESES ? MESES.textContent : "", AVANCO = null, BASE_Y = C7.gancho + 172;   // a linha de base a 172 px do alto da página (o alfinete cabe entre a borda e as letras)
  function medirLetras() {
    if (AVANCO || !MESES || !MESES.getSubStringLength) return;
    try {
      if (MESES.textContent !== TEXTO) MESES.textContent = TEXTO;   // mede sempre o texto inteiro (os índices das letras são dele)

      var av = []; for (var k = 0; k < TEXTO.length; k++) av.push(MESES.getSubStringLength(k, 1));

    } catch (e) { AVANCO = null; }
  }
  function avancoDe(k) { return AVANCO ? AVANCO[k] : 84 * 0.68; }
  var DEGRADE = (function () {   // duas paradas por página (faixa dura), a tinta --tinta-escura
    var g = E("gradMeses"), pars = [];
    if (!g) return pars;
    for (var i = 0; i < 12; i++) {
      var a = (X0 + i * C7.passo - (C7.passo - C7.pagW) / 2) / 3840, b = (X0 + i * C7.passo + C7.pagW + (C7.passo - C7.pagW) / 2) / 3840;
      [a, b].forEach(function (o) { pars.push(el("stop", { offset: Math.max(0, Math.min(1, o)).toFixed(5), style: "stop-color: var(--tinta-escura)" }, g)); });
    }

  })();
  function aplicarMeses(t, mats) {

    var palavras = TEXTO.split(" ");
    function lugarMes(i) {   // as posições das três letras do mês i, no mundo, e o giro
      var w = 0, j, pi = 0; for (j = 0; j < i; j++) pi += palavras[j].length + 1;
      for (j = 0; j < palavras[i].length; j++) w += avancoDe(pi + j);

    MESES.setAttribute("opacity", eo(seg(t, T.meses, 0.3)).toFixed(3));

    for (i = 0; i < 12; i++) { var v = mats[i].lv.v.toFixed(3); if (DEGRADE[2 * i]) { DEGRADE[2 * i].style.stopOpacity = v; DEGRADE[2 * i + 1].style.stopOpacity = v; } }
  }

  // ═══ O ALFINETE: cai na profundidade (queda livre analítica), a cabeça é o anel; o contato em 'settled' ═══
  var ALF = { alvo: [C7.pagW / 2, C7.gancho + 45], h: 0.80, cai: T.settled - T.pays };
  function aplicarAlfinete(t, c) {
    var g = E("alfinete"); if (!g) return;

    var tau = Math.min(t - T.pays, ALF.cai), h = 1 - (tau / ALF.cai) * (tau / ALF.cai);   // a altura normalizada, quadrática no tempo

    if (pu) { pu.setAttribute("transform", "scale(" + ((1 + 0.8 * (vivo ? u : 0)) / s1).toFixed(5) + ")"); pu.setAttribute("opacity", vivo ? (1 - u).toFixed(3) : "0"); }
  }

  // ═══ A LUZ DA MESA (o véu), 120 ms atrás: de baixo para atrás das páginas em 'calendar.', depois atrás de MAY ═══
  function aplicarLuz(t) {
    var a = eo(seg(t - T.luzAtraso, T.calendar, T.luzDur)), b = eb(seg(t - T.luzAtraso, T.camP2[0], T.camP2[1]));
    var x = lerp(CENTRO.x, MAYC.x, b), y = lerp(1320, CENTRO.y, a);
    var lz = E("luz"); if (lz) { lz.style.setProperty("--luz-x", (x + 400).toFixed(1) + "px"); lz.style.setProperty("--luz-y", (y + 400).toFixed(1) + "px"); }
  }

  function cena(t) {
    var c = cameraAt(t);
    aplicarCamera(c);
    aplicarLuz(t);
    // o calendário: as colunas de hoje; cada página com o balanço e o levantar dela
    CAL.estado(CAL_M, { x: X0, y: Y0, v: 1, serie: 1 });
    var mats = [];
    for (var i = 0; i < 12; i++) {
      var mp = matPagina(i, t); mats.push(mp);
      var gp = CAL_M.pags[i].parentNode;   // o "gp" do bloco (o lugar da página no arame); o balanço e o levantar vão nele
      if (gp) { gp.setAttribute("transform", txt(mm(mm(tr(i * C7.passo, 0), rot(mp.th, C7.pagW / 2, 0)), mp.lv.k !== 1 ? esc(mp.lv.k, C7.pagW / 2, C7.gancho + C7.pagH / 2) : [1, 0, 0, 1, 0, 0])));
                gp.setAttribute("opacity", mp.lv.v.toFixed(3)); }
      var sb = CAL_M.pags[i].__sombra;
      if (sb) { sb.setAttribute("transform", "translate(0," + (12 + 52 * mp.lv.p).toFixed(2) + ")"); sb.setAttribute("opacity", (0.80 - 0.45 * mp.lv.p).toFixed(3)); }
    }

    var vc = 0.40 * eo(seg(t, T.corte[0], T.corte[1]));

    VIDRO.g.setAttribute("opacity", vc.toFixed(3));
    var mPag = mm(matCam(c), mats[MAY].m);   // página (local) → tela
    VIDRO.inv.setAttribute("transform", txt(inv(mPag)));

  }

  window.__renderAt = function (t) {
    try { cena(cl(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }   // nunca lança
  };

  // só conferência (a prova vem dos quadros): a câmera, o ângulo de MAY, a altura do alfinete
  window.__s49estado = function (t) {
    t = cl(+t || 0, 0, DUR);
    var c = cameraAt(t);
    return { camera: { s: +c.s.toFixed(5), A: [+c.ax.toFixed(1), +c.ay.toFixed(1)], B: [+c.bx.toFixed(1), +c.by.toFixed(1)] },

  };
  window.__renderAt(0);
})();
