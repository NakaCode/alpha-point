/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.

   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();
   Lei: a cena é função pura de t. Nada aqui lê relógio, sorteia ou anda sozinho. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};
    const s = (o.base ?? 1.02) + (o.zoom ?? 0.0024) * t;
    const x = (o.ax ?? 6) * Math.sin(t * 0.23), y = (o.ay ?? 4.8) * Math.sin(t * 0.17);
    el.style.transform = "scale(" + s.toFixed(5) + ") translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";

  // Vídeo por f(t): posiciona e espera o "seeked". Na galeria (__PREVIEW) não mexe.
  function seekTo(v, tt) {
    if (!v || window.__PREVIEW || v.readyState < 1) return Promise.resolve();
    const d = v.duration; if (d > 0 && isFinite(d)) tt = clamp(tt, 0, Math.max(0, d - 0.001));
    if (Math.abs(v.currentTime - tt) < 1e-4 && !v.seeking) return Promise.resolve();
    return new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.addEventListener("error", r, { once: true }); v.currentTime = tt; });

      var pc = k <= 0.85 ? 0 : k >= 1 ? 1 : (k - 0.85) / 0.15;   // o conduto e o rio entram no fim do traço
      partes.gC.setAttribute("opacity", f1(pc));
      var pr = k <= 0.88 ? 0 : k >= 1 ? 1 : (k - 0.88) / 0.12;
      partes.rioT.setAttribute("opacity", pr.toFixed(3)); partes.rioL.setAttribute("opacity", pr.toFixed(3)); partes.rioLuz.setAttribute("opacity", pr.toFixed(3));
      // a água: o triângulo entre o chão, a face da barragem e o nível
      var y = s.nivel == null ? NIVEL.RESERVADO : s.nivel, bm = b.montante;
      if (y >= b.base - 0.5) { partes.agua.setAttribute("points", ""); partes.sup.setAttribute("opacity", 0); partes.gSim.setAttribute("opacity", 0); }
      else {
        var xe = xChao(y);
        partes.agua.setAttribute("points", pts([[xe, y], [bm, y], [bm, b.base]]));
        partes.sup.setAttribute("x1", f1(xe)); partes.sup.setAttribute("x2", bm); partes.sup.setAttribute("y1", f1(y)); partes.sup.setAttribute("y2", f1(y));
        partes.sup.setAttribute("opacity", 1);
        var d = b.base - y, ps = d <= 80 ? 0 : d >= 180 ? 1 : (d - 80) / 100;   // o ▽ só quando a lâmina já é larga
        partes.gSim.setAttribute("opacity", ps.toFixed(3));
        partes.gSim.setAttribute("transform", "translate(" + G.simbolo.x + "," + f1(y) + ")");
      }
      partes.marca.setAttribute("opacity", (0.7 * clamp01(s.marcaCheio || 0)).toFixed(3));
      // a hachura: a frente corre de x 810 (a encosta) a x 3000 (a barragem)
      var h = clamp01(s.hachura || 0), x0 = xChao(NIVEL.CHEIO) - 60;
      partes.revela.setAttribute("width", f1((bm + 60 - x0) * h));
      var pu = clamp01(s.pulso || 0), puOn = pu > 0 && pu < 1;
      var largura = G.hachura.traco + (puOn ? 3 * Math.sin(Math.PI * Math.min(1, pu * 2)) : 0);
      partes.gL.setAttribute("stroke-width", largura.toFixed(2));
      partes.gH0.setAttribute("opacity", (s.hachuraAlfa == null ? 1 : clamp01(s.hachuraAlfa)).toFixed(3));
      var e = 1 - Math.pow(1 - pu, 3);
      partes.pulso.setAttribute("opacity", puOn ? (0.85 * (1 - pu)).toFixed(3) : 0);
      var ks = (1 + 0.06 * e).toFixed(4);   // o contorno se abre em torno do centroide da faixa
      partes.pulso.setAttribute("transform", "translate(" + FAIXA_C.x + "," + FAIXA_C.y + ") scale(" + ks + ") translate(" + (-FAIXA_C.x) + "," + (-FAIXA_C.y) + ")");
      // a luz de corrente: a fase vem da cena (já integra a vazão)
      partes.rioLuz.setAttribute("stroke-dashoffset", f1(-((s.rioFase || 0) % 180)));
    }
    function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
    return { estado: estado, partes: partes };
  }
  return { G: G, NIVEL: NIVEL, FAIXA_C: FAIXA_C, xChao: xChao, yChao: yChao, yTerreno: yTerreno, faixaPts: faixaPts, nivelPorVolume: nivelPorVolume, montar: montar };
})();
/* ═══════════════ PEÇA 1 · O CORTE DO LAGO — FIM DO BLOCO ═══════════════ */
</script>
<script>
(function () {
  "use strict";
  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo, eb = R.eb;
  var E = function (id) { return document.getElementById(id); };
  var f2 = function (v) { return (+v).toFixed(2); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };

  var DUR = 16.833;
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia é do redator-de-tela: textos-tela.json › s50) ═══════════════════════════════════
  var TEXTOS = {
    cred: "Adam Jones / Wikimedia Commons · CC BY 2.0",   // [305] crédito, 0–11,233 (o credito_na_tela dos dois vereditos)
    lugar: "Upper Arrow Lake",                             // [302] rótulo, 0,167–11,233 (lugar_na_origem "Upper Arrow Lakeshore - Nakusp - BC"; sem Nakusp)
    aviso: "Photo from 2023",                              // [303] 0,167–6,067 e [304] 6,100–11,233: o mesmo bloco nas duas fotos (30/04/2023)
    naoEscala: "Not to scale",                             // [306] legenda, 11,400–16,833 · regra de série 4
    room: "ROOM"                                           // [307] rótulo, 14,967–16,833 · regra de série 5 · lastro: "is the room,"
  };
  Object.keys(TEXTOS).forEach(function (k) { var e = E(k); if (e) e.textContent = TEXTOS[k]; });

  // ── os tempos (locais, −659,467), do words.json, dos textos de tela e da regência s50 ──
  var T = {
    p2: 6.067, p3: 11.233,                   // os dois cortes secos (regência: b1 e b2)
    cred: 0.0, lugar: 0.167, aviso: 0.167,   // os t0 do redator
    naoEscala: 11.400, room: 14.967,         // os t0 do redator
    sobe: 11.443, sobeDur: 1.60,             // 'summer,': BAIXO → CHEIO, cúbico no volume; chega em 'it.' (13,043)
    volta: 13.10, voltaDur: 1.00,            // e volta: CHEIO → BAIXO
    marca: 13.10, marcaDur: 0.30,            // o tracejado do nível CHEIO fica onde a água estava
    moldura: 13.663, molduraDur: 0.50,       // 'Part': a moldura tracejada da parte paga
    hachura: 13.90, hachuraDur: 0.50,        // a hachura corre atrás da moldura
    luzAtraso: 0.12,                         // tokens.css --mov-luz-atraso
    camFim: 14.65                            // o empurrão termina 0,31 s antes de 'room,' (14,958): tudo para
  };

  // ═══ P1 e P2 · AS FOTOS (Ken Burns com direção: a escala linear e a janela andando rumo ao assunto) ═══
  var KB = {
    A: { t0: 0, t1: T.p2, k: [1.00, 1.10], origem: "62% 70%", anda: [-70, -38] },      // rumo à linha d'água (a imagem anda para a esquerda e para cima)
    B: { t0: T.p2, t1: T.p3, k: [1.00, 1.05], origem: "18% 42%", anda: [30, 12] }      // rumo à margem exposta, à esquerda (a imagem anda para a direita e para baixo)
  };
  function foto(idCaixa, idImg, kb, t) {
    var cx = E(idCaixa), im = E(idImg); if (!cx) return;
    var on = t >= kb.t0 && t < kb.t1;
    cx.style.visibility = on ? "visible" : "hidden";
    if (!on || !im) return;
    var p = clamp((t - kb.t0) / (kb.t1 - kb.t0), 0, 1), k = lerp(kb.k[0], kb.k[1], p);
    im.style.transformOrigin = kb.origem;
    im.style.transform = "translate(" + f2(kb.anda[0] * p) + "px," + f2(kb.anda[1] * p) + "px) scale(" + k.toFixed(5) + ")";
  }
  // os textos sobre a foto: fixos na tela; entram em 300 ms (opacidade + 24 px de subida, eo) e saem com o corte seco da foto
  function sobreFoto(el, t, t0, x, y) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3)), on = t < T.p3 && p > 0.001;
    el.style.visibility = on ? "visible" : "hidden";
    el.style.opacity = on ? p.toFixed(3) : "0";
    el.style.transform = "translate(" + f2(x) + "px," + f2(y + 24 * (1 - p)) + "px)";
  }

  // ═══ P3 · A PLACA: O CORTE DO LAGO, DO CHÃO ═══
  var N = CORTE.NIVEL, FC = CORTE.FAIXA_C, G = CORTE.G;
  var S_P3 = 1.03, PARALAXE = 0.6;                                             // tokens.css --mesa-satelite-paralaxe
  var LUZ_CORTE = { x: 2020, y: 1120 }, LUZ_FAIXA = { x: FC.x, y: FC.y };      // a luz: atrás do corte inteiro, depois atrás da faixa
  var ROOM_BASE = { x: 2039, y: 836 };                                         // o centro e a base do ROOM: o mesmo da s63 (24 px acima do topo da faixa)
  var CT = CORTE.montar(E("gCorte"));
  (function () {
    var m = E("moldura"); if (m) m.setAttribute("points", CORTE.faixaPts().map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" "));
    var r = E("s50RevelaR"); if (r) { r.setAttribute("x", (CORTE.xChao(N.CHEIO) - 60).toFixed(1)); r.setAttribute("y", N.CHEIO - 40); r.setAttribute("height", N.RESERVADO - N.CHEIO + 80); }
  })();
  // o nível pelo VOLUME: sobe de BAIXO a CHEIO, e volta
  function nivel(t) {
    if (t < T.volta) return CORTE.nivelPorVolume(N.BAIXO, N.CHEIO, eb(seg(t, T.sobe, T.sobeDur)));
    return CORTE.nivelPorVolume(N.CHEIO, N.BAIXO, eb(seg(t, T.volta, T.voltaDur)));
  }
  function rioFase(t) { return 110 * Math.max(0, t - T.p3) + 443 * eb(seg(t, T.volta, T.voltaDur)); }   // ∫ velocidade: base + a vazão da descida
  // o CHÃO EXPOSTO (o chão das fotos): da mata (o nível CHEIO, x 810) até a linha d'água, sobre a reta do chão; some debaixo da água
  function chaoExposto(y) {
    var c = E("chaoExposto"); if (!c) return;
    var x0 = CORTE.xChao(N.CHEIO), x1 = CORTE.xChao(y), tem = y - N.CHEIO > 1.5;
    c.setAttribute("x1", x0.toFixed(1)); c.setAttribute("y1", N.CHEIO);
    c.setAttribute("x2", x1.toFixed(1)); c.setAttribute("y2", y.toFixed(1));
    c.setAttribute("opacity", tem ? "1" : "0");
  }
  function textoPlaca(id, t, tin, x, y, centro, base) {
    var e = E(id); if (!e) return;
    var p = eo(seg(t, tin, 0.3));
    var l = centro ? x - e.offsetWidth / 2 : x, tp = base ? y - e.offsetHeight : y;
    e.style.opacity = p.toFixed(3);
    e.style.transform = "translate(" + f2(l) + "px," + f2(tp + 24 * (1 - p)) + "px)";
  }
  function placa(t) {
    var pl = E("placa"); if (pl) pl.style.visibility = t >= T.p3 ? "visible" : "hidden";
    if (t < T.p3) return;
    var s = 1 + (S_P3 - 1) * eb(seg(t, T.p3, T.camFim - T.p3));
    var c = E("cam"); if (c) c.style.transform = "scale(" + s.toFixed(5) + ")";
    var st = E("still"); if (st) st.style.transform = "scale(" + (1 + (s - 1) * PARALAXE).toFixed(5) + ")";
    var pz = eo(seg(t - T.luzAtraso, T.hachura, T.hachuraDur));
    var lz = E("luz");
    if (lz) { lz.style.setProperty("--luz-x", (lerp(LUZ_CORTE.x, LUZ_FAIXA.x, pz) + 400).toFixed(1) + "px");
              lz.style.setProperty("--luz-y", (lerp(LUZ_CORTE.y, LUZ_FAIXA.y, pz) + 400).toFixed(1) + "px"); }
    var y = nivel(t), h = eo(seg(t, T.hachura, T.hachuraDur));
    if (CT) CT.estado({
      traco: 1,
      nivel: y,
      marcaCheio: eo(seg(t, T.marca, T.marcaDur)) * (1 - eo(seg(t, T.moldura, T.molduraDur))),   // a moldura toma o lugar do tracejado (a mesma linha: dois tracejados não se sobrepõem)
      hachura: h,
      hachuraAlfa: t >= T.hachura ? 1 : 0,
      pulso: 0,
      rioFase: rioFase(t)
    });
    chaoExposto(y);
    // a moldura tracejada: a frente corre da encosta à barragem
    var r = E("s50RevelaR"), x0 = CORTE.xChao(N.CHEIO) - 60;
    if (r) r.setAttribute("width", ((G.barragem.montante + 60 - x0) * eo(seg(t, T.moldura, T.molduraDur))).toFixed(1));
    textoPlaca("naoEscala", t, T.naoEscala, 520, 1540, false, false);
    textoPlaca("room", t, T.room, ROOM_BASE.x, ROOM_BASE.y, true, true);
  }

  function cena(t) {
    foto("fotoA", "imA", KB.A, t);
    foto("fotoB", "imB", KB.B, t);
    // o rótulo e o aviso: embaixo à esquerda, acima da faixa do crédito (x 200; o aviso termina em y 1840)
    var rl = E("lugar"), av = E("aviso");
    if (rl && av) {
      var hA = av.offsetHeight, hR = rl.offsetHeight, yR = 1880 - 40 - hA - 24 - hR;
      sobreFoto(rl, t, T.lugar, 200, yR);
      sobreFoto(av, t, T.aviso, 200, yR + hR + 24);
    }
    var cr = E("cred");
    if (cr) { var vc = t < T.p3 ? eo(seg(t, T.cred, 0.3)) : 0; cr.style.opacity = vc.toFixed(3); cr.style.visibility = vc > 0.001 ? "visible" : "hidden"; }
    placa(t);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR) + 0.0005); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  // só conferência: o nível e a escala da câmera no instante (a prova vem dos quadros e do DOM, não daqui)
  window.__s50estado = function (t) {
    t = clamp(+t || 0, 0, DUR);
    return { nivel_y: +nivel(t).toFixed(2), agua_encosta_em_x: +CORTE.xChao(nivel(t)).toFixed(1), camera_escala: +(1 + (S_P3 - 1) * eb(seg(t, T.p3, T.camFim - T.p3))).toFixed(5) };
  };
  window.__renderAt(0);
})();
</script>
