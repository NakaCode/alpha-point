      PRONTO_EXTRA.then(function () {
        mapaCarregado = true;
        window.__renderAt(0);
        map.once("idle", function () { if (!window.__erroCena) resolverPronto(true); });
      }, function (e) { falhar(e.message); });
    });

    var opAntes = {};
    function opac(id, prop, v) { v = +(+v).toFixed(3); var k = id + "|" + prop; if (opAntes[k] === v) return; map.setPaintProperty(id, prop, v); opAntes[k] = v; }
    criarAnel("anel");

    function aplicarCena(t, cam) {
      var vm = t >= T_MAPA ? 1 : 0;
      var ov = E("ov"), rt = E("rotulos");
      if (ov) ov.style.visibility = vm ? "visible" : "hidden";
      if (rt) rt.style.visibility = vm ? "visible" : "hidden";
      aplicarCorrente(t, cam, vm);
      aplicarLago(t, cam);
      aplicarDams(t, cam, vm);
      aplicarCabo(t, cam, vm);
      aplicarMaco(t, cam, vm);
      aplicarNotas(t, cam);
      aplicarAnel(t, cam);
      aplicarBloco37(t);
      aplicarPilula("blocoAno", t, T2.todoAno, PIL_ANO.esq, PIL_ANO.topo, "esq");
      aplicarPilula("blocoFrente", t, T2.upFront, PIL_FRENTE.dir, PIL_FRENTE.meio, "dir");
    }
    function aplicar(t) {
      aplicarCreditosMapa(t);
      if (!mapaCarregado) return Promise.resolve();
      var cam = cameraAt(t);
      map.jumpTo(cam);
      aplicarCena(t, cam);
      return Promise.resolve();
    }

    function tileComErro() {
      try {
        var sc = map.style.sourceCaches || map.style._sourceCaches || {};
        for (var id in sc) { var ts = (sc[id] && sc[id]._tiles) || {}; for (var k in ts) if (ts[k] && ts[k].state === "errored") return id; }
      } catch (e) {}
      return null;
    }
    function barrarTileComErro() {
      var ruim = tileComErro();
      if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou. O quadro sairia com buraco.");
      return !!ruim;
    }
    var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
    // pronto: os tiles do satélite e as fontes da cena carregados, o mapa parado, dois quadros pintados (o molde)
    window.__aguardarMapa = function (teto) {
      teto = teto || 90000;
      return new Promise(function (res) {
        var pronto = function () {
          try {
            if (!mapaCarregado || !map.areTilesLoaded() || map.isMoving()) return false;
            for (var i = 0; i < FONTES.length; i++) if (!map.getSource(FONTES[i]) || !map.isSourceLoaded(FONTES[i])) return false;
            if (!map.getSource("base") || !map.isSourceLoaded("base")) return false;
            return true;
          } catch (e) { return false; }
        };
        var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
        (function tick() {
          barrarTileComErro();
          var ok = pronto(), cheio = false;
          try { cheio = mapaCarregado && map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
          if (!cheio) forcadas = 0;
          if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.triggerRepaint(); }
          if (forcadas < 2 || !pintou) ok = false;
          seguidas = ok ? seguidas + 1 : 0;
          if (window.__erroCena || seguidas >= 2) return res(true);
          if (performance.now() - t0 > teto) {
            window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
            falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo.");
            return res(true);
          }
          setTimeout(tick, 30);
        })();
      });
    };
    // a prova do nível de tile (o molde): o menor nível do satélite que a câmera de t pede
    window.__zMinNaTela = function (t) {
      try {
        if (typeof t === "number") window.__renderAt(t);
        var ts = map.transform.coveringTiles({ tileSize: P.base.tileSize, minzoom: 0, maxzoom: P.base.maxzoom, roundZoom: true, reparseOverscaled: true, terrain: null });
        var m = 99; ts.forEach(function (id) { m = Math.min(m, id.canonical.z); }); return { zmin: m, n: ts.length };
      } catch (e) { return { erro: String(e && e.message) }; }
    };
    return { aplicar: aplicar };
  })();

  // a prontidão: o RIG (as faces da marca e as imagens) e o still decodificado
  var PRONTO_EXTRA = Promise.all([R.prontas()].concat(Array.prototype.map.call(document.querySelectorAll("img"), function (im) {
    return new Promise(function (res, rej) {
      var ok = function () { (im.decode ? im.decode() : Promise.resolve()).then(function () { res(true); }, function () { res(true); }); };
      if (im.complete && im.naturalWidth) ok(); else { im.onload = ok; im.onerror = function () { rej(new Error("a imagem " + im.getAttribute("src") + " não carregou.")); }; }
    });
  }))).then(function () { return true; });
  window.__fotosProntas = PRONTO_EXTRA.then(null, function (e) { falhar(e.message); return true; });

  window.__renderAt = function (t) {
    try {
      t = cl(+t || 0, 0, DUR);
      placa(t);
      return (mapa ? mapa.aplicar(t) : Promise.resolve()) || Promise.resolve();
    } catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); return Promise.resolve(); }
  };
  // só conferência (a prova vem dos quadros): a escala da câmera de P1 e a câmera do mapa
  window.__s55estado = function (t) {
    t = cl(+t || 0, 0, DUR);
    return { escala_p1: +(1 + (S_P1 - 1) * eb(seg(t, 0, T1.camFim))).toFixed(5), camera: window.__cameraAt ? window.__cameraAt(t) : null };
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  placa(0);
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});
})();
