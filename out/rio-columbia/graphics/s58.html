<script>
/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de
   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();
   Lei: a cena é função pura de t. Nada aqui lê relógio, sorteia ou anda sozinho. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};
    const s = (o.base ?? 1.02) + (o.zoom ?? 0.0024) * t;
    const x = (o.ax ?? 6) * Math.sin(t * 0.23), y = (o.ay ?? 4.8) * Math.sin(t * 0.17);
    el.style.transform = "scale(" + s.toFixed(5) + ") translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
  }
  // Vídeo por f(t): posiciona e espera o "seeked". Na galeria (__PREVIEW) não mexe.
  function seekTo(v, tt) {
    if (!v || window.__PREVIEW || v.readyState < 1) return Promise.resolve();
    const d = v.duration; if (d > 0 && isFinite(d)) tt = clamp(tt, 0, Math.max(0, d - 0.001));
    if (Math.abs(v.currentTime - tt) < 1e-4 && !v.seeking) return Promise.resolve();
    return new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.addEventListener("error", r, { once: true }); v.currentTime = tt; });
  }
  // Grão: ruído de semente fixa por quadro (mulberry32). Mesmo t, mesmo grão.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  function grao(cv, t, o) {
    if (!cv || !cv.getContext) return; o = o || {};
    const ctx = cv.getContext("2d"), w = cv.width, h = cv.height;
    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));
    const img = ctx.createImageData(w, h), d = img.data, a = o.alfa ?? 22;
    for (let i = 0; i < d.length; i += 4) { const v = (sorte() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }
    ctx.putImageData(img, 0, 0);
  }
  // Paleta por vídeo: OBJETO de papéis {acento:"#…"}, montado pelo editor-de-arte. O espelho.paleta é
  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }
  function cor(v) { return typeof CSS !== "undefined" && CSS.supports ? CSS.supports("color", v) : /^#[0-9a-f]{3,8}$|^(rgb|hsl)a?\(/i.test(v); }
  function paleta(p) {
    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));
    }
  }
  // Prontidão: <img>, <image> de SVG e TODAS as faces "Marca"/"MarcaSec". Nunca rejeita: o que falhou
  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();
</script>
<script>
// ═══ P3 · O MAPA DA s09 ═══
(function () {
  "use strict";
  // ═══ O NÚCLEO DAS CENAS DE MAPA 2D DO LOTE M1 (rio-columbia-arte-1), copiado da s09 pelo montador do lote EF7 ═══
  // Determinístico: a cena é função de t (nada de Date, Math.random, @keyframes nem flyTo/easeTo: a câmera é jumpTo(cameraAt(t))).
  var E = function (id) { return document.getElementById(id); };
  var cl = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  var eo = function (x) { x = cl(x, 0, 1); return 1 - Math.pow(1 - x, 3); };
  var eio = function (x) { x = cl(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  var seg = function (t, a, d) { return cl((t - a) / d, 0, 1); };
  var my = function (lat) { return Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)); };
  var latDe = function (y) { return (2 * Math.atan(Math.exp(y)) - Math.PI / 2) * 180 / Math.PI; };
  // o voo entre duas poses: o zoom pela fração U, o centro pelo ponto fixo do zoom (a curva em que o alvo não escorrega na tela)
  function voo(a, b, U) {
    var z = a.z + (b.z - a.z) * U, s;
    if (Math.abs(b.z - a.z) < 1e-6) s = U;
    else s = (Math.pow(2, -z) - Math.pow(2, -a.z)) / (Math.pow(2, -b.z) - Math.pow(2, -a.z));
    var ya = my(a.c[1]), yb = my(b.c[1]);
    return { center: [a.c[0] + (b.c[0] - a.c[0]) * s, latDe(ya + (yb - ya) * s)], zoom: z, bearing: 0, pitch: 0 };
  }

  // ═══ TEMPOS (0 = 810,500 s do master): o mapa entra em 16,000 s ('In' 16,020 · 'March' 16,285 · 'paused' 20,495 · 'talks.' 21,020 ·
  //   'August' 22,490 · 'magazine' 24,170 · 'not' 27,130 · 'resumed.' 27,450) ═══
  var DUR = 28.4;    // espelho.json › s58 › dur, literal (roupa §8)
  var T0V = 810.500;
  var MAPA = 16.0;                 // o corte seco da mesa para o mapa (regência b2)
  var CRED_MAPA_DESDE = MAPA;      // o crédito de mapa em todo quadro de mapa, e só nele
  // a P-BACIA exata no corte; a deriva: × 1,040 com o ponto fixo em x 1613 da tela (a conta das margens está no cabeçalho)
  var POSE = { BACIA: { c: [-116.9270, 46.8983], z: 6.0556 }, FIM: { c: [-117.0518, 46.8983], z: 6.1122 } };
  function cameraAt(t) { return voo(POSE.BACIA, POSE.FIM, cl((t - MAPA) / (DUR - MAPA), 0, 1)); }
  var T = { nomes: 16.167, pausa: 20.5, retomada: 24.2 };
  var NOME = { can: [-128.587, 50.523], eua: [-128.766, 47.616] };   // os lugares da s09
  var PAUSA = [-112.91, 51.783];    // o canto de cima à esquerda da pílula: (2300, 370) na P-BACIA (o lugar da s09)
  var RETOMADA = [-112.91, 48.54];  // a 2ª pílula: abaixo da fronteira (o topo em y 850 na P-BACIA); alinhada à esquerda com a 1ª
  var LON = { oeste: -122.758, leste: -103.0, meio: -116.927 };
  var PULSO = { L: LON.meio, b: 0.4 };   // o último estado do pulso da s09: congelado no meio, a 40 %
  var FR;
  function prepararGeo() {
    var f = geo("fronteira-canada-eua"); geo("bacia-columbia-canada"); geo("bacia-columbia-eua");
    if (window.__erroCena) return false;
    FR = f.features[0].geometry.coordinates.slice().sort(function (a, b) { return a[0] - b[0]; });
    return true;
  }
  function camadasDaCena() {
    var lc = { "line-join": "round", "line-cap": "round" };
    return { fontes: { eua: { type: "geojson", data: geo("bacia-columbia-eua") }, can: { type: "geojson", data: geo("bacia-columbia-canada") },
                       fr: { type: "geojson", data: geo("fronteira-canada-eua"), lineMetrics: true } },
      camadas: [
        { id: "eua", type: "fill", source: "eua", paint: { "fill-color": COR.contraparte, "fill-opacity": 0.35 } },
        { id: "can", type: "fill", source: "can", paint: { "fill-color": COR.destaque, "fill-opacity": 0.40 } },
        { id: "fr-sob", type: "line", source: "fr", layout: lc, paint: { "line-gradient": gradFim(COR.sob, 1), "line-opacity": COR.sob[3], "line-width": 17 } },
        { id: "fr", type: "line", source: "fr", layout: lc, paint: { "line-gradient": gradFim(rgbDe(COR.fronteira)), "line-width": 10 } }
      ] };
  }
  function aplicarCamadas() {}
  // a latitude da fronteira numa longitude (a linha do Census é quase o paralelo 49; interpola entre os vértices)
  function latEm(lon) {
    for (var i = 1; i < FR.length; i++) if (FR[i][0] >= lon) { var a = FR[i - 1], b = FR[i], u = (lon - a[0]) / ((b[0] - a[0]) || 1); return a[1] + (b[1] - a[1]) * u; }
    return FR[FR.length - 1][1];
  }
  // O PULSO da s09, CONGELADO: a luz no lugar L (longitude) com meia-largura de 1,6° (≈ 150 px), o miolo aceso e as pontas macias,
  // sobre a fronteira: 26 px de --tinta com 44 px de brilho. Aqui ele não anda nem pulsa: é o ponto em que as conversas pararam.
  window.__pulsoAt = function (t) { return t < MAPA ? null : PULSO; };
  function desenhar(t) {
    if (t < MAPA || !ctx) return;
    var p = PULSO, MEIA = 1.6, N = 40;
    ctx.save(); ctx.lineCap = "round"; ctx.shadowColor = COR.tinta; ctx.shadowBlur = 44;
    for (var i = 0; i < N; i++) {
      var u0 = -1 + 2 * i / N, u1 = -1 + 2 * (i + 1) / N, um = (u0 + u1) / 2;
      var a = Math.max(0, 1 - Math.abs(um)); a = a * a * (3 - 2 * a);
      var l0 = p.L + u0 * MEIA, l1 = p.L + u1 * MEIA;
      if (l1 < LON.oeste || l0 > LON.leste) continue;
      l0 = Math.max(l0, LON.oeste); l1 = Math.min(l1, LON.leste);
      var q0 = map.project([l0, latEm(l0)]), q1 = map.project([l1, latEm(l1)]);
      ctx.globalAlpha = a * p.b; ctx.strokeStyle = COR.tinta; ctx.lineWidth = 26;

  }
  function aplicarTextos(t) {
    var qn = eo(seg(t, T.nomes, 0.3)), qp = eo(seg(t, T.pausa, 0.3)), qr = eo(seg(t, T.retomada, 0.3));
    porPilula(E("nCan"), NOME.can, 0.5, 0.5, 0, 0, qn, (1 - qn) * 24);
    porPilula(E("nEua"), NOME.eua, 0.5, 0.5, 0, 0, qn, (1 - qn) * 24);
    var p1 = E("pausa"), p2 = E("retomada");
    porPilula(p1, PAUSA, 0, 0, 0, 0, qp, (1 - qp) * 24);
    // a 2ª pílula: o canto de cima à esquerda no mesmo meridiano da 1ª (as duas alinhadas à esquerda; ela é 25 px mais estreita)
    porPilula(p2, RETOMADA, 0, 0, 0, 0, qr, (1 - qr) * 24);
    porTexto(E("fonteBC"), qp, 0);
    porTexto(E("fonteCG"), qr, 0);

  window.__duracao = DUR;
  window.__renderAt = function () {};
  window.__prepararCaptura = function () {};
  window.__aguardarMapa = function () { return Promise.resolve(true); };
  window.__fotosProntas = true;
  var resolverPronto, rejeitarPronto;
  window.__ready = new Promise(function (res, rej) { resolverPronto = res; rejeitarPronto = rej; });
  window.__ready.catch(function () {});

    var el = E("erroCena"); if (el) { el.textContent = "CENA COM ERRO — " + msg; el.hidden = false; }
    try { console.error("[cena de mapa] " + msg); } catch (e) {}
    rejeitarPronto(new Error(msg));
  }

  var P = window.__REGIE_MAPA;
  if (typeof maplibregl === "undefined") return falhar("não carregou ../_media/_vendor/maplibre-gl.js. Rode: node <motor>/src/mapa/preparar-cena.mjs <proj>");
  if (!P) return falhar("sem perfil de base (window.__REGIE_MAPA). Rode: node <motor>/src/mapa/preparar-cena.mjs <proj>");
  if (P.nome !== "maptiler") return falhar("a base carregada é '" + P.nome + "', e o vídeo inteiro usa 'maptiler' (canal.json › mapa.perfil).");
  if (P.tipo !== "raster") return falhar("o perfil '" + P.nome + "' não é raster.");
  var chave = null;
  if (P.credencial) {

    if (!chave) return falhar("a base '" + P.nome + "' precisa da chave " + P.credencial + ", que o render da Régie injeta na hora. " +
      "Aberta direto no navegador a cena não tem a chave: use o render da Régie.");
  }
  function geo(slug) {
    var g = (window.__GEO || {})[slug];
    if (!g) falhar("a geometria '" + slug + "' não foi carregada: falta <script src=\"../_media/geo/" + slug + ".js\"> ou o arquivo.");
    return g;

    var m = /^#([0-9a-f]{6})$/i.exec(css);

    if (m) { var v = m[1].split(",").map(Number); return [v[0], v[1], v[2], v.length > 3 ? v[3] : 1]; }
    return [0, 0, 0, 1];

    lapis: 1.895, lapisRapido: 0.8, lapisPara: 9.567,      // "outline." → o lápis corre, rasteja e PARA em "not"
    marco: 6.2, acordo: 6.2, credCRS: 6.2,                 // "agreement"
    naoFinal: 9.567, credHydro: 9.567,                     // "not (been finalized.)"
    camP2: [11.1, 2.47],                                   // a câmera para 0,3 s antes dos nomes (13,867)
    luzP2: [12.655, 0.8],                                  // "includes": a luz desce para baixo do trecho a lápis
    nomes: 13.867, credGAC: 13.867,                        // "three First Nations"
    repouso: MAPA - 0.25
  };

  // ════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
  // A RÉGUA DO TEMPO (peça 3 do conceito) · NASCE AQUI (s08) e volta em s29, s31, s33, s34, s57, s58 e s59.
  // Para reusar: copie este bloco INTEIRO (de "A RÉGUA DO TEMPO" até "FIM DA RÉGUA DO TEMPO"), o CSS .ar, .ar-fina, .sombra-linha,
  // .hachura e .ponto, e o <svg id="desenho"> com <defs id="reguaDefs"> e <g id="regua">. Mude só a VISTA (abaixo) e o que a sua
  // cena acende. Tudo é função de t; nada lê relógio.
  //
  // A ESCALA VERDADEIRA (o arco do conceito): o eixo em y 1180, de x 400 a x 3440; 1964 em x 520, 2024 em x 2600 (34,667 px por
  // ano); 2025, 2026 e 2027 são três fatias de 34,667 px (até x 2704); 2029 em x 2773,3. A vista inteira é reguaVista(REGUA.inteira).
  // A PONTA EM ×8 (s08, s58, s59): 2024 em x 1505 → as fatias com 277,33 px (2025: x 1505–1782,3; 2026: 1782,3–2059,7; 2027:
  // 2059,7–2337), 2029 em x 2891,7; a banda das fatias em y 1080–1280, centrada no eixo.
  // A altura da banda é da vista (não escala com o tempo): na ponta ×8 são 200 px.
  var REGUA = {
    yEixo: 1180,                                              // o eixo da régua, no palco (o mesmo em toda vista)
    x0: 400, x1: 3440,                                        // as pontas do eixo na escala verdadeira
    pxAno: (2600 - 520) / 60,                                 // 34,667 px por ano, na escala verdadeira
    inteira: { k: 1, anoRef: 1964, xRef: 520, y0: 1150, y1: 1210 },    // a régua inteira (a banda de 60 px é sugestão: nenhuma cena deste lote a usa)
    ponta:   { k: 8, anoRef: 2024, xRef: 1505, y0: 1080, y1: 1280 },   // só a ponta, em ×8 (o enquadramento de s08)
    traco: 6,                                                 // --linha-espessura: o traço de engenheiro
    cotaFina: 3,                                              // a linha de cota e a de chamada
    sombra: { larg: 16, dy: 12, op: 0.8 },                    // a sombra solta do traço: cópia em --tinta-escura, sem desfoque
    hachura: { passo: 48, traco: 4, folga: 3 },               // a hachura da FAIXA do corte (peça 1): linhas x + y = c a cada 48 px, 4 px, --destaque
    pontilhado: { passo: 34, raio: 4 }                        // o trecho sem data: pontos de 8 px a cada 34 px
  };
  // a vista: x(ano) no palco. v = { k, anoRef, xRef, y0, y1 }
  function reguaVista(v) {
    var px = REGUA.pxAno * v.k;
    return { k: v.k, pxAno: px, y0: v.y0, y1: v.y1, yEixo: REGUA.yEixo, x: function (ano) { return v.xRef + (ano - v.anoRef) * px; } };
  }
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, pai) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) if (Object.prototype.hasOwnProperty.call(attrs, k)) e.setAttribute(k, attrs[k]);
    if (pai) pai.appendChild(e);
    return e;
  }
  // o contorno de um grupo de fatias vizinhas (anos = [2025, 2026, 2027]: cada fatia vai de x(ano − 1) a x(ano)): o retângulo e as divisas
  function reguaFatiasD(V, anos) {
    var xa = V.x(anos[0] - 1), xb = V.x(anos[anos.length - 1]);
    var d = "M" + f2(xa) + "," + V.y0 + " H" + f2(xb) + " V" + V.y1 + " H" + f2(xa) + " Z";
    for (var i = 0; i < anos.length - 1; i++) d += " M" + f2(V.x(anos[i])) + "," + V.y0 + " V" + V.y1;
    return d;
  }
  // a hachura de UMA fatia (ou de um bloco, de anoA a anoB): devolve { g, clip }: g é o grupo (a opacidade = o brilho) e clip é o
  // <rect> do recorte (a largura = a frente que corre da esquerda para a direita). id = sufixo único no arquivo.
  function reguaHachura(V, anoA, anoB, id, pai, defs) {
    var H = REGUA.hachura, xa = V.x(anoA) + H.folga, xb = V.x(anoB) - H.folga, ya = V.y0 + H.folga, yb = V.y1 - H.folga;
    var cp = el("clipPath", { id: "reguaClip" + id }, defs);
    var rc = el("rect", { x: f2(xa), y: ya, width: 0, height: yb - ya }, cp);
    var g = el("g", { "clip-path": "url(#reguaClip" + id + ")", opacity: 0 }, pai);
    // linhas x + y = c (sobem para a direita), em múltiplos do passo: as fatias vizinhas emendam a hachura sem degrau
    for (var c = Math.ceil((xa + ya) / H.passo) * H.passo; c <= xb + yb; c += H.passo) {
      el("line", { class: "hachura", x1: f2(c - ya), y1: ya, x2: f2(c - yb), y2: yb }, g);
    }
    return { g: g, clip: rc, xa: xa, larg: xb - xa };
  }
  function reguaAcender(h, frente, brilho) {   // frente 0..1 (a hachura correndo), brilho 0..1
    if (!h) return;
    h.clip.setAttribute("width", f2(h.larg * clamp(frente, 0, 1)));
    h.g.setAttribute("opacity", clamp(brilho, 0, 1).toFixed(3));
  }
  // o pontilhado (o trecho sem data): pontos de xa até xb, cada um com a opacidade dele
  function reguaPontos(V, xa, xb, pai) {
    var P = REGUA.pontilhado, lista = [];
    for (var x = xa - P.passo; x <= xb; x += P.passo) lista.push({ x0: x, e: el("circle", { class: "ponto", cx: f2(x), cy: V.yEixo, r: P.raio, opacity: 0 }, pai) });
    return lista;
  }

  // ── a montagem desta cena ──
  // A VISTA: a ponta em ×8 (2024 em x 1505; 2029 em x 2891,7; a banda y 1080–1280)
  var V = reguaVista(REGUA.ponta);
  var XP = V.x(2024), X_ESQ = -400;                        // a ponta dos 60 anos; o bloco sai pelo quadro à esquerda
  var ANO_ESQ = 2024 - (XP - X_ESQ) / V.pxAno;             // o ano que cai em X_ESQ (fora do quadro)
  var XM = V.x(2024 - 67 / 365.25);                        // o marco: 11/07/2024, 67 dias antes da ponta (16/09/2024): x 1454,1
  var LAPIS = { rapido: 375, lento: 375, fim: 760 };       // o trecho a lápis: corre 375 px, rasteja 375 px; os pontos existem até +760
  var gRegua = E("regua"), defs = E("reguaDefs");
  var PECAS = {};
  if (gRegua && defs) {
    var S = REGUA.sombra;
    // 1) as sombras soltas do traço (por baixo de tudo): o bloco (aberto à esquerda) e o marco
    var gS = el("g", { transform: "translate(0," + S.dy + ")", opacity: S.op }, gRegua);
    var dBloco = "M" + X_ESQ + "," + V.y0 + " H" + f2(XP) + " V" + V.y1 + " H" + X_ESQ;
    var dMarco = "M" + f2(XM) + ",1004 V" + (V.y1 + 34);
    el("path", { class: "sombra-linha", d: dBloco }, gS);
    PECAS.marcoS = el("path", { class: "sombra-linha", d: dMarco, pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1, opacity: 0 }, gS);
    // 2) a hachura dos 60 anos, "queimada" (a 40 %: o estado em que a s34 a deixa depois do fim dos anos pagos)
    PECAS.h60 = reguaHachura(V, ANO_ESQ, 2024, "Q60", gRegua, defs);
    reguaAcender(PECAS.h60, 1, 0.4);
    // 3) o traço do bloco, até a ponta
    el("path", { class: "ar", d: dBloco }, gRegua);
    // 4) O TRECHO A LÁPIS: o contorno da banda, depois da ponta, só em pontilhado (--tinta a 50 %), aberto na frente
    var cpL = el("clipPath", { id: "lapisClip" }, defs);
    PECAS.lapisClip = el("rect", { x: f2(XP - 10), y: V.y0 - 20, width: 0, height: V.y1 - V.y0 + 40 }, cpL);
    var gL = el("g", { opacity: 0.5, "clip-path": "url(#lapisClip)" }, gRegua);
    el("path", { class: "lapis", d: "M" + f2(XP + 34) + "," + V.y0 + " H" + f2(XP + LAPIS.fim) }, gL);
    el("path", { class: "lapis", d: "M" + f2(XP + 34) + "," + V.y1 + " H" + f2(XP + LAPIS.fim) }, gL);
    // 4b) A PONTA DO LÁPIS: um ponto cheio (--tinta a 100 %, 14 px) na frente de cada linha, só enquanto o lápis desenha
    PECAS.pontas = [V.y0, V.y1].map(function (y) { return el("circle", { class: "ponto", cx: f2(XP), cy: y, r: 7, opacity: 0 }, gRegua); });
    // 5) o MARCO do acordo: o traço vertical que cruza a banda, logo antes da ponta (desce da cota)
    PECAS.marco = el("path", { class: "ar", d: dMarco, pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1, opacity: 0 }, gRegua);
    // 6) P2: o fio de chamada dos nomes (cota fina), da banda para baixo
    PECAS.fio = el("path", { class: "ar-fina", d: "M1530," + (V.y1 + 24) + " V1776", pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1, opacity: 0 }, gRegua);
  }
  // FIM DA MONTAGEM DA RÉGUA

  // a geometria dos textos (no espaço da câmera)
  var G = {
    acordoCx: XM, acordoY: 884,                             // a cota do marco: centrada sobre ele, acima da banda
    naoX: XP + LAPIS.rapido + LAPIS.lento + 90, naoY: V.yEixo - 64,   // "NOT FINALIZED": à direita da frente parada, na altura do eixo
    nomesX: 1560, nomesY: 1352,                             // os três nomes: sob o trecho a lápis, à direita do fio
    luzP2: [1900, 1420]
  };

  // a frente do lápis: corre (ease-out) e depois rasteja a passo constante, freando nos últimos 15 % até parar em "not"
  function freio(p, a) { var v = 2 / (1 + a); return p <= a ? v * p : v * a + v * (p - a) - v * (p - a) * (p - a) / (2 * (1 - a)); }
  function frente(t) {
    var t1 = T.lapis + T.lapisRapido;
    return XP + LAPIS.rapido * eo(seg(t, T.lapis, T.lapisRapido)) + LAPIS.lento * freio(seg(t, t1, T.lapisPara - t1), 0.85);
  }

  // o TEXTO no espaço da câmera: entra em 300 ms (opacidade + 24 px de subida, ease-out) e fica PARADO; ancora = 0,5 (centrado em x)
  // ou 0 (a borda esquerda em x)
  function texto(id, t, tin, x, y, ancora) {
    var e = E(id); if (!e) return;
    var pi = eo(seg(t, tin, 0.3)), v = t < tin ? 0 : pi;
    e.style.opacity = v.toFixed(3);
    e.style.transform = "translate(" + f2(x) + "px," + f2(y + 24 * (1 - pi)) + "px)" + (ancora ? " translateX(-" + (ancora * 100) + "%)" : "");
  }
  // o crédito: só a opacidade (300 ms), no lugar dele; some no corte
  function credito(id, t, tin) {
    var e = E(id); if (!e) return;
    var v = t >= tin && t < MAPA ? eo(seg(t, tin, 0.3)) : 0;
    e.style.visibility = v > 0.001 ? "visible" : "hidden";
    e.style.opacity = v.toFixed(3);
  }

  // a CÂMERA da mesa (sempre sobre o centro do palco; nunca viaja): 1,00 → 1,04 (P1) → 1,07 (P2); a deriva do RIG congela nos 250 ms
  // antes do corte; o still acompanha a 0,6
  function escalaCam(t) { return 1 + 0.04 * eb(seg(t, T.camP1[0], T.camP1[1])) + 0.03 * eb(seg(t, T.camP2[0], T.camP2[1])); }
  function camera(t) {
    var s = escalaCam(t), td = Math.min(t, T.repouso);
    var dx = 6 * Math.sin(td * 0.23), dy = 4.8 * Math.sin(td * 0.17);
    var c = E("cam");
    if (c) c.style.transform = "scale(" + s.toFixed(5) + ") translate(" + f2(dx) + "px," + f2(dy) + "px)";
    var st = E("still");
    if (st) st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ") translate(" + f2(dx * 0.6) + "px," + f2(dy * 0.6) + "px)";
  }

  // a LUZ da mesa (o véu), 120 ms atrás do que ela segue: atrás da ponta; acompanha a frente do lápis; em P2 desce para os nomes
  function alvoLuz(t) {
    var x = Math.min(frente(t), XP + 560), y = V.yEixo, p = eb(seg(t, T.luzP2[0], T.luzP2[1]));
    return { x: lerp(x, G.luzP2[0], p), y: lerp(y, G.luzP2[1], p) };
  }

  function mesa(t) {
    var me = E("mesaCena"), naMesa = t < MAPA;
    if (me) me.style.visibility = naMesa ? "visible" : "hidden";
    // os créditos da mesa têm visibility PRÓPRIA, e um filho "visible" aparece mesmo com o pai "hidden": cada um é posto no seu
    // estado em TODO quadro, também nos de mapa (de 16,000 s em diante o credito() os apaga). No render contínuo eles ficavam sobre
    // os créditos do mapa (as folhas do render da Sala; o quadro único não mostrava).
    credito("credCRS", t, T.credCRS); credito("credHydro", t, T.credHydro); credito("credGAC", t, T.credGAC);
    if (!naMesa) return;
    camera(t);
    var al = alvoLuz(t - 0.12), lz = E("luz");
    if (lz) { lz.style.setProperty("--luz-x", f2(al.x + 140) + "px"); lz.style.setProperty("--luz-y", f2(al.y + 140) + "px"); }
    // o lápis: o recorte das duas linhas de pontos vai da ponta até a frente
    var fr = frente(t);
    if (PECAS.lapisClip) PECAS.lapisClip.setAttribute("width", f2(Math.max(0, fr - XP + 16)));
    // a ponta do lápis: acende quando ele sai da ponta da régua (0,15 s) e some em 0,5 s quando ele para
    var vp = t < T.lapis ? 0 : eo(seg(t, T.lapis, 0.15)) * (1 - eb(seg(t, T.lapisPara, 0.5)));
    (PECAS.pontas || []).forEach(function (c) { c.setAttribute("cx", f2(fr)); c.setAttribute("opacity", vp.toFixed(3)); });
    // o marco (o traço desce em 0,3 s) e a cota
    var pm = eo(seg(t, T.marco, 0.3));
    [PECAS.marco, PECAS.marcoS].forEach(function (m) { if (m) { m.setAttribute("stroke-dashoffset", (1 - pm).toFixed(4)); m.setAttribute("opacity", t >= T.marco ? 1 : 0); } });
    texto("acordo", t, T.acordo, G.acordoCx, G.acordoY, 0.5);
    // "NOT FINALIZED", onde o contorno continuaria
    texto("naoFinal", t, T.naoFinal, G.naoX, G.naoY, 0);
    // P2: os três nomes e o fio de chamada
    var pf = eo(seg(t, T.nomes, 0.3));
    if (PECAS.fio) { PECAS.fio.setAttribute("stroke-dashoffset", (1 - pf).toFixed(4)); PECAS.fio.setAttribute("opacity", t >= T.nomes ? 1 : 0); }
    texto("nomes", t, T.nomes, G.nomesX, G.nomesY, 0);
  }

  // o __renderAt da cena: a mesa e, depois, o mapa (o do núcleo, que já está em window.__renderAt quando este script roda)
  var renderMapa = window.__renderAt;
  window.__renderAt = function (t) {
    t = clamp(+t || 0, 0, DUR);
    try { mesa(t); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = "mesa: " + String(e && e.message); }   // nunca lança
    try { if (typeof renderMapa === "function") renderMapa(t); } catch (e2) {}
  };
  window.__fotosProntas = R.prontas().then(function () { window.__renderAt(0); return true; });
  // só conferência: a geometria da peça nesta cena (a prova vem dos quadros e do DOM, não daqui)
  window.__regua = { x2024: XP, xMarco: XM, xLapisPara: XP + LAPIS.rapido + LAPIS.lento, x2029: V.x(2029), y0: V.y0, y1: V.y1, yEixo: V.yEixo };
  window.__frenteLapis = frente;
  window.__renderAt(0);
})();
</script>
