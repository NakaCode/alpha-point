<script>
/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de
   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();
   Lei: a cena é função pura de t. Nada aqui lê relógio, sorteia ou anda sozinho. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};
    const s = (o.base ?? 1.02) + (o.zoom ?? 0.0024) * t;
    const x = (o.ax ?? 6) * Math.sin(t * 0.23), y = (o.ay ?? 4.8) * Math.sin(t * 0.17);
    el.style.transform = "scale(" + s.toFixed(5) + ") translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
  }
  // Vídeo por f(t): posiciona e espera o "seeked". Na galeria (__PREVIEW) não mexe.
  function seekTo(v, tt) {
    if (!v || window.__PREVIEW || v.readyState < 1) return Promise.resolve();
    const d = v.duration; if (d > 0 && isFinite(d)) tt = clamp(tt, 0, Math.max(0, d - 0.001));
    if (Math.abs(v.currentTime - tt) < 1e-4 && !v.seeking) return Promise.resolve();
    return new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.addEventListener("error", r, { once: true }); v.currentTime = tt; });
  }
  // Grão: ruído de semente fixa por quadro (mulberry32). Mesmo t, mesmo grão.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  function grao(cv, t, o) {
    if (!cv || !cv.getContext) return; o = o || {};
    const ctx = cv.getContext("2d"), w = cv.width, h = cv.height;
    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));
    const img = ctx.createImageData(w, h), d = img.data, a = o.alfa ?? 22;
    for (let i = 0; i < d.length; i += 4) { const v = (sorte() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }
    ctx.putImageData(img, 0, 0);
  }
  // Paleta por vídeo: OBJETO de papéis {acento:"#…"}, montado pelo editor-de-arte. O espelho.paleta é
  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }
  function cor(v) { return typeof CSS !== "undefined" && CSS.supports ? CSS.supports("color", v) : /^#[0-9a-f]{3,8}$|^(rgb|hsl)a?\(/i.test(v); }
  function paleta(p) {
    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));
    }
  }
  // Prontidão: <img>, <image> de SVG e TODAS as faces "Marca"/"MarcaSec". Nunca rejeita: o que falhou
  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();

  // o que fica FIXO no palco (pílulas sobre a foto, a legenda): entra em 300 ms (opacidade + 24 px), some no corte
  function fixo(id, t, tin, tfim, x, y) {
    var e = E(id); if (!e) return;
    var on = t >= tin && t < tfim, pi = eo(seg(t, tin, 0.3));
    e.style.visibility = on ? "visible" : "hidden";
    e.style.opacity = on ? pi.toFixed(3) : "0";
    e.style.transform = "translate(" + f2(x) + "px," + f2(y + 24 * (1 - pi)) + "px)";
  }
  // o crédito: só a opacidade (300 ms), no lugar dele; some no corte (tfim) ou sai em 200 ms (tsai)
  function credito(id, t, tin, tfim, tsai, curva) {
    var e = E(id); if (!e) return;
    var on = t >= tin && t < tfim, v = on ? (curva || eo)(seg(t, tin, 0.3)) * (tsai == null ? 1 : 1 - eb(seg(t, tsai, 0.2))) : 0;
    e.style.visibility = v > 0.001 ? "visible" : "hidden";
    e.style.opacity = v.toFixed(3);
  }

  // ── a CÂMERA (sempre sobre o centro do palco; nunca viaja): P1 1,00 → 1,06; P3 → 1,07; P4 → 1,082; a deriva do RIG congela nos
  //    250 ms antes de cada corte; o still acompanha a 0,6 ──
  function escalaCam(t) {
    return 1 + 0.06 * eo(seg(t, 0, T.camP1)) + 0.01 * eb(seg(t, T.camP3[0], T.camP3[1])) + 0.012 * eb(seg(t, T.camP4[0], T.camP4[1]));
  }
  function camera(t) {
    var s = escalaCam(t), td = t < T.p2 ? Math.min(t, T.repousoP1) : Math.min(t, T.repouso);
    var dx = 6 * Math.sin(td * 0.23), dy = 4.8 * Math.sin(td * 0.17);
    var c = E("cam");
    if (c) c.style.transform = "scale(" + s.toFixed(5) + ") translate(" + f2(dx) + "px," + f2(dy) + "px)";
    var st = E("still");
    if (st) st.style.transform = "scale(" + (1 + (s - 1) * 0.6).toFixed(5) + ") translate(" + f2(dx * 0.6) + "px," + f2(dy * 0.6) + "px)";
  }

  // ── A FOLHA na mesa (identidade §4.4 e §5; os números da s26): desce 420 px em 0,80 s, −1,5° → +1,2°, assenta 1,03 → 1,00 ──
  function folhaEm(tl) {   // tl = t − T.folha
    var u = seg(tl, 0, 0.8), desce = 420 * (1 - eo(u)), rot = -1.5 + 2.7 * eo(u);
    var ua = seg(tl, 0.8 - 0.24, 0.24), esc = u < 1 - 0.24 / 0.8 ? 1.03 : 1.03 - 0.03 * eo(ua);
    return { y: -desce, rot: rot, esc: esc, u: u };
  }
  var FITAS = [{ id: "fitaA", lado: -1, rot: -6, t: 0.8 }, { id: "fitaB", lado: 1, rot: 5, t: 0.92 }];
  var FOLHA_H = 1040;
  function girar(x, y, graus) { var a = graus * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; }
  function aplicarFolha(t) {
    var fo = E("folha"), so = E("folhaSombra"), tl = t - T.folha, on = tl >= 0;
    var f = folhaEm(tl), vf = on ? eo(seg(tl, 0, 0.2)) : 0;
    if (fo) { fo.style.opacity = vf.toFixed(3); fo.style.transform = "translate(-50%,-50%) translateY(" + f2(f.y) + "px) rotate(" + f.rot.toFixed(3) + "deg) scale(" + f.esc.toFixed(4) + ")"; }
    if (so) {   // a sombra solta: no ar +64 px, 1,05, 0,35; assentada +12 px, 1,00, 0,80 (o desfoque é fixo)
      var ar = eo(f.u), dy = 64 + (12 - 64) * ar, sc = 1.05 + (1 - 1.05) * ar, op = 0.35 + (0.80 - 0.35) * ar;
      so.style.opacity = (op * vf).toFixed(3);
      so.style.transform = "translate(-50%,-50%) translateY(" + f2(f.y + dy) + "px) rotate(" + f.rot.toFixed(3) + "deg) scale(" + (sc * f.esc).toFixed(4) + ")";
    }
    // as fitas colam nos cantos de cima da folha assentada (300 ms), montadas sobre a borda
    FITAS.forEach(function (x) {
      var e = E(x.id); if (!e) return;
      var v = on ? eo(seg(tl, x.t, 0.3)) : 0, p = girar(x.lado * (2960 / 2 - 360), -FOLHA_H / 2 + 8, 1.2);
      e.style.opacity = (0.62 * v).toFixed(3);
      e.style.transform = "translate(" + f2(G.folha.cx + p[0] - 230) + "px," + f2(G.folha.cy + p[1] - 66) + "px) rotate(" + x.rot + "deg) scale(" + (1.06 - 0.06 * v).toFixed(4) + ")";
    });
    return f;
  }

  // ── a LUZ da mesa (o véu), 120 ms atrás do que ela segue ──
  function alvoLuz(t) {
    if (t < T.p3) {   // P1: atrás da janela da vez (a conta), e fica na terceira
      return { x: CENTROS[0] + (CENTROS[1] - CENTROS[0]) * eb(seg(t, T.conta[1] - 0.05, 0.25)) + (CENTROS[2] - CENTROS[1]) * eb(seg(t, T.conta[2] - 0.05, 0.25)), y: V.yEixo };
    }
    var x3 = CENTROS[2] + DX_P3, xp = PECAS.xCasa4 + DX_P3;
    var x = x3 + (xp - x3) * eb(seg(t, T.lei1 - 0.05, 0.6)), y = V.yEixo;      // P3: da terceira janela para a persiana em "Senate"
    if (t >= T.folha) {   // P4: a luz volta ao centro da mesa (0,6 s) e segue a folha
      var p = eb(seg(t, T.folha, 0.6)), f = folhaEm(t - T.folha);
      x = x + (G.folha.cx - x) * p; y = y + (G.folha.cy + f.y - y) * p;
    }
    return { x: x, y: y };
  }

  // ── o KEN BURNS COM DIREÇÃO da foto (regência: 1,00 → 1,08 rumo à ala do Senado): linear do corte ao corte; a origem no frontão
  //    (o ponto 3050, 1500 do arquivo = 2443, 1201,5 na tela); a janela anda 80 px para a direita = a foto anda 80 px para a esquerda ──
  var KB = { escala: 0.08, vetor: 80, ox: 3050 * 3840 / 4794, oy: 1500 * 3840 / 4794 };
  function kenBurns(t) {
    var p = clamp((t - T.p2) / (T.p3 - T.p2), 0, 1);
    return { s: 1 + KB.escala * p, dx: -KB.vetor * p };
  }

  function cena(t) {
    var emP2 = t >= T.p2 && t < T.p3, emP3 = t >= T.p3, emP4 = t >= T.p4;
    camera(t);
    // P2: a foto cobre a mesa (corte seco na entrada e na saída)
    var fb = E("fotoBox"), cam = E("cam");
    if (fb) fb.style.visibility = emP2 ? "visible" : "hidden";
    if (cam) cam.style.visibility = emP2 ? "hidden" : "visible";
    var fc = E("fotoCap"), kb = kenBurns(t);
    if (fc) { fc.style.transformOrigin = f2(KB.ox) + "px " + f2(KB.oy) + "px"; fc.style.transform = "translate(" + f2(kb.dx) + "px,0px) scale(" + kb.s.toFixed(5) + ")"; }
    var rc = E("rotCap"), hc = rc ? rc.offsetHeight : 176, cl = E("cotaLei"), wl = cl ? cl.offsetWidth : 2330;
    fixo("rotCap", t, T.rotCap, T.p3, 200, 160);
    fixo("avisoCap", t, T.avisoCap, T.p3, 200, 160 + hc + 16);
    fixo("cotaLei", t, T.cotaLei, T.p3, COTA_LEI.direita - wl, COTA_LEI.y);
    credito("credFoto", t, T.credFoto, T.p3);
    credito("credLei", t, T.credLei, T.p3);

    // a luz da mesa
    var al = alvoLuz(t - 0.12), lz = E("luz");
    if (lz) { lz.style.setProperty("--luz-x", f2(al.x + 140) + "px"); lz.style.setProperty("--luz-y", f2(al.y + 140) + "px"); }

    // A RÉGUA: a vista (P3: 500 px à esquerda) e o LEVANTAR em P4 (350 ms: 1,00 → 1,04 em ease-in cúbico; some nos últimos 200 ms)
    var dxv = emP3 ? DX_P3 : 0, pl = seg(t, T.saiRegua, 0.35), lev = pl * pl * pl;
    if (gLev) {
      var cxr = (XA + PECAS.xFantasma) / 2 + dxv, cyr = V.yEixo, k = 1 + 0.04 * lev;
      gLev.setAttribute("transform", "translate(" + f2(dxv + cxr * (1 - k) - dxv * (1 - k)) + "," + f2(cyr * (1 - k)) + ") scale(" + k.toFixed(4) + ")");
      gLev.setAttribute("opacity", (1 - seg(t, T.saiRegua + 0.15, 0.2)).toFixed(3));
    }
    if (PECAS.som) {   // a sombra solta do traço cresce no levantar: +12 → +64 px, 0,80 → 0,35
      PECAS.som.setAttribute("transform", "translate(0," + f2(lerp(REGUA.sombra.dy, 64, lev)) + ")");
      PECAS.som.setAttribute("opacity", lerp(REGUA.sombra.op, 0.35, lev).toFixed(3));
    }
    // as três janelas: a persiana abre (P1) e fica aberta; a faixa: 45 % → a conta acende → as duas primeiras caem
    PECAS.jan.forEach(function (m, i) {
      var abre = eb(seg(t, T.abre[i], T.abreDur)), yb = persianaY(1 - abre);
      persianaPor(m.pers, 1 - abre);
      m.recorte.setAttribute("y", f2(yb + 3)); m.recorte.setAttribute("height", f2(Math.max(0, V.y1 - yb - 6)));
      var b = 0.45 + 0.55 * eo(seg(t, T.conta[i], T.contaDur));
      if (i < 2) b -= 0.55 * eb(seg(t, T.terceira, 0.4));
      m.faixa.setAttribute("opacity", clamp(b, 0, 1).toFixed(3));
    });
    // o toco de pontos depois de 2027 (só P1): some para a direita em 620 px e escorre devagar (14 px/s), como no fim da s08
    var anda = 14 * Math.min(t, T.repousoP1);
    PECAS.pontos.forEach(function (p) {
      var x = p.x0 + anda, u = (x - XB) / 620;
      p.e.setAttribute("cx", f2(x));
      p.e.setAttribute("opacity", (emP3 ? 0 : clamp((x - XB - 8) / 18, 0, 1) * clamp(1 - u, 0, 1)).toFixed(3));
    });
    // P1: o bloco (as duas partes), a linha de cota e os anos; somem no corte para a foto
    var p1 = t < T.p2;
    texto("tres", p1 ? t : -1, T.tres1, null, G.tresCx, G.tres1Y, true);
    texto("tres2", p1 ? t : -1, T.tres2, null, G.tresCx, G.tres2Y, true);
    texto("anos", p1 ? t : -1, T.anos, null, G.anosCx, G.anosY);
    if (PECAS.cotaTres) PECAS.cotaTres.setAttribute("opacity", (p1 ? eo(seg(t, T.tres1, 0.3)) : 0).toFixed(3));
    credito("credNota1", t, T.credNota1, T.p2);

    // P3: a 4ª casa e a persiana que desce; o lápis (a seta e o fantasma); o bloco e os anos
    var v4 = emP3 ? 1 : 0;
    if (PECAS.casa4) PECAS.casa4.setAttribute("opacity", v4);
    if (PECAS.casa4S) PECAS.casa4S.setAttribute("opacity", v4);
    persianaPor(PECAS.pers4, emP3 ? eb(seg(t, T.persiana, T.persianaDur)) : 0);
    if (PECAS.setaClip) PECAS.setaClip.setAttribute("width", f2(PECAS.seta.larg * eb(seg(t, T.seta[0], T.seta[1]))));
    if (PECAS.fantasma) PECAS.fantasma.setAttribute("opacity", eo(seg(t, T.fantasma, 0.3)).toFixed(3));
    var tl3 = emP3 ? t : -1;
    texto("lei1", tl3, T.lei1, T.saiRegua, G.leiCx, G.lei1Y, true);
    texto("lei2", tl3, T.lei2, T.saiRegua, G.leiCx, G.lei2Y, true);
    texto("anos2", tl3, T.anos2, T.saiRegua, ANOS2_X, G.anos2Y);
    credito("cred4949", t, T.cred4949, T.saiRegua + 0.2, T.saiRegua);

    // P4: a folha pousa; a legenda fora dela (a pílula que cresce); a anotação com a chave
    aplicarFolha(t);
    // "IN FORCE" e a fonte dele entram no t0 do redator (20,433 s, a palavra "in"), com a entrada de sempre (300 ms, ease-out)
    var vg = E("vigor"), v2 = E("vigor2w"), q2 = eo(seg(t, T.vigor2, 0.3));
    if (v2) { v2.style.height = f2(VIGOR_L2 * q2) + "px"; v2.style.opacity = q2.toFixed(3); }
    fixo("vigor", t, T.vigor1, DUR + 1, 200, VIGOR_Y);
    credito("credTexto", t, T.credTexto, DUR + 1);
    credito("credNota2", t, T.credNota2, DUR + 1);
    // a anotação (como na s43): a chave entra em 300 ms (opacidade) e a pílula com ela (opacidade + 24 px de subida); ficam até o corte
    var pn = t >= T.nota ? eo(seg(t, T.nota, 0.3)) : 0, as = E("anotSvg"), np = E("nota");
    if (as) as.style.opacity = pn.toFixed(3);
    if (np) { np.style.opacity = pn.toFixed(3); np.style.visibility = pn > 0.001 ? "visible" : "hidden"; np.style.transform = "translate(0px," + f2(24 * (1 - pn)) + "px)"; }
  }

  // as medidas que dependem das faces (feitas quando as fontes carregam): os anos sob as casas, a altura da 2ª linha da legenda, a
  // altura da folha (a sombra)
  var ANOS2_X = 0, VIGOR_L2 = 92.4, VIGOR_Y = 1622;
  // a pílula do dado sobre a foto: DUAS linhas, no céu entre a estátua da cúpula e o telhado da ala do Senado (medido nos quadros: a
  // estátua acaba em x 1283 na entrada, 11,13 s; o telhado, no fim do plano, está em y 568 na coluna x 3160). A 1ª linha é
  // "AUTHORITY EXPIRES" (as 17 primeiras letras do texto do redator); a largura da pílula é a dela, e a data cai sozinha na 2ª.
  var COTA_LEI = { direita: 3160, y: 160, letras1: 17 };
  function quebrarCota() {
    var e = E("cotaLei"); if (!e || !e.firstChild) return false;
    e.style.width = "";
    var rg = document.createRange(); rg.setStart(e.firstChild, 0); rg.setEnd(e.firstChild, COTA_LEI.letras1);
    var w = rg.getBoundingClientRect().width, cs = getComputedStyle(e);
    if (!(w > 0)) return false;
    e.style.boxSizing = "border-box";
    e.style.width = f2(Math.ceil(w) + 6 + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight)) + "px";
    return true;
  }
  function medir() {
    var ok = true;
    if (!quebrarCota()) ok = false;
    if (!ajustarAnos("anos", CASA, 4)) ok = false;
    var w4 = ajustarAnos("anos2", 2 * CASA, 2);
    if (!w4) ok = false;
    // "2027 · 2029": o 1º ano centrado sob a 4ª casa, o 2º sob o fantasma (o texto é centrado: translateX(-50%))
    ANOS2_X = (PECAS.xCasa4 + PECAS.xFantasma) / 2 + DX_P3;
    var v2 = E("vigor2"), vg = E("vigor");
    if (v2 && v2.offsetHeight) VIGOR_L2 = v2.offsetHeight;
    if (vg) { var l1 = E("vigor1"); VIGOR_Y = 1840 - (32 + (l1 ? l1.offsetHeight : 92.4) + VIGOR_L2); }   // a pílula inteira acaba em y 1840 (40 px acima da faixa do crédito)
    var fo = E("folha"), so = E("folhaSombra");
    if (fo && fo.offsetHeight) { FOLHA_H = fo.offsetHeight; if (so) so.style.height = FOLHA_H + "px"; }
    if (!montarAnot()) ok = false;
    return ok;
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; window.__ultimoErroRender = String(e && e.message); }   // nunca lança
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  var docFaces = (document.fonts && document.fonts.load)
    ? Promise.all([document.fonts.load("400 86px MarcaDoc"), document.fonts.load("700 84px MarcaDoc")]).then(function () { return true; }, function () { return true; })
    : Promise.resolve(true);
  window.__fotosProntas = Promise.all([R.prontas(), docFaces]).then(function () {
    try { if (!medir()) window.__erroCena = "os textos da régua não puderam ser medidos"; } catch (e) { window.__erroCena = "medir: " + e; }
    window.__renderAt(0); return true;
  });
  // só conferência: a geometria da peça nesta cena (a prova vem dos quadros e do DOM, não daqui)
  window.__regua = { x2024: XA, x2027: XB, x31ago2027: X4, x31ago2029: X4 + 2 * CASA, casa: CASA, dxP3: DX_P3, y0: V.y0, y1: V.y1, yEixo: V.yEixo };
  window.__renderAt(0);
  try { medir(); window.__renderAt(0); } catch (e) {}
})();
