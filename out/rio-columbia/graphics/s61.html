  have reached Portland stays up in the valley instead, behind a dam in British Columbia, and goes down later, a little at a time."

    12,600–13,000 o ARROW em --destaque a 85 % entra com a água até o meio (a hachura da FAIXA, a de cima, vazia).
    13,033       "Portland" [421] (rótulo, a pílula da marca, à esquerda do ponto de Portland em --contraparte, longe do rio).
    13,573–14,573 em 'stays' o lago INCHA: a água sobe até o alto e cobre a hachura da faixa (a faixa ocupada).

  O ÚLTIMO QUADRO: o Arrow cheio com o anel, a barragem, o rio até Portland com o último pulso chegando, o rótulo e o crédito do mapa.
