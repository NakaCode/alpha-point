/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de
   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();
   Lei: a cena é função pura de t. Nada aqui lê relógio, sorteia ou anda sozinho. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};
    const s = (o.base ?? 1.02) + (o.zoom ?? 0.0024) * t;
    const x = (o.ax ?? 6) * Math.sin(t * 0.23), y = (o.ay ?? 4.8) * Math.sin(t * 0.17);
    el.style.transform = "scale(" + s.toFixed(5) + ") translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px)";
  }
  // Vídeo por f(t): posiciona e espera o "seeked". Na galeria (__PREVIEW) não mexe.
  function seekTo(v, tt) {
    if (!v || window.__PREVIEW || v.readyState < 1) return Promise.resolve();
    const d = v.duration; if (d > 0 && isFinite(d)) tt = clamp(tt, 0, Math.max(0, d - 0.001));
    if (Math.abs(v.currentTime - tt) < 1e-4 && !v.seeking) return Promise.resolve();
    return new Promise((r) => { v.addEventListener("seeked", r, { once: true }); v.addEventListener("error", r, { once: true }); v.currentTime = tt; });
  }
  // Grão: ruído de semente fixa por quadro (mulberry32). Mesmo t, mesmo grão.
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  function grao(cv, t, o) {
    if (!cv || !cv.getContext) return; o = o || {};
    const ctx = cv.getContext("2d"), w = cv.width, h = cv.height;
    const sorte = mulberry32((o.semente ?? 7) * 100003 + Math.round(t * (o.fps ?? 30)));
    const img = ctx.createImageData(w, h), d = img.data, a = o.alfa ?? 22;
    for (let i = 0; i < d.length; i += 4) { const v = (sorte() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = a; }
    ctx.putImageData(img, 0, 0);
  }
  // Paleta por vídeo: OBJETO de papéis {acento:"#…"}, montado pelo editor-de-arte. O espelho.paleta é
  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }
  function cor(v) { return typeof CSS !== "undefined" && CSS.supports ? CSS.supports("color", v) : /^#[0-9a-f]{3,8}$|^(rgb|hsl)a?\(/i.test(v); }
  function paleta(p) {
    if (p == null) return;
    if (typeof p !== "object" || Array.isArray(p)) return aviso("esperava um objeto {papel:cor}; veio " + (typeof p === "string" ? "texto (a prosa do espelho?)" : typeof p) + " e nada foi aplicado");
    for (const k in p) {
      if (!/^[a-z][a-z0-9-]*$/.test(k)) aviso("papel \"" + k + "\" ignorado (nome inválido)");
      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");
      else document.documentElement.style.setProperty("--" + k, String(p[k]));
    }
  }
  // Prontidão: <img>, <image> de SVG e TODAS as faces "Marca"/"MarcaSec". Nunca rejeita: o que falhou
  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });
    const faces = [];
    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();

    ponto: 0.15,                    // o ponto acende quando a linha passa por ele (cheio em 0,40, antes do fio)
    nasceu: 0.05, americano: 0.17,  // os dois t0 0, com 120 ms entre um e outro
    fio: 0.44, fioDur: 0.96,        // "born" (0,44) → "didn't" (1,40): o fio sobe e PARA
    falta: 1.45, faltaDur: 0.40,    // o tracejado do que falta, logo depois da parada
    entrada: 0.30,
    camPara: DUR - 0.25             // 3,95: o repouso
  };

  // ── a GEOMETRIA (px do palco) ──
  var CX = 1920, CHAO_Y = 1420, CHAO_X0 = 640, CHAO_X1 = 3200;
  var PONTO_R = 22;
  var BASE_FIO = CHAO_Y - PONTO_R;          // 1398: o fio sai do alto do ponto
  var ALVO_Y = 560;                         // logo abaixo de "AN AMERICAN" (texto em 230→530)
  var CURSO = (BASE_FIO - ALVO_Y) / 2;      // 419: a meia altura
  var OLHAL_R = 18;

  // a hachura de chão (desenho técnico): riscos a 45° sob a linha, de 40 em 40 px
  (function () {
    var g = E("hachura"); if (!g) return;
    for (var x = CHAO_X0 + 20; x <= CHAO_X1 - 40; x += 40) {
      var l = document.createElementNS(SVGNS, "line");
      l.setAttribute("class", "fina");
      l.setAttribute("x1", x); l.setAttribute("y1", CHAO_Y + 6);
      l.setAttribute("x2", x - 34); l.setAttribute("y2", CHAO_Y + 40);
      l.setAttribute("data-x", x);
      g.appendChild(l);
    }
  })();
  var RISCOS = [].slice.call(document.querySelectorAll("#hachura line"));

  // os textos no lugar: "AN AMERICAN" no alto, centrado; "BORN IN BALBOA" sob a linha do chão, centrado no ponto
  var POS = { americano: { cx: CX, top: 230 }, nasceu: { cx: CX, top: 1530 } };
  Object.keys(POS).forEach(function (k) { var e = E(k); if (e) { e.style.left = POS[k].cx + "px"; e.style.top = POS[k].top + "px"; } });

  // ── os movimentos (funções puras de t; um executor por transformação) ──
  // O FIO: extrusão empurrada a desaceleração constante, parada no fim do curso: comprimento = CURSO · (1 − (1 − p)²)
  function fio(t) { var p = seg(t, T.fio, T.fioDur); return clamp(CURSO * (1 - (1 - p) * (1 - p)), 0, CURSO); }
  function texto(el, t, t0) {
    if (!el) return;
    var p = eo(seg(t, t0, T.entrada));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translate(-50%," + ((1 - p) * 24).toFixed(1) + "px)";
  }
  function olhalPath(cx, cyBase) {        // o olhal aberto na ponta: um anel com uma abertura de 60°, voltado para cima-direita
    var cy = cyBase - OLHAL_R, a0 = -60 * Math.PI / 180, a1 = 240 * Math.PI / 180;
    var x0 = cx + OLHAL_R * Math.cos(a0), y0 = cy + OLHAL_R * Math.sin(a0);
    var x1 = cx + OLHAL_R * Math.cos(a1), y1 = cy + OLHAL_R * Math.sin(a1);
    return "M" + x0.toFixed(2) + " " + y0.toFixed(2) + " A" + OLHAL_R + " " + OLHAL_R + " 0 1 1 " + x1.toFixed(2) + " " + y1.toFixed(2);
  }
  function luzAlvo(t) { var L = fio(t); return { x: CX, y: (CHAO_Y + (BASE_FIO - L)) / 2 - 80 }; }

  function cena(t) {
    t = t + 0.0005;   // meio milissegundo: os tempos da regência são quadros arredondados a 3 casas
    // a câmera: o push-in do RIG (base 1,0, 0,0024/s) que para no repouso; a deriva senoidal (6 / 4,8 px) continua
    var camEl = E("cam"), st = E("still");
    var s = 1 + 0.0024 * Math.min(t, T.camPara), dx = 6 * Math.sin(t * 0.23), dy = 4.8 * Math.sin(t * 0.17);
    if (camEl) camEl.style.transform = "scale(" + s.toFixed(5) + ") translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
    if (st) { var PAR = 0.6, ss = 1 + (s - 1) * PAR; st.style.transform = "scale(" + ss.toFixed(5) + ") translate(" + (dx * PAR).toFixed(2) + "px," + (dy * PAR).toFixed(2) + "px)"; }
    // a luz, 120 ms atrás do objeto principal (#luz tem 160 px de sangria: a coordenada do gradiente soma 160)
    var Lz = luzAlvo(t - 0.12), luz = E("luz");
    if (luz) { luz.style.setProperty("--luz-x", (Lz.x + 160).toFixed(1) + "px"); luz.style.setProperty("--luz-y", (Lz.y + 160).toFixed(1) + "px"); }

    // a linha do chão: do centro para as pontas; a hachura acompanha a linha
    var pc = eo(seg(t, T.chao, T.chaoDur));
    var x0 = lerp(CX, CHAO_X0, pc), x1 = lerp(CX, CHAO_X1, pc);
    var cl = E("chaoLinha");
    if (cl) { cl.setAttribute("x1", x0.toFixed(2)); cl.setAttribute("x2", x1.toFixed(2)); cl.style.opacity = t >= T.chao ? 1 : 0; }
    RISCOS.forEach(function (l) { var x = +l.getAttribute("data-x"); l.style.opacity = (x - 34 >= x0 - 1 && x <= x1 + 1) ? "" : "0"; });
    var sc = E("sombraChao");
    if (sc) { sc.setAttribute("d", "M" + (x0 + 10).toFixed(2) + " " + (CHAO_Y + 12) + " L" + (x1 + 10).toFixed(2) + " " + (CHAO_Y + 12)); sc.style.opacity = (0.44 * pc).toFixed(3); }

    // o ponto de nascimento
    var pp = eo(seg(t, T.ponto, 0.25)), po = E("ponto");
    if (po) { po.setAttribute("opacity", pp.toFixed(3)); po.setAttribute("r", (PONTO_R * lerp(0.6, 1, pp)).toFixed(2)); }

    // o fio, a ponta e a sombra
    var L = fio(t), topo = BASE_FIO - L, fi = E("fio");
    if (fi) { fi.setAttribute("y2", topo.toFixed(2)); fi.style.opacity = L > 0.5 ? 1 : 0; }
    var ol = E("olhal");
    if (ol) { ol.setAttribute("d", olhalPath(CX, topo)); ol.setAttribute("opacity", L > 0.5 ? 1 : 0); }
    var sf = E("sombraFio");
    if (sf) { sf.setAttribute("d", L > 0.5 ? "M" + (CX + 10) + " " + (BASE_FIO + 12) + " L" + (CX + 10) + " " + (topo - 2 * OLHAL_R + 12).toFixed(2) : ""); sf.style.opacity = (L > 0.5 ? 0.44 : 0).toFixed(3); }

    // o tracejado do que falta: sobe da ponta até "AN AMERICAN", depois da parada
    var pf = eo(seg(t, T.falta, T.faltaDur)), fa = E("falta");
    if (fa) {
      var y0 = BASE_FIO - CURSO - 2 * OLHAL_R - 14, y1 = lerp(y0, ALVO_Y, pf);
      fa.setAttribute("y1", y0.toFixed(2)); fa.setAttribute("y2", y1.toFixed(2));
      fa.setAttribute("opacity", (t >= T.falta ? 0.5 : 0).toFixed(3));
    }

    texto(E("nasceu"), t, T.nasceu);
    texto(E("americano"), t, T.americano);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança: uma exceção mataria a captura
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
  // O GANCHO DE MEDIDA (só leitura; a prova do contato vem do DOM, não da fórmula): o vão entre a base do fio e o alto do ponto,
  // e a altura da ponta acima do chão, em px de tela, depois de desenhar o instante t
  window.__s05peca = function (t) {
    t = clamp(+t || 0, 0, DUR); window.__renderAt(t);
    var rp = E("ponto") ? E("ponto").getBoundingClientRect() : null, rf = E("fio") ? E("fio").getBoundingClientRect() : null;
    var esc = 1 + 0.0024 * Math.min(t + 0.0005, T.camPara);
    // a caixa de um elemento SVG no Chrome é a da geometria (sem o traço): o alto do círculo e o pé da linha
    var vaoBase = rp && rf && rf.height > 0 ? rp.top - rf.bottom : null;
    return { t: t, vaoBasePontoPx: vaoBase, alturaFioTelaPx: rf ? rf.height : null, alturaFioPalcoPx: rf ? rf.height / esc : null,
             cursoFormulaPx: fio(t + 0.0005), parado: t + 0.0005 >= T.fio + T.fioDur };
  };
})();
</script>
