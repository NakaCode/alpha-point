<!--
CANAL ALPHA POINT — ZONA DO CANAL (vídeo 3), CENA s11 (78,6 → 95,2 s do master; 16,6 s). SHOWPIECE.
  "Its second article granted the United States, "in perpetuity," a band ten miles wide, five on each side of the planned
  canal, to build, run and protect it. Panama City, the capital, and Colón sat inside those limits, and the same article
  left them out."
  Mapista, lote M1 (tarefa zona-do-canal-arte-1), 15/10/2026. Nasceu de preparar-cena.mjs zona-do-canal --molde=s11; o corpo
  comum é o do lote M1 de Los Angeles (aprovado), com o tratamento C da base (identidade §6). Gerado por
  out/zona-do-canal/_tmp/art/arte-1/M1/gerar.mjs; o HTML é autocontido. Sem relevo 3D.
  O que manda: textos-tela.json (s11, com o _pedidos_a_montante: '5 MILES' sem km, 'Panama City' sem 'THE CAPITAL') para o
  QUE e a grafia; regencia.json (s11) para o TEMPO; o conceito para a direção; a marca.

  O que a cena faz (o mapa nunca para: giro contínuo de −1,5° a +1,5° e deriva/aproximação lenta entre as viagens):
    · b1 (0–3,7): o istmo inteiro; o eixo do canal (eixo-do-canal, OSM) se desenha do Caribe ao Pacífico (0,2–1,8 s), como
      linha d'água escura de borda clara; em '"in' (2,42) a legenda '"in perpetuity" · to build, run and protect the
      canal' (sempre com a finalidade, R01) e a linha de fonte 'Source: Isthmian Canal Convention, 1903, Art. II' (até 10,533).
    · b2 (3,7–10,533): em 'ten' (4,233) as duas bordas do esquema (faixa-art2-5mi-mar3mn desde a arte-3: o buffer de 8.046,72 m do eixo do OSM, até 3 mn no mar)
      se afastam do eixo em 1,5 s: cada vértice da borda anda do seu ponto mais próximo no eixo até a posição real, o que
      desenha a faixa de 0 a 5 milhas sem forma inventada; a legenda 'Art. II, 1903 treaty (schematic)' na mesma palavra
      (o esquema se declara); em 'five' (5,6) as duas cotas '5 MILES', com a linha de cota do eixo até cada borda, num
      ponto do eixo (OSM, o vértice 80, no Corte, entre Pedro Miguel e Gamboa) onde a normal de 8.046,72 m cai na borda do
      buffer (conferido: a ponta fica a 1,0000 e a 0,9953 do raio, ~1 px); os dois '5 MILES' por fora de cada borda; o corredor se preenche em --destaque a 85 % (500 ms).
    · b3 (10,533–12,5): a câmera desce até a ponta do Pacífico (9,95–11,6 s); o preenchimento recua de 85 % a 0 (a
      faixa continua com as bordas: são os limites); a linha junto a Panama City (linha-1914-panama, sem ano: textos-tela
      › nao_vai_para_tela) se desenha do mar para o norte em 'Panama' e a pílula 'Panama City' fica do lado de FORA (leste)
      dela, sem polígono (pergunta 15, caminho (a)).
    · b4 (12,5–16,6): viagem de 1,75 s até a ponta do Atlântico, em quadro largo (zoom 12,3–12,4: 60 × 33 km, sem close de
      Colón); a divisa da folha de 1947 junto a Colón (divisa-zona-1947 › H-colon) se desenha, 'Colón' do lado de fora e a
      legenda 'Boundary as mapped in 1947'.
  DESVIOS DECLARADOS (vão ao relato):
    · sem o RECORTE das cidades no preenchimento: não há geometria que feche o recorte (a linha de Panama City para no Río
      Curundú, longe da borda da faixa; a de Colón tem 1,8 km), e fechar à mão seria geografia inventada (ofício §2 e §6c).
      O "recuo" é o preenchimento inteiro baixando; o que diz "de fora" é a linha com o nome do outro lado.
    · sem o anel nas cidades: Panama City não tem ponto no disco (caminho (a): "só a linha"), e Colón fica igual a ela.
    · Colón, a linha de 1947 e a legenda entram em 13,4–13,6 s, não em 12,5 ('Colón'): o Panama City precisa de 2,0 s no ar
      (10,533 → 12,55) antes de a câmera sair, e em 12,5 Colón ainda está a 60 km, fora do quadro.
  ELEMENTOS (teto 6): b2 = eixo, faixa, legenda "in perpetuity" (bloco), 2 cotas (5) + o aviso '(schematic)'; b3 = faixa,
  eixo, linha, pílula (4); b4 = faixa, eixo, linha, pílula (4) + os avisos de data. Avisos de esquema e de data contam como o
  aviso do ano (não contam).
  CRÉDITOS: '© MapTiler © OpenStreetMap contributors' a 56 px a cena toda (data-qc-credito="mapa" só nele; cumpre o OSM do
  eixo, da faixa, da linha-1914-panama e dos pontos-osm-atlantico); 'Source: Isthmian Canal Convention, 1903, Art. II' de
  2,4 a 10,533, sem a marca de mapa (o qc-tamanho cobra 72 dele: exceção de crédito, identidade §4.1).
  NÃO VAI: '(8 km)', '(16 km)', '10 MILES WIDE', 'THE CAPITAL', '1914' na linha.
  RODADA arte-3 (mapista, lote Ma, 15/10/2026): (1) a faixa passa a faixa-art2-5mi-mar3mn (o Art. II até 3 milhas náuticas
  mar adentro nas duas pontas, pauta-geo, r5): a península de Panama City (Casco Viejo, El Chorrillo) fica DENTRO dos limites,
  como a fala diz ("sat inside those limits"); na abertura, os vértices do trecho no mar saem da ponta do eixo do OSM; (2) a
  água escura (agua-osm-zona, identidade §6), 2ª camada do estilo em --agua-base; ela escurece também o canal abaixo das
  eclusas, que o OSM conta como mar (fica: é a costa real do OSM, e recortá-la seria geometria inventada); (3) a série dos
  mapas: as cotas '5 MILES' passam de 84 px (cota) a pílula de rótulo de 128 px, e "the line" (linha-1914-panama) vai em
  --destaque, 10 sobre 22 px, como na s20. (4) Consequência da faixa nova: a borda leste passa agora a leste da península, e a
  pílula 'Panama City' de uma linha (830 px) caía sobre ela; a pílula vai em duas linhas ('Panama' / 'City'), presa a um ponto
  no mar a leste da linha e dentro da faixa, e o pouso do Pacífico fica mais perto (zoom 12,6 → 13,15–13,22) para caber entre a
  linha e a borda; a viagem até lá passa a 8,9–10,5 s (era 9,95–11,6), para a pílula entrar em 'Panama' com a câmera parada, e as
  cotas '5 MILES' saem em 8,9 (eram 9,95; ficam 3,3 s no ar). (5) A borda leste da faixa nova passa também sob a pílula 'Colón':
  ela vai para cima da cidade, no mar, entre o eixo e a borda (a ~100 px de cada), e o pouso do Atlântico fecha de 12,3–12,4 a
  12,55–12,65 (cerca de 50 × 28 km, ainda quadro largo, sem close de Colón). (6) As cotas a 128 px afastam-se 140 px da borda (eram
  44) e 40 px no sentido dela, para a pílula não encostar na linha; o istmo abre 0,08 de zoom mais largo, para caber a faixa mais
  longa.
  RODADA zona-do-canal-arte-5 (mapista, lote M-c, 15/10/2026; Decisão 11 da Sala, laudo s11): (1) o traço da divisa de 1947
  junto a Colón (divisa-zona-1947 › H-colon) passa à linguagem de "the line": --destaque, 10 sobre 22 px, como a linha de
  Panama City; antes era branco 8 sobre 20, colado aos cais, e se lia como cais. A legenda 'Boundary as mapped in 1947' não
  muda (palavra e lugar). (2) A pílula 'Colón' entra em 13,4 s (era 13,6): o laudo pedia ~13,1, mas a viagem (12,25–14,0) ainda traz a cidade
  de cima da margem do topo (em 13,3 a pílula está a −27 px; portao-margens, arte-5); em 13,4 ela já está dentro, presa ao
  lugar. O resto (a linha de 1947 em 13,4, a legenda em 13,6, os desvios do arte-3) fica.
  RODADA zona-do-canal-arte-7 (mapista, lote M4, 15/10/2026; qualidade-2, L20): a emenda do mosaico de satélite no lago Gatún
  (a lâmina verde-clara de borda reta ao sul das eclusas, de 14,5 s ao fim) sai do quadro pela câmera: o pouso do Atlântico
  (Q2a/Q2b) sobe 0,060° de latitude (~6,7 km; ~510 px a z 12,55), com o mesmo zoom, a mesma longitude e os mesmos tempos.
  A água do OSM do projeto (agua-osm-zona) não cobre o lago (é o polígono de mar do osmdata; conferido ponto a ponto), e
  geometria nova é da pesquisa-geo. Colón, a linha de 1947, as bordas da faixa e o eixo saindo ao mar ficam no quadro; as
  eclusas de Gatún saem pela margem de baixo. 'Colón' continua em 13,4 s (Decisão da Sala, arte-5). Textos: nenhum muda.
  RODADA zona-do-canal-arte-10 (mapista, lote MA, 15/10/2026; espectador r1, achado da s11 em t 14: "a exclusão das cidades
  ('left them out') não se lê"): de 14,6 s ('and the same article', depois de 'inside those limits') ao fim, uma aproximação
  lenta (van Wijk, 2,0 s, rampa de 0,45 na entrada e 0,35 na saída) do quadro largo do Atlântico até a divisa de 1947 junto a
  Colón (divisa-zona-1947 › H-colon), em zoom 14,05: o traço chega a ~400 px no palco 4K (~200 px no 1080p, como a linha de
  Panama City em 10,5–12,5 s), com a pílula 'Colón' do lado de fora dele (a nordeste, sobre a cidade), sem mudar o ponto
  dela. 'left them out' (15,58–16,6) cai com a câmera chegando. De 14,0 a 14,6 a deriva lenta do quadro largo continua (Q2a → Q2c, o mesmo caminho da Q2b de antes).
  O centro final (−79,858; 9,357): o traço fica a x ~500–860 e a pílula a x ~1090–1530 (palco 4K), e a borda leste da faixa
  fica em x ~2200, À ESQUERDA dos avisos do canto de cima ('(schematic)' e 'as mapped in 1947', x ≥ 2470), do começo ao fim da
  aproximação (conta da câmera a cada 0,1 s, _tmp/arte-10/MA/simcam.cjs, conferida contra o render). Os dois primeiros
  centros tentados atravessavam os avisos: em −79,900 a borda pousava atrás deles; em −79,9274 passava por trás deles de
  15,5 a 16,1 s. A borda oeste sai pela esquerda; a do norte, por cima.
  Sem geometria nova, sem polígono, sem palavra nova, sem t0 de texto mudado; a emenda do Gatún (arte-7) continua fora do
  quadro (a borda de baixo só sobe na aproximação). O giro contínuo de −1,5° a +1,5° continua até o último quadro.

      g.globalAlpha = op; g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "low";
      g.drawImage(TL.x2, 0, 0, W * 2, H * 2, x0, y0, W, H);
    }
    g.globalAlpha = 1;
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { try { pintarTextoLiso(); } catch (e) {} });

  // ── o ANEL (identidade §4.4), com o halo escuro do piloto (s03): 56 px, traço 10 px, dois pulsos 1 → 1,8 em 1,2 s ──
  function criarAnel(id, halo) {
    var g = svgEl("g", { id: id, "class": "anel", opacity: "0" }, E("ov"));
    [1, 2].forEach(function (k) {
      var gp = svgEl("g", { id: id + "Pulso" + k, opacity: "0" }, g);
      if (halo) svgEl("circle", { "class": "halo", cx: 0, cy: 0, r: 28, "stroke-width": 30 }, gp);
      svgEl("circle", { cx: 0, cy: 0, r: 28, "stroke-width": 10 }, gp);
    });
    if (halo) svgEl("circle", { "class": "halo", cx: 0, cy: 0, r: 28, "stroke-width": 30 }, g);
    svgEl("circle", { cx: 0, cy: 0, r: 28, "stroke-width": 10 }, g);
    return g;
  }
  function aplicarAnel(id, ll, t, entra, sai, pulsos) {
    var g = E(id); if (!g || !ll) return;
    var pa = map.project(ll);
    var v = eo(seg(t, entra, 0.3)) * (sai != null ? 1 - eio(seg(t, sai, 0.3)) : 1);
    g.setAttribute("transform", "translate(" + pa.x.toFixed(2) + " " + pa.y.toFixed(2) + ")");
    g.setAttribute("opacity", v.toFixed(3));
    (pulsos || [entra, entra + 1.4]).forEach(function (t0, k) {
      var u = (t - t0) / 1.2, c = E(id + "Pulso" + (k + 1));
      if (!c) return;
      var vivo = u >= 0 && u < 1;
      c.setAttribute("transform", "scale(" + (1 + 0.8 * (vivo ? u : 0)).toFixed(4) + ")");
      c.setAttribute("opacity", vivo ? (1 - u).toFixed(3) : "0");
    });
    return pa;
  }

  // ── a MINIATURA (Juneau s15, 5ª leva): logo abaixo da etiqueta, borda direita alinhada; a foto só encolhe ──
  function montarMini(M) {
    var el = E(M.id), jan = el && el.querySelector(".janela"), im = el && el.querySelector("img"), av = el && el.querySelector(".aviso");
    if (!el || !jan || !im) return falhar("a miniatura " + M.id + " não está no palco.");
    var esc = M.foto[0] / M.recorte[2];
    if (Math.abs(M.foto[1] / M.recorte[3] - esc) > 0.01) falhar("a miniatura " + M.id + " distorceria a foto (as escalas dos dois lados diferem).");
    if (esc > 1) falhar("a miniatura " + M.id + " ampliaria a foto (" + esc.toFixed(3) + "×): a foto só encolhe.");
    var w = M.foto[0] + 2 * M.borda, h = M.borda + M.foto[1] + M.margemBaixo;
    el.style.width = w + "px"; el.style.height = h + "px";
    jan.style.left = M.borda + "px"; jan.style.top = M.borda + "px"; jan.style.width = M.foto[0] + "px"; jan.style.height = M.foto[1] + "px";
    im.style.width = (M.natural[0] * esc) + "px"; im.style.height = (M.natural[1] * esc) + "px";
    im.style.left = (-M.recorte[0] * esc) + "px"; im.style.top = (-M.recorte[1] * esc) + "px";
    if (av) av.style.top = (M.borda + M.foto[1] + (M.margemBaixo - 84) / 2 + 4) + "px";
    M.w = w; M.h = h; M.escala = esc;
  }
  function aplicarMini(M, t) {
    var el = E(M.id), r = rotuloPorId(M.sob); if (!el || !r) return;
    var vin = eo(seg(t, M.entra, 0.3)), v = vin * (1 - eio(seg(t, M.sai, 0.3)));
    var pill = E(M.sob), pr = pill.getBoundingClientRect(), cr = E("palco").getBoundingClientRect(), k = cr.width / 3840 || 1;
    var direita = (pr.right - cr.left) / k, base = (pr.bottom - cr.top) / k - (1 - (r._v || 0)) * 0;
    el.style.opacity = v.toFixed(3); el.style.visibility = v > 0 ? "visible" : "hidden";
    el.style.transform = "translate(" + (direita - M.w).toFixed(3) + "px," + (base + M.vao + (1 - vin) * 24).toFixed(3) + "px)";
  }

  // ── a legenda das cores: um item por linha, cada um entra com a sua linha; a caixa cresce ──────────
  function aplicarLegenda(t) {
    var L = CENA.legenda, box = E("legenda"); if (!L || !box) return;
    var vsai = L.sai != null ? 1 - eio(seg(t, L.sai, 0.3)) : 1, alt = 32, algum = 0, n = 0;
    L.itens.forEach(function (it) {
      var el = E(it.id); if (!el) return;
      var vin = eo(seg(t, it.entra, 0.3)), vout = it.sai != null ? 1 - eio(seg(t, it.sai, 0.3)) : 1, v = vin * vout;
      el.style.opacity = v.toFixed(3); el.style.display = v > 0 ? "flex" : "none";
      if (v > 0) { alt += (n ? 12 : 0) + 101; n++; algum = Math.max(algum, v); }
    });
    box.style.height = alt + "px";
    box.style.opacity = (algum * vsai).toFixed(3);
    box.style.visibility = algum * vsai > 0 ? "visible" : "hidden";
  }

  // ── os créditos: o da MapTiler inteiro desde o primeiro quadro de mapa; as linhas de fonte, empilhadas acima,
  //    entram em 300 ms com o asset ou o número e saem com ele ───────────────────────────────────────
  function aplicarCreditos(t) {
    var c = E("credito");
    if (c) { var vm = t >= (CENA.creditos.mapaDesde || 0) ? 1 : 0; c.style.opacity = vm; c.style.visibility = vm ? "visible" : "hidden"; }
    (CENA.creditos.extra || []).forEach(function (x) {
      var el = E(x.id); if (!el) return;
      var v = eo(seg(t, x.entra, 0.3)) * (x.sai != null ? 1 - eio(seg(t, x.sai, 0.3)) : 1);
      el.style.opacity = v.toFixed(3); el.style.visibility = v > 0 ? "visible" : "hidden";
    });
  }

  function aplicar(t) {
    if (!mapaCarregado) return;
    map.jumpTo(cameraAt(t));
    aplicarCena(t);
    aplicarRotulos(t);
    (CENA.minis || []).forEach(function (M) { aplicarMini(M, t); });
    aplicarLegenda(t);
    aplicarCreditos(t);
    pintarTextoLiso();
  }
  (CENA.minis || []).forEach(montarMini);
  if (window.__erroCena) return;

  window.__renderAt = function (t) {
    var tt = cl(+t || 0, 0, DUR), extra = null;
    try { aplicar(tt); if (typeof depoisDoQuadro === "function") extra = depoisDoQuadro(tt); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // NUNCA lança
    return extra && typeof extra.then === "function" ? extra.then(function () { return true; }, function () { return true; }) : undefined;
  };

  // pronto quando nenhum tile da base está carregando e os níveis à vista são no máximo dois, vizinhos (s42/s03)
  function nivelUnico() {
    try {
      if (map.getTerrain() || map.getPitch() > 1) return true;
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      var cache = sc.base; if (!cache) return true;
      var todos = cache._tiles || {};
      for (var k in todos) { var st = todos[k] && todos[k].state; if (st === "loading" || st === "reloading") return false; }
      var ids = cache.getRenderableIds ? cache.getRenderableIds() : Object.keys(todos);
      var zs = ids.map(function (id) { var x = todos[id]; return x && x.tileID && x.tileID.canonical ? x.tileID.canonical.z : null; })
        .filter(function (z) { return z !== null; });
      if (!zs.length) return false;
      return Math.max.apply(null, zs) - Math.min.apply(null, zs) <= 1;
    } catch (e) { return true; }
  }
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) {
        var ts = (sc[id] && sc[id]._tiles) || {};
        for (var k in ts) if (ts[k] && ts[k].state === "errored") return id;
      }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou (HTTP 404 ou resposta inválida). O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          // getSource antes de isSourceLoaded: este, numa fonte que ainda não existe (antes do load), dispara o evento de erro do
          // MapLibre ("There is no source with ID"), que a cena trata como erro (o medir-margens o achou na s05, 08/10)
          for (var i = 0; i < CENA.fontes.length; i++) if (!map.getSource(CENA.fontes[i]) || !map.isSourceLoaded(CENA.fontes[i])) return false;
          if (!map.getSource("base") || !map.isSourceLoaded("base")) return false;
          return nivelUnico();
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.jumpTo({ center: map.getCenter() }); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo; se repetir, confira a conexão.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});

})();
</script>
