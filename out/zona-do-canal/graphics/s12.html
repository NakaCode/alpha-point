  window.__fotosProntas = Promise.all([
    R.prontas(),
    (document.fonts && document.fonts.load) ? document.fonts.load('400 86px "MarcaDoc"').then(function () { return 0; }, function () { return 0; }) : 0
  ]).then(function () { return true; });
  window.__renderAt(0);
})();
</script>
