  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {
    if (!el) return; o = o || {};

  function prontas(familia) {

    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });

    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }

<script>
(function () {
  "use strict";

  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo, eb = R.eb;
  var E = function (id) { return document.getElementById(id); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };

  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";
    if (op !== undefined) el.style.opacity = clamp(op, 0, 1).toFixed(3);
  }
  // o pouso da FOTO (identidade §4.4): desce 240 px em eo; escala 0,72 → 1,03 até 0,33 s e assenta 1,03 → 1,00 até 0,55 s
  function pousoFoto(t, t0, dur) {
    var p = eo(seg(t, t0, dur)), q1 = eo(seg(t, t0, 0.33)), q2 = eo(seg(t, t0 + 0.33, dur - 0.33));
    return { op: t >= t0 ? 1 : 0, dy: 240 * (1 - p), k: q2 > 0 ? lerp(1.03, 1.00, q2) : lerp(0.72, 1.03, q1), p: p };
  }
  // o pouso do CARTÃO (como o da s20 de Los Angeles): desce 120 px em eo; escala 0,88 → 1,03 até 0,33 s e assenta até 0,55 s
  function pousoDes(t, t0, dur) {
    var p = eo(seg(t, t0, dur)), q1 = eo(seg(t, t0, 0.33)), q2 = eo(seg(t, t0 + 0.33, dur - 0.33));
    return { op: t >= t0 ? 1 : 0, dy: 120 * (1 - p), k: q2 > 0 ? lerp(1.03, 1.00, q2) : lerp(0.88, 1.03, q1), p: p };
  }
  // a sombra solta: no ar +64 px / 1,05 / 0,35; assentada +12 px / 1,00 / 0,80 (tokens "A mão que arruma")
  function sombra(el, g, s, rot) {
    if (!el) return;
    var sy = lerp(64, 12, s.p), sk = lerp(1.05, 1.00, s.p), so = lerp(0.35, 0.80, s.p) * s.op;
    por(el, g.cx, g.cy - s.dy + sy, g.w, g.h, rot, sk, so);
  }
  // o texto: entra em 300 ms (opacidade + 24 px de subida); sai em 300 ms (opacidade + 24 px para baixo)
  function texto(el, t, t0, tSai) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3)), q = tSai !== undefined ? eo(seg(t, tSai, 0.3)) : 0;
    el.style.opacity = (p * (1 - q)).toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * 24 + q * 24).toFixed(1) + "px)";
  }
  function fita(el, t, t0) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    var rot = /Fe$/.test(el.id) ? -5 : 4;
    el.style.transform = "translateY(" + ((1 - p) * -40).toFixed(1) + "px) rotate(" + rot + "deg) scale(" + (1 + (1 - p) * 0.08).toFixed(4) + ")";
  }
  // a CÂMERA: estados {t0, t1, s, cx, cy} com movimentos curtos (eb)
  function camEstado(CAM, t) {
    var a = CAM[0], s = a.s, cx = a.cx, cy = a.cy;
    for (var i = 1; i < CAM.length; i++) {
      var m = CAM[i]; if (t < m.t0) break;
      var p = eb(seg(t, m.t0, m.t1 - m.t0));

    }

  }
  function aplicarCamera(c, t, luz) {
    var camEl = E("cam"), st = E("still");
    var td = Math.min(t, (window.__duracao || 1e9) - 0.25);   // a deriva congela nos últimos 250 ms: repouso de verdade (identidade §4.4)
    var dx = 6 * Math.sin(td * 0.23) + (1920 - c.cx), dy = 4.8 * Math.sin(td * 0.17) + (1080 - c.cy);
    if (camEl) camEl.style.transform = "scale(" + c.s.toFixed(5) + ") translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
    // o still, quando houver, acompanha a câmera a --mesa-satelite-paralaxe (0,6)
    if (st) { var PAR = 0.6, ss = 1 + (c.s - 1) * PAR; st.style.transform = "scale(" + ss.toFixed(5) + ") translate(" + (dx * PAR).toFixed(2) + "px," + (dy * PAR).toFixed(2) + "px)"; }

  }

  var DUR = 7.167;
  window.__duracao = DUR;
  if (E("still")) E("palco").classList.add("com-still");   // o modo "satélite sob a luz" liga sozinho quando o still existir

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia final é do redator-de-tela: textos-tela.json s23) ═══════════════
  var TEXTOS = {
    lugar: "Cristóbal",                                                             // _textos_por_cena s23 › rotulo, t0 0 (no máximo isto)
    aviso: "Photos from 1909",                                                      // _textos_por_cena s23 › aviso_ano, t0 1,37 (UM para as duas fotos; texto-10)
    fala:  "“labor force of West Indians (known as silver roll force)”",            // _textos_por_cena s23 › citacao, t0 3,9 (em "silver")
    atrib: "Annual report, 1920",                                                   // _textos_por_cena s23 › legenda, t0 3,9
    cred:  "Source: Annual Report of the Governor of the Panama Canal, 1920"        // _textos_por_cena s23 › credito, t0 3,9
  };
  // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════

  E("atrib").textContent = TEXTOS.atrib;
  // o cartão em 5 linhas (as quebras são só \n, white-space: pre): "“labor force" / "of West" / "Indians (known" / "as silver" / "roll force)”"
  E("fala").textContent = TEXTOS.fala.replace(" of West", "\nof West").replace(" Indians", "\nIndians").replace(" as silver", "\nas silver").replace(" roll", "\nroll");
  // o crédito em duas linhas: "Source: Annual Report of the Governor of the" / "Panama Canal, 1940" (a quebra é só \n, pre-line)
  E("cred").textContent = TEXTOS.cred.replace(" Panama", "\nPanama");

  // ── os tempos (locais, −208,833), do words.json, da regência e dos textos de tela s23 ──
  var T = {
    pousaE: 0.00, pousaD: 0.67, pousaDur: 0.55,   // a 84-E pousa (0 → 0,55); a 84-D 120 ms depois (0,67 → 1,22)
    fitaE: 0.45, fitaD: 1.12,
    lugar: 0.70, avisoE: 1.37,                    // o rótulo 150 ms depois do assentamento da 84-E; o aviso ÚNICO 150 ms depois do da 84-D (t0 1,37, texto-10)
    fala: 3.907, falaDur: 0.55,                   // "silver" (212,74 s): o cartão da fala pousa na palavra
    atrib: 4.60,                                  // a atribuição, 150 ms depois do assentamento do cartão
    cred: 3.907,                                  // o crédito entra com o cartão (300 ms) e fica
    luzFala: 3.907, luzVolta: 5.437,              // a luz vai ao cartão em "silver" e volta às fotos em "West" (214,27 s)
    camPara: DUR - 0.25

  var CAM = [
    { t0: 0.00, s: 1.000, cx: 1920, cy: 1080 },
    { t0: 0.60, t1: 6.00, s: 1.018, cx: 1920, cy: 1060 }   // o push-in da mesa, rumo às pessoas (sobe de leve); para 1,17 s antes do fim
  ];
  // ── a geometria (os grupos, com o centro no palco e a inclinação assentada) ──
  var GE = { w: 739, h: 829, cx: 1240, cy: 910, rot: 1.2 };     // a 84-E, atrás, à direita: x ~870→1618, y ~496→1324
  var GD = { w: 724, h: 818, cx: 680, cy: 880, rot: -1.5 };     // a 84-D, na frente, à esquerda: x ~318→1042, y ~471→1289 (cobre ~23 % da 84-E, o galpão)
  var FALA = { w: 1942, h: 1412, cx: 2585, cy: 1000, rot: -0.6 }; // o cartão: x ~1614→3556, y ~294→1706 (cobre só ~5 px da moldura da 84-E)
  var FOTOS = { x: 960, y: 900 };                                 // o meio do par, para onde a luz volta

  function alvoLuz(t) {
    var u1 = eb(seg(t, T.luzFala, 0.6)), u2 = eb(seg(t, T.luzVolta, 0.6));
    var x = lerp(GD.cx, FALA.cx, u1), y = lerp(GD.cy, FALA.cy, u1);
    return { x: lerp(x, FOTOS.x, u2), y: lerp(y, FOTOS.y, u2) };
  }
  function cena(t) {
    t = t + 0.0005;
    var c = camEstado(CAM, Math.min(t, T.camPara));
    aplicarCamera(c, t, alvoLuz(t - 0.12));   // a luz 120 ms atrás

    var a = pousoFoto(t, T.pousaE, T.pousaDur), rotE = lerp(-2, GE.rot, a.p);
    sombra(E("eSombra"), GE, a, rotE);

    fita(E("eFe"), t, T.fitaE); fita(E("eFd"), t, T.fitaE + 0.12);

    var b = pousoFoto(t, T.pousaD, T.pousaDur), rotD = lerp(-2, GD.rot, b.p);
    sombra(E("dSombra"), GD, b, rotD);
    por(E("d"), GD.cx, GD.cy - b.dy, GD.w, GD.h, rotD, b.k, b.op);
    fita(E("dFe"), t, T.fitaD); fita(E("dFd"), t, T.fitaD + 0.12);

    texto(E("avisoE"), t, T.avisoE);

    var f = pousoDes(t, T.fala, T.falaDur), rotF = lerp(FALA.rot - 0.7, FALA.rot, f.p);
    sombra(E("falaSombra"), FALA, f, rotF);
    por(E("fala"), FALA.cx, FALA.cy - f.dy, FALA.w, FALA.h, rotF, f.k, f.op);

  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
})();
