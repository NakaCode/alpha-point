<script>
/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.
   Portado de top10-estudio/knowledge/dourados/README.md:28-49 (commit 4afda124) e do gancho de
   prontidão de agent-core/agentes/editor-de-arte/CONTRATO.md:120-129.
   ONDE MORA: no motor, src/cena/_rig.js; no canal, templates-cena/_rig.js (o create-regie copia).
   COMO ENTRA NA CENA (out/<proj>/graphics/<id>.html): o editor-de-arte COPIA este arquivo inteiro
   num <script> antes do script da cena: ela fica autossuficiente, e o carimbo do render (sha1 do
   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e
   o tokens.css; o que faltar vai para window.__fontesFaltando, que o render reprova.
   Uso: const {clamp,seg,eo,eb,win,camera,seekTo,laco,grao}=RIG; window.__fotosProntas=RIG.prontas();
   Lei: a cena é função pura de t. Nada aqui lê relógio, sorteia ou anda sozinho. */
(function () {
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const seg = (t, a, d) => clamp((t - a) / d, 0, 1);                       // rampa 0→1 a partir de a, duração d
  const eo = (p) => 1 - Math.pow(1 - p, 3);                                 // ease-out cúbico
  const eb = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // ease-in-out
  const win = (t, s, di, e, dout) => Math.min(seg(t, s, di), 1 - seg(t, e, dout)); // entra em s, sai em e
  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.
  function camera(el, t, o) {

  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }

    const img = ctx.createImageData(w, h), d = img.data, a = o.alfa ?? 22;

  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.
  function aviso(m) { (window.__avisos = window.__avisos || []).push("RIG.paleta: " + m); }

    for (const k in p) {

      else if (!cor(String(p[k]))) aviso("--" + k + " ignorado: \"" + p[k] + "\" não é cor");

  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {
    familia = familia || "Marca";
    const falta = (window.__fontesFaltando = []);
    // complete=true já basta: imagem quebrada também fica "complete", o evento dela já passou, e
    // esperá-lo segurava a prontidão até o teto do render. Quem reprova imagem quebrada é o gate de mídia.
    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;
      const im = new Image(); im.src = new URL(h, document.baseURI).href; return im.decode().then(() => 0, () => 0);
    });

    if (document.fonts) document.fonts.forEach((f) => { const n = f.family.replace(/["']/g, ""); if (n === familia || n === familia + "Sec") faces.push(f); });
    // tokens.css ausente cai AQUI: no file:// o <link> que falhou ainda tem .sheet, e só a falta de face o denuncia
    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }
  window.RIG = Object.freeze({ clamp, seg, eo, eb, win, laco, camera, seekTo, mulberry32, grao, paleta, prontas });
})();

<script>
(function () {
  "use strict";

  var R = window.RIG, clamp = R.clamp, seg = R.seg, eo = R.eo, eb = R.eb;
  var E = function (id) { return document.getElementById(id); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };
  var ein = function (p) { return p * p * p; };   // o ease-in cúbico do LEVANTAR (identidade §4.4): a única curva fora de eo/eb

  function por(el, cx, cy, w, h, rot, s, op) {
    if (!el) return;
    el.style.transform = "translate(" + (cx - w / 2).toFixed(2) + "px," + (cy - h / 2).toFixed(2) + "px) rotate(" +
      rot.toFixed(3) + "deg) scale(" + s.toFixed(5) + ")";

  }
  // o pouso da FOTO (identidade §4.4): desce 240 px em eo; escala 0,72 → 1,03 até 0,33 s e assenta 1,03 → 1,00 até 0,55 s
  function pousoFoto(t, t0, dur) {
    var p = eo(seg(t, t0, dur)), q1 = eo(seg(t, t0, 0.33)), q2 = eo(seg(t, t0 + 0.33, dur - 0.33));
    return { op: t >= t0 ? 1 : 0, dy: 240 * (1 - p), k: q2 > 0 ? lerp(1.03, 1.00, q2) : lerp(0.72, 1.03, q1), p: p };
  }
  // o pouso da FOLHA (identidade §4.4): desce 420 px em 0,80 s, girando de −1,5° ao repouso, e assenta 1,03 → 1,00 em 0,56–0,80 s
  // (desce: a folha alta desce menos que 420 px para o cabeçalho não sair pelo topo do quadro no pouso, como a s24 deste vídeo)
  function pousoFolha(t, t0, dur, desce) {
    var p = eo(seg(t, t0, dur)), q2 = eo(seg(t, t0 + 0.56, dur - 0.56));
    return { op: t >= t0 ? 1 : 0, dy: (desce || 420) * (1 - p), k: lerp(1.03, 1.00, q2), p: p };
  }
  // o pouso do CARTÃO da fala (como a s23): desce 120 px; escala 0,88 → 1,03 até 0,33 s e assenta 1,03 → 1,00 até 0,55 s
  function pousoDes(t, t0, dur, desce) {
    var p = eo(seg(t, t0, dur)), q1 = eo(seg(t, t0, 0.33)), q2 = eo(seg(t, t0 + 0.33, dur - 0.33));
    return { op: t >= t0 ? 1 : 0, dy: (desce || 120) * (1 - p), k: q2 > 0 ? lerp(1.03, 1.00, q2) : lerp(0.88, 1.03, q1), p: p };
  }
  // já ASSENTADO desde o primeiro quadro (s33: "from the first frame"): sem pouso
  function assentado(t, t0, dur) { return { op: 1, dy: 0, k: 1, p: 1 }; }
  // o LEVANTAR (identidade §4.4; tokens --mov-levantar 0,35 s): devolve {k, op, sy, sk, so} do objeto e da sombra solta
  function levantar(t, t0, dur) {
    var p = ein(seg(t, t0, dur)), op = 1 - seg(t, t0 + dur - 0.20, 0.20);
    return { k: 1 + 0.04 * p, op: op, sy: lerp(12, 64, p), sk: lerp(1.00, 1.05, p), so: lerp(0.80, 0.35, p) * op };
  }
  // a sombra solta: no ar +64 px / 1,05 / 0,35; assentada +12 px / 1,00 / 0,80 (tokens "A mão que arruma")
  function sombra(el, g, s, rot) {
    if (!el) return;
    var sy = lerp(64, 12, s.p), sk = lerp(1.05, 1.00, s.p), so = lerp(0.35, 0.80, s.p) * s.op;

  // um objeto da mesa: pousa (foto, folha ou cartão), fica e, se tLev vier, levanta

  // diz também 1,04 → 1,00 na entrada

    var dx = 6 * Math.sin(td * 0.23) + (1920 - c.cx), dy = 4.8 * Math.sin(td * 0.17) + (1080 - c.cy);
    if (camEl) camEl.style.transform = "scale(" + c.s.toFixed(5) + ") translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
    // o still, quando houver, acompanha a câmera a --mesa-satelite-paralaxe (0,6)
    if (st) { var PAR = 0.6, ss = 1 + (c.s - 1) * PAR; st.style.transform = "scale(" + ss.toFixed(5) + ") translate(" + (dx * PAR).toFixed(2) + "px," + (dy * PAR).toFixed(2) + "px)"; }

  }

  // de a Courier Prime carregar, em coordenadas locais da folha (as transformações do grupo e da câmera zeradas na medida).
  // lista: [{ frase, t: [t0, t1] }] (o tempo distribuído pelas palavras, proporcional ao comprimento) ou [{ frase, tempos: [[a,b],…] }]
  var __medir = [], __medidoTudo = false;
  function grifosFolha(idFolha, lista) {
    var out = [];
    lista.forEach(function (it) {
      var ws = it.frase.split(/\s+/), tempos = it.tempos;
      if (!tempos) {

      }
      ws.forEach(function (w, i) { out.push({ frase: it.frase, iw: i, t0: tempos[i][0], t1: tempos[i][1], els: [] }); });
    });

    return out;
  }
  function medirGrifos() {
    if (!document.fonts || !document.fonts.check('400 86px "MarcaDoc"')) return false;
    var cam = E("cam"), tc = cam ? cam.style.transform : "";
    if (cam) cam.style.transform = "none";
    __medir.forEach(function (m) {
      if (m.feito) return;
      var folha = E(m.idFolha), corpo = E(m.idFolha + "Corpo"), g = E(m.idFolha + "Grifos"); if (!folha || !corpo || !g) return;
      var grupo = folha.closest(".grupoFolha") || folha, tg = grupo.style.transform, og = grupo.style.opacity;
      grupo.style.transform = "none"; grupo.style.opacity = "1";
      var node = corpo.firstChild, texto = node ? node.data.replace(/\n/g, " ") : "", fr = folha.getBoundingClientRect();
      m.itens.forEach(function (it) {
        var k = texto.indexOf(it.frase); if (k < 0) { window.__erroCena = "grifo não achado na folha " + m.idFolha + ": " + it.frase; return; }
        var ws = it.frase.split(/\s+/), off = 0; for (var i = 0; i < it.iw; i++) off += ws[i].length + 1;

  }

  var T = {

    saiCard: 8.517,                                         // o nome e o cargo saem 300 ms antes do levantar
    pousaCapa: 3.033, capaDur: 0.80, fitaCapa: 3.70,       // "They" (328,34 s): a capa pousa
