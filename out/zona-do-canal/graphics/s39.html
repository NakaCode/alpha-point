    · a peça que age é o rolo de papel que desenrola sobre a mesa: "Cabo/corrente: extremidades fixas, folga e curvatura coerentes" e

      papel fica PRESA (a faixa do cabeçalho não anda); o rolo ROLA SEM ESCORREGAR para baixo e deixa o papel deitado atrás dele;
    · o raio do rolo se conserva com o papel: π(R² − r²) = comprimento × espessura, então R(s) = √(R0² − (R0² − r²)·s/L) (r é o eixo, 14 px).
      Os dois rolos têm a mesma espessura de papel: o de ouro nasce mais fino (R0 33,4 px contra 60 px), na razão das contagens;
    · o rolo GIRA na proporção da distância que anda: "Uma relação v = ωR pertence ao rolamento sem escorregamento"
      (ilustracao/laboratorio/estudo-dinamica-objetos/ESTUDO.md:39); com R variável, θ(s) = ∫ds/R = (2/c)(R0 − R(s)); as geratrizes vistas de

    · os dois rolos recebem o mesmo empurrão de mesa e perdem velocidade à MESMA desaceleração constante (a resistência ao rolamento, declarada,

      = 0,416 s: a física vence (roupa §5). Parâmetros ILUSTRATIVOS (ESTUDO.md:13): 1.272 px em 0,8 s → a = 3.975 px/s²; nenhum dado do vídeo

    · um executor por transformação (ilustracao/habilidades/ilustracao-narrativa/SKILL.md:30; references/movimento-fisica.md:53): o papel
