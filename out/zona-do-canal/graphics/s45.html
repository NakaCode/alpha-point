/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.

  // Câmera: push-in contínuo + deriva senoidal. Nada congela.

    const imgs = [].slice.call(document.images).map((im) => im.complete ? 0
      : new Promise((r) => { im.addEventListener("load", r); im.addEventListener("error", r); }));
    // <image> de SVG não tem .complete: uma Image() com o mesmo endereço sai do cache e o decode()
    // diz quando está pronta — sem teto de relógio (o M11 do estúdio usava um).
    const svgs = [].slice.call(document.querySelectorAll("svg image")).map((el) => {
      const h = el.getAttribute("href") || el.getAttribute("xlink:href"); if (!h) return 0;

  var E = function (id) { return document.getElementById(id); };
  var lerp = function (a, b, p) { return a + (b - a) * p; };

  // o texto: entra em 300 ms (opacidade + 24 px de subida); sai em 300 ms (opacidade + 24 px para baixo)
  function texto(el, t, t0, tSai) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3)), q = tSai !== undefined ? eo(seg(t, tSai, 0.3)) : 0;
    el.style.opacity = (p * (1 - q)).toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * 24 + q * 24).toFixed(1) + "px)";
  }
  // o número que a voz diz: 300 ms, opacidade + 24 px e escala 1,04 → 1,00 (identidade §4.4)
  function numero(el, t, t0) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3));
    el.style.opacity = p.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * 24).toFixed(1) + "px) scale(" + lerp(1.04, 1.00, p).toFixed(4) + ")";
  }

  var DUR = 9.7;
  window.__duracao = DUR;

  // ═══ OS TEXTOS DE TELA (um lugar só; a grafia final é do redator-de-tela: textos-tela.json s45) ═══════════════
  var TEXTOS = {
    lugar:  "Balboa Commissary",                      // _textos_por_cena s45 › rotulo, t0 0 e t0 3,9 (nunca 'aerial')
    data:   "FROM 1939",                              // _textos_por_cena s45 › rotulo, t0 2,6 (em "nineteen thirty-nine"); fica no corte
    aviso1: "Photo from 1955",                        // _textos_por_cena s45 › aviso_ano, t0 0,7
    aviso2: "Photo from 1956",                        // _textos_por_cena s45 › aviso_ano, t0 4,05
    cred:   "Source: U.S.\u2013Panama treaty of 1936"   // _textos_por_cena s45 › credito, t0 2,6
  };
  // ═══════════════════════════════════════════════════════════════════════════════════════════════════════════
  ["lugar", "data", "aviso1", "aviso2", "cred"].forEach(function (k) { var e = E(k); if (e) e.textContent = TEXTOS[k]; });

  // os tempos (locais, −502,3), do words.json, da regência e dos textos de tela s45
  var T = { lugar: 0.15, aviso1: 0.70, aviso1Sai: 3.60, data: 2.60, cred: 2.60, corte: 3.90, aviso2: 4.05 };

  // o KEN BURNS COM DIREÇÃO (identidade §4.4): 1,00 → 1,12 em 6 s, linear, e a janela anda até 80 px rumo ao assunto (o conteúdo
  // anda no sentido contrário). Origem no centro do quadro. Plano 1: rumo à porta (o conteúdo +80 x, −2 y). Plano 2: rumo à marquise
  // da entrada (o conteúdo −40 x, −69 y).
  function kenBurns(el, tt, vx, vy) {
    if (!el) return;
    var p = clamp(tt / 6, 0, 1), s = 1 + 0.12 * p;
    el.style.transform = "translate(" + (vx * p).toFixed(2) + "px," + (vy * p).toFixed(2) + "px) scale(" + s.toFixed(5) + ")";
  }
  function cena(t) {
    t = t + 0.0005;
    var f1 = E("f1"), f2 = E("f2"), p2 = t >= T.corte;
    if (f1) f1.style.opacity = p2 ? "0" : "1";
    if (f2) f2.style.opacity = p2 ? "1" : "0";
    kenBurns(E("kb1"), Math.min(t, T.corte), 80, -2);
    kenBurns(E("kb2"), Math.max(0, t - T.corte), -40, -69);
    texto(E("lugar"), t, T.lugar);
    numero(E("data"), t, T.data);
    texto(E("aviso1"), t, T.aviso1, T.aviso1Sai);
    texto(E("aviso2"), t, T.aviso2);
    texto(E("cred"), t, T.cred);
  }

  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança: uma exceção mataria a captura
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);

})();
</script>
