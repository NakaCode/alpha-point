      g2.imageSmoothingEnabled = true; g2.imageSmoothingQuality = "low"; g2.drawImage(TL.x4, 0, 0, W * 4, H * 4, 0, 0, W * 2, H * 2);
      g.globalAlpha = op; g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "low";
      g.drawImage(TL.x2, 0, 0, W * 2, H * 2, x0, y0, W, H);
    }
    g.globalAlpha = 1;
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { try { pintarTextoLiso(); } catch (e) {} });

  // ── o ANEL (identidade §4.4), com o halo escuro do piloto (s03): 56 px, traço 10 px, dois pulsos 1 → 1,8 em 1,2 s ──
  function criarAnel(id, halo) {
    var g = svgEl("g", { id: id, "class": "anel", opacity: "0" }, E("ov"));
    [1, 2].forEach(function (k) {
      var gp = svgEl("g", { id: id + "Pulso" + k, opacity: "0" }, g);
      if (halo) svgEl("circle", { "class": "halo", cx: 0, cy: 0, r: 28, "stroke-width": 30 }, gp);
      svgEl("circle", { cx: 0, cy: 0, r: 28, "stroke-width": 10 }, gp);
    });
    if (halo) svgEl("circle", { "class": "halo", cx: 0, cy: 0, r: 28, "stroke-width": 30 }, g);
    svgEl("circle", { cx: 0, cy: 0, r: 28, "stroke-width": 10 }, g);
    return g;
  }
  function aplicarAnel(id, ll, t, entra, sai, pulsos) {
    var g = E(id); if (!g || !ll) return;
    var pa = map.project(ll);
    var v = eo(seg(t, entra, 0.3)) * (sai != null ? 1 - eio(seg(t, sai, 0.3)) : 1);
    g.setAttribute("transform", "translate(" + pa.x.toFixed(2) + " " + pa.y.toFixed(2) + ")");
    g.setAttribute("opacity", v.toFixed(3));
    (pulsos || [entra, entra + 1.4]).forEach(function (t0, k) {
      var u = (t - t0) / 1.2, c = E(id + "Pulso" + (k + 1));
      if (!c) return;
      var vivo = u >= 0 && u < 1;
      c.setAttribute("transform", "scale(" + (1 + 0.8 * (vivo ? u : 0)).toFixed(4) + ")");
      c.setAttribute("opacity", vivo ? (1 - u).toFixed(3) : "0");
    });
    return pa;
  }

  // ── a MINIATURA (Juneau s15, 5ª leva): logo abaixo da etiqueta, borda direita alinhada; a foto só encolhe ──
  function montarMini(M) {
    var el = E(M.id), jan = el && el.querySelector(".janela"), im = el && el.querySelector("img"), av = el && el.querySelector(".aviso");
    if (!el || !jan || !im) return falhar("a miniatura " + M.id + " não está no palco.");
    var esc = M.foto[0] / M.recorte[2];
    if (Math.abs(M.foto[1] / M.recorte[3] - esc) > 0.01) falhar("a miniatura " + M.id + " distorceria a foto (as escalas dos dois lados diferem).");
    if (esc > 1) falhar("a miniatura " + M.id + " ampliaria a foto (" + esc.toFixed(3) + "×): a foto só encolhe.");
    var w = M.foto[0] + 2 * M.borda, h = M.borda + M.foto[1] + M.margemBaixo;
    el.style.width = w + "px"; el.style.height = h + "px";
    jan.style.left = M.borda + "px"; jan.style.top = M.borda + "px"; jan.style.width = M.foto[0] + "px"; jan.style.height = M.foto[1] + "px";
    im.style.width = (M.natural[0] * esc) + "px"; im.style.height = (M.natural[1] * esc) + "px";
    im.style.left = (-M.recorte[0] * esc) + "px"; im.style.top = (-M.recorte[1] * esc) + "px";
    if (av) av.style.top = (M.borda + M.foto[1] + (M.margemBaixo - 84) / 2 + 4) + "px";
    M.w = w; M.h = h; M.escala = esc;
  }
  function aplicarMini(M, t) {
    var el = E(M.id), r = rotuloPorId(M.sob); if (!el || !r) return;
    var vin = eo(seg(t, M.entra, 0.3)), v = vin * (1 - eio(seg(t, M.sai, 0.3)));
    var pill = E(M.sob), pr = pill.getBoundingClientRect(), cr = E("palco").getBoundingClientRect(), k = cr.width / 3840 || 1;
    var direita = (pr.right - cr.left) / k, base = (pr.bottom - cr.top) / k - (1 - (r._v || 0)) * 0;
    el.style.opacity = v.toFixed(3); el.style.visibility = v > 0 ? "visible" : "hidden";
    el.style.transform = "translate(" + (direita - M.w).toFixed(3) + "px," + (base + M.vao + (1 - vin) * 24).toFixed(3) + "px)";
  }

  // ── a legenda das cores: um item por linha, cada um entra com a sua linha; a caixa cresce ──────────
  function aplicarLegenda(t) {
    var L = CENA.legenda, box = E("legenda"); if (!L || !box) return;
    var vsai = L.sai != null ? 1 - eio(seg(t, L.sai, 0.3)) : 1, alt = 32, algum = 0, n = 0;
    L.itens.forEach(function (it) {
      var el = E(it.id); if (!el) return;
      var vin = eo(seg(t, it.entra, 0.3)), vout = it.sai != null ? 1 - eio(seg(t, it.sai, 0.3)) : 1, v = vin * vout;
      el.style.opacity = v.toFixed(3); el.style.display = v > 0 ? "flex" : "none";
      if (v > 0) { alt += (n ? 12 : 0) + 101; n++; algum = Math.max(algum, v); }
    });
    box.style.height = alt + "px";
    box.style.opacity = (algum * vsai).toFixed(3);
    box.style.visibility = algum * vsai > 0 ? "visible" : "hidden";
  }

  // ── os créditos: o da MapTiler inteiro desde o primeiro quadro de mapa; as linhas de fonte, empilhadas acima,
  //    entram em 300 ms com o asset ou o número e saem com ele ───────────────────────────────────────
  function aplicarCreditos(t) {
    var c = E("credito");
    if (c) { var vm = t >= (CENA.creditos.mapaDesde || 0) ? 1 : 0; c.style.opacity = vm; c.style.visibility = vm ? "visible" : "hidden"; }
    (CENA.creditos.extra || []).forEach(function (x) {
      var el = E(x.id); if (!el) return;
      var v = eo(seg(t, x.entra, 0.3)) * (x.sai != null ? 1 - eio(seg(t, x.sai, 0.3)) : 1);
      el.style.opacity = v.toFixed(3); el.style.visibility = v > 0 ? "visible" : "hidden";
    });
  }

  function aplicar(t) {
    if (!mapaCarregado) return;
    map.jumpTo(cameraAt(t));
    aplicarCena(t);
    aplicarRotulos(t);
    (CENA.minis || []).forEach(function (M) { aplicarMini(M, t); });
    aplicarLegenda(t);
    aplicarCreditos(t);
    pintarTextoLiso();
  }
  (CENA.minis || []).forEach(montarMini);
  if (window.__erroCena) return;

  window.__renderAt = function (t) {
    var tt = cl(+t || 0, 0, DUR), extra = null;
    try { aplicar(tt); if (typeof depoisDoQuadro === "function") extra = depoisDoQuadro(tt); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // NUNCA lança
    return extra && typeof extra.then === "function" ? extra.then(function () { return true; }, function () { return true; }) : undefined;
  };

  // pronto quando nenhum tile da base está carregando e os níveis à vista são no máximo dois, vizinhos (s42/s03)
  function nivelUnico() {
    try {
      if (map.getTerrain() || map.getPitch() > 1) return true;
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      var cache = sc.base; if (!cache) return true;
      var todos = cache._tiles || {};
      for (var k in todos) { var st = todos[k] && todos[k].state; if (st === "loading" || st === "reloading") return false; }
      var ids = cache.getRenderableIds ? cache.getRenderableIds() : Object.keys(todos);
      var zs = ids.map(function (id) { var x = todos[id]; return x && x.tileID && x.tileID.canonical ? x.tileID.canonical.z : null; })
        .filter(function (z) { return z !== null; });
      if (!zs.length) return false;
      return Math.max.apply(null, zs) - Math.min.apply(null, zs) <= 1;
    } catch (e) { return true; }
  }
  function tileComErro() {
    try {
      var sc = map.style.sourceCaches || map.style._sourceCaches || {};
      for (var id in sc) {
        var ts = (sc[id] && sc[id]._tiles) || {};
        for (var k in ts) if (ts[k] && ts[k].state === "errored") return id;
      }
    } catch (e) {}
    return null;
  }
  function barrarTileComErro() {
    var ruim = tileComErro();
    if (ruim && !window.__erroCena) falhar("a base '" + P.nome + "' (fonte '" + ruim + "') tem tile que não carregou (HTTP 404 ou resposta inválida). O quadro sairia com buraco.");
    return !!ruim;
  }
  var vigia = setInterval(function () { if (window.__erroCena || barrarTileComErro()) clearInterval(vigia); }, 250);
  window.__aguardarMapa = function (teto) {
    teto = teto || 90000;
    return new Promise(function (res) {
      var pronto = function () {
        try {
          if (!map.areTilesLoaded() || map.isMoving()) return false;
          // getSource antes de isSourceLoaded: este, numa fonte que ainda não existe (antes do load), dispara o evento de erro do
          // MapLibre ("There is no source with ID"), que a cena trata como erro (o medir-margens o achou na s05, 08/10)
          for (var i = 0; i < CENA.fontes.length; i++) if (!map.getSource(CENA.fontes[i]) || !map.isSourceLoaded(CENA.fontes[i])) return false;
          if (!map.getSource("base") || !map.isSourceLoaded("base")) return false;
          if (CENA.agua && (!map.getSource("aguaBase") || !map.isSourceLoaded("aguaBase"))) return false;
          return nivelUnico();
        } catch (e) { return false; }
      };
      var t0 = performance.now(), seguidas = 0, forcadas = 0, pintou = true;
      (function tick() {
        barrarTileComErro();
        var ok = pronto(), cheio = false;
        try { cheio = map.areTilesLoaded() && !map.isMoving(); } catch (e) {}
        if (!cheio) forcadas = 0;
        if (cheio && pintou && (forcadas < 2 || (!ok && forcadas < 6))) { forcadas++; pintou = false; map.once("render", function () { pintou = true; }); map.jumpTo({ center: map.getCenter() }); }
        if (forcadas < 2 || !pintou) ok = false;
        seguidas = ok ? seguidas + 1 : 0;
        if (window.__erroCena || seguidas >= 2) return res(true);
        if (performance.now() - t0 > teto) {
          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo; se repetir, confira a conexão.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});

})();
</script>
