  // o KEN BURNS COM DIREÇÃO (identidade §4.4): 1,00 → fim em 6 s, linear, e a janela anda até 80 px rumo ao assunto (o conteúdo anda
  // no sentido contrário). Origem no centro do quadro. P-11: rumo ao mastro (o conteúdo +50 x, +62 y). P-12: rumo à bandeira (+50 x, −62 y).
  function kenBurns(el, tt, fim, vx, vy) {
    if (!el) return;
    var p = clamp(tt / 6, 0, 1), s = 1 + (fim - 1) * p;
    el.style.transform = "translate(" + (vx * p).toFixed(2) + "px," + (vy * p).toFixed(2) + "px) scale(" + s.toFixed(5) + ")";
  }
  function cena(t) {
    t = t + 0.0005;
    var f1 = E("f1"), f2 = E("f2"), p2 = t >= T.corte;
    if (f1) f1.style.opacity = p2 ? "0" : "1";
    if (f2) f2.style.opacity = p2 ? "1" : "0";
    kenBurns(E("kb1"), Math.min(t, T.corte), 1.0303, 50, 62);
    kenBurns(E("kb2"), Math.max(0, t - T.corte), 1.0376, 50, -62);
    texto(E("lugar"), t, T.lugar, T.lugarSai);
    numero(E("data"), t, T.data);
  }
  window.__renderAt = function (t) {
    try { cena(clamp(+t || 0, 0, DUR)); }
    catch (e) { window.__errosRender = (window.__errosRender || 0) + 1; }   // nunca lança: uma exceção mataria a captura
  };
  window.__prepararCaptura = function () { window.__renderAt(0); };
  window.__fotosProntas = R.prontas();
  window.__renderAt(0);
})();
</script>
