/* RIG DE CENA DA RÉGIE — o kit que toda cena repete, num objeto só: window.RIG.

   HTML) muda quando o rig muda. Marca: <link rel="stylesheet" href="../../../marca/tokens.css">.
   Do estúdio mudou: (1) tudo em RIG (uma cena com o próprio `const seg` quebraria com "already
   been declared"); (2) câmera 4K, 6/4,8 px; (3) a prontidão espera as faces "Marca"/"MarcaSec" e

  const laco = (t, dur) => (dur > 0 ? ((t % dur) + dur) % dur : 0);         // clipe curto em laço, por t
  // Câmera: push-in contínuo + deriva senoidal. Nada congela.

  // PROSA e não se aplica; o que não serve vai para window.__avisos, em vez de sumir calado.

  // vai para window.__fontesFaltando, que o render lê e reprova.
  function prontas(familia) {

    if (!faces.length) falta.push(familia + ": nenhuma @font-face — o marca/tokens.css não carregou ou não foi ligado");
    const fontes = faces.map((f) => f.load().then(() => 0, () => { falta.push(f.family.replace(/["']/g, "") + " " + f.weight); }));
    return Promise.all(imgs.concat(svgs, fontes)).then(() => true);
  }

})();

<script>
(function () {

  function por(el, cx, cy, w, h, rot, s, op) {

  // o pouso da FOTO (identidade §4.4): desce 240 px em eo; escala 0,72 → 1,03 até 0,33 s e ASSENTA 1,03 → 1,00 até 0,55 s, uma vez
  function pousoFoto(t, t0, dur) {
    var p = eo(seg(t, t0, dur)), q1 = eo(seg(t, t0, 0.33)), q2 = eo(seg(t, t0 + 0.33, dur - 0.33));
    return { op: t >= t0 ? 1 : 0, dy: 240 * (1 - p), k: q2 > 0 ? lerp(1.03, 1.00, q2) : lerp(0.72, 1.03, q1), p: p };
  }
  // o pouso da FOLHA (identidade §4.4): desce `desce` px em 0,80 s (eo), girando de −1,5° ao repouso, e ASSENTA 1,03 → 1,00 em 0,56–0,80 s
  function pousoFolha(t, t0, dur, desce) {
    var p = eo(seg(t, t0, dur)), q2 = eo(seg(t, t0 + 0.56, dur - 0.56));

  }
  // a sombra solta: no ar +64 px / 1,05 / 0,35; assentada +12 px / 1,00 / 0,80 (tokens "A mão que arruma")
  function sombra(el, g, s, rot) {
    if (!el) return;

    por(el, g.cx, g.cy - s.dy + sy, g.w, g.h, rot, sk * (g.k || 1), so);
  }
  function objeto(idG, idS, g, s, rot) {
    var gs = g.hs ? { w: g.w, h: g.hs, cx: g.cx, cy: g.cy - (g.h - g.hs) / 2, k: g.k } : g;   // a sombra da folha rasgada acaba onde o rasgo começa
    sombra(E(idS), gs, s, rot);

  function texto(el, t, t0, tSai) {
    if (!el) return 0;
    var p = eo(seg(t, t0, 0.3)), q = tSai !== undefined ? eo(seg(t, tSai, 0.3)) : 0, op = p * (1 - q);
    el.style.opacity = op.toFixed(3);
    el.style.transform = "translateY(" + ((1 - p) * 24 + q * 24).toFixed(1) + "px)";
    return op;
  }
  // o número ou rótulo que a voz diz: 300 ms, opacidade + 24 px e escala 1,04 → 1,00 (identidade §4.4)
  function numero(el, t, t0, tSai) {
    if (!el) return;
    var p = eo(seg(t, t0, 0.3)), q = tSai !== undefined ? eo(seg(t, tSai, 0.3)) : 0;
    el.style.opacity = (p * (1 - q)).toFixed(3);

    data:  "JANUARY 1964",                               // rotulo, t0 0 → 0,15 (foto do próprio evento, sem aviso de ano)

    l2:    "24 PANAMANIANS KILLED",                      // cota, t0 4,3 ("Panamanians"); nunca "officially" nem soma
    l3:    "ACCORDING TO THE U.S. NATIONAL ARCHIVES",    // legenda, t0 6,767 ("National")
    l4:    "OTHER COUNTS DIFFER",                        // legenda, t0 8,767 ("differ.")

    pousaCartao: 1.88, pousaDur: 0.80,   // a pausa depois de "begun." (647,27 s): assentado em 2,68, 0,25 s antes de "soldiers" (declarado)
    l1: 2.933, cred1: 2.933, cred1Sai: 9.70,

    { t0: 0.50, t1: 2.10, s: 1.000, cx: 1920, cy: 1030 }    // sobe à foto ("rumo às bandeiras"); termina 0,83 s antes da 1ª linha do cartão
  ];

  var CA = {"w": 1340, "h": 1300, "cx": 2710.0, "cy": 1020.0, "rot": 0.8};        // o cartão: x 2040→3380, y 370→1670

    var c = camEstado(CAM, t);
