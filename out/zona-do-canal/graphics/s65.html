CANAL ALPHA POINT — ZONA DO CANAL (vídeo 3), CENA s65 (747,8 → 782,8 s do master; 35,0 s). SHOWPIECE.
  "So what made Balboa American, if being born there didn't? A treaty, which granted the United States "all the rights,
  power and authority" within a band ten miles wide. A law, which gave the Zone a governor and seated its juries with
  citizens of the United States. A second treaty, which let only those who worked or served there, and their families, live
  inside the line. And a payroll, which sorted the people who worked for the canal: first into "gold" and "silver," then
  into "U.S." rates and "local" rates. Being born there, by itself, was never enough."
  Mapista, lote M-f (tarefa zona-do-canal-arte-5), 15/10/2026: cena NOVA. Gerada por out/zona-do-canal/_tmp/arte-5/M-f/gerar.py
  sobre o corpo comum da s06 (lote M1); o HTML é autocontido. MAPA PLANO, sem relevo 3D (Lucas, 15/10/2026, 12:3x: "Plano, sem
  relevo (Recomendado)"). A voz ("only those who worked or served there") fica como está (Lucas, 15/10, 12:3x: "Ficam as
  duas (Recomendado)"); a tela diz 'WHO COULD LIVE INSIDE', nunca 'ONLY'.
  O que manda: textos-tela.json (s65) no QUE e na grafia; regencia.json (s65) no TEMPO e no exige; o conceito na direção; a
  marca (identidade §4–§7, tokens.css).

  O que a cena faz (quatro camadas sobre uma cidade; cada camada com o seu traço, e todas ficam):
    · b1 (0–4,1, a pergunta de novo): o QUADRO DE BALBOA da s08 (o da s34 › B0), o anel em Balboa (dois pulsos) e a pílula
      'Balboa'; aproximação lenta. O anel e a pílula ficam a cena toda (a câmera volta e para em Balboa).
    · b2 (4,1–11,1, 'A treaty … a band ten miles wide'): a câmera abre em 2,3 s (4,1–6,4) até o lado do Pacífico da Zona
      (zoom 11.85), onde a faixa cabe na largura, e segue aproximando devagar; em 'treaty,' (4,26) a CAMADA 1, a faixa do
      Art. II (faixa-art2-5mi-mar3mn: a MESMA da s11, o esquema de 5 milhas de cada lado do eixo do OSM, até 3 milhas náuticas
      no mar) em --destaque a 50 %, com as bordas TRACEJADAS; a etiqueta 'A TREATY · 1903 · 10 MILES WIDE' no alto à direita.
    · b3 (11,1–16,667, 'A law …'): a CAMADA 2, o contorno de 1947 (zona-do-canal-1947) preenchido em --destaque a 85 %, contorno
      --tinta 6 px sobre --rotulo 14 px; a etiqueta 'A LAW · 1912 · A GOVERNOR · JURIES OF U.S. CITIZENS' (menor que o palco,
      no mesmo lugar, trocando a do tratado) e a legenda 'Canal Zone (1947 map)' embaixo à esquerda até o fim. As bordas
      tracejadas da faixa ficam por cima do preenchimento: a camada 1 continua à vista. Sem close de Colón.
    · b4 (16,667–22,9, 'A second treaty … live inside the line'): a câmera volta a Balboa em 2,3 s (zoom 12.7); a CAMADA 3, a
      linha (linha-1914-panama, sem ano) em --destaque, 10 px sobre 22 px de --rotulo (a série), se desenha do mar para o norte
      em 1,0 s; para ela ler sobre o âmbar, os preenchimentos de baixo baixam (a Zona de 85 a 35 %, a faixa de 50 a 20 %) e as
      bordas ficam: as camadas continuam empilhadas. 'Panama City' do lado de fora da linha, sem polígono (pergunta 15, a
      resposta do Lucas), além da borda leste da faixa; a etiqueta 'A SECOND TREATY · 1936 · WHO COULD LIVE INSIDE'.
    · b5 (22,9–31,733, 'And a payroll …'): a CAMADA 4, o par Balboa / La Boca (pontos-osm-hoje › La Boca de hoje, a
      aproximação declarada da La Boca da época, como na s28) com a pílula 'La Boca' e a guia curta; em '"gold"' (27,033)
      '"gold"' sob 'Balboa' e '"silver"' sob 'La Boca'; em 'then' (28,633) a etiqueta 'THEN "U.S." RATES · "LOCAL" RATES', solta
      das cidades, no lugar das etiquetas (o '"gold"' e o '"silver"' ficam, presos aos lugares).
    · b6 (31,733–35,0, 'Being born there, by itself, was never enough.'): nada novo; as quatro camadas ficam; a câmera PARA
      (perna de desaceleração: sai na velocidade da anterior e chega a zero em 35,0; o giro também).
  DESVIOS DECLARADOS: (1) a câmera ABRE em 'A treaty' (o conceito pedia aproximação lenta nos beats 1–5): a faixa de 10 milhas
    (16 km) não cabe no quadro de Balboa (zoom 13,2, 31 km de largura e a borda leste no meio da tela), e a camada 1 só se lê
    na escala da Zona; daí em diante a câmera só aproxima. (2) a faixa é a faixa-art2-5mi-mar3mn (a da s11, desde a arte-3), não
    a faixa-art2-5mi que a regência nomeia: a camada é "a faixa de s11", e a da s11 é esta. (3) os preenchimentos de baixo
    baixam quando a linha chega (as bordas ficam), para a linha --destaque ler sobre o âmbar. (4) as quatro etiquetas trocam
    no mesmo lugar (uma no ar de cada vez): juntas seriam 4 cartões de 2 a 4 linhas a 128 px, e o quadro passaria de 6.
  ESCALA MÁXIMA: zoom 12.835 no fim (~12 m/px): a linha-1914 tem ±40–90 m (3 a 8 px), o contorno de 1947 ±150–250 m (12 a 21 px,
    da ordem do traço com o halo) e fica a até ~300 m da linha junto da cidade (a folha 1:100.000 de 1947 contra a 1:8.000 de
    1936): de perto, são as duas camadas, cada uma com o seu traço.
  ELEMENTOS (teto 6): b2 = anel+pílula de Balboa, faixa, etiqueta (3); b3 = + Zona (4); b4 = Balboa, faixa, Zona, linha,
    Panama City, etiqueta (6); b5 = Balboa (+"gold"), faixa, Zona, linha, La Boca (+"silver"), etiqueta 'THEN' (6). A legenda
    'Canal Zone (1947 map)' é aviso de data (a série), fora do teto; o crédito não conta.
  CRÉDITO: '© MapTiler © OpenStreetMap contributors' a 56 px (--fs-credito) a cena toda (data-qc-credito="mapa" só nele;
    cumpre o OSM da faixa, da linha-1914-panama, de pontos-osm-hoje e da água). As folhas de 1936 e 1947 vão na descrição.

          window.__esperasEsgotadas = (window.__esperasEsgotadas || 0) + 1;
          falhar("os tiles da base '" + P.nome + "' não terminaram de chegar em " + Math.round(teto / 1000) + " s. Renderize de novo; se repetir, confira a conexão.");
          return res(true);
        }
        setTimeout(tick, 30);
      })();
    });
  };

  var capturando = false, rafId = 0;
  var PREVIEW = window.__PREVIEW === true || location.hash === "#preview";
  window.__prepararCaptura = function () {
    capturando = true;
    if (rafId) cancelAnimationFrame(rafId);
    return window.__renderAt(0) || true;
  };
  window.__ready.then(function () {
    window.__renderAt(0);
    if (!PREVIEW || capturando) return;
    var t0 = performance.now();
    (function loop() {
      if (capturando) return;
      window.__renderAt(((performance.now() - t0) / 1000) % DUR);
      rafId = requestAnimationFrame(loop);
    })();
  }, function () {});

})();
</script>
