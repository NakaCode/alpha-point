<!DOCTYPE html><html lang="pt-BR" data-render="4k-native"><head><meta charset="utf-8"><style>
/* s90 · A RESPOSTA É UM HÁBITO, NÃO UMA OBRA — M24 pergunta-retórica · inSec 1461.88 · dur 18.32
   Metáfora: A RESPOSTA QUE NÃO É MONUMENTO — as grandes obras do vídeo (moinho, bomba,
   Afsluitdijk, Maeslantkering) desfilam e DESBOTAM; o que permanece nítido é o gesto
   pequeno em loop — uma mão conferindo o dique, um calendário virando página — e um
   troféu que se DISSOLVE quando tentam pousá-lo na estante.
   Word-lock (−1461.88): 0.4 pergunta COMO NÃO AFUNDAM? · 3.86 "afundam?" pulso ·
   4.64–4.70 "A resposta" → pergunta sai, o desfile de obras ENTRA · 5.94–6.32 "obra de
   engenharia" → as obras DESBOTAM · 7.32–7.54 "é um hábito" → gesto em loop nítido +
   texto UM HÁBITO. · 9.92–10.40 "maior dique" → Afsluitdijk reacende e apaga ·
   11.11–11.91 "barreira mais cara" → Maeslantkering reacende e apaga · 14.43 "nunca"
   → troféu desce pra estante · 16.35 "vitória" → brilho · 17.07 "definitiva" → o troféu
   se DISSOLVE em pó; o gesto segue em loop até o corte.
   Cor: NAVY vivo · ÂMBAR=o gesto humano · TEAL=água. SEM vermelho.
   Texto: 2 blocos (pergunta → tese), um se aposenta antes do outro. */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:3840px;height:2160px;overflow:hidden;background:#050F1C;}
#palco{position:relative;width:3840px;height:2160px;overflow:hidden;
  font-family:"Neue Haas Grotesk Display Pro","Helvetica Neue",Arial,sans-serif;}
#cam{position:absolute;inset:0;transform-origin:50% 54%;will-change:transform;}
#cam > svg{position:absolute;inset:0;width:3840px;height:2160px;}
#perg{position:absolute;left:0;top:300px;width:3840px;text-align:center;opacity:0;will-change:transform,opacity;}
#perg .tx{font-size:330px;font-weight:900;line-height:1.0;color:#F2F7FA;
  text-shadow:0 12px 70px rgba(3,12,24,.75);}
#perg .bar{width:640px;height:14px;border-radius:7px;margin:44px auto 0;
  background:linear-gradient(90deg,#3EC8FF,#FFB13D);}
#tese{position:absolute;left:0;top:330px;width:3840px;text-align:center;opacity:0;will-change:transform,opacity;}
#tese .tx{font-size:340px;font-weight:900;line-height:1.0;color:#FFB13D;
  text-shadow:0 12px 70px rgba(3,12,24,.75);}
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 520px 150px rgba(2,8,16,.42);}
#grain{position:absolute;inset:0;opacity:.13;mix-blend-mode:overlay;pointer-events:none;}
#intro{position:absolute;inset:0;background:#050F1C;pointer-events:none;}
</style></head><body><div id="palco">
<div id="cam"><svg viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2138"/><stop offset=".65" stop-color="#071A2E"/><stop offset="1" stop-color="#050F1C"/>
    </linearGradient>
    <radialGradient id="lumi" cx=".5" cy=".38" r=".8">
      <stop offset="0" stop-color="#1E5E86" stop-opacity=".4"/><stop offset="1" stop-color="#1E5E86" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diqueG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4AE79"/><stop offset="1" stop-color="#6B5638"/>
    </linearGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#ceu)"/>
  <rect width="3840" height="2160" fill="url(#lumi)"/>
  <g id="nevoa" fill="#7FC8E8"></g>

  <!-- ============ O DESFILE DE OBRAS (desbota) ============ -->
  <g id="desfile">
    <!-- moinho -->
    <g id="obMoinho" transform="translate(620,1290)" opacity="0">
      <path d="M -110 0 L -70 -330 L 70 -330 L 110 0 Z" fill="#16405E" stroke="#7FC8E8" stroke-width="12"/>
      <circle cx="0" cy="-360" r="30" fill="#16405E" stroke="#7FC8E8" stroke-width="10"/>
      <g id="obMoinhoPas" stroke="#8FD8E4" stroke-width="16" stroke-linecap="round">
        <line x1="0" y1="-360" x2="0" y2="-580"/><line x1="0" y1="-360" x2="0" y2="-140"/>
        <line x1="0" y1="-360" x2="-220" y2="-360"/><line x1="0" y1="-360" x2="220" y2="-360"/>
      </g>
    </g>
    <!-- bomba (o pictograma do ato 1) -->
    <g id="obBomba" transform="translate(1480,980)" opacity="0">
      <circle r="130" fill="#16405E" stroke="#7FC8E8" stroke-width="14"/>
      <g id="obBombaPas" stroke="#8FD8E4" stroke-width="24" stroke-linecap="round">
        <line x1="0" y1="-92" x2="0" y2="-26"/><line x1="0" y1="26" x2="0" y2="92"/>
        <line x1="-92" y1="0" x2="-26" y2="0"/><line x1="26" y1="0" x2="92" y2="0"/>
      </g>
      <circle r="28" fill="#8FD8E4"/>
      <path d="M -76 130 L -76 176 M 76 130 L 76 176" stroke="#7FC8E8" stroke-width="20" stroke-linecap="round"/>
    </g>
    <!-- Afsluitdijk: muralha longa e baixa -->
    <g id="obDique" transform="translate(2400,1010)" opacity="0">
      <path d="M -430 60 Q 0 -30 430 60 L 430 110 L -430 110 Z" fill="url(#diqueG)" stroke="#E0892F" stroke-width="8"/>
      <path d="M -410 74 Q 0 -14 410 74" fill="none" stroke="#0A1D30" stroke-width="14" stroke-dasharray="46 34"/>
    </g>
    <!-- Maeslantkering: os dois braços em arco -->
    <g id="obMaes" transform="translate(3260,960)" opacity="0">
      <path d="M -260 120 Q -60 -60 120 -10" fill="none" stroke="#7FC8E8" stroke-width="26"/>
      <path d="M 260 120 Q 60 -60 -120 -10" fill="none" stroke="#7FC8E8" stroke-width="26"/>
      <circle cx="-260" cy="120" r="40" fill="#16405E" stroke="#7FC8E8" stroke-width="10"/>
      <circle cx="260" cy="120" r="40" fill="#16405E" stroke="#7FC8E8" stroke-width="10"/>
    </g>
  </g>

  <!-- ============ O GESTO (nítido, em loop) ============ -->
  <g id="gesto" opacity="0">
    <!-- o dique pequeno (talude) -->
    <g transform="translate(1560,1760)">
      <path d="M -560 0 L -260 -300 L 300 -300 L 560 0 Z" fill="url(#diqueG)" stroke="#E0892F" stroke-width="9"/>
      <path d="M -240 -286 L 280 -286" stroke="#0A1D30" stroke-width="12" stroke-dasharray="40 30" fill="none"/>
      <!-- pedras que a mão confere -->
      <g id="pedras" fill="#A98F58" stroke="#6B5638" stroke-width="6">
        <ellipse cx="-120" cy="-120" rx="52" ry="36"/>
        <ellipse cx="-10" cy="-150" rx="46" ry="32"/>
        <ellipse cx="90" cy="-110" rx="50" ry="34"/>
      </g>
      <circle id="anelCheck" r="0" fill="none" stroke="#FFB13D" stroke-width="10" opacity="0"/>
    </g>
    <!-- a figura agachada conferindo -->
    <g id="figG" transform="translate(1250,1560)">
      <path d="M -60 200 L -60 90 Q -60 30 -6 16 L 40 6" fill="none" stroke="#2E6E96" stroke-width="34" stroke-linecap="round"/>
      <circle cx="70" cy="-40" r="52" fill="#16405E" stroke="#2E6E96" stroke-width="9"/>
      <g id="bracoG">
        <line x1="0" y1="0" x2="150" y2="86" stroke="#FFB13D" stroke-width="30" stroke-linecap="round"/>
        <circle id="maoG" cx="150" cy="86" r="26" fill="#FFB13D"/>
      </g>
    </g>
    <!-- o calendário que vira -->
    <g id="calG" transform="translate(2450,1430)">
      <rect x="-190" y="-230" width="380" height="460" rx="26" fill="#0E2A44" stroke="#FFB13D" stroke-width="10"/>
      <rect x="-190" y="-230" width="380" height="96" rx="26" fill="#E0892F"/>
      <circle cx="-90" cy="-230" r="16" fill="#F2F7FA"/><circle cx="90" cy="-230" r="16" fill="#F2F7FA"/>
      <!-- riscos de "dias" -->
      <g stroke="#41586E" stroke-width="10" stroke-linecap="round">
        <line x1="-120" y1="-60" x2="120" y2="-60"/>
        <line x1="-120" y1="20" x2="120" y2="20"/>
        <line x1="-120" y1="100" x2="60" y2="100"/>
      </g>
      <!-- a página que se solta em loop -->
      <g id="pagina">
        <rect x="-190" y="-230" width="380" height="460" rx="26" fill="#16405E" stroke="#7FC8E8" stroke-width="8" opacity=".9"/>
      </g>
    </g>
  </g>

  <!-- ============ O TROFÉU que não pousa ============ -->
  <g id="trofeuG" opacity="0">
    <!-- a estante -->
    <g transform="translate(3050,1500)">
      <rect x="-330" y="0" width="660" height="26" rx="13" fill="#C4AE79"/>
      <path d="M -290 26 L -290 90 M 290 26 L 290 90" stroke="#6B5638" stroke-width="18"/>
    </g>
    <g id="trofeu" transform="translate(3050,900)">
      <path d="M -110 -150 L 110 -150 L 96 -40 Q 84 60 0 60 Q -84 60 -96 -40 Z" fill="#FFB13D" stroke="#E0892F" stroke-width="9"/>
      <path d="M -110 -130 Q -190 -120 -170 -50 Q -156 0 -92 -16 M 110 -130 Q 190 -120 170 -50 Q 156 0 92 -16"
        fill="none" stroke="#E0892F" stroke-width="12"/>
      <rect x="-30" y="60" width="60" height="50" fill="#E0892F"/>
      <rect x="-80" y="110" width="160" height="34" rx="10" fill="#C4AE79"/>
      <path id="gleam" d="M -40 -120 L -10 -120 L -60 20 L -90 20 Z" fill="#F2F7FA" opacity="0"/>
    </g>
    <g id="po" fill="#FFB13D"></g>
  </g>
</svg></div>

<div id="perg" class="lbl"><div class="tx">COMO NÃO<br>AFUNDAM?</div><div class="bar"></div></div>
<div id="tese" class="lbl"><div class="tx">UM HÁBITO.</div></div>
<div id="vig"></div>
<div id="grain"></div>
<div id="intro"></div>
</div>
<script>
var DUR=18.32; window.__duracao=DUR;
var E=function(id){return document.getElementById(id);};
function cl(v,a,b){return v<a?a:v>b?b:v;}
function seg(t,a,d){return cl((t-a)/d,0,1);}
function eo(p){p=cl(p,0,1);return 1-Math.pow(1-p,3);}
function eb(p){p=cl(p,0,1);return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;}
function h1(n){var x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
var NS='http://www.w3.org/2000/svg';

/* grão */
(function(){
  var c=document.createElement('canvas');c.width=256;c.height=256;
  var g=c.getContext('2d');var s=55511;
  function rnd(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
  var im=g.createImageData(256,256);
  for(var i=0;i<im.data.length;i+=4){var v=rnd()*255;im.data[i]=v;im.data[i+1]=v;im.data[i+2]=v;im.data[i+3]=34;}
  g.putImageData(im,0,0);
  var el=E('grain');if(el)el.style.backgroundImage='url('+c.toDataURL()+')';
})();

/* névoa que deriva (textura) */
var NEV=[];
(function(){
  var g=E('nevoa'); if(!g)return;
  for(var i=0;i<16;i++){
    var e=document.createElementNS(NS,'circle');
    e.setAttribute('r',(3+h1(i)*7).toFixed(1)); e.setAttribute('opacity','0');
    g.appendChild(e); NEV.push({el:e,x:h1(i*7)*3840,y:200+h1(i*13)*1700,ph:h1(i*3)});
  }
})();

/* pó do troféu (partículas da dissolução) */
var PO=[];
(function(){
  var g=E('po'); if(!g)return;
  for(var i=0;i<16;i++){
    var e=document.createElementNS(NS,'circle');
    e.setAttribute('r',(6+h1(i*5)*9).toFixed(1)); e.setAttribute('opacity','0');
    g.appendChild(e); PO.push({el:e,ang:h1(i)*6.28,sp:60+h1(i*11)*220,ph:h1(i*3)});
  }
})();

/* opacidade de cada obra: entra no desfile, DESBOTA, reacende no seu word-lock */
function obraOp(t,tin,relumeT){
  var entra=eo(seg(t,tin,0.7));
  var desb=eb(seg(t,5.94,1.1));
  var base=entra*(1-0.86*desb);
  if(relumeT>0){
    var re=Math.sin(Math.PI*seg(t,relumeT,1.1));
    base=Math.max(base,entra*(0.16+0.64*re));
  }
  return base;
}

window.__renderAt=function(t){
  var cam=E('cam');
  if(cam){
    var z=1.05+0.006*t+0.05*eb(seg(t,7.32,1.4));
    cam.style.transform='scale('+z.toFixed(4)+') translate('+(6*Math.sin(t*0.26)).toFixed(1)+'px,'+(4*Math.sin(t*0.19)).toFixed(1)+'px)';
  }
  for(var i=0;i<NEV.length;i++){
    var n=NEV[i], p=((t*0.05+n.ph)%1);
    n.el.setAttribute('cx',((n.x+t*30+i*40)%3940-50).toFixed(0));
    n.el.setAttribute('cy',(n.y+40*Math.sin(t*0.5+i)).toFixed(0));
    n.el.setAttribute('opacity',(0.16*Math.sin(Math.PI*p)).toFixed(2));
  }

  /* PERGUNTA (0.4 → sai em "A resposta" 4.64) */
  var pg=E('perg');
  if(pg){
    var pp=eb(seg(t,0.4,0.8))*(1-eb(seg(t,4.64,0.7)));
    var puls=1+0.02*Math.sin(Math.PI*seg(t,3.86,0.5));
    pg.style.opacity=pp.toFixed(3);
    pg.style.transform='translateY('+((1-eb(seg(t,0.4,0.8)))*70).toFixed(1)+'px) scale('+puls.toFixed(3)+')';
  }
  /* TESE (7.54 → 17.3) */
  var te=E('tese');
  if(te){
    var tp=eb(seg(t,7.54,0.7))*(1-eb(seg(t,17.3,0.7)));
    te.style.opacity=tp.toFixed(3);
    te.style.transform='translateY('+((1-eb(seg(t,7.54,0.7)))*60).toFixed(1)+'px) scale('+(1+0.004*Math.sin(t*1.7)).toFixed(4)+')';
  }

  /* DESFILE: entram 4.7–5.6, desbotam 5.94; dique reacende 9.92, Maeslant 11.11 */
  var mo=E('obMoinho'); if(mo){mo.setAttribute('opacity',obraOp(t,4.70,0).toFixed(2));
    mo.setAttribute('transform','translate(620,'+(1290+40*(1-eo(seg(t,4.70,0.7)))).toFixed(0)+')');}
  var mp=E('obMoinhoPas'); if(mp) mp.setAttribute('transform','rotate('+(t*40)%360+' 0 -360)');
  var bo=E('obBomba'); if(bo){bo.setAttribute('opacity',obraOp(t,5.0,0).toFixed(2));
    bo.setAttribute('transform','translate(1480,'+(980+40*(1-eo(seg(t,5.0,0.7)))).toFixed(0)+')');}
  var bp=E('obBombaPas'); if(bp) bp.setAttribute('transform','rotate('+(t*90)%360+')');
  var dq=E('obDique'); if(dq){dq.setAttribute('opacity',obraOp(t,5.3,9.92).toFixed(2));
    dq.setAttribute('transform','translate(2400,'+(1010+40*(1-eo(seg(t,5.3,0.7)))).toFixed(0)+')');}
  var ms=E('obMaes'); if(ms){ms.setAttribute('opacity',obraOp(t,5.6,11.11).toFixed(2));
    ms.setAttribute('transform','translate(3260,'+(960+40*(1-eo(seg(t,5.6,0.7)))).toFixed(0)+')');}

  /* O GESTO em loop (7.32 →, nunca congela) */
  var ge=E('gesto');
  if(ge) ge.setAttribute('opacity',eo(seg(t,7.32,0.8)).toFixed(2));
  /* braço confere as 3 pedras em ciclo */
  var ciclo=(t*0.55)%1;                       /* ~1.8s por conferida */
  var alvo=Math.floor((t*0.55)%3);            /* pedra 0,1,2 */
  var px=[-120,-10,90][alvo]+1560-1250, py=[-120,-150,-110][alvo]+1760-1560;
  var swing=Math.sin(Math.PI*ciclo);
  var br=E('bracoG');
  if(br){
    var bx=150+(px-150)*0.6*swing, by=86+(py-86)*0.6*swing;
    br.setAttribute('transform','rotate('+(Math.atan2(by-0,bx-0)*57.3-30).toFixed(1)+' 0 0)');
  }
  var an=E('anelCheck');
  if(an){
    var ap=cl((ciclo-0.45)/0.5,0,1);
    an.setAttribute('cx',[-120,-10,90][alvo]); an.setAttribute('cy',[-120,-150,-110][alvo]);
    an.setAttribute('r',(20+70*eo(ap)).toFixed(0));
    an.setAttribute('opacity',(ap>0&&ap<1?(0.85*(1-ap)*eo(seg(t,7.32,0.8))):0).toFixed(2));
  }
  /* calendário: a página se solta a cada ~1.6s */
  var pgn=E('pagina');
  if(pgn){
    var pc=(t*0.62)%1;
    var fly=eo(cl((pc-0.55)/0.45,0,1));
    pgn.setAttribute('transform','translate('+(fly*260).toFixed(0)+','+(fly*-180).toFixed(0)+') rotate('+(fly*38).toFixed(1)+' 0 0)');
    pgn.setAttribute('opacity',(0.9*(1-fly)).toFixed(2));
  }

  /* TROFÉU: desce 14.43, brilha 16.35, dissolve 17.07 */
  var tg=E('trofeuG');
  var tin=eo(seg(t,14.43,0.8));
  if(tg) tg.setAttribute('opacity',tin.toFixed(2));
  var diss=eb(seg(t,17.07,0.85));
  var tr=E('trofeu');
  if(tr){
    var yy=900+390*eb(seg(t,14.43,1.9));      /* desce até quase pousar (1290 ≈ estante 1350) */
    tr.setAttribute('transform','translate(3050,'+(yy+8*Math.sin(t*2.2)).toFixed(0)+')');
    tr.setAttribute('opacity',(1-diss).toFixed(2));
  }
  var gl=E('gleam');
  if(gl){
    var gp=seg(t,16.35,0.6);
    gl.setAttribute('opacity',(gp>0&&gp<1?(0.85*Math.sin(Math.PI*gp)):0).toFixed(2));
    gl.setAttribute('transform','translate('+(gp*140-70).toFixed(0)+',0)');
  }
  for(var j=0;j<PO.length;j++){
    var po=PO[j];
    if(diss<=0){po.el.setAttribute('opacity','0');continue;}
    var d2=diss*(0.6+0.4*po.ph);
    po.el.setAttribute('cx',(3050+Math.cos(po.ang)*po.sp*d2).toFixed(0));
    po.el.setAttribute('cy',(1240+Math.sin(po.ang)*po.sp*d2*0.7-160*d2).toFixed(0));
    po.el.setAttribute('opacity',((1-d2)*0.9).toFixed(2));
  }

  var gr=E('grain');
  if(gr) gr.style.backgroundPosition=((t*41)%256).toFixed(1)+'px '+((t*29)%256).toFixed(1)+'px';
  var it=E('intro');
  if(it) it.style.opacity=(0.7*(1-eo(seg(t,0,0.35)))).toFixed(3);
};
window.__prepararCaptura=function(){window.__renderAt(0);};
window.__renderAt(0);
</script></body></html>
