<!doctype html><html lang="en-US"><head><meta charset="utf-8"><title>Alpha Point · miniatura do vídeo 2</title>
<!--
  A miniatura de "Why Is Los Angeles Shaped Like This?" (09/10/2026). Pedido do Lucas: "Ta bem ruim, tente você fazer uma thumb", no
  estilo das miniaturas de mapa de relevo que ele mandou, "mas com nosso identidade".
  - O mapa (relevo do USGS/SRTM e o contorno da cidade do Census, os dois em domínio público) sai de base-relevo.py, ao lado, em
    out/los-angeles/_tmp/miniatura/mapa.png. A seta aponta a faixa e o anel cerca o porto nos pontos que ele grava em mapa-pontos.json
    (faixa 1113,1027; porto 1138,1260).
  - Palco 2560 × 1440; envio em 1280 × 720. O canto de baixo à direita fica livre (a duração do YouTube).
  - Render: node marca/logo/_render.mjs roteiros/los-angeles/miniatura/miniatura.html 2560 1440 <saida.png>
-->
<style>
@font-face{font-family:"MarcaSec";src:url("../../../marca/fontes/barlowcondensed/BarlowCondensed-ExtraBold.ttf") format("truetype");font-weight:800;font-display:block}
:root{--fundo:#0E1726;--tinta:#F4F1EA;--destaque:#F5A524}
html,body{margin:0;width:2560px;height:1440px;overflow:hidden;background:var(--fundo)}
#palco{position:relative;width:2560px;height:1440px;background:url("../../../out/los-angeles/_tmp/miniatura/mapa.png") 0 0/2560px 1440px no-repeat}
#rotulo{position:absolute;top:96px;right:104px;background:var(--fundo);padding:34px 70px 44px;
  font-family:"MarcaSec";font-weight:800;text-transform:uppercase;line-height:.86;letter-spacing:.005em;
  box-shadow:0 14px 36px rgba(4,8,16,.55)}
#rotulo .l1{display:block;font-size:250px;color:var(--tinta)}
#rotulo .l2{display:block;font-size:360px;color:var(--destaque)}
svg{position:absolute;left:0;top:0}
</style></head><body><div id="palco">
<div id="rotulo"><span class="l1">For a</span><span class="l2">Port</span></div>
<svg width="2560" height="1440" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="9" stdDeviation="9" flood-color="#04080F" flood-opacity=".7"/>
    </filter>
  </defs>
  <!-- o anel no porto: --destaque sobre um contorno escuro, para se ler por cima do laranja da cidade -->
  <g filter="url(#sombra)">
    <circle cx="1138" cy="1250" r="118" fill="none" stroke="#0E1726" stroke-width="44"/>
    <circle cx="1138" cy="1250" r="118" fill="none" stroke="#F5A524" stroke-width="26"/>
  </g>
  <!-- a seta, à mão: da etiqueta até a faixa (ponta a ~55 px dela, sem cobrir o contorno) -->
  <g filter="url(#sombra)" fill="none" stroke="#F4F1EA" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 1835 860 C 1820 1036, 1550 1084, 1180 1024"/>
    <path d="M 1180 1024 L 1280 970 M 1180 1024 L 1274 1092"/>
  </g>
  <!-- a agulha, sem fundo, no canto de baixo à esquerda (simbolo.svg, 0,215×) -->
  <g filter="url(#sombra)" transform="translate(150 1196) scale(.215)">
    <polygon points="0,-560 171.78,-79.02 80.98,-59.72 0,-286.46 -94.28,-22.47 -200,0" fill="#F5A524"/>
    <polygon points="200,0 0,340 -155.55,75.57" fill="#F4F1EA"/>
  </g>
</svg>
</div></body></html>
