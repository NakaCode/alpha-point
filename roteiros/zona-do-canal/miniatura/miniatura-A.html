<!doctype html><html lang="en-US"><head><meta charset="utf-8"><title>Alpha Point · miniatura do vídeo 3 · versão A</title>
<!--
  Vídeo 3, "Why a Town Inside Panama Was AMERICAN Until 1979". Versão A (16/10/2026), no ângulo novo do canal
  (marca/embalagem.md §1.1), no estilo das referências "Gâmbia" (ISTO É UM PAÍS) e "Rússia x Europa": o Panamá em relevo, a
  Zona do Canal pintada de --destaque com contorno --tinta, a caixa escura com 3 palavras e duas setas curvas brancas.

  A base é real e vem de base-relevo-A.py (ao lado), em out/zona-do-canal/_tmp/miniatura/A-mapa.png:
  - o relevo e a costa: Terrain Tiles da AWS Open Data (SRTM/GMTED, domínio público);
  - a divisa do Panamá com a Costa Rica e a Colômbia: Natural Earth 10m (domínio público);
  - a Zona: o polígono da divisa da folha AMS 1947 (out/zona-do-canal/_media/geo/zona-do-canal-1947.json), não a faixa-esquema.
  Nada desenhado à mão nem por IA. As setas e a caixa são grafismo de marca, não geografia.

  O texto, "WASHINGTON RAN THIS", se paga no gancho do roteiro aprovado: "its police, courts and schools answered to
  Washington" (1º parágrafo; F002b CONFIRMADA) e "a band ten miles wide that the United States ran across Panama, from the
  Caribbean to the Pacific" (2º parágrafo). Não diz que o lugar "era a América" (a lei dizia o contrário: F072) nem fala do canal
  depois de 1979.

  Render: node marca/logo/_render.mjs roteiros/zona-do-canal/miniatura/miniatura-A.html 2560 1440 <saida.png>
-->
<style>
@font-face{font-family:"MarcaSec";src:url("../../../marca/fontes/barlowcondensed/BarlowCondensed-ExtraBold.ttf") format("truetype");font-weight:800;font-display:block}
:root{--fundo:#0E1726;--tinta:#F4F1EA;--destaque:#F5A524}
html,body{margin:0;width:2560px;height:1440px;overflow:hidden;background:var(--fundo)}
#palco{position:relative;width:2560px;height:1440px;background:url("../../../out/zona-do-canal/_tmp/miniatura/A-mapa.png") 0 0/2560px 1440px no-repeat}
.txt{position:absolute;font-family:"MarcaSec";font-weight:800;text-transform:uppercase;line-height:.84;letter-spacing:.005em}
svg{position:absolute;left:0;top:0}
#t{left:84px;top:64px;text-align:left;background:var(--fundo);padding:34px 52px 40px;box-shadow:0 14px 36px rgba(4,8,16,.6)}
#t .l1{display:block;font-size:212px;color:var(--tinta)}
#t .l2{display:block;font-size:300px;color:var(--tinta)}
#t .d{color:var(--destaque)}
</style></head><body><div id="palco">
<div id="t" class="txt"><span class="l1">Washington</span><span class="l2">ran <span class="d">this</span></span></div>
<svg width="2560" height="1440" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg">
  <defs><filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="5" dy="9" stdDeviation="9" flood-color="#04080F" flood-opacity=".75"/></filter></defs>
  <g id="setas" filter="url(#sombra)" fill="none" stroke="#F4F1EA" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"></g>
</svg>
</div>
<script>
// As setas: uma curva cúbica e a ponta alinhada à tangente do fim (calculada, não a olho). Os alvos são a borda da Zona,
// medida na base (A-mapa-pontos.json): o lado do Caribe, perto de Colón, e o lado do Pacífico, perto de Balboa.
const SETAS = [
  {p0:[1262,150], c1:[1500,90], c2:[1500,250], p1:[1448,412]},   // do "WASHINGTON" à ponta do Caribe (Colón)
  {p0:[880,612],  c1:[900,830],  c2:[1120,870], p1:[1262,730]},   // do "RAN THIS" ao lado oeste da Zona
];
const g = document.getElementById("setas"), NS = "http://www.w3.org/2000/svg", PONTA = 104, ABRE = 0.62;
for (const s of SETAS) {
  const c = document.createElementNS(NS, "path");
  c.setAttribute("d", `M ${s.p0} C ${s.c1} ${s.c2} ${s.p1}`);
  g.appendChild(c);
  const a = Math.atan2(s.p1[1] - s.c2[1], s.p1[0] - s.c2[0]);
  const b1 = [s.p1[0] - PONTA * Math.cos(a - ABRE), s.p1[1] - PONTA * Math.sin(a - ABRE)];
  const b2 = [s.p1[0] - PONTA * Math.cos(a + ABRE), s.p1[1] - PONTA * Math.sin(a + ABRE)];
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", `M ${b1} L ${s.p1} L ${b2}`);
  g.appendChild(p);
}
</script>
</body></html>
