  O PEDIDO DO LUCAS (16/10/2026, no chat):
  - sobre a B, a que ele gostou: "Juntar o pedaço solto (Recomendado)" (a parte do lago Madden, que na B aparece como uma ilha a

  DE ONDE VEM CADA COISA:
  - a base: base-B3.py (ao lado), em out/zona-do-canal/_tmp/miniatura/B3/B3-mapa.png. O quadro, o relevo dos Terrain Tiles da AWS
    (domínio público, só do cache, 0 pedidos de rede), as cores do relevo e do mar, o contorno --tinta, o filete --fundo e a sombra
    são os da B, sem mudança. A Zona é o polígono de 1947 (zona-do-canal-1947.json, a divisa da folha do Army Map Service, LOC
    83694755), recortado pela costa do relevo, pintado com a bandeira dos EUA da B, em vetor nas proporções oficiais (EO 10834),
    na mesma caixa e escala. Nada desenhado à mão nem por IA;
  - a Zona num pedaço só, por algoritmo (o detalhe e os números no cabeçalho da base-B3.py e em B3-pontos.json): o vão de ~164 m
    na represa de Madden, que o próprio traçado registra como não fechado, se fecha com o menor fechamento que junta as duas peças
    (raio de ~129 m; só fica o pedaço que encosta nas duas, ~0,07 km²); e a generalização da B (a abertura que tira os braços do
    Gatún mais finos que ~0,8 km) deixa de cortar o vale do Chagres abaixo da represa, que é o que ligava o Madden ao corpo (~6,7
    km² voltam). As pontas soltas que a abertura deixava como pontos (a ponta norte do Madden e três no corpo, ~9,6 km² ao todo)
    saem, como os braços finos;
  - o texto: "IN PERPETUITY", entre aspas, porque é citação do Art. II do tratado de 1903 ("granted the United States, 'in
    perpetuity,' a band ten miles wide", roteiro p1; e no p7, quando o tratado de 1977 o "terminates and supersedes"), numa linha
    só, PERPETUITY em --destaque, como na B.

  O QUE MUDOU DA B, NA PÁGINA:
  - o título passou de 340 a 373 px, o maior que cabe numa linha com a caixa da B (o mesmo --fundo, os mesmos 56 px de respiro dos

  - a caixa maior desceria até y ~429, a 15 px do contorno da Zona (que começa em y 444, na ponta de Colón). Para manter a folga da
    B (~42 px), o respiro de cima passou de 30 a 10 px e a caixa subiu de y 44 para 36. Na B, o respiro de cima se via maior que o
    de baixo (70 contra 49 px até as letras); agora os dois ficam iguais (~54 e ~49).
